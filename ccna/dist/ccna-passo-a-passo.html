/b>: um grupo (ex.: <code>0100.5Exx.xxxx</code> para IPv4 multicast).</li>\n</ul>\n<p>O campo <b>FCS</b> (CRC) permite ao recetor detetar tramas corrompidas, que são descartadas.</p>"},{"tipo":"texto","titulo":"ARP: de IP para MAC","html":"<p>Para enviar um pacote na LAN o PC precisa do MAC do destino (ou do gateway, se o destino estiver noutra rede). O <b>ARP</b> resolve isso:</p>\n<ol>\n<li>O PC envia um <b>ARP Request</b> em broadcast: “Quem tem 192.168.1.1? Diga a 192.168.1.20”.</li>\n<li>Só o dono desse IP responde com um <b>ARP Reply</b> em unicast com o seu MAC.</li>\n<li>O PC guarda a resposta na <b>cache ARP</b> durante alguns minutos.</li>\n</ol>"},{"tipo":"topologia","nos":[{"id":"pc","tipo":"pc","x":12,"y":55,"rotulo":"PC 192.168.1.20"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW1"},{"id":"gw","tipo":"router","x":88,"y":55,"rotulo":"GW 192.168.1.1"},{"id":"pc2","tipo":"pc","x":50,"y":12,"rotulo":"PC 192.168.1.30"}],"ligacoes":[{"a":"pc","b":"sw","rotulo":"ARP Request (broadcast)"},{"a":"sw","b":"gw","rotulo":""},{"a":"sw","b":"pc2","rotulo":""}],"legenda":"O pedido ARP chega a todos; só o gateway responde."},{"tipo":"saida","titulo":"Cache ARP num PC Windows (arp -a)","texto":"Interface: 192.168.1.20 --- 0xb\n  Endereço Internet     Endereço físico       Tipo\n  192.168.1.1           00-1a-2b-3c-4d-5e     dinâmico\n  192.168.1.255         ff-ff-ff-ff-ff-ff     estático","explica":"No router Cisco o equivalente é <code>show ip arp</code>."},{"tipo":"cli","titulo":"Ver ARP e MAC num equipamento Cisco","passos":[{"prompt":"R1#","cmd":"show ip arp","explica":"Tabela ARP do router."},{"prompt":"SW1#","cmd":"show mac address-table","explica":"Tabela de endereços MAC aprendidos pelo switch."},{"prompt":"SW1#","cmd":"show mac address-table dynamic interface g0/1","explica":"Filtra por porta."}],"nota":""},{"tipo":"dica","html":"Em IPv6 não há ARP: o mesmo papel é feito pelo <b>NDP</b> (Neighbor Solicitation / Neighbor Advertisement, em ICMPv6)."},{"tipo":"video","titulo":"ARP e endereços MAC","busca":"ARP protocolo explicado endereço MAC CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantos bits tem um endereço MAC?","opcoes":["32","48","64","128"],"correta":1,"explica":"48 bits = 6 bytes."},{"tipo":"mc","p":"O MAC de broadcast é…","opcoes":["0000.0000.0000","FFFF.FFFF.FFFF","0100.5E00.0001","FF00.0000.0000"],"correta":1,"explica":"Todos os bits a 1."},{"tipo":"mc","p":"O ARP Request é enviado em…","opcoes":["Unicast","Broadcast","Multicast","Anycast"],"correta":1,"explica":"Não se sabe o MAC do destino, logo vai para todos."},{"tipo":"cmd","p":"Que comando mostra a tabela de endereços MAC num switch Cisco?","respostas":["show mac address-table","sh mac address-table","show mac-address-table"],"explica":"show mac address-table (em IOS antigos: show mac-address-table)."},{"tipo":"vf","p":"Os primeiros 24 bits do MAC identificam o fabricante (OUI).","correta":true,"explica":"OUI = Organizationally Unique Identifier."}],"referencias":["ieee8023","rfc826","odom1","netacad_itn"]}],"prova_extra":[{"tipo":"mc","p":"Um PC envia um pacote para um servidor noutra rede. Qual o MAC de destino na trama que sai do PC?","opcoes":["MAC do servidor","MAC do gateway (router)","FFFF.FFFF.FFFF","MAC do switch"],"correta":1,"explica":"Fora da rede local, a trama vai para o gateway; o IP de destino continua a ser o do servidor."},{"tipo":"mc","p":"Qual o tamanho mínimo do cabeçalho TCP?","opcoes":["8 bytes","20 bytes","40 bytes","64 bytes"],"correta":1,"explica":"TCP 20 bytes; UDP 8 bytes."},{"tipo":"vf","p":"O FCS de uma trama Ethernet serve para corrigir os erros detetados.","correta":false,"explica":"Só deteta; tramas com erro são descartadas e cabe às camadas superiores (TCP) retransmitir."}]},{"id":"m3","numero":3,"titulo":"Endereçamento IPv4 e IPv6","descricao":"Binário, máscaras, sub-redes, VLSM e IPv6. A base de tudo o que vem a seguir.","dominio":"1.0 Network Fundamentals","icone":"calculadora","licoes":[{"id":"m3l0","titulo":"Comece por aqui: o que é um endereço IP?","minutos":14,"nivel":"básico","objetivos":["Explicar o que é um endereço IP com exemplos reais","Distinguir IP público e privado","Descobrir o IP do seu computador e telemóvel"],"blocos":[{"tipo":"texto","titulo":"A morada de cada equipamento","html":"<p>Um <b>endereço IP</b> (Internet Protocol) é o número que identifica um equipamento numa rede, tal como a morada identifica uma casa. Sem IP, os pacotes não sabem para onde ir.</p>\n<p>Um endereço IPv4 tem <b>quatro números separados por pontos</b>, cada um de 0 a 255. Exemplos:</p>\n<ul>\n<li><code>192.168.1.1</code> — normalmente o router de casa;</li>\n<li><code>192.168.1.23</code> — o seu telemóvel ligado ao Wi-Fi de casa;</li>\n<li><code>8.8.8.8</code> — um servidor de DNS público na Internet.</li>\n</ul>"},{"tipo":"exemplo","titulo":"Rua e número da porta","html":"<p>Num endereço como <code>192.168.1.23</code> com máscara <code>255.255.255.0</code>:</p>\n<ul>\n<li><code>192.168.1</code> é a <b>rede</b> — como o nome da <b>rua</b>. Todos os equipamentos da sua casa têm esta parte igual.</li>\n<li><code>23</code> é o <b>host</b> — como o <b>número da porta</b>. Cada equipamento tem um número diferente.</li>\n</ul>\n<p>A <b>máscara</b> é o que diz onde acaba a rua e começa o número da porta. Vai aprender a lê-la nas próximas aulas.</p>"},{"tipo":"topologia","nos":[{"id":"r","tipo":"router","x":50,"y":15,"rotulo":"Router 192.168.1.1"},{"id":"pc","tipo":"pc","x":15,"y":80,"rotulo":"PC 192.168.1.10"},{"id":"tel","tipo":"telefone_ip","x":50,"y":80,"rotulo":"Telemóvel 192.168.1.23"},{"id":"tv","tipo":"portatil","x":85,"y":80,"rotulo":"Smart TV 192.168.1.40"}],"ligacoes":[{"a":"r","b":"pc","rotulo":""},{"a":"r","b":"tel","rotulo":""},{"a":"r","b":"tv","rotulo":""}],"legenda":"Todos na mesma “rua” 192.168.1.x, cada um com o seu número."},{"tipo":"tabela","titulo":"Privado e público","cabecalho":["","IP privado","IP público"],"linhas":[["Onde se usa","Dentro de casa ou da empresa","Na Internet"],["Exemplos","192.168.x.x · 10.x.x.x · 172.16–31.x.x","Atribuído pelo operador, ex. 102.x.x.x"],["Repete-se?","Sim, milhões de casas usam 192.168.1.x","Não, é único no mundo"],["Quem dá","O router (DHCP)","O operador de Internet"]]},{"tipo":"texto","titulo":"Como os equipamentos recebem o IP","html":"<p>Quase sempre <b>automaticamente</b>: quando o telemóvel liga ao Wi-Fi, pede um IP ao router, que lho empresta por algum tempo. Este serviço chama-se <b>DHCP</b>. Servidores, impressoras e routers costumam ter IP <b>fixo</b> (estático), configurado à mão, para não mudar.</p>"},{"tipo":"tabela","titulo":"Descubra o seu","cabecalho":["Equipamento","Onde ver o IP"],"linhas":[["Windows","Prompt de Comando › ipconfig"],["macOS / Linux","Terminal › ifconfig ou ip addr"],["Android","Definições › Wi-Fi › rede ligada › Avançado"],["iPhone","Definições › Wi-Fi › (i) ao lado da rede"],["Router Cisco","show ip interface brief"]]},{"tipo":"dica","html":"Há duas versões: <b>IPv4</b> (ex. 192.168.1.23) e <b>IPv6</b> (ex. 2001:db8::23), criado porque os endereços IPv4 acabaram. Estuda os dois neste módulo."},{"tipo":"video","titulo":"O que é um endereço IP","busca":"o que é endereço IP explicado para iniciantes IP público privado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual destes é um endereço IPv4 válido?","opcoes":["192.168.1.300","192.168.1.30","192.168.1","192-168-1-30"],"correta":1,"explica":"Quatro números de 0 a 255 separados por pontos."},{"tipo":"mc","p":"O telemóvel tem 192.168.1.23 e o router 192.168.1.1. Que parte é igual (a “rua”)?","opcoes":["192.168.1","23","1",".1.23"],"correta":0,"explica":"Com máscara 255.255.255.0, os três primeiros números são a rede."},{"tipo":"vf","p":"O endereço 192.168.1.10 pode existir em milhares de casas diferentes.","correta":true,"explica":"É privado; repete-se em redes diferentes."},{"tipo":"mc","p":"Que serviço dá automaticamente um IP ao telemóvel quando liga ao Wi-Fi?","opcoes":["DNS","DHCP","HTTP","SSH"],"correta":1,"explica":"DHCP."}],"referencias":["rfc791","rfc1918","netacad_itn"]},{"id":"m3l1","titulo":"IPv4, binário e máscaras","minutos":18,"nivel":"básico","objetivos":["Converter entre decimal e binário","Separar a parte de rede e a parte de host com a máscara","Reconhecer endereços privados, loopback e APIPA"],"blocos":[{"tipo":"texto","titulo":"Um endereço IPv4","html":"<p>Um endereço IPv4 tem <b>32 bits</b>, escritos como 4 octetos em decimal: <code>192.168.10.25</code>. A <b>máscara</b> indica quantos bits pertencem à <b>rede</b>; os restantes identificam o <b>host</b>. <code>255.255.255.0</code> = <code>/24</code> (24 bits de rede, 8 de host).</p>"},{"tipo":"tabela","titulo":"Os pesos de cada bit num octeto","cabecalho":["Bit","128","64","32","16","8","4","2","1"],"linhas":[["192 =","1","1","0","0","0","0","0","0"],["168 =","1","0","1","0","1","0","0","0"],["10 =","0","0","0","0","1","0","1","0"],["255 =","1","1","1","1","1","1","1","1"]]},{"tipo":"exemplo","titulo":"Decimal → binário: 200","html":"<p>200 ≥ 128? sim → 1, resta 72. 72 ≥ 64? sim → 1, resta 8. 32? não → 0. 16? não → 0. 8? sim → 1, resta 0. O resto é 0.</p>\n<p>Resultado: <code>11001000</code>.</p>"},{"tipo":"tabela","titulo":"Máscaras comuns","cabecalho":["Máscara","Prefixo","Valores possíveis num octeto"],"linhas":[["255.0.0.0","/8","Os valores válidos de um octeto de máscara:"],["255.255.0.0","/16","0, 128, 192, 224, 240, 248, 252, 254, 255"],["255.255.255.0","/24",""],["255.255.255.252","/30","Ligações ponto a ponto (2 hosts)"]]},{"tipo":"tabela","titulo":"Endereços especiais","cabecalho":["Intervalo","Uso"],"linhas":[["10.0.0.0/8","Privado (RFC 1918)"],["172.16.0.0/12 (172.16 a 172.31)","Privado (RFC 1918)"],["192.168.0.0/16","Privado (RFC 1918)"],["127.0.0.0/8","Loopback (127.0.0.1 = a própria máquina)"],["169.254.0.0/16","APIPA — o PC não recebeu IP do DHCP"],["224.0.0.0/4","Multicast (antiga classe D)"]]},{"tipo":"tabela","titulo":"Classes (histórico, ainda aparece no exame)","cabecalho":["Classe","1.º octeto","Máscara por defeito"],"linhas":[["A","1–126","/8"],["B","128–191","/16"],["C","192–223","/24"],["D","224–239","Multicast"],["E","240–255","Experimental"]]},{"tipo":"dica","html":"Se um PC mostra <code>169.254.x.x</code>, o problema é <b>DHCP</b>: o cliente não obteve resposta de nenhum servidor."},{"tipo":"video","titulo":"Binário e endereçamento IPv4","busca":"endereçamento IPv4 binário máscara de rede aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quanto é 11000000 em decimal?","opcoes":["128","192","224","240"],"correta":1,"explica":"128 + 64 = 192."},{"tipo":"mc","p":"Qual destes é um endereço privado?","opcoes":["172.32.1.1","11.0.0.1","172.20.5.9","192.169.1.1"],"correta":2,"explica":"172.16.0.0 a 172.31.255.255 é privado; 172.32 já não."},{"tipo":"mc","p":"/26 corresponde a que máscara?","opcoes":["255.255.255.128","255.255.255.192","255.255.255.224","255.255.255.240"],"correta":1,"explica":"26 = 24 + 2 bits → 128+64 = 192."},{"tipo":"vf","p":"Um PC com IP 169.254.20.7 provavelmente não recebeu endereço do servidor DHCP.","correta":true,"explica":"É um endereço APIPA (link-local)."},{"tipo":"mc","p":"Quantos bits tem um endereço IPv4?","opcoes":["16","32","48","128"],"correta":1,"explica":"4 octetos × 8 bits."}],"referencias":["rfc791","rfc1918","odom1","netacad_itn"]},{"id":"m3l2","titulo":"Sub-redes (subnetting) sem medo","minutos":25,"nivel":"intermédio","objetivos":["Calcular endereço de rede, broadcast e intervalo de hosts","Determinar quantas sub-redes e hosts um prefixo dá","Usar o método do “número mágico”"],"blocos":[{"tipo":"texto","titulo":"As duas fórmulas","html":"<ul>\n<li><b>Hosts por sub-rede</b> = 2<sup>h</sup> − 2 (h = bits de host). Tiram-se 2: o endereço de <b>rede</b> e o de <b>broadcast</b>.</li>\n<li><b>Número de sub-redes</b> = 2<sup>s</sup> (s = bits emprestados ao host).</li>\n</ul>"},{"tipo":"tabela","titulo":"A tabela que vale ouro — decore-a","cabecalho":["Prefixo","Máscara","Bloco (nº mágico)","Hosts úteis"],"linhas":[["/24","255.255.255.0","256","254"],["/25","255.255.255.128","128","126"],["/26","255.255.255.192","64","62"],["/27","255.255.255.224","32","30"],["/28","255.255.255.240","16","14"],["/29","255.255.255.248","8","6"],["/30","255.255.255.252","4","2"],["/31","255.255.255.254","2","2 (ponto a ponto, RFC 3021)"],["/32","255.255.255.255","1","1 (rota de host / loopback)"]]},{"tipo":"exemplo","titulo":"Método do número mágico: 192.168.10.77/27","html":"<ol>\n<li>Octeto “interessante”: o 4.º (onde a máscara não é 255 nem 0). Máscara = 224.</li>\n<li>Número mágico = 256 − 224 = <b>32</b>. As redes andam de 32 em 32: 0, 32, 64, 96…</li>\n<li>77 está entre 64 e 96 → <b>Rede: 192.168.10.64</b>.</li>\n<li><b>Broadcast</b> = próxima rede − 1 = <b>192.168.10.95</b>.</li>\n<li><b>Hosts</b>: 192.168.10.65 a 192.168.10.94 (30 hosts).</li>\n</ol>"},{"tipo":"exemplo","titulo":"Dividir 192.168.1.0/24 em 4 sub-redes iguais","html":"<p>4 sub-redes → 2 bits emprestados (2² = 4) → /26, bloco 64:</p>\n<ul>\n<li>192.168.1.0/26 (hosts .1–.62, bc .63)</li>\n<li>192.168.1.64/26 (hosts .65–.126, bc .127)</li>\n<li>192.168.1.128/26 (hosts .129–.190, bc .191)</li>\n<li>192.168.1.192/26 (hosts .193–.254, bc .255)</li>\n</ul>"},{"tipo":"exemplo","titulo":"Quando o octeto interessante é o 3.º: 172.16.45.10/20","html":"<p>/20 → máscara 255.255.<b>240</b>.0. Mágico = 16 no 3.º octeto: 0, 16, 32, <b>48</b>… 45 está em 32–47.</p>\n<p>Rede <b>172.16.32.0</b>, broadcast <b>172.16.47.255</b>, hosts 172.16.32.1 a 172.16.47.254 (2<sup>12</sup> − 2 = 4094).</p>"},{"tipo":"dica","html":"Pratique todos os dias 10 minutos no <b>Desafio Sub-rede</b> (separador Jogar). No exame não há calculadora e a rapidez faz diferença."},{"tipo":"video","titulo":"Subnetting rápido","busca":"subnetting fácil método número mágico CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual o endereço de rede de 10.1.1.130/25?","opcoes":["10.1.1.0","10.1.1.128","10.1.1.129","10.1.1.255"],"correta":1,"explica":"Bloco 128: 0 e 128. 130 está na rede .128."},{"tipo":"mc","p":"Qual o broadcast de 192.168.5.40/29?","opcoes":["192.168.5.47","192.168.5.48","192.168.5.39","192.168.5.255"],"correta":0,"explica":"Bloco 8: 40–47. Broadcast .47."},{"tipo":"mc","p":"Quantos hosts úteis tem um /28?","opcoes":["16","14","30","12"],"correta":1,"explica":"2⁴ − 2 = 14."},{"tipo":"mc","p":"Precisa de 50 hosts por sub-rede. Qual o prefixo mais eficiente?","opcoes":["/25","/26","/27","/28"],"correta":1,"explica":"/26 dá 62 hosts; /27 só dá 30."},{"tipo":"vf","p":"192.168.1.63/26 é um endereço válido para um host.","correta":false,"explica":"É o broadcast da rede 192.168.1.0/26."},{"tipo":"mc","p":"Quantas sub-redes /27 cabem num /24?","opcoes":["4","6","8","16"],"correta":2,"explica":"3 bits emprestados → 2³ = 8."}],"referencias":["rfc950","rfc4632","odom1","lammle"]},{"id":"m3l3","titulo":"VLSM e sumarização","minutos":18,"nivel":"intermédio","objetivos":["Planear endereçamento com máscaras de tamanho variável","Evitar sobreposição de sub-redes","Sumarizar rotas"],"blocos":[{"tipo":"texto","titulo":"O que é VLSM","html":"<p><b>VLSM</b> (Variable Length Subnet Mask) permite usar máscaras diferentes dentro do mesmo bloco, dando a cada rede apenas o tamanho de que precisa. Regra de ouro: <b>atribuir primeiro as redes maiores</b>.</p>"},{"tipo":"exemplo","titulo":"Plano para 192.168.50.0/24","html":"<p>Necessidades: Vendas 100 hosts, TI 50, Gestão 20, 2 ligações WAN de 2 hosts.</p>\n<ol>\n<li>Vendas (100) → /25 (126) → <b>192.168.50.0/25</b> (.1–.126)</li>\n<li>TI (50) → /26 (62) → <b>192.168.50.128/26</b> (.129–.190)</li>\n<li>Gestão (20) → /27 (30) → <b>192.168.50.192/27</b> (.193–.222)</li>\n<li>WAN 1 → /30 → <b>192.168.50.224/30</b> (.225–.226)</li>\n<li>WAN 2 → /30 → <b>192.168.50.228/30</b> (.229–.230)</li>\n</ol>\n<p>Sobra 192.168.50.232 a .255 para crescer.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":30,"y":30,"rotulo":"R1"},{"id":"r2","tipo":"router","x":70,"y":30,"rotulo":"R2"},{"id":"v","tipo":"switch","x":12,"y":80,"rotulo":"Vendas /25"},{"id":"t","tipo":"switch","x":45,"y":80,"rotulo":"TI /26"},{"id":"g","tipo":"switch","x":85,"y":80,"rotulo":"Gestão /27"}],"ligacoes":[{"a":"r1","b":"r2","rotulo":"WAN /30"},{"a":"r1","b":"v","rotulo":""},{"a":"r1","b":"t","rotulo":""},{"a":"r2","b":"g","rotulo":""}],"legenda":"Cada rede recebe uma máscara à medida."},{"tipo":"texto","titulo":"Sumarização (supernetting)","html":"<p>Juntar várias redes contíguas numa só rota reduz o tamanho das tabelas. Escreva as redes em binário e conte os bits iguais à esquerda.</p>\n<p>Ex.: 172.16.0.0/24, 172.16.1.0/24, 172.16.2.0/24, 172.16.3.0/24 → o 3.º octeto vai de 000000<b>00</b> a 000000<b>11</b>: 22 bits iguais → <b>172.16.0.0/22</b>.</p>"},{"tipo":"alerta","html":"Sobreposição: 10.0.0.0/25 e 10.0.0.64/26 sobrepõem-se (.64 a .127 pertencem às duas). O IOS recusa configurar sub-redes sobrepostas em interfaces diferentes do mesmo router (<i>% ... overlaps with ...</i>)."},{"tipo":"video","titulo":"VLSM passo a passo","busca":"VLSM passo a passo exemplo CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Ao planear com VLSM, por onde começar?","opcoes":["Pelas redes menores","Pelas ligações WAN","Pelas redes maiores","Por ordem alfabética"],"correta":2,"explica":"Maiores primeiro evita fragmentar o espaço."},{"tipo":"mc","p":"Que prefixo é o ideal para uma ligação ponto a ponto entre dois routers (sem /31)?","opcoes":["/24","/29","/30","/32"],"correta":2,"explica":"/30 tem exatamente 2 hosts úteis."},{"tipo":"mc","p":"Sumarize 10.1.4.0/24, 10.1.5.0/24, 10.1.6.0/24 e 10.1.7.0/24.","opcoes":["10.1.4.0/22","10.1.0.0/21","10.1.4.0/23","10.1.4.0/21"],"correta":0,"explica":"4 a 7 = 000001xx → 22 bits iguais."},{"tipo":"vf","p":"192.168.1.0/26 e 192.168.1.32/27 sobrepõem-se.","correta":true,"explica":"/26 vai de .0 a .63, que inclui .32–.63."}],"referencias":["rfc4632","odom1","netacad_itn"]},{"id":"m3l4","titulo":"IPv6 essencial","minutos":22,"nivel":"intermédio","objetivos":["Abreviar e expandir endereços IPv6","Distinguir global unicast, link-local, unique local e multicast","Configurar IPv6 num router, incluindo EUI-64 e SLAAC"],"blocos":[{"tipo":"figura","nome":"cabecalho_ipv6","legenda":"Cabeçalho IPv6: 40 bytes fixos, mais simples que o IPv4 (sem checksum nem fragmentação nos routers)."},{"tipo":"texto","titulo":"Porquê IPv6","html":"<p>O IPv4 tem cerca de 4,3 mil milhões de endereços e esgotou-se. O IPv6 tem <b>128 bits</b> (3,4 × 10<sup>38</sup>), escritos em 8 grupos de 4 dígitos hexadecimais: <code>2001:0DB8:0000:0000:0000:0000:0000:0001</code>.</p>"},{"tipo":"exemplo","titulo":"Regras de abreviação","html":"<ol>\n<li>Retirar zeros à esquerda de cada grupo: <code>0DB8</code> → <code>DB8</code>, <code>0001</code> → <code>1</code>.</li>\n<li>Substituir <b>uma única</b> sequência de grupos só com zeros por <code>::</code>.</li>\n</ol>\n<p><code>2001:0DB8:0000:0000:0000:0000:0000:0001</code> → <b><code>2001:DB8::1</code></b></p>\n<p><code>FE80:0000:0000:0000:0212:34FF:FE56:7890</code> → <b><code>FE80::212:34FF:FE56:7890</code></b></p>"},{"tipo":"tabela","titulo":"Tipos de endereço IPv6 (não existe broadcast!)","cabecalho":["Tipo","Prefixo","Para que serve"],"linhas":[["Global unicast","2000::/3","Público, encaminhável na Internet"],["Unique local","FC00::/7 (na prática FD00::/8)","Privado, como o RFC 1918"],["Link-local","FE80::/10","Só na ligação local; todas as interfaces IPv6 têm um"],["Multicast","FF00::/8","Grupos (FF02::1 todos os nós, FF02::2 todos os routers)"],["Loopback","::1/128","A própria máquina"],["Não especificado","::/128","Sem endereço ainda"]]},{"tipo":"exemplo","titulo":"EUI-64: criar o ID de interface a partir do MAC 0012.34AB.CDEF","html":"<ol>\n<li>Dividir o MAC ao meio e inserir <code>FFFE</code>: 0012:34<b>FF:FE</b>AB:CDEF.</li>\n<li>Inverter o 7.º bit do 1.º byte: 00 = 0000 0000 → 0000 00<b>1</b>0 = 02.</li>\n<li>ID de interface: <code>0212:34FF:FEAB:CDEF</code>.</li>\n</ol>"},{"tipo":"cli","titulo":"IPv6 num router Cisco","passos":[{"prompt":"R1(config)#","cmd":"ipv6 unicast-routing","explica":"Ativa o encaminhamento IPv6 (desligado por defeito!)."},{"prompt":"R1(config)#","cmd":"interface g0/0","explica":"Entra na interface."},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:1::1/64","explica":"Endereço global estático."},{"prompt":"R1(config-if)#","cmd":"ipv6 address fe80::1 link-local","explica":"Link-local fácil de ler (opcional)."},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"Liga a interface."},{"prompt":"R1(config-if)#","cmd":"interface g0/1","explica":""},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:2::/64 eui-64","explica":"O router gera o ID de interface a partir do MAC."},{"prompt":"R1#","cmd":"show ipv6 interface brief","explica":"Verifica endereços e estado."},{"prompt":"R1(config)#","cmd":"ipv6 route ::/0 2001:db8:ffff::2","explica":"Rota por defeito IPv6."}],"nota":""},{"tipo":"texto","titulo":"Como os PCs obtêm IPv6","html":"<ul>\n<li><b>SLAAC</b>: o router envia <i>Router Advertisements</i> (RA) com o prefixo; o PC cria o próprio endereço.</li>\n<li><b>DHCPv6 stateless</b>: SLAAC para o endereço + DHCPv6 para DNS e outros dados.</li>\n<li><b>DHCPv6 stateful</b>: o servidor DHCPv6 atribui o endereço (o gateway continua a vir do RA).</li>\n</ul>\n<p>Para evitar duplicados, o host faz <b>DAD</b> (Duplicate Address Detection) com mensagens NDP.</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta SLAAC, DHCPv6 e EUI-64, mas algumas mensagens debug não existem.","Os PCs simulados não usam endereços temporários de privacidade."],"real":["Windows/macOS/Linux geram endereços aleatórios (privacidade, RFC 8981) em vez de EUI-64 — o endereço que vê no PC não bate com o MAC.","Em alguns switches é preciso ativar o modelo SDM para IPv6 antes de o configurar (ex.: Catalyst 2960: <code>sdm prefer dual-ipv4-and-ipv6 default</code> + reload)."]},{"tipo":"video","titulo":"IPv6 para CCNA","busca":"IPv6 explicado CCNA tipos de endereço SLAAC EUI-64","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual é a forma abreviada correta de 2001:0DB8:0000:0000:0000:00A0:0000:0001?","opcoes":["2001:DB8::A0::1","2001:DB8::A0:0:1","2001:DB8:0:0:0:A:0:1","2001:DB8::A:1"],"correta":1,"explica":"Só se pode usar :: uma vez, e não se tiram zeros à direita (00A0 → A0)."},{"tipo":"mc","p":"Que prefixo identifica endereços link-local?","opcoes":["2000::/3","FC00::/7","FE80::/10","FF00::/8"],"correta":2,"explica":"FE80::/10."},{"tipo":"vf","p":"O IPv6 usa broadcast para descobrir vizinhos.","correta":false,"explica":"IPv6 não tem broadcast; usa multicast (NDP)."},{"tipo":"cmd","p":"Que comando global ativa o encaminhamento IPv6 num router Cisco?","respostas":["ipv6 unicast-routing"],"explica":"Sem ele o router não encaminha pacotes IPv6 nem envia RAs."},{"tipo":"mc","p":"No EUI-64, que valor é inserido no meio do MAC?","opcoes":["FFFF","FFFE","FE80","0000"],"correta":1,"explica":"FFFE no meio e inverte-se o 7.º bit."}],"referencias":["rfc8200","rfc4291","rfc4861","rfc4862","odom1"]}],"prova_extra":[{"tipo":"mc","p":"Um host tem 172.16.18.200/21. Qual é o endereço de rede?","opcoes":["172.16.16.0","172.16.18.0","172.16.8.0","172.16.0.0"],"correta":0,"explica":"/21 → mágico 8 no 3.º octeto: 16–23. Rede 172.16.16.0."},{"tipo":"mc","p":"Qual o último host válido de 10.10.10.0/23?","opcoes":["10.10.10.254","10.10.11.254","10.10.11.255","10.10.12.254"],"correta":1,"explica":"/23 vai de 10.10.10.0 a 10.10.11.255; último host .11.254."},{"tipo":"mc","p":"Que endereço IPv6 é equivalente a um endereço privado RFC 1918?","opcoes":["Global unicast","Unique local","Link-local","Multicast"],"correta":1,"explica":"Unique local FC00::/7."},{"tipo":"vf","p":"Uma interface IPv6 pode ter vários endereços ao mesmo tempo.","correta":true,"explica":"No mínimo um link-local, mais globais/unique local."}]},{"id":"m4","numero":4,"titulo":"Primeiros passos no Cisco IOS","descricao":"A linha de comandos Cisco do zero: modos, configuração base, SSH, verificação e o que muda entre simulador e equipamento real.","dominio":"1.0 / 4.0 / 5.0","icone":"terminal","licoes":[{"id":"m4l0","titulo":"Comece por aqui: o que é o Cisco IOS e a linha de comandos","minutos":12,"nivel":"básico","objetivos":["Perceber o que é uma CLI","Instalar o Packet Tracer para praticar"],"blocos":[{"tipo":"texto","titulo":"Escrever em vez de clicar","html":"<p>No telemóvel usa ícones e botões: é uma <b>interface gráfica</b> (GUI). Os equipamentos de rede profissionais configuram-se sobretudo <b>escrevendo comandos</b> numa <b>linha de comandos</b> (CLI). Parece antiquado, mas é rápido, preciso, funciona por ligações lentas e permite copiar a mesma configuração para 100 equipamentos.</p>\n<p>O sistema operativo dos equipamentos Cisco chama-se <b>IOS</b>. Um comando é uma frase curta em inglês: <code>show ip interface brief</code> significa “mostra, de forma resumida, as interfaces e os seus IP”.</p>"},{"tipo":"exemplo","titulo":"Um primeiro olhar","html":"<pre><code>Router&gt; enable\nRouter# configure terminal\nRouter(config)# hostname LOJA-R1\nLOJA-R1(config)#</code></pre>\n<p>O texto antes do cursor (<code>Router&gt;</code>) é o <b>prompt</b>: mostra o nome do equipamento e em que “sala” está. Ao mudar o nome, o prompt muda logo.</p>"},{"tipo":"cli","titulo":"Instalar o Cisco Packet Tracer (gratuito)","passos":[{"prompt":"1","cmd":"Criar conta em netacad.com","explica":"Inscreva-se no curso gratuito “Getting Started with Cisco Packet Tracer”."},{"prompt":"2","cmd":"Descarregar o Packet Tracer","explica":"Disponível para Windows, Linux e macOS."},{"prompt":"3","cmd":"Instalar e entrar com a conta NetAcad","explica":""},{"prompt":"4","cmd":"Arrastar um router e clicar nele › separador CLI","explica":"Já pode escrever os primeiros comandos."}],"nota":"Enquanto não instala, use o <b>Laboratório CLI</b> desta app (separador Jogar)."},{"tipo":"dica","html":"Não tenha medo de errar: no simulador nada se estraga. Se escrever algo errado, o IOS mostra <code>% Invalid input</code> e aponta o erro com <code>^</code>."},{"tipo":"video","titulo":"Instalar Packet Tracer e primeiros comandos","busca":"instalar Cisco Packet Tracer primeiros comandos tutorial","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"O que é uma CLI?","opcoes":["Um tipo de cabo","Uma interface onde se escrevem comandos","Um antivírus","Uma placa de rede"],"correta":1,"explica":"Command Line Interface."},{"tipo":"mc","p":"Como se chama o sistema operativo dos equipamentos Cisco?","opcoes":["IOS","Windows Server","Android","Ubuntu"],"correta":0,"explica":"Cisco IOS."},{"tipo":"vf","p":"O Packet Tracer é gratuito para quem cria conta na Cisco Networking Academy.","correta":true,"explica":"Basta a conta NetAcad."}],"referencias":["cisco_pt","cisco_ios"]},{"id":"m4l1","titulo":"Modos da CLI e navegação","minutos":15,"nivel":"básico","objetivos":["Navegar entre os modos do IOS","Usar abreviações, ? e Tab","Perceber running-config e startup-config"],"blocos":[{"tipo":"texto","titulo":"Os modos","html":"<p>O prompt diz-lhe sempre em que modo está:</p>\n<ul>\n<li><code>R1&gt;</code> <b>EXEC de utilizador</b>: só comandos básicos de consulta.</li>\n<li><code>R1#</code> <b>EXEC privilegiado</b>: todos os <code>show</code>, <code>debug</code>, <code>copy</code>, <code>reload</code>.</li>\n<li><code>R1(config)#</code> <b>Configuração global</b>: alterações que afetam todo o equipamento.</li>\n<li><code>R1(config-if)#</code>, <code>(config-line)#</code>, <code>(config-router)#</code>, <code>(config-vlan)#</code>: <b>submodos</b>.</li>\n</ul>"},{"tipo":"cli","titulo":"Andar entre modos","passos":[{"prompt":"R1>","cmd":"enable","explica":"Sobe para EXEC privilegiado (abreviação: en)."},{"prompt":"R1#","cmd":"configure terminal","explica":"Entra em configuração global (conf t)."},{"prompt":"R1(config)#","cmd":"interface gigabitEthernet 0/0","explica":"Submodo de interface (int g0/0)."},{"prompt":"R1(config-if)#","cmd":"exit","explica":"Volta um nível."},{"prompt":"R1(config)#","cmd":"end","explica":"Volta direto ao modo privilegiado (ou Ctrl+Z)."},{"prompt":"R1#","cmd":"disable","explica":"Volta ao EXEC de utilizador."}],"nota":""},{"tipo":"tabela","titulo":"Atalhos que poupam tempo","cabecalho":["Atalho","Efeito"],"linhas":[["?","Lista comandos ou opções disponíveis"],["Tab","Completa o comando"],["Seta ↑ / Ctrl+P","Comando anterior (histórico)"],["Ctrl+A / Ctrl+E","Início / fim da linha"],["Ctrl+Shift+6","Interrompe ping/traceroute ou pesquisa DNS"],["Ctrl+Z","Sai para o modo privilegiado"],["do <comando>","Executa um comando EXEC dentro do modo de configuração"]]},{"tipo":"texto","titulo":"Onde fica a configuração","html":"<ul>\n<li><b>running-config</b>: a configuração ativa, em <b>RAM</b>. Perde-se ao desligar.</li>\n<li><b>startup-config</b>: guardada na <b>NVRAM</b>. É carregada no arranque.</li>\n</ul>\n<p>Para guardar: <code>copy running-config startup-config</code> (ou <code>write memory</code> / <code>wr</code>).</p>"},{"tipo":"alerta","html":"Escreveu um nome errado e o equipamento ficou parado a “Translating…”? Ele pensou que era um nome de host e tentou DNS. Use <b>Ctrl+Shift+6</b> e configure <code>no ip domain-lookup</code>."},{"tipo":"dica","html":"Experimente já no <b>Laboratório CLI</b> (separador Jogar): o terminal simulado aceita abreviações, <code>?</code> e <code>do</code>."},{"tipo":"video","titulo":"Cisco IOS CLI básico","busca":"Cisco IOS CLI modos de configuração básico aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que prompt indica o modo de configuração global?","opcoes":["R1>","R1#","R1(config)#","R1(config-if)#"],"correta":2,"explica":"(config)# = configuração global."},{"tipo":"cmd","p":"Que comando passa de R1> para R1#?","respostas":["enable","en","ena"],"explica":"enable (pode abreviar)."},{"tipo":"mc","p":"Onde fica a running-config?","opcoes":["NVRAM","RAM","Flash","ROM"],"correta":1,"explica":"RAM: perde-se se o equipamento reiniciar sem guardar."},{"tipo":"cmd","p":"Que comando guarda a configuração ativa no arranque?","respostas":["copy running-config startup-config","copy run start","write memory","wr","write","wr mem"],"explica":"copy running-config startup-config ou write memory."},{"tipo":"vf","p":"No modo de configuração pode usar 'do show ip interface brief'.","correta":true,"explica":"O prefixo do executa comandos EXEC."}],"referencias":["cisco_ios","odom1","netacad_itn"]},{"id":"m4l2","titulo":"Configuração base e acesso seguro (SSH)","minutos":20,"nivel":"básico","objetivos":["Fazer a configuração inicial de um router ou switch","Proteger o acesso com palavras-passe e utilizadores locais","Ativar SSH e desativar Telnet"],"blocos":[{"tipo":"cli","titulo":"Configuração inicial de um router","passos":[{"prompt":"Router>","cmd":"enable","explica":""},{"prompt":"Router#","cmd":"configure terminal","explica":""},{"prompt":"Router(config)#","cmd":"hostname R1","explica":"Dá nome ao equipamento: o prompt muda logo."},{"prompt":"R1(config)#","cmd":"no ip domain-lookup","explica":"Evita esperas quando se escreve um comando errado."},{"prompt":"R1(config)#","cmd":"enable secret Cisco#2026","explica":"Palavra-passe do modo privilegiado, guardada com hash."},{"prompt":"R1(config)#","cmd":"service password-encryption","explica":"Esconde (cifra fraca, tipo 7) as palavras-passe em texto simples."},{"prompt":"R1(config)#","cmd":"banner motd #Acesso restrito a pessoal autorizado#","explica":"Mensagem legal mostrada no login."},{"prompt":"R1(config)#","cmd":"line console 0","explica":"Configura a consola."},{"prompt":"R1(config-line)#","cmd":"password ConsolaSegura","explica":""},{"prompt":"R1(config-line)#","cmd":"login","explica":"Pede a palavra-passe da linha."},{"prompt":"R1(config-line)#","cmd":"logging synchronous","explica":"Mensagens de log não cortam o que está a escrever."},{"prompt":"R1(
