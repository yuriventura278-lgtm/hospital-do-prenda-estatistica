  --ok: #3ccb7a; --ok-soft: #0f2a1c; --warn: #f0b23a; --warn-soft: #2d230d; --bad: #f07070; --bad-soft: #321616;
  --led-off: #2a3946; --chassi: #2a3744; --slot: #3a4856; --plastico: #3b4b59; --porta: #121a21;
  --ico: #4b8df0; --ico-esc: #1e4fa8; --ico-claro: #8dbbff; --ecra: #12284f; --nuvem: #5d7286;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--f-mono); font-size: .88em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tab-num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ estrutura */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topo .titulo { flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 750; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca { display: flex; align-items: center; gap: 8px; }
.marca b { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; letter-spacing: .02em; }
.btn-icone { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.btn-icone svg { width: 20px; height: 20px; }
.xp-pilula { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; white-space: nowrap; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
main > * { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: .72rem; font-weight: 600; cursor: pointer; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* ------------------------------------------------------------ componentes */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.cartao.plano { box-shadow: none; }
.secao { display: grid; gap: 12px; }
.secao > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rotulo { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.suave { color: var(--muted); }
.peq { font-size: .88rem; }
.linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linha.entre { justify-content: space-between; }
.grelha-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 380px) { .grelha-2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bloco { width: 100%; }
.btn.peq { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.barra { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* LEDs de porta — assinatura visual do progresso */
.leds { display: flex; gap: 4px; flex-wrap: wrap; }
.led { width: 14px; height: 9px; border-radius: 2px; background: var(--led-off); }
.led.on { background: var(--led-on); box-shadow: 0 0 6px color-mix(in srgb, var(--led-on) 60%, transparent); }
.led.amb { background: var(--led-amb); animation: pisca 1.4s infinite; }
.led.exame { width: 22px; border: 1px solid var(--muted); }
@keyframes pisca { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .led.amb { animation: none; } * { transition: none !important; } }

.painel { background: var(--chassi); border-radius: 12px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); }
.painel .fila { display: grid; grid-template-columns: 2.6rem 1fr auto; gap: 10px; align-items: center; cursor: pointer; padding: 4px 6px; border-radius: 8px; background: none; border: 0; text-align: left; }
.painel .fila:hover { background: color-mix(in srgb, var(--surface) 35%, transparent); }
.painel .num { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.painel .pct { font-family: var(--f-mono); font-size: .75rem; color: var(--ink); }

/* hero / nível */
.nivel { display: grid; gap: 10px; background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, var(--ink)) 100%); color: var(--accent-ink); border-radius: 18px; padding: 18px; }
.nivel h1 { font-size: 1.55rem; }
.nivel .barra { background: color-mix(in srgb, var(--accent-ink) 22%, transparent); border: 0; }
.nivel .barra > i { background: var(--accent-ink); }
.nivel .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; font-weight: 600; opacity: .92; }

.acoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.acao { display: grid; gap: 6px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.acao svg { width: 28px; height: 28px; color: var(--accent); }
.acao b { font-family: var(--f-display); font-stretch: 85%; font-size: 1rem; }
.acao span { font-size: .8rem; color: var(--muted); }

/* listas de módulos e lições */
.lista { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.item[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.item .ico-caixa { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.item .meio { min-width: 0; display: grid; gap: 4px; }
.item .meio b { font-family: var(--f-display); font-stretch: 88%; font-size: 1.02rem; line-height: 1.2; }
.estado-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; font-weight: 800; }
.estado-ico.ok { background: var(--ok); color: #fff; }
.estado-ico.atual { background: var(--led-amb); color: #241a00; }
.estado-ico.bloq { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* ------------------------------------------------------------ lição */
.cab-licao { display: grid; gap: 10px; }
.objetivos { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.conteudo { display: grid; gap: 18px; }
.bloco { display: grid; gap: 10px; min-width: 0; }
.bloco h3 { display: flex; gap: 8px; align-items: center; }
.bloco .html { display: grid; gap: 10px; max-width: 68ch; }
.bloco .html ul, .bloco .html ol { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
.bloco .html pre { margin: 0; background: var(--term-bg); color: var(--term-fg); padding: 14px; border-radius: 10px; overflow-x: auto; font-size: .82rem; line-height: 1.5; }
.fig-caixa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; overflow-x: auto; }
.fig-caixa figcaption { font-size: .85rem; color: var(--muted); }
.fig { width: 100%; height: auto; display: block; min-width: 320px; }
.fig-ico { max-width: 160px; margin: 0 auto; }

.exemplo { border: 1px solid var(--line); border-left: 4px solid var(--d2); background: var(--surface); padding: 14px; border-radius: 10px; }
.dica, .alerta { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: 10px; }
.dica { background: var(--accent-soft); }
.alerta { background: var(--warn-soft); }
.dica svg, .alerta svg { width: 22px; height: 22px; }
.dica svg { color: var(--accent); }
.alerta svg { color: var(--warn); }

.tabela-caixa { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 12px; font-family: var(--f-mono); font-size: .84rem; overflow: hidden; }
.term .barra-term { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: color-mix(in srgb, var(--term-bg) 80%, #ffffff); color: var(--term-dim); font-size: .75rem; gap: 8px; }
.term .barra-term .pontos { display: flex; gap: 5px; }
.term .barra-term .pontos i { width: 9px; height: 9px; border-radius: 50%; background: var(--term-dim); }
.passos { list-style: none; margin: 0; padding: 6px 0; }
.passos li { padding: 8px 12px; display: grid; gap: 2px; border-bottom: 1px dashed color-mix(in srgb, var(--term-dim) 35%, transparent); }
.passos li:last-child { border-bottom: 0; }
.passos .cmdl { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.passos .pr { color: var(--term-prompt); }
.passos .cm { color: #ffffff; font-weight: 600; overflow-wrap: anywhere; }
.passos .ex { color: var(--term-dim); font-family: var(--f-body); font-size: .82rem; }
.btn-copiar { margin-left: auto; background: none; border: 1px solid color-mix(in srgb, var(--term-dim) 50%, transparent); color: var(--term-dim); border-radius: 6px; font-size: .7rem; padding: 2px 6px; cursor: pointer; font-family: var(--f-body); }
.term pre { margin: 0; padding: 12px; overflow-x: auto; white-space: pre; line-height: 1.45; }

.simreal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .simreal { grid-template-columns: 1fr; } }
.simreal > div { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.simreal .sim { background: var(--accent-soft); }
.simreal .real { background: var(--surface); border: 1px solid var(--line); }
.simreal ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .9rem; }

.video { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.video .play { width: 52px; height: 52px; border-radius: 12px; background: #d93025; display: grid; place-items: center; }
.video .play svg { width: 22px; height: 22px; color: #fff; }

.refs { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: .86rem; color: var(--muted); }
.refs li { overflow-wrap: anywhere; }

/* ------------------------------------------------------------ quiz */
.quiz-topo { display: grid; gap: 8px; }
.pergunta { font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
.opcoes { display: grid; gap: 10px; }
.opcao { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.opcao .letra { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: .85rem; }
.opcao.sel { border-color: var(--accent); }
.opcao.certa { border-color: var(--ok); background: var(--ok-soft); }
.opcao.errada { border-color: var(--bad); background: var(--bad-soft); }
.opcao:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.campo { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 1rem var(--f-body); }
.campo.mono { font-family: var(--f-mono); }
.campo:focus { border-color: var(--accent); outline: none; }

.resultado { text-align: center; display: grid; gap: 10px; justify-items: center; }
.resultado .grande { font-family: var(--f-display); font-stretch: 80%; font-size: 3.4rem; font-weight: 800; line-height: 1; }
.estrelas { display: flex; gap: 6px; }
.estrelas svg { width: 34px; height: 34px; }
.estrelas .on { color: var(--led-amb); }
.estrelas .off { color: var(--line); }
.temporizador { font-family: var(--f-mono); font-weight: 700; }

/* ------------------------------------------------------------ laboratório */
.lab-tarefas { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lab-tarefas li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: .9rem; }
.lab-tarefas .cx { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: #fff; margin-top: 2px; }
.lab-tarefas li.feita .cx { background: var(--ok); border-color: var(--ok); }
.lab-tarefas li.feita span { color: var(--muted); text-decoration: line-through; }
.lab-tarefas details { font-size: .8rem; color: var(--muted); }
.consola { height: 46vh; min-height: 260px; overflow-y: auto; padding: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
.consola .in { color: #ffffff; }
.consola .pr { color: var(--term-prompt); }
.consola .err { color: #ff9b9b; }
.entrada { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, var(--term-dim) 40%, transparent); }
.entrada label { color: var(--term-prompt); white-space: nowrap; }
.entrada input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: inherit; outline: none; padding: 6px 0; }
.teclas { display: flex; gap: 6px; padding: 8px 12px 12px; overflow-x: auto; }
.teclas button { flex: none; background: color-mix(in srgb, var(--term-bg) 70%, #ffffff); border: 0; color: var(--term-fg); border-radius: 8px; padding: 8px 12px; font: .8rem var(--f-mono); cursor: pointer; }

/* ------------------------------------------------------------ guia, ranking, perfil */
.abas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.abas button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--muted); }
.abas button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.peso { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.peso .barra { grid-column: 1 / -1; }
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ranking li { display: grid; grid-template-columns: 34px 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ranking li.eu { border-color: var(--accent); background: var(--accent-soft); }
.ranking .pos { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-align: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-family: var(--f-display); }
.medalhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.medalha { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .75rem; }
.medalha .m { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.medalha.ganha .m { background: var(--led-amb); color: #2a1c00; }
.medalha svg { width: 22px; height: 22px; }
.medalha:not(.ganha) { opacity: .6; }
.gloss dt { font-weight: 800; font-family: var(--f-display); font-stretch: 88%; }
.gloss dd { margin: 0 0 10px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.confirmar { border: 2px solid var(--bad); background: var(--bad-soft); }
textarea.campo { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; }
.vazio { text-align: center; padding: 24px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }

/* ------------------------------------------------------------ ícones e figuras SVG */
.ico { display: block; }
.i-corpo { fill: var(--ico); }
.i-corpo-esc { fill: var(--ico-esc); }
.i-topo { fill: var(--ico-claro); }
.i-seta { fill: #ffffff; }
.i-ecra { fill: var(--ecra); }
.i-led { fill: var(--led-on); }
.i-onda { stroke: var(--ico); stroke-width: 3.5; stroke-linecap: round; }
.i-nuvem { fill: var(--nuvem); }
.i-tijolo-base { fill: #6e2c1c; }
.i-tijolo { fill: #c9573a; }

.f-txt, .f-label { fill: var(--ink); font: 600 12px var(--f-body); }
.f-mini { fill: var(--muted); font: 10px var(--f-body); }
.f-txt-claro { fill: #ffffff; font: 700 12px var(--f-body); }
.f-mini-claro { fill: #ffffff; font: 600 9.5px var(--f-body); }
.f-tag-txt { fill: var(--accent); font: 800 11px var(--f-mono); }
.f-chassi { fill: var(--chassi); stroke: var(--line); }
.f-porta { fill: var(--porta); }
.f-porta-in { fill: var(--porta-in); }
.f-slot { fill: var(--slot); }
.f-btn { fill: var(--porta); }
.f-consola { fill: #6fb6e8; }
.f-led-on { fill: var(--led-on); }
.f-led-amb { fill: var(--led-amb); }
.f-led-off { fill: var(--led-off); }
.f-rj45 { fill: var(--plastico); stroke: var(--muted); stroke-width: 1; }
.f-pino { fill: #d4aa36; }
.f-capa { fill: #3c7bc6; }
.f-par1 { stroke: #f08a24; } .f-par2 { stroke: #2e9e4f; } .f-par3 { stroke: #2f6fd1; } .f-par4 { stroke: #7a4a2a; }
.f-tracejado { opacity: .45; }
.f-lc { fill: #24aec2; }
.f-ferrule { fill: #eeeeee; stroke: var(--muted); }
.f-fibra { stroke: #24aec2; stroke-width: 6; }
.f-sfp { fill: #b6c0ca; stroke: var(--muted); }
.f-nucleo { fill: #ffd25e; }
.f-consola-cabo { stroke: #6fb6e8; stroke-width: 8; stroke-linecap: round; }
.f-db9 { fill: #3c4752; }
.f-fio-bv { fill: #a8dcb6; } .f-fio-v { fill: #2e9e4f; } .f-fio-bl { fill: #f7c99a; } .f-fio-l { fill: #f08a24; }
.f-fio-az { fill: #2f6fd1; } .f-fio-baz { fill: #a9c4f0; } .f-fio-bc { fill: #d1b49c; } .f-fio-c { fill: #7a4a2a; }

code> (saída).</p>\n<p>O telemóvel, o portátil, a caixa multibanco (ATM), a consola de jogos, a televisão inteligente e até o router de casa são computadores.</p>"},{"tipo":"figura","nome":"computador_partes","legenda":"As peças principais de um computador e o caminho dos dados."},{"tipo":"tabela","titulo":"Hardware: as peças que se podem tocar","cabecalho":["Peça","O que faz","Comparação do dia a dia"],"linhas":[["Processador (CPU)","Executa as instruções e faz os cálculos","O cozinheiro que prepara a comida"],["Memória RAM","Guarda o que está a ser usado agora; apaga-se ao desligar","A bancada da cozinha: rápida, mas limpa-se no fim do dia"],["Armazenamento (SSD/HD)","Guarda ficheiros e programas de forma permanente","O armário da despensa"],["Placa de rede (NIC)","Liga o computador à rede, por cabo ou Wi-Fi","A porta da casa para a rua"],["Placa-mãe","Liga todas as peças entre si","A cozinha onde tudo acontece"],["Fonte de alimentação","Fornece energia","O gás/eletricidade do fogão"]]},{"tipo":"texto","titulo":"Software: as instruções","html":"<ul>\n<li><b>Sistema operativo</b> (SO): gere o hardware e as aplicações — Windows, Linux, macOS, Android, iOS. Nos equipamentos Cisco, o SO chama-se <b>IOS</b> (não confundir com o iOS do iPhone).</li>\n<li><b>Aplicações</b>: o browser, o WhatsApp, o Excel, os jogos.</li>\n<li><b>Firmware</b>: software gravado no próprio hardware, que arranca o equipamento.</li>\n</ul>"},{"tipo":"exemplo","titulo":"Um router também é um computador","html":"<p>Um router Cisco tem processador, memória RAM, memória <b>flash</b> (onde fica o sistema operativo IOS), <b>NVRAM</b> (onde fica a configuração guardada) e várias placas de rede (as portas). Não tem ecrã nem teclado: configura-se ligando um portátil ao cabo de consola ou por rede (SSH). Vai fazer isto no Módulo 4!</p>"},{"tipo":"tabela","titulo":"Tipos de computadores","cabecalho":["Tipo","Para quê","Exemplo"],"linhas":[["Pessoal (PC/portátil)","Uso individual","O computador de casa"], ar os primeiros comandos no Prompt do Windows"],"blocos":[{"tipo":"texto","titulo":"O sistema operativo é o gestor do computador","html":"<p>O <b>sistema operativo</b> (SO) é o primeiro programa que arranca e fica a trabalhar o tempo todo. Ele:</p>\n<ul>\n<li>gere o <b>processador</b> e a <b>memória</b>, repartindo-os entre as aplicações abertas;</li>\n<li>guarda e encontra os <b>ficheiros</b> no armazenamento;</li>\n<li>controla os <b>dispositivos</b> (teclado, ecrã, impressora) através de <b>drivers</b>;</li>\n<li>gere os <b>utilizadores</b>, palavras-passe e permissões;</li>\n<li>liga o computador à <b>rede</b>: é o SO que fala TCP/IP!</li>\n</ul>"},{"tipo":"tabela","titulo":"Sistemas operativos comuns","cabecalho":["Sistema operativo","Onde se usa"],"linhas":[["Windows","A maioria dos computadores de escritório"],["macOS","Computadores da Apple"],["Linux","Servidores, routers, supercomputadores, também em PCs"],["Android / iOS","Telemóveis e tablets"],["Cisco IOS / IOS-XE","Routers e switches Cisco"]]},{"tipo":"texto","titulo":"Ficheiros e pastas","html":"<p>Um <b>ficheiro</b> guarda um conteúdo (um texto, uma foto, um programa). As <b>pastas</b> organizam os ficheiros, como gavetas. O fim do nome, a <b>extensão</b>, indica o tipo: <code>.docx</code> (Word), <code>.pdf</code>, <code>.jpg</code> (imagem), <code>.mp4</code> (vídeo), <code>.exe</code> (programa no Windows), <code>.txt</code> (texto simples). Uma configuração de router guardada é normalmente um ficheiro <code>.txt</code>.</p>"},{"tipo":"tabela","titulo":"Duas formas de dar ordens ao computador","cabecalho":["","Interface gráfica (GUI)","Linha de comandos (CLI)"],"linhas":[["Como se usa","Janelas, ícones, rato, toque","Escrevendo comandos"],["Vantagem","Fácil de aprender","Rápida, precisa, automatizável"],["Exemplo","Explorador de Ficheiros","Prompt de Comando, PowerShell, terminal Linux, Cisco IOS"]]},{"tipo":"cli","titulo":"Primeiros comandos no Prompt do Windows","passos":[{"prompt":"C:\\>","cmd":"dir","explica":"Lista os ficheiros e pastas da pasta atual."},{"prompt":"C:\\>","cmd":"cd Documentos","explica":"Entra na pasta Documentos (cd = change directory)."},{"prompt":"C:\\>","cmd":"cd ..","explica":"Volta à pasta anterior."},{"prompt":"C:\\>","cmd":"ipconfig","explica":"Mostra o endereço IP do computador — vai usá-lo muitas vezes!"},{"prompt":"C:\\>","cmd":"ping 8.8.8.8","explica":"Testa se o computador chega a um servidor na Internet."}],"nota":"Abra-o escrevendo <b>cmd</b> na pesquisa do Windows. No Linux e macOS use a aplicação Terminal (<code>ls</code> em vez de <code>dir</code>)."},{"tipo":"texto","titulo":"Aplicações, atualizações e segurança","html":"<p>As <b>aplicações</b> correm por cima do sistema operativo: browser, e-mail, Office, WhatsApp. Manter o SO e as aplicações <b>atualizados</b> corrige falhas de segurança. Um <b>antivírus</b> protege contra programas maliciosos, e as <b>contas de utilizador</b> com palavra-passe impedem que qualquer pessoa use o computador.</p>"},{"tipo":"dica","html":"Um router é um computador com um sistema operativo próprio (o IOS) e quase só linha de comandos. Por isso treinar o Prompt do Windows já ajuda!"}],"quiz":[{"tipo":"mc","p":"Qual destas tarefas é do sistema operativo?","opcoes":["Escrever cartas","Gerir memória, ficheiros e dispositivos","Fazer café","Desenhar logótipos"],"correta":1,"explica":"O SO gere os recursos do computador."},{"tipo":"mc","p":"Que extensão indica um documento PDF?","opcoes":[".exe",".jpg",".pdf",".mp3"],"correta":2,"explica":".pdf."},{"tipo":"mc","p":"O programa que permite ao SO usar uma impressora chama-se…","opcoes":["Driver","Vírus","Pasta","Browser"],"correta":0,"explica":"Driver (controlador)."},{"tipo":"cmd","p":"Que comando do Windows mostra o endereço IP do computador?","respostas":["ipconfig","ipconfig /all"],"explica":"ipconfig."},{"tipo":"vf","p":"A linha de comandos permite automatizar tarefas mais facilmente do que a interface gráfica.","correta":true,"explica":"Coma "objetivos":["Explicar os problemas dos computadores isolados","Conhecer os meios de comunicação que antecederam as redes","Comparar comutação de circuitos e comutação de pacotes","Enumerar as vantagens de ligar computadores em rede"],"blocos":[{"tipo":"texto","titulo":"O tempo dos computadores isolados","html":"<p>Nos primeiros tempos, cada computador vivia sozinho. Para levar dados de um para outro era preciso gravá-los em <b>fita</b>, <b>cartões perfurados</b> ou, mais tarde, <b>disquetes</b>, e transportá-los à mão. Os técnicos chamavam-lhe, a brincar, <i>sneakernet</i> — a “rede de sapatilhas”.</p>\n<p>Isto trazia problemas sérios:</p>\n<ul>\n<li>informação <b>duplicada e desatualizada</b> em cada máquina;</li>\n<li><b>recursos caros</b> (impressoras, discos, computadores potentes) que não se podiam partilhar;</li>\n<li>comunicação <b>lenta</b>: dias ou semanas para enviar dados a outra cidade.</li>\n</ul>"},{"tipo":"tabela","titulo":"Antes das redes de computadores","cabecalho":["Época","Meio de comunicação","Ideia que deixou às redes"],"linhas":[["Década de 1840","Telégrafo (código Morse)","Transformar mensagens em sinais elétricos: pontos e traços"],["1876","Telefone","Uma rede mundial de cabos e centrais que liga qualquer pessoa"],["Anos 1950–60","Terminais ligados a um computador central (mainframe)","Várias pessoas a usar o mesmo computador à distância"],["Anos 1960","Modems","Computadores a “falar” pela linha telefónica"],["1969","ARPANET","Computadores de várias universidades ligados numa rede de pacotes"]]},{"tipo":"texto","titulo":"Circuitos ou pacotes?","html":"<p>A rede telefónica antiga usava <b>comutação de circuitos</b>: durante a chamada, um caminho inteiro fica reservado só para si, mesmo nos silêncios. Os computadores comunicam aos “arranques”: enviam muito de uma vez e depois nada. Reservar um caminho era um desperdício.</p>\n<p>A solução foi a <b>comutação de pacotes</b>: a mensagem é cortada em pequenos <b>pacotes</b>, cada um com a morada de destino, e todos partilham as mesmas ligações. Se um caminho falhar, os pacotes seguem por outro.</p>"},{"tipo":"tabela","titulo":"","cabecalho":["","Comutação de circuitos","Comutação de pacotes"],"linhas":[["Caminho","Reservado do início ao fim","Partilhado por todos"],["Aproveitamento","Desperdiça nos silêncios","Usa a ligação ao máximo"],["Se uma ligação falha","A chamada cai","Os pacotes procuram outro caminho"],["Exemplo","Telefone fixo antigo","Internet, redes de computadores"]]},{"tipo":"topologia","nos":[{"id":"a","tipo":"pc","x":8,"y":50,"rotulo":"Computador A"},{"id":"r1","tipo":"router","x":32,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":60,"y":15,"rotulo":"R2"},{"id":"r3","tipo":"router","x":60,"y":85,"rotulo":"R3"},{"id":"b","tipo":"servidor","x":92,"y":50,"rotulo":"Computador B"}],"ligacoes":[{"a":"a","b":"r1","rotulo":""},{"a":"r1","b":"r2","rotulo":"pacotes 1 e 3"},{"a":"r1","b":"r3","rotulo":"pacote 2"},{"a":"r2","b":"b","rotulo":""},{"a":"r3","b":"b","rotulo":""}],"legenda":"Comutação de pacotes: cada pacote pode seguir um caminho diferente e no destino a mensagem é montada de novo."},{"tipo":"tabela","titulo":"Porque ligamos computadores","cabecalho":["Vantagem","Exemplo"],"linhas":[["Partilhar recursos","Uma impressora para todo o escritório"],["Partilhar informação","O processo do doente aparece no consultório e na farmácia"],["Comunicar","E-mail, mensagens, videochamadas"],["Trabalhar em conjunto","Documentos editados por várias pessoas ao mesmo tempo"],["Aceder de longe","Ver as notas da escola ou a conta bancária a partir de casa"],["Segurança das cópias","Backups guardados noutro edifício"]]},{"tipo":"dica","html":"Sempre que ouvir “pacote” neste curso, lembre-se: é um pedaço da mensagem com a morada de destino escrita nele."}],"quiz":[{"tipo":"mc","p":"Antes das redes, como se levavam dados de um computador para outro?","opcoes":["Por Wi-Fi","Gravando em fita, cartões ou disquetes e levando à mão","Por e-mail","Pela cloud"],"cor as para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição."}]}],"segundos":248}},{"id":"m0l6","titulo":"A história das redes e da Internet","minutos":18,"nivel":"básico","objetivos":["Situar no tempo as grandes invenções da informática e das redes","Conhecer a ARPANET, o TCP/IP, a Ethernet e a Web","Perceber porque a Internet funciona como funciona hoje"],"blocos":[{"tipo":"texto","titulo":"Dos cálculos de guerra ao bolso de todos","html":"<p>Os primeiros computadores eletrónicos surgiram nos anos 1940 e ocupavam salas inteiras. O <b>ENIAC</b> (1945, EUA) pesava cerca de 27 toneladas. Nas décadas seguintes, o <b>transístor</b> e o <b>circuito integrado</b> tornaram os computadores mais pequenos, baratos e rápidos. Em 1981 o <b>IBM PC</b> levou o computador pessoal aos escritórios; em 2007 os smartphones puseram um computador ligado à Internet no bolso.</p>"},{"tipo":"figura","nome":"linha_tempo","legenda":"Linha do tempo das redes de computadores."},{"tipo":"tabela","titulo":"Marcos que vale a pena conhecer","cabecalho":["Ano","Acontecimento","Porque importa"],"linhas":[["1945","ENIAC, um dos primeiros computadores eletrónicos","Início da computação eletrónica"],["1961–64","Kleinrock e Baran estudam a comutação de pacotes","Dividir mensagens em pacotes que seguem caminhos diferentes"],["1969","ARPANET liga 4 universidades nos EUA; publicado o RFC 1","A avó da Internet; os RFC ainda hoje definem os protocolos"],["1971","Ray Tomlinson envia o primeiro e-mail em rede e usa o @","A primeira “aplicação de sucesso” das redes"],["1973","Bob Metcalfe cria a Ethernet na Xerox PARC","A tecnologia das redes locais (LAN) que usamos hoje"],["1974","Vint Cerf e Bob Kahn publicam o desenho do TCP","Regras para ligar redes diferentes: inter-net"],["1983","A ARPANET passa a usar TCP/IP; nasce o DNS","Data de nascimento técnica da Internet"],["1984","Fundação da Cisco Systems","Routers comerciais para ligar redes"],["1989–91","Tim Berners-Lee cria a World Wide Web no CERN","Páginas, links e browsers: a Internet para todos"],["1995","A Internet torna-se comercial","Empresas e operadoras levam a Internet às casas"],["1997","Primeira norma Wi-Fi (IEEE 802.11)","Redes sem fios"],["1998","Especificação do IPv6 (RFC 2460)","A resposta ao fim dos endereços IPv4"],["2007","Smartphones com Internet móvel","Milhares de milhões de novos dispositivos ligados"],["2011","A IANA distribui os últimos blocos IPv4","NAT e IPv6 tornam-se obrigatórios"],["2020","Novo exame CCNA 200-301 unificado","A certificação que este curso prepara"]]},{"tipo":"texto","titulo":"Porque foi desenhada assim","html":"<p>A ARPANET foi pensada para continuar a funcionar mesmo que partes da rede falhassem. Por isso:</p>\n<ul>\n<li>Não há um computador central que controla tudo: a rede é <b>distribuída</b>.</li>\n<li>A informação é dividida em <b>pacotes</b>, e cada pacote pode seguir um caminho diferente.</li>\n<li>Os protocolos são <b>abertos</b> (RFC), para que qualquer fabricante os possa implementar.</li>\n</ul>\n<p>Estas três ideias explicam quase tudo o que vai estudar: routers, protocolos de encaminhamento, TCP/IP e normas.</p>"},{"tipo":"exemplo","titulo":"A Internet hoje","html":"<p>Hoje a Internet liga milhares de milhões de dispositivos. É uma <b>rede de redes</b>: a rede da sua casa liga ao seu operador, que liga a outros operadores, a cabos submarinos de fibra ótica entre continentes e aos centros de dados das empresas. Ninguém é “dono” da Internet inteira; há organizações que coordenam as regras (IETF) e a distribuição de endereços (IANA e os registos regionais, como o AFRINIC em África).</p>"},{"tipo":"dica","html":"Não precisa de decorar datas para o exame CCNA. Mas conhecer a história ajuda a perceber <b>porque</b> as coisas são como são."}],"quiz":[{"tipo":"mc","p":"Como se chamava a rede que deu origem à Internet?","opcoes":["Ethernet","ARPANET","Wi-Fi","NSFNET"],"correta":1,"explica":"ARPANET, 1969."},{"t "],"linhas":[["bit (b)","0 ou 1","Velocidades: Mbit/s, Gbit/s"],["byte (B)","8 bits","Tamanho de ficheiros: MB, GB"],["kbit/s, Mbit/s, Gbit/s","mil, milhão, mil milhões de bits por segundo","Velocidade da Internet e das portas"],["KB, MB, GB, TB","Mil, milhão, mil milhões, bilião de bytes","Disco, fotos, vídeos"]]},{"tipo":"exemplo","titulo":"Quanto tempo demora a descarregar um filme?","html":"<p>Um filme de <b>1 GB</b> = 1000 MB = <b>8000 Mbit</b>. Com uma Internet de <b>100 Mbit/s</b>: 8000 ÷ 100 = <b>80 segundos</b> (na prática um pouco mais, por causa dos cabeçalhos e de outros utilizadores).</p>\n<p>Atenção: os operadores anunciam velocidades em <b>bits</b>; o computador mostra downloads em <b>bytes</b>. 100 Mbit/s ≈ 12,5 MB/s.</p>"},{"tipo":"dica","html":"Use a calculadora do Windows em modo <i>Programador</i> para conferir as conversões enquanto pratica."}],"quiz":[{"tipo":"mc","p":"Quantos bits tem um byte?","opcoes":["4","8","16","32"],"correta":1,"explica":"1 byte = 8 bits."},{"tipo":"mc","p":"Quanto é 00001010 em decimal?","opcoes":["8","10","12","20"],"correta":1,"explica":"8 + 2 = 10."},{"tipo":"mc","p":"Qual o maior valor que cabe em 8 bits?","opcoes":["128","200","255","256"],"correta":2,"explica":"11111111 = 255 (são 256 valores contando o 0)."},{"tipo":"mc","p":"Quanto vale F em hexadecimal?","opcoes":["10","14","15","16"],"correta":2,"explica":"A=10 … F=15."},{"tipo":"mc","p":"Uma Internet de 80 Mbit/s descarrega aproximadamente quantos MB por segundo?","opcoes":["80","10","640","8"],"correta":1,"explica":"80 ÷ 8 = 10 MB/s."}],"referencias":["tanenbaum_org","odom1","netacad_itn"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"Os números das redes: binário, hexadecimal e velocidades","falas":[{"t":"Os números das redes: binário, hexadecimal e velocidades","f":"Módulo 0. Aula: Os números das redes: binário, hexadecimal e velocidades."},{"t":"Nesta aula vai aprender a:","f":"Nesta aula vai aprender a:"},{"t":"Perceber porque os computadore e rádio (Wi-Fi).</li>\n</ul>\n<p>E há sempre <b>regras</b> combinadas, os <b>protocolos</b>, que definem como falar: formato das mensagens, endereços, ordem, tempos e o que fazer quando algo falha.</p>"},{"tipo":"topologia","nos":[{"id":"pc1","tipo":"pc","x":10,"y":30,"rotulo":"PC"},{"id":"pc2","tipo":"portatil","x":10,"y":75,"rotulo":"Portátil"},{"id":"sw","tipo":"switch","x":40,"y":52,"rotulo":"Switch"},{"id":"r","tipo":"router","x":68,"y":52,"rotulo":"Router"},{"id":"net","tipo":"nuvem","x":92,"y":52,"rotulo":"Internet"},{"id":"srv","tipo":"servidor","x":40,"y":10,"rotulo":"Servidor"}],"ligacoes":[{"a":"pc1","b":"sw","rotulo":""},{"a":"pc2","b":"sw","rotulo":""},{"a":"srv","b":"sw","rotulo":""},{"a":"sw","b":"r","rotulo":""},{"a":"r","b":"net","rotulo":"WAN"}],"legenda":"Uma pequena rede de escritório: hosts ligados a um switch (LAN) e um router que dá saída para a Internet (WAN)."},{"tipo":"texto","titulo":"Cliente e servidor","html":"<p>Um <b>servidor</b> é um host que oferece um serviço (páginas web, e-mail, ficheiros). Um <b>cliente</b> é quem pede esse serviço. O mesmo computador pode ser cliente e servidor ao mesmo tempo.</p>\n<p>Numa rede <b>peer-to-peer</b> (P2P) todos partilham diretamente uns com os outros, sem servidor dedicado. É simples para casa, mas difícil de gerir e proteger numa empresa.</p>"},{"tipo":"tabela","titulo":"Tipos de rede por alcance","cabecalho":["Tipo","Alcance","Exemplo"],"linhas":[["LAN","Um edifício ou piso","A rede do escritório ou da escola"],["WLAN","Igual à LAN, sem fios","O Wi-Fi da empresa"],["MAN","Uma cidade","Fibra que liga os campus de uma universidade"],["WAN","Países e continentes","Ligação entre a sede e as filiais"],["Internet","Mundial","A rede de redes que liga milhões de WANs e LANs"]]},{"tipo":"exemplo","titulo":"No dia a dia","html":"<p>Quando abre o YouTube no telemóvel em casa: o telemóvel (host) fala por Wi-Fi (meio) com o router doméstico (intermediário), que encaminha os pedidos para o operador (WAN) e daí pela Internet até aos servidores do YouTube. Dezenas de protocolos trabalham juntos: Wi-Fi, IP, TCP/QUIC, DNS, HTTPS.</p>"},{"tipo":"texto","titulo":"Características de uma boa rede","html":"<ul>\n<li><b>Tolerância a falhas</b>: caminhos redundantes para que uma avaria não pare tudo.</li>\n<li><b>Escalabilidade</b>: crescer sem refazer a rede.</li>\n<li><b>Qualidade de serviço (QoS)</b>: dar prioridade a voz e vídeo.</li>\n<li><b>Segurança</b>: confidencialidade, integridade e disponibilidade (a tríade CIA).</li>\n</ul>"},{"tipo":"dica","html":"No exame CCNA, “host” e “dispositivo final” querem dizer a mesma coisa. Switches e routers <b>não</b> são hosts."}],"quiz":[{"tipo":"mc","p":"Qual destes é um dispositivo intermediário?","opcoes":["Impressora de rede","Switch","Servidor web","Telemóvel"],"correta":1,"explica":"Switches, routers, APs e firewalls encaminham tráfego: são intermediários. Os outros são dispositivos finais."},{"tipo":"mc","p":"Uma rede que cobre apenas um edifício chama-se…","opcoes":["WAN","MAN","LAN","PAN"],"correta":2,"explica":"LAN = Local Area Network, uma rede local de alcance limitado (sala, piso, edifício)."},{"tipo":"vf","p":"Um computador pode ser cliente e servidor ao mesmo tempo.","correta":true,"explica":"Sim. Um PC pode partilhar uma pasta (servidor) enquanto navega na web (cliente)."},{"tipo":"mc","p":"O conjunto de regras que define como os dispositivos comunicam chama-se…","opcoes":["Topologia","Protocolo","Meio","Largura de banda"],"correta":1,"explica":"Protocolos definem formato, ordem e significado das mensagens."},{"tipo":"vf","p":"Fibra ótica, cobre e Wi-Fi são exemplos de meios de transmissão.","correta":true,"explica":"São os três grandes tipos de meio: elétrico (cobre), luz (fibra) e rádio (sem fios)."}],"referencias":["netacad_itn","kurose","tanenbaum","odom1"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"O que é uma rede de computadores","falas":[{"t":"O que é uma rede de computadores","f":"Módulo 1. Aula: itch multicamada (L3)</b> também consegue encaminhar entre redes IP, como um router — muito usado no núcleo das redes empresariais.</p>"},{"tipo":"figura","nome":"painel_router","legenda":"Traseira de um router de filial (estilo ISR): portas GigabitEthernet, slots para módulos WAN, consola RJ45, consola USB e AUX."},{"tipo":"texto","titulo":"Router","html":"<p>O <b>router</b> liga <b>redes diferentes</b> entre si (por exemplo a LAN à Internet) e escolhe o melhor caminho para cada pacote com base no endereço <b>IP</b> de destino e na <b>tabela de encaminhamento</b>. Trabalha na <b>camada 3</b> (rede).</p>"},{"tipo":"tabela","titulo":"Resumo dos equipamentos","cabecalho":["Equipamento","Camada OSI","Decide com base em","Símbolo"],"linhas":[["Hub (obsoleto)","1","Nada — repete para todas as portas","—"],["Switch","2","Endereço MAC","Quadrado com setas"],["Router","3","Endereço IP","Círculo com setas"],["Switch L3","2 e 3","MAC e IP","Quadrado com setas e círculo"],["Firewall","3 a 7","Regras e estado das ligações","Muro de tijolos"],["Access Point","1 e 2","Liga clientes Wi-Fi à rede com fios","Antena/ondas"]]},{"tipo":"topologia","nos":[{"id":"r","tipo":"router","x":15,"y":50,"rotulo":"Router"},{"id":"sw","tipo":"switch","x":38,"y":50,"rotulo":"Switch"},{"id":"l3","tipo":"switch_l3","x":62,"y":50,"rotulo":"Switch L3"},{"id":"fw","tipo":"firewall","x":85,"y":50,"rotulo":"Firewall"},{"id":"ap","tipo":"ap","x":38,"y":12,"rotulo":"AP"},{"id":"wlc","tipo":"wlc","x":62,"y":12,"rotulo":"WLC"}],"ligacoes":[],"legenda":"Os ícones usados nos diagramas de rede (e nesta app)."},{"tipo":"texto","titulo":"Access Point, WLC e firewall","html":"<ul>\n<li><b>Access Point (AP)</b>: liga clientes sem fios à rede cabeada. Pode ser <i>autónomo</i> (configurado um a um) ou <i>leve</i> (lightweight), gerido por um controlador.</li>\n<li><b>WLC (Wireless LAN Controller)</b>: gere centenas de APs de forma centralizada: SSIDs, segurança, canais e potência.</li>\n<li><b>Firewall</b>: filtra o t em regras e camadas","minutos":10,"nivel":"básico","objetivos":["Perceber a ideia de camadas com uma analogia","Saber o que é um protocolo"],"blocos":[{"tipo":"texto","titulo":"Enviar uma encomenda","html":"<p>Para enviar uma encomenda: <b>1)</b> escolhe o presente, <b>2)</b> embala-o, <b>3)</b> escreve a morada na etiqueta, <b>4)</b> a transportadora põe-no num camião, <b>5)</b> o camião anda pela estrada. Cada passo tem a sua tarefa e não precisa de saber como funcionam os outros: o motorista não abre a caixa.</p>\n<p>Nas redes é igual. Cada <b>camada</b> trata de uma parte: a aplicação cria a mensagem, o transporte garante que chega inteira, a camada de rede põe a morada (IP), a ligação de dados entrega ao vizinho seguinte e a camada física transforma tudo em sinais.</p>"},{"tipo":"tabela","titulo":"","cabecalho":["Passo da encomenda","Camada de rede"],"linhas":[["O presente","Dados da aplicação (a mensagem)"],["A caixa com nota “frágil, confirmar receção”","Transporte (TCP): confirmações e ordem"],["A etiqueta com a morada","Rede (IP): endereço de origem e destino"],["O camião entre dois armazéns","Ligação de dados (Ethernet/Wi-Fi): de um equipamento ao seguinte"],["A estrada","Física: cabo, fibra, ondas de rádio"]]},{"tipo":"texto","titulo":"O que é um protocolo","html":"<p>Um <b>protocolo</b> é um conjunto de regras combinadas, como as regras de trânsito ou a forma de começar um telefonema (“Estou? / Sim, diga.”). Exemplos: <b>HTTP</b> (páginas web), <b>TCP</b> (entrega fiável), <b>IP</b> (endereços), <b>Ethernet</b> (rede com cabo).</p>"},{"tipo":"dica","html":"Sempre que algo não funciona, os técnicos perguntam “em que camada está o problema?”. É o método que vai aprender aqui."}],"quiz":[{"tipo":"mc","p":"Na analogia da encomenda, a etiqueta com a morada corresponde a…","opcoes":["Camada física","Camada de rede (IP)","Aplicação","Cabo"],"correta":1,"explica":"A morada = endereço IP."},{"tipo":"vf","p":"Um protocolo é um conjunto de regras de comunicação."," odo que vai aprender aqui.","f":"É o método que vai aprender aqui."}]},{"tipo":"fecho","bloco":-1,"titulo":"Resumo","falas":[{"t":"Resumo da aula. Agora já sabe:","f":"Resumo da aula. Agora já sabe:"},{"t":"Perceber a ideia de camadas com uma analogia.","f":"Perceber a ideia de camadas com uma analogia.","item":0},{"t":"Saber o que é um protocolo.","f":"Saber o que é um protocolo.","item":1},{"t":"Faça agora o quiz de 3 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição.","f":"Faça agora o quiz de 3 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição."}]}],"segundos":136}},{"id":"m2l1","titulo":"O modelo OSI em 7 camadas","minutos":15,"nivel":"básico","objetivos":["Nomear as 7 camadas e a função de cada uma","Associar protocolos, equipamentos e PDUs às camadas","Usar o modelo OSI para resolver problemas"],"blocos":[{"tipo":"texto","titulo":"Porque usamos camadas","html":"<p>O modelo <b>OSI</b> (ISO/IEC 7498-1) divide a comunicação em 7 camadas. Cada camada resolve um problema e presta serviço à camada de cima. Vantagens: fabricantes diferentes interoperam, ensina-se por partes e a resolução de problemas fica metódica.</p>\n<p>Mnemónica (de cima para baixo): <b>A</b>prenda <b>A</b> <b>S</b>empre <b>T</b>udo <b>R</b>edes <b>E</b> <b>F</b>ísica — Aplicação, Apresentação, Sessão, Transporte, Rede, Enlace (ligação de dados), Física.</p>"},{"tipo":"figura","nome":"osi","legenda":"As 7 camadas do modelo OSI e o modelo TCP/IP lado a lado."},{"tipo":"tabela","titulo":"","cabecalho":["#","Camada","Função","PDU","Exemplos"],"linhas":[["7","Aplicação","Interface com as aplicações de rede","Dados","HTTP, DNS, SMTP, SSH"],["6","Apresentação","Formato, codificação, cifra","Dados","TLS, JPEG, ASCII"],["5","Sessão","Abrir, manter e fechar sessões","Dados","RPC, NetBIOS"],["4","Transporte","Entrega fim a fim, portas, fiabilidade","Segmento / Datagrama","TCP, UDP"],["3","Rede","Endereçamento lógico e encaminhamento","Pacote","IPv4, IPv6, ICMP, OSPF"],["2","Ligação de dados","Entrega no mesmo meio, MAC, deteção de erros","Trama (frame)","Ethernet, 802.11, PPP"],["1","Física","Bits em sinais elétricos, luz ou rádio","Bits","Cabos, conectores, hubs"]]},{"tipo":"exemplo","titulo":"Resolução de problemas de baixo para cima","html":"<p>Um utilizador diz “não tenho Internet”. Pelo modelo OSI:</p>\n<ol>\n<li><b>Física</b>: o cabo está ligado? A luz da porta acende?</li>\n<li><b>Ligação</b>: a porta do switch está na VLAN certa? Está em err-disabled?</li>\n<li><b>Rede</b>: o PC tem IP, máscara e gateway corretos? <code>ping</code> ao gateway responde?</li>\n<li><b>Transporte/Aplicação</b>: o DNS resolve nomes? Uma firewall está a bloquear a porta 443?</li>\n</ol>"},{"tipo":"dica","html":"No dia a dia de redes diz-se “problema de camada 1” (cabo), “camada 2” (VLAN/MAC), “camada 3” (IP/rotas). Fale assim também."}],"quiz":[{"tipo":"mc","p":"Em que camada OSI trabalha o router?","opcoes":["2","3","4","7"],"correta":1,"explica":"Camada 3, rede: endereços IP e encaminhamento."},{"tipo":"mc","p":"A PDU da camada de ligação de dados chama-se…","opcoes":["Segmento","Pacote","Trama","Bit"],"correta":2,"explica":"Camada 2 = trama (frame)."},{"tipo":"mc","p":"TCP e UDP pertencem à camada…","opcoes":["Rede","Transporte","Sessão","Aplicação"],"correta":1,"explica":"Camada 4, transporte."},{"tipo":"vf","p":"A cifra de dados (por ex. TLS) é associada à camada de Apresentação no modelo OSI.","correta":true,"explica":"Formatos, compressão e cifra são funções da camada 6."},{"tipo":"mc","p":"Um cabo partido é um problema de que camada?","opcoes":["1","2","3","7"],"correta":0,"explica":"Camada física."}],"referencias":["iso7498","odom1","kurose","netacad_itn"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"O modelo OSI em 7 camadas","falas":[{"t":"O modelo OSI em 7 camadas","f":"Módulo 2. Aula: O modelo O S I em 7 c {"t":"6. Camada: Apresentação. Função: Formato, codificação, cifra. PDU: Dados. Exemplos: TLS, JPEG, ASCII.","f":"6. Camada: Apresentação. Função: Formato, codificação, cifra. P D U: Dados. Exemplos: T L S, J P E G, ásqui.","linha":1},{"t":"5. Camada: Sessão. Função: Abrir, manter e fechar sessões. PDU: Dados. Exemplos: RPC, NetBIOS.","f":"5. Camada: Sessão. Função: Abrir, manter e fechar sessões. P D U: Dados. Exemplos: R P C, NetBIOS.","linha":2},{"t":"4. Camada: Transporte. Função: Entrega fim a fim, portas, fiabilidade. PDU: Segmento / Datagrama. Exemplos: TCP, UDP.","f":"4. Camada: Transporte. Função: Entrega fim a fim, portas, fiabilidade. P D U: Segmento / Datagrama. Exemplos: T C P, U D P.","linha":3},{"t":"3. Camada: Rede. Função: Endereçamento lógico e encaminhamento. PDU: Pacote. Exemplos: IPv4, IPv6, ICMP, OSPF.","f":"3. Camada: Rede. Função: Endereçamento lógico e encaminhamento. P D U: Pacote. Exemplos: i pê vê quatro, i pê vê seis, I C M P, O S P F.","linha":4},{"t":"2. Camada: Ligação de dados. Função: Entrega no mesmo meio, MAC, deteção de erros. PDU: Trama (frame). Exemplos: Ethernet, 802.11, PPP.","f":"2. Camada: Ligação de dados. Função: Entrega no mesmo meio, mac, deteção de erros. P D U: Trama (frêime). Exemplos: íternet, oito zero dois ponto 11, P P P.","linha":5},{"t":"1. Camada: Física. Função: Bits em sinais elétricos, luz ou rádio. PDU: Bits. Exemplos: Cabos, conectores, hubs.","f":"1. Camada: Física. Função: Bits em sinais elétricos, luz ou rádio. P D U: Bits. Exemplos: Cabos, conectores, râbs.","linha":6}]},{"tipo":"exemplo","bloco":3,"titulo":"Resolução de problemas de baixo para cima","falas":[{"t":"Exemplo: Resolução de problemas de baixo para cima.","f":"Exemplo: Resolução de problemas de baixo para cima."},{"t":"Um utilizador diz “não tenho Internet”.","f":"Um utilizador diz não tenho Internet."},{"t":"Pelo modelo OSI:","f":"Pelo modelo O S I:"},{"t":"Física: o cabo está ligado?","f":"Física: o cabo está ligado?"},{"t":"A luz da porta acende?","f":"A luz da porta acende?"},{"t":"Ligação: a porta do switch está na VLAN certa?","f":"Ligação: a porta do suítch está na vê lan certa?"},{"t":"Está em err-disabled?","f":"Está em err-disabled?"},{"t":"Rede: o PC tem IP, máscara e gateway corretos? ping ao gateway responde?","f":"Rede: o P C tem I P, máscara e guêituei corretos? ping ao guêituei responde?"},{"t":"Transporte/Aplicação: o DNS resolve nomes?","f":"Transporte ou Aplicação: o D N S resolve nomes?"},{"t":"Uma firewall está a bloquear a porta 443?","f":"Uma fáiruól está a bloquear a porta 443?"}]},{"tipo":"dica","bloco":4,"titulo":"Dica","falas":[{"t":"Dica: No dia a dia de redes diz-se “problema de camada 1” (cabo), “camada 2” (VLAN/MAC), “camada 3” (IP/rotas).","f":"Dica: No dia a dia de redes diz-se problema de camada 1 (cabo), camada 2 (vê lan ou mac), camada 3 (I P ou rotas)."},{"t":"Fale assim também.","f":"Fale assim também."}]},{"tipo":"fecho","bloco":-1,"titulo":"Resumo","falas":[{"t":"Resumo da aula. Agora já sabe:","f":"Resumo da aula. Agora já sabe:"},{"t":"Nomear as 7 camadas e a função de cada uma.","f":"Nomear as 7 camadas e a função de cada uma.","item":0},{"t":"Associar protocolos, equipamentos e PDUs às camadas.","f":"Associar protocolos, equipamentos e P D U às camadas.","item":1},{"t":"Usar o modelo OSI para resolver problemas.","f":"Usar o modelo O S I para resolver problemas.","item":2},{"t":"Faça agora o quiz de 5 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição.","f":"Faça agora o quiz de 5 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição."}]}],"segundos":198}},{"id":"m2l2","titulo":"TCP/IP e encapsulamento","minutos":12,"nivel":"básico","objetivos":["Comparar o modelo TCP/IP com o OSI","Descrever encapsulamento e desencapsulamento","Perceber o que muda (e o que não muda) em cada salto"],"blocos":[{"tipo":"texto","titulo":"O modelo que a Internet usa","html":"<p>O modelo <b>TCP/IP</b> é o que realmente está implementado. Na versão de 4 camadas: <b>Aplicação</b> (OSI 5-7), <b>Transporte</b> (4), <b>Internet</b> (3) e <b>Acesso à rede</b> (1-2). Muitos livros, incluindo o guia oficial CCNA, usam a versão de <b>5 camadas</b>, que separa ligação de dados e física.</p>"},{"tipo":"figura","nome":"encapsulamento","legenda":"Encapsulamento: cada camada acrescenta o seu cabeçalho aos dados da camada de cima."},{"tipo":"texto","titulo":"Encapsulamento passo a passo","html":"<ol>\n<li>A aplicação gera os <b>dados</b> (ex.: pedido HTTP).</li>\n<li>O transporte junta o cabeçalho TCP com as <b>portas</b> → <b>segmento</b>.</li>\n<li>A camada de rede junta o cabeçalho IP com os <b>endereços IP</b> → <b>pacote</b>.</li>\n<li>A ligação de dados junta cabeçalho e trailer Ethernet com os <b>MAC</b> e o <b>FCS</b> → <b>trama</b>.</li>\n<li>A física converte em <b>bits</b> no fio.</li>\n</ol>\n<p>No destino faz-se o caminho inverso: <b>desencapsulamento</b>.</p>"},{"tipo":"topologia","nos":[{"id":"a","tipo":"pc","x":8,"y":50,"rotulo":"PC A"},{"id":"r1","tipo":"router","x":36,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":64,"y":50,"rotulo":"R2"},{"id":"b","tipo":"servidor","x":92,"y":50,"rotulo":"Servidor B"}],"ligacoes":[{"a":"a","b":"r1","rotulo":"MAC A→R1"},{"a":"r1","b":"r2","rotulo":"MAC R1→R2"},{"a":"r2","b":"b","rotulo":"MAC R2→B"}],"legenda":"Em cada salto a trama é refeita com novos MAC; o IP de origem e destino mantém-se (sem NAT)."},{"tipo":"exemplo","titulo":"O que muda em cada salto?","html":"<p>Quando o PC A envia um pacote ao servidor B através de R1 e R2:</p>\n<ul>\n<li><b>IP origem/destino</b>: <b>não mudam</b> (A → B) em todo o caminho, salvo NAT.</li>\n<li><b>MAC origem/destino</b>: <b>mudam a cada salto</b> — cada router remove a trama antiga e cria uma nova para a ligação seguinte.</li>\n<li><b>TTL</b> do IP: cada router diminui 1.</li>\n</ul>"},{"tipo":"dica","html":"Perg S","UDP"],["49","TACACS+","TCP"]]},{"tipo":"exemplo","titulo":"Socket","html":"<p>Uma ligação é identificada por <b>IP de origem + porta de origem + IP de destino + porta de destino + protocolo</b>. Por exemplo, o seu browser em 192.168.1.20:51344 liga a 142.250.0.10:443 (TCP). A porta de origem é <i>efémera</i> (aleatória, normalmente acima de 49152).</p>"},{"tipo":"dica","html":"Truque: tudo o que é “tempo real” (voz, vídeo, jogos) ou “pergunta curta” (DNS, DHCP) prefere UDP."}],"quiz":[{"tipo":"mc","p":"Qual a sequência correta do handshake TCP?","opcoes":["SYN, ACK, SYN-ACK","SYN, SYN-ACK, ACK","ACK, SYN, FIN","SYN, FIN, ACK"],"correta":1,"explica":"SYN → SYN-ACK → ACK."},{"tipo":"mc","p":"Que protocolo de transporte usa normalmente a voz sobre IP?","opcoes":["TCP","UDP","ICMP","ARP"],"correta":1,"explica":"Voz tolera perdas mas não atrasos de retransmissão: UDP."},{"tipo":"mc","p":"Qual é a porta do SSH?","opcoes":["21","22","23","443"],"correta":1,"explica":"SSH = TCP 22. Telnet = 23."},{"tipo":"mc","p":"DHCP usa…","opcoes":["TCP 67/68","UDP 67/68","UDP 53","TCP 80"],"correta":1,"explica":"Servidor UDP 67, cliente UDP 68."},{"tipo":"vf","p":"O TCP usa a janela deslizante para controlo de fluxo.","correta":true,"explica":"O window size limita o envio sem confirmação."}],"referencias":["rfc9293","rfc768","kurose","odom1"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"TCP, UDP e portas","falas":[{"t":"TCP, UDP e portas","f":"Módulo 2. Aula: T C P, U D P e portas."},{"t":"Nesta aula vai aprender a:","f":"Nesta aula vai aprender a:"},{"t":"Comparar TCP e UDP.","f":"Comparar T C P e U D P.","item":0},{"t":"Explicar o three-way handshake e o controlo de fluxo por janela.","f":"Explicar o three-way handshake e o controlo de fluxo por janela.","item":1},{"t":"Memorizar as portas mais conhecidas.","f":"Memorizar as portas mais conhecidas.","item":2}]},{"tipo":"tabela","bloco":0,"titulo":"TCP × UDP","falas":[{"t":"Tabela: TCP × UDP.","f":"Tabela: T C P vezes ransmitir."}]},{"id":"m3","numero":3,"titulo":"Endereçamento IPv4 e IPv6","descricao":"Binário, máscaras, sub-redes, VLSM e IPv6. A base de tudo o que vem a seguir.","dominio":"1.0 Network Fundamentals","icone":"calculadora","licoes":[{"id":"m3l0","titulo":"Comece por aqui: o que é um endereço IP?","minutos":14,"nivel":"básico","objetivos":["Explicar o que é um endereço IP com exemplos reais","Distinguir IP público e privado","Descobrir o IP do seu computador e telemóvel"],"blocos":[{"tipo":"texto","titulo":"A morada de cada equipamento","html":"<p>Um <b>endereço IP</b> (Internet Protocol) é o número que identifica um equipamento numa rede, tal como a morada identifica uma casa. Sem IP, os pacotes não sabem para onde ir.</p>\n<p>Um endereço IPv4 tem <b>quatro números separados por pontos</b>, cada um de 0 a 255. Exemplos:</p>\n<ul>\n<li><code>192.168.1.1</code> — normalmente o router de casa;</li>\n<li><code>192.168.1.23</code> — o seu telemóvel ligado ao Wi-Fi de casa;</li>\n<li><code>8.8.8.8</code> — um servidor de DNS público na Internet.</li>\n</ul>"},{"tipo":"exemplo","titulo":"Rua e número da porta","html":"<p>Num endereço como <code>192.168.1.23</code> com máscara <code>255.255.255.0</code>:</p>\n<ul>\n<li><code>192.168.1</code> é a <b>rede</b> — como o nome da <b>rua</b>. Todos os equipamentos da sua casa têm esta parte igual.</li>\n<li><code>23</code> é o <b>host</b> — como o <b>número da porta</b>. Cada equipamento tem um número diferente.</li>\n</ul>\n<p>A <b>máscara</b> é o que diz onde acaba a rua e começa o número da porta. Vai aprender a lê-la nas próximas aulas.</p>"},{"tipo":"topologia","nos":[{"id":"r","tipo":"router","x":50,"y":15,"rotulo":"Router 192.168.1.1"},{"id":"pc","tipo":"pc","x":15,"y":80,"rotulo":"PC 192.168.1.10"},{"id":"tel","tipo":"telefone_ip","x":50,"y":80,"rotulo":"Telemóvel 192.168.1.23"},{"id":"tv","tipo":"portatil","x":85,"y":80,"rotulo":"Smart TV 192.168.1.40"}],"ligacoes":[{"a":"r","b":"pc","rotulo":""},{"a":"r","b":"tel","rot 24","32","30"],["/28","255.255.255.240","16","14"],["/29","255.255.255.248","8","6"],["/30","255.255.255.252","4","2"],["/31","255.255.255.254","2","2 (ponto a ponto, RFC 3021)"],["/32","255.255.255.255","1","1 (rota de host / loopback)"]]},{"tipo":"exemplo","titulo":"Método do número mágico: 192.168.10.77/27","html":"<ol>\n<li>Octeto “interessante”: o 4.º (onde a máscara não é 255 nem 0). Máscara = 224.</li>\n<li>Número mágico = 256 − 224 = <b>32</b>. As redes andam de 32 em 32: 0, 32, 64, 96…</li>\n<li>77 está entre 64 e 96 → <b>Rede: 192.168.10.64</b>.</li>\n<li><b>Broadcast</b> = próxima rede − 1 = <b>192.168.10.95</b>.</li>\n<li><b>Hosts</b>: 192.168.10.65 a 192.168.10.94 (30 hosts).</li>\n</ol>"},{"tipo":"exemplo","titulo":"Dividir 192.168.1.0/24 em 4 sub-redes iguais","html":"<p>4 sub-redes → 2 bits emprestados (2² = 4) → /26, bloco 64:</p>\n<ul>\n<li>192.168.1.0/26 (hosts .1–.62, bc .63)</li>\n<li>192.168.1.64/26 (hosts .65–.126, bc .127)</li>\n<li>192.168.1.128/26 (hosts .129–.190, bc .191)</li>\n<li>192.168.1.192/26 (hosts .193–.254, bc .255)</li>\n</ul>"},{"tipo":"exemplo","titulo":"Quando o octeto interessante é o 3.º: 172.16.45.10/20","html":"<p>/20 → máscara 255.255.<b>240</b>.0. Mágico = 16 no 3.º octeto: 0, 16, 32, <b>48</b>… 45 está em 32–47.</p>\n<p>Rede <b>172.16.32.0</b>, broadcast <b>172.16.47.255</b>, hosts 172.16.32.1 a 172.16.47.254 (2<sup>12</sup> − 2 = 4094).</p>"},{"tipo":"dica","html":"Pratique todos os dias 10 minutos no <b>Desafio Sub-rede</b> (separador Jogar). No exame não há calculadora e a rapidez faz diferença."}],"quiz":[{"tipo":"mc","p":"Qual o endereço de rede de 10.1.1.130/25?","opcoes":["10.1.1.0","10.1.1.128","10.1.1.129","10.1.1.255"],"correta":1,"explica":"Bloco 128: 0 e 128. 130 está na rede .128."},{"tipo":"mc","p":"Qual o broadcast de 192.168.5.40/29?","opcoes":["192.168.5.47","192.168.5.48","192.168.5.39","192.168.5.255"],"correta":0,"explica":"Bloco 8: 40–47. Broadcast .47."},{"tipo":"mc","p":"Quantos hosts úteis tem um /28?","opcoes":["16","14","30","12"],"correta":1,"explica":"2⁴ − 2 = 14."},{"tipo":"mc","p":"Precisa de 50 hosts por sub-rede. Qual o prefixo mais eficiente?","opcoes":["/25","/26","/27","/28"],"correta":1,"explica":"/26 dá 62 hosts; /27 só dá 30."},{"tipo":"vf","p":"192.168.1.63/26 é um endereço válido para um host.","correta":false,"explica":"É o broadcast da rede 192.168.1.0/26."},{"tipo":"mc","p":"Quantas sub-redes /27 cabem num /24?","opcoes":["4","6","8","16"],"correta":2,"explica":"3 bits emprestados → 2³ = 8."}],"referencias":["rfc950","rfc4632","odom1","lammle"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"Sub-redes (subnetting) sem medo","falas":[{"t":"Sub-redes (subnetting) sem medo","f":"Módulo 3. Aula: Sub-redes (subnetting) sem medo."},{"t":"Nesta aula vai aprender a:","f":"Nesta aula vai aprender a:"},{"t":"Calcular endereço de rede, broadcast e intervalo de hosts.","f":"Calcular endereço de rede, bródcast e intervalo de rôsts.","item":0},{"t":"Determinar quantas sub-redes e hosts um prefixo dá.","f":"Determinar quantas sub-redes e rôsts um prefixo dá.","item":1},{"t":"Usar o método do “número mágico”.","f":"Usar o método do número mágico.","item":2}]},{"tipo":"texto","bloco":0,"titulo":"As duas fórmulas","falas":[{"t":"As duas fórmulas.","f":"As duas fórmulas."},{"t":"Hosts por sub-rede = 2^h − 2 (h = bits de host).","f":"rôsts por sub-rede igual a 2 elevado a h menos 2 (h igual a bits de rôst)."},{"t":"Tiram-se 2: o endereço de rede e o de broadcast.","f":"Tiram-se 2: o endereço de rede e o de bródcast."},{"t":"Número de sub-redes = 2^s (s = bits emprestados ao host).","f":"Número de sub-redes igual a 2 elevado a s (s igual a bits emprestados ao rôst)."}]},{"tipo":"tabela","bloco":1,"titulo":"A tabela que vale ouro — decore-a","falas":[{"t":"Tabela: A tabela que vale ouro — decore-a.","f":"Tabela: A tabela que vale ouro — decore-a."},{"t":"/24. Máscara: 255.255.255.0. Bloco (nº mágico): 256. Hosts úteis: 254.","f":"barra 24. Máscara: "Octeto interessante: o quarto (onde a máscara não é 255 nem 0)."},{"t":"Máscara = 224.","f":"Máscara igual a 224."},{"t":"Número mágico = 256 − 224 = 32.","f":"Número mágico igual a 256 menos 224 igual a 32."},{"t":"As redes andam de 32 em 32: 0, 32, 64, 96…","f":"As redes andam de 32 em 32: 0, 32, 64, 96..."},{"t":"77 está entre 64 e 96 → Rede: 192.168.10.64.","f":"77 está entre 64 e 96 , e depois, Rede: 192 ponto 168 ponto 10 ponto 64."},{"t":"Broadcast = próxima rede − 1 = 192.168.10.95.","f":"bródcast igual a próxima rede menos 1 igual a 192 ponto 168 ponto 10 ponto 95."},{"t":"Hosts: 192.168.10.65 a 192.168.10.94 (30 hosts).","f":"rôsts: 192 ponto 168 ponto 10 ponto 65 a 192 ponto 168 ponto 10 ponto 94 (30 rôsts)."}]},{"tipo":"exemplo","bloco":3,"titulo":"Dividir 192.168.1.0/24 em 4 sub-redes iguais","falas":[{"t":"Exemplo: Dividir 192.168.1.0/24 em 4 sub-redes iguais.","f":"Exemplo: Dividir 192 ponto 168 ponto 1 ponto 0 barra 24 em 4 sub-redes iguais."},{"t":"4 sub-redes → 2 bits emprestados (2² = 4) → /26, bloco 64:","f":"4 sub-redes , e depois, 2 bits emprestados (2² igual a 4) , e depois, barra 26, bloco 64:"},{"t":"192.168.1.0/26 (hosts .1–.62, bc .63)","f":"192 ponto 168 ponto 1 ponto 0 barra 26 (rôsts .1–.62, bc .63)"},{"t":"192.168.1.64/26 (hosts .65–.126, bc .127)","f":"192 ponto 168 ponto 1 ponto 64 barra 26 (rôsts .65–.126, bc .127)"},{"t":"192.168.1.128/26 (hosts .129–.190, bc .191)","f":"192 ponto 168 ponto 1 ponto 128 barra 26 (rôsts .129–.190, bc .191)"},{"t":"192.168.1.192/26 (hosts .193–.254, bc .255)","f":"192 ponto 168 ponto 1 ponto 192 barra 26 (rôsts .193–.254, bc .255)"}]},{"tipo":"exemplo","bloco":4,"titulo":"Quando o octeto interessante é o 3.º: 172.16.45.10/20","falas":[{"t":"Exemplo: Quando o octeto interessante é o 3.º: 172.16.45.10/20.","f":"Exemplo: Quando o octeto interessante é o terceiro: 172 ponto 16 ponto 45 ponto 10 barra 20."},{"t":"/20 → máscara 255.255.240.0.","f":"barra 20 , e depois, máscara 255 ponto 255 ponto 240 ponto 0."},{"t":"Mágico = 16 no 3.º octeto: 0, 16, 32, 48… 45 está em 32–47.","f":"Mágico igual a 16 no terceiro octeto: 0, 16, 32, 48... 45 está em 32–47."},{"t":"Rede 172.16.32.0, broadcast 172.16.47.255, hosts 172.16.32.1 a 172.16.47.254 (2^12 − 2 = 4094).","f":"Rede 172 ponto 16 ponto 32 ponto 0, bródcast 172 ponto 16 ponto 47 ponto 255, rôsts 172 ponto 16 ponto 32 ponto 1 a 172 ponto 16 ponto 47 ponto 254 (2 elevado a 12 menos 2 igual a 4094)."}]},{"tipo":"dica","bloco":5,"titulo":"Dica","falas":[{"t":"Dica: Pratique todos os dias 10 minutos no Desafio Sub-rede (separador Jogar).","f":"Dica: Pratique todos os dias 10 minutos no Desafio Sub-rede (separador Jogar)."},{"t":"No exame não há calculadora e a rapidez faz diferença.","f":"No exame não há calculadora e a rapidez faz diferença."}]},{"tipo":"fecho","bloco":-1,"titulo":"Resumo","falas":[{"t":"Resumo da aula. Agora já sabe:","f":"Resumo da aula. Agora já sabe:"},{"t":"Calcular endereço de rede, broadcast e intervalo de hosts.","f":"Calcular endereço de rede, bródcast e intervalo de rôsts.","item":0},{"t":"Determinar quantas sub-redes e hosts um prefixo dá.","f":"Determinar quantas sub-redes e rôsts um prefixo dá.","item":1},{"t":"Usar o método do “número mágico”.","f":"Usar o método do número mágico.","item":2},{"t":"Faça agora o quiz de 6 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição.","f":"Faça agora o quiz de 6 perguntas para confirmar o que aprendeu. Se tiver dúvidas, repita a aula. As referências bibliográficas estão no fim da lição."}]}],"segundos":252}},{"id":"m3l3","titulo":"VLSM e sumarização","minutos":18,"nivel":"intermédio","objetivos":["Planear endereçamento com máscaras de tamanho variável","Evitar sobreposição de sub-redes","Sumarizar rotas"],"blocos":[{"tipo":"texto","titulo":"O que é VLSM","html":"<p><b>VLSM</b> (Variable Length Subnet Mask) permite usar máscaras diferentes dentro do mesmo bloco, dando a cada rede apenas o tamanho de que precisa. Regra de ouro: <b>atribuir primeiro as redes maiores</b>.</p>"},{"tipo":"exemplo","titulo":"Plano para 192.168.50.0/24","html":"<p>Necessidades: Vendas 100 hosts, TI 50, Gestão 20, 2 ligações WAN de 2 hosts.</p>\n<ol>\n<li>Vendas (100) → /25 (126) → <b>192.168.50.0/25</b> (.1–.126)</li>\n<li>TI (50) → /26 (62) → <b>192.168.50.128/26</b> (.129–.190)</li>\n<li>Gestão (20) → /27 (30) → <b>192.168.50.192/27</b> (.193–.222)</li>\n<li>WAN 1 → /30 → <b>192.168.50.224/30</b> (.225–.226)</li>\n<li>WAN 2 → /30 → <b>192.168.50.228/30</b> (.229–.230)</li>\n</ol>\n<p>Sobra 192.168.50.232 a .255 para crescer.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":30,"y":30,"rotulo":"R1"},{"id":"r2","tipo":"router","x":70,"y":30,"rotulo":"R2"},{"id":"v","tipo":"switch","x":12,"y":80,"rotulo":"Vendas /25"},{"id":"t","tipo":"switch","x":45,"y":80,"rotulo":"TI /26"},{"id":"g","tipo":"switch","x":85,"y":80,"rotulo":"Gestão /27"}],"ligacoes":[{"a":"r1","b":"r2","rotulo":"WAN /30"},{"a":"r1","b":"v","rotulo":""},{"a":"r1","b":"t","rotulo":""},{"a":"r2","b":"g","rotulo":""}],"legenda":"Cada rede recebe uma máscara à medida."},{"tipo":"texto","titulo":"Sumarização (supernetting)","html":"<p>Juntar várias redes contíguas numa só rota reduz o tamanho das tabelas. Escreva as redes em binário e conte os bits iguais à esquerda.</p>\n<p>Ex.: 172.16.0.0/24, 172.16.1.0/24, 172.16.2.0/24, 172.16.3.0/24 → o 3.º octeto vai de 000000<b>00</b> a 000000<b>11</b>: 22 bits iguais → <b>172.16.0.0/22</b>.</p>"},{"tipo":"alerta","html":"Sobreposição: 10.0.0.0/25 e 10.0.0.64/26 sobrepõem-se (.64 a .127 pertencem às duas). O IOS recusa configurar sub-redes sobrepostas em interfaces diferentes do mesmo router (<i>% ... overlaps with ...</i>)."}],"quiz":[{"tipo":"mc","p":"Ao planear com VLSM, por onde começar?","opcoes":["Pelas redes menores","Pelas ligações WAN","Pelas redes maiores","Por ordem alfabética"],"correta":2,"explica":"Maiores primeiro evita fragmentar o espaço."},{"tipo":"mc","p":"Que prefixo é o ideal para uma ligação ponto a ponto entre dois routers (sem /31)?","opcoes":["/24","/29","/30","/32"],"correta":2,"explica":"/30 tem exatamente 2 hosts úteis."},{"tipo":"mc","p":"Sumarize 10.1.4.0/24, 10.1.5.0/24, 10.1.6.0/24 e 10.1.7.0/24.","opcoes":["10.1.4.0/22","10.1.0.0/21","10.1.4.0/23","10.1.4.0/21"],"correta":0,"explica":"4 a 7 = 000001xx → 22 bits iguais."},{"tipo":"vf","p":"192.168.1.0/26 e 192.168.1.32/27 sobrepõem-se.","correta":true,"explica":"/26 vai de .0 a .63, que inclui .32–.63."}],"referencias":["rfc4632","odom1","netacad_itn"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"VLSM e sumarização","falas":[{"t":"VLSM e sumarização","f":"Módulo 3. Aula: V L S M e sumarização."},{"t":"Nesta aula vai aprender a:","f":"Nesta aula vai aprender a:"},{"t":"Planear endereçamento com máscaras de tamanho variável.","f":"Planear endereçamento com máscaras de tamanho variável.","item":0},{"t":"Evitar sobreposição de sub-redes.","f":"Evitar sobreposição de sub-redes.","item":1},{"t":"Sumarizar rotas.","f":"Sumarizar rotas.","item":2}]},{"tipo":"texto","bloco":0,"titulo":"O que é VLSM","falas":[{"t":"O que é VLSM.","f":"O que é V L S M."},{"t":"VLSM (Variable Length Subnet Mask) permite usar máscaras diferentes dentro do mesmo bloco, dando a cada rede apenas o tamanho de que precisa.","f":"V L S M (Variable Length Subnet Mask) permite usar máscaras diferentes dentro do mesmo bloco, dando a cada rede apenas o tamanho de que precisa."},{"t":"Regra de ouro: atribuir primeiro as redes maiores.","f":"Regra de ouro: atribuir primeiro as redes maiores."}]},{"tipo":"exemplo","bloco":1,"titulo":"Plano para 192.168.50.0/24","falas":[{"t":"Exemplo: Plano para 192.168.50.0/24.","f":"Exemplo: Plano para 192 ponto 168 ponto 50 ponto 0 barra 24."},{"t":"Necessidades: Vendas 100 hosts, TI 50, Gestão 20, 2 ligações WAN de 2 hosts.","f":"Necessidades: Vendas 100 rôsts, T I 50, Gestão 20, 2 ligações uan de 2 rôsts."},{"t":"Vendas (10  4,3 mil milhões de endereços e esgotou-se. O IPv6 tem <b>128 bits</b> (3,4 × 10<sup>38</sup>), escritos em 8 grupos de 4 dígitos hexadecimais: <code>2001:0DB8:0000:0000:0000:0000:0000:0001</code>.</p>"},{"tipo":"exemplo","titulo":"Regras de abreviação","html":"<ol>\n<li>Retirar zeros à esquerda de cada grupo: <code>0DB8</code> → <code>DB8</code>, <code>0001</code> → <code>1</code>.</li>\n<li>Substituir <b>uma única</b> sequência de grupos só com zeros por <code>::</code>.</li>\n</ol>\n<p><code>2001:0DB8:0000:0000:0000:0000:0000:0001</code> → <b><code>2001:DB8::1</code></b></p>\n<p><code>FE80:0000:0000:0000:0212:34FF:FE56:7890</code> → <b><code>FE80::212:34FF:FE56:7890</code></b></p>"},{"tipo":"tabela","titulo":"Tipos de endereço IPv6 (não existe broadcast!)","cabecalho":["Tipo","Prefixo","Para que serve"],"linhas":[["Global unicast","2000::/3","Público, encaminhável na Internet"],["Unique local","FC00::/7 (na prática FD00::/8)","Privado, como o RFC 1918"],["Link-local","FE80::/10","Só na ligação local; todas as interfaces IPv6 têm um"],["Multicast","FF00::/8","Grupos (FF02::1 todos os nós, FF02::2 todos os routers)"],["Loopback","::1/128","A própria máquina"],["Não especificado","::/128","Sem endereço ainda"]]},{"tipo":"exemplo","titulo":"EUI-64: criar o ID de interface a partir do MAC 0012.34AB.CDEF","html":"<ol>\n<li>Dividir o MAC ao meio e inserir <code>FFFE</code>: 0012:34<b>FF:FE</b>AB:CDEF.</li>\n<li>Inverter o 7.º bit do 1.º byte: 00 = 0000 0000 → 0000 00<b>1</b>0 = 02.</li>\n<li>ID de interface: <code>0212:34FF:FEAB:CDEF</code>.</li>\n</ol>"},{"tipo":"cli","titulo":"IPv6 num router Cisco","passos":[{"prompt":"R1(config)#","cmd":"ipv6 unicast-routing","explica":"Ativa o encaminhamento IPv6 (desligado por defeito!)."},{"prompt":"R1(config)#","cmd":"interface g0/0","explica":"Entra na interface."},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:1::1/64","explica":"Endereço global estático."},{"prompt":"R1(config-if)#","cmd":"ipv6 address fe80::1 link-local","explica":"Link-local fácil de ler (opcional)."},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"Liga a interface."},{"prompt":"R1(config-if)#","cmd":"interface g0/1","explica":""},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:2::/64 eui-64","explica":"O router gera o ID de interface a partir do MAC."},{"prompt":"R1#","cmd":"show ipv6 interface brief","explica":"Verifica endereços e estado."},{"prompt":"R1(config)#","cmd":"ipv6 route ::/0 2001:db8:ffff::2","explica":"Rota por defeito IPv6."}],"nota":""},{"tipo":"texto","titulo":"Como os PCs obtêm IPv6","html":"<ul>\n<li><b>SLAAC</b>: o router envia <i>Router Advertisements</i> (RA) com o prefixo; o PC cria o próprio endereço.</li>\n<li><b>DHCPv6 stateless</b>: SLAAC para o endereço + DHCPv6 para DNS e outros dados.</li>\n<li><b>DHCPv6 stateful</b>: o servidor DHCPv6 atribui o endereço (o gateway continua a vir do RA).</li>\n</ul>\n<p>Para evitar duplicados, o host faz <b>DAD</b> (Duplicate Address Detection) com mensagens NDP.</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta SLAAC, DHCPv6 e EUI-64, mas algumas mensagens debug não existem.","Os PCs simulados não usam endereços temporários de privacidade."],"real":["Windows/macOS/Linux geram endereços aleatórios (privacidade, RFC 8981) em vez de EUI-64 — o endereço que vê no PC não bate com o MAC.","Em alguns switches é preciso ativar o modelo SDM para IPv6 antes de o configurar (ex.: Catalyst 2960: <code>sdm prefer dual-ipv4-and-ipv6 default</code> + reload)."]}],"quiz":[{"tipo":"mc","p":"Qual é a forma abreviada correta de 2001:0DB8:0000:0000:0000:00A0:0000:0001?","opcoes":["2001:DB8::A0::1","2001:DB8::A0:0:1","2001:DB8:0:0:0:A:0:1","2001:DB8::A:1"],"correta":1,"explica":"Só se pode usar :: uma vez, e não se tiram zeros à direita (00A0 → A0)."},{"tipo":"mc","p":"Que prefixo identifica endereços link-local?","opcoes":["2000::/3","FC00::/7","FE80::/10","FF00::/8"],"correta":2,"explica":"FE80::/10."},{"tipo":"vf","p":"O IPv6 usa broadcast para descobrir vizinhos.","correta":false,"explica":"IPv6 não tem broadcast; usa multicast (NDP)."},{"tipo":"cmd","p":"Que comando global ativa o encaminhamento IPv6 num router Cisco?","respostas":["ipv6 unicast-routing"],"explica":"Sem ele o router não encaminha pacotes IPv6 nem envia RAs."},{"tipo":"mc","p":"No EUI-64, que valor é inserido no meio do MAC?","opcoes":["FFFF","FFFE","FE80","0000"],"correta":1,"explica":"FFFE no meio e inverte-se o 7.º bit."}],"referencias":["rfc8200","rfc4291","rfc4861","rfc4862","odom1"],"video":{"cenas":[{"tipo":"abertura","bloco":-1,"titulo":"IPv6 essencial","falas":[{"t":"IPv6 essencial","f":"Módulo 3. Aula: i pê vê seis essencial."},{"t":"Nesta aula vai aprender a:","f":"Nesta aula vai aprender a:"},{"t":"Abreviar e expandir endereços IPv6.","f":"Abreviar e expandir endereços i pê vê seis.","item":0},{"t":"Distinguir global unicast, link-local, unique local e multicast.","f":"Distinguir glôbal iunicast, línk lôucal, iuníque lôcal e multicast.","item":1},{"t":"Configurar IPv6 num router, incluindo EUI-64 e SLAAC.","f":"Configurar i pê vê seis num ráuter, incluindo EUI-64 e slác.","item":2}]},{"tipo":"figura","bloco":0,"titulo":"","falas":[{"t":"Cabeçalho IPv6: 40 bytes fixos, mais simples que o IPv4 (sem checksum nem fragmentação nos routers).","f":"Observe a ilustração. Cabeçalho i pê vê seis: 40 bytes fixos, mais simples que o i pê vê quatro (sem checksum nem fragmentação nos ráuters)."}]},{"tipo":"texto","bloco":1,"titulo":"Porquê IPv6","falas":[{"t":"Porquê IPv6.","f":"Porquê i pê vê seis."},{"t":"O IPv4 tem cerca de 4,3 mil milhões de endereços e esgotou-se.","f":"O i pê vê quatro tem cerca de 4,3 mil milhões de endereços e esgotou-se."},{"t":"O IPv6 tem 128 bits (3,4 × 10^38), escritos em 8 grupos de 4 dígitos hexadecimais: 2001:0DB8:0000:0000:0000:0000:0000:0001.","f":"O i pê vê seis tem 128 bits (3,4 vezes 10 elevado a 38), escritos em 8 grupos de 4 dígitos hexad
