… secret","Hash (tipo 5 MD5, 8 PBKDF2 ou 9 scrypt, conforme versão)"]]},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer o 'crypto key generate rsa' pergunta o tamanho e conclui instantaneamente.","Testa SSH no PC simulado: Desktop › Command Prompt › ssh -l admin 192.168.1.1.","Algumas opções (algorithm-type scrypt, ip ssh time-out) podem não existir."],"real":["Gerar chaves de 2048/4096 bits demora alguns segundos.","Clientes SSH modernos (OpenSSH recente) podem recusar algoritmos antigos de IOS velhos: pode ser preciso -oKexAlgorithms=+diffie-hellman-group14-sha1.","Antes de 'transport input ssh' confirme que consegue entrar por SSH, ou fica trancado fora (só resta a consola).","Em produção use AAA com TACACS+/RADIUS, não só utilizadores locais."]},{"tipo":"alerta","html":"Nunca use Telnet em produção: tudo, incluindo palavras-passe, passa em texto claro e qualquer analisador (Wireshark) lê."},{"tipo":"video","titulo":"Configurar SSH em router Cisco","busca":"configurar SSH router switch Cisco passo a passo","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando dá ao router o nome R1?","respostas":["hostname R1"],"explica":"hostname R1 no modo de configuração global."},{"tipo":"mc","p":"Qual a forma mais segura de proteger o modo privilegiado?","opcoes":["enable password","enable secret","service password-encryption","login"],"correta":1,"explica":"enable secret guarda um hash."},{"tipo":"mc","p":"O que é obrigatório para gerar chaves RSA?","opcoes":["hostname e ip domain-name","Um servidor TACACS+","Interface loopback","Um servidor NTP"],"correta":0,"explica":"O nome das chaves usa hostname.domínio."},{"tipo":"cmd","p":"Na linha vty, que comando permite apenas SSH?","respostas":["transport input ssh"],"explica":"transport input ssh."},{"tipo":"vf","p":"As interfaces dos routers Cisco vêm ativas por defeito.","correta":false,"explica":"Vêm em shutdown (administratively down). Nos switches estão ativas."}],"referencias":["cisco_ios","rfc4253","odom1","nist"]},{"id":"m4l3","titulo":"Verificar e resolver problemas","minutos":18,"nivel":"básico","objetivos":["Ler show ip interface brief e show interfaces","Usar ping, traceroute, CDP e LLDP","Interpretar estados up/down e contadores de erro"],"blocos":[{"tipo":"saida","titulo":"show ip interface brief","texto":"R1#show ip interface brief\nInterface              IP-Address      OK? Method Status                Protocol\nGigabitEthernet0/0     192.168.1.1     YES manual up                    up\nGigabitEthernet0/1     10.0.0.1        YES manual up                    down\nGigabitEthernet0/2     unassigned      YES unset  administratively down down\nLoopback0              1.1.1.1         YES manual up                    up","explica":"Leia as duas colunas finais: Status (camada 1) e Protocol (camada 2)."},{"tipo":"tabela","titulo":"Os estados das interfaces","cabecalho":["Status / Protocol","Significado","Causa provável"],"linhas":[["up / up","Tudo bem","—"],["administratively down / down","Desligada por configuração","Falta no shutdown"],["down / down","Sem sinal físico","Cabo desligado/avariado, outra ponta desligada"],["up / down","Camada 1 ok, camada 2 não","Encapsulamento diferente, clock rate, keepalives"],["down / down (err-disabled)","Desligada por proteção","Port security, BPDU guard"]]},{"tipo":"saida","titulo":"Contadores em show interfaces g0/0","texto":"  5 minute input rate 2000 bits/sec, 3 packets/sec\n     12045 packets input, 1544320 bytes, 0 no buffer\n     0 runts, 0 giants, 0 throttles\n     157 input errors, 157 CRC, 0 frame, 0 overrun, 0 ignored\n     0 output errors, 34 collisions, 2 interface resets\n     12 late collision, 0 deferred","explica":"CRC a subir = problema físico (cabo, interferência). Late collisions = quase sempre duplex mismatch."},{"tipo":"cli","titulo":"Ferramentas de teste","passos":[{"prompt":"R1#","cmd":"ping 192.168.1.10","explica":"!!!!! = sucesso; . = timeout; U = destino inalcançável."},{"prompt":"R1#","cmd":"ping 8.8.8.8 source g0/0","explica":"Ping estendido escolhendo a origem."},{"prompt":"R1#","cmd":"traceroute 10.2.2.2","explica":"Mostra cada salto até ao destino."},{"prompt":"R1#","cmd":"show cdp neighbors","explica":"Vizinhos Cisco diretamente ligados (CDP, ativo por defeito)."},{"prompt":"R1#","cmd":"show cdp neighbors detail","explica":"Inclui IP e versão de IOS do vizinho."},{"prompt":"R1(config)#","cmd":"lldp run","explica":"Ativa LLDP (norma aberta, IEEE 802.1AB) — desligado por defeito no IOS."},{"prompt":"R1#","cmd":"show lldp neighbors","explica":"Vizinhos LLDP, incluindo outros fabricantes."},{"prompt":"R1#","cmd":"show running-config | include hostname","explica":"Filtra a saída (também section, begin, exclude)."}],"nota":""},{"tipo":"tabela","titulo":"Comandos nos hosts","cabecalho":["SO","Ver IP","Ping","Traçar rota","DNS"],"linhas":[["Windows","ipconfig /all","ping","tracert","nslookup"],["Linux","ip addr","ping","traceroute","dig / nslookup"],["macOS","ifconfig","ping","traceroute","dig / nslookup"]]},{"tipo":"exemplo","titulo":"Metodologia","html":"<p>1) Definir o problema → 2) recolher informação (<code>show</code>, perguntar ao utilizador) → 3) analisar → 4) eliminar causas (OSI de baixo para cima, de cima para baixo ou “dividir para conquistar”) → 5) testar a solução → 6) <b>documentar</b>.</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O modo Simulation do Packet Tracer mostra cada pacote a andar, ótimo para perceber ARP e ICMP.","Contadores de erro quase sempre a zero."],"real":["Use Wireshark num port mirror (SPAN) para ver os pacotes reais.","Contadores com CRC, input errors e drops são comuns e são a primeira pista.","Por segurança, CDP/LLDP costumam estar desligados em portas viradas para fora (no cdp enable).","O primeiro ping costuma perder 1 resposta (.!!!!) enquanto o ARP resolve — é normal."]},{"tipo":"video","titulo":"Troubleshooting Cisco show commands","busca":"Cisco show ip interface brief troubleshooting CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Uma interface mostra 'administratively down'. O que fazer?","opcoes":["Trocar o cabo","Executar no shutdown","Mudar o duplex","Reiniciar"],"correta":1,"explica":"Foi desligada por configuração."},{"tipo":"mc","p":"Muitos 'late collisions' indicam normalmente…","opcoes":["Cabo cruzado","Duplex mismatch","VLAN errada","Falta de rota"],"correta":1,"explica":"Um lado em half-duplex e outro em full."},{"tipo":"cmd","p":"Que comando mostra os vizinhos Cisco diretamente ligados?","respostas":["show cdp neighbors","sh cdp nei","show cdp neighbors detail","sh cdp neighbors"],"explica":"show cdp neighbors."},{"tipo":"vf","p":"LLDP é um protocolo proprietário da Cisco.","correta":false,"explica":"LLDP é norma IEEE 802.1AB. O proprietário é o CDP."},{"tipo":"mc","p":"No resultado de um ping Cisco, '.' significa…","opcoes":["Sucesso","Timeout","Destino inalcançável","TTL expirado"],"correta":1,"explica":"Ponto = sem resposta dentro do tempo."}],"referencias":["cisco_ios","odom1","netacad_srwe"]},{"id":"m4l4","titulo":"Simulador × equipamento real","minutos":18,"nivel":"intermédio","objetivos":["Escolher entre Packet Tracer, GNS3, EVE-NG e CML","Conhecer o arranque do IOS, a flash e o ROMMON","Fazer backup, atualizar IOS e recuperar palavra-passe"],"blocos":[{"tipo":"tabela","titulo":"Onde praticar","cabecalho":["Ferramenta","O que é","Prós","Contras"],"linhas":[["Cisco Packet Tracer","Simulador gratuito (NetAcad)","Leve, corre em qualquer PC, ideal para CCNA","IOS simulado: comandos limitados"],["Cisco CML","Emulação com imagens Cisco oficiais","IOS real (IOSv, IOS-XE, NX-OS)","Pago; exige muita RAM"],["GNS3","Emulador gratuito","Mistura imagens reais, VMs e PCs","Precisa de imagens próprias"],["EVE-NG","Plataforma web de emulação","Multi-fabricante, labs grandes","Instalação mais técnica"],["Equipamento usado","Switches/routers reais","Experiência física: cabos, consola, LEDs, ruído","Custo, espaço, consumo"]]},{"tipo":"figura","nome":"painel_router","legenda":"Num equipamento real vai ligar a consola, ver LEDs e ouvir as ventoinhas."},{"tipo":"texto","titulo":"O arranque de um equipamento Cisco","html":"<ol>\n<li><b>POST</b> (teste do hardware) e carregamento do <b>bootstrap</b> a partir da ROM.</li>\n<li>Localiza e carrega o <b>IOS</b> (normalmente da <b>flash</b>; pode vir de TFTP).</li>\n<li>Carrega a <b>startup-config</b> da NVRAM. Se não existir, abre o <i>setup mode</i> (“Would you like to enter the initial configuration dialog?” — responda <b>no</b>).</li>\n</ol>\n<p>O <b>configuration register</b> (normalmente <code>0x2102</code>) controla isto. Com <code>0x2142</code> o router ignora a startup-config: é a base da recuperação de palavra-passe.</p>"},{"tipo":"cli","titulo":"Backup e atualização via TFTP","passos":[{"prompt":"R1#","cmd":"show version","explica":"Modelo, versão do IOS, uptime, config register."},{"prompt":"R1#","cmd":"show flash:","explica":"Ficheiros na flash e espaço livre."},{"prompt":"R1#","cmd":"copy running-config tftp:","explica":"Pede o IP do servidor TFTP e o nome do ficheiro."},{"prompt":"R1#","cmd":"copy tftp: flash:","explica":"Copia uma nova imagem IOS para a flash."},{"prompt":"R1(config)#","cmd":"boot system flash:isr4300-universalk9.17.09.04a.SPA.bin","explica":"Indica que imagem arrancar (exemplo de nome)."},{"prompt":"R1#","cmd":"verify /md5 flash:isr4300-universalk9.17.09.04a.SPA.bin","explica":"Confirma a integridade antes de reiniciar."},{"prompt":"R1#","cmd":"reload","explica":"Reinicia. Guarde a configuração antes!"}],"nota":""},{"tipo":"cli","titulo":"Recuperar a palavra-passe de um router (com acesso físico)","passos":[{"prompt":"—","cmd":"Ligar à consola e reiniciar o router","explica":""},{"prompt":"—","cmd":"Enviar Break nos primeiros 60 s (Ctrl+Break no PuTTY)","explica":"Entra em ROMMON."},{"prompt":"rommon 1 >","cmd":"confreg 0x2142","explica":"Arranque a ignorar a startup-config."},{"prompt":"rommon 2 >","cmd":"reset","explica":"Reinicia."},{"prompt":"Router#","cmd":"copy startup-config running-config","explica":"Recupera a configuração antiga para a RAM (responda no ao setup antes)."},{"prompt":"R1(config)#","cmd":"enable secret NovaPass#1","explica":"Define nova palavra-passe."},{"prompt":"R1(config)#","cmd":"config-register 0x2102","explica":"Repõe o arranque normal!"},{"prompt":"R1#","cmd":"copy running-config startup-config","explica":"Guardar."}],"nota":"Em switches Catalyst o processo é diferente (botão MODE ao ligar)."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Equipamentos ligam em segundos; reload é quase instantâneo.","Pode apagar tudo sem riscos e recomeçar o laboratório.","Não existe ROMMON real nem imagens IOS para atualizar (na maioria dos casos)."],"real":["Um reload de um switch empresarial pode demorar vários minutos — planeie janelas de manutenção.","Uma imagem IOS errada ou corrompida pode deixar o equipamento em ROMMON: tenha sempre um plano de reversão.","Licenças (ex.: DNA/Network Advantage) podem limitar funcionalidades.","Documente tudo, use controlo de alterações e guarde backups fora do equipamento.","Equipamentos usados podem vir com configuração antiga: <code>write erase</code> + <code>delete vlan.dat</code> (switch) + <code>reload</code>."]},{"tipo":"dica","html":"Para o exame, o Packet Tracer chega para quase tudo. Para a vida real, ganhe experiência física com 2 switches e 1 router usados — é barato e ensina muito."},{"tipo":"video","titulo":"Packet Tracer vs GNS3 vs equipamento real","busca":"Packet Tracer vs GNS3 vs EVE-NG vs CML lab CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Onde fica guardado normalmente o ficheiro do IOS?","opcoes":["NVRAM","RAM","Flash","ROM"],"correta":2,"explica":"A imagem IOS está na flash."},{"tipo":"mc","p":"Que valor do configuration register ignora a startup-config?","opcoes":["0x2102","0x2142","0x2100","0x0000"],"correta":1,"explica":"0x2142 é usado na recuperação de palavra-passe."},{"tipo":"cmd","p":"Que comando mostra a versão do IOS, uptime e o configuration register?","respostas":["show version","sh ver","sh version","show ver"],"explica":"show version."},{"tipo":"vf","p":"O Packet Tracer usa as imagens IOS reais da Cisco.","correta":false,"explica":"É um simulador: o IOS é reproduzido e tem comandos limitados. O CML usa imagens reais."},{"tipo":"mc","p":"Para limpar a configuração de um switch usado deve…","opcoes":["Só reload","write erase, delete vlan.dat e reload","copy run start","no shutdown"],"correta":1,"explica":"A base de dados de VLANs fica no vlan.dat, separada da config."}],"referencias":["cisco_ios","cisco_pt","odom1","lammle"]}],"prova_extra":[{"tipo":"mc","p":"Um técnico configura 'transport input ssh' mas o SSH não funciona. A causa mais provável é…","opcoes":["Faltam as chaves RSA","Falta o comando no shutdown na vty","O CDP está ativo","A consola tem palavra-passe"],"correta":0,"explica":"Sem 'crypto key generate rsa' (e domain-name) o servidor SSH não arranca."},{"tipo":"mc","p":"Interface up/down numa ligação serial. Suspeita principal?","opcoes":["Cabo desligado","Encapsulamento diferente nas pontas","Falta no shutdown","IP duplicado"],"correta":1,"explica":"Camada 1 ok, camada 2 falha: HDLC vs PPP, por exemplo."},{"tipo":"cmd","p":"Escreva o comando para gerar chaves RSA de 2048 bits.","respostas":["crypto key generate rsa modulus 2048","crypto key generate rsa general-keys modulus 2048"],"explica":"crypto key generate rsa modulus 2048."}]},{"id":"m5","numero":5,"titulo":"Acesso à Rede: Switching e Wi-Fi","descricao":"Como os switches aprendem, VLANs, trunks, encaminhamento entre VLANs, Spanning Tree, EtherChannel e redes sem fios.","dominio":"2.0 Network Access","icone":"switch","licoes":[{"id":"m5l0","titulo":"Comece por aqui: switches e VLANs sem complicações","minutos":10,"nivel":"básico","objetivos":["Perceber o que faz um switch","Perceber para que serve uma VLAN"],"blocos":[{"tipo":"texto","titulo":"O switch é o carteiro do edifício","html":"<p>Num edifício, o carteiro conhece o nome de quem mora em cada apartamento e entrega cada carta na porta certa. O <b>switch</b> faz o mesmo: aprende que equipamento está ligado em cada porta e envia cada mensagem só para quem deve.</p>"},{"tipo":"texto","titulo":"A VLAN separa departamentos","html":"<p>Imagine que no mesmo edifício trabalham a Contabilidade, a Receção e os Convidados. Não quer que um convidado veja os ficheiros da Contabilidade. Uma <b>VLAN</b> divide o mesmo switch em várias redes separadas, como se cada departamento tivesse o seu próprio switch.</p>"},{"tipo":"topologia","nos":[{"id":"sw","tipo":"switch","x":50,"y":50,"rotulo":"Switch"},{"id":"a","tipo":"pc","x":12,"y":15,"rotulo":"Contabilidade VLAN 10"},{"id":"b","tipo":"pc","x":12,"y":85,"rotulo":"Receção VLAN 20"},{"id":"c","tipo":"portatil","x":88,"y":15,"rotulo":"Convidados VLAN 30"},{"id":"ap","tipo":"ap","x":88,"y":85,"rotulo":"Wi-Fi"}],"ligacoes":[{"a":"a","b":"sw","rotulo":""},{"a":"b","b":"sw","rotulo":""},{"a":"c","b":"sw","rotulo":""},{"a":"ap","b":"sw","rotulo":""}],"legenda":"Um só switch, três redes separadas."},{"tipo":"exemplo","titulo":"Num hospital","html":"<p>Equipamentos médicos, computadores administrativos e Wi-Fi para visitantes ficam em VLANs diferentes. Se o portátil de um visitante tiver um vírus, não chega aos equipamentos médicos.</p>"},{"tipo":"video","titulo":"O que é uma VLAN","busca":"o que é VLAN explicação simples switch","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"O que faz o switch com uma mensagem para um equipamento que conhece?","opcoes":["Envia para todas as portas","Envia só para a porta desse equipamento","Apaga-a","Envia para a Internet"],"correta":1,"explica":"Encaminha só para a porta certa."},{"tipo":"mc","p":"Para que serve uma VLAN?","opcoes":["Aumentar o Wi-Fi","Separar redes no mesmo switch","Carregar telemóveis","Substituir o router"],"correta":1,"explica":"Separa grupos em redes diferentes."},{"tipo":"vf","p":"Equipamentos em VLANs diferentes comunicam diretamente sem router.","correta":false,"explica":"Precisam de um router ou switch L3."}],"referencias":["netacad_srwe","odom1"]},{"id":"m5l1","titulo":"Como um switch funciona","minutos":12,"nivel":"básico","objetivos":["Descrever aprendizagem, encaminhamento, inundação e filtragem","Distinguir domínio de colisão e de broadcast"],"blocos":[{"tipo":"texto","titulo":"As quatro ações do switch","html":"<ol>\n<li><b>Aprender</b>: lê o MAC de <i>origem</i> de cada trama e regista “este MAC está na porta X” (envelhece após 300 s sem tráfego).</li>\n<li><b>Encaminhar</b>: se conhece o MAC de <i>destino</i>, envia só para essa porta.</li>\n<li><b>Inundar (flood)</b>: destino desconhecido, broadcast ou multicast → envia por todas as portas da VLAN, menos a de entrada.</li>\n<li><b>Filtrar</b>: se o destino está na mesma porta de entrada, descarta.</li>\n</ol>"},{"tipo":"topologia","nos":[{"id":"a","tipo":"pc","x":10,"y":20,"rotulo":"PC A Fa0/1"},{"id":"b","tipo":"pc","x":10,"y":80,"rotulo":"PC B Fa0/2"},{"id":"sw","tipo":"switch","x":50,"y":50,"rotulo":"SW1"},{"id":"c","tipo":"pc","x":90,"y":20,"rotulo":"PC C Fa0/3"},{"id":"d","tipo":"pc","x":90,"y":80,"rotulo":"PC D Fa0/4"}],"ligacoes":[{"a":"a","b":"sw","rotulo":""},{"a":"b","b":"sw","rotulo":""},{"a":"sw","b":"c","rotulo":""},{"a":"sw","b":"d","rotulo":""}],"legenda":"Cada porta do switch é um domínio de colisão; todas juntas (na mesma VLAN) são um domínio de broadcast."},{"tipo":"tabela","titulo":"","cabecalho":["Equipamento","Domínios de colisão","Domínios de broadcast"],"linhas":[["Hub","1 para todas as portas","1"],["Switch (1 VLAN)","1 por porta","1"],["Router","1 por interface","1 por interface"]]},{"tipo":"saida","titulo":"show mac address-table","texto":"SW1#show mac address-table\n          Mac Address Table\n-------------------------------------------\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n   1    0050.7966.6800    DYNAMIC     Fa0/1\n   1    0050.7966.6801    DYNAMIC     Fa0/2\n  10    00d0.ba8e.7a01    STATIC      Fa0/3","explica":""},{"tipo":"texto","titulo":"Métodos de comutação","html":"<ul>\n<li><b>Store-and-forward</b>: recebe a trama inteira e verifica o FCS. Padrão na maioria dos switches Cisco.</li>\n<li><b>Cut-through</b>: começa a enviar logo que lê o MAC de destino. Menor latência, mas propaga tramas com erros.</li>\n</ul>"},{"tipo":"video","titulo":"Como funciona um switch","busca":"como funciona switch tabela MAC CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"O switch aprende endereços a partir do…","opcoes":["MAC de destino","MAC de origem","IP de origem","FCS"],"correta":1,"explica":"Lê sempre o MAC de origem."},{"tipo":"mc","p":"O que faz o switch com uma trama para um MAC desconhecido?","opcoes":["Descarta","Inunda pela VLAN","Envia ao router","Responde com ARP"],"correta":1,"explica":"Unknown unicast flooding."},{"tipo":"mc","p":"Quantos domínios de broadcast tem um switch de 24 portas, todas na VLAN 1?","opcoes":["1","2","24","48"],"correta":0,"explica":"Uma VLAN = um domínio de broadcast."},{"tipo":"vf","p":"O tempo padrão de envelhecimento da tabela MAC nos switches Cisco é 300 segundos.","correta":true,"explica":"5 minutos."}],"referencias":["ieee8021d","odom1","netacad_srwe"]},{"id":"m5l2","titulo":"VLANs e trunks 802.1Q","minutos":22,"nivel":"intermédio","objetivos":["Criar VLANs e atribuir portas de acesso","Configurar trunks 802.1Q e a VLAN nativa","Conhecer DTP e VTP e porque se desligam"],"blocos":[{"tipo":"texto","titulo":"O que é uma VLAN","html":"<p>Uma <b>VLAN</b> divide um switch físico em várias redes lógicas. Cada VLAN é um <b>domínio de broadcast</b> separado e, normalmente, uma <b>sub-rede IP</b> própria. Vantagens: segurança, menos broadcast e organização por função (Vendas, TI, Voz, Convidados) em vez de por localização.</p>"},{"tipo":"topologia","nos":[{"id":"sw1","tipo":"switch","x":25,"y":50,"rotulo":"SW1"},{"id":"sw2","tipo":"switch","x":75,"y":50,"rotulo":"SW2"},{"id":"v1","tipo":"pc","x":8,"y":15,"rotulo":"Vendas V10"},{"id":"t1","tipo":"pc","x":8,"y":85,"rotulo":"TI V20"},{"id":"v2","tipo":"pc","x":92,"y":15,"rotulo":"Vendas V10"},{"id":"t2","tipo":"pc","x":92,"y":85,"rotulo":"TI V20"}],"ligacoes":[{"a":"v1","b":"sw1","rotulo":"access"},{"a":"t1","b":"sw1","rotulo":"access"},{"a":"sw1","b":"sw2","rotulo":"trunk 802.1Q"},{"a":"sw2","b":"v2","rotulo":"access"},{"a":"sw2","b":"t2","rotulo":"access"}],"legenda":"O trunk transporta várias VLANs no mesmo cabo, marcando cada trama com a etiqueta (tag) da VLAN."},{"tipo":"cli","titulo":"Criar VLANs e portas de acesso","passos":[{"prompt":"SW1(config)#","cmd":"vlan 10","explica":"Cria a VLAN 10."},{"prompt":"SW1(config-vlan)#","cmd":"name VENDAS","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"vlan 20","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"name TI","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"exit","explica":""},{"prompt":"SW1(config)#","cmd":"interface range fa0/1 - 10","explica":"Configura várias portas de uma vez."},{"prompt":"SW1(config-if-range)#","cmd":"switchport mode access","explica":"Porta de acesso (uma VLAN, sem tag)."},{"prompt":"SW1(config-if-range)#","cmd":"switchport access vlan 10","explica":""},{"prompt":"SW1(config-if-range)#","cmd":"interface fa0/11","explica":""},{"prompt":"SW1(config-if)#","cmd":"switchport mode access","explica":""},{"prompt":"SW1(config-if)#","cmd":"switchport access vlan 20","explica":""},{"prompt":"SW1(config-if)#","cmd":"switchport voice vlan 150","explica":"Telefone IP marca a voz na VLAN 150; o PC atrás dele fica na VLAN de dados."},{"prompt":"SW1#","cmd":"show vlan brief","explica":"Confirma VLANs e portas."}],"nota":""},{"tipo":"figura","nome":"trama_ethernet","legenda":"No trunk, o 802.1Q insere uma etiqueta de 4 bytes (TPID 0x8100 + PCP + VLAN ID de 12 bits) entre o MAC de origem e o campo Tipo."},{"tipo":"cli","titulo":"Configurar um trunk","passos":[{"prompt":"SW1(config)#","cmd":"interface g0/1","explica":""},{"prompt":"SW1(config-if)#","cmd":"switchport trunk encapsulation dot1q","explica":"Só em switches que também suportam ISL (ex.: 3560). Nos 2960 não existe."},{"prompt":"SW1(config-if)#","cmd":"switchport mode trunk","explica":"Trunk fixo."},{"prompt":"SW1(config-if)#","cmd":"switchport trunk native vlan 99","explica":"VLAN nativa (vai sem tag). Tem de coincidir nas duas pontas!"},{"prompt":"SW1(config-if)#","cmd":"switchport trunk allowed vlan 10,20,99","explica":"Só deixa passar estas VLANs."},{"prompt":"SW1(config-if)#","cmd":"switchport nonegotiate","explica":"Desliga o DTP."},{"prompt":"SW1#","cmd":"show interfaces trunk","explica":"Estado, VLAN nativa e VLANs permitidas."}],"nota":""},{"tipo":"tabela","titulo":"Resultado da negociação DTP","cabecalho":["Modo DTP (SW1 \\ SW2)","dynamic auto","dynamic desirable","trunk","access"],"linhas":[["dynamic auto","access","trunk","trunk","access"],["dynamic desirable","trunk","trunk","trunk","access"],["trunk","trunk","trunk","trunk","(erro)"]]},{"tipo":"texto","titulo":"VLANs especiais","html":"<ul>\n<li><b>VLAN 1</b>: por defeito todas as portas estão nela; não a use para utilizadores.</li>\n<li><b>VLAN nativa</b>: tráfego sem tag no trunk (padrão VLAN 1). Mude para uma VLAN não usada (ataques de <i>VLAN hopping</i> com dupla etiqueta).</li>\n<li><b>VLANs de intervalo normal</b>: 1–1005 (guardadas no vlan.dat). <b>Estendido</b>: 1006–4094.</li>\n<li><b>VTP</b> (proprietário Cisco) propaga VLANs entre switches. Um switch com número de revisão maior pode apagar as VLANs de toda a rede — muitas empresas usam <code>vtp mode transparent</code> ou <code>off</code>.</li>\n</ul>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer o 2960 negocia trunk facilmente com DTP.","Mensagens de 'native VLAN mismatch' aparecem como no IOS real (via CDP)."],"real":["Em produção, configure sempre trunks estáticos e <code>switchport nonegotiate</code>.","Num trunk com outro fabricante, o DTP não existe: configure trunk manualmente dos dois lados.","Ao adicionar uma VLAN a um trunk use <code>switchport trunk allowed vlan <b>add</b> 30</code> — sem 'add' substitui a lista e pode cortar a rede!"]},{"tipo":"video","titulo":"VLANs e trunks","busca":"VLAN trunk 802.1Q configuração Cisco CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando atribui a porta à VLAN 10 (no modo interface)?","respostas":["switchport access vlan 10"],"explica":"switchport access vlan 10."},{"tipo":"mc","p":"Quantos bits tem o VLAN ID na etiqueta 802.1Q?","opcoes":["8","10","12","16"],"correta":2,"explica":"12 bits → 4096 valores (0 e 4095 reservados)."},{"tipo":"mc","p":"Dois switches com 'dynamic auto' nas duas pontas formam…","opcoes":["Trunk","Access","EtherChannel","Erro"],"correta":1,"explica":"Ambos esperam que o outro peça: fica access."},{"tipo":"vf","p":"O tráfego da VLAN nativa atravessa o trunk sem etiqueta.","correta":true,"explica":"Por isso tem de coincidir nos dois lados."},{"tipo":"cmd","p":"Que comando mostra as VLANs e as portas atribuídas?","respostas":["show vlan brief","sh vlan brief","sh vlan br","show vlan"],"explica":"show vlan brief."},{"tipo":"mc","p":"Para adicionar a VLAN 30 a um trunk sem remover as outras:","opcoes":["switchport trunk allowed vlan 30","switchport trunk allowed vlan add 30","vlan 30 trunk","switchport access vlan 30"],"correta":1,"explica":"O 'add' acrescenta à lista existente."}],"referencias":["ieee8021q","odom1","netacad_srwe"]},{"id":"m5l3","titulo":"Encaminhamento entre VLANs","minutos":18,"nivel":"intermédio","objetivos":["Configurar router-on-a-stick com subinterfaces","Configurar SVIs num switch multicamada"],"blocos":[{"tipo":"texto","titulo":"Porque é preciso","html":"<p>VLANs diferentes são redes IP diferentes: para comunicarem precisam de um <b>router</b> ou de um <b>switch L3</b>. Existem três formas: um router com uma interface por VLAN (antiquado), <b>router-on-a-stick</b> e <b>SVIs em switch L3</b> (a mais usada nas empresas).</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":50,"y":12,"rotulo":"R1"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW1"},{"id":"a","tipo":"pc","x":20,"y":90,"rotulo":"PC VLAN10 192.168.10.10"},{"id":"b","tipo":"pc","x":80,"y":90,"rotulo":"PC VLAN20 192.168.20.10"}],"ligacoes":[{"a":"r1","b":"sw","rotulo":"trunk (g0/0.10 e .20)"},{"a":"sw","b":"a","rotulo":""},{"a":"sw","b":"b","rotulo":""}],"legenda":"Router-on-a-stick: uma única ligação física em trunk com subinterfaces."},{"tipo":"cli","titulo":"Router-on-a-stick","passos":[{"prompt":"R1(config)#","cmd":"interface g0/0","explica":""},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"Liga a interface física."},{"prompt":"R1(config-if)#","cmd":"interface g0/0.10","explica":"Subinterface para a VLAN 10."},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 10","explica":"Associa à VLAN 10 (tem de vir antes do IP)."},{"prompt":"R1(config-subif)#","cmd":"ip address 192.168.10.1 255.255.255.0","explica":"Gateway da VLAN 10."},{"prompt":"R1(config-subif)#","cmd":"interface g0/0.20","explica":""},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 20","explica":""},{"prompt":"R1(config-subif)#","cmd":"ip address 192.168.20.1 255.255.255.0","explica":""},{"prompt":"R1(config-subif)#","cmd":"interface g0/0.99","explica":""},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 99 native","explica":"Se usar VLAN nativa no trunk."},{"prompt":"SW1(config-if)#","cmd":"switchport mode trunk","explica":"Do lado do switch a porta é trunk."}],"nota":""},{"tipo":"cli","titulo":"SVIs num switch multicamada","passos":[{"prompt":"DSW1(config)#","cmd":"ip routing","explica":"Ativa o encaminhamento IP (desligado por defeito)."},{"prompt":"DSW1(config)#","cmd":"interface vlan 10","explica":"Cria a SVI da VLAN 10."},{"prompt":"DSW1(config-if)#","cmd":"ip address 192.168.10.1 255.255.255.0","explica":""},{"prompt":"DSW1(config-if)#","cmd":"no shutdown","explica":""},{"prompt":"DSW1(config-if)#","cmd":"interface vlan 20","explica":""},{"prompt":"DSW1(config-if)#","cmd":"ip address 192.168.20.1 255.255.255.0","explica":""},{"prompt":"DSW1(config-if)#","cmd":"interface g1/0/24","explica":""},{"prompt":"DSW1(config-if)#","cmd":"no switchport","explica":"Porta roteada (L3) para ligar ao router de Internet."},{"prompt":"DSW1(config-if)#","cmd":"ip address 10.0.0.2 255.255.255.252","explica":""}],"nota":"Uma SVI só fica up/up se a VLAN existir e houver pelo menos uma porta ativa nessa VLAN (ou trunk que a transporte)."},{"tipo":"tabela","titulo":"","cabecalho":["","Router-on-a-stick","Switch L3 (SVI)"],"linhas":[["Custo","Baixo (usa router existente)","Maior"],["Desempenho","Limitado a 1 ligação","Velocidade de hardware (ASIC)"],["Escala","Poucas VLANs/tráfego","Campus empresarial"],["Ponto de falha","Uma ligação","Pode ter redundância (HSRP)"]]},{"tipo":"dica","html":"Erro clássico: PC sem acesso a outras VLANs porque o <b>gateway</b> configurado no PC não é o IP da subinterface/SVI da sua VLAN."},{"tipo":"video","titulo":"Inter-VLAN routing","busca":"inter VLAN routing router on a stick SVI configuração","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando associa uma subinterface à VLAN 30?","respostas":["encapsulation dot1q 30","encapsulation dot1Q 30"],"explica":"encapsulation dot1Q 30."},{"tipo":"cmd","p":"Que comando ativa o encaminhamento IP num switch multicamada?","respostas":["ip routing"],"explica":"ip routing."},{"tipo":"vf","p":"Uma SVI pode ficar up/up mesmo sem nenhuma porta ativa na sua VLAN.","correta":false,"explica":"Precisa de pelo menos uma porta ativa (access ou trunk) nessa VLAN."},{"tipo":"mc","p":"No router-on-a-stick, a porta do switch ligada ao router deve estar em modo…","opcoes":["access","trunk","routed","voice"],"correta":1,"explica":"Trunk, para levar todas as VLANs."},{"tipo":"cmd","p":"Que comando transforma uma porta de switch L3 numa porta roteada?","respostas":["no switchport"],"explica":"no switchport."}],"referencias":["odom1","netacad_srwe","lammle"]},{"id":"m5l4","titulo":"Spanning Tree (STP e RSTP)","minutos":25,"nivel":"avançado","objetivos":["Explicar porque os loops de camada 2 são graves","Eleger root bridge, root ports e designated ports","Configurar PortFast, BPDU Guard e prioridades"],"blocos":[{"tipo":"texto","titulo":"O problema","html":"<p>Ligações redundantes entre switches criam <b>loops</b>. Como as tramas Ethernet não têm TTL, um broadcast circula para sempre: <b>tempestade de broadcast</b>, tabelas MAC instáveis e tramas duplicadas. A rede para em segundos.</p>\n<p>O <b>Spanning Tree Protocol</b> (802.1D) bloqueia logicamente algumas portas para formar uma árvore sem loops, mantendo a redundância disponível caso uma ligação falhe.</p>"},{"tipo":"figura","nome":"stp","legenda":"Três switches em triângulo: o STP elege a root bridge e bloqueia uma porta."},{"tipo":"texto","titulo":"O algoritmo em 3 passos","html":"<ol>\n<li><b>Eleger a root bridge</b>: menor <b>Bridge ID</b> = prioridade (padrão 32768 + VLAN ID, no PVST+) + MAC. Empate na prioridade → menor MAC ganha.</li>\n<li><b>Root port</b> em cada switch não-root: a porta com menor <b>custo</b> até à root. Desempates: menor Bridge ID do vizinho, depois menor Port ID.</li>\n<li><b>Designated port</b> em cada segmento: a do switch com menor custo até à root. As portas restantes ficam <b>bloqueadas</b> (alternate).</li>\n</ol>"},{"tipo":"tabela","titulo":"Custos de porta (802.1D)","cabecalho":["Velocidade","Custo STP (curto)"],"linhas":[["10 Mbit/s","100"],["100 Mbit/s","19"],["1 Gbit/s","4"],["10 Gbit/s","2"]]},{"tipo":"tabela","titulo":"Estados de porta","cabecalho":["802.1D (STP)","802.1w (RSTP)","Função"],"linhas":[["Blocking","Discarding","Não encaminha, só ouve BPDUs"],["Listening","Discarding","Participa na eleição (15 s)"],["Learning","Learning","Aprende MACs (15 s)"],["Forwarding","Forwarding","Encaminha"],["Disabled","Discarding","Desligada"]]},{"tipo":"texto","titulo":"RSTP e variantes Cisco","html":"<p>O <b>RSTP</b> (802.1w) converge em ~1–2 s em vez de 30–50 s, graças a handshakes (proposal/agreement) e às funções <i>alternate</i> (cópia de segurança da root port) e <i>backup</i>. A Cisco usa <b>PVST+</b> (uma instância por VLAN) e <b>Rapid PVST+</b>.</p>"},{"tipo":"cli","titulo":"Controlar o STP","passos":[{"prompt":"SW1(config)#","cmd":"spanning-tree mode rapid-pvst","explica":"Ativa Rapid PVST+."},{"prompt":"SW1(config)#","cmd":"spanning-tree vlan 10 root primary","explica":"Torna-se root da VLAN 10 (ajusta a prioridade para 24576 ou menos)."},{"prompt":"SW2(config)#","cmd":"spanning-tree vlan 10 priority 28672","explica":"Alternativa: definir a prioridade (múltiplo de 4096)."},{"prompt":"SW1(config)#","cmd":"interface fa0/5","explica":"Porta de um PC."},{"prompt":"SW1(config-if)#","cmd":"spanning-tree portfast","explica":"Passa logo a forwarding (só em portas de host!)."},{"prompt":"SW1(config-if)#","cmd":"spanning-tree bpduguard enable","explica":"Desliga a porta (err-disabled) se receber BPDU."},{"prompt":"SW1(config)#","cmd":"spanning-tree portfast default","explica":"Ativa PortFast em todas as portas access."},{"prompt":"SW1#","cmd":"show spanning-tree vlan 10","explica":"Root, custos, papéis e estados das portas."}],"nota":""},{"tipo":"saida","titulo":"show spanning-tree vlan 10 (resumido)","texto":"VLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority    24586\n             Address     0011.2233.4401\n             This bridge is the root\nInterface           Role Sts Cost      Prio.Nbr Type\n------------------- ---- --- --------- -------- -----------\nGi0/1               Desg FWD 4         128.25   P2p\nGi0/2               Desg FWD 4         128.26   P2p\nFa0/5               Desg FWD 19        128.5    P2p Edge","explica":"Prioridade 24586 = 24576 + VLAN 10. 'Edge' indica PortFast."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer as portas ficam âmbar durante a convergência, como na realidade.","Um loop no simulador apenas deixa o modo Simulation cheio de pacotes."],"real":["Um loop real derruba a rede inteira em segundos: CPU a 100%, LEDs a piscar todos ao mesmo tempo.","Defina SEMPRE a root bridge manualmente (no núcleo/distribuição); não deixe que um switch velho com MAC baixo ganhe.","Use BPDU Guard em todas as portas de utilizador: evita que alguém ligue um switch doméstico e crie loops.","Para recuperar uma porta err-disabled: shutdown + no shutdown (ou errdisable recovery)."]},{"tipo":"video","titulo":"Spanning Tree explicado","busca":"spanning tree protocol STP eleição root bridge CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que switch se torna root bridge?","opcoes":["O de maior MAC","O de menor Bridge ID","O mais rápido","O que tem mais portas"],"correta":1,"explica":"Menor prioridade + MAC."},{"tipo":"mc","p":"Qual o custo STP de uma ligação de 1 Gbit/s?","opcoes":["19","4","2","100"],"correta":1,"explica":"1 Gbit/s = 4."},{"tipo":"mc","p":"Que funcionalidade desliga uma porta PortFast que recebe uma BPDU?","opcoes":["Root Guard","BPDU Guard","Loop Guard","Port Security"],"correta":1,"explica":"BPDU Guard põe a porta em err-disabled."},{"tipo":"vf","p":"A prioridade STP tem de ser um múltiplo de 4096.","correta":true,"explica":"Os 12 bits baixos estão reservados ao ID estendido (VLAN)."},{"tipo":"mc","p":"Em quanto tempo converge normalmente o RSTP?","opcoes":["50 s","30 s","1–2 s","5 min"],"correta":2,"explica":"O RSTP converge em poucos segundos ou menos."},{"tipo":"cmd","p":"Que comando ativa PortFast numa interface?","respostas":["spanning-tree portfast"],"explica":"spanning-tree portfast."}],"referencias":["ieee8021d","ieee8021w","odom1","netacad_srwe"]},{"id":"m5l5","titulo":"EtherChannel (LACP e PAgP)","minutos":15,"nivel":"intermédio","objetivos":["Agregar várias ligações físicas numa lógica","Configurar LACP e verificar o resultado"],"blocos":[{"tipo":"texto","titulo":"Para que serve","html":"<p>Duas ligações de 1 Gbit/s entre switches: o STP bloquearia uma. Com <b>EtherChannel</b>, até 8 ligações físicas ativas tornam-se <b>uma única ligação lógica</b> (Port-channel): mais largura de banda, redundância e o STP vê apenas uma porta.</p>"},{"tipo":"topologia","nos":[{"id":"s1","tipo":"switch","x":25,"y":50,"rotulo":"SW1"},{"id":"s2","tipo":"switch","x":75,"y":50,"rotulo":"SW2"}],"ligacoes":[{"a":"s1","b":"s2","rotulo":"Po1 = Gi0/1 + Gi0/2"}],"legenda":"Duas ligações físicas, uma lógica."},{"tipo":"tabela","titulo":"","cabecalho":["Protocolo","Modos","Forma canal quando"],"linhas":[["LACP (802.3ad / 802.1AX, aberto)","active / passive","active+active ou active+passive"],["PAgP (Cisco)","desirable / auto","desirable+desirable ou desirable+auto"],["Estático","on","on+on (sem negociação)"]]},{"tipo":"cli","titulo":"Configurar LACP","passos":[{"prompt":"SW1(config)#","cmd":"interface range g0/1 - 2","explica":""},{"prompt":"SW1(config-if-range)#","cmd":"channel-group 1 mode active","explica":"LACP ativo; cria a interface Port-channel1."},{"prompt":"SW1(config-if-range)#","cmd":"interface port-channel 1","explica":"Configurações lógicas vão aqui."},{"prompt":"SW1(config-if)#","cmd":"switchport mode trunk","explica":""},{"prompt":"SW1#","cmd":"show etherchannel summary","explica":"Procure (SU) no port-channel e (P) nas portas."}],"nota":""},{"tipo":"saida","titulo":"show etherchannel summary","texto":"Flags:  D - down        P - bundled in port-channel\n        S - Layer2      U - in use       s - suspended\nGroup  Port-channel  Protocol    Ports\n------+-------------+-----------+-------------------------\n1      Po1(SU)         LACP      Gi0/1(P)    Gi0/2(P)","explica":""},{"tipo":"alerta","html":"Todas as portas do grupo têm de ter a mesma velocidade, duplex, modo (access/trunk), VLANs permitidas e VLAN nativa. Uma diferença deixa a porta em estado <b>(s) suspended</b>."},{"tipo":"video","titulo":"EtherChannel LACP","busca":"EtherChannel LACP PAgP configuração Cisco","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que combinação LACP NÃO forma EtherChannel?","opcoes":["active / active","active / passive","passive / passive","Todas formam"],"correta":2,"explica":"Dois passivos esperam um pelo outro."},{"tipo":"mc","p":"Qual o protocolo aberto de agregação?","opcoes":["PAgP","LACP","DTP","VTP"],"correta":1,"explica":"LACP — IEEE 802.3ad / 802.1AX."},{"tipo":"cmd","p":"Que comando mostra o estado dos EtherChannels?","respostas":["show etherchannel summary","sh etherchannel summary","sh eth sum","sh etherchannel sum"],"explica":"show etherchannel summary."},{"tipo":"vf","p":"Com EtherChannel o STP trata as ligações agregadas como uma só.","correta":true,"explica":"Nenhuma das ligações do grupo é bloqueada."}],"referencias":["ieee8021ax","odom1","netacad_srwe"]},{"id":"m5l6","titulo":"Redes sem fios (WLAN)","minutos":22,"nivel":"intermédio","objetivos":["Conhecer as normas 802.11, bandas e canais","Comparar AP autónomo, AP leve com WLC e cloud","Configurar uma WLAN WPA2/WPA3 numa WLC"],"blocos":[{"tipo":"figura","nome":"ap","legenda":"Access point de teto: emite um ou mais SSIDs em 2,4, 5 e 6 GHz."},{"tipo":"tabela","titulo":"Normas Wi-Fi","cabecalho":["Norma","Nome Wi-Fi","Banda","Velocidade máx. teórica"],"linhas":[["802.11b/g","—","2,4 GHz","11 / 54 Mbit/s"],["802.11n","Wi-Fi 4","2,4 e 5 GHz","600 Mbit/s"],["802.11ac","Wi-Fi 5","5 GHz","~6,9 Gbit/s"],["802.11ax","Wi-Fi 6 / 6E","2,4, 5 (e 6) GHz","~9,6 Gbit/s"],["802.11be","Wi-Fi 7","2,4, 5 e 6 GHz","~46 Gbit/s"]]},{"tipo":"texto","titulo":"Canais","html":"<p>Em <b>2,4 GHz</b> só os canais <b>1, 6 e 11</b> não se sobrepõem: use-os em APs vizinhos. Em <b>5 GHz</b> há muitos mais canais e menos interferência, mas menor alcance.</p>\n<p>Termos: <b>SSID</b> (nome da rede), <b>BSS</b> (um AP e os seus clientes), <b>BSSID</b> (MAC do rádio do AP), <b>ESS</b> (vários APs com o mesmo SSID, permitindo roaming).</p>"},{"tipo":"topologia","nos":[{"id":"wlc","tipo":"wlc","x":50,"y":12,"rotulo":"WLC"},{"id":"sw","tipo":"switch","x":50,"y":48,"rotulo":"SW acesso"},{"id":"ap1","tipo":"ap","x":20,"y":85,"rotulo":"AP leve 1"},{"id":"ap2","tipo":"ap","x":80,"y":85,"rotulo":"AP leve 2"}],"ligacoes":[{"a":"wlc","b":"sw","rotulo":"trunk"},{"a":"sw","b":"ap1","rotulo":"access (gestão)"},{"a":"sw","b":"ap2","rotulo":"access (gestão)"}],"legenda":"APs leves falam com a WLC por túneis CAPWAP (UDP 5246 controlo, 5247 dados)."},{"tipo":"tabela","titulo":"Arquiteturas","cabecalho":["Arquitetura","Como funciona"],"linhas":[["Autónoma","Cada AP configurado individualmente; liga a portas trunk se tiver vários SSIDs"],["Leve + WLC (split-MAC)","AP trata funções em tempo real; WLC gere o resto via CAPWAP. Porta do AP em modo access"],["Cloud (ex.: Meraki)","Gestão por portal na cloud; dados ficam na rede local"],["FlexConnect","AP numa filial comuta tráfego localmente mesmo se perder a WLC"]]},{"tipo":"tabela","titulo":"Segurança Wi-Fi","cabecalho":["Segurança","Estado"],"linhas":[["WEP","Quebrado — nunca usar"],["WPA (TKIP)","Obsoleto"],["WPA2 (AES-CCMP)","Aceitável"],["WPA3 (SAE, GCMP)","Recomendado"],["Personal (PSK/SAE)","Uma palavra-passe partilhada"],["Enterprise (802.1X + RADIUS)","Credenciais por utilizador"]]},{"tipo":"cli","titulo":"Criar uma WLAN numa WLC (interface web/GUI)","passos":[{"prompt":"GUI","cmd":"WLANs › Create New › Go","explica":"Tipo WLAN, nome do perfil e SSID (ex.: EMPRESA)."},{"prompt":"GUI","cmd":"General: Status = Enabled; Interface = vlan-dados","explica":"Associa a WLAN a uma interface dinâmica (VLAN)."},{"prompt":"GUI","cmd":"Security › Layer 2: WPA2/WPA3 + AES","explica":"Escolha PSK ou 802.1X."},{"prompt":"GUI","cmd":"Security › AAA Servers: servidor RADIUS","explica":"Para WPA2/3-Enterprise."},{"prompt":"GUI","cmd":"QoS: Silver (best effort) / Platinum (voz)","explica":""},{"prompt":"GUI","cmd":"Apply","explica":"Os APs começam a emitir o SSID."}],"nota":"O exame CCNA mostra estes ecrãs da GUI da WLC (AireOS) — conheça os separadores General, Security, QoS e Advanced."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem WLC-2504 e APs leves, mas a GUI é simplificada.","Não há interferência, paredes nem vizinhos no mesmo canal."],"real":["Faça um site survey (mapa de calor) antes de instalar APs.","Paredes, metal, água e micro-ondas reduzem o sinal; 5 GHz atravessa menos paredes.","Use PoE (802.3af/at/bt) para alimentar APs pelo cabo de rede — confirme o orçamento de potência do switch.","Separe a rede de convidados numa VLAN própria com isolamento e portal cativo."]},{"tipo":"video","titulo":"Wireless para CCNA","busca":"wireless LAN controller CAPWAP WPA3 CCNA aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quais os canais de 2,4 GHz que não se sobrepõem?","opcoes":["1, 5, 9","1, 6, 11","2, 7, 12","1, 7, 13"],"correta":1,"explica":"1, 6 e 11."},{"tipo":"mc","p":"Que protocolo liga APs leves à WLC?","opcoes":["LWAPP antigo apenas","CAPWAP","CDP","SNMP"],"correta":1,"explica":"CAPWAP: UDP 5246 (controlo) e 5247 (dados)."},{"tipo":"mc","p":"Qual a opção de segurança mais forte?","opcoes":["WEP","WPA-TKIP","WPA2-AES","WPA3-SAE"],"correta":3,"explica":"WPA3 com SAE substitui o PSK."},{"tipo":"vf","p":"A porta do switch ligada a um AP leve (modo local) é normalmente access.","correta":true,"explica":"O tráfego dos SSIDs vai no túnel CAPWAP até à WLC."},{"tipo":"mc","p":"Vários APs com o mesmo SSID formam um…","opcoes":["BSS","IBSS","ESS","BSSID"],"correta":2,"explica":"Extended Service Set — permite roaming."}],"referencias":["ieee80211","wifi_alliance","odom1","netacad_srwe"]}],"prova_extra":[{"tipo":"mc","p":"PCs na VLAN 10 de SW1 não falam com PCs na VLAN 10 de SW2. As VLANs existem nos dois. Verificação a fazer primeiro?","opcoes":["show interfaces trunk","show ip route","show cdp neighbors","show version"],"correta":0,"explica":"Confirme se o trunk está ativo e se a VLAN 10 é permitida."},{"tipo":"mc","p":"Que estado STP existe no 802.1D mas não no RSTP?","opcoes":["Forwarding","Learning","Listening","Discarding"],"correta":2,"explica":"RSTP junta blocking, listening e disabled em discarding."},{"tipo":"vf","p":"PAgP e LACP podem ser misturados no mesmo EtherChannel.","correta":false,"explica":"As duas pontas têm de usar o mesmo protocolo."},{"tipo":"mc","p":"Root bridge da VLAN 1 tem prioridade 32769. Que prioridade configurada tem?","opcoes":["32769","32768","4096","1"],"correta":1,"explica":"32768 + ID da VLAN (1) = 32769."}]},{"id":"m6","numero":6,"titulo":"Conectividade IP: Encaminhamento","descricao":"Tabela de encaminhamento, rotas estáticas, OSPF e redundância de gateway (FHRP). O domínio com mais peso no exame.","dominio":"3.0 IP Connectivity","icone":"router","licoes":[{"id":"m6l0","titulo":"Comece por aqui: o que é encaminhar (routing)?","minutos":10,"nivel":"básico","objetivos":["Perceber o que faz um router com cada pacote","Saber o que é uma rota e uma tabela de encaminhamento"],"blocos":[{"tipo":"texto","titulo":"O router é como o GPS","html":"<p>Quando conduz até outra cidade, segue as placas: “Luanda →”, “Benguela ←”. O router tem uma lista de placas chamada <b>tabela de encaminhamento</b>: para cada rede de destino, diz por onde enviar o pacote.</p>\n<p>Uma <b>rota</b> é uma linha dessa tabela: “para a rede 10.2.0.0, envia para o vizinho 10.0.0.2”. As rotas podem ser escritas à mão (<b>estáticas</b>) ou aprendidas automaticamente com outros routers (<b>dinâmicas</b>, como o OSPF).</p>"},{"tipo":"topologia","nos":[{"id":"a","tipo":"switch","x":8,"y":50,"rotulo":"Sede"},{"id":"r1","tipo":"router","x":32,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":62,"y":20,"rotulo":"R2"},{"id":"r3","tipo":"router","x":62,"y":80,"rotulo":"R3"},{"id":"b","tipo":"switch","x":92,"y":50,"rotulo":"Filial"}],"ligacoes":[{"a":"a","b":"r1","rotulo":""},{"a":"r1","b":"r2","rotulo":""},{"a":"r1","b":"r3","rotulo":""},{"a":"r2","b":"b","rotulo":""},{"a":"r3","b":"b","rotulo":""}],"legenda":"Dois caminhos até à filial: o router escolhe o melhor e usa o outro se o primeiro falhar."},{"tipo":"exemplo","titulo":"A rota por defeito","html":"<p>O router de casa só conhece a rede da casa. Para tudo o resto tem uma regra: “se não sabes, manda para o operador”. Chama-se <b>rota por defeito</b> (0.0.0.0/0), como a placa “todas as direções”.</p>"},{"tipo":"video","titulo":"O que é roteamento","busca":"o que é roteamento routing explicado simples","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Como se chama a lista de rotas de um router?","opcoes":["Tabela MAC","Tabela de encaminhamento","Lista de contactos","VLAN"],"correta":1,"explica":"Routing table."},{"tipo":"mc","p":"Uma rota escrita à mão pelo técnico é…","opcoes":["Dinâmica","Estática","Automática","Wireless"],"correta":1,"explica":"Estática."},{"tipo":"vf","p":"A rota por defeito é usada quando não existe uma rota mais específica.","correta":true,"explica":"É o último recurso."}],"referencias":["odom2","kurose"]},{"id":"m6l1","titulo":"A tabela de encaminhamento","minutos":18,"nivel":"intermédio","objetivos":["Ler cada campo de show ip route","Aplicar a regra do prefixo mais longo","Comparar distância administrativa e métrica"],"blocos":[{"tipo":"saida","titulo":"show ip route","texto":"R1#show ip route\nCodes: L - local, C - connected, S - static, O - OSPF, * - candidate default\nGateway of last resort is 203.0.113.1 to network 0.0.0.0\n\nS*    0.0.0.0/0 [1/0] via 203.0.113.1\n      10.0.0.0/8 is variably subnetted, 4 subnets, 3 masks\nC        10.1.1.0/24 is directly connected, GigabitEthernet0/0\nL        10.1.1.1/32 is directly connected, GigabitEthernet0/0\nO        10.2.0.0/16 [110/2] via 10.0.12.2, 00:12:41, GigabitEthernet0/1\nS        10.2.5.0/24 [1/0] via 10.0.13.3","explica":"[110/2] = [distância administrativa / métrica]."},{"tipo":"tabela","titulo":"","cabecalho":["Campo","Exemplo","Significado"],"linhas":[["Código","O","Origem da rota (OSPF)"],["Prefixo","10.2.0.0/16","Rede de destino"],["AD","110","Confiança na origem (menor = melhor)"],["Métrica","2","Custo dentro do protocolo"],["Next hop","via 10.0.12.2","Próximo router"],["Interface","Gi0/1","Por onde sai"]]},{"tipo":"texto","titulo":"Como o router escolhe","html":"<ol>\n<li><b>Prefixo mais longo</b> (longest match) vence sempre. Para 10.2.5.9, a rota 10.2.5.0/24 ganha à 10.2.0.0/16, mesmo sendo estática vs OSPF.</li>\n<li>Se houver o <b>mesmo prefixo</b> de várias origens, ganha a menor <b>distância administrativa</b>.</li>\n<li>Mesmo prefixo e mesma origem: ganha a menor <b>métrica</b>. Empate → balanceamento (ECMP).</li>\n</ol>"},{"tipo":"tabela","titulo":"Distâncias administrativas (decore!)","cabecalho":["Origem","AD"],"linhas":[["Ligada diretamente","0"],["Estática","1"],["eBGP","20"],["EIGRP (interno)","90"],["OSPF","110"],["IS-IS","115"],["RIP","120"],["EIGRP (externo)","170"],["iBGP","200"],["Inutilizável","255"]]},{"tipo":"exemplo","titulo":"Qual rota é usada para 172.16.10.5?","html":"<p>Tabela: <code>172.16.0.0/16 via A</code> (OSPF), <code>172.16.10.0/24 via B</code> (RIP), <code>172.16.10.0/28 via C</code> (estática), <code>0.0.0.0/0 via D</code>.</p>\n<p>172.16.10.5 cabe em /16, /24 e /28 (.0–.15). O mais longo é <b>/28 → via C</b>. A AD só desempata prefixos iguais.</p>"},{"tipo":"video","titulo":"Tabela de roteamento Cisco","busca":"show ip route explicado longest prefix match distância administrativa","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a distância administrativa do OSPF?","opcoes":["90","110","120","1"],"correta":1,"explica":"OSPF = 110."},{"tipo":"mc","p":"Que critério é aplicado primeiro na escolha de rota?","opcoes":["Menor AD","Menor métrica","Prefixo mais longo","Rota mais antiga"],"correta":2,"explica":"Longest prefix match sempre primeiro."},{"tipo":"mc","p":"Em [120/3], o que significa o 3?","opcoes":["AD","Métrica","Saltos de TTL","Número de rotas"],"correta":1,"explica":"[AD/métrica]."},{"tipo":"vf","p":"Uma rota com código L é uma rota /32 do próprio IP da interface.","correta":true,"explica":"Local route, criada automaticamente."},{"tipo":"mc","p":"Tráfego para 10.2.5.9 com as rotas 10.2.0.0/16 (OSPF) e 10.2.5.0/24 (estática). Qual é usada?","opcoes":["OSPF, porque é dinâmica","Estática /24, prefixo mais longo","As duas em balanceamento","Nenhuma"],"correta":1,"explica":"/24 é mais específico."}],"referencias":["odom2","odom1","netacad_srwe"]},{"id":"m6l2","titulo":"Rotas estáticas IPv4 e IPv6","minutos":18,"nivel":"intermédio","objetivos":["Configurar rotas estáticas, por defeito, de host e flutuantes","Distinguir next hop, interface de saída e rota totalmente especificada"],"blocos":[{"tipo":"topologia","nos":[{"id":"lan1","tipo":"switch","x":8,"y":50,"rotulo":"192.168.1.0/24"},{"id":"r1","tipo":"router","x":32,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":68,"y":50,"rotulo":"R2"},{"id":"lan2","tipo":"switch","x":92,"y":50,"rotulo":"192.168.2.0/24"},{"id":"isp","tipo":"nuvem","x":32,"y":10,"rotulo":"ISP 203.0.113.1"}],"ligacoes":[{"a":"lan1","b":"r1","rotulo":""},{"a":"r1","b":"r2","rotulo":"10.0.12.0/30"},{"a":"r2","b":"lan2","rotulo":""},{"a":"r1","b":"isp","rotulo":""}],"legenda":"R1 (.1) e R2 (.2) na ligação 10.0.12.0/30."},{"tipo":"cli","titulo":"Rotas estáticas","passos":[{"prompt":"R1(config)#","cmd":"ip route 192.168.2.0 255.255.255.0 10.0.12.2","explica":"Next hop: chegar à LAN2 via R2."},{"prompt":"R2(config)#","cmd":"ip route 192.168.1.0 255.255.255.0 g0/1","explica":"Interface de saída (bom em ligações ponto a ponto)."},{"prompt":"R2(config)#","cmd":"ip route 192.168.1.0 255.255.255.0 g0/1 10.0.12.1","explica":"Totalmente especificada: interface + next hop."},{"prompt":"R1(config)#","cmd":"ip route 0.0.0.0 0.0.0.0 203.0.113.1","explica":"Rota por defeito (gateway of last resort)."},{"prompt":"R1(config)#","cmd":"ip route 10.9.9.9 255.255.255.255 10.0.12.2","explica":"Rota de host /32."},{"prompt":"R1(config)#","cmd":"ip route 192.168.2.0 255.255.255.0 10.0.13.3 5","explica":"Rota flutuante: AD 5, só entra se a principal falhar."},{"prompt":"R1(config)#","cmd":"ipv6 route 2001:db8:2::/64 2001:db8:12::2","explica":"Estática IPv6."},{"prompt":"R1(config)#","cmd":"ipv6 route ::/0 g0/2 fe80::1","explica":"Por defeito IPv6 com next hop link-local (obriga a indicar a interface)."},{"prompt":"R1#","cmd":"show ip route static","explica":"Só as estáticas."}],"nota":""},{"tipo":"alerta","html":"Não esqueça o <b>caminho de volta</b>! Configurar só R1 → LAN2 faz o ping sair, mas a resposta não regressa se R2 não souber chegar à LAN1."},{"tipo":"dica","html":"Uma rota estática com next hop só entra na tabela se o next hop for alcançável. Com interface de saída, entra se a interface estiver up."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Topologias pequenas: rotas estáticas são perfeitas para treinar.","Pode usar só interface de saída em Ethernet sem problemas visíveis."],"real":["Rota estática só com interface de saída em Ethernet obriga o router a fazer ARP para cada destino (proxy ARP) — use next hop.","Em produção, as estáticas servem para rotas por defeito, filiais pequenas e rotas flutuantes de reserva (ex.: 4G).","Combine rotas flutuantes com IP SLA para detetar falhas além da própria ligação."]},{"tipo":"video","titulo":"Rotas estáticas Cisco","busca":"rota estática Cisco configuração flutuante default route","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Escreva a rota por defeito via 203.0.113.1.","respostas":["ip route 0.0.0.0 0.0.0.0 203.0.113.1"],"explica":"ip route 0.0.0.0 0.0.0.0 203.0.113.1."},{"tipo":"mc","p":"O que é uma rota estática flutuante?","opcoes":["Rota com AD maior que a principal, usada como reserva","Rota sem máscara","Rota aprendida por OSPF","Rota /32"],"correta":0,"explica":"Fica escondida até a principal desaparecer."},{"tipo":"vf","p":"Uma rota estática IPv6 com next hop link-local precisa da interface de saída.","correta":true,"explica":"Link-locals repetem-se em várias ligações."},{"tipo":"mc","p":"Qual a AD por defeito de uma rota estática?","opcoes":["0","1","5","110"],"correta":1,"explica":"1."}],"referencias":["odom2","netacad_srwe","rfc4632"]},{"id":"m6l3","titulo":"OSPFv2 de área única","minutos":28,"nivel":"avançado","objetivos":["Explicar vizinhança, LSDB e SPF","Configurar OSPF por network e por interface","Eleger DR/BDR e escolher o router ID"],"blocos":[{"tipo":"texto","titulo":"Como o OSPF trabalha","html":"<p>O <b>OSPF</b> é um protocolo de <b>estado de ligação</b>. Cada router:</p>\n<ol>\n<li>Descobre vizinhos com <b>Hello</b> (multicast 224.0.0.5, a cada 10 s em Ethernet; dead 40 s).</li>\n<li>Troca <b>LSAs</b> e constrói a mesma base de dados (<b>LSDB</b>) que os vizinhos da área.</li>\n<li>Corre o algoritmo <b>SPF (Dijkstra)</b> e calcula o melhor caminho para cada rede.</li>\n</ol>\n<p>Métrica = <b>custo</b> = largura de banda de referência ÷ largura de banda da interface (referência padrão 100 Mbit/s → FastEthernet = 1, e GigabitEthernet também = 1!).</p>"},{"tipo":"tabela","titulo":"Estados de vizinhança","cabecalho":["Estado","O que acontece"],"linhas":[["Down","Sem Hellos"],["Init","Recebeu Hello, mas o seu RID ainda não aparece nele"],["2-Way","Vêem-se mutuamente (estado final entre DROthers)"],["ExStart / Exchange","Escolhem mestre e trocam resumos (DBD)"],["Loading","Pedem LSAs em falta (LSR/LSU)"],["Full","LSDB sincronizada — adjacência completa"]]},{"tipo":"texto","titulo":"Para formar vizinhança têm de coincidir","html":"<ul><li>Área, sub-rede e máscara</li><li>Temporizadores Hello e Dead</li><li>Autenticação</li><li>Tipo de stub da área</li><li>MTU (senão fica preso em ExStart)</li></ul>\n<p>E têm de ter <b>router ID</b> diferentes. O RID é escolhido assim: 1) <code>router-id</code> manual; 2) maior IP de loopback ativa; 3) maior IP de interface física ativa.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":20,"y":25,"rotulo":"R1 RID 1.1.1.1"},{"id":"r2","tipo":"router","x":80,"y":25,"rotulo":"R2 RID 2.2.2.2"},{"id":"r3","tipo":"router","x":50,"y":85,"rotulo":"R3 RID 3.3.3.3"}],"ligacoes":[{"a":"r1","b":"r2","rotulo":"10.0.12.0/30"},{"a":"r1","b":"r3","rotulo":"10.0.13.0/30"},{"a":"r2","b":"r3","rotulo":"10.0.23.0/30"}],"legenda":"Três routers na área 0."},{"tipo":"cli","titulo":"Configurar OSPF em R1","passos":[{"prompt":"R1(config)#","cmd":"router ospf 1","explica":"Process ID: só tem significado local."},{"prompt":"R1(config-router)#","cmd":"router-id 1.1.1.1","explica":"Define o RID (boa prática)."},{"prompt":"R1(config-router)#","cmd":"network 10.0.12.0 0.0.0.3 area 0","explica":"Ativa OSPF nas interfaces dentro desta rede (wildcard!)."},{"prompt":"R1(config-router)#","cmd":"network 10.0.13.0 0.0.0.3 area 0","explica":""},{"prompt":"R1(config-router)#","cmd":"network 192.168.1.0 0.0.0.255 area 0","explica":""},{"prompt":"R1(config-router)#","cmd":"passive-interface g0/0","explica":"Anuncia a LAN mas não envia Hellos para os PCs."},{"prompt":"R1(config-router)#","cmd":"auto-cost reference-bandwidth 10000","explica":"Referência 10 Gbit/s — faça igual em todos os routers."},{"prompt":"R1(config-router)#","cmd":"default-information originate","explica":"Anuncia a rota por defeito aos vizinhos."},{"prompt":"R1(config)#","cmd":"interface g0/2","explica":"Alternativa: ativar na interface."},{"prompt":"R1(config-if)#","cmd":"ip ospf 1 area 0","explica":""},{"prompt":"R1(config-if)#","cmd":"ip ospf cost 50","explica":"Altera o custo manualmente."},{"prompt":"R1(config-if)#","cmd":"ip ospf network point-to-point","explica":"Em ligações /30 entre 2 routers: sem eleição DR/BDR."}],"nota":""},{"tipo":"exemplo","titulo":"Wildcard mask = inverso da máscara","html":"<p>255.255.255.0 → <b>0.0.0.255</b>. 255.255.255.252 → <b>0.0.0.3</b>. Regra: 255 − cada octeto da máscara. Um wildcard <code>0.0.0.0</code> com o IP da interface ativa exatamente essa interface.</p>"},{"tipo":"texto","titulo":"DR e BDR","html":"<p>Em redes multiacesso (Ethernet com vários routers) elege-se um <b>Designated Router</b> e um <b>Backup</b> para reduzir adjacências: todos ficam Full com o DR/BDR e 2-Way entre si. Ganha a maior <b>prioridade</b> de interface (padrão 1; 0 = nunca é DR), depois o maior RID. A eleição <b>não é preemptiva</b>.</p>"},{"tipo":"saida","titulo":"show ip ospf neighbor","texto":"Neighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/  -        00:00:35    10.0.12.2       Gi0/0\n3.3.3.3           1   FULL/DR         00:00:38    10.0.13.2       Gi0/1","explica":""},{"tipo":"cli","titulo":"Verificar","passos":[{"prompt":"R1#","cmd":"show ip ospf neighbor","explica":"Vizinhos e estado."},{"prompt":"R1#","cmd":"show ip ospf interface brief","explica":"Interfaces, área, custo, estado DR/BDR."},{"prompt":"R1#","cmd":"show ip protocols","explica":"RID, redes anunciadas, passive interfaces."},{"prompt":"R1#","cmd":"show ip route ospf","explica":"Rotas aprendidas (O)."}],"nota":""},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta OSPF de área única e multiárea muito bem.","Mudar o router-id exige 'clear ip ospf process' tal como no real."],"real":["Em produção, use sempre interfaces loopback e router-id manual.","MTU diferente entre fabricantes (ou túneis) deixa vizinhos presos em EXSTART/EXCHANGE.","Ative autenticação OSPF (MD5/SHA) para evitar routers intrusos.","Ajuste a reference-bandwidth em TODOS os routers, senão os custos ficam incoerentes."]},{"tipo":"video","titulo":"OSPF single area","busca":"OSPF configuração single area CCNA DR BDR","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual o endereço multicast dos Hellos OSPF para todos os routers?","opcoes":["224.0.0.2","224.0.0.5","224.0.0.6","224.0.0.10"],"correta":1,"explica":"224.0.0.5 todos os OSPF; 224.0.0.6 DR/BDR."},{"tipo":"mc","p":"Qual o wildcard de 255.255.255.248?","opcoes":["0.0.0.7","0.0.0.8","0.0.0.248","255.255.255.7"],"correta":0,"explica":"255 − 248 = 7."},{"tipo":"mc","p":"Como é escolhido o router ID sem configuração manual?","opcoes":["Menor IP de interface","Maior IP de loopback ativa","MAC mais baixo","Process ID"],"correta":1,"explica":"Loopback mais alta; depois a maior interface física."},{"tipo":"vf","p":"O process ID do OSPF tem de coincidir entre vizinhos.","correta":false,"explica":"Só tem significado local. A área sim tem de coincidir."},{"tipo":"mc","p":"Dois routers ficam presos em EXSTART. Causa mais provável?","opcoes":["Área diferente","MTU diferente","Process ID diferente","Router ID igual a 0"],"correta":1,"explica":"MTU diferente impede a troca de DBD."},{"tipo":"cmd","p":"Que comando impede o envio de Hellos para a LAN g0/0 mantendo a rede anunciada (dentro de router ospf)?","respostas":["passive-interface g0/0","passive-interface gigabitethernet0/0"],"explica":"passive-interface g0/0."}],"referencias":["rfc2328","odom2","netacad_ensa"]},{"id":"m6l4","titulo":"Redundância de gateway (FHRP: HSRP)","minutos":15,"nivel":"intermédio","objetivos":["Explicar o problema do gateway único","Configurar HSRP com prioridade e preempção","Comparar HSRP, VRRP e GLBP"],"blocos":[{"tipo":"texto","titulo":"O problema","html":"<p>Os PCs só conhecem <b>um</b> gateway. Se esse router falhar, perdem acesso a outras redes mesmo havendo um segundo router. Os <b>FHRP</b> criam um <b>IP virtual</b> (e MAC virtual) partilhado por dois ou mais routers: um está <b>ativo</b>, o outro em <b>standby</b> assume em segundos.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":25,"y":20,"rotulo":"R1 .2 Active"},{"id":"r2","tipo":"router","x":75,"y":20,"rotulo":"R2 .3 Standby"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW"},{"id":"pc","tipo":"pc","x":50,"y":90,"rotulo":"PC gw 192.168.1.1"}],"ligacoes":[{"a":"r1","b":"sw","rotulo":""},{"a":"r2","b":"sw","rotulo":""},{"a":"sw","b":"pc","rotulo":""}],"legenda":"O PC usa o IP virtual 192.168.1.1."},{"tipo":"cli","titulo":"HSRPv2","passos":[{"prompt":"R1(config)#","cmd":"interface g0/0","explica":""},{"prompt":"R1(config-if)#","cmd":"ip address 192.168.1.2 255.255.255.0","explica":""},{"prompt":"R1(config-if)#","cmd":"standby version 2","explica":""},{"prompt":"R1(config-if)#","cmd":"standby 1 ip 192.168.1.1","explica":"IP virtual do grupo 1."},{"prompt":"R1(config-if)#","cmd":"standby 1 priority 110","explica":"Maior prioridade (padrão 100) → Active."},{"prompt":"R1(config-if)#","cmd":"standby 1 preempt","explica":"Recupera o papel de Active quando volta."},{"prompt":"R2(config-if)#","cmd":"standby 1 ip 192.168.1.1","explica":"Em R2 (IP .3), prioridade padrão 100."},{"prompt":"R1#","cmd":"show standby brief","explica":"Estado Active/Standby, IP virtual."}],"nota":""},{"tipo":"tabela","titulo":"","cabecalho":["","HSRP","VRRP","GLBP"],"linhas":[["Dono","Cisco","Norma aberta (RFC 5798)","Cisco"],["Papéis","Active / Standby","Master / Backup","AVG / AVF"],["Balanceamento","Por grupo/VLAN","Por grupo/VLAN","Sim, no mesmo grupo"],["MAC virtual","0000.0c07.acXX (v1) / 0000.0c9f.fXXX (v2)","0000.5e00.01XX","0007.b400.XXYY"],["Preempção","Desligada por defeito","Ligada por defeito","Desligada (AVG)"]]},{"tipo":"dica","html":"Para balancear com HSRP use dois grupos: R1 Active na VLAN 10 e R2 Active na VLAN 20."},{"tipo":"video","titulo":"HSRP","busca":"HSRP configuração Cisco CCNA FHRP","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a prioridade HSRP por defeito?","opcoes":["0","50","100","255"],"correta":2,"explica":"100."},{"tipo":"mc","p":"Qual FHRP é uma norma aberta?","opcoes":["HSRP","GLBP","VRRP","CDP"],"correta":2,"explica":"VRRP — RFC 5798."},{"tipo":"vf","p":"Sem 'preempt', um router HSRP com maior prioridade que arranca depois não toma o papel de Active.","correta":true,"explica":"A preempção está desligada por defeito no HSRP."},{"tipo":"mc","p":"O que configuram os PCs como gateway?","opcoes":["IP real do route ídeo"]]},{"tipo":"exemplo","titulo":"Quando liga o portátil no café","html":"<p>O <b>DHCP</b> do router do café dá-lhe um IP. Ao abrir um site, o <b>DNS</b> descobre o IP do servidor. Ao sair para a Internet, o <b>NAT</b> troca o seu IP privado pelo IP público do café. Tudo em milissegundos.</p>"},{"tipo":"video","titulo":"DHCP DNS NAT explicados","busca":"DHCP DNS NAT explicação simples","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que serviço converte nomes de sites em IP?","opcoes":["DHCP","DNS","NAT","NTP"],"correta":1,"explica":"DNS."},{"tipo":"mc","p":"Que serviço permite que toda a casa use um único IP público?","opcoes":["NAT","DNS","Syslog","QoS"],"correta":0,"explica":"NAT/PAT."},{"tipo":"vf","p":"O NTP serve para sincronizar a hora.","correta":true,"explica":"Network Time Protocol."}],"referencias":["kurose","odom2"]},{"id":"m7l1","titulo":"DHCP e DNS","minutos":20,"nivel":"básico","objetivos":["Descrever o processo DORA","Configurar um router como servidor DHCP e como relay","Explicar a resolução DNS"],"blocos":[{"tipo":"texto","titulo":"DORA","html":"<ol>\n<li><b>Discover</b>: o cliente (sem IP, origem 0.0.0.0) envia broadcast a procurar servidores.</li>\n<li><b>Offer</b>: o servidor oferece um endereço.</li>\n<li><b>Request</b>: o cliente pede formalmente esse endereço (broadcast, para os outros servidores saberem).</li>\n<li><b>Acknowledgment</b>: o servidor confirma e o empréstimo (lease) começa.</li>\n</ol>"},{"tipo":"cli","titulo":"Router como servidor DHCP","passos":[{"prompt":"R1(config)#","cmd":"ip dhcp excluded-address 192.168.10.1 192.168.10.20","explica":"Reserva endereços para gateway, servidores e impressoras."},{"prompt":"R1(config)#","cmd":"ip dhcp pool VLAN10","explica":"Cria o conjunto (pool)."},{"prompt":"R1(dhcp-config)#","cmd":"network 192.168.10.0 255.255.255.0","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"default-router 192.168.10.1","explica":"Gateway entregue aos clientes."},{"prompt":"R1(dhcp-config)#","cmd":"dns-server 8.8.8.8 1.1.1.1","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"domain-name empresa.local","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"lease 7","explica":"Duração em dias."},{"prompt":"R1#","cmd":"show ip dhcp binding","explica":"Quem recebeu que IP."},{"prompt":"R1#","cmd":"show ip dhcp pool","explica":"Utilização do pool."}],"nota":""},{"tipo":"topologia","nos":[{"id":"pc","tipo":"pc","x":10,"y":50,"rotulo":"PC VLAN 20"},{"id":"r1","tipo":"router","x":45,"y":50,"rotulo":"R1 relay"},{"id":"srv","tipo":"servidor","x":85,"y":50,"rotulo":"DHCP 10.0.0.10"}],"ligacoes":[{"a":"pc","b":"r1","rotulo":"broadcast"},{"a":"r1","b":"srv","rotulo":"unicast"}],"legenda":"Broadcasts não atravessam routers: o relay converte o pedido em unicast."},{"tipo":"cli","titulo":"DHCP relay","passos":[{"prompt":"R1(config)#","cmd":"interface g0/1","explica":"Interface do lado dos clientes."},{"prompt":"R1(config-if)#","cmd":"ip helper-address 10.0.0.10","explica":"Encaminha pedidos DHCP para o servidor central."},{"prompt":"R1(config-if)#","cmd":"ip address dhcp","explica":"(Noutro cenário) o router é cliente DHCP, típico na ligação ao ISP."}],"nota":""},{"tipo":"texto","titulo":"DNS","html":"<p>O <b>DNS</b> traduz nomes (<code>www.cisco.com</code>) em endereços IP. O PC pergunta ao seu servidor DNS (resolvedor), que consulta a raiz, depois o TLD (.com) e por fim o servidor autoritativo. Registos comuns: <b>A</b> (IPv4), <b>AAAA</b> (IPv6), <b>CNAME</b> (alias), <b>MX</b> (correio), <b>PTR</b> (inverso), <b>NS</b>.</p>"},{"tipo":"cli","titulo":"DNS no IOS","passos":[{"prompt":"R1(config)#","cmd":"ip name-server 8.8.8.8","explica":"O router usa este DNS."},{"prompt":"R1(config)#","cmd":"ip domain-lookup","explica":"Ativa a resolução (padrão)."},{"prompt":"R1(config)#","cmd":"ip host SRV1 10.0.0.10","explica":"Entrada estática local."}],"nota":""},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem servidores DHCP e DNS prontos no separador Services.","Os PCs pedem IP ao mudar para 'DHCP' em IP Configuration."],"real":["Use 'ipconfig /release' e '/renew' (Windows) ou 'dhclient' (Linux) para testar.","Em empresas o DHCP costuma ser um servidor Windows/Linux ou a firewall; o router faz só relay.","Ative DHCP snooping nos switches para evitar servidores DHCP falsos (módulo de segurança)."]},{"tipo":"video","titulo":"DHCP DORA e relay","busca":"DHCP DORA ip helper-address configuração Cisco","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a ordem do DHCP?","opcoes":["Discover, Request, Offer, Ack","Discover, Offer, Request, Ack","Offer, Discover, Ack, Request","Request, Offer, Discover, Ack"],"correta":1,"explica":"D-O-R-A."},{"tipo":"cmd","p":"Que comando de interface encaminha pedidos DHCP para 10.0.0.10?","respostas":["ip helper-address 10.0.0.10"],"explica":"ip helper-address."},{"tipo":"mc","p":"Que registo DNS devolve um endereço IPv6?","opcoes":["A","AAAA","MX","PTR"],"correta":1,"explica":"AAAA."},{"tipo":"vf","p":"O comando 'ip dhcp excluded-address' é configurado dentro do pool.","correta":false,"explica":"É um comando global."}],"referencias":["rfc2131","rfc1034","odom2","netacad_srwe"]},{"id":"m7l2","titulo":"NAT e PAT","minutos":22,"nivel":"intermédio","objetivos":["Usar a terminologia inside/outside local/global","Configurar NAT estático, dinâmico e PAT (overload)","Verificar traduções"],"blocos":[{"tipo":"figura","nome":"nat","legenda":"O router traduz o endereço privado de origem num endereço público."},{"tipo":"tabela","titulo":"Terminologia NAT","cabecalho":["Termo","Significado","Exemplo"],"linhas":[["Inside local","IP do host interno, visto por dentro","192.168.1.10"],["Inside global","IP do host interno, visto por fora","203.0.113.5"],["Outside global","IP do host externo, visto por fora","142.250.0.10"],["Outside local","IP do host externo, visto por dentro","142.250.0.10 (igual, salvo NAT duplo)"]]},{"tipo":"cli","titulo":"NAT estático (servidor publicado)","passos":[{"prompt":"R1(config)#","cmd":"ip nat inside source static 192.168.1.10 203.0.113.5","explica":"O servidor interno é sempre visto como .5."},{"prompt":"R1(config)#","cmd":"interface g0/0","explica":"LAN"},{"prompt":"R1(config-if)#","cmd":"ip nat inside","explica":""},{"prompt":"R1(config-if)#","cmd":"interface g0/1","explica":"Lado do ISP"},{"prompt":"R1(config-if)#","cmd":"ip nat outside","explica":""}],"nota":""},{"tipo":"cli","titulo":"NAT dinâmico com pool","passos":[{"prompt":"R1(config)#","cmd":"access-list 1 permit 192.168.1.0 0.0.0.255","explica":"Quem pode ser traduzido."},{"prompt":"R1(config)#","cmd":"ip nat pool PUBLICOS 203.0.113.10 203.0.113.20 netmask 255.255.255.0","explica":"Endereços públicos disponíveis."},{"prompt":"R1(config)#","cmd":"ip nat inside source list 1 pool PUBLICOS","explica":"1 para 1 enquanto houver endereços livres."}],"nota":""},{"tipo":"cli","titulo":"PAT (NAT overload) — o mais comum","passos":[{"prompt":"R1(config)#","cmd":"access-list 1 permit 192.168.0.0 0.0.255.255","explica":""},{"prompt":"R1(config)#","cmd":"ip nat inside source list 1 interface g0/1 overload","explica":"Todos saem com o IP da interface; distingue-os pela porta."},{"prompt":"R1#","cmd":"show ip nat translations","explica":"Tabela de traduções."},{"prompt":"R1#","cmd":"show ip nat statistics","explica":"Contadores, hits e misses."},{"prompt":"R1#","cmd":"clear ip nat translation *","explica":"Limpa traduções dinâmicas."}],"nota":""},{"tipo":"saida","titulo":"show ip nat translations (PAT)","texto":"Pro  Inside global         Inside local          Outside local         Outside global\ntcp  203.0.113.2:1024      192.168.1.10:51344    142.250.0.10:443      142.250.0.10:443\ntcp  203.0.113.2:1025      192.168.1.11:51344    142.250.0.10:443      142.250.0.10:443","explica":""},{"tipo":"dica","html":"Erro nº1 em NAT: esquecer <code>ip nat inside</code>/<code>ip nat outside</code> nas interfaces ou trocar os lados."},{"tipo":"video","titulo":"NAT e PAT Cisco","bus
