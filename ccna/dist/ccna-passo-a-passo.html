nk","trunk","trunk","access"],["trunk","trunk","trunk","trunk","(erro)"]]},{"tipo":"texto","titulo":"VLANs especiais","html":"<ul>\n<li><b>VLAN 1</b>: por defeito todas as portas estão nela; não a use para utilizadores.</li>\n<li><b>VLAN nativa</b>: tráfego sem tag no trunk (padrão VLAN 1). Mude para uma VLAN não usada (ataques de <i>VLAN hopping</i> com dupla etiqueta).</li>\n<li><b>VLANs de intervalo normal</b>: 1–1005 (guardadas no vlan.dat). <b>Estendido</b>: 1006–4094.</li>\n<li><b>VTP</b> (proprietário Cisco) propaga VLANs entre switches. Um switch com número de revisão maior pode apagar as VLANs de toda a rede — muitas empresas usam <code>vtp mode transparent</code> ou <code>off</code>.</li>\n</ul>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer o 2960 negocia trunk facilmente com DTP.","Mensagens de 'native VLAN mismatch' aparecem como no IOS real (via CDP)."],"real":["Em produção, configure sempre trunks estáticos e <code>switchport nonegotiate</code>.","Num trunk com outro fabricante, o DTP não existe: configure trunk manualmente dos dois lados.","Ao adicionar uma VLAN a um trunk use <code>switchport trunk allowed vlan <b>add</b> 30</code> — sem 'add' substitui a lista e pode cortar a rede!"]},{"tipo":"video","titulo":"VLANs e trunks","busca":"VLAN trunk 802.1Q configuração Cisco CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando atribui a porta à VLAN 10 (no modo interface)?","respostas":["switchport access vlan 10"],"explica":"switchport access vlan 10."},{"tipo":"mc","p":"Quantos bits tem o VLAN ID na etiqueta 802.1Q?","opcoes":["8","10","12","16"],"correta":2,"explica":"12 bits → 4096 valores (0 e 4095 reservados)."},{"tipo":"mc","p":"Dois switches com 'dynamic auto' nas duas pontas formam…","opcoes":["Trunk","Access","EtherChannel","Erro"],"correta":1,"explica":"Ambos esperam que o outro peça: fica access."},{"tipo":"vf","p":"O tráfego da VLAN nativa atravessa o trunk sem etiqueta.","correta":true,"explica":"Por isso tem de coincidir nos dois lados."},{"tipo":"cmd","p":"Que comando mostra as VLANs e as portas atribuídas?","respostas":["show vlan brief","sh vlan brief","sh vlan br","show vlan"],"explica":"show vlan brief."},{"tipo":"mc","p":"Para adicionar a VLAN 30 a um trunk sem remover as outras:","opcoes":["switchport trunk allowed vlan 30","switchport trunk allowed vlan add 30","vlan 30 trunk","switchport access vlan 30"],"correta":1,"explica":"O 'add' acrescenta à lista existente."}],"referencias":["ieee8021q","odom1","netacad_srwe"]},{"id":"m5l3","titulo":"Encaminhamento entre VLANs","minutos":18,"nivel":"intermédio","objetivos":["Configurar router-on-a-stick com subinterfaces","Configurar SVIs num switch multicamada"],"blocos":[{"tipo":"texto","titulo":"Porque é preciso","html":"<p>VLANs diferentes são redes IP diferentes: para comunicarem precisam de um <b>router</b> ou de um <b>switch L3</b>. Existem três formas: um router com uma interface por VLAN (antiquado), <b>router-on-a-stick</b> e <b>SVIs em switch L3</b> (a mais usada nas empresas).</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":50,"y":12,"rotulo":"R1"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW1"},{"id":"a","tipo":"pc","x":20,"y":90,"rotulo":"PC VLAN10 192.168.10.10"},{"id":"b","tipo":"pc","x":80,"y":90,"rotulo":"PC VLAN20 192.168.20.10"}],"ligacoes":[{"a":"r1","b":"sw","rotulo":"trunk (g0/0.10 e .20)"},{"a":"sw","b":"a","rotulo":""},{"a":"sw","b":"b","rotulo":""}],"legenda":"Router-on-a-stick: uma única ligação física em trunk com subinterfaces."},{"tipo":"cli","titulo":"Router-on-a-stick","passos":[{"prompt":"R1(config)#","cmd":"interface g0/0","explica":""},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"Liga a interface física."},{"prompt":"R1(config-if)#","cmd":"interface g0/0.10","explica":"Subinterface para a VLAN 10."},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 10","explica":"Associa à VLAN 10 (tem de vir antes do IP)."},{"prompt":"R1(config-subif)#","cmd":"ip address 192.168.10.1 255.255.255.0","explica":"Gateway da VLAN 10."},{"prompt":"R1(config-subif)#","cmd":"interface g0/0.20","explica":""},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 20","explica":""},{"prompt":"R1(config-subif)#","cmd":"ip address 192.168.20.1 255.255.255.0","explica":""},{"prompt":"R1(config-subif)#","cmd":"interface g0/0.99","explica":""},{"prompt":"R1(config-subif)#","cmd":"encapsulation dot1Q 99 native","explica":"Se usar VLAN nativa no trunk."},{"prompt":"SW1(config-if)#","cmd":"switchport mode trunk","explica":"Do lado do switch a porta é trunk."}],"nota":""},{"tipo":"cli","titulo":"SVIs num switch multicamada","passos":[{"prompt":"DSW1(config)#","cmd":"ip routing","explica":"Ativa o encaminhamento IP (desligado por defeito)."},{"prompt":"DSW1(config)#","cmd":"interface vlan 10","explica":"Cria a SVI da VLAN 10."},{"prompt":"DSW1(config-if)#","cmd":"ip address 192.168.10.1 255.255.255.0","explica":""},{"prompt":"DSW1(config-if)#","cmd":"no shutdown","explica":""},{"prompt":"DSW1(config-if)#","cmd":"interface vlan 20","explica":""},{"prompt":"DSW1(config-if)#","cmd":"ip address 192.168.20.1 255.255.255.0","explica":""},{"prompt":"DSW1(config-if)#","cmd":"interface g1/0/24","explica":""},{"prompt":"DSW1(config-if)#","cmd":"no switchport","explica":"Porta roteada (L3) para ligar ao router de Internet."},{"prompt":"DSW1(config-if)#","cmd":"ip address 10.0.0.2 255.255.255.252","explica":""}],"nota":"Uma SVI só fica up/up se a VLAN existir e houver pelo menos uma porta ativa nessa VLAN (ou trunk que a transporte)."},{"tipo":"tabela","titulo":"","cabecalho":["","Router-on-a-stick","Switch L3 (SVI)"],"linhas":[["Custo","Baixo (usa router existente)","Maior"],["Desempenho","Limitado a 1 ligação","Velocidade de hardware (ASIC)"],["Escala","Poucas VLANs/tráfego","Campus empresarial"],["Ponto de falha","Uma ligação","Pode ter redundância (HSRP)"]]},{"tipo":"dica","html":"Erro clássico: PC sem acesso a outras VLANs porque o <b>gateway</b> configurado no PC não é o IP da subinterface/SVI da sua VLAN."},{"tipo":"video","titulo":"Inter-VLAN routing","busca":"inter VLAN routing router on a stick SVI configuração","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando associa uma subinterface à VLAN 30?","respostas":["encapsulation dot1q 30","encapsulation dot1Q 30"],"explica":"encapsulation dot1Q 30."},{"tipo":"cmd","p":"Que comando ativa o encaminhamento IP num switch multicamada?","respostas":["ip routing"],"explica":"ip routing."},{"tipo":"vf","p":"Uma SVI pode ficar up/up mesmo sem nenhuma porta ativa na sua VLAN.","correta":false,"explica":"Precisa de pelo menos uma porta ativa (access ou trunk) nessa VLAN."},{"tipo":"mc","p":"No router-on-a-stick, a porta do switch ligada ao router deve estar em modo…","opcoes":["access","trunk","routed","voice"],"correta":1,"explica":"Trunk, para levar todas as VLANs."},{"tipo":"cmd","p":"Que comando transforma uma porta de switch L3 numa porta roteada?","respostas":["no switchport"],"explica":"no switchport."}],"referencias":["odom1","netacad_srwe","lammle"]},{"id":"m5l4","titulo":"Spanning Tree (STP e RSTP)","minutos":25,"nivel":"avançado","objetivos":["Explicar porque os loops de camada 2 são graves","Eleger root bridge, root ports e designated ports","Configurar PortFast, BPDU Guard e prioridades"],"blocos":[{"tipo":"texto","titulo":"O problema","html":"<p>Ligações redundantes entre switches criam <b>loops</b>. Como as tramas Ethernet não têm TTL, um broadcast circula para sempre: <b>tempestade de broadcast</b>, tabelas MAC instáveis e tramas duplicadas. A rede para em segundos.</p>\n<p>O <b>Spanning Tree Protocol</b> (802.1D) bloqueia logicamente algumas portas para formar uma árvore sem loops, mantendo a redundância disponível caso uma ligação falhe.</p>"},{"tipo":"figura","nome":"stp","legenda":"Três switches em triângulo: o STP elege a root bridge e bloqueia uma porta."},{"tipo":"texto","titulo":"O algoritmo em 3 passos","html":"<ol>\n<li><b>Eleger a root bridge</b>: menor <b>Bridge ID</b> = prioridade (padrão 32768 + VLAN ID, no PVST+) + MAC. Empate na prioridade → menor MAC ganha.</li>\n<li><b>Root port</b> em cada switch não-root: a porta com menor <b>custo</b> até à root. Desempates: menor Bridge ID do vizinho, depois menor Port ID.</li>\n<li><b>Designated port</b> em cada segmento: a do switch com menor custo até à root. As portas restantes ficam <b>bloqueadas</b> (alternate).</li>\n</ol>"},{"tipo":"tabela","titulo":"Custos de porta (802.1D)","cabecalho":["Velocidade","Custo STP (curto)"],"linhas":[["10 Mbit/s","100"],["100 Mbit/s","19"],["1 Gbit/s","4"],["10 Gbit/s","2"]]},{"tipo":"tabela","titulo":"Estados de porta","cabecalho":["802.1D (STP)","802.1w (RSTP)","Função"],"linhas":[["Blocking","Discarding","Não encaminha, só ouve BPDUs"],["Listening","Discarding","Participa na eleição (15 s)"],["Learning","Learning","Aprende MACs (15 s)"],["Forwarding","Forwarding","Encaminha"],["Disabled","Discarding","Desligada"]]},{"tipo":"texto","titulo":"RSTP e variantes Cisco","html":"<p>O <b>RSTP</b> (802.1w) converge em ~1–2 s em vez de 30–50 s, graças a handshakes (proposal/agreement) e às funções <i>alternate</i> (cópia de segurança da root port) e <i>backup</i>. A Cisco usa <b>PVST+</b> (uma instância por VLAN) e <b>Rapid PVST+</b>.</p>"},{"tipo":"cli","titulo":"Controlar o STP","passos":[{"prompt":"SW1(config)#","cmd":"spanning-tree mode rapid-pvst","explica":"Ativa Rapid PVST+."},{"prompt":"SW1(config)#","cmd":"spanning-tree vlan 10 root primary","explica":"Torna-se root da VLAN 10 (ajusta a prioridade para 24576 ou menos)."},{"prompt":"SW2(config)#","cmd":"spanning-tree vlan 10 priority 28672","explica":"Alternativa: definir a prioridade (múltiplo de 4096)."},{"prompt":"SW1(config)#","cmd":"interface fa0/5","explica":"Porta de um PC."},{"prompt":"SW1(config-if)#","cmd":"spanning-tree portfast","explica":"Passa logo a forwarding (só em portas de host!)."},{"prompt":"SW1(config-if)#","cmd":"spanning-tree bpduguard enable","explica":"Desliga a porta (err-disabled) se receber BPDU."},{"prompt":"SW1(config)#","cmd":"spanning-tree portfast default","explica":"Ativa PortFast em todas as portas access."},{"prompt":"SW1#","cmd":"show spanning-tree vlan 10","explica":"Root, custos, papéis e estados das portas."}],"nota":""},{"tipo":"saida","titulo":"show spanning-tree vlan 10 (resumido)","texto":"VLAN0010\n  Spanning tree enabled protocol rstp\n  Root ID    Priority    24586\n             Address     0011.2233.4401\n             This bridge is the root\nInterface           Role Sts Cost      Prio.Nbr Type\n------------------- ---- --- --------- -------- -----------\nGi0/1               Desg FWD 4         128.25   P2p\nGi0/2               Desg FWD 4         128.26   P2p\nFa0/5               Desg FWD 19        128.5    P2p Edge","explica":"Prioridade 24586 = 24576 + VLAN 10. 'Edge' indica PortFast."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer as portas ficam âmbar durante a convergência, como na realidade.","Um loop no simulador apenas deixa o modo Simulation cheio de pacotes."],"real":["Um loop real derruba a rede inteira em segundos: CPU a 100%, LEDs a piscar todos ao mesmo tempo.","Defina SEMPRE a root bridge manualmente (no núcleo/distribuição); não deixe que um switch velho com MAC baixo ganhe.","Use BPDU Guard em todas as portas de utilizador: evita que alguém ligue um switch doméstico e crie loops.","Para recuperar uma porta err-disabled: shutdown + no shutdown (ou errdisable recovery)."]},{"tipo":"video","titulo":"Spanning Tree explicado","busca":"spanning tree protocol STP eleição root bridge CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que switch se torna root bridge?","opcoes":["O de maior MAC","O de menor Bridge ID","O mais rápido","O que tem mais portas"],"correta":1,"explica":"Menor prioridade + MAC."},{"tipo":"mc","p":"Qual o custo STP de uma ligação de 1 Gbit/s?","opcoes":["19","4","2","100"],"correta":1,"explica":"1 Gbit/s = 4."},{"tipo":"mc","p":"Que funcionalidade desliga uma porta PortFast que recebe uma BPDU?","opcoes":["Root Guard","BPDU Guard","Loop Guard","Port Security"],"correta":1,"explica":"BPDU Guard põe a porta em err-disabled."},{"tipo":"vf","p":"A prioridade STP tem de ser um múltiplo de 4096.","correta":true,"explica":"Os 12 bits baixos estão reservados ao ID estendido (VLAN)."},{"tipo":"mc","p":"Em quanto tempo converge normalmente o RSTP?","opcoes":["50 s","30 s","1–2 s","5 min"],"correta":2,"explica":"O RSTP converge em poucos segundos ou menos."},{"tipo":"cmd","p":"Que comando ativa PortFast numa interface?","respostas":["spanning-tree portfast"],"explica":"spanning-tree portfast."}],"referencias":["ieee8021d","ieee8021w","odom1","netacad_srwe"]},{"id":"m5l5","titulo":"EtherChannel (LACP e PAgP)","minutos":15,"nivel":"intermédio","objetivos":["Agregar várias ligações físicas numa lógica","Configurar LACP e verificar o resultado"],"blocos":[{"tipo":"texto","titulo":"Para que serve","html":"<p>Duas ligações de 1 Gbit/s entre switches: o STP bloquearia uma. Com <b>EtherChannel</b>, até 8 ligações físicas ativas tornam-se <b>uma única ligação lógica</b> (Port-channel): mais largura de banda, redundância e o STP vê apenas uma porta.</p>"},{"tipo":"topologia","nos":[{"id":"s1","tipo":"switch","x":25,"y":50,"rotulo":"SW1"},{"id":"s2","tipo":"switch","x":75,"y":50,"rotulo":"SW2"}],"ligacoes":[{"a":"s1","b":"s2","rotulo":"Po1 = Gi0/1 + Gi0/2"}],"legenda":"Duas ligações físicas, uma lógica."},{"tipo":"tabela","titulo":"","cabecalho":["Protocolo","Modos","Forma canal quando"],"linhas":[["LACP (802.3ad / 802.1AX, aberto)","active / passive","active+active ou active+passive"],["PAgP (Cisco)","desirable / auto","desirable+desirable ou desirable+auto"],["Estático","on","on+on (sem negociação)"]]},{"tipo":"cli","titulo":"Configurar LACP","passos":[{"prompt":"SW1(config)#","cmd":"interface range g0/1 - 2","explica":""},{"prompt":"SW1(config-if-range)#","cmd":"channel-group 1 mode active","explica":"LACP ativo; cria a interface Port-channel1."},{"prompt":"SW1(config-if-range)#","cmd":"interface port-channel 1","explica":"Configurações lógicas vão aqui."},{"prompt":"SW1(config-if)#","cmd":"switchport mode trunk","explica":""},{"prompt":"SW1#","cmd":"show etherchannel summary","explica":"Procure (SU) no port-channel e (P) nas portas."}],"nota":""},{"tipo":"saida","titulo":"show etherchannel summary","texto":"Flags:  D - down        P - bundled in port-channel\n        S - Layer2      U - in use       s - suspended\nGroup  Port-channel  Protocol    Ports\n------+-------------+-----------+-------------------------\n1      Po1(SU)         LACP      Gi0/1(P)    Gi0/2(P)","explica":""},{"tipo":"alerta","html":"Todas as portas do grupo têm de ter a mesma velocidade, duplex, modo (access/trunk), VLANs permitidas e VLAN nativa. Uma diferença deixa a porta em estado <b>(s) suspended</b>."},{"tipo":"video","titulo":"EtherChannel LACP","busca":"EtherChannel LACP PAgP configuração Cisco","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que combinação LACP NÃO forma EtherChannel?","opcoes":["active / active","active / passive","passive / passive","Todas formam"],"correta":2,"explica":"Dois passivos esperam um pelo outro."},{"tipo":"mc","p":"Qual o protocolo aberto de agregação?","opcoes":["PAgP","LACP","DTP","VTP"],"correta":1,"explica":"LACP — IEEE 802.3ad / 802.1AX."},{"tipo":"cmd","p":"Que comando mostra o estado dos EtherChannels?","respostas":["show etherchannel summary","sh etherchannel summary","sh eth sum","sh etherchannel sum"],"explica":"show etherchannel summary."},{"tipo":"vf","p":"Com EtherChannel o STP trata as ligações agregadas como uma só.","correta":true,"explica":"Nenhuma das ligações do grupo é bloqueada."}],"referencias":["ieee8021ax","odom1","netacad_srwe"]},{"id":"m5l6","titulo":"Redes sem fios (WLAN)","minutos":22,"nivel":"intermédio","objetivos":["Conhecer as normas 802.11, bandas e canais","Comparar AP autónomo, AP leve com WLC e cloud","Configurar uma WLAN WPA2/WPA3 numa WLC"],"blocos":[{"tipo":"figura","nome":"ap","legenda":"Access point de teto: emite um ou mais SSIDs em 2,4, 5 e 6 GHz."},{"tipo":"tabela","titulo":"Normas Wi-Fi","cabecalho":["Norma","Nome Wi-Fi","Banda","Velocidade máx. teórica"],"linhas":[["802.11b/g","—","2,4 GHz","11 / 54 Mbit/s"],["802.11n","Wi-Fi 4","2,4 e 5 GHz","600 Mbit/s"],["802.11ac","Wi-Fi 5","5 GHz","~6,9 Gbit/s"],["802.11ax","Wi-Fi 6 / 6E","2,4, 5 (e 6) GHz","~9,6 Gbit/s"],["802.11be","Wi-Fi 7","2,4, 5 e 6 GHz","~46 Gbit/s"]]},{"tipo":"texto","titulo":"Canais","html":"<p>Em <b>2,4 GHz</b> só os canais <b>1, 6 e 11</b> não se sobrepõem: use-os em APs vizinhos. Em <b>5 GHz</b> há muitos mais canais e menos interferência, mas menor alcance.</p>\n<p>Termos: <b>SSID</b> (nome da rede), <b>BSS</b> (um AP e os seus clientes), <b>BSSID</b> (MAC do rádio do AP), <b>ESS</b> (vários APs com o mesmo SSID, permitindo roaming).</p>"},{"tipo":"topologia","nos":[{"id":"wlc","tipo":"wlc","x":50,"y":12,"rotulo":"WLC"},{"id":"sw","tipo":"switch","x":50,"y":48,"rotulo":"SW acesso"},{"id":"ap1","tipo":"ap","x":20,"y":85,"rotulo":"AP leve 1"},{"id":"ap2","tipo":"ap","x":80,"y":85,"rotulo":"AP leve 2"}],"ligacoes":[{"a":"wlc","b":"sw","rotulo":"trunk"},{"a":"sw","b":"ap1","rotulo":"access (gestão)"},{"a":"sw","b":"ap2","rotulo":"access (gestão)"}],"legenda":"APs leves falam com a WLC por túneis CAPWAP (UDP 5246 controlo, 5247 dados)."},{"tipo":"tabela","titulo":"Arquiteturas","cabecalho":["Arquitetura","Como funciona"],"linhas":[["Autónoma","Cada AP configurado individualmente; liga a portas trunk se tiver vários SSIDs"],["Leve + WLC (split-MAC)","AP trata funções em tempo real; WLC gere o resto via CAPWAP. Porta do AP em modo access"],["Cloud (ex.: Meraki)","Gestão por portal na cloud; dados ficam na rede local"],["FlexConnect","AP numa filial comuta tráfego localmente mesmo se perder a WLC"]]},{"tipo":"tabela","titulo":"Segurança Wi-Fi","cabecalho":["Segurança","Estado"],"linhas":[["WEP","Quebrado — nunca usar"],["WPA (TKIP)","Obsoleto"],["WPA2 (AES-CCMP)","Aceitável"],["WPA3 (SAE, GCMP)","Recomendado"],["Personal (PSK/SAE)","Uma palavra-passe partilhada"],["Enterprise (802.1X + RADIUS)","Credenciais por utilizador"]]},{"tipo":"cli","titulo":"Criar uma WLAN numa WLC (interface web/GUI)","passos":[{"prompt":"GUI","cmd":"WLANs › Create New › Go","explica":"Tipo WLAN, nome do perfil e SSID (ex.: EMPRESA)."},{"prompt":"GUI","cmd":"General: Status = Enabled; Interface = vlan-dados","explica":"Associa a WLAN a uma interface dinâmica (VLAN)."},{"prompt":"GUI","cmd":"Security › Layer 2: WPA2/WPA3 + AES","explica":"Escolha PSK ou 802.1X."},{"prompt":"GUI","cmd":"Security › AAA Servers: servidor RADIUS","explica":"Para WPA2/3-Enterprise."},{"prompt":"GUI","cmd":"QoS: Silver (best effort) / Platinum (voz)","explica":""},{"prompt":"GUI","cmd":"Apply","explica":"Os APs começam a emitir o SSID."}],"nota":"O exame CCNA mostra estes ecrãs da GUI da WLC (AireOS) — conheça os separadores General, Security, QoS e Advanced."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem WLC-2504 e APs leves, mas a GUI é simplificada.","Não há interferência, paredes nem vizinhos no mesmo canal."],"real":["Faça um site survey (mapa de calor) antes de instalar APs.","Paredes, metal, água e micro-ondas reduzem o sinal; 5 GHz atravessa menos paredes.","Use PoE (802.3af/at/bt) para alimentar APs pelo cabo de rede — confirme o orçamento de potência do switch.","Separe a rede de convidados numa VLAN própria com isolamento e portal cativo."]},{"tipo":"video","titulo":"Wireless para CCNA","busca":"wireless LAN controller CAPWAP WPA3 CCNA aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quais os canais de 2,4 GHz que não se sobrepõem?","opcoes":["1, 5, 9","1, 6, 11","2, 7, 12","1, 7, 13"],"correta":1,"explica":"1, 6 e 11."},{"tipo":"mc","p":"Que protocolo liga APs leves à WLC?","opcoes":["LWAPP antigo apenas","CAPWAP","CDP","SNMP"],"correta":1,"explica":"CAPWAP: UDP 5246 (controlo) e 5247 (dados)."},{"tipo":"mc","p":"Qual a opção de segurança mais forte?","opcoes":["WEP","WPA-TKIP","WPA2-AES","WPA3-SAE"],"correta":3,"explica":"WPA3 com SAE substitui o PSK."},{"tipo":"vf","p":"A porta do switch ligada a um AP leve (modo local) é normalmente access.","correta":true,"explica":"O tráfego dos SSIDs vai no túnel CAPWAP até à WLC."},{"tipo":"mc","p":"Vários APs com o mesmo SSID formam um…","opcoes":["BSS","IBSS","ESS","BSSID"],"correta":2,"explica":"Extended Service Set — permite roaming."}],"referencias":["ieee80211","wifi_alliance","odom1","netacad_srwe"]}],"prova_extra":[{"tipo":"mc","p":"PCs na VLAN 10 de SW1 não falam com PCs na VLAN 10 de SW2. As VLANs existem nos dois. Verificação a fazer primeiro?","opcoes":["show interfaces trunk","show ip route","show cdp neighbors","show version"],"correta":0,"explica":"Confirme se o trunk está ativo e se a VLAN 10 é permitida."},{"tipo":"mc","p":"Que estado STP existe no 802.1D mas não no RSTP?","opcoes":["Forwarding","Learning","Listening","Discarding"],"correta":2,"explica":"RSTP junta blocking, listening e disabled em discarding."},{"tipo":"vf","p":"PAgP e LACP podem ser misturados no mesmo EtherChannel.","correta":false,"explica":"As duas pontas têm de usar o mesmo protocolo."},{"tipo":"mc","p":"Root bridge da VLAN 1 tem prioridade 32769. Que prioridade configurada tem?","opcoes":["32769","32768","4096","1"],"correta":1,"explica":"32768 + ID da VLAN (1) = 32769."}]},{"id":"m6","numero":6,"titulo":"Conectividade IP: Encaminhamento","descricao":"Tabela de encaminhamento, rotas estáticas, OSPF e redundância de gateway (FHRP). O domínio com mais peso no exame.","dominio":"3.0 IP Connectivity","icone":"router","licoes":[{"id":"m6l1","titulo":"A tabela de encaminhamento","minutos":18,"nivel":"intermédio","objetivos":["Ler cada campo de show ip route","Aplicar a regra do prefixo mais longo","Comparar distância administrativa e métrica"],"blocos":[{"tipo":"saida","titulo":"show ip route","texto":"R1#show ip route\nCodes: L - local, C - connected, S - static, O - OSPF, * - candidate default\nGateway of last resort is 203.0.113.1 to network 0.0.0.0\n\nS*    0.0.0.0/0 [1/0] via 203.0.113.1\n      10.0.0.0/8 is variably subnetted, 4 subnets, 3 masks\nC        10.1.1.0/24 is directly connected, GigabitEthernet0/0\nL        10.1.1.1/32 is directly connected, GigabitEthernet0/0\nO        10.2.0.0/16 [110/2] via 10.0.12.2, 00:12:41, GigabitEthernet0/1\nS        10.2.5.0/24 [1/0] via 10.0.13.3","explica":"[110/2] = [distância administrativa / métrica]."},{"tipo":"tabela","titulo":"","cabecalho":["Campo","Exemplo","Significado"],"linhas":[["Código","O","Origem da rota (OSPF)"],["Prefixo","10.2.0.0/16","Rede de destino"],["AD","110","Confiança na origem (menor = melhor)"],["Métrica","2","Custo dentro do protocolo"],["Next hop","via 10.0.12.2","Próximo router"],["Interface","Gi0/1","Por onde sai"]]},{"tipo":"texto","titulo":"Como o router escolhe","html":"<ol>\n<li><b>Prefixo mais longo</b> (longest match) vence sempre. Para 10.2.5.9, a rota 10.2.5.0/24 ganha à 10.2.0.0/16, mesmo sendo estática vs OSPF.</li>\n<li>Se houver o <b>mesmo prefixo</b> de várias origens, ganha a menor <b>distância administrativa</b>.</li>\n<li>Mesmo prefixo e mesma origem: ganha a menor <b>métrica</b>. Empate → balanceamento (ECMP).</li>\n</ol>"},{"tipo":"tabela","titulo":"Distâncias administrativas (decore!)","cabecalho":["Origem","AD"],"linhas":[["Ligada diretamente","0"],["Estática","1"],["eBGP","20"],["EIGRP (interno)","90"],["OSPF","110"],["IS-IS","115"],["RIP","120"],["EIGRP (externo)","170"],["iBGP","200"],["Inutilizável","255"]]},{"tipo":"exemplo","titulo":"Qual rota é usada para 172.16.10.5?","html":"<p>Tabela: <code>172.16.0.0/16 via A</code> (OSPF), <code>172.16.10.0/24 via B</code> (RIP), <code>172.16.10.0/28 via C</code> (estática), <code>0.0.0.0/0 via D</code>.</p>\n<p>172.16.10.5 cabe em /16, /24 e /28 (.0–.15). O mais longo é <b>/28 → via C</b>. A AD só desempata prefixos iguais.</p>"},{"tipo":"video","titulo":"Tabela de roteamento Cisco","busca":"show ip route explicado longest prefix match distância administrativa","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a distância administrativa do OSPF?","opcoes":["90","110","120","1"],"correta":1,"explica":"OSPF = 110."},{"tipo":"mc","p":"Que critério é aplicado primeiro na escolha de rota?","opcoes":["Menor AD","Menor métrica","Prefixo mais longo","Rota mais antiga"],"correta":2,"explica":"Longest prefix match sempre primeiro."},{"tipo":"mc","p":"Em [120/3], o que significa o 3?","opcoes":["AD","Métrica","Saltos de TTL","Número de rotas"],"correta":1,"explica":"[AD/métrica]."},{"tipo":"vf","p":"Uma rota com código L é uma rota /32 do próprio IP da interface.","correta":true,"explica":"Local route, criada automaticamente."},{"tipo":"mc","p":"Tráfego para 10.2.5.9 com as rotas 10.2.0.0/16 (OSPF) e 10.2.5.0/24 (estática). Qual é usada?","opcoes":["OSPF, porque é dinâmica","Estática /24, prefixo mais longo","As duas em balanceamento","Nenhuma"],"correta":1,"explica":"/24 é mais específico."}],"referencias":["odom2","odom1","netacad_srwe"]},{"id":"m6l2","titulo":"Rotas estáticas IPv4 e IPv6","minutos":18,"nivel":"intermédio","objetivos":["Configurar rotas estáticas, por defeito, de host e flutuantes","Distinguir next hop, interface de saída e rota totalmente especificada"],"blocos":[{"tipo":"topologia","nos":[{"id":"lan1","tipo":"switch","x":8,"y":50,"rotulo":"192.168.1.0/24"},{"id":"r1","tipo":"router","x":32,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":68,"y":50,"rotulo":"R2"},{"id":"lan2","tipo":"switch","x":92,"y":50,"rotulo":"192.168.2.0/24"},{"id":"isp","tipo":"nuvem","x":32,"y":10,"rotulo":"ISP 203.0.113.1"}],"ligacoes":[{"a":"lan1","b":"r1","rotulo":""},{"a":"r1","b":"r2","rotulo":"10.0.12.0/30"},{"a":"r2","b":"lan2","rotulo":""},{"a":"r1","b":"isp","rotulo":""}],"legenda":"R1 (.1) e R2 (.2) na ligação 10.0.12.0/30."},{"tipo":"cli","titulo":"Rotas estáticas","passos":[{"prompt":"R1(config)#","cmd":"ip route 192.168.2.0 255.255.255.0 10.0.12.2","explica":"Next hop: chegar à LAN2 via R2."},{"prompt":"R2(config)#","cmd":"ip route 192.168.1.0 255.255.255.0 g0/1","explica":"Interface de saída (bom em ligações ponto a ponto)."},{"prompt":"R2(config)#","cmd":"ip route 192.168.1.0 255.255.255.0 g0/1 10.0.12.1","explica":"Totalmente especificada: interface + next hop."},{"prompt":"R1(config)#","cmd":"ip route 0.0.0.0 0.0.0.0 203.0.113.1","explica":"Rota por defeito (gateway of last resort)."},{"prompt":"R1(config)#","cmd":"ip route 10.9.9.9 255.255.255.255 10.0.12.2","explica":"Rota de host /32."},{"prompt":"R1(config)#","cmd":"ip route 192.168.2.0 255.255.255.0 10.0.13.3 5","explica":"Rota flutuante: AD 5, só entra se a principal falhar."},{"prompt":"R1(config)#","cmd":"ipv6 route 2001:db8:2::/64 2001:db8:12::2","explica":"Estática IPv6."},{"prompt":"R1(config)#","cmd":"ipv6 route ::/0 g0/2 fe80::1","explica":"Por defeito IPv6 com next hop link-local (obriga a indicar a interface)."},{"prompt":"R1#","cmd":"show ip route static","explica":"Só as estáticas."}],"nota":""},{"tipo":"alerta","html":"Não esqueça o <b>caminho de volta</b>! Configurar só R1 → LAN2 faz o ping sair, mas a resposta não regressa se R2 não souber chegar à LAN1."},{"tipo":"dica","html":"Uma rota estática com next hop só entra na tabela se o next hop for alcançável. Com interface de saída, entra se a interface estiver up."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Topologias pequenas: rotas estáticas são perfeitas para treinar.","Pode usar só interface de saída em Ethernet sem problemas visíveis."],"real":["Rota estática só com interface de saída em Ethernet obriga o router a fazer ARP para cada destino (proxy ARP) — use next hop.","Em produção, as estáticas servem para rotas por defeito, filiais pequenas e rotas flutuantes de reserva (ex.: 4G).","Combine rotas flutuantes com IP SLA para detetar falhas além da própria ligação."]},{"tipo":"video","titulo":"Rotas estáticas Cisco","busca":"rota estática Cisco configuração flutuante default route","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Escreva a rota por defeito via 203.0.113.1.","respostas":["ip route 0.0.0.0 0.0.0.0 203.0.113.1"],"explica":"ip route 0.0.0.0 0.0.0.0 203.0.113.1."},{"tipo":"mc","p":"O que é uma rota estática flutuante?","opcoes":["Rota com AD maior que a principal, usada como reserva","Rota sem máscara","Rota aprendida por OSPF","Rota /32"],"correta":0,"explica":"Fica escondida até a principal desaparecer."},{"tipo":"vf","p":"Uma rota estática IPv6 com next hop link-local precisa da interface de saída.","correta":true,"explica":"Link-locals repetem-se em várias ligações."},{"tipo":"mc","p":"Qual a AD por defeito de uma rota estática?","opcoes":["0","1","5","110"],"correta":1,"explica":"1."}],"referencias":["odom2","netacad_srwe","rfc4632"]},{"id":"m6l3","titulo":"OSPFv2 de área única","minutos":28,"nivel":"avançado","objetivos":["Explicar vizinhança, LSDB e SPF","Configurar OSPF por network e por interface","Eleger DR/BDR e escolher o router ID"],"blocos":[{"tipo":"texto","titulo":"Como o OSPF trabalha","html":"<p>O <b>OSPF</b> é um protocolo de <b>estado de ligação</b>. Cada router:</p>\n<ol>\n<li>Descobre vizinhos com <b>Hello</b> (multicast 224.0.0.5, a cada 10 s em Ethernet; dead 40 s).</li>\n<li>Troca <b>LSAs</b> e constrói a mesma base de dados (<b>LSDB</b>) que os vizinhos da área.</li>\n<li>Corre o algoritmo <b>SPF (Dijkstra)</b> e calcula o melhor caminho para cada rede.</li>\n</ol>\n<p>Métrica = <b>custo</b> = largura de banda de referência ÷ largura de banda da interface (referência padrão 100 Mbit/s → FastEthernet = 1, e GigabitEthernet também = 1!).</p>"},{"tipo":"tabela","titulo":"Estados de vizinhança","cabecalho":["Estado","O que acontece"],"linhas":[["Down","Sem Hellos"],["Init","Recebeu Hello, mas o seu RID ainda não aparece nele"],["2-Way","Vêem-se mutuamente (estado final entre DROthers)"],["ExStart / Exchange","Escolhem mestre e trocam resumos (DBD)"],["Loading","Pedem LSAs em falta (LSR/LSU)"],["Full","LSDB sincronizada — adjacência completa"]]},{"tipo":"texto","titulo":"Para formar vizinhança têm de coincidir","html":"<ul><li>Área, sub-rede e máscara</li><li>Temporizadores Hello e Dead</li><li>Autenticação</li><li>Tipo de stub da área</li><li>MTU (senão fica preso em ExStart)</li></ul>\n<p>E têm de ter <b>router ID</b> diferentes. O RID é escolhido assim: 1) <code>router-id</code> manual; 2) maior IP de loopback ativa; 3) maior IP de interface física ativa.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":20,"y":25,"rotulo":"R1 RID 1.1.1.1"},{"id":"r2","tipo":"router","x":80,"y":25,"rotulo":"R2 RID 2.2.2.2"},{"id":"r3","tipo":"router","x":50,"y":85,"rotulo":"R3 RID 3.3.3.3"}],"ligacoes":[{"a":"r1","b":"r2","rotulo":"10.0.12.0/30"},{"a":"r1","b":"r3","rotulo":"10.0.13.0/30"},{"a":"r2","b":"r3","rotulo":"10.0.23.0/30"}],"legenda":"Três routers na área 0."},{"tipo":"cli","titulo":"Configurar OSPF em R1","passos":[{"prompt":"R1(config)#","cmd":"router ospf 1","explica":"Process ID: só tem significado local."},{"prompt":"R1(config-router)#","cmd":"router-id 1.1.1.1","explica":"Define o RID (boa prática)."},{"prompt":"R1(config-router)#","cmd":"network 10.0.12.0 0.0.0.3 area 0","explica":"Ativa OSPF nas interfaces dentro desta rede (wildcard!)."},{"prompt":"R1(config-router)#","cmd":"network 10.0.13.0 0.0.0.3 area 0","explica":""},{"prompt":"R1(config-router)#","cmd":"network 192.168.1.0 0.0.0.255 area 0","explica":""},{"prompt":"R1(config-router)#","cmd":"passive-interface g0/0","explica":"Anuncia a LAN mas não envia Hellos para os PCs."},{"prompt":"R1(config-router)#","cmd":"auto-cost reference-bandwidth 10000","explica":"Referência 10 Gbit/s — faça igual em todos os routers."},{"prompt":"R1(config-router)#","cmd":"default-information originate","explica":"Anuncia a rota por defeito aos vizinhos."},{"prompt":"R1(config)#","cmd":"interface g0/2","explica":"Alternativa: ativar na interface."},{"prompt":"R1(config-if)#","cmd":"ip ospf 1 area 0","explica":""},{"prompt":"R1(config-if)#","cmd":"ip ospf cost 50","explica":"Altera o custo manualmente."},{"prompt":"R1(config-if)#","cmd":"ip ospf network point-to-point","explica":"Em ligações /30 entre 2 routers: sem eleição DR/BDR."}],"nota":""},{"tipo":"exemplo","titulo":"Wildcard mask = inverso da máscara","html":"<p>255.255.255.0 → <b>0.0.0.255</b>. 255.255.255.252 → <b>0.0.0.3</b>. Regra: 255 − cada octeto da máscara. Um wildcard <code>0.0.0.0</code> com o IP da interface ativa exatamente essa interface.</p>"},{"tipo":"texto","titulo":"DR e BDR","html":"<p>Em redes multiacesso (Ethernet com vários routers) elege-se um <b>Designated Router</b> e um <b>Backup</b> para reduzir adjacências: todos ficam Full com o DR/BDR e 2-Way entre si. Ganha a maior <b>prioridade</b> de interface (padrão 1; 0 = nunca é DR), depois o maior RID. A eleição <b>não é preemptiva</b>.</p>"},{"tipo":"saida","titulo":"show ip ospf neighbor","texto":"Neighbor ID     Pri   State           Dead Time   Address         Interface\n2.2.2.2           0   FULL/  -        00:00:35    10.0.12.2       Gi0/0\n3.3.3.3           1   FULL/DR         00:00:38    10.0.13.2       Gi0/1","explica":""},{"tipo":"cli","titulo":"Verificar","passos":[{"prompt":"R1#","cmd":"show ip ospf neighbor","explica":"Vizinhos e estado."},{"prompt":"R1#","cmd":"show ip ospf interface brief","explica":"Interfaces, área, custo, estado DR/BDR."},{"prompt":"R1#","cmd":"show ip protocols","explica":"RID, redes anunciadas, passive interfaces."},{"prompt":"R1#","cmd":"show ip route ospf","explica":"Rotas aprendidas (O)."}],"nota":""},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta OSPF de área única e multiárea muito bem.","Mudar o router-id exige 'clear ip ospf process' tal como no real."],"real":["Em produção, use sempre interfaces loopback e router-id manual.","MTU diferente entre fabricantes (ou túneis) deixa vizinhos presos em EXSTART/EXCHANGE.","Ative autenticação OSPF (MD5/SHA) para evitar routers intrusos.","Ajuste a reference-bandwidth em TODOS os routers, senão os custos ficam incoerentes."]},{"tipo":"video","titulo":"OSPF single area","busca":"OSPF configuração single area CCNA DR BDR","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual o endereço multicast dos Hellos OSPF para todos os routers?","opcoes":["224.0.0.2","224.0.0.5","224.0.0.6","224.0.0.10"],"correta":1,"explica":"224.0.0.5 todos os OSPF; 224.0.0.6 DR/BDR."},{"tipo":"mc","p":"Qual o wildcard de 255.255.255.248?","opcoes":["0.0.0.7","0.0.0.8","0.0.0.248","255.255.255.7"],"correta":0,"explica":"255 − 248 = 7."},{"tipo":"mc","p":"Como é escolhido o router ID sem configuração manual?","opcoes":["Menor IP de interface","Maior IP de loopback ativa","MAC mais baixo","Process ID"],"correta":1,"explica":"Loopback mais alta; depois a maior interface física."},{"tipo":"vf","p":"O process ID do OSPF tem de coincidir entre vizinhos.","correta":false,"explica":"Só tem significado local. A área sim tem de coincidir."},{"tipo":"mc","p":"Dois routers ficam presos em EXSTART. Causa mais provável?","opcoes":["Área diferente","MTU diferente","Process ID diferente","Router ID igual a 0"],"correta":1,"explica":"MTU diferente impede a troca de DBD."},{"tipo":"cmd","p":"Que comando impede o envio de Hellos para a LAN g0/0 mantendo a rede anunciada (dentro de router ospf)?","respostas":["passive-interface g0/0","passive-interface gigabitethernet0/0"],"explica":"passive-interface g0/0."}],"referencias":["rfc2328","odom2","netacad_ensa"]},{"id":"m6l4","titulo":"Redundância de gateway (FHRP: HSRP)","minutos":15,"nivel":"intermédio","objetivos":["Explicar o problema do gateway único","Configurar HSRP com prioridade e preempção","Comparar HSRP, VRRP e GLBP"],"blocos":[{"tipo":"texto","titulo":"O problema","html":"<p>Os PCs só conhecem <b>um</b> gateway. Se esse router falhar, perdem acesso a outras redes mesmo havendo um segundo router. Os <b>FHRP</b> criam um <b>IP virtual</b> (e MAC virtual) partilhado por dois ou mais routers: um está <b>ativo</b>, o outro em <b>standby</b> assume em segundos.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":25,"y":20,"rotulo":"R1 .2 Active"},{"id":"r2","tipo":"router","x":75,"y":20,"rotulo":"R2 .3 Standby"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW"},{"id":"pc","tipo":"pc","x":50,"y":90,"rotulo":"PC gw 192.168.1.1"}],"ligacoes":[{"a":"r1","b":"sw","rotulo":""},{"a":"r2","b":"sw","rotulo":""},{"a":"sw","b":"pc","rotulo":""}],"legenda":"O PC usa o IP virtual 192.168.1.1."},{"tipo":"cli","titulo":"HSRPv2","passos":[{"prompt":"R1(config)#","cmd":"interface g0/0","explica":""},{"prompt":"R1(config-if)#","cmd":"ip address 192.168.1.2 255.255.255.0","explica":""},{"prompt":"R1(config-if)#","cmd":"standby version 2","explica":""},{"prompt":"R1(config-if)#","cmd":"standby 1 ip 192.168.1.1","explica":"IP virtual do grupo 1."},{"prompt":"R1(config-if)#","cmd":"standby 1 priority 110","explica":"Maior prioridade (padrão 100) → Active."},{"prompt":"R1(config-if)#","cmd":"standby 1 preempt","explica":"Recupera o papel de Active quando volta."},{"prompt":"R2(config-if)#","cmd":"standby 1 ip 192.168.1.1","explica":"Em R2 (IP .3), prioridade padrão 100."},{"prompt":"R1#","cmd":"show standby brief","explica":"Estado Active/Standby, IP virtual."}],"nota":""},{"tipo":"tabela","titulo":"","cabecalho":["","HSRP","VRRP","GLBP"],"linhas":[["Dono","Cisco","Norma aberta (RFC 5798)","Cisco"],["Papéis","Active / Standby","Master / Backup","AVG / AVF"],["Balanceamento","Por grupo/VLAN","Por grupo/VLAN","Sim, no mesmo grupo"],["MAC virtual","0000.0c07.acXX (v1) / 0000.0c9f.fXXX (v2)","0000.5e00.01XX","0007.b400.XXYY"],["Preempção","Desligada por defeito","Ligada por defeito","Desligada (AVG)"]]},{"tipo":"dica","html":"Para balancear com HSRP use dois grupos: R1 Active na VLAN 10 e R2 Active na VLAN 20."},{"tipo":"video","titulo":"HSRP","busca":"HSRP configuração Cisco CCNA FHRP","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a prioridade HSRP por defeito?","opcoes":["0","50","100","255"],"correta":2,"explica":"100."},{"tipo":"mc","p":"Qual FHRP é uma norma aberta?","opcoes":["HSRP","GLBP","VRRP","CDP"],"correta":2,"explica":"VRRP — RFC 5798."},{"tipo":"vf","p":"Sem 'preempt', um router HSRP com maior prioridade que arranca depois não toma o papel de Active.","correta":true,"explica":"A preempção está desligada por defeito no HSRP."},{"tipo":"mc","p":"O que configuram os PCs como gateway?","opcoes":["IP real do router Active","IP virtual do grupo","IP do switch","Nada"],"correta":1,"explica":"Sempre o IP virtual."}],"referencias":["rfc2281","rfc5798","odom2"]}],"prova_extra":[{"tipo":"mc","p":"Um router aprende 10.10.0.0/16 por OSPF e por RIP. Qual entra na tabela?","opcoes":["RIP, menor métrica","OSPF, menor AD","Ambas","A mais recente"],"correta":1,"explica":"Mesmo prefixo: AD 110 vence 120."},{"tipo":"mc","p":"GigabitEthernet e FastEthernet com reference-bandwidth padrão têm custo OSPF…","opcoes":["1 e 1","1 e 10","4 e 19","10 e 100"],"correta":0,"explica":"100/1000 e 100/100 → custo mínimo 1 para ambas."},{"tipo":"cmd","p":"Escreva a rota estática para 10.5.0.0/16 via 172.16.1.2 com AD 200.","respostas":["ip route 10.5.0.0 255.255.0.0 172.16.1.2 200"],"explica":"ip route 10.5.0.0 255.255.0.0 172.16.1.2 200."},{"tipo":"vf","p":"Entre dois routers DROther numa rede Ethernet a vizinhança fica em 2-WAY.","correta":true,"explica":"Só formam Full com o DR e o BDR."}]},{"id":"m7","numero":7,"titulo":"Serviços IP","descricao":"DHCP, DNS, NAT, NTP, SNMP, Syslog, transferência de ficheiros e QoS.","dominio":"4.0 IP Services","icone":"servidor","licoes":[{"id":"m7l1","titulo":"DHCP e DNS","minutos":20,"nivel":"básico","objetivos":["Descrever o processo DORA","Configurar um router como servidor DHCP e como relay","Explicar a resolução DNS"],"blocos":[{"tipo":"texto","titulo":"DORA","html":"<ol>\n<li><b>Discover</b>: o cliente (sem IP, origem 0.0.0.0) envia broadcast a procurar servidores.</li>\n<li><b>Offer</b>: o servidor oferece um endereço.</li>\n<li><b>Request</b>: o cliente pede formalmente esse endereço (broadcast, para os outros servidores saberem).</li>\n<li><b>Acknowledgment</b>: o servidor confirma e o empréstimo (lease) começa.</li>\n</ol>"},{"tipo":"cli","titulo":"Router como servidor DHCP","passos":[{"prompt":"R1(config)#","cmd":"ip dhcp excluded-address 192.168.10.1 192.168.10.20","explica":"Reserva endereços para gateway, servidores e impressoras."},{"prompt":"R1(config)#","cmd":"ip dhcp pool VLAN10","explica":"Cria o conjunto (pool)."},{"prompt":"R1(dhcp-config)#","cmd":"network 192.168.10.0 255.255.255.0","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"default-router 192.168.10.1","explica":"Gateway entregue aos clientes."},{"prompt":"R1(dhcp-config)#","cmd":"dns-server 8.8.8.8 1.1.1.1","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"domain-name empresa.local","explica":""},{"prompt":"R1(dhcp-config)#","cmd":"lease 7","explica":"Duração em dias."},{"prompt":"R1#","cmd":"show ip dhcp binding","explica":"Quem recebeu que IP."},{"prompt":"R1#","cmd":"show ip dhcp pool","explica":"Utilização do pool."}],"nota":""},{"tipo":"topologia","nos":[{"id":"pc","tipo":"pc","x":10,"y":50,"rotulo":"PC VLAN 20"},{"id":"r1","tipo":"router","x":45,"y":50,"rotulo":"R1 relay"},{"id":"srv","tipo":"servidor","x":85,"y":50,"rotulo":"DHCP 10.0.0.10"}],"ligacoes":[{"a":"pc","b":"r1","rotulo":"broadcast"},{"a":"r1","b":"srv","rotulo":"unicast"}],"legenda":"Broadcasts não atravessam routers: o relay converte o pedido em unicast."},{"tipo":"cli","titulo":"DHCP relay","passos":[{"prompt":"R1(config)#","cmd":"interface g0/1","explica":"Interface do lado dos clientes."},{"prompt":"R1(config-if)#","cmd":"ip helper-address 10.0.0.10","explica":"Encaminha pedidos DHCP para o servidor central."},{"prompt":"R1(config-if)#","cmd":"ip address dhcp","explica":"(Noutro cenário) o router é cliente DHCP, típico na ligação ao ISP."}],"nota":""},{"tipo":"texto","titulo":"DNS","html":"<p>O <b>DNS</b> traduz nomes (<code>www.cisco.com</code>) em endereços IP. O PC pergunta ao seu servidor DNS (resolvedor), que consulta a raiz, depois o TLD (.com) e por fim o servidor autoritativo. Registos comuns: <b>A</b> (IPv4), <b>AAAA</b> (IPv6), <b>CNAME</b> (alias), <b>MX</b> (correio), <b>PTR</b> (inverso), <b>NS</b>.</p>"},{"tipo":"cli","titulo":"DNS no IOS","passos":[{"prompt":"R1(config)#","cmd":"ip name-server 8.8.8.8","explica":"O router usa este DNS."},{"prompt":"R1(config)#","cmd":"ip domain-lookup","explica":"Ativa a resolução (padrão)."},{"prompt":"R1(config)#","cmd":"ip host SRV1 10.0.0.10","explica":"Entrada estática local."}],"nota":""},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem servidores DHCP e DNS prontos no separador Services.","Os PCs pedem IP ao mudar para 'DHCP' em IP Configuration."],"real":["Use 'ipconfig /release' e '/renew' (Windows) ou 'dhclient' (Linux) para testar.","Em empresas o DHCP costuma ser um servidor Windows/Linux ou a firewall; o router faz só relay.","Ative DHCP snooping nos switches para evitar servidores DHCP falsos (módulo de segurança)."]},{"tipo":"video","titulo":"DHCP DORA e relay","busca":"DHCP DORA ip helper-address configuração Cisco","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a ordem do DHCP?","opcoes":["Discover, Request, Offer, Ack","Discover, Offer, Request, Ack","Offer, Discover, Ack, Request","Request, Offer, Discover, Ack"],"correta":1,"explica":"D-O-R-A."},{"tipo":"cmd","p":"Que comando de interface encaminha pedidos DHCP para 10.0.0.10?","respostas":["ip helper-address 10.0.0.10"],"explica":"ip helper-address."},{"tipo":"mc","p":"Que registo DNS devolve um endereço IPv6?","opcoes":["A","AAAA","MX","PT escarta e regista, mas a porta continua ativa."}],"referencias":["ieee8021x","odom2","netacad_srwe"]},{"id":"m8l4","titulo":"VPNs e IPsec","minutos":15,"nivel":"básico","objetivos":["Distinguir VPN site-to-site e acesso remoto","Conhecer os componentes do IPsec"],"blocos":[{"tipo":"topologia","nos":[{"id":"sede","tipo":"router","x":15,"y":50,"rotulo":"Sede"},{"id":"net","tipo":"nuvem","x":50,"y":50,"rotulo":"Internet"},{"id":"fil","tipo":"router","x":85,"y":50,"rotulo":"Filial"},{"id":"rem","tipo":"portatil","x":50,"y":90,"rotulo":"Teletrabalho"}],"ligacoes":[{"a":"sede","b":"net","rotulo":"túnel IPsec"},{"a":"net","b":"fil","rotulo":"túnel IPsec"},{"a":"rem","b":"net","rotulo":"VPN SSL/TLS"}],"legenda":"Site-to-site liga redes; acesso remoto liga um utilizador."},{"tipo":"tabela","titulo":"","cabecalho":["","Site-to-site","Acesso remoto"],"linhas":[["Liga","Rede ↔ rede","Utilizador ↔ rede"],["Cliente","Nenhum nos PCs (routers/firewalls fazem tudo)","Software (ex.: Cisco Secure Client) ou browser"],["Tecnologia","IPsec (IKEv2), GRE sobre IPsec, DMVPN","TLS/SSL ou IPsec"],["Sempre ligado","Sim","Quando o utilizador liga"]]},{"tipo":"texto","titulo":"IPsec em resumo","html":"<ul>\n<li><b>Confidencialidade</b>: cifra (AES).</li>\n<li><b>Integridade</b>: hash (SHA-2).</li>\n<li><b>Autenticação</b>: PSK ou certificados.</li>\n<li><b>Troca de chaves</b>: Diffie-Hellman, via <b>IKE</b> (UDP 500; 4500 com NAT-T).</li>\n<li>Protocolos: <b>ESP</b> (cifra + integridade, o habitual) e <b>AH</b> (só integridade, não funciona com NAT).</li>\n<li>Modos: <b>túnel</b> (novo cabeçalho IP — VPN site-to-site) e <b>transporte</b>.</li>\n</ul>\n<p><b>GRE</b> sozinho não cifra, mas transporta multicast (útil para OSPF) — por isso usa-se GRE sobre IPsec.</p>"},{"tipo":"dica","html":"Para o CCNA basta perceber os conceitos de VPN; a configuração completa de IPsec é tema do CCNP Security."},{"tipo":"video","titulo":"VPN IPsec explicada","busca":"VPN IPsec site to site remote access CCNA explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que protocolo IPsec cifra os dados?","opcoes":["AH","ESP","GRE","IKE"],"correta":1,"explica":"ESP. O AH só autentica."},{"tipo":"mc","p":"Que tipo de VPN liga a sede à filial de forma permanente?","opcoes":["Acesso remoto","Site-to-site","Clientless","SSL web"],"correta":1,"explica":"Site-to-site."},{"tipo":"vf","p":"Um túnel GRE sem IPsec cifra o tráfego.","correta":false,"explica":"GRE só encapsula."},{"tipo":"mc","p":"IKE usa a porta…","opcoes":["TCP 443","UDP 500","TCP 49","UDP 69"],"correta":1,"explica":"UDP 500 (e 4500 com NAT-T)."}],"referencias":["rfc4301","odom2","netacad_ensa"]}],"prova_extra":[{"tipo":"mc","p":"Uma ACL extended 'deny tcp any host 10.0.0.10 eq 80' sem mais linhas é aplicada. O que acontece ao resto do tráfego?","opcoes":["É permitido","É bloqueado pelo deny implícito","Só ICMP passa","Depende do sentido"],"correta":1,"explica":"Faltou 'permit ip any any'."},{"tipo":"mc","p":"Qual ferramenta impede que um utilizador ligue um router doméstico que distribua IPs na rede?","opcoes":["Port security","DHCP snooping","BPDU guard","CDP"],"correta":1,"explica":"Bloqueia DHCP Offers de portas untrusted."},{"tipo":"cmd","p":"Que comando de linha aplica a ACL 5 ao acesso vty?","respostas":["access-class 5 in"],"explica":"access-class 5 in."}]},{"id":"m9","numero":9,"titulo":"Automação e Programabilidade","descricao":"SDN, controladores, APIs REST, JSON, Python com Netmiko, Ansible e IA nas operações de rede.","dominio":"6.0 Automation and Programmability","icone":"codigo","licoes":[{"id":"m9l1","titulo":"SDN e controladores","minutos":15,"nivel":"básico","objetivos":["Separar plano de controlo, de dados e de gestão","Explicar APIs northbound e southbound","Conhecer Catalyst Center e SD-Access"],"blocos":[{"tipo":"figura","nome":"sdn","legenda":"Arquitetura SDN: aplicações por cima (northbound API), controlador ao centro, equipamentos por baixo (southbound API)."},{"tipo":"tabela","titulo":"Os três planos","cabecalho":["Plano","Função","Exemplos"],"linhas":[["Dados (data/forwarding)","Encaminhar tramas e pacotes","Comutação, NAT, ACLs a filtrar"],["Controlo","Decidir como encaminhar","OSPF, STP, ARP, tabela MAC"],["Gestão","Administrar o equipamento","SSH, SNMP, Syslog"]]},{"tipo":"texto","titulo":"Tradicional × controlador","html":"<p>Na rede tradicional, cada equipamento tem o seu plano de controlo e é configurado um a um (CLI). Na <b>SDN</b> o <b>controlador</b> centraliza parte do controlo e a configuração: define-se a <b>intenção</b> (“convidados não acedem a servidores”) e ele aplica-a em todos os equipamentos.</p>\n<ul>\n<li><b>Northbound API</b>: entre aplicações/scripts e o controlador — normalmente <b>REST</b> com JSON.</li>\n<li><b>Southbound API</b>: entre controlador e equipamentos — NETCONF, RESTCONF, OpenFlow, SSH/CLI, SNMP.</li>\n<li><b>Underlay</b>: a rede física. <b>Overlay</b>: túneis lógicos por cima (VXLAN no SD-Access). <b>Fabric</b>: o conjunto.</li>\n</ul>\n<p>Na Cisco: <b>Catalyst Center</b> (antigo DNA Center) para campus com <b>SD-Access</b>, e <b>SD-WAN</b> (Catalyst SD-WAN) para WAN.</p>"},{"tipo":"tabela","titulo":"","cabecalho":["","Gestão tradicional","Catalyst Center"],"linhas":[["Configuração","Equipamento a equipamento, CLI","Central, por políticas e modelos"],["Visibilidade","show/SNMP isolados","Telemetria e saúde de toda a rede"],["Alterações","Manuais, propensas a erro","Automatizadas e consistentes"],["Resolução de problemas","Reativa","Assistida (garantia/analytics)"]]},{"tipo":"video","titulo":"SDN e Catalyst Center","busca":"SDN controller based networking CCNA northbound southbound","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"OSPF pertence a que plano?","opcoes":["Dados","Controlo","Gestão","Aplicação"],"correta":1,"explica":"Protocolos de encaminhamento decidem o caminho: controlo."},{"tipo":"mc","p":"A API entre um script Python e o controlador é…","opcoes":["Southbound","Northbound","Eastbound","Underlay"],"correta":1,"explica":"Northbound."},{"tipo":"vf","p":"SSH para gerir um router faz parte do plano de gestão.","correta":true,"explica":"Gestão."},{"tipo":"mc","p":"Que tecnologia de overlay usa o SD-Access?","opcoes":["GRE","VXLAN","MPLS","PPP"],"correta":1,"explica":"VXLAN (com LISP no plano de controlo)."}],"referencias":["odom2","edelman","cisco_devnet"]},{"id":"m9l2","titulo":"APIs REST e JSON","minutos":18,"nivel":"intermédio","objetivos":["Usar verbos HTTP e códigos de resposta","Ler e escrever JSON","Fazer um pedido REST em Python"],"blocos":[{"tipo":"tabela","titulo":"","cabecalho":["Verbo HTTP","CRUD","Exemplo"],"linhas":[["GET","Read","Listar equipamentos"],["POST","Create","Criar uma VLAN"],["PUT / PATCH","Update","Substituir / alterar parte"],["DELETE","Delete","Apagar"]]},{"tipo":"tabela","titulo":"Códigos HTTP","cabecalho":["Código","Significado"],"linhas":[["200 OK","Sucesso"],["201 Created","Recurso criado"],["204 No Content","Sucesso sem corpo"],["400 Bad Request","Pedido mal formado"],["401 Unauthorized","Falta autenticação"],["403 Forbidden","Sem permissão"],["404 Not Found","Recurso não existe"],["500 Internal Server Error","Erro no servidor"]]},{"tipo":"exemplo","titulo":"JSON","html":"<pre><code>{\n  \"hostname\": \"R1\",\n  \"interfaces\": [\n    {\"nome\": \"GigabitEthernet0/0\", \"ip\": \"192.168.1.1\", \"ativa\": true},\n    {\"nome\": \"GigabitEthernet0/1\", \"ip\": null, \"ativa\": false}\n  ],\n  \"ospf\": {\"processo\": 1, \"area\": 0}\n}</code></pre>\n<p>Tipos: <b>objeto</b> <code>{}</code> com pares chave:valor, <b>array</b> <code>[]</code>, string entre aspas duplas, número, <code>true</code>/<code>false</code> e <code>null</code>.</p>"},{"tipo":"exemplo","titulo":"Pedido REST em Python (requests)","html":"<pre><code>import requests\n\nurl = \"https://controlador.exemplo/api/v1/network-device\"\ncabecalhos = {\"X-Auth-Token\": TOKEN, \"Accept\": \"application/json\"}\n\nresposta = requests.get(url, headers=cabecalhos, timeout=10)\nresposta.raise_for_status()          # erro se não for 2xx\n\nfor equipamento in resposta.json()[\"response\"]:\n    print(equipamento[\"hostname\"], equipamento[\"managementIpAddress\"])</code></pre>"},{"tipo":"texto","titulo":"Características REST","html":"<ul>\n<li><b>Cliente-servidor</b>, <b>sem estado</b> (cada pedido traz tudo o que é preciso, incluindo o token), cacheável, interface uniforme baseada em URIs.</li>\n<li>Autenticação comum: Basic, tokens (Bearer), chaves de API, OAuth.</li>\n</ul>"},{"tipo":"video","titulo":"REST API e JSON para CCNA","busca":"REST API JSON CCNA automação explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que verbo HTTP corresponde a 'Create'?","opcoes":["GET","POST","PUT","DELETE"],"correta":1,"explica":"POST cria."},{"tipo":"mc","p":"Que código indica falta de autenticação?","opcoes":["200","401","404","500"],"correta":1,"explica":"401 Unauthorized."},{"tipo":"mc","p":"Qual destes é JSON válido?","opcoes":["{'a': 1}","{\"a\": 1}","{a = 1}","<a>1</a>"],"correta":1,"explica":"Chaves e strings sempre com aspas duplas."},{"tipo":"vf","p":"As APIs REST são sem estado (stateless).","correta":true,"explica":"O servidor não guarda contexto entre pedidos."}],"referencias":["rfc8259","edelman","cisco_devnet","odom2"]},{"id":"m9l3","titulo":"Python, Ansible, Terraform e IA","minutos":22,"nivel":"intermédio","objetivos":["Automatizar configurações com Python e Netmiko","Comparar Ansible, Terraform, Puppet e Chef","Conhecer NETCONF/RESTCONF e YANG","Perceber o papel da IA nas operações de rede"],"blocos":[{"tipo":"exemplo","titulo":"Backup de vários routers com Netmiko","html":"<pre><code>from netmiko import ConnectHandler\nfrom datetime import date\n\nrouters = [\"10.0.0.1\", \"10.0.0.2\", \"10.0.0.3\"]\n\nfor ip in routers:\n    equipamento = {\n        \"device_type\": \"cisco_ios\",\n        \"host\": ip,\n        \"username\": \"admin\",\n        \"password\": SENHA,          # leia de variável de ambiente, nunca no código\n    }\n    with ConnectHandler(**equipamento) as ligacao:\n        config = ligacao.send_command(\"show running-config\")\n        with open(f\"backup_{ip}_{date.today()}.txt\", \"w\") as f:\n            f.write(config)\n    print(f\"{ip}: backup feito\")</code></pre>"},{"tipo":"exemplo","titulo":"Criar VLANs em todos os switches","html":"<pre><code>vlans = {10: \"VENDAS\", 20: \"TI\", 30: \"VOZ\"}\ncomandos = []\nfor numero, nome in vlans.items():\n    comandos += [f\"vlan {numero}\", f\"name {nome}\"]\n\nwith ConnectHandler(**switch) as ligacao:\n    print(ligacao.send_config_set(comandos))\n    ligacao.save_config()</code></pre>"},{"tipo":"tabela","titulo":"Gestão de configuração","cabecalho":["Ferramenta","Modelo","Agente","Linguagem"],"linhas":[["Ansible","Push","Sem agente (SSH/NETCONF)","YAML (playbooks)"],["Terraform","Declarativo (infra como código)","Sem agente (APIs)","HCL"],["Puppet","Pull","Com agente","Manifests (DSL)"],["Chef","Pull","Com agente","Recipes/Cookbooks (Ruby)"]]},{"tipo":"exemplo","titulo":"Playbook Ansible","html":"<pre><code>- name: Configurar NTP nos routers\n  hosts: routers\n  gather_facts: no\n  tasks:\n    - name: Servidor NTP\n      cisco.ios.ios_config:\n        lines:\n          - ntp server 10.0.0.100</code></pre>"},{"tipo":"texto","titulo":"Modelos de dados","html":"<p><b>YANG</b> é a linguagem que descreve <i>o que</i> se pode configurar num equipamento (modelo). <b>NETCONF</b> (SSH, porta 830, XML) e <b>RESTCONF</b> (HTTPS, JSON ou XML) são os protocolos que leem/escrevem dados segundo esses modelos — mais fiáveis do que analisar texto da CLI.</p>"},{"tipo":"texto","titulo":"IA e machine learning nas operações de rede","html":"<p>O tópico 6.x do exame v1.1 inclui IA: <b>IA generativa</b> (assistentes que explicam saídas e geram configurações — revê sempre antes de aplicar!), <b>IA preditiva</b> e <b>machine learning</b> (deteção de anomalias, previsão de falhas e de capacidade a partir da telemetria).</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem um modo de programação Python limitado e suporte a algumas APIs do controlador simulado.","Use os sandboxes gratuitos do Cisco DevNet para experimentar APIs reais."],"real":["Teste sempre os scripts primeiro num laboratório (CML/EVE-NG) e depois num equipamento pouco crítico.","Guarde credenciais num cofre/variáveis de ambiente, nunca no repositório.","Use controlo de versões (Git) para scripts, playbooks e backups de configuração."]},{"tipo":"video","titulo":"Automação de redes com Python","busca":"Python Netmiko automação de redes Cisco tutorial","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual destas ferramentas não precisa de agente nos equipamentos?","opcoes":["Puppet","Chef","Ansible","Todas precisam"],"correta":2,"explica":"Ansible usa SSH/APIs."},{"tipo":"mc","p":"Em que formato se escrevem os playbooks Ansible?","opcoes":["JSON","YAML","XML","Ruby"],"correta":1,"explica":"YAML."},{"tipo":"mc","p":"Que porta usa o NETCONF sobre SSH?","opcoes":["22","443","830","8080"],"correta":2,"explica":"830."},{"tipo":"vf","p":"YANG é um protocolo de transporte como o HTTP.","correta":false,"explica":"YANG é uma linguagem de modelação de dados."},{"tipo":"mc","p":"No Netmiko, que método envia uma lista de comandos de configuração?","opcoes":["send_command","send_config_set","push_config","configure"],"correta":1,"explica":"send_config_set."}],"referencias":["netmiko","ansible","rfc6241","rfc8040","edelman"]}],"prova_extra":[{"tipo":"mc","p":"Um script recebe 404 ao chamar a API. Significa…","opcoes":["Sem autenticação","Recurso/URL inexistente","Erro do servidor","Sucesso sem conteúdo"],"correta":1,"explica":"404 Not Found."},{"tipo":"mc","p":"Qual protocolo southbound usa HTTPS e JSON?","opcoes":["NETCONF","RESTCONF","OpenFlow","SNMP"],"correta":1,"explica":"RESTCONF."},{"tipo":"vf","p":"Num controlador SDN, a northbound API normalmente é REST.","correta":true,"explica":"Aplicações falam com o controlador por REST."}]}],"labs":[{"id":"lab1","titulo":"Primeiro contacto com o IOS","modulo":"m4","dispositivo":"router","hostname":"Router","descricao":"Navegue entre os modos, dê nome ao router e guarde a configuração.","tarefas":[{"desc":"Entre no modo privilegiado e depois na configuração global","dica":"enable → configure terminal","check":{"t":"mode","v":"config"}},{"desc":"Dê o nome R1 ao router","dica":"hostname R1","check":{"t":"hostname","v":"R1"}},{"desc":"Desative a pesquisa DNS de comandos errados","dica":"no ip domain-lookup","check":{"t":"no_domain_lookup"}},{"desc":"Volte ao modo privilegiado e guarde a configuração","dica":"end → copy running-config startup-config","check":{"t":"saved"}}],"nivel":"básico"},{"id":"lab2","titulo":"Configuração base segura","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Proteja o router como faria no primeiro dia de trabalho.","tarefas":[{"desc":"Palavra-passe do modo privilegiado com hash","dica":"enable secret <senha>","check":{"t":"enable_secret"}},{"desc":"Palavra-passe e login na consola","dica":"line console 0 → password <senha> → login","check":{"t":"line_login","line":"con"}},{"desc":"Cifre as palavras-passe em texto simples","dica":"service password-encryption","check":{"t":"pwd_enc"}},{"desc":"Configure um banner MOTD","dica":"banner motd #Acesso restrito#","check":{"t":"banner"}},{"desc":"Guarde a configuração","dica":"copy running-config startup-config","check":{"t":"saved"}}],"nivel":"básico"},{"id":"lab3","titulo":"Acesso remoto por SSH","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Ative SSH versão 2 com utilizador local e bloqueie o Telnet.","tarefas":[{"desc":"Defina o domínio empresa.local","dica":"ip domain-name empresa.local","check":{"t":"domain"}},{"desc":"Crie o utilizador admin com secret","dica":"username admin secret <senha>","check":{"t":"user","v":"admin"}},{"desc":"Gere as chaves RSA de 2048 bits","dica":"crypto key generate rsa modulus 2048","check":{"t":"rsa"}},{"desc":"Nas linhas vty use utilizadores locais","dica":"line vty 0 4 → login local","check":{"t":"line_login","line":"vty","local":true}},{"desc":"Permita apenas SSH nas vty","dica":"transport input ssh","check":{"t":"vty_ssh"}}],"nivel":"intermédio"},{"id":"lab4","titulo":"Interfaces do router","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Ponha as interfaces LAN e WAN a funcionar.","tarefas":[{"desc":"G0/0: 192.168.1.1/24","dica":"interface g0/0 → ip address 192.168.1.1 255.255.255.0","check":{"t":"iface_ip","if":"GigabitEthernet0/0","ip":"192.168.1.1","mask":"255.255.255.0"}},{"desc":"Descreva G0/0 como LAN","dica":"description LAN","check":{"t":"iface_desc","if":"GigabitEthernet0/0"}},{"desc":"Ative G0/0","dica":"no shutdown","check":{"t":"iface_up","if":"GigabitEthernet0/0"}},{"desc":"G0/1: 10.0.12.1/30 e ativa","dica":"interface g0/1 → ip address 10.0.12.1 255.255.255.252 → no shutdown","check":{"t":"iface_ip","if":"GigabitEthernet0/1","ip":"10.0.12.1","mask":"255.255.255.252","up":true}},{"desc":"Verifique com show ip interface brief","dica":"do show ip interface brief","check":{"t":"ran","v":"show ip interface brief"}}],"nivel":"básico"},{"id":"lab5","titulo":"VLANs e portas de acesso","modulo":"m5","dispositivo":"switch","hostname":"SW1","descricao":"Crie as VLANs da empresa e coloque as portas certas em cada uma.","tarefas":[{"desc":"Crie a VLAN 10 com o nome VENDAS","dica":"vlan 10 → name VENDAS","check":{"t":"vlan","id":10,"name":"VENDAS"}},{"desc":"Crie a VLAN 20 com o nome TI","dica":"vlan 20 → name TI","check":{"t":"vlan","id":20,"name":"TI"}},{"desc":"Fa0/1 em modo access na VLAN 10","dica":"interface fa0/1 → switchport mode access → switchport access vlan 10","check":{"t":"access_vlan","if":"FastEthernet0/1","vlan":10}},{"desc":"Fa0/2 em modo access na VLAN 20","dica":"interface fa0/2 → switchport mode access → switchport access vlan 20","check":{"t":"access_vlan","if":"FastEthernet0/2","v 0/1 → ip address 10.0.12.1 255.255.255.252 → no shutdown","check":{"t":"iface_ip","if":"GigabitEthernet0/1","ip":"10.0.12.1","mask":"255.255.255.252","up":true}},{"desc":"Rota para 192.168.2.0/24 via 10.0.12.2","dica":"ip route 192.168.2.0 255.255.255.0 10.0.12.2","check":{"t":"route","net":"192.168.2.0","mask":"255.255.255.0","via":"10.0.12.2"}},{"desc":"Rota por defeito via 203.0.113.1","dica":"ip route 0.0.0.0 0.0.0.0 203.0.113.1","check":{"t":"route","net":"0.0.0.0","mask":"0.0.0.0","via":"203.0.113.1"}},{"desc":"Veja a tabela de encaminhamento","dica":"do show ip route","check":{"t":"ran","v":"show ip route"}}],"nivel":"intermédio"},{"id":"lab9","titulo":"OSPF de área única","modulo":"m6","dispositivo":"router","hostname":"R1","descricao":"Ative OSPF na área 0 com router ID manual e LAN passiva.","tarefas":[{"desc":"Inicie o processo OSPF 1","dica":"router ospf 1","check":{"t":"ospf"}},{"desc":"Router ID 1.1.1.1","dica":"router-id 1.1.1.1","check":{"t":"ospf_rid","v":"1.1.1.1"}},{"desc":"Anuncie 10.0.12.0/30 na área 0","dica":"network 10.0.12.0 0.0.0.3 area 0","check":{"t":"ospf_net","net":"10.0.12.0","wc":"0.0.0.3","area":"0"}},{"desc":"Anuncie 192.168.1.0/24 na área 0","dica":"network 192.168.1.0 0.0.0.255 area 0","check":{"t":"ospf_net","net":"192.168.1.0","wc":"0.0.0.255","area":"0"}},{"desc":"G0/0 (LAN) passiva","dica":"passive-interface g0/0","check":{"t":"passive","if":"GigabitEthernet0/0"}}],"nivel":"avançado"},{"id":"lab10","titulo":"Servidor DHCP no router","modulo":"m7","dispositivo":"router","hostname":"R1","descricao":"Distribua endereços na LAN 192.168.1.0/24.","tarefas":[{"desc":"Exclua 192.168.1.1 a 192.168.1.10","dica":"ip dhcp excluded-address 192.168.1.1 192.168.1.10","check":{"t":"dhcp_excl"}},{"desc":"Crie o pool LAN com a rede 192.168.1.0/24","dica":"ip dhcp pool LAN → network 192.168.1.0 255.255.255.0","check":{"t":"dhcp_pool","name":"LAN","net":"192.168.1.0"}},{"desc":"Gateway 192.168.1.1 no pool","dica":"default-router 192.168.1.1","check":{"t":"dhcp_gw","name":"LAN","v":"192.168.1.1"}},{"desc":"DNS 8.8.8.8 no pool","dica":"dns-server 8.8.8.8","check":{"t":"dhcp_dns","name":"LAN"}}],"nivel":"intermédio"},{"id":"lab11","titulo":"PAT para a Internet","modulo":"m7","dispositivo":"router","hostname":"R1","descricao":"Toda a LAN 192.168.1.0/24 sai para a Internet com o IP de G0/1.","tarefas":[{"desc":"ACL 1 a permitir 192.168.1.0/24","dica":"access-list 1 permit 192.168.1.0 0.0.0.255","check":{"t":"acl_std","n":1}},{"desc":"G0/0 como ip nat inside","dica":"interface g0/0 → ip nat inside","check":{"t":"nat_inside","if":"GigabitEthernet0/0"}},{"desc":"G0/1 como ip nat outside","dica":"interface g0/1 → ip nat outside","check":{"t":"nat_outside","if":"GigabitEthernet0/1"}},{"desc":"Ative o PAT com a interface G0/1","dica":"ip nat inside source list 1 interface g0/1 overload","check":{"t":"nat_overload"}}],"nivel":"intermédio"},{"id":"lab12","titulo":"Port security","modulo":"m8","dispositivo":"switch","hostname":"SW1","descricao":"Proteja a porta Fa0/5 de um posto de trabalho com PC e telefone IP.","tarefas":[{"desc":"Fa0/5 em modo access","dica":"interface fa0/5 → switchport mode access","check":{"t":"access_mode","if":"FastEthernet0/5"}},{"desc":"Ative port security","dica":"switchport port-security","check":{"t":"portsec","if":"FastEthernet0/5"}},{"desc":"Máximo de 2 MACs","dica":"switchport port-security maximum 2","check":{"t":"portsec_max","if":"FastEthernet0/5","v":2}},{"desc":"Aprenda os MACs com sticky","dica":"switchport port-security mac-address sticky","check":{"t":"portsec_sticky","if":"FastEthernet0/5"}}],"nivel":"intermédio"}],"referencias":{"odom1":"ODOM, Wendell. CCNA 200-301 Official Cert Guide, Volume 1. 2. ed. Hoboken: Cisco Press, 2024.","odom2":"ODOM, Wendell. CCNA 200-301 Official Cert Guide, Volume 2. 2. ed. Hoboken: Cisco Press, 2024.","lammle":"LAMMLE, Todd. CCNA Certification Study Guide: Exam 200-301. Indianapolis: Sybex/Wiley, 2020.","kurose":"KUROSE, James F.; ROSS, Keith W. R  IP Services","peso":10,"modulos":["m7"]},{"nome":"5.0 Security Fundamentals","peso":15,"modulos":["m8"]},{"nome":"6.0 Automation and Programmability","peso":10,"modulos":["m9"]}],"plano":[{"semana":"Semana 1","tema":"Módulo 1 + Módulo 2","pratica":"Instale o Packet Tracer. Desenhe a rede de sua casa com os ícones certos."},{"semana":"Semana 2","tema":"Módulo 3 (IPv4 e sub-redes)","pratica":"Desafio Sub-rede todos os dias: objetivo 10 acertos seguidos em menos de 30 s cada."},{"semana":"Semana 3","tema":"Módulo 3 (VLSM e IPv6) + Módulo 4","pratica":"Faça os Laboratórios CLI 1 e 2 até não precisar de ajuda."},{"semana":"Semana 4","tema":"Módulo 5 (switch, VLANs, inter-VLAN)","pratica":"Monte no Packet Tracer 2 switches, 3 VLANs e router-on-a-stick."},{"semana":"Semana 5","tema":"Módulo 5 (STP, EtherChannel, Wi-Fi)","pratica":"Provoque um loop e veja o STP a resolvê-lo; configure LACP."},{"semana":"Semana 6","tema":"Módulo 6 (rotas estáticas e tabela)","pratica":"Laboratório de rotas estáticas com caminho de volta e rota flutuante."},{"semana":"Semana 7","tema":"Módulo 6 (OSPF e HSRP)","pratica":"OSPF com 3 routers, DR/BDR e passive-interface."},{"semana":"Semana 8","tema":"Módulo 7 (DHCP, NAT, NTP, Syslog, QoS)","pratica":"Rede completa com DHCP central + relay e PAT para a Internet."},{"semana":"Semana 9","tema":"Módulo 8 (segurança)","pratica":"ACLs standard e extended, port security, DHCP snooping."},{"semana":"Semana 10","tema":"Módulo 9 (automação)","pratica":"Escreva um script Python que faça backup de 2 routers (CML/DevNet sandbox)."},{"semana":"Semana 11","tema":"Revisão geral","pratica":"Refaça todas as provas de módulo até ≥ 900 pontos. Reveja o caderno de erros."},{"semana":"Semana 12","tema":"Simulados","pratica":"Simulados completos cronometrados (120 min). Marque o exame quando passar com folga."}],"dicas":["O exame 200-301 tem cerca de 100 a 120 perguntas em 120 minutos (a Cisco não publica o número exato) e não permite voltar atrás.","Tipos de pergunta: escolha múltipla (uma ou várias), arrastar e largar, e simulações/testlets em CLI.","A nota de aprovação não é publicada oficialmente; a comunidade aponta cerca de 800–850 em 1000. Nesta app a prova de módulo exige 825.","Gestão de tempo: ~1 minuto por pergunta. Se não sabe, elimine opções, escolha e avance.","Leia a pergunta duas vezes: palavras como NOT, BEST, FIRST e “escolha duas” mudam tudo.","Sub-redes: tem de as fazer de cabeça em menos de 30 segundos.","Pratique CLI até escrever os comandos sem pensar — as simulações valem mais pontos.","Agende o exame na Pearson VUE (centro de testes ou online) e leia as regras de identificação.","A certificação CCNA é válida por 3 anos; renova-se com novo exame ou créditos de formação contínua (CE)."],"ferramentas":[{"nome":"Cisco Packet Tracer","desc":"Gratuito via NetAcad. Usado em todos os laboratórios desta app.","url":"https://www.netacad.com/cisco-packet-tracer"},{"nome":"Cisco Modeling Labs (CML)","desc":"Imagens IOS reais. Versão Free com limite de nós.","url":"https://developer.cisco.com/modeling-labs/"},{"nome":"GNS3","desc":"Emulador gratuito e de código aberto.","url":"https://www.gns3.com"},{"nome":"EVE-NG","desc":"Plataforma de emulação multi-fabricante (Community gratuita).","url":"https://www.eve-ng.net"},{"nome":"Wireshark","desc":"Analisador de pacotes: veja ARP, DHCP, TCP a acontecer.","url":"https://www.wireshark.org"},{"nome":"Cisco DevNet Sandbox","desc":"Ambientes gratuitos para testar APIs e automação.","url":"https://developer.cisco.com/site/sandbox/"},{"nome":"Cisco Learning Network","desc":"Comunidade oficial, temas do exame e grupos de estudo.","url":"https://learningnetwork.cisco.com"}],"glossario":[{"termo":"AAA","def":"Authentication, Authorization, Accounting: quem é, o que pode fazer, o que fez."},{"termo":"ACL","def":"Access Control List: lista de regras que permite ou nega tráfego."},{"termo":"AD","def":"Distância administrativa: confiança numa origem de rotas (menor = melhor)."},{"termo":"APIPA","def":"Endereço 169.254.x.x que o host atribui a si próprio quando não há DHCP."},{"termo":"ARP","def":"Descobre o MAC a partir do IP numa rede IPv4."},{"termo":"BPDU","def":"Mensagem do Spanning Tree trocada entre switches."},{"termo":"CAPWAP","def":"Protocolo de túnel entre APs leves e a WLC."},{"termo":"CDP","def":"Cisco Discovery Protocol: descobre vizinhos Cisco diretamente ligados."},{"termo":"CIDR","def":"Notação /prefixo e agregação de redes sem classes."},{"termo":"CoS","def":"Class of Service: 3 bits de prioridade na etiqueta 802.1Q."},{"termo":"DHCP","def":"Atribui IP, máscara, gateway e DNS automaticamente."},{"termo":"DNS","def":"Traduz nomes em endereços IP."},{"termo":"DSCP","def":"6 bits do cabeçalho IP usados para QoS."},{"termo":"DTP","def":"Dynamic Trunking Protocol: negociação automática de trunk (Cisco)."},{"termo":"EtherChannel","def":"Agregação de várias ligações físicas numa lógica."},{"termo":"FHRP","def":"Protocolos de redundância de gateway: HSRP, VRRP, GLBP."},{"termo":"Gateway","def":"Router que leva o tráfego para fora da rede local."},{"termo":"HSRP","def":"Hot Standby Router Protocol (Cisco): gateway virtual redundante."},{"termo":"LACP","def":"Protocolo aberto de negociação de EtherChannel."},{"termo":"LLDP","def":"Descoberta de vizinhos, norma IEEE 802.1AB."},{"termo":"MAC","def":"Endereço físico de 48 bits de uma placa de rede."},{"termo":"MTU","def":"Tamanho máximo do pacote numa ligação (1500 bytes em Ethernet)."},{"termo":"NAT/PAT","def":"Tradução de endereços privados para públicos; PAT usa portas."},{"termo":"NTP","def":"Sincroniza os relógios dos equipamentos."},{"termo":"OSPF","def":"Protocolo de encaminhamento de estado de ligação (link-state)."},{"termo":"PoE","def":"Power over Ethernet: alimentação de APs e telefones pelo cabo."},{"termo":"PortFast","def":"Porta de acesso passa logo a forwarding no STP."},{"termo":"QoS","def":"Mecanismos para priorizar tráfego (voz, vídeo)."},{"termo":"REST","def":"Estilo de API sobre HTTP com verbos GET/POST/PUT/DELETE."},{"termo":"SDN","def":"Rede definida por software, com controlador central."},{"termo":"SNMP","def":"Protocolo de monitorização e gestão de equipamentos."},{"termo":"SSH","def":"Acesso remoto cifrado à CLI (TCP 22)."},{"termo":"STP","def":"Spanning Tree Protocol: evita loops de camada 2."},{"termo":"SVI","def":"Interface virtual de VLAN num switch (interface vlan X)."},{"termo":"Syslog","def":"Envio de mensagens de registo para um servidor."},{"termo":"Trunk","def":"Ligação que transporta várias VLANs com etiquetas 802.1Q."},{"termo":"TTL","def":"Contador do IP que diminui a cada router; a 0 o pacote é descartado."},{"termo":"VLAN","def":"Rede lógica separada dentro de um switch; um domínio de broadcast."},{"termo":"VLSM","def":"Máscaras de tamanho variável dentro do mesmo bloco."},{"termo":"VPN","def":"Túnel cifrado sobre uma rede pública."},{"termo":"Wildcard","def":"Inverso da máscara, usado em ACLs e OSPF."},{"termo":"WLC","def":"Wireless LAN Controller: gere APs centralmente."},{"termo":"YANG","def":"Linguagem de modelação de dados de configuração de rede."}],"sim_real":[{"tema":"Ligar ao equipamento","sim":"Clique no separador CLI.","real":"Cabo de consola, driver USB-série, PuTTY a 9600 8N1."},{"tema":"Arranque","sim":"Segundos.","real":"Minutos; ROMMON se a imagem falhar."},{"tema":"Comandos","sim":"Subconjunto do IOS; alguns comandos não existem.","real":"IOS/IOS-XE completo; varia com a versão e a licença."},{"tema":"Portas","sim":"Ficam verdes rapidamente.","real":"LED âmbar ~30 s com STP; PortFast acelera."},{"tema":"Erros físicos","sim":"Praticamente inexistentes.","real":"Cabos maus, CRC, duplex mismatch, fibra suja."},{"tema":"Riscos","sim":"Nenhum: apague e recomece.","real":"Um erro corta a rede de uma empresa; use janelas de manutenção e 'reload in'."},{"tema":"Testes","sim":"Modo Simulation mostra cada pacote.","real":"Wireshark com SPAN, ping, traceroute, logs."},{"tema":"Documentação","sim":"Opcional.","real":"Obrigatória: diagramas, IPAM, backups e registo de alterações."}]}};

      <rect x="20" y="40" width="70" height="40" rx="4" class="f-rj45"/>
      <path d="M90 60 C 200 20, 300 100, 400 60" class="f-consola-cabo" fill="none"/>
      <path d="M400 40 h70 l-8 40 h-54z" class="f-db9"/>
      ${[0, 1, 2, 3, 4].map((i) => `<circle cx="${414 + i * 11}" cy="52" r="2.5" class="f-pino"/>`).join("")}
      ${[0, 1, 2, 3].map((i) => `<circle cx="${419 + i * 11}" cy="66" r="2.5" class="f-pino"/>`).join("")}
      ${T(55, 30, "RJ45 → porta CONSOLE", "f-label", 'text-anchor="middle"')}
      ${T(435, 30, "DB9 → PC (ou USB)", "f-label", 'text-anchor="middle"')}

  }

  function rj45Pinos() {
    const a = [["bv", "Branco-verde"], ["v", "Verde"], ["bl", "Branco-laranja"], ["az", "Azul"], ["baz", "Branco-azul"], ["l", "Laranja"], ["bc", "Branco-castanho"], ["c", "Castanho"]];
    const b = [["bl", "Branco-laranja"], ["l", "Laranja"], ["bv", "Branco-verde"], ["az", "Azul"], ["baz", "Branco-azul"], ["v", "Verde"], ["bc", "Branco-castanho"], ["c", "Castanho"]];
    const fio = (lista, x0, titulo) => `${T(x0 + 70, 22, titulo, "f-label", 'text-anchor="middle"')}` + lista.map((f, i) => {
      const x = x0 + i * 18;
      return `<rect x="${x}" y="32" width="12" height="70" class="f-fio-${f[0]}"/>${T(x + 6, 116, String(i + 1), "f-mini", 'text-anchor="middle"')}`;
    }).join("");
    return `<svg viewBox="0 0 520 130" class="fig">${fio(a, 30, "T568A")}${fio(b, 300, "T568B")}
      ${T(260, 70, "direto = B↔B", "f-mini", 'text-anchor="middle"')}${T(260, 86, "cruzado = A↔B", "f-mini", 'text-anchor="middle"')}</svg>`;
  }

  // ---------------------------------------------------------------- diagramas
  function osi() {
    const camadas = ["Aplicação", "Apresentação", "Sessão", "Transporte", "Rede", "Ligação de dados", "Física"];
    let s = "";
    camadas.forEach((c, i) => {
      const y = 12 + i * 30;
      s += `<rect x="20" y="${y}" width="200" height="26" rx="4" class="f-camada f-c${i}"/>${T(34, y + 17, (7 - i) + "  " + c, "f-txt-claro")}`;
    });
    const tcp = [["Aplicação", 0, 3], ["Transporte", 3, 1], ["Internet", 4, 1], ["Acesso à rede", 5, 2]];
    tcp.forEach(([n, ini, qt], i) => {
      const y = 12 + ini * 30, h = qt * 30 - 4;

    s += T(120, 232, "OSI", "f-label", 'text-anchor="middle"') + T(390, 232, "TCP/IP", "f-label", 'text-anchor="middle"');
    return `<svg viewBox="0 0 510 240" class="fig">${s}</svg>`;

  function encapsulamento() {
    const linhas = [
      ["Dados", [["DADOS", 220, 120, "f-dados"]]],
      ["Segmento", [["TCP", 170, 50, "f-h4"], ["DADOS", 220, 120, "f-dados"]]],
      ["Pacote", [["IP", 120, 50, "f-h3"], ["TCP", 170, 50, "f-h4"], ["DADOS", 220, 120, "f-dados"]]],
      ["Trama", [["ETH", 70, 50, "f-h2"], ["IP", 120, 50, "f-h3"], ["TCP", 170, 50, "f-h4"], ["DADOS", 220, 120, "f-dados"], ["FCS", 340, 40, "f-h2"]]],
      ["Bits", [["0110100101110010101011100101011010101", 70, 310, "f-bits"]]],
    ];
    let s = "";
    linhas.forEach(([nome, partes], i) => {
      const y = 14 + i * 36;

    });
    s += `<path d="M400 20 V180" class="f-seta-linha" marker-end="url(#ponta)"/>${T(408, 100, "envio", "f-mini")}`;
    return `<svg viewBox="0 0 460 200" class="fig"><defs><marker id="ponta" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" class="f-seta"/></marker></defs>${s}</svg>`;
  }

  function handshake() {
    const seta = (y, ida, txt) => {
      const [x1, x2] = ida ? [80, 380] : [380, 80];
      return `<path d="M${x1} ${y} L${x2} ${y + 26}" class="f-seta-linha" marker-end="url(#ponta2)"/>${T(230, y + 8, txt, "f-label", 'text-anchor="middle"')}`;
    };
    return `<svg viewBox="0 0 460 210" class="fig"><defs><marker id="ponta2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" class="f-seta"/></marker></defs>
      ${T(80, 18, "Cliente", "f-label", 'text-anchor="middle"')}${T(380, 18, "Servidor :443", "f-label", 'text-anchor="middle"')}
      <path d="M80 26 V200 M380 26 V200" class="f-linha-vida"/>
      ${seta(40, true, "SYN  seq=100")}${seta(90, false, "SYN-ACK  seq=300 ack=101")}${seta(140, true, "ACK  ack=301")}
