window.CCNA = {"versao":1,"titulo":"CCNA Passo a Passo","modulos":[{"id":"m1","numero":1,"titulo":"Fundamentos de Redes","descricao":"O ponto de partida: o que é uma rede, que equipamentos existem, como se ligam e que cabos usam.","dominio":"1.0 Network Fundamentals","icone":"nuvem","licoes":[{"id":"m1l1","titulo":"O que é uma rede de computadores","minutos":12,"nivel":"básico","objetivos":["Explicar o que é uma rede e para que serve","Distinguir cliente, servidor e dispositivo intermediário","Reconhecer LAN, WAN, MAN, WLAN e a Internet"],"blocos":[{"tipo":"texto","titulo":"A ideia central","html":"<p>Uma <b>rede de computadores</b> é um conjunto de dispositivos ligados entre si para <b>partilhar informação e recursos</b>: ficheiros, impressoras, acesso à Internet, aplicações, voz e vídeo.</p>\n<p>Toda a rede tem sempre três ingredientes:</p>\n<ul>\n<li><b>Dispositivos finais</b> (hosts): onde a informação nasce ou termina — PCs, portáteis, telemóveis, servidores, câmaras IP, impressoras.</li>\n<li><b>Dispositivos intermediários</b>: encaminham a informação — switches, routers, access points, firewalls.</li>\n<li><b>Meios</b>: o caminho físico — cabo de cobre, fibra ótica ou ondas de rádio (Wi-Fi).</li>\n</ul>\n<p>E há sempre <b>regras</b> combinadas, os <b>protocolos</b>, que definem como falar: formato das mensagens, endereços, ordem, tempos e o que fazer quando algo falha.</p>"},{"tipo":"topologia","nos":[{"id":"pc1","tipo":"pc","x":10,"y":30,"rotulo":"PC"},{"id":"pc2","tipo":"portatil","x":10,"y":75,"rotulo":"Portátil"},{"id":"sw","tipo":"switch","x":40,"y":52,"rotulo":"Switch"},{"id":"r","tipo":"router","x":68,"y":52,"rotulo":"Router"},{"id":"net","tipo":"nuvem","x":92,"y":52,"rotulo":"Internet"},{"id":"srv","tipo":"servidor","x":40,"y":10,"rotulo":"Servidor"}],"ligacoes":[{"a":"pc1","b":"sw","rotulo":""},{"a":"pc2","b":"sw","rotulo":""},{"a":"srv","b":"sw","rotulo":""},{"a":"sw","b":"r","rotulo":""},{"a":"r","b":"net","rotulo":"WAN"}],"legenda":"Uma pequena rede de escritório: hosts ligados a um switch (LAN) e um router que dá saída para a Internet (WAN)."},{"tipo":"texto","titulo":"Cliente e servidor","html":"<p>Um <b>servidor</b> é um host que oferece um serviço (páginas web, e-mail, ficheiros). Um <b>cliente</b> é quem pede esse serviço. O mesmo computador pode ser cliente e servidor ao mesmo tempo.</p>\n<p>Numa rede <b>peer-to-peer</b> (P2P) todos partilham diretamente uns com os outros, sem servidor dedicado. É simples para casa, mas difícil de gerir e proteger numa empresa.</p>"},{"tipo":"tabela","titulo":"Tipos de rede por alcance","cabecalho":["Tipo","Alcance","Exemplo"],"linhas":[["LAN","Um edifício ou piso","A rede do escritório ou da escola"],["WLAN","Igual à LAN, sem fios","O Wi-Fi da empresa"],["MAN","Uma cidade","Fibra que liga os campus de uma universidade"],["WAN","Países e continentes","Ligação entre a sede e as filiais"],["Internet","Mundial","A rede de redes que liga milhões de WANs e LANs"]]},{"tipo":"exemplo","titulo":"No dia a dia","html":"<p>Quando abre o YouTube no telemóvel em casa: o telemóvel (host) fala por Wi-Fi (meio) com o router doméstico (intermediário), que encaminha os pedidos para o operador (WAN) e daí pela Internet até aos servidores do YouTube. Dezenas de protocolos trabalham juntos: Wi-Fi, IP, TCP/QUIC, DNS, HTTPS.</p>"},{"tipo":"texto","titulo":"Características de uma boa rede","html":"<ul>\n<li><b>Tolerância a falhas</b>: caminhos redundantes para que uma avaria não pare tudo.</li>\n<li><b>Escalabilidade</b>: crescer sem refazer a rede.</li>\n<li><b>Qualidade de serviço (QoS)</b>: dar prioridade a voz e vídeo.</li>\n<li><b>Segurança</b>: confidencialidade, integridade e disponibilidade (a tríade CIA).</li>\n</ul>"},{"tipo":"dica","html":"No exame CCNA, “host” e “dispositivo final” querem dizer a mesma coisa. Switches e routers <b>não</b> são hosts."},{"tipo":"video","titulo":"Introdução às redes de computadores","busca":"introdução redes de computadores CCNA aula 1","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual destes é um dispositivo intermediário?","opcoes":["Impressora de rede","Switch","Servidor web","Telemóvel"],"correta":1,"explica":"Switches, routers, APs e firewalls encaminham tráfego: são intermediários. Os outros são dispositivos finais."},{"tipo":"mc","p":"Uma rede que cobre apenas um edifício chama-se…","opcoes":["WAN","MAN","LAN","PAN"],"correta":2,"explica":"LAN = Local Area Network, uma rede local de alcance limitado (sala, piso, edifício)."},{"tipo":"vf","p":"Um computador pode ser cliente e servidor ao mesmo tempo.","correta":true,"explica":"Sim. Um PC pode partilhar uma pasta (servidor) enquanto navega na web (cliente)."},{"tipo":"mc","p":"O conjunto de regras que define como os dispositivos comunicam chama-se…","opcoes":["Topologia","Protocolo","Meio","Largura de banda"],"correta":1,"explica":"Protocolos definem formato, ordem e significado das mensagens."},{"tipo":"vf","p":"Fibra ótica, cobre e Wi-Fi são exemplos de meios de transmissão.","correta":true,"explica":"São os três grandes tipos de meio: elétrico (cobre), luz (fibra) e rádio (sem fios)."}],"referencias":["netacad_itn","kurose","tanenbaum","odom1"]},{"id":"m1l2","titulo":"Equipamentos de rede: conheça cada um","minutos":15,"nivel":"básico","objetivos":["Identificar router, switch, AP, WLC e firewall pelo aspeto e função","Reconhecer as portas de um switch e de um router Cisco","Saber em que camada trabalha cada equipamento"],"blocos":[{"tipo":"figura","nome":"painel_switch","legenda":"Frente de um switch de acesso de 24 portas (estilo Catalyst): portas RJ45 com LEDs, portas uplink SFP e porta de consola."},{"tipo":"texto","titulo":"Switch","html":"<p>O <b>switch</b> liga os dispositivos <b>dentro da mesma LAN</b>. Aprende o endereço <b>MAC</b> de quem está ligado em cada porta e envia cada trama apenas para a porta certa. Trabalha na <b>camada 2</b> (ligação de dados).</p>\n<p>Um <b>switch multicamada (L3)</b> também consegue encaminhar entre redes IP, como um router — muito usado no núcleo das redes empresariais.</p>"},{"tipo":"figura","nome":"painel_router","legenda":"Traseira de um router de filial (estilo ISR): portas GigabitEthernet, slots para módulos WAN, consola RJ45, consola USB e AUX."},{"tipo":"texto","titulo":"Router","html":"<p>O <b>router</b> liga <b>redes diferentes</b> entre si (por exemplo a LAN à Internet) e escolhe o melhor caminho para cada pacote com base no endereço <b>IP</b> de destino e na <b>tabela de encaminhamento</b>. Trabalha na <b>camada 3</b> (rede).</p>"},{"tipo":"tabela","titulo":"Resumo dos equipamentos","cabecalho":["Equipamento","Camada OSI","Decide com base em","Símbolo"],"linhas":[["Hub (obsoleto)","1","Nada — repete para todas as portas","—"],["Switch","2","Endereço MAC","Quadrado com setas"],["Router","3","Endereço IP","Círculo com setas"],["Switch L3","2 e 3","MAC e IP","Quadrado com setas e círculo"],["Firewall","3 a 7","Regras e estado das ligações","Muro de tijolos"],["Access Point","1 e 2","Liga clientes Wi-Fi à rede com fios","Antena/ondas"]]},{"tipo":"topologia","nos":[{"id":"r","tipo":"router","x":15,"y":50,"rotulo":"Router"},{"id":"sw","tipo":"switch","x":38,"y":50,"rotulo":"Switch"},{"id":"l3","tipo":"switch_l3","x":62,"y":50,"rotulo":"Switch L3"},{"id":"fw","tipo":"firewall","x":85,"y":50,"rotulo":"Firewall"},{"id":"ap","tipo":"ap","x":38,"y":12,"rotulo":"AP"},{"id":"wlc","tipo":"wlc","x":62,"y":12,"rotulo":"WLC"}],"ligacoes":[],"legenda":"Os ícones usados nos diagramas de rede (e nesta app)."},{"tipo":"texto","titulo":"Access Point, WLC e firewall","html":"<ul>\n<li><b>Access Point (AP)</b>: liga clientes sem fios à rede cabeada. Pode ser <i>autónomo</i> (configurado um a um) ou <i>leve</i> (lightweight), gerido por um controlador.</li>\n<li><b>WLC (Wireless LAN Controller)</b>: gere centenas de APs de forma centralizada: SSIDs, segurança, canais e potência.</li>\n<li><b>Firewall</b>: filtra o tráfego segundo regras e acompanha o estado das ligações. Os <b>NGFW</b> (next-generation) também inspecionam aplicações e bloqueiam ameaças (IPS).</li>\n</ul>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer arrasta o equipamento e liga cabos com um clique.","Os módulos (placas) adicionam-se com o equipamento desligado, no separador Physical.","As luzes das portas ficam verdes quase de imediato."],"real":["Equipamentos reais vão num bastidor (rack) de 19 polegadas, com parafusos e calhas.","Precisa de alimentação adequada, ventilação e, idealmente, UPS.","Os LEDs das portas ficam âmbar ~30 s enquanto o STP verifica a porta, antes de ficarem verdes.","Módulos SFP têm de ser compatíveis com o modelo (algumas plataformas recusam SFP de terceiros)."]},{"tipo":"dica","html":"Pelo símbolo: <b>router = círculo</b>, <b>switch = quadrado</b>. É assim em quase todos os diagramas do exame."},{"tipo":"video","titulo":"Dispositivos de rede: router, switch, AP","busca":"router vs switch vs access point explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que equipamento decide o encaminhamento com base no endereço IP?","opcoes":["Switch L2","Hub","Router","Access Point"],"correta":2,"explica":"O router trabalha na camada 3 e usa a tabela de encaminhamento com endereços IP."},{"tipo":"mc","p":"O switch aprende e usa qual endereço?","opcoes":["IP","MAC","Porta TCP","URL"],"correta":1,"explica":"O switch constrói a tabela de endereços MAC e encaminha tramas pela porta certa."},{"tipo":"mc","p":"Que equipamento gere muitos APs de forma centralizada?","opcoes":["WLC","NGFW","Hub","Modem"],"correta":0,"explica":"O Wireless LAN Controller gere APs leves (lightweight) de forma central."},{"tipo":"vf","p":"Um switch multicamada consegue encaminhar tráfego entre redes IP.","correta":true,"explica":"O switch L3 combina comutação (L2) e encaminhamento (L3)."},{"tipo":"vf","p":"Em equipamentos reais as portas de um switch Cisco ficam verdes imediatamente ao ligar um PC.","correta":false,"explica":"Com STP normal a porta passa por listening/learning (~30 s) e fica âmbar até ir para forwarding."}],"referencias":["odom1","netacad_itn","lammle"]},{"id":"m1l3","titulo":"Topologias e arquiteturas","minutos":12,"nivel":"básico","objetivos":["Desenhar topologias física e lógica","Comparar estrela, malha, barramento e anel","Conhecer as arquiteturas de 2 e 3 camadas, spine-leaf, SOHO e WAN"],"blocos":[{"tipo":"texto","titulo":"Topologia física e lógica","html":"<p>A <b>topologia física</b> mostra onde estão os equipamentos e por onde passam os cabos. A <b>topologia lógica</b> mostra como os dados circulam: redes IP, VLANs, rotas.</p>"},{"tipo":"tabela","titulo":"Topologias clássicas","cabecalho":["Topologia","Como é","Vantagem","Desvantagem"],"linhas":[["Estrela","Todos ligados a um ponto central (switch)","Simples; um cabo avariado afeta só um host","O ponto central é crítico"],["Estrela estendida","Várias estrelas ligadas entre si","Escala bem","Mais equipamentos"],["Malha completa","Todos ligados a todos","Máxima redundância","Cara: n(n-1)/2 ligações"],["Malha parcial","Só os caminhos críticos são redundantes","Equilíbrio custo/redundância","Mais complexa"],["Barramento / Anel","Cabo partilhado / círculo","Históricas","Uma falha pode parar tudo"]]},{"tipo":"exemplo","titulo":"Quantas ligações tem uma malha completa?","html":"<p>Fórmula: <code>n × (n − 1) / 2</code>. Com 5 routers: 5 × 4 / 2 = <b>10 ligações</b>. Com 10 routers: <b>45</b>. Por isso a malha completa só se usa onde a redundância vale o custo (núcleo, WAN crítica).</p>"},{"tipo":"topologia","nos":[{"id":"c1","tipo":"switch_l3","x":35,"y":10,"rotulo":"Núcleo 1"},{"id":"c2","tipo":"switch_l3","x":65,"y":10,"rotulo":"Núcleo 2"},{"id":"d1","tipo":"switch_l3","x":20,"y":45,"rotulo":"Distrib. 1"},{"id":"d2","tipo":"switch_l3","x":80,"y":45,"rotulo":"Distrib. 2"},{"id":"a1","tipo":"switch","x":8,"y":85,"rotulo":"Acesso"},{"id":"a2","tipo":"switch","x":36,"y":85,"rotulo":"Acesso"},{"id":"a3","tipo":"switch","x":64,"y":85,"rotulo":"Acesso"},{"id":"a4","tipo":"switch","x":92,"y":85,"rotulo":"Acesso"}],"ligacoes":[{"a":"c1","b":"c2","rotulo":""},{"a":"c1","b":"d1","rotulo":""},{"a":"c1","b":"d2","rotulo":""},{"a":"c2","b":"d1","rotulo":""},{"a":"c2","b":"d2","rotulo":""},{"a":"d1","b":"a1","rotulo":""},{"a":"d1","b":"a2","rotulo":""},{"a":"d2","b":"a3","rotulo":""},{"a":"d2","b":"a4","rotulo":""},{"a":"d1","b":"d2","rotulo":""}],"legenda":"Arquitetura hierárquica de 3 camadas: núcleo (core), distribuição e acesso."},{"tipo":"texto","titulo":"Arquiteturas do exame CCNA","html":"<ul>\n<li><b>3 camadas</b>: <i>acesso</i> (onde ligam os utilizadores), <i>distribuição</i> (políticas, encaminhamento entre VLANs) e <i>núcleo</i> (transporte rápido). Para campus grandes.</li>\n<li><b>2 camadas / núcleo colapsado</b>: distribuição e núcleo no mesmo par de switches. Para campus médios.</li>\n<li><b>Spine-leaf</b>: centros de dados. Cada <i>leaf</i> liga-se a <b>todos</b> os <i>spines</i>; leaf nunca liga a leaf, spine nunca liga a spine. Latência previsível: sempre 2 saltos.</li>\n<li><b>SOHO</b> (Small Office/Home Office): um único equipamento faz de router, switch, AP e firewall.</li>\n<li><b>WAN</b>: ligações entre locais — MPLS, Internet com VPN, SD-WAN, fibra dedicada.</li>\n<li><b>On-premises vs cloud</b>: servidores na própria empresa ou em fornecedores (IaaS, PaaS, SaaS).</li>\n</ul>"},{"tipo":"topologia","nos":[{"id":"s1","tipo":"switch_l3","x":30,"y":12,"rotulo":"Spine 1"},{"id":"s2","tipo":"switch_l3","x":70,"y":12,"rotulo":"Spine 2"},{"id":"l1","tipo":"switch","x":12,"y":75,"rotulo":"Leaf 1"},{"id":"l2","tipo":"switch","x":37,"y":75,"rotulo":"Leaf 2"},{"id":"l3","tipo":"switch","x":63,"y":75,"rotulo":"Leaf 3"},{"id":"l4","tipo":"switch","x":88,"y":75,"rotulo":"Leaf 4"}],"ligacoes":[{"a":"s1","b":"l1","rotulo":""},{"a":"s1","b":"l2","rotulo":""},{"a":"s1","b":"l3","rotulo":""},{"a":"s1","b":"l4","rotulo":""},{"a":"s2","b":"l1","rotulo":""},{"a":"s2","b":"l2","rotulo":""},{"a":"s2","b":"l3","rotulo":""},{"a":"s2","b":"l4","rotulo":""}],"legenda":"Spine-leaf: todos os leaf ligados a todos os spine."},{"tipo":"dica","html":"Pergunta frequente: “numa arquitetura spine-leaf, um leaf liga-se a outro leaf?” — <b>Não</b>."},{"tipo":"video","titulo":"Arquitetura de 3 camadas e spine-leaf","busca":"CCNA network topology architectures spine leaf three tier","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantas ligações tem uma malha completa com 6 routers?","opcoes":["12","15","30","36"],"correta":1,"explica":"6 × 5 / 2 = 15."},{"tipo":"mc","p":"Em spine-leaf, cada leaf liga-se a…","opcoes":["Outro leaf","Todos os spines","Apenas um spine","Ao router de Internet"],"correta":1,"explica":"Cada leaf liga-se a todos os spines; nunca leaf-leaf nem spine-spine."},{"tipo":"mc","p":"Que camada da arquitetura hierárquica liga os utilizadores finais?","opcoes":["Núcleo","Distribuição","Acesso","Spine"],"correta":2,"explica":"A camada de acesso é onde se ligam PCs, telefones IP e APs."},{"tipo":"vf","p":"No núcleo colapsado, distribuição e núcleo estão nos mesmos equipamentos.","correta":true,"explica":"É a arquitetura de 2 camadas, típica de campus médios."},{"tipo":"mc","p":"Na topologia em estrela, se o cabo de um PC avariar…","opcoes":["Toda a rede para","Só esse PC fica sem rede","O switch reinicia","Formam-se loops"],"correta":1,"explica":"Cada host tem o seu próprio cabo até ao ponto central."}],"referencias":["odom1","netacad_itn","cisco_exam"]},{"id":"m1l4","titulo":"Cabos, conectores e meios","minutos":15,"nivel":"básico","objetivos":["Escolher entre UTP, fibra monomodo e multimodo","Saber quando usar cabo direto ou cruzado e o papel do Auto-MDIX","Ligar-se a um equipamento Cisco pela consola"],"blocos":[{"tipo":"figura","nome":"cabo_utp","legenda":"Cabo UTP com conector RJ45: 4 pares de fios entrançados."},{"tipo":"texto","titulo":"Cobre: UTP","html":"<p>O cabo <b>UTP</b> (par entrançado não blindado) tem 4 pares de fios. O entrançado reduz interferências (crosstalk). Distância máxima típica: <b>100 m</b>.</p>"},{"tipo":"tabela","titulo":"Categorias de cabo UTP","cabecalho":["Categoria","Velocidade típica","Norma Ethernet"],"linhas":[["Cat 5e","1 Gbit/s","1000BASE-T"],["Cat 6","1 Gbit/s (10 Gbit/s até ~55 m)","1000BASE-T / 10GBASE-T"],["Cat 6a","10 Gbit/s até 100 m","10GBASE-T"],["Cat 8","25/40 Gbit/s até 30 m","25G/40GBASE-T (centros de dados)"]]},{"tipo":"figura","nome":"rj45_pinos","legenda":"Esquemas de cravação T568A e T568B."},{"tipo":"texto","titulo":"Direto, cruzado e Auto-MDIX","html":"<p>Em 10/100 Mbit/s o PC transmite nos pinos 1-2 e o switch recebe nesses pinos. Por isso:</p>\n<ul>\n<li><b>Cabo direto</b> (B-B): equipamentos <i>diferentes</i> — PC↔switch, router↔switch.</li>\n<li><b>Cabo cruzado</b> (A-B): equipamentos <i>iguais</i> — switch↔switch, PC↔PC, router↔PC.</li>\n</ul>\n<p>Hoje quase todas as portas têm <b>Auto-MDIX</b>, que deteta e corrige automaticamente. Ainda assim, o exame pergunta a regra.</p>"},{"tipo":"figura","nome":"cabo_fibra","legenda":"Fibra ótica com conectores LC duplex e um módulo SFP."},{"tipo":"tabela","titulo":"Fibra ótica","cabecalho":["","Multimodo (MMF)","Monomodo (SMF)"],"linhas":[["Núcleo","50 ou 62,5 µm","~9 µm"],["Fonte de luz","LED / VCSEL","Laser"],["Distância","Centenas de metros","Dezenas de km"],["Custo","Mais barato","Mais caro"],["Uso típico","Dentro do edifício","Entre edifícios, WAN, operadores"]]},{"tipo":"figura","nome":"cabo_consola","legenda":"Cabo de consola (rollover) RJ45 ↔ DB9 e a alternativa USB."},{"tipo":"cli","titulo":"Aceder pela consola (primeira configuração)","passos":[{"prompt":"PC","cmd":"Ligar o cabo de consola à porta CONSOLE","explica":"Use rollover RJ45-DB9 + adaptador USB-série, ou cabo USB mini-B/USB-C."},{"prompt":"PC","cmd":"Abrir PuTTY/Tera Term na porta COMx (ou /dev/ttyUSB0)","explica":"Velocidade 9600, 8 bits de dados, sem paridade, 1 stop bit, sem controlo de fluxo (9600 8N1)."},{"prompt":"Switch>","cmd":"enable","explica":"Entra no modo privilegiado."}],"nota":"No Packet Tracer basta escolher o cabo azul claro <i>Console</i> e abrir Desktop › Terminal."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Cabo errado (direto vs cruzado) muitas vezes funciona na mesma ou a ligação fica vermelha — corrige com um clique.","A consola abre com um clique no separador CLI.","Não existem problemas de cabo mal cravado ou interferências."],"real":["Precisa de adaptador USB-série e do driver correto (veja o Gestor de Dispositivos para saber o número COM).","Velocidade errada mostra caracteres estranhos no terminal: confirme 9600 8N1.","Cabos mal cravados causam erros CRC e ligações instáveis: teste com um testador de cabos.","Fibra: nunca olhe diretamente para o conector (laser invisível) e mantenha as pontas limpas."]},{"tipo":"alerta","html":"A velocidade e o duplex têm de coincidir nas duas pontas. <i>Duplex mismatch</i> (um lado full, outro half) causa colisões tardias e lentidão — prefira <code>auto</code> nos dois lados."},{"tipo":"video","titulo":"Cabos de rede e fibra ótica","busca":"cabo UTP direto cruzado fibra monomodo multimodo explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a distância máxima típica de um cabo UTP Ethernet?","opcoes":["10 m","55 m","100 m","2 km"],"correta":2,"explica":"As normas 10/100/1000BASE-T definem 100 m por segmento."},{"tipo":"mc","p":"Para ligar dois switches antigos sem Auto-MDIX deve usar…","opcoes":["Cabo direto","Cabo cruzado","Cabo de consola","Cabo serial"],"correta":1,"explica":"Equipamentos iguais usam cabo cruzado."},{"tipo":"mc","p":"Que fibra é usada para ligar edifícios a vários km de distância?","opcoes":["Multimodo","Monomodo","UTP Cat 6","Coaxial"],"correta":1,"explica":"A fibra monomodo usa laser e núcleo fino, alcançando dezenas de km."},{"tipo":"mc","p":"Configuração padrão da porta de consola Cisco:","opcoes":["115200 8N1","9600 8N1","9600 7E1","57600 8N2"],"correta":1,"explica":"9600 bit/s, 8 bits de dados, sem paridade, 1 stop bit."},{"tipo":"vf","p":"Auto-MDIX permite usar cabo direto entre dois switches.","correta":true,"explica":"A porta deteta e troca os pares de transmissão/receção automaticamente."}],"referencias":["tia568","ieee8023","odom1","netacad_itn"]}],"prova_extra":[{"tipo":"mc","p":"Um portátil está a 140 m do switch mais próximo, num armazém. Qual a melhor solução cabeada?","opcoes":["UTP Cat 6 direto","Fibra multimodo ou um switch intermédio","Cabo de consola","UTP Cat 5e cruzado"],"correta":1,"explica":"UTP só garante 100 m. Use fibra ou coloque um switch a meio caminho."},{"tipo":"vf","p":"Uma firewall de próxima geração (NGFW) pode identificar aplicações e funcionar como IPS.","correta":true,"explica":"É o que distingue uma NGFW de uma firewall tradicional de portas/endereços."},{"tipo":"mc","p":"Qual destes é um exemplo de SaaS?","opcoes":["Uma VM numa cloud pública","Office 365 / Gmail","Uma plataforma para fazer deploy de código","Um switch físico"],"correta":1,"explica":"SaaS é software pronto a usar; IaaS dá VMs; PaaS dá plataforma de desenvolvimento."}]},{"id":"m2","numero":2,"titulo":"Modelos OSI e TCP/IP","descricao":"Como a comunicação se organiza em camadas: encapsulamento, TCP e UDP, Ethernet, MAC e ARP.","dominio":"1.0 Network Fundamentals","icone":"osi","licoes":[{"id":"m2l1","titulo":"O modelo OSI em 7 camadas","minutos":15,"nivel":"básico","objetivos":["Nomear as 7 camadas e a função de cada uma","Associar protocolos, equipamentos e PDUs às camadas","Usar o modelo OSI para resolver problemas"],"blocos":[{"tipo":"texto","titulo":"Porque usamos camadas","html":"<p>O modelo <b>OSI</b> (ISO/IEC 7498-1) divide a comunicação em 7 camadas. Cada camada resolve um problema e presta serviço à camada de cima. Vantagens: fabricantes diferentes interoperam, ensina-se por partes e a resolução de problemas fica metódica.</p>\n<p>Mnemónica (de cima para baixo): <b>A</b>prenda <b>A</b> <b>S</b>empre <b>T</b>udo <b>R</b>edes <b>E</b> <b>F</b>ísica — Aplicação, Apresentação, Sessão, Transporte, Rede, Enlace (ligação de dados), Física.</p>"},{"tipo":"figura","nome":"osi","legenda":"As 7 camadas do modelo OSI e o modelo TCP/IP lado a lado."},{"tipo":"tabela","titulo":"","cabecalho":["#","Camada","Função","PDU","Exemplos"],"linhas":[["7","Aplicação","Interface com as aplicações de rede","Dados","HTTP, DNS, SMTP, SSH"],["6","Apresentação","Formato, codificação, cifra","Dados","TLS, JPEG, ASCII"],["5","Sessão","Abrir, manter e fechar sessões","Dados","RPC, NetBIOS"],["4","Transporte","Entrega fim a fim, portas, fiabilidade","Segmento / Datagrama","TCP, UDP"],["3","Rede","Endereçamento lógico e encaminhamento","Pacote","IPv4, IPv6, ICMP, OSPF"],["2","Ligação de dados","Entrega no mesmo meio, MAC, deteção de erros","Trama (frame)","Ethernet, 802.11, PPP"],["1","Física","Bits em sinais elétricos, luz ou rádio","Bits","Cabos, conectores, hubs"]]},{"tipo":"exemplo","titulo":"Resolução de problemas de baixo para cima","html":"<p>Um utilizador diz “não tenho Internet”. Pelo modelo OSI:</p>\n<ol>\n<li><b>Física</b>: o cabo está ligado? A luz da porta acende?</li>\n<li><b>Ligação</b>: a porta do switch está na VLAN certa? Está em err-disabled?</li>\n<li><b>Rede</b>: o PC tem IP, máscara e gateway corretos? <code>ping</code> ao gateway responde?</li>\n<li><b>Transporte/Aplicação</b>: o DNS resolve nomes? Uma firewall está a bloquear a porta 443?</li>\n</ol>"},{"tipo":"dica","html":"No dia a dia de redes diz-se “problema de camada 1” (cabo), “camada 2” (VLAN/MAC), “camada 3” (IP/rotas). Fale assim também."},{"tipo":"video","titulo":"Modelo OSI explicado","busca":"modelo OSI 7 camadas explicado CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Em que camada OSI trabalha o router?","opcoes":["2","3","4","7"],"correta":1,"explica":"Camada 3, rede: endereços IP e encaminhamento."},{"tipo":"mc","p":"A PDU da camada de ligação de dados chama-se…","opcoes":["Segmento","Pacote","Trama","Bit"],"correta":2,"explica":"Camada 2 = trama (frame)."},{"tipo":"mc","p":"TCP e UDP pertencem à camada…","opcoes":["Rede","Transporte","Sessão","Aplicação"],"correta":1,"explica":"Camada 4, transporte."},{"tipo":"vf","p":"A cifra de dados (por ex. TLS) é associada à camada de Apresentação no modelo OSI.","correta":true,"explica":"Formatos, compressão e cifra são funções da camada 6."},{"tipo":"mc","p":"Um cabo partido é um problema de que camada?","opcoes":["1","2","3","7"],"correta":0,"explica":"Camada física."}],"referencias":["iso7498","odom1","kurose","netacad_itn"]},{"id":"m2l2","titulo":"TCP/IP e encapsulamento","minutos":12,"nivel":"básico","objetivos":["Comparar o modelo TCP/IP com o OSI","Descrever encapsulamento e desencapsulamento","Perceber o que muda (e o que não muda) em cada salto"],"blocos":[{"tipo":"texto","titulo":"O modelo que a Internet usa","html":"<p>O modelo <b>TCP/IP</b> é o que realmente está implementado. Na versão de 4 camadas: <b>Aplicação</b> (OSI 5-7), <b>Transporte</b> (4), <b>Internet</b> (3) e <b>Acesso à rede</b> (1-2). Muitos livros, incluindo o guia oficial CCNA, usam a versão de <b>5 camadas</b>, que separa ligação de dados e física.</p>"},{"tipo":"figura","nome":"encapsulamento","legenda":"Encapsulamento: cada camada acrescenta o seu cabeçalho aos dados da camada de cima."},{"tipo":"texto","titulo":"Encapsulamento passo a passo","html":"<ol>\n<li>A aplicação gera os <b>dados</b> (ex.: pedido HTTP).</li>\n<li>O transporte junta o cabeçalho TCP com as <b>portas</b> → <b>segmento</b>.</li>\n<li>A camada de rede junta o cabeçalho IP com os <b>endereços IP</b> → <b>pacote</b>.</li>\n<li>A ligação de dados junta cabeçalho e trailer Ethernet com os <b>MAC</b> e o <b>FCS</b> → <b>trama</b>.</li>\n<li>A física converte em <b>bits</b> no fio.</li>\n</ol>\n<p>No destino faz-se o caminho inverso: <b>desencapsulamento</b>.</p>"},{"tipo":"topologia","nos":[{"id":"a","tipo":"pc","x":8,"y":50,"rotulo":"PC A"},{"id":"r1","tipo":"router","x":36,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":64,"y":50,"rotulo":"R2"},{"id":"b","tipo":"servidor","x":92,"y":50,"rotulo":"Servidor B"}],"ligacoes":[{"a":"a","b":"r1","rotulo":"MAC A→R1"},{"a":"r1","b":"r2","rotulo":"MAC R1→R2"},{"a":"r2","b":"b","rotulo":"MAC R2→B"}],"legenda":"Em cada salto a trama é refeita com novos MAC; o IP de origem e destino mantém-se (sem NAT)."},{"tipo":"exemplo","titulo":"O que muda em cada salto?","html":"<p>Quando o PC A envia um pacote ao servidor B através de R1 e R2:</p>\n<ul>\n<li><b>IP origem/destino</b>: <b>não mudam</b> (A → B) em todo o caminho, salvo NAT.</li>\n<li><b>MAC origem/destino</b>: <b>mudam a cada salto</b> — cada router remove a trama antiga e cria uma nova para a ligação seguinte.</li>\n<li><b>TTL</b> do IP: cada router diminui 1.</li>\n</ul>"},{"tipo":"dica","html":"Pergunta clássica do exame: “quando o pacote sai de R1 para R2, qual é o MAC de destino?” — o MAC da interface de <b>R2</b>, não o do servidor."},{"tipo":"video","titulo":"Encapsulamento TCP/IP","busca":"encapsulamento TCP/IP explicado camadas","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantas camadas tem o modelo TCP/IP original?","opcoes":["4","5","6","7"],"correta":0,"explica":"Aplicação, Transporte, Internet e Acesso à rede."},{"tipo":"vf","p":"O endereço IP de destino muda em cada router do caminho (sem NAT).","correta":false,"explica":"Os IP mantêm-se; os MAC é que mudam a cada salto."},{"tipo":"mc","p":"Que informação é acrescentada na camada de transporte?","opcoes":["Endereços MAC","Portas","Endereços IP","FCS"],"correta":1,"explica":"TCP/UDP acrescentam portas de origem e destino."},{"tipo":"mc","p":"O processo de retirar cabeçalhos no destino chama-se…","opcoes":["Encapsulamento","Desencapsulamento","Fragmentação","Multiplexagem"],"correta":1,"explica":"Desencapsulamento."},{"tipo":"vf","p":"Cada router diminui o TTL do pacote IP em 1.","correta":true,"explica":"Quando o TTL chega a 0 o pacote é descartado (evita loops infinitos)."}],"referencias":["kurose","odom1","rfc791","netacad_itn"]},{"id":"m2l3","titulo":"TCP, UDP e portas","minutos":15,"nivel":"básico","objetivos":["Comparar TCP e UDP","Explicar o three-way handshake e o controlo de fluxo por janela","Memorizar as portas mais conhecidas"],"blocos":[{"tipo":"tabela","titulo":"TCP × UDP","cabecalho":["","TCP","UDP"],"linhas":[["Ligação","Orientado à ligação (handshake)","Sem ligação"],["Fiabilidade","Confirmações (ACK) e retransmissão","Nenhuma — “envia e esquece”"],["Ordem","Reordena por números de sequência","Não garante ordem"],["Controlo de fluxo","Janela deslizante (window)","Não"],["Cabeçalho","20 bytes (mínimo)","8 bytes"],["Usos","Web, e-mail, SSH, transferências","Voz, vídeo em tempo real, DNS, DHCP, SNMP"]]},{"tipo":"figura","nome":"handshake","legenda":"Three-way handshake do TCP: SYN, SYN-ACK, ACK. O fecho usa FIN/ACK."},{"tipo":"texto","titulo":"Handshake e janela","html":"<p>Antes de enviar dados, o TCP faz o <b>three-way handshake</b>: o cliente envia <b>SYN</b>, o servidor responde <b>SYN-ACK</b>, o cliente confirma com <b>ACK</b>. Cada byte é numerado (<i>sequence number</i>) e o recetor confirma o que recebeu.</p>\n<p>A <b>janela</b> (<i>window size</i>) diz quantos bytes podem ser enviados sem esperar confirmação. Se há perdas, a janela diminui; se corre bem, aumenta. Isto é o <b>controlo de fluxo</b>.</p>"},{"tipo":"tabela","titulo":"Portas que tem de saber","cabecalho":["Porta","Protocolo","Transporte"],"linhas":[["20/21","FTP (dados/controlo)","TCP"],["22","SSH / SCP / SFTP","TCP"],["23","Telnet (inseguro)","TCP"],["25","SMTP","TCP"],["53","DNS","UDP e TCP"],["67/68","DHCP servidor/cliente","UDP"],["69","TFTP","UDP"],["80","HTTP","TCP"],["110","POP3","TCP"],["123","NTP","UDP"],["143","IMAP","TCP"],["161/162","SNMP / traps","UDP"],["443","HTTPS","TCP (e UDP no HTTP/3)"],["514","Syslog","UDP"],["1812/1813","RADIUS","UDP"],["49","TACACS+","TCP"]]},{"tipo":"exemplo","titulo":"Socket","html":"<p>Uma ligação é identificada por <b>IP de origem + porta de origem + IP de destino + porta de destino + protocolo</b>. Por exemplo, o seu browser em 192.168.1.20:51344 liga a 142.250.0.10:443 (TCP). A porta de origem é <i>efémera</i> (aleatória, normalmente acima de 49152).</p>"},{"tipo":"dica","html":"Truque: tudo o que é “tempo real” (voz, vídeo, jogos) ou “pergunta curta” (DNS, DHCP) prefere UDP."},{"tipo":"video","titulo":"TCP vs UDP e three-way handshake","busca":"TCP vs UDP three way handshake explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a sequência correta do handshake TCP?","opcoes":["SYN, ACK, SYN-ACK","SYN, SYN-ACK, ACK","ACK, SYN, FIN","SYN, FIN, ACK"],"correta":1,"explica":"SYN → SYN-ACK → ACK."},{"tipo":"mc","p":"Que protocolo de transporte usa normalmente a voz sobre IP?","opcoes":["TCP","UDP","ICMP","ARP"],"correta":1,"explica":"Voz tolera perdas mas não atrasos de retransmissão: UDP."},{"tipo":"mc","p":"Qual é a porta do SSH?","opcoes":["21","22","23","443"],"correta":1,"explica":"SSH = TCP 22. Telnet = 23."},{"tipo":"mc","p":"DHCP usa…","opcoes":["TCP 67/68","UDP 67/68","UDP 53","TCP 80"],"correta":1,"explica":"Servidor UDP 67, cliente UDP 68."},{"tipo":"vf","p":"O TCP usa a janela deslizante para controlo de fluxo.","correta":true,"explica":"O window size limita o envio sem confirmação."}],"referencias":["rfc9293","rfc768","kurose","odom1"]},{"id":"m2l4","titulo":"Ethernet, endereços MAC e ARP","minutos":15,"nivel":"básico","objetivos":["Ler a estrutura de uma trama Ethernet","Interpretar um endereço MAC (OUI)","Explicar como o ARP descobre o MAC a partir do IP"],"blocos":[{"tipo":"figura","nome":"trama_ethernet","legenda":"Trama Ethernet II: preâmbulo, MAC destino, MAC origem, tipo, dados (46–1500 bytes) e FCS."},{"tipo":"texto","titulo":"Endereço MAC","html":"<p>O <b>MAC</b> tem 48 bits (6 bytes), escrito em hexadecimal: <code>00:1A:2B:3C:4D:5E</code> ou, no formato Cisco, <code>001a.2b3c.4d5e</code>. Os primeiros 3 bytes são o <b>OUI</b>, que identifica o fabricante.</p>\n<ul>\n<li><b>Unicast</b>: um destino.</li>\n<li><b>Broadcast</b>: <code>FFFF.FFFF.FFFF</code> — todos na LAN.</li>\n<li><b>Multicast</b>: um grupo (ex.: <code>0100.5Exx.xxxx</code> para IPv4 multicast).</li>\n</ul>\n<p>O campo <b>FCS</b> (CRC) permite ao recetor detetar tramas corrompidas, que são descartadas.</p>"},{"tipo":"texto","titulo":"ARP: de IP para MAC","html":"<p>Para enviar um pacote na LAN o PC precisa do MAC do destino (ou do gateway, se o destino estiver noutra rede). O <b>ARP</b> resolve isso:</p>\n<ol>\n<li>O PC envia um <b>ARP Request</b> em broadcast: “Quem tem 192.168.1.1? Diga a 192.168.1.20”.</li>\n<li>Só o dono desse IP responde com um <b>ARP Reply</b> em unicast com o seu MAC.</li>\n<li>O PC guarda a resposta na <b>cache ARP</b> durante alguns minutos.</li>\n</ol>"},{"tipo":"topologia","nos":[{"id":"pc","tipo":"pc","x":12,"y":55,"rotulo":"PC 192.168.1.20"},{"id":"sw","tipo":"switch","x":50,"y":55,"rotulo":"SW1"},{"id":"gw","tipo":"router","x":88,"y":55,"rotulo":"GW 192.168.1.1"},{"id":"pc2","tipo":"pc","x":50,"y":12,"rotulo":"PC 192.168.1.30"}],"ligacoes":[{"a":"pc","b":"sw","rotulo":"ARP Request (broadcast)"},{"a":"sw","b":"gw","rotulo":""},{"a":"sw","b":"pc2","rotulo":""}],"legenda":"O pedido ARP chega a todos; só o gateway responde."},{"tipo":"saida","titulo":"Cache ARP num PC Windows (arp -a)","texto":"Interface: 192.168.1.20 --- 0xb\n  Endereço Internet     Endereço físico       Tipo\n  192.168.1.1           00-1a-2b-3c-4d-5e     dinâmico\n  192.168.1.255         ff-ff-ff-ff-ff-ff     estático","explica":"No router Cisco o equivalente é <code>show ip arp</code>."},{"tipo":"cli","titulo":"Ver ARP e MAC num equipamento Cisco","passos":[{"prompt":"R1#","cmd":"show ip arp","explica":"Tabela ARP do router."},{"prompt":"SW1#","cmd":"show mac address-table","explica":"Tabela de endereços MAC aprendidos pelo switch."},{"prompt":"SW1#","cmd":"show mac address-table dynamic interface g0/1","explica":"Filtra por porta."}],"nota":""},{"tipo":"dica","html":"Em IPv6 não há ARP: o mesmo papel é feito pelo <b>NDP</b> (Neighbor Solicitation / Neighbor Advertisement, em ICMPv6)."},{"tipo":"video","titulo":"ARP e endereços MAC","busca":"ARP protocolo explicado endereço MAC CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantos bits tem um endereço MAC?","opcoes":["32","48","64","128"],"correta":1,"explica":"48 bits = 6 bytes."},{"tipo":"mc","p":"O MAC de broadcast é…","opcoes":["0000.0000.0000","FFFF.FFFF.FFFF","0100.5E00.0001","FF00.0000.0000"],"correta":1,"explica":"Todos os bits a 1."},{"tipo":"mc","p":"O ARP Request é enviado em…","opcoes":["Unicast","Broadcast","Multicast","Anycast"],"correta":1,"explica":"Não se sabe o MAC do destino, logo vai para todos."},{"tipo":"cmd","p":"Que comando mostra a tabela de endereços MAC num switch Cisco?","respostas":["show mac address-table","sh mac address-table","show mac-address-table"],"explica":"show mac address-table (em IOS antigos: show mac-address-table)."},{"tipo":"vf","p":"Os primeiros 24 bits do MAC identificam o fabricante (OUI).","correta":true,"explica":"OUI = Organizationally Unique Identifier."}],"referencias":["ieee8023","rfc826","odom1","netacad_itn"]}],"prova_extra":[{"tipo":"mc","p":"Um PC envia um pacote para um servidor noutra rede. Qual o MAC de destino na trama que sai do PC?","opcoes":["MAC do servidor","MAC do gateway (router)","FFFF.FFFF.FFFF","MAC do switch"],"correta":1,"explica":"Fora da rede local, a trama vai para o gateway; o IP de destino continua a ser o do servidor."},{"tipo":"mc","p":"Qual o tamanho mínimo do cabeçalho TCP?","opcoes":["8 bytes","20 bytes","40 bytes","64 bytes"],"correta":1,"explica":"TCP 20 bytes; UDP 8 bytes."},{"tipo":"vf","p":"O FCS de uma trama Ethernet serve para corrigir os erros detetados.","correta":false,"explica":"Só deteta; tramas com erro são descartadas e cabe às camadas superiores (TCP) retransmitir."}]},{"id":"m3","numero":3,"titulo":"Endereçamento IPv4 e IPv6","descricao":"Binário, máscaras, sub-redes, VLSM e IPv6. A base de tudo o que vem a seguir.","dominio":"1.0 Network Fundamentals","icone":"calculadora","licoes":[{"id":"m3l1","titulo":"IPv4, binário e máscaras","minutos":18,"nivel":"básico","objetivos":["Converter entre decimal e binário","Separar a parte de rede e a parte de host com a máscara","Reconhecer endereços privados, loopback e APIPA"],"blocos":[{"tipo":"texto","titulo":"Um endereço IPv4","html":"<p>Um endereço IPv4 tem <b>32 bits</b>, escritos como 4 octetos em decimal: <code>192.168.10.25</code>. A <b>máscara</b> indica quantos bits pertencem à <b>rede</b>; os restantes identificam o <b>host</b>. <code>255.255.255.0</code> = <code>/24</code> (24 bits de rede, 8 de host).</p>"},{"tipo":"tabela","titulo":"Os pesos de cada bit num octeto","cabecalho":["Bit","128","64","32","16","8","4","2","1"],"linhas":[["192 =","1","1","0","0","0","0","0","0"],["168 =","1","0","1","0","1","0","0","0"],["10 =","0","0","0","0","1","0","1","0"],["255 =","1","1","1","1","1","1","1","1"]]},{"tipo":"exemplo","titulo":"Decimal → binário: 200","html":"<p>200 ≥ 128? sim → 1, resta 72. 72 ≥ 64? sim → 1, resta 8. 32? não → 0. 16? não → 0. 8? sim → 1, resta 0. O resto é 0.</p>\n<p>Resultado: <code>11001000</code>.</p>"},{"tipo":"tabela","titulo":"Máscaras comuns","cabecalho":["Máscara","Prefixo","Valores possíveis num octeto"],"linhas":[["255.0.0.0","/8","Os valores válidos de um octeto de máscara:"],["255.255.0.0","/16","0, 128, 192, 224, 240, 248, 252, 254, 255"],["255.255.255.0","/24",""],["255.255.255.252","/30","Ligações ponto a ponto (2 hosts)"]]},{"tipo":"tabela","titulo":"Endereços especiais","cabecalho":["Intervalo","Uso"],"linhas":[["10.0.0.0/8","Privado (RFC 1918)"],["172.16.0.0/12 (172.16 a 172.31)","Privado (RFC 1918)"],["192.168.0.0/16","Privado (RFC 1918)"],["127.0.0.0/8","Loopback (127.0.0.1 = a própria máquina)"],["169.254.0.0/16","APIPA — o PC não recebeu IP do DHCP"],["224.0.0.0/4","Multicast (antiga classe D)"]]},{"tipo":"tabela","titulo":"Classes (histórico, ainda aparece no exame)","cabecalho":["Classe","1.º octeto","Máscara por defeito"],"linhas":[["A","1–126","/8"],["B","128–191","/16"],["C","192–223","/24"],["D","224–239","Multicast"],["E","240–255","Experimental"]]},{"tipo":"dica","html":"Se um PC mostra <code>169.254.x.x</code>, o problema é <b>DHCP</b>: o cliente não obteve resposta de nenhum servidor."},{"tipo":"video","titulo":"Binário e endereçamento IPv4","busca":"endereçamento IPv4 binário máscara de rede aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quanto é 11000000 em decimal?","opcoes":["128","192","224","240"],"correta":1,"explica":"128 + 64 = 192."},{"tipo":"mc","p":"Qual destes é um endereço privado?","opcoes":["172.32.1.1","11.0.0.1","172.20.5.9","192.169.1.1"],"correta":2,"explica":"172.16.0.0 a 172.31.255.255 é privado; 172.32 já não."},{"tipo":"mc","p":"/26 corresponde a que máscara?","opcoes":["255.255.255.128","255.255.255.192","255.255.255.224","255.255.255.240"],"correta":1,"explica":"26 = 24 + 2 bits → 128+64 = 192."},{"tipo":"vf","p":"Um PC com IP 169.254.20.7 provavelmente não recebeu endereço do servidor DHCP.","correta":true,"explica":"É um endereço APIPA (link-local)."},{"tipo":"mc","p":"Quantos bits tem um endereço IPv4?","opcoes":["16","32","48","128"],"correta":1,"explica":"4 octetos × 8 bits."}],"referencias":["rfc791","rfc1918","odom1","netacad_itn"]},{"id":"m3l2","titulo":"Sub-redes (subnetting) sem medo","minutos":25,"nivel":"intermédio","objetivos":["Calcular endereço de rede, broadcast e intervalo de hosts","Determinar quantas sub-redes e hosts um prefixo dá","Usar o método do “número mágico”"],"blocos":[{"tipo":"texto","titulo":"As duas fórmulas","html":"<ul>\n<li><b>Hosts por sub-rede</b> = 2<sup>h</sup> − 2 (h = bits de host). Tiram-se 2: o endereço de <b>rede</b> e o de <b>broadcast</b>.</li>\n<li><b>Número de sub-redes</b> = 2<sup>s</sup> (s = bits emprestados ao host).</li>\n</ul>"},{"tipo":"tabela","titulo":"A tabela que vale ouro — decore-a","cabecalho":["Prefixo","Máscara","Bloco (nº mágico)","Hosts úteis"],"linhas":[["/24","255.255.255.0","256","254"],["/25","255.255.255.128","128","126"],["/26","255.255.255.192","64","62"],["/27","255.255.255.224","32","30"],["/28","255.255.255.240","16","14"],["/29","255.255.255.248","8","6"],["/30","255.255.255.252","4","2"],["/31","255.255.255.254","2","2 (ponto a ponto, RFC 3021)"],["/32","255.255.255.255","1","1 (rota de host / loopback)"]]},{"tipo":"exemplo","titulo":"Método do número mágico: 192.168.10.77/27","html":"<ol>\n<li>Octeto “interessante”: o 4.º (onde a máscara não é 255 nem 0). Máscara = 224.</li>\n<li>Número mágico = 256 − 224 = <b>32</b>. As redes andam de 32 em 32: 0, 32, 64, 96…</li>\n<li>77 está entre 64 e 96 → <b>Rede: 192.168.10.64</b>.</li>\n<li><b>Broadcast</b> = próxima rede − 1 = <b>192.168.10.95</b>.</li>\n<li><b>Hosts</b>: 192.168.10.65 a 192.168.10.94 (30 hosts).</li>\n</ol>"},{"tipo":"exemplo","titulo":"Dividir 192.168.1.0/24 em 4 sub-redes iguais","html":"<p>4 sub-redes → 2 bits emprestados (2² = 4) → /26, bloco 64:</p>\n<ul>\n<li>192.168.1.0/26 (hosts .1–.62, bc .63)</li>\n<li>192.168.1.64/26 (hosts .65–.126, bc .127)</li>\n<li>192.168.1.128/26 (hosts .129–.190, bc .191)</li>\n<li>192.168.1.192/26 (hosts .193–.254, bc .255)</li>\n</ul>"},{"tipo":"exemplo","titulo":"Quando o octeto interessante é o 3.º: 172.16.45.10/20","html":"<p>/20 → máscara 255.255.<b>240</b>.0. Mágico = 16 no 3.º octeto: 0, 16, 32, <b>48</b>… 45 está em 32–47.</p>\n<p>Rede <b>172.16.32.0</b>, broadcast <b>172.16.47.255</b>, hosts 172.16.32.1 a 172.16.47.254 (2<sup>12</sup> − 2 = 4094).</p>"},{"tipo":"dica","html":"Pratique todos os dias 10 minutos no <b>Desafio Sub-rede</b> (separador Jogar). No exame não há calculadora e a rapidez faz diferença."},{"tipo":"video","titulo":"Subnetting rápido","busca":"subnetting fácil método número mágico CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual o endereço de rede de 10.1.1.130/25?","opcoes":["10.1.1.0","10.1.1.128","10.1.1.129","10.1.1.255"],"correta":1,"explica":"Bloco 128: 0 e 128. 130 está na rede .128."},{"tipo":"mc","p":"Qual o broadcast de 192.168.5.40/29?","opcoes":["192.168.5.47","192.168.5.48","192.168.5.39","192.168.5.255"],"correta":0,"explica":"Bloco 8: 40–47. Broadcast .47."},{"tipo":"mc","p":"Quantos hosts úteis tem um /28?","opcoes":["16","14","30","12"],"correta":1,"explica":"2⁴ − 2 = 14."},{"tipo":"mc","p":"Precisa de 50 hosts por sub-rede. Qual o prefixo mais eficiente?","opcoes":["/25","/26","/27","/28"],"correta":1,"explica":"/26 dá 62 hosts; /27 só dá 30."},{"tipo":"vf","p":"192.168.1.63/26 é um endereço válido para um host.","correta":false,"explica":"É o broadcast da rede 192.168.1.0/26."},{"tipo":"mc","p":"Quantas sub-redes /27 cabem num /24?","opcoes":["4","6","8","16"],"correta":2,"explica":"3 bits emprestados → 2³ = 8."}],"referencias":["rfc950","rfc4632","odom1","lammle"]},{"id":"m3l3","titulo":"VLSM e sumarização","minutos":18,"nivel":"intermédio","objetivos":["Planear endereçamento com máscaras de tamanho variável","Evitar sobreposição de sub-redes","Sumarizar rotas"],"blocos":[{"tipo":"texto","titulo":"O que é VLSM","html":"<p><b>VLSM</b> (Variable Length Subnet Mask) permite usar máscaras diferentes dentro do mesmo bloco, dando a cada rede apenas o tamanho de que precisa. Regra de ouro: <b>atribuir primeiro as redes maiores</b>.</p>"},{"tipo":"exemplo","titulo":"Plano para 192.168.50.0/24","html":"<p>Necessidades: Vendas 100 hosts, TI 50, Gestão 20, 2 ligações WAN de 2 hosts.</p>\n<ol>\n<li>Vendas (100) → /25 (126) → <b>192.168.50.0/25</b> (.1–.126)</li>\n<li>TI (50) → /26 (62) → <b>192.168.50.128/26</b> (.129–.190)</li>\n<li>Gestão (20) → /27 (30) → <b>192.168.50.192/27</b> (.193–.222)</li>\n<li>WAN 1 → /30 → <b>192.168.50.224/30</b> (.225–.226)</li>\n<li>WAN 2 → /30 → <b>192.168.50.228/30</b> (.229–.230)</li>\n</ol>\n<p>Sobra 192.168.50.232 a .255 para crescer.</p>"},{"tipo":"topologia","nos":[{"id":"r1","tipo":"router","x":30,"y":30,"rotulo":"R1"},{"id":"r2","tipo":"router","x":70,"y":30,"rotulo":"R2"},{"id":"v","tipo":"switch","x":12,"y":80,"rotulo":"Vendas /25"},{"id":"t","tipo":"switch","x":45,"y":80,"rotulo":"TI /26"},{"id":"g","tipo":"switch","x":85,"y":80,"rotulo":"Gestão /27"}],"ligacoes":[{"a":"r1","b":"r2","rotulo":"WAN /30"},{"a":"r1","b":"v","rotulo":""},{"a":"r1","b":"t","rotulo":""},{"a":"r2","b":"g","rotulo":""}],"legenda":"Cada rede recebe uma máscara à medida."},{"tipo":"texto","titulo":"Sumarização (supernetting)","html":"<p>Juntar várias redes contíguas numa só rota reduz o tamanho das tabelas. Escreva as redes em binário e conte os bits iguais à esquerda.</p>\n<p>Ex.: 172.16.0.0/24, 172.16.1.0/24, 172.16.2.0/24, 172.16.3.0/24 → o 3.º octeto vai de 000000<b>00</b> a 000000<b>11</b>: 22 bits iguais → <b>172.16.0.0/22</b>.</p>"},{"tipo":"alerta","html":"Sobreposição: 10.0.0.0/25 e 10.0.0.64/26 sobrepõem-se (.64 a .127 pertencem às duas). O IOS recusa configurar sub-redes sobrepostas em interfaces diferentes do mesmo router (<i>% ... overlaps with ...</i>)."},{"tipo":"video","titulo":"VLSM passo a passo","busca":"VLSM passo a passo exemplo CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Ao planear com VLSM, por onde começar?","opcoes":["Pelas redes menores","Pelas ligações WAN","Pelas redes maiores","Por ordem alfabética"],"correta":2,"explica":"Maiores primeiro evita fragmentar o espaço."},{"tipo":"mc","p":"Que prefixo é o ideal para uma ligação ponto a ponto entre dois routers (sem /31)?","opcoes":["/24","/29","/30","/32"],"correta":2,"explica":"/30 tem exatamente 2 hosts úteis."},{"tipo":"mc","p":"Sumarize 10.1.4.0/24, 10.1.5.0/24, 10.1.6.0/24 e 10.1.7.0/24.","opcoes":["10.1.4.0/22","10.1.0.0/21","10.1.4.0/23","10.1.4.0/21"],"correta":0,"explica":"4 a 7 = 000001xx → 22 bits iguais."},{"tipo":"vf","p":"192.168.1.0/26 e 192.168.1.32/27 sobrepõem-se.","correta":true,"explica":"/26 vai de .0 a .63, que inclui .32–.63."}],"referencias":["rfc4632","odom1","netacad_itn"]},{"id":"m3l4","titulo":"IPv6 essencial","minutos":22,"nivel":"intermédio","objetivos":["Abreviar e expandir endereços IPv6","Distinguir global unicast, link-local, unique local e multicast","Configurar IPv6 num router, incluindo EUI-64 e SLAAC"],"blocos":[{"tipo":"figura","nome":"cabecalho_ipv6","legenda":"Cabeçalho IPv6: 40 bytes fixos, mais simples que o IPv4 (sem checksum nem fragmentação nos routers)."},{"tipo":"texto","titulo":"Porquê IPv6","html":"<p>O IPv4 tem cerca de 4,3 mil milhões de endereços e esgotou-se. O IPv6 tem <b>128 bits</b> (3,4 × 10<sup>38</sup>), escritos em 8 grupos de 4 dígitos hexadecimais: <code>2001:0DB8:0000:0000:0000:0000:0000:0001</code>.</p>"},{"tipo":"exemplo","titulo":"Regras de abreviação","html":"<ol>\n<li>Retirar zeros à esquerda de cada grupo: <code>0DB8</code> → <code>DB8</code>, <code>0001</code> → <code>1</code>.</li>\n<li>Substituir <b>uma única</b> sequência de grupos só com zeros por <code>::</code>.</li>\n</ol>\n<p><code>2001:0DB8:0000:0000:0000:0000:0000:0001</code> → <b><code>2001:DB8::1</code></b></p>\n<p><code>FE80:0000:0000:0000:0212:34FF:FE56:7890</code> → <b><code>FE80::212:34FF:FE56:7890</code></b></p>"},{"tipo":"tabela","titulo":"Tipos de endereço IPv6 (não existe broadcast!)","cabecalho":["Tipo","Prefixo","Para que serve"],"linhas":[["Global unicast","2000::/3","Público, encaminhável na Internet"],["Unique local","FC00::/7 (na prática FD00::/8)","Privado, como o RFC 1918"],["Link-local","FE80::/10","Só na ligação local; todas as interfaces IPv6 têm um"],["Multicast","FF00::/8","Grupos (FF02::1 todos os nós, FF02::2 todos os routers)"],["Loopback","::1/128","A própria máquina"],["Não especificado","::/128","Sem endereço ainda"]]},{"tipo":"exemplo","titulo":"EUI-64: criar o ID de interface a partir do MAC 0012.34AB.CDEF","html":"<ol>\n<li>Dividir o MAC ao meio e inserir <code>FFFE</code>: 0012:34<b>FF:FE</b>AB:CDEF.</li>\n<li>Inverter o 7.º bit do 1.º byte: 00 = 0000 0000 → 0000 00<b>1</b>0 = 02.</li>\n<li>ID de interface: <code>0212:34FF:FEAB:CDEF</code>.</li>\n</ol>"},{"tipo":"cli","titulo":"IPv6 num router Cisco","passos":[{"prompt":"R1(config)#","cmd":"ipv6 unicast-routing","explica":"Ativa o encaminhamento IPv6 (desligado por defeito!)."},{"prompt":"R1(config)#","cmd":"interface g0/0","explica":"Entra na interface."},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:1::1/64","explica":"Endereço global estático."},{"prompt":"R1(config-if)#","cmd":"ipv6 address fe80::1 link-local","explica":"Link-local fácil de ler (opcional)."},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"Liga a interface."},{"prompt":"R1(config-if)#","cmd":"interface g0/1","explica":""},{"prompt":"R1(config-if)#","cmd":"ipv6 address 2001:db8:acad:2::/64 eui-64","explica":"O router gera o ID de interface a partir do MAC."},{"prompt":"R1#","cmd":"show ipv6 interface brief","explica":"Verifica endereços e estado."},{"prompt":"R1(config)#","cmd":"ipv6 route ::/0 2001:db8:ffff::2","explica":"Rota por defeito IPv6."}],"nota":""},{"tipo":"texto","titulo":"Como os PCs obtêm IPv6","html":"<ul>\n<li><b>SLAAC</b>: o router envia <i>Router Advertisements</i> (RA) com o prefixo; o PC cria o próprio endereço.</li>\n<li><b>DHCPv6 stateless</b>: SLAAC para o endereço + DHCPv6 para DNS e outros dados.</li>\n<li><b>DHCPv6 stateful</b>: o servidor DHCPv6 atribui o endereço (o gateway continua a vir do RA).</li>\n</ul>\n<p>Para evitar duplicados, o host faz <b>DAD</b> (Duplicate Address Detection) com mensagens NDP.</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta SLAAC, DHCPv6 e EUI-64, mas algumas mensagens debug não existem.","Os PCs simulados não usam endereços temporários de privacidade."],"real":["Windows/macOS/Linux geram endereços aleatórios (privacidade, RFC 8981) em vez de EUI-64 — o endereço que vê no PC não bate com o MAC.","Em alguns switches é preciso ativar o modelo SDM para IPv6 antes de o configurar (ex.: Catalyst 2960: <code>sdm prefer dual-ipv4-and-ipv6 default</code> + reload)."]},{"tipo":"video","titulo":"IPv6 para CCNA","busca":"IPv6 explicado CCNA tipos de endereço SLAAC EUI-64","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual é a forma abreviada correta de 2001:0DB8:0000:0000:0000:00A0:0000:0001?","opcoes":["2001:DB8::A0::1","2001:DB8::A0:0:1","2001:DB8:0:0:0:A:0:1","2001:DB8::A:1"],"correta":1,"explica":"Só se pode usar :: uma vez, e não se tiram zeros à direita (00A0 → A0)."},{"tipo":"mc","p":"Que prefixo identifica endereços link-local?","opcoes":["2000::/3","FC00::/7","FE80::/10","FF00::/8"],"correta":2,"explica":"FE80::/10."},{"tipo":"vf","p":"O IPv6 usa broadcast para descobrir vizinhos.","correta":false,"explica":"IPv6 não tem broadcast; usa multicast (NDP)."},{"tipo":"cmd","p":"Que comando global ativa o encaminhamento IPv6 num router Cisco?","respostas":["ipv6 unicast-routing"],"explica":"Sem ele o router não encaminha pacotes IPv6 nem envia RAs."},{"tipo":"mc","p":"No EUI-64, que valor é inserido no meio do MAC?","opcoes":["FFFF","FFFE","FE80","0000"],"correta":1,"explica":"FFFE no meio e inverte-se o 7.º bit."}],"referencias":["rfc8200","rfc4291","rfc4861","rfc4862","odom1"]}],"prova_extra":[{"tipo":"mc","p":"Um host tem 172.16.18.200/21. Qual é o endereço de rede?","opcoes":["172.16.16.0","172.16.18.0","172.16.8.0","172.16.0.0"],"correta":0,"explica":"/21 → mágico 8 no 3.º octeto: 16–23. Rede 172.16.16.0."},{"tipo":"mc","p":"Qual o último host válido de 10.10.10.0/23?","opcoes":["10.10.10.254","10.10.11.254","10.10.11.255","10.10.12.254"],"correta":1,"explica":"/23 vai de 10.10.10.0 a 10.10.11.255; último host .11.254."},{"tipo":"mc","p":"Que endereço IPv6 é equivalente a um endereço privado RFC 1918?","opcoes":["Global unicast","Unique local","Link-local","Multicast"],"correta":1,"explica":"Unique local FC00::/7."},{"tipo":"vf","p":"Uma interface IPv6 pode ter vários endereços ao mesmo tempo.","correta":true,"explica":"No mínimo um link-local, mais globais/unique local."}]},{"id":"m4","numero":4,"titulo":"Primeiros passos no Cisco IOS","descricao":"A linha de comandos Cisco do zero: modos, configuração base, SSH, verificação e o que muda entre simulador e equipamento real.","dominio":"1.0 / 4.0 / 5.0","icone":"terminal","licoes":[{"id":"m4l1","titulo":"Modos da CLI e navegação","minutos":15,"nivel":"básico","objetivos":["Navegar entre os modos do IOS","Usar abreviações, ? e Tab","Perceber running-config e startup-config"],"blocos":[{"tipo":"texto","titulo":"Os modos","html":"<p>O prompt diz-lhe sempre em que modo está:</p>\n<ul>\n<li><code>R1&gt;</code> <b>EXEC de utilizador</b>: só comandos básicos de consulta.</li>\n<li><code>R1#</code> <b>EXEC privilegiado</b>: todos os <code>show</code>, <code>debug</code>, <code>copy</code>, <code>reload</code>.</li>\n<li><code>R1(config)#</code> <b>Configuração global</b>: alterações que afetam todo o equipamento.</li>\n<li><code>R1(config-if)#</code>, <code>(config-line)#</code>, <code>(config-router)#</code>, <code>(config-vlan)#</code>: <b>submodos</b>.</li>\n</ul>"},{"tipo":"cli","titulo":"Andar entre modos","passos":[{"prompt":"R1>","cmd":"enable","explica":"Sobe para EXEC privilegiado (abreviação: en)."},{"prompt":"R1#","cmd":"configure terminal","explica":"Entra em configuração global (conf t)."},{"prompt":"R1(config)#","cmd":"interface gigabitEthernet 0/0","explica":"Submodo de interface (int g0/0)."},{"prompt":"R1(config-if)#","cmd":"exit","explica":"Volta um nível."},{"prompt":"R1(config)#","cmd":"end","explica":"Volta direto ao modo privilegiado (ou Ctrl+Z)."},{"prompt":"R1#","cmd":"disable","explica":"Volta ao EXEC de utilizador."}],"nota":""},{"tipo":"tabela","titulo":"Atalhos que poupam tempo","cabecalho":["Atalho","Efeito"],"linhas":[["?","Lista comandos ou opções disponíveis"],["Tab","Completa o comando"],["Seta ↑ / Ctrl+P","Comando anterior (histórico)"],["Ctrl+A / Ctrl+E","Início / fim da linha"],["Ctrl+Shift+6","Interrompe ping/traceroute ou pesquisa DNS"],["Ctrl+Z","Sai para o modo privilegiado"],["do <comando>","Executa um comando EXEC dentro do modo de configuração"]]},{"tipo":"texto","titulo":"Onde fica a configuração","html":"<ul>\n<li><b>running-config</b>: a configuração ativa, em <b>RAM</b>. Perde-se ao desligar.</li>\n<li><b>startup-config</b>: guardada na <b>NVRAM</b>. É carregada no arranque.</li>\n</ul>\n<p>Para guardar: <code>copy running-config startup-config</code> (ou <code>write memory</code> / <code>wr</code>).</p>"},{"tipo":"alerta","html":"Escreveu um nome errado e o equipamento ficou parado a “Translating…”? Ele pensou que era um nome de host e tentou DNS. Use <b>Ctrl+Shift+6</b> e configure <code>no ip domain-lookup</code>."},{"tipo":"dica","html":"Experimente já no <b>Laboratório CLI</b> (separador Jogar): o terminal simulado aceita abreviações, <code>?</code> e <code>do</code>."},{"tipo":"video","titulo":"Cisco IOS CLI básico","busca":"Cisco IOS CLI modos de configuração básico aula","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que prompt indica o modo de configuração global?","opcoes":["R1>","R1#","R1(config)#","R1(config-if)#"],"correta":2,"explica":"(config)# = configuração global."},{"tipo":"cmd","p":"Que comando passa de R1> para R1#?","respostas":["enable","en","ena"],"explica":"enable (pode abreviar)."},{"tipo":"mc","p":"Onde fica a running-config?","opcoes":["NVRAM","RAM","Flash","ROM"],"correta":1,"explica":"RAM: perde-se se o equipamento reiniciar sem guardar."},{"tipo":"cmd","p":"Que comando guarda a configuração ativa no arranque?","respostas":["copy running-config startup-config","copy run start","write memory","wr","write","wr mem"],"explica":"copy running-config startup-config ou write memory."},{"tipo":"vf","p":"No modo de configuração pode usar 'do show ip interface brief'.","correta":true,"explica":"O prefixo do executa comandos EXEC."}],"referencias":["cisco_ios","odom1","netacad_itn"]},{"id":"m4l2","titulo":"Configuração base e acesso seguro (SSH)","minutos":20,"nivel":"básico","objetivos":["Fazer a configuração inicial de um router ou switch","Proteger o acesso com palavras-passe e utilizadores locais","Ativar SSH e desativar Telnet"],"blocos":[{"tipo":"cli","titulo":"Configuração inicial de um router","passos":[{"prompt":"Router>","cmd":"enable","explica":""},{"prompt":"Router#","cmd":"configure terminal","explica":""},{"prompt":"Router(config)#","cmd":"hostname R1","explica":"Dá nome ao equipamento: o prompt muda logo."},{"prompt":"R1(config)#","cmd":"no ip domain-lookup","explica":"Evita esperas quando se escreve um comando errado."},{"prompt":"R1(config)#","cmd":"enable secret Cisco#2026","explica":"Palavra-passe do modo privilegiado, guardada com hash."},{"prompt":"R1(config)#","cmd":"service password-encryption","explica":"Esconde (cifra fraca, tipo 7) as palavras-passe em texto simples."},{"prompt":"R1(config)#","cmd":"banner motd #Acesso restrito a pessoal autorizado#","explica":"Mensagem legal mostrada no login."},{"prompt":"R1(config)#","cmd":"line console 0","explica":"Configura a consola."},{"prompt":"R1(config-line)#","cmd":"password ConsolaSegura","explica":""},{"prompt":"R1(config-line)#","cmd":"login","explica":"Pede a palavra-passe da linha."},{"prompt":"R1(config-line)#","cmd":"logging synchronous","explica":"Mensagens de log não cortam o que está a escrever."},{"prompt":"R1(config-line)#","cmd":"exec-timeout 10 0","explica":"Termina a sessão após 10 min inativo."},{"prompt":"R1(config-line)#","cmd":"exit","explica":""},{"prompt":"R1(config)#","cmd":"interface g0/0","explica":""},{"prompt":"R1(config-if)#","cmd":"description LAN dos utilizadores","explica":"Documenta a interface."},{"prompt":"R1(config-if)#","cmd":"ip address 192.168.1.1 255.255.255.0","explica":"IP do gateway da LAN."},{"prompt":"R1(config-if)#","cmd":"no shutdown","explica":"As interfaces de router vêm desligadas por defeito!"},{"prompt":"R1(config-if)#","cmd":"end","explica":""},{"prompt":"R1#","cmd":"copy running-config startup-config","explica":"Guardar sempre no fim."}],"nota":""},{"tipo":"cli","titulo":"Ativar SSH versão 2","passos":[{"prompt":"R1(config)#","cmd":"ip domain-name empresa.local","explica":"Necessário para gerar as chaves RSA."},{"prompt":"R1(config)#","cmd":"username admin secret Adm!n2026","explica":"Utilizador local com hash."},{"prompt":"R1(config)#","cmd":"crypto key generate rsa modulus 2048","explica":"Gera as chaves (o SSH só arranca com chaves; mínimo 768 para SSHv2)."},{"prompt":"R1(config)#","cmd":"ip ssh version 2","explica":"Força a versão 2."},{"prompt":"R1(config)#","cmd":"line vty 0 4","explica":"Linhas de acesso remoto (em muitos IOS existem 0 15)."},{"prompt":"R1(config-line)#","cmd":"login local","explica":"Usa os utilizadores locais."},{"prompt":"R1(config-line)#","cmd":"transport input ssh","explica":"Só SSH: Telnet fica bloqueado."},{"prompt":"R1#","cmd":"show ip ssh","explica":"Confirma: SSH Enabled - version 2.0."}],"nota":"Num switch L2, para gerir remotamente, configure também um IP na SVI (<code>interface vlan 1</code>) e o <code>ip default-gateway</code>."},{"tipo":"tabela","titulo":"Tipos de palavra-passe","cabecalho":["Comando","Como guarda"],"linhas":[["enable password","Texto simples (tipo 0) — evite"],["service password-encryption","Tipo 7 — reversível, só evita olhares por cima do ombro"],["enable secret / username … secret","Hash (tipo 5 MD5, 8 PBKDF2 ou 9 scrypt, conforme versão)"]]},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer o 'crypto key generate rsa' pergunta o tamanho e conclui instantaneamente.","Testa SSH no PC simulado: Desktop › Command Prompt › ssh -l admin 192.168.1.1.","Algumas opções (algorithm-type scrypt, ip ssh time-out) podem não existir."],"real":["Gerar chaves de 2048/4096 bits demora alguns segundos.","Clientes SSH modernos (OpenSSH recente) podem recusar algoritmos antigos de IOS velhos: pode ser preciso -oKexAlgorithms=+diffie-hellman-group14-sha1.","Antes de 'transport input ssh' confirme que consegue entrar por SSH, ou fica trancado fora (só resta a consola).","Em produção use AAA com TACACS+/RADIUS, não só utilizadores locais."]},{"tipo":"alerta","html":"Nunca use Telnet em produção: tudo, incluindo palavras-passe, passa em texto claro e qualquer analisador (Wireshark) lê."},{"tipo":"video","titulo":"Configurar SSH em router Cisco","busca":"configurar SSH router switch Cisco passo a passo","youtube_id":"","canal":""}],"quiz":[{"tipo":"cmd","p":"Que comando dá ao router o nome R1?","respostas":["hostname R1"],"explica":"hostname R1 no modo de configuração global."},{"tipo":"mc","p":"Qual a forma mais segura de proteger o modo privilegiado?","opcoes":["enable password","enable secret","service password-encryption","login"],"correta":1,"explica":"enable secret guarda um hash."},{"tipo":"mc","p":"O que é obrigatório para gerar chaves RSA?","opcoes":["hostname e ip domain-name","Um servidor TACACS+","Interface loopback","Um servidor NTP"],"correta":0,"explica":"O nome das chaves usa hostname.domínio."},{"tipo":"cmd","p":"Na linha vty, que comando permite apenas SSH?","respostas":["transport input ssh"],"explica":"transport input ssh."},{"tipo":"vf","p":"As interfaces dos routers Cisco vêm ativas por defeito.","correta":false,"explica":"Vêm em shutdown (administratively down). Nos switches estão ativas."}],"referencias":["cisco_ios","rfc4253","odom1","nist"]},{"id":"m4l3","titulo":"Verificar e resolver problemas","minutos":18,"nivel":"básico","objetivos":["Ler show ip interface brief e show interfaces","Usar ping, traceroute, CDP e LLDP","Interpretar estados up/down e contadores de erro"],"blocos":[{"tipo":"saida","titulo":"show ip interface brief","texto":"R1#show ip interface brief\nInterface              IP-Address      OK? Method Status                Protocol\nGigabitEthernet0/0     192.168.1.1     YES manual up                    up\nGigabitEthernet0/1     10.0.0.1        YES manual up                    down\nGigabitEthernet0/2     unassigned      YES unset  administratively down down\nLoopback0              1.1.1.1         YES manual up                    up","explica":"Leia as duas colunas finais: Status (camada 1) e Protocol (camada 2)."},{"tipo":"tabela","titulo":"Os estados das interfaces","cabecalho":["Status / Protocol","Significado","Causa provável"],"linhas":[["up / up","Tudo bem","—"],["administratively down / down","Desligada por configuração","Falta no shutdown"],["down / down","Sem sinal físico","Cabo desligado/avariado, outra ponta desligada"],["up / down","Camada 1 ok, camada 2 não","Encapsulamento diferente, clock rate, keepalives"],["down / down (err-disabled)","Desligada por proteção","Port security, BPDU guard"]]},{"tipo":"saida","titulo":"Contadores em show interfaces g0/0","texto":"  5 minute input rate 2000 bits/sec, 3 packets/sec\n     12045 packets input, 1544320 bytes, 0 no buffer\n     0 runts, 0 giants, 0 throttles\n     157 input errors, 157 CRC, 0 frame, 0 overrun, 0 ignored\n     0 output errors, 34 collisions, 2 interface resets\n     12 late collision, 0 deferred","explica":"CRC a subir = problema físico (cabo, interferência). Late collisions = quase sempre duplex mismatch."},{"tipo":"cli","titulo":"Ferramentas de teste","passos":[{"prompt":"R1#","cmd":"ping 192.168.1.10","explica":"!!!!! = sucesso; . = timeout; U = destino inalcançável."},{"prompt":"R1#","cmd":"ping 8.8.8.8 source g0/0","explica":"Ping estendido escolhendo a origem."},{"prompt":"R1#","cmd":"traceroute 10.2.2.2","explica":"Mostra cada salto até ao destino."},{"prompt":"R1#","cmd":"show cdp neighbors","explica":"Vizinhos Cisco diretamente ligados (CDP, ativo por defeito)."},{"prompt":"R1#","cmd":"show cdp neighbors detail","explica":"Inclui IP e versão de IOS do vizinho."},{"prompt":"R1(config)#","cmd":"lldp run","explica":"Ativa LLDP (norma aberta, IEEE 802.1AB) — desligado por defeito no IOS."},{"prompt":"R1#","cmd":"show lldp neighbors","explica":"Vizinhos LLDP, incluindo ei","show cdp neighbors detail","sh cdp neighbors"],"explica":"show cdp neighbors."},{"tipo":"vf","p":"LLDP é um protocolo proprietário da Cisco.","correta":false,"explica":"LLDP é norma IEEE 802.1AB. O proprietário é o CDP."},{"tipo":"mc","p":"No resultado de um ping Cisco, '.' significa…","opcoes":["Sucesso","Timeout","Destino inalcançável","TTL expirado"],"correta":1,"explica":"Ponto = sem resposta dentro do tempo."}],"referencias":["cisco_ios","odom1","netacad_srwe"]},{"id":"m4l4","titulo":"Simulador × equipamento real","minutos":18,"nivel":"intermédio","objetivos":["Escolher entre Packet Tracer, GNS3, EVE-NG e CML","Conhecer o arranque do IOS, a flash e o ROMMON","Fazer backup, atualizar IOS e recuperar palavra-passe"],"blocos":[{"tipo":"tabela","titulo":"Onde praticar","cabecalho":["Ferramenta","O que é","Prós","Contras"],"linhas":[["Cisco Packet Tracer","Simulador gratuito (NetAcad)","Leve, corre em qualquer PC, ideal para CCNA","IOS simulado: comandos limitados"],["Cisco CML","Emulação com imagens Cisco oficiais","IOS real (IOSv, IOS-XE, NX-OS)","Pago; exige muita RAM"],["GNS3","Emulador gratuito","Mistura imagens reais, VMs e PCs","Precisa de imagens próprias"],["EVE-NG","Plataforma web de emulação","Multi-fabricante, labs grandes","Instalação mais técnica"],["Equipamento usado","Switches/routers reais","Experiência física: cabos, consola, LEDs, ruído","Custo, espaço, consumo"]]},{"tipo":"figura","nome":"painel_router","legenda":"Num equipamento real vai ligar a consola, ver LEDs e ouvir as ventoinhas."},{"tipo":"texto","titulo":"O arranque de um equipamento Cisco","html":"<ol>\n<li><b>POST</b> (teste do hardware) e carregamento do <b>bootstrap</b> a partir da ROM.</li>\n<li>Localiza e carrega o <b>IOS</b> (normalmente da <b>flash</b>; pode vir de TFTP).</li>\n<li>Carrega a <b>startup-config</b> da NVRAM. Se não existir, abre o <i>setup mode</i> (“Would you like to enter the initial configuration dialog?” — responda <b>no</b>).</li>\n</ol>\n<p>O <b>configuration register</b> (normalmente <code>0x2102</code>) controla isto. Com <code>0x2142</code> o router ignora a startup-config: é a base da recuperação de palavra-passe.</p>"},{"tipo":"cli","titulo":"Backup e atualização via TFTP","passos":[{"prompt":"R1#","cmd":"show version","explica":"Modelo, versão do IOS, uptime, config register."},{"prompt":"R1#","cmd":"show flash:","explica":"Ficheiros na flash e espaço livre."},{"prompt":"R1#","cmd":"copy running-config tftp:","explica":"Pede o IP do servidor TFTP e o nome do ficheiro."},{"prompt":"R1#","cmd":"copy tftp: flash:","explica":"Copia uma nova imagem IOS para a flash."},{"prompt":"R1(config)#","cmd":"boot system flash:isr4300-universalk9.17.09.04a.SPA.bin","explica":"Indica que imagem arrancar (exemplo de nome)."},{"prompt":"R1#","cmd":"verify /md5 flash:isr4300-universalk9.17.09.04a.SPA.bin","explica":"Confirma a integridade antes de reiniciar."},{"prompt":"R1#","cmd":"reload","explica":"Reinicia. Guarde a configuração antes!"}],"nota":""},{"tipo":"cli","titulo":"Recuperar a palavra-passe de um router (com acesso físico)","passos":[{"prompt":"—","cmd":"Ligar à consola e reiniciar o router","explica":""},{"prompt":"—","cmd":"Enviar Break nos primeiros 60 s (Ctrl+Break no PuTTY)","explica":"Entra em ROMMON."},{"prompt":"rommon 1 >","cmd":"confreg 0x2142","explica":"Arranque a ignorar a startup-config."},{"prompt":"rommon 2 >","cmd":"reset","explica":"Reinicia."},{"prompt":"Router#","cmd":"copy startup-config running-config","explica":"Recupera a configuração antiga para a RAM (responda no ao setup antes)."},{"prompt":"R1(config)#","cmd":"enable secret NovaPass#1","explica":"Define nova palavra-passe."},{"prompt":"R1(config)#","cmd":"config-register 0x2102","explica":"Repõe o arranque normal!"},{"prompt":"R1#","cmd":"copy running-config startup-config","explica":"Guardar."}],"nota":"Em switches Catalyst o processo é diferente (botão MODE ao ligar)."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Equipamentos ligam em segundos; reload é quase instantâneo.","Pode apagar tudo sem riscos e recomeçar o laboratório.","Não existe ROMMON real nem imagens IOS para atualizar (na maioria dos casos)."],"real":["Um reload de um switch empresarial pode demorar vários minutos — planeie janelas de manutenção.","Uma imagem IOS errada ou corrompida pode deixar o equipamento em ROMMON: tenha sempre um plano de reversão.","Licenças (ex.: DNA/Network Advantage) podem limitar funcionalidades.","Documente tudo, use controlo de alterações e guarde backups fora do equipamento.","Equipamentos usados podem vir com configuração antiga: <code>write erase</code> + <code>delete vlan.dat</code> (switch) + <code>reload</code>."]},{"tipo":"dica","html":"Para o exame, o Packet Tracer chega para quase tudo. Para a vida real, ganhe experiência física com 2 switches e 1 router usados — é barato e ensina muito."},{"tipo":"video","titulo":"Packet Tracer vs GNS3 vs equipamento real","busca":"Packet Tracer vs GNS3 vs EVE-NG vs CML lab CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Onde fica guardado normalmente o ficheiro do IOS?","opcoes":["NVRAM","RAM","Flash","ROM"],"correta":2,"explica":"A imagem IOS está na flash."},{"tipo":"mc","p":"Que valor do configuration register ignora a startup-config?","opcoes":["0x2102","0x2142","0x2100","0x0000"],"correta":1,"explica":"0x2142 é usado na recuperação de palavra-passe."},{"tipo":"cmd","p":"Que comando mostra a versão do IOS, uptime e o configuration register?","respostas":["show version","sh ver","sh version","show ver"],"explica":"show version."},{"tipo":"vf","p":"O Packet Tracer usa as imagens IOS reais da Cisco.","correta":false,"explica":"É um simulador: o IOS é reproduzido e tem comandos limitados. O CML usa imagens reais."},{"tipo":"mc","p":"Para limpar a configuração de um switch usado deve…","opcoes":["Só reload","write erase, delete vlan.dat e reload","copy run start","no shutdown"],"correta":1,"explica":"A base de dados de o":"PC A Fa0/1"},{"id":"b","tipo":"pc","x":10,"y":80,"rotulo":"PC B Fa0/2"},{"id":"sw","tipo":"switch","x":50,"y":50,"rotulo":"SW1"},{"id":"c","tipo":"pc","x":90,"y":20,"rotulo":"PC C Fa0/3"},{"id":"d","tipo":"pc","x":90,"y":80,"rotulo":"PC D Fa0/4"}],"ligacoes":[{"a":"a","b":"sw","rotulo":""},{"a":"b","b":"sw","rotulo":""},{"a":"sw","b":"c","rotulo":""},{"a":"sw","b":"d","rotulo":""}],"legenda":"Cada porta do switch é um domínio de colisão; todas juntas (na mesma VLAN) são um domínio de broadcast."},{"tipo":"tabela","titulo":"","cabecalho":["Equipamento","Domínios de colisão","Domínios de broadcast"],"linhas":[["Hub","1 para todas as portas","1"],["Switch (1 VLAN)","1 por porta","1"],["Router","1 por interface","1 por interface"]]},{"tipo":"saida","titulo":"show mac address-table","texto":"SW1#show mac address-table\n          Mac Address Table\n-------------------------------------------\nVlan    Mac Address       Type        Ports\n----    -----------       --------    -----\n   1    0050.7966.6800    DYNAMIC     Fa0/1\n   1    0050.7966.6801    DYNAMIC     Fa0/2\n  10    00d0.ba8e.7a01    STATIC      Fa0/3","explica":""},{"tipo":"texto","titulo":"Métodos de comutação","html":"<ul>\n<li><b>Store-and-forward</b>: recebe a trama inteira e verifica o FCS. Padrão na maioria dos switches Cisco.</li>\n<li><b>Cut-through</b>: começa a enviar logo que lê o MAC de destino. Menor latência, mas propaga tramas com erros.</li>\n</ul>"},{"tipo":"video","titulo":"Como funciona um switch","busca":"como funciona switch tabela MAC CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"O switch aprende endereços a partir do…","opcoes":["MAC de destino","MAC de origem","IP de origem","FCS"],"correta":1,"explica":"Lê sempre o MAC de origem."},{"tipo":"mc","p":"O que faz o switch com uma trama para um MAC desconhecido?","opcoes":["Descarta","Inunda pela VLAN","Envia ao router","Responde com ARP"],"correta":1,"explica":"Unknown unicast flooding."},{"tipo":"mc","p":"Quantos domínios de broadcast tem um switch de 24 portas, todas na VLAN 1?","opcoes":["1","2","24","48"],"correta":0,"explica":"Uma VLAN = um domínio de broadcast."},{"tipo":"vf","p":"O tempo padrão de envelhecimento da tabela MAC nos switches Cisco é 300 segundos.","correta":true,"explica":"5 minutos."}],"referencias":["ieee8021d","odom1","netacad_srwe"]},{"id":"m5l2","titulo":"VLANs e trunks 802.1Q","minutos":22,"nivel":"intermédio","objetivos":["Criar VLANs e atribuir portas de acesso","Configurar trunks 802.1Q e a VLAN nativa","Conhecer DTP e VTP e porque se desligam"],"blocos":[{"tipo":"texto","titulo":"O que é uma VLAN","html":"<p>Uma <b>VLAN</b> divide um switch físico em várias redes lógicas. Cada VLAN é um <b>domínio de broadcast</b> separado e, normalmente, uma <b>sub-rede IP</b> própria. Vantagens: segurança, menos broadcast e organização por função (Vendas, TI, Voz, Convidados) em vez de por localização.</p>"},{"tipo":"topologia","nos":[{"id":"sw1","tipo":"switch","x":25,"y":50,"rotulo":"SW1"},{"id":"sw2","tipo":"switch","x":75,"y":50,"rotulo":"SW2"},{"id":"v1","tipo":"pc","x":8,"y":15,"rotulo":"Vendas V10"},{"id":"t1","tipo":"pc","x":8,"y":85,"rotulo":"TI V20"},{"id":"v2","tipo":"pc","x":92,"y":15,"rotulo":"Vendas V10"},{"id":"t2","tipo":"pc","x":92,"y":85,"rotulo":"TI V20"}],"ligacoes":[{"a":"v1","b":"sw1","rotulo":"access"},{"a":"t1","b":"sw1","rotulo":"access"},{"a":"sw1","b":"sw2","rotulo":"trunk 802.1Q"},{"a":"sw2","b":"v2","rotulo":"access"},{"a":"sw2","b":"t2","rotulo":"access"}],"legenda":"O trunk transporta várias VLANs no mesmo cabo, marcando cada trama com a etiqueta (tag) da VLAN."},{"tipo":"cli","titulo":"Criar VLANs e portas de acesso","passos":[{"prompt":"SW1(config)#","cmd":"vlan 10","explica":"Cria a VLAN 10."},{"prompt":"SW1(config-vlan)#","cmd":"name VENDAS","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"vlan 20","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"name TI","explica":""},{"prompt":"SW1(config-vlan)#","cmd":"exit","explica":""},{"
