<style>
/* Layout: app móvel de uma coluna (máx. 720px), barra inferior fixa; o "painel de switch"
   com LEDs por lição é a assinatura visual do progresso. */
:root {
  --bg: #edf1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #0d1925;
  --muted: #536375;
  --line: #d3dbe3;
  --accent: #0a6c8c;
  --accent-ink: #ffffff;
  --accent-soft: #dcedf3;
  --ok: #1b8d4c;
  --ok-soft: #dcf2e5;
  --warn: #b77a06;
  --warn-soft: #fbefd6;
  --bad: #c03a3a;
  --bad-soft: #f8e0e0;
  --led-on: #22c55e;
  --led-amb: #f2a516;
  --led-off: #c4cdd6;
  --term-bg: #0b1218;
  --term-fg: #d3ecd9;
  --term-prompt: #7ccfff;
  --term-dim: #6e8597;
  --chassi: #cdd5dc;
  --porta: #26323d;
  --porta-in: #0b1116;
  --slot: #b6c0ca;
  --plastico: #dbe4ec;
  --ico: #1d7ea6;
  --ico-esc: #135c7b;
  --ico-claro: #63b4d4;
  --ecra: #c4e7f3;
  --nuvem: #9fb2c3;
  --d1: #1f6f8b; --d2: #2b8a6e; --d3: #6a5acd; --d4: #b5651d; --d5: #8b3a62; --d6: #3d6fb6; --d7: #5c6b7a;
  --shadow: 0 1px 2px rgba(13, 25, 37, .06), 0 4px 16px rgba(13, 25, 37, .06);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091017; --surface: #101a24; --surface-2: #15212d; --ink: #e2e9f0; --muted: #91a3b5; --line: #223241;
    --accent: #48bfdf; --accent-ink: #032029; --accent-soft: #0f2c37;
    --ok: #3ccb7a; --ok-soft: #0f2a1c; --warn: #f0b23a; --warn-soft: #2d230d; --bad: #f07070; --bad-soft: #321616;
    --led-off: #2a3946; --chassi: #2a3744; --slot: #3a4856; --plastico: #3b4b59; --porta: #121a21;
    --ico: #3aa6cf; --ico-esc: #1e6f90; --ico-claro: #7fcbe6; --ecra: #0f3442; --nuvem: #5d7286;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091017; --surface: #101a24; --surface-2: #15212d; --ink: #e2e9f0; --muted: #91a3b5; --line: #223241;
  --accent: #48bfdf; --accent-ink: #032029; --accent-soft: #0f2c37;
  --ok: #3ccb7a; --ok-soft: #0f2a1c; --warn: #f0b23a; --warn-soft: #2d230d; --bad: #f07070; --bad-soft: #321616;
  --led-off: #2a3946; --chassi: #2a3744; --slot: #3a4856; --plastico: #3b4b59; --porta: #121a21;
  --ico: #3aa6cf; --ico-esc: #1e6f90; --ico-claro: #7fcbe6; --ecra: #0f3442; --nuvem: #5d7286;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--f-mono); font-size: .88em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tab-num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ estrutura */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topo .titulo { flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 750; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca { display: flex; align-items: center; gap: 8px; }
.marca b { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; letter-spacing: .02em; }
.btn-icone { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.btn-icone svg { width: 20px; height: 20px; }
.xp-pilula { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; white-space: nowrap; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
main > * { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: .72rem; font-weight: 600; cursor: pointer; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* ------------------------------------------------------------ componentes */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.cartao.plano { box-shadow: none; }
.secao { display: grid; gap: 12px; }
.secao > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rotulo { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.suave { color: var(--muted); }
.peq { font-size: .88rem; }
.linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linha.entre { justify-content: space-between; }
.grelha-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 380px) { .grelha-2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bloco { width: 100%; }
.btn.peq { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.barra { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* LEDs de porta — assinatura visual do progresso */
.leds { display: flex; gap: 4px; flex-wrap: wrap; }
.led { width: 14px; height: 9px; border-radius: 2px; background: var(--led-off); }
.led.on { background: var(--led-on); box-shadow: 0 0 6px color-mix(in srgb, var(--led-on) 60%, transparent); }
.led.amb { background: var(--led-amb); animation: pisca 1.4s infinite; }
.led.exame { width: 22px; border: 1px solid var(--muted); }
@keyframes pisca { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .led.amb { animation: none; } * { transition: none !important; } }

.painel { background: var(--chassi); border-radius: 12px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); }
.painel .fila { display: grid; grid-template-columns: 2.6rem 1fr auto; gap: 10px; align-items: center; cursor: pointer; padding: 4px 6px; border-radius: 8px; background: none; border: 0; text-align: left; }
.painel .fila:hover { background: color-mix(in srgb, var(--surface) 35%, transparent); }
.painel .num { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.painel .pct { font-family: var(--f-mono); font-size: .75rem; color: var(--ink); }

/* hero / nível */
.nivel { display: grid; gap: 10px; background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, var(--ink)) 100%); color: var(--accent-ink); border-radius: 18px; padding: 18px; }
.nivel h1 { font-size: 1.55rem; }
.nivel .barra { background: color-mix(in srgb, var(--accent-ink) 22%, transparent); border: 0; }
.nivel .barra > i { background: var(--accent-ink); }
.nivel .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; font-weight: 600; opacity: .92; }

.acoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.acao { display: grid; gap: 6px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.acao svg { width: 28px; height: 28px; color: var(--accent); }
.acao b { font-family: var(--f-display); font-stretch: 85%; font-size: 1rem; }
.acao span { font-size: .8rem; color: var(--muted); }

/* listas de módulos e lições */
.lista { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.item[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.item .ico-caixa { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.item .meio { min-width: 0; display: grid; gap: 4px; }
.item .meio b { font-family: var(--f-display); font-stretch: 88%; font-size: 1.02rem; line-height: 1.2; }
.estado-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; font-weight: 800; }
.estado-ico.ok { background: var(--ok); color: #fff; }
.estado-ico.atual { background: var(--led-amb); color: #241a00; }
.estado-ico.bloq { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* ------------------------------------------------------------ lição */
.cab-licao { display: grid; gap: 10px; }
.objetivos { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.conteudo { display: grid; gap: 18px; }
.bloco { display: grid; gap: 10px; min-width: 0; }
.bloco h3 { display: flex; gap: 8px; align-items: center; }
.bloco .html { display: grid; gap: 10px; max-width: 68ch; }
.bloco .html ul, .bloco .html ol { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
.bloco .html pre { margin: 0; background: var(--term-bg); color: var(--term-fg); padding: 14px; border-radius: 10px; overflow-x: auto; font-size: .82rem; line-height: 1.5; }
.fig-caixa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; overflow-x: auto; }
.fig-caixa figcaption { font-size: .85rem; color: var(--muted); }
.fig { width: 100%; height: auto; display: block; min-width: 320px; }
.fig-ico { max-width: 160px; margin: 0 auto; }

.exemplo { border: 1px solid var(--line); border-left: 4px solid var(--d2); background: var(--surface); padding: 14px; border-radius: 10px; }
.dica, .alerta { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: 10px; }
.dica { background: var(--accent-soft); }
.alerta { background: var(--warn-soft); }
.dica svg, .alerta svg { width: 22px; height: 22px; }
.dica svg { color: var(--accent); }
.alerta svg { color: var(--warn); }

.tabela-caixa { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 12px; font-family: var(--f-mono); font-size: .84rem; overflow: hidden; }
.term .barra-term { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: color-mix(in srgb, var(--term-bg) 80%, #ffffff); color: var(--term-dim); font-size: .75rem; gap: 8px; }
.term .barra-term .pontos { display: flex; gap: 5px; }
.term .barra-term .pontos i { width: 9px; height: 9px; border-radius: 50%; background: var(--term-dim); }
.passos { list-style: none; margin: 0; padding: 6px 0; }
.passos li { padding: 8px 12px; display: grid; gap: 2px; border-bottom: 1px dashed color-mix(in srgb, var(--term-dim) 35%, transparent); }
.passos li:last-child { border-bottom: 0; }
.passos .cmdl { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.passos .pr { color: var(--term-prompt); }
.passos .cm { color: #ffffff; font-weight: 600; overflow-wrap: anywhere; }
.passos .ex { color: var(--term-dim); font-family: var(--f-body); font-size: .82rem; }
.btn-copiar { margin-left: auto; background: none; border: 1px solid color-mix(in srgb, var(--term-dim) 50%, transparent); color: var(--term-dim); border-radius: 6px; font-size: .7rem; padding: 2px 6px; cursor: pointer; font-family: var(--f-body); }
.term pre { margin: 0; padding: 12px; overflow-x: auto; white-space: pre; line-height: 1.45; }

.simreal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .simreal { grid-template-columns: 1fr; } }
.simreal > div { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.simreal .sim { background: var(--accent-soft); }
.simreal .real { background: var(--surface); border: 1px solid var(--line); }
.simreal ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .9rem; }

.video { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.video .play { width: 52px; height: 52px; border-radius: 12px; background: #d93025; display: grid; place-items: center; }
.video .play svg { width: 22px; height: 22px; color: #fff; }

.refs { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: .86rem; color: var(--muted); }
.refs li { overflow-wrap: anywhere; }

/* ------------------------------------------------------------ quiz */
.quiz-topo { display: grid; gap: 8px; }
.pergunta { font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
.opcoes { display: grid; gap: 10px; }
.opcao { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.opcao .letra { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: .85rem; }
.opcao.sel { border-color: var(--accent); }
.opcao.certa { border-color: var(--ok); background: var(--ok-soft); }
.opcao.errada { border-color: var(--bad); background: var(--bad-soft); }
.opcao:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.campo { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 1rem var(--f-body); }
.campo.mono { font-family: var(--f-mono); }
.campo:focus { border-color: var(--accent); outline: none; }

.resultado { text-align: center; display: grid; gap: 10px; justify-items: center; }
.resultado .grande { font-family: var(--f-display); font-stretch: 80%; font-size: 3.4rem; font-weight: 800; line-height: 1; }
.estrelas { display: flex; gap: 6px; }
.estrelas svg { width: 34px; height: 34px; }
.estrelas .on { color: var(--led-amb); }
.estrelas .off { color: var(--line); }
.temporizador { font-family: var(--f-mono); font-weight: 700; }

/* ------------------------------------------------------------ laboratório */
.lab-tarefas { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lab-tarefas li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: .9rem; }
.lab-tarefas .cx { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: #fff; margin-top: 2px; }
.lab-tarefas li.feita .cx { background: var(--ok); border-color: var(--ok); }
.lab-tarefas li.feita span { color: var(--muted); text-decoration: line-through; }
.lab-tarefas details { font-size: .8rem; color: var(--muted); }
.consola { height: 46vh; min-height: 260px; overflow-y: auto; padding: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
.consola .in { color: #ffffff; }
.consola .pr { color: var(--term-prompt); }
.consola .err { color: #ff9b9b; }
.entrada { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, var(--term-dim) 40%, transparent); }
.entrada label { color: var(--term-prompt); white-space: nowrap; }
.entrada input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: inherit; outline: none; padding: 6px 0; }
.teclas { display: flex; gap: 6px; padding: 8px 12px 12px; overflow-x: auto; }
.teclas button { flex: none; background: color-mix(in srgb, var(--term-bg) 70%, #ffffff); border: 0; color: var(--term-fg); border-radius: 8px; padding: 8px 12px; font: .8rem var(--f-mono); cursor: pointer; }

/* ------------------------------------------------------------ guia, ranking, perfil */
.abas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.abas button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--muted); }
.abas button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.peso { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.peso .barra { grid-column: 1 / -1; }
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ranking li { display: grid; grid-template-columns: 34px 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ranking li.eu { border-color: var(--accent); background: var(--accent-soft); }
.ranking .pos { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-align: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-family: var(--f-display); }
.medalhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.medalha { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .75rem; }
.medalha .m { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.medalha.ganha .m { background: var(--led-amb); color: #2a1c00; }
.medalha svg { width: 22px; height: 22px; }
.medalha:not(.ganha) { opacity: .6; }
.gloss dt { font-weight: 800; font-family: var(--f-display); font-stretch: 88%; }
.gloss dd { margin: 0 0 10px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.confirmar { border: 2px solid var(--bad); background: var(--bad-soft); }
textarea.campo { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; }
.vazio { text-align: center; padding: 24px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
