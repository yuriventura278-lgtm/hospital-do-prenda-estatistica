mpt":"SW1(config)#","cmd":"ip dhcp snooping vlan 10,20","explica":"Nas VLANs."},{"prompt":"SW1(config)#","cmd":"no ip dhcp snooping information option","explica":"Desliga a opção 82 se o servidor não a suportar."},{"prompt":"SW1(config)#","cmd":"interface g0/1","explica":"Uplink para o servidor/router."},{"prompt":"SW1(config-if)#","cmd":"ip dhcp snooping trust","explica":""},{"prompt":"SW1(config-if)#","cmd":"interface range fa0/1 - 24","explica":""},{"prompt":"SW1(config-if-range)#","cmd":"ip dhcp snooping limit rate 10","explica":"Limita pedidos (evita esgotar o pool)."},{"prompt":"SW1(config)#","cmd":"ip arp inspection vlan 10,20","explica":"DAI: valida ARP contra a tabela de snooping."},{"prompt":"SW1(config)#","cmd":"interface g0/1","explica":""},{"prompt":"SW1(config-if)#","cmd":"ip arp inspection trust","explica":""},{"prompt":"SW1#","cmd":"show ip dhcp snooping binding","explica":"Tabela IP–MAC–porta–VLAN."}],"nota":""},{"tipo":"cli","titulo":"Boas práticas em portas não usadas","passos":[{"prompt":"SW1(config)#","cmd":"interface range fa0/20 - 24","explica":""},{"prompt":"SW1(config-if-range)#","cmd":"switchport mode access","explica":"Nunca deixar em dynamic."},{"prompt":"SW1(config-if-range)#","cmd":"switchport access vlan 999","explica":"VLAN “parque” sem rota."},{"prompt":"SW1(config-if-range)#","cmd":"shutdown","explica":""}],"nota":""},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer suporta port security e DHCP snooping; o DAI tem suporte parcial.","Pode simular um servidor DHCP falso com outro servidor no separador Services."],"real":["Com DHCP snooping ativo e o uplink esquecido como untrusted, NINGUÉM recebe IP — configure o trust primeiro.","Port security 'sticky' + mudança de secretária de um colaborador = porta desligada. Documente o processo.","Em redes grandes prefira 802.1X/ISE a manter listas de MACs à mão."]},{"tipo":"video","titulo":"Port security e DHCP snooping","busca":"port security DHCP snooping dynamic ARP inspection CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual o modo de violação padrão do port security?","opcoes":["protect","restrict","shutdown","drop"],"correta":2,"explica":"shutdown → err-disabled."},{"tipo":"mc","p":"No DHCP snooping, as portas para o servidor DHCP legítimo devem ser…","opcoes":["untrusted","trusted","err-disabled","trunk obrigatoriamente"],"correta":1,"explica":"trusted."},{"tipo":"mc","p":"O DAI protege contra…","opcoes":["Servidores DHCP falsos","ARP spoofing","Loops STP","VLAN hopping"],"correta":1,"explica":"Valida mensagens ARP."},{"tipo":"cmd","p":"Que comando faz o switch aprender e gravar os MACs na porta?","respostas":["switchport port-security mac-address sticky"],"explica":"switchport port-security mac-address sticky."},{"tipo":"vf","p":"No modo restrict a porta fica em err-disabled.","correta":false,"explica":"restrict descarta e regista, mas a porta continua ativa."}],"referencias":["ieee8021x","odom2","netacad_srwe"]},{"id":"m8l4","titulo":"VPNs e IPsec","minutos":15,"nivel":"básico","objetivos":["Distinguir VPN site-to-site e acesso remoto","Conhecer os componentes do IPsec"],"blocos":[{"tipo":"topologia","nos":[{"id":"sede","tipo":"router","x":15,"y":50,"rotulo":"Sede"},{"id":"net","tipo":"nuvem","x":50,"y":50,"rotulo":"Internet"},{"id":"fil","tipo":"router","x":85,"y":50,"rotulo":"Filial"},{"id":"rem","tipo":"portatil","x":50,"y":90,"rotulo":"Teletrabalho"}],"ligacoes":[{"a":"sede","b":"net","rotulo":"túnel IPsec"},{"a":"net","b":"fil","rotulo":"túnel IPsec"},{"a":"rem","b":"net","rotulo":"VPN SSL/TLS"}],"legenda":"Site-to-site liga redes; acesso remoto liga um utilizador."},{"tipo":"tabela","titulo":"","cabecalho":["","Site-to-site","Acesso remoto"],"linhas":[["Liga","Rede ↔ rede","Utilizador ↔ rede"],["Cliente","Nenhum nos PCs (routers/firewalls fazem tudo)","Software (ex.: Cisco Secure Client) ou browser"],["Tecnologia","IPsec (IKEv2), GRE sobre IPsec, DMVPN","TLS/SSL ou IPsec"],["Sempre ligado","Sim","Quando o utilizador liga"]]},{"tipo":"texto","titulo":"IPsec em resumo","html":"<ul>\n<li><b>Confidencialidade</b>: cifra (AES).</li>\n<li><b>Integridade</b>: hash (SHA-2).</li>\n<li><b>Autenticação</b>: PSK ou certificados.</li>\n<li><b>Troca de chaves</b>: Diffie-Hellman, via <b>IKE</b> (UDP 500; 4500 com NAT-T).</li>\n<li>Protocolos: <b>ESP</b> (cifra + integridade, o habitual) e <b>AH</b> (só integridade, não funciona com NAT).</li>\n<li>Modos: <b>túnel</b> (novo cabeçalho IP — VPN site-to-site) e <b>transporte</b>.</li>\n</ul>\n<p><b>GRE</b> sozinho não cifra, mas transporta multicast (útil para OSPF) — por isso usa-se GRE sobre IPsec.</p>"},{"tipo":"dica","html":"Para o CCNA basta perceber os conceitos de VPN; a configuração completa de IPsec é tema do CCNP Security."},{"tipo":"video","titulo":"VPN IPsec explicada","busca":"VPN IPsec site to site remote access CCNA explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que protocolo IPsec cifra os dados?","opcoes":["AH","ESP","GRE","IKE"],"correta":1,"explica":"ESP. O AH só autentica."},{"tipo":"mc","p":"Que tipo de VPN liga a sede à filial de forma permanente?","opcoes":["Acesso remoto","Site-to-site","Clientless","SSL web"],"correta":1,"explica":"Site-to-site."},{"tipo":"vf","p":"Um túnel GRE sem IPsec cifra o tráfego.","correta":false,"explica":"GRE só encapsula."},{"tipo":"mc","p":"IKE usa a porta…","opcoes":["TCP 443","UDP 500","TCP 49","UDP 69"],"correta":1,"explica":"UDP 500 (e 4500 com NAT-T)."}],"referencias":["rfc4301","odom2","netacad_ensa"]}],"prova_extra":[{"tipo":"mc","p":"Uma ACL extended 'deny tcp any host 10.0.0.10 eq 80' sem mais linhas é aplicada. O que acontece ao resto do tráfego?","opcoes":["É permitido","É bloqueado pelo deny implícito","Só ICMP passa","Depende do sentido"],"correta":1,"explica":"Faltou 'permit ip any any'."},{"tipo":"mc","p":"Qual ferramenta impede que um utilizador ligue um router doméstico que distribua IPs na rede?","opcoes":["Port security","DHCP snooping","BPDU guard","CDP"],"correta":1,"explica":"Bloqueia DHCP Offers de portas untrusted."},{"tipo":"cmd","p":"Que comando de linha aplica a ACL 5 ao acesso vty?","respostas":["access-class 5 in"],"explica":"access-class 5 in."}]},{"id":"m9","numero":9,"titulo":"Automação e Programabilidade","descricao":"SDN, controladores, APIs REST, JSON, Python com Netmiko, Ansible e IA nas operações de rede.","dominio":"6.0 Automation and Programmability","icone":"codigo","licoes":[{"id":"m9l0","titulo":"Comece por aqui: deixar o computador fazer o trabalho repetitivo","minutos":10,"nivel":"básico","objetivos":["Perceber o que é automação de redes","Ver porque Python é útil para técnicos de redes"],"blocos":[{"tipo":"texto","titulo":"100 switches, a mesma alteração","html":"<p>Imagine que tem de mudar o servidor de horas (NTP) em 100 switches. À mão: entrar em cada um, escrever os comandos, guardar — um dia inteiro e com risco de erro. Com <b>automação</b>, um pequeno programa faz o mesmo em minutos, sempre igual.</p>"},{"tipo":"exemplo","titulo":"Um programa Python de 6 linhas","html":"<pre><code>switches = [\"10.0.0.11\", \"10.0.0.12\", \"10.0.0.13\"]\nfor ip in switches:\n    print(\"A configurar\", ip)\n    # ligar por SSH e enviar: ntp server 10.0.0.100\nprint(\"Concluído!\")</code></pre>\n<p>No módulo vai ver a versão completa com a biblioteca <b>Netmiko</b>, e também APIs, JSON e controladores.</p>"},{"tipo":"dica","html":"Não precisa de ser programador para o CCNA: basta perceber os conceitos e ler exemplos simples."},{"tipo":"video","titulo":"Automação de redes para iniciantes","busca":"automação de redes Python iniciantes","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a principal vantagem da automação?","opcoes":["Gastar mais cabos","Fazer tarefas repetitivas de forma rápida e consistente","Desligar a firewall","Eliminar o IP"],"correta":1,"explica":"Rapidez e consistência."},{"tipo":"vf","p":"Python é muito usado na automação de redes.","correta":true,"explica":"Com bibliotecas como Netmiko e Nornir."},{"tipo":"mc","p":"Com automação, uma alteração em 100 switches…","opcoes":["É impossível","Pode ser feita por um script em minutos","Exige trocar os switches","Só funciona com Wi-Fi"],"correta":1,"explica":"Um script repete a tarefa em todos."}],"referencias":["edelman","cisco_devnet"]},{"id":"m9l1","titulo":"SDN e controladores","minutos":15,"nivel":"básico","objetivos":["Separar plano de controlo, de dados e de gestão","Explicar APIs northbound e southbound","Conhecer Catalyst Center e SD-Access"],"blocos":[{"tipo":"figura","nome":"sdn","legenda":"Arquitetura SDN: aplicações por cima (northbound API), controlador ao centro, equipamentos por baixo (southbound API)."},{"tipo":"tabela","titulo":"Os três planos","cabecalho":["Plano","Função","Exemplos"],"linhas":[["Dados (data/forwarding)","Encaminhar tramas e pacotes","Comutação, NAT, ACLs a filtrar"],["Controlo","Decidir como encaminhar","OSPF, STP, ARP, tabela MAC"],["Gestão","Administrar o equipamento","SSH, SNMP, Syslog"]]},{"tipo":"texto","titulo":"Tradicional × controlador","html":"<p>Na rede tradicional, cada equipamento tem o seu plano de controlo e é configurado um a um (CLI). Na <b>SDN</b> o <b>controlador</b> centraliza parte do controlo e a configuração: define-se a <b>intenção</b> (“convidados não acedem a servidores”) e ele aplica-a em todos os equipamentos.</p>\n<ul>\n<li><b>Northbound API</b>: entre aplicações/scripts e o controlador — normalmente <b>REST</b> com JSON.</li>\n<li><b>Southbound API</b>: entre controlador e equipamentos — NETCONF, RESTCONF, OpenFlow, SSH/CLI, SNMP.</li>\n<li><b>Underlay</b>: a rede física. <b>Overlay</b>: túneis lógicos por cima (VXLAN no SD-Access). <b>Fabric</b>: o conjunto.</li>\n</ul>\n<p>Na Cisco: <b>Catalyst Center</b> (antigo DNA Center) para campus com <b>SD-Access</b>, e <b>SD-WAN</b> (Catalyst SD-WAN) para WAN.</p>"},{"tipo":"tabela","titulo":"","cabecalho":["","Gestão tradicional","Catalyst Center"],"linhas":[["Configuração","Equipamento a equipamento, CLI","Central, por políticas e modelos"],["Visibilidade","show/SNMP isolados","Telemetria e saúde de toda a rede"],["Alterações","Manuais, propensas a erro","Automatizadas e consistentes"],["Resolução de problemas","Reativa","Assistida (garantia/analytics)"]]},{"tipo":"video","titulo":"SDN e Catalyst Center","busca":"SDN controller based networking CCNA northbound southbound","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"OSPF pertence a que plano?","opcoes":["Dados","Controlo","Gestão","Aplicação"],"correta":1,"explica":"Protocolos de encaminhamento decidem o caminho: controlo."},{"tipo":"mc","p":"A API entre um script Python e o controlador é…","opcoes":["Southbound","Northbound","Eastbound","Underlay"],"correta":1,"explica":"Northbound."},{"tipo":"vf","p":"SSH para gerir um router faz parte do plano de gestão.","correta":true,"explica":"Gestão."},{"tipo":"mc","p":"Que tecnologia de overlay usa o SD-Access?","opcoes":["GRE","VXLAN","MPLS","PPP"],"correta":1,"explica":"VXLAN (com LISP no plano de controlo)."}],"referencias":["odom2","edelman","cisco_devnet"]},{"id":"m9l2","titulo":"APIs REST e JSON","minutos":18,"nivel":"intermédio","objetivos":["Usar verbos HTTP e códigos de resposta","Ler e escrever JSON","Fazer um pedido REST em Python"],"blocos":[{"tipo":"tabela","titulo":"","cabecalho":["Verbo HTTP","CRUD","Exemplo"],"linhas":[["GET","Read","Listar equipamentos"],["POST","Create","Criar uma VLAN"],["PUT / PATCH","Update","Substituir / alterar parte"],["DELETE","Delete","Apagar"]]},{"tipo":"tabela","titulo":"Códigos HTTP","cabecalho":["Código","Significado"],"linhas":[["200 OK","Sucesso"],["201 Created","Recurso criado"],["204 No Content","Sucesso sem corpo"],["400 Bad Request","Pedido mal formado"],["401 Unauthorized","Falta autenticação"],["403 Forbidden","Sem permissão"],["404 Not Found","Recurso não existe"],["500 Internal Server Error","Erro no servidor"]]},{"tipo":"exemplo","titulo":"JSON","html":"<pre><code>{\n  \"hostname\": \"R1\",\n  \"interfaces\": [\n    {\"nome\": \"GigabitEthernet0/0\", \"ip\": \"192.168.1.1\", \"ativa\": true},\n    {\"nome\": \"GigabitEthernet0/1\", \"ip\": null, \"ativa\": false}\n  ],\n  \"ospf\": {\"processo\": 1, \"area\": 0}\n}</code></pre>\n<p>Tipos: <b>objeto</b> <code>{}</code> com pares chave:valor, <b>array</b> <code>[]</code>, string entre aspas duplas, número, <code>true</code>/<code>false</code> e <code>null</code>.</p>"},{"tipo":"exemplo","titulo":"Pedido REST em Python (requests)","html":"<pre><code>import requests\n\nurl = \"https://controlador.exemplo/api/v1/network-device\"\ncabecalhos = {\"X-Auth-Token\": TOKEN, \"Accept\": \"application/json\"}\n\nresposta = requests.get(url, headers=cabecalhos, timeout=10)\nresposta.raise_for_status()          # erro se não for 2xx\n\nfor equipamento in resposta.json()[\"response\"]:\n    print(equipamento[\"hostname\"], equipamento[\"managementIpAddress\"])</code></pre>"},{"tipo":"texto","titulo":"Características REST","html":"<ul>\n<li><b>Cliente-servidor</b>, <b>sem estado</b> (cada pedido traz tudo o que é preciso, incluindo o token), cacheável, interface uniforme baseada em URIs.</li>\n<li>Autenticação comum: Basic, tokens (Bearer), chaves de API, OAuth.</li>\n</ul>"},{"tipo":"video","titulo":"REST API e JSON para CCNA","busca":"REST API JSON CCNA automação explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que verbo HTTP corresponde a 'Create'?","opcoes":["GET","POST","PUT","DELETE"],"correta":1,"explica":"POST cria."},{"tipo":"mc","p":"Que código indica falta de autenticação?","opcoes":["200","401","404","500"],"correta":1,"explica":"401 Unauthorized."},{"tipo":"mc","p":"Qual destes é JSON válido?","opcoes":["{'a': 1}","{\"a\": 1}","{a = 1}","<a>1</a>"],"correta":1,"explica":"Chaves e strings sempre com aspas duplas."},{"tipo":"vf","p":"As APIs REST são sem estado (stateless).","correta":true,"explica":"O servidor não guarda contexto entre pedidos."}],"referencias":["rfc8259","edelman","cisco_devnet","odom2"]},{"id":"m9l3","titulo":"Python, Ansible, Terraform e IA","minutos":22,"nivel":"intermédio","objetivos":["Automatizar configurações com Python e Netmiko","Comparar Ansible, Terraform, Puppet e Chef","Conhecer NETCONF/RESTCONF e YANG","Perceber o papel da IA nas operações de rede"],"blocos":[{"tipo":"exemplo","titulo":"Backup de vários routers com Netmiko","html":"<pre><code>from netmiko import ConnectHandler\nfrom datetime import date\n\nrouters = [\"10.0.0.1\", \"10.0.0.2\", \"10.0.0.3\"]\n\nfor ip in routers:\n    equipamento = {\n        \"device_type\": \"cisco_ios\",\n        \"host\": ip,\n        \"username\": \"admin\",\n        \"password\": SENHA,          # leia de variável de ambiente, nunca no código\n    }\n    with ConnectHandler(**equipamento) as ligacao:\n        config = ligacao.send_command(\"show running-config\")\n        with open(f\"backup_{ip}_{date.today()}.txt\", \"w\") as f:\n            f.write(config)\n    print(f\"{ip}: backup feito\")</code></pre>"},{"tipo":"exemplo","titulo":"Criar VLANs em todos os switches","html":"<pre><code>vlans = {10: \"VENDAS\", 20: \"TI\", 30: \"VOZ\"}\ncomandos = []\nfor numero, nome in vlans.items():\n    comandos += [f\"vlan {numero}\", f\"name {nome}\"]\n\nwith ConnectHandler(**switch) as ligacao:\n    print(ligacao.send_config_set(comandos))\n    ligacao.save_config()</code></pre>"},{"tipo":"tabela","titulo":"Gestão de configuração","cabecalho":["Ferramenta","Modelo","Agente","Linguagem"],"linhas":[["Ansible","Push","Sem agente (SSH/NETCONF)","YAML (playbooks)"],["Terraform","Declarativo (infra como código)","Sem agente (APIs)","HCL"],["Puppet","Pull","Com agente","Manifests (DSL)"],["Chef","Pull","Com agente","Recipes/Cookbooks (Ruby)"]]},{"tipo":"exemplo","titulo":"Playbook Ansible","html":"<pre><code>- name: Configurar NTP nos routers\n  hosts: routers\n  gather_facts: no\n  tasks:\n    - name: Servidor NTP\n      cisco.ios.ios_config:\n        lines:\n          - ntp server 10.0.0.100</code></pre>"},{"tipo":"texto","titulo":"Modelos de dados","html":"<p><b>YANG</b> é a linguagem que descreve <i>o que</i> se pode configurar num equipamento (modelo). <b>NETCONF</b> (SSH, porta 830, XML) e <b>RESTCONF</b> (HTTPS, JSON ou XML) são os protocolos que leem/escrevem dados segundo esses modelos — mais fiáveis do que analisar texto da CLI.</p>"},{"tipo":"texto","titulo":"IA e machine learning nas operações de rede","html":"<p>O tópico 6.x do exame v1.1 inclui IA: <b>IA generativa</b> (assistentes que explicam saídas e geram configurações — revê sempre antes de aplicar!), <b>IA preditiva</b> e <b>machine learning</b> (deteção de anomalias, previsão de falhas e de capacidade a partir da telemetria).</p>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["O Packet Tracer tem um modo de programação Python limitado e suporte a algumas APIs do controlador simulado.","Use os sandboxes gratuitos do Cisco DevNet para experimentar APIs reais."],"real":["Teste sempre os scripts primeiro num laboratório (CML/EVE-NG) e depois num equipamento pouco crítico.","Guarde credenciais num cofre/variáveis de ambiente, nunca no repositório.","Use controlo de versões (Git) para scripts, playbooks e backups de configuração."]},{"tipo":"video","titulo":"Automação de redes com Python","busca":"Python Netmiko automação de redes Cisco tutorial","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual destas ferramentas não precisa de agente nos equipamentos?","opcoes":["Puppet","Chef","Ansible","Todas precisam"],"correta":2,"explica":"Ansible usa SSH/APIs."},{"tipo":"mc","p":"Em que formato se escrevem os playbooks Ansible?","opcoes":["JSON","YAML","XML","Ruby"],"correta":1,"explica":"YAML."},{"tipo":"mc","p":"Que porta usa o NETCONF sobre SSH?","opcoes":["22","443","830","8080"],"correta":2,"explica":"830."},{"tipo":"vf","p":"YANG é um protocolo de transporte como o HTTP.","correta":false,"explica":"YANG é uma linguagem de modelação de dados."},{"tipo":"mc","p":"No Netmiko, que método envia uma lista de comandos de configuração?","opcoes":["send_command","send_config_set","push_config","configure"],"correta":1,"explica":"send_config_set."}],"referencias":["netmiko","ansible","rfc6241","rfc8040","edelman"]}],"prova_extra":[{"tipo":"mc","p":"Um script recebe 404 ao chamar a API. Significa…","opcoes":["Sem autenticação","Recurso/URL inexistente","Erro do servidor","Sucesso sem conteúdo"],"correta":1,"explica":"404 Not Found."},{"tipo":"mc","p":"Qual protocolo southbound usa HTTPS e JSON?","opcoes":["NETCONF","RESTCONF","OpenFlow","SNMP"],"correta":1,"explica":"RESTCONF."},{"tipo":"vf","p":"Num controlador SDN, a northbound API normalmente é REST.","correta":true,"explica":"Aplicações falam com o controlador por REST."}]}],"labs":[{"id":"lab1","titulo":"Primeiro contacto com o IOS","modulo":"m4","dispositivo":"router","hostname":"Router","descricao":"Navegue entre os modos, dê nome ao router e guarde a configuração.","tarefas":[{"desc":"Entre no modo privilegiado e depois na configuração global","dica":"enable → configure terminal","check":{"t":"mode","v":"config"}},{"desc":"Dê o nome R1 ao router","dica":"hostname R1","check":{"t":"hostname","v":"R1"}},{"desc":"Desative a pesquisa DNS de comandos errados","dica":"no ip domain-lookup","check":{"t":"no_domain_lookup"}},{"desc":"Volte ao modo privilegiado e guarde a configuração","dica":"end → copy running-config startup-config","check":{"t":"saved"}}],"nivel":"básico","cenario":"Chegou um router novo para a Padaria Central. Antes de o instalar, ligue-se pela consola, dê-lhe um nome e guarde a configuração."},{"id":"lab2","titulo":"Configuração base segura","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Proteja o router como faria no primeiro dia de trabalho.","tarefas":[{"desc":"Palavra-passe do modo privilegiado com hash","dica":"enable secret <senha>","check":{"t":"enable_secret"}},{"desc":"Palavra-passe e login na consola","dica":"line console 0 → password <senha> → login","check":{"t":"line_login","line":"con"}},{"desc":"Cifre as palavras-passe em texto simples","dica":"service password-encryption","check":{"t":"pwd_enc"}},{"desc":"Configure um banner MOTD","dica":"banner motd #Acesso restrito#","check":{"t":"banner"}},{"desc":"Guarde a configuração","dica":"copy running-config startup-config","check":{"t":"saved"}}],"nivel":"básico","cenario":"A auditoria da Clínica Boa Saúde detetou que o router não tem palavras-passe. Corrija antes da próxima visita do auditor."},{"id":"lab3","titulo":"Acesso remoto por SSH","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Ative SSH versão 2 com utilizador local e bloqueie o Telnet.","tarefas":[{"desc":"Defina o domínio empresa.local","dica":"ip domain-name empresa.local","check":{"t":"domain"}},{"desc":"Crie o utilizador admin com secret","dica":"username admin secret <senha>","check":{"t":"user","v":"admin"}},{"desc":"Gere as chaves RSA de 2048 bits","dica":"crypto key generate rsa modulus 2048","check":{"t":"rsa"}},{"desc":"Nas linhas vty use utilizadores locais","dica":"line vty 0 4 → login local","check":{"t":"line_login","line":"vty","local":true}},{"desc":"Permita apenas SSH nas vty","dica":"transport input ssh","check":{"t":"vty_ssh"}}],"nivel":"intermédio","cenario":"O técnico da empresa trabalha à distância e precisa de gerir o router com segurança. O Telnet foi proibido pela política de segurança."},{"id":"lab4","titulo":"Interfaces do router","modulo":"m4","dispositivo":"router","hostname":"R1","descricao":"Ponha as interfaces LAN e WAN a funcionar.","tarefas":[{"desc":"G0/0: 192.168.1.1/24","dica":"interface g0/0 → ip address 192.168.1.1 255.255.255.0","check":{"t":"iface_ip","if":"GigabitEthernet0/0","ip":"192.168.1.1","mask":"255.255.255.0"}},{"desc":"Descreva G0/0 como LAN","dica":"description LAN","check":{"t":"iface_desc","if":"GigabitEthernet0/0"}},{"desc":"Ative G0/0","dica":"no shutdown","check":{"t":"iface_up","if":"GigabitEthernet0/0"}},{"desc":"G0/1: 10.0.12.1/30 e ativa","dica":"interface g0/1 → ip address 10.0.12.1 255.255.255.252 → no shutdown","check":{"t":"iface_ip","if":"GigabitEthernet0/1","ip":"10.0.12.1","mask":"255.255.255.252","up":true}},{"desc":"Verifique com show ip interface brief","dica":"do show ip interface brief","check":{"t":"ran","v":"show ip interface brief"}}],"nivel":"básico","cenario":"Vai ligar o router de uma escola: a G0/0 serve a rede dos professores e a G0/1 liga ao router do operador."},{"id":"lab5","titulo":"VLANs e portas de acesso","modulo":"m5","dispositivo":"switch","hostname":"SW1","descricao":"Crie as VLANs da empresa e coloque as portas certas em cada uma.","tarefas":[{"desc":"Crie a VLAN 10 com o nome VENDAS","dica":"vlan 10 → name VENDAS","check":{"t":"vlan","id":10,"name":"VENDAS"}},{"desc":"Crie a VLAN 20 com o nome TI","dica":"vlan 20 → name TI","check":{"t":"vlan","id":20,"name":"TI"}},{"desc":"Fa0/1 em modo access na VLAN 10","dica":"interface fa0/1 → switchport mode access → switchport access vlan 10","check":{"t":"access_vlan","if":"FastEthernet0/1","vlan":10}},{"desc":"Fa0/2 em modo access na VLAN 20","dica":"interface fa0/2 → switchport mode access → switchport access vlan 20","check":{"t":"access_vlan","if":"FastEthernet0/2","vlan":20}},{"desc":"Confirme com show vlan brief","dica":"do show vlan brief","check":{"t":"ran","v":"show vlan brief"}}],"nivel":"intermédio","cenario":"O escritório da Imobiliária Horizonte quer separar os computadores de Vendas e de TI no mesmo switch."},{"id":"lab6","titulo":"Trunk 802.1Q","modulo":"m5","dispositivo":"switch","hostname":"SW1","descricao":"Ligue este switch ao SW2 por um trunk seguro.","tarefas":[{"desc":"Crie a VLAN 99 (NATIVA)","dica":"vlan 99 → name NATIVA","check":{"t":"vlan","id":99,"name":"NATIVA"}},{"desc":"G0/1 em modo trunk","dica":"interface g0/1 → switchport mode trunk","check":{"t":"trunk","if":"GigabitEthernet0/1"}},{"desc":"VLAN nativa 99 em G0/1","dica":"switchport trunk native vlan 99","check":{"t":"native","if":"GigabitEthernet0/1","vlan":99}},{"desc":"Desative o DTP em G0/1","dica":"switchport nonegotiate","check":{"t":"nonegotiate","if":"GigabitEthernet0/1"}},{"desc":"Verifique com show interfaces trunk","dica":"do show interfaces trunk","check":{"t":"ran","v":"show interfaces trunk"}}],"nivel":"intermédio","cenario":"A imobiliária comprou um segundo switch para o primeiro andar. Ligue-os de forma que as VLANs passem entre os dois."},{"id":"lab7","titulo":"Router-on-a-stick","modulo":"m5","dispositivo":"router","hostname":"R1","descricao":"Encaminhe entre as VLANs 10 e 20 por uma só interface.","tarefas":[{"desc":"Ative a interface física G0/0","dica":"interface g0/0 → no shutdown","check":{"t":"iface_up","if":"GigabitEthernet0/0"}},{"desc":"Subinterface G0/0.10: VLAN 10, 192.168.10.1/24","dica":"interface g0/0.10 → encapsulation dot1Q 10 → ip address 192.168.10.1 255.255.255.0","check":{"t":"subif","if":"GigabitEthernet0/0.10","vlan":10,"ip":"192.168.10.1"}},{"desc":"Subinterface G0/0.20: VLAN 20, 192.168.20.1/24","dica":"interface g0/0.20 → encapsulation dot1Q 20 → ip address 192.168.20.1 255.255.255.0","check":{"t":"subif","if":"GigabitEthernet0/0.20","vlan":20,"ip":"192.168.20.1"}}],"nivel":"intermédio","cenario":"As VLANs de Vendas e TI precisam de partilhar a impressora e o servidor, mas só existe um router com uma porta livre."},{"id":"lab8","titulo":"Rotas estáticas","modulo":"m6","dispositivo":"router","hostname":"R1","descricao":"R1 liga à LAN 192.168.2.0/24 através de R2 (10.0.12.2) e à Internet via 203.0.113.1.","tarefas":[{"desc":"G0/1 com 10.0.12.1/30 e ativa","dica":"interface g0/1 → ip address 10.0.12.1 255.255.255.252 → no shutdown","check":{"t":"iface_ip","if":"GigabitEthernet0/1","ip":"10.0.12.1","mask":"255.255.255.252","up":true}},{"desc":"Rota para 192.168.2.0/24 via 10.0.12.2","dica":"ip route 192.168.2.0 255.255.255.0 10.0.12.2","check":{"t":"route","net":"192.168.2.0","mask":"255.255.255.0","via":"10.0.12.2"}},{"desc":"Rota por defeito via 203.0.113.1","dica":"ip route 0.0.0.0 0.0.0.0 203.0.113.1","check":{"t":"route","net":"0.0.0.0","mask":"0.0.0.0","via":"203.0.113.1"}},{"desc":"Veja a tabela de encaminhamento","dica":"do show ip route","check":{"t":"ran","v":"show ip route"}}],"nivel":"intermédio","cenario":"A rede de farmácias abriu uma filial. R1 (sede) tem de chegar à LAN da filial através de R2 e à Internet pelo operador."},{"id":"lab9","titulo":"OSPF de área única","modulo":"m6","dispositivo":"router","hostname":"R1","descricao":"Ative OSPF na área 0 com router ID manual e LAN passiva.","tarefas":[{"desc":"Inicie o processo OSPF 1","dica":"router ospf 1","check":{"t":"ospf"}},{"desc":"Router ID 1.1.1.1","dica":"router-id 1.1.1.1","check":{"t":"ospf_rid","v":"1.1.1.1"}},{"desc":"Anuncie 10.0.12.0/30 na área 0","dica":"network 10.0.12.0 0.0.0.3 area 0","check":{"t":"ospf_net","net":"10.0.12.0","wc":"0.0.0.3","area":"0"}},{"desc":"Anuncie 192.168.1.0/24 na área 0","dica":"network 192.168.1.0 0.0.0.255 area 0","check":{"t":"ospf_net","net":"192.168.1.0","wc":"0.0.0.255","area":"0"}},{"desc":"G0/0 (LAN) passiva","dica":"passive-interface g0/0","check":{"t":"passive","if":"GigabitEthernet0/0"}}],"nivel":"avançado","cenario":"Com 10 filiais, as rotas estáticas tornaram-se difíceis de manter. Ative OSPF na sede."},{"id":"lab10","titulo":"Servidor DHCP no router","modulo":"m7","dispositivo":"router","hostname":"R1","descricao":"Distribua endereços na LAN 192.168.1.0/24.","tarefas":[{"desc":"Exclua 192.168.1.1 a 192.168.1.10","dica":"ip dhcp excluded-address 192.168.1.1 192.168.1.10","check":{"t":"dhcp_excl"}},{"desc":"Crie o pool LAN com a rede 192.168.1.0/24","dica":"ip dhcp pool LAN → network 192.168.1.0 255.255.255.0","check":{"t":"dhcp_pool","name":"LAN","net":"192.168.1.0"}},{"desc":"Gateway 192.168.1.1 no pool","dica":"default-router 192.168.1.1","check":{"t":"dhcp_gw","name":"LAN","v":"192.168.1.1"}},{"desc":"DNS 8.8.8.8 no pool","dica":"dns-server 8.8.8.8","check":{"t":"dhcp_dns","name":"LAN"}}],"nivel":"intermédio","cenario":"A cafetaria não tem servidor. O próprio router vai distribuir IPs aos computadores e ao Wi-Fi."},{"id":"lab11","titulo":"PAT para a Internet","modulo":"m7","dispositivo":"router","hostname":"R1","descricao":"Toda a LAN 192.168.1.0/24 sai para a Internet com o IP de G0/1.","tarefas":[{"desc":"ACL 1 a permitir 192.168.1.0/24","dica":"access-list 1 permit 192.168.1.0 0.0.0.255","check":{"t":"acl_std","n":1}},{"desc":"G0/0 como ip nat inside","dica":"interface g0/0 → ip nat inside","check":{"t":"nat_inside","if":"GigabitEthernet0/0"}},{"desc":"G0/1 como ip nat outside","dica":"interface g0/1 → ip nat outside","check":{"t":"nat_outside","if":"GigabitEthernet0/1"}},{"desc":"Ative o PAT com a interface G0/1","dica":"ip nat inside source list 1 interface g0/1 overload","check":{"t":"nat_overload"}}],"nivel":"intermédio","cenario":"O operador deu à loja um único IP público. Todos os computadores têm de sair para a Internet por ele."},{"id":"lab12","titulo":"Port security","modulo":"m8","dispositivo":"switch","hostname":"SW1","descricao":"Proteja a porta Fa0/5 de um posto de trabalho com PC e telefone IP.","tarefas":[{"desc":"Fa0/5 em modo access","dica":"interface fa0/5 → switchport mode access","check":{"t":"access_mode","if":"FastEthernet0/5"}},{"desc":"Ative port security","dica":"switchport port-security","check":{"t":"portsec","if":"FastEthernet0/5"}},{"desc":"Máximo de 2 MACs","dica":"switchport port-security maximum 2","check":{"t":"portsec_max","if":"FastEthernet0/5","v":2}},{"desc":"Aprenda os MACs com sticky","dica":"switchport port-security mac-address sticky","check":{"t":"portsec_sticky","if":"FastEthernet0/5"}}],"nivel":"intermédio","cenario":"No balcão de atendimento de um banco, cada posto tem um PC e um telefone IP. Ninguém pode ligar outro equipamento à tomada."}],"casos":[{"id":"c01","titulo":"Primeiro dia no bastidor","modulo":"m1","local":"Escritório de advogados","papel":"Técnico estagiário","historia":"<p>É o seu primeiro dia numa empresa de suporte. O chefe leva-o ao bastidor (rack) de um escritório de advogados e pergunta: <i>“Sabes dizer o que é cada coisa?”</i> Vê uma caixa com 24 portas e muitos cabos azuis, uma caixa com poucas portas ligada à fibra do operador e uma antena no teto do corredor.</p>","etapas":[{"tipo":"mc","p":"A caixa com 24 portas onde ligam os PCs é…","opcoes":["Um router","Um switch","Um access point","Um servidor"],"correta":1,"explica":"Muitas portas para ligar os equipamentos do local: switch."},{"tipo":"mc","p":"A caixa ligada à fibra do operador, que dá acesso à Internet, é…","opcoes":["Um switch","Um router","Um hub","Uma impressora"],"correta":1,"explica":"Liga a rede local à rede do operador: router."},{"tipo":"mc","p":"A antena no teto do corredor é…","opcoes":["Um access point (Wi-Fi)","Um firewall","Um switch L3","Um modem de fax"],"correta":0,"explica":"Cria a rede sem fios."},{"tipo":"mc","p":"Um advogado tem de ligar o portátil numa sala a 130 m do bastidor. O que recomenda?","opcoes":["Cabo UTP de 130 m","Um switch a meio caminho ou fibra","Cabo de consola","Nada, chega"],"correta":1,"explica":"O UTP só garante 100 m."}],"desfecho":"O chefe ficou impressionado. Saber reconhecer os equipamentos é o primeiro passo de qualquer técnico.","topologia":null,"nivel":"básico"},{"id":"c02","titulo":"A impressora da receção","modulo":"m3","local":"Clínica Boa Saúde","papel":"Técnico de suporte","historia":"<p>A rececionista liga: <i>“O computador da receção não imprime nem abre o sistema de marcações. Os outros computadores estão bem.”</i> No PC da receção, o comando <code>ipconfig</code> mostra:</p>\n<pre><code>Endereço IPv4 . . . : 169.254.83.12\nMáscara de sub-rede : 255.255.0.0\nGateway predefinido :</code></pre>\n<p>Os outros PCs têm endereços 192.168.10.x com gateway 192.168.10.1.</p>","etapas":[{"tipo":"mc","p":"O que indica o endereço 169.254.83.12?","opcoes":["Um IP público","O PC não recebeu IP do servidor DHCP (APIPA)","Um IP de loopback","Um endereço IPv6"],"correta":1,"explica":"169.254.x.x é atribuído pelo próprio PC quando o DHCP não responde."},{"tipo":"mc","p":"Qual a primeira verificação a fazer?","opcoes":["Reinstalar o Windows","Ver se o cabo de rede está ligado e a luz da porta acesa","Trocar a impressora","Desligar o servidor"],"correta":1,"explica":"Começar pela camada física: cabo e porta."},{"tipo":"mc","p":"O cabo estava solto. Depois de o ligar, que comando faz o Windows pedir novo IP?","opcoes":["ipconfig /renew","ping /dhcp","tracert","netstat"],"correta":0,"explica":"ipconfig /release seguido de ipconfig /renew."},{"tipo":"vf","p":"Depois de receber 192.168.10.x com gateway 192.168.10.1, o PC deve voltar a imprimir.","correta":true,"explica":"Fica na mesma rede que a impressora e o servidor."}],"desfecho":"Problema resolvido em 5 minutos: cabo solto → sem DHCP → APIPA. Este padrão repete-se muito no suporte.","topologia":null,"nivel":"básico"},{"id":"c03","titulo":"A nova sala de informática","modulo":"m3","local":"Escola Secundária","papel":"Técnico da escola","historia":"<p>A escola recebeu a rede <code>192.168.20.0/24</code> para a área pedagógica e vai abrir salas novas. A direção pede: <b>Sala A com 50 PCs</b>, <b>Sala B com 25 PCs</b> e <b>uma rede para 10 impressoras e projetores</b>. Cada rede precisa de um endereço para o gateway.</p>","etapas":[{"tipo":"mc","p":"Que prefixo usa para a Sala A (50 PCs + gateway)?","opcoes":["/25","/26","/27","/28"],"correta":1,"explica":"/26 dá 62 hosts úteis; /27 só 30."},{"tipo":"mc","p":"Começando em 192.168.20.0, qual é a rede da Sala A?","opcoes":["192.168.20.0/26","192.168.20.64/26","192.168.20.0/25","192.168.20.128/26"],"correta":0,"explica":"Maior rede primeiro, a partir do início do bloco."},{"tipo":"mc","p":"Qual a rede seguinte, para a Sala B (25 PCs)?","opcoes":["192.168.20.64/27","192.168.20.64/26","192.168.20.32/27","192.168.20.96/28"],"correta":0,"explica":"A seguir a .0/26 vem .64; /27 dá 30 hosts."},{"tipo":"mc","p":"Para as 10 impressoras/projetores, qual a rede mais económica a seguir?","opcoes":["192.168.20.96/28","192.168.20.96/27","192.168.20.100/28","192.168.20.128/25"],"correta":0,"explica":"/28 = 14 hosts, começa em .96."}],"desfecho":"Plano VLSM feito sem desperdiçar endereços e com espaço livre (192.168.20.112 a .255) para crescer.","topologia":null,"nivel":"intermédio"},{"id":"c04","titulo":"Internet lenta no escritório de contabilidade","modulo":"m4","local":"Gabinete de contabilidade","papel":"Técnico de redes","historia":"<p>Desde que mudaram o switch, o servidor de ficheiros está muito lento. No router/switch, <code>show interfaces g0/1</code> (porta do servidor) mostra milhares de <b>late collisions</b> e <b>CRC</b> a subir. A porta está a <b>100 Mbit/s half-duplex</b>; o servidor está configurado fixo em <b>100 Mbit/s full-duplex</b>.</p>","etapas":[{"tipo":"mc","p":"Qual é o problema mais provável?","opcoes":["Falta de memória no servidor","Duplex mismatch","Vírus","DNS errado"],"correta":1,"explica":"Um lado half e outro full = colisões tardias."},{"tipo":"mc","p":"Qual a melhor solução?","opcoes":["Pôr os dois lados em auto (ou ambos fixos iguais)","Trocar o servidor","Desligar o STP","Mudar a VLAN"],"correta":0,"explica":"As duas pontas devem coincidir; auto/auto é o recomendado."},{"tipo":"cmd","p":"Que comando de interface põe o duplex em automático?","respostas":["duplex auto"],"explica":"duplex auto (e speed auto)."},{"tipo":"vf","p":"Depois de corrigir, deve limpar os contadores e confirmar que os erros deixaram de subir.","correta":true,"explica":"clear counters e observar com show interfaces."}],"desfecho":"Com duplex certo, as transferências passaram de 2 MB/s para mais de 11 MB/s.","topologia":null,"nivel":"básico"},{"id":"c05","titulo":"Loop no armazém","modulo":"m5","local":"Armazém de distribuição","papel":"Técnico de serviço","historia":"<p>Às 10h a rede do armazém inteiro parou. Os LEDs de todas as portas piscam ao mesmo tempo e o CPU do switch está a 100%. Descobre-se que um funcionário ligou um pequeno switch de secretária com <b>dois cabos</b> à mesma tomada de parede dupla, ligada a duas portas do switch principal.</p>","etapas":[{"tipo":"mc","p":"O que aconteceu?","opcoes":["Um loop de camada 2 com tempestade de broadcast","Falta de IP","Ataque de phishing","Cabo de fibra partido"],"correta":0,"explica":"Dois caminhos entre switches sem STP a bloquear = loop."},{"tipo":"mc","p":"Qual a ação imediata para repor o serviço?","opcoes":["Desligar um dos cabos do switch de secretária","Reiniciar todos os PCs","Mudar o DNS","Trocar o router"],"correta":0,"explica":"Quebrar o loop fisicamente."},{"tipo":"mc","p":"Que funcionalidade evita isto no futuro nas portas de utilizador?","opcoes":["BPDU Guard (com PortFast)","NAT","DHCP","HSRP"],"correta":0,"explica":"Se chegar uma BPDU, a porta vai para err-disabled."},{"tipo":"cmd","p":"Escreva o comando de interface que ativa o BPDU Guard.","respostas":["spanning-tree bpduguard enable"],"explica":"spanning-tree bpduguard enable."}],"desfecho":"Rede reposta e protegida: agora, se alguém repetir o erro, só aquela porta é desligada.","topologia":null,"nivel":"intermédio"},{"id":"c06","titulo":"Wi-Fi para os hóspedes","modulo":"m5","local":"Hotel Miradouro","papel":"Técnico de redes","historia":"<p>O hotel quer oferecer Wi-Fi aos hóspedes, mas os computadores da receção e o sistema de reservas estão na mesma rede que o Wi-Fi atual, com a palavra-passe colada na parede. Pede-se uma solução segura.</p>","etapas":[{"tipo":"mc","p":"Qual o primeiro passo de desenho?","opcoes":["Uma VLAN separada para hóspedes","Desligar o Wi-Fi","Usar a VLAN 1 para tudo","Dar IP público a cada hóspede"],"correta":0,"explica":"Separar o tráfego de hóspedes do tráfego interno."},{"tipo":"mc","p":"Que segurança deve ter a rede interna da receção?","opcoes":["WEP","Aberta","WPA3 (ou WPA2-AES) com palavra-passe forte ou 802.1X","WPA-TKIP"],"correta":2,"explica":"WEP e TKIP estão quebrados."},{"tipo":"mc","p":"Num hotel com 40 APs, que solução facilita a gestão?","opcoes":["Configurar AP a AP","APs leves geridos por uma WLC ou cloud","Um hub","Cabos de consola"],"correta":1,"explica":"Gestão centralizada."},{"tipo":"vf","p":"A porta do switch onde liga um AP leve gerido por WLC normalmente é access.","correta":true,"explica":"O tráfego vai no túnel CAPWAP."}],"desfecho":"Hóspedes isolados numa VLAN própria, rede interna com WPA3 e gestão central dos APs.","topologia":null,"nivel":"básico"},{"id":"c07","titulo":"A filial não chega à sede","modulo":"m6","local":"Rede de farmácias","papel":"Técnico de redes","historia":"<p>Abriu uma nova farmácia (filial, LAN <code>192.168.2.0/24</code>, router R2). A sede tem a LAN <code>192.168.1.0/24</code> e o router R1. Estão ligados por <code>10.0.12.0/30</code> (R1 = .1, R2 = .2). No R1 foi configurado <code>ip route 192.168.2.0 255.255.255.0 10.0.12.2</code>. Da sede, o ping para a filial falha.</p>","etapas":[{"tipo":"mc","p":"O que falta mais provavelmente?","opcoes":["A rota de volta em R2 para 192.168.1.0/24","Uma VLAN nova","Um servidor DNS","Mudar a máscara do /30"],"correta":0,"explica":"O pedido chega, mas a resposta não sabe voltar."},{"tipo":"cmd","p":"Escreva a rota em R2 para a LAN da sede.","respostas":["ip route 192.168.1.0 255.255.255.0 10.0.12.1"],"explica":"Next hop = IP de R1 na ligação."},{"tipo":"mc","p":"Que comando confirma a rota em R2?","opcoes":["show ip route","show vlan","show mac address-table","show cdp"],"correta":0,"explica":"show ip route (ou show ip route static)."},{"tipo":"mc","p":"Com 20 filiais a caminho, o que recomenda a médio prazo?","opcoes":["Rotas estáticas em todos","Um protocolo dinâmico como OSPF","Uma só VLAN","Desligar a sede"],"correta":1,"explica":"Escala melhor e reage a falhas."}],"desfecho":"Com a rota de volta, a filial comunica com a sede. Lição: o tráfego tem sempre dois sentidos.","topologia":null,"nivel":"intermédio"},{"id":"c08","titulo":"A loja online fora do ar","modulo":"m7","local":"Loja de eletrónica","papel":"Técnico de redes","historia":"<p>A loja tem o site num servidor interno (<code>192.168.1.50</code>, porta 443). Mudaram o router e agora os clientes não conseguem abrir o site a partir da Internet, mas dentro da loja funciona. O IP público da loja é <code>203.0.113.10</code>.</p>","etapas":[{"tipo":"mc","p":"O que falta no novo router?","opcoes":["NAT estático (port forwarding) para o servidor","DHCP","Uma VLAN","STP"],"correta":0,"explica":"Sem tradução, ninguém de fora chega ao IP privado."},{"tipo":"cmd","p":"Escreva o NAT estático 1:1 do servidor para o IP público.","respostas":["ip nat inside source static 192.168.1.50 203.0.113.10"],"explica":"ip nat inside source static <local> <global>."},{"tipo":"mc","p":"O que mais tem de estar configurado nas interfaces?","opcoes":["ip nat inside na LAN e ip nat outside no lado da Internet","switchport mode trunk","spanning-tree portfast","ip helper-address"],"correta":0,"explica":"Sem inside/outside o NAT não atua."},{"tipo":"vf","p":"A firewall também tem de permitir tráfego HTTPS (443) para o servidor.","correta":true,"explica":"Tradução e permissão são coisas diferentes."}],"desfecho":"Site de volta ao ar. Documentou o NAT para a próxima troca de equipamento.","topologia":null,"nivel":"intermédio"},{"id":"c09","titulo":"Hospital: proteger a rede da farmácia","modulo":"m8","local":"Hospital municipal","papel":"Administrador de redes","historia":"<p>No hospital, os <b>quiosques públicos</b> da sala de espera (<code>192.168.50.0/24</code>) conseguem aceder ao servidor de stock da farmácia (<code>10.10.5.20</code>). A direção quer bloquear isso, mantendo o acesso dos quiosques à Internet. O router R1 liga os quiosques pela interface G0/1.</p>","etapas":[{"tipo":"mc","p":"Que tipo de ACL e onde, segundo a boa prática?","opcoes":["Extended, perto da origem (G0/1 in)","Standard, perto da origem","Extended, na consola","Nenhuma, basta DHCP"],"correta":0,"explica":"Extended filtra origem e destino; aplica-se perto da origem."},{"tipo":"mc","p":"Qual a linha certa para bloquear o servidor?","opcoes":["deny ip 192.168.50.0 0.0.0.255 host 10.10.5.20","deny ip any any","permit ip 192.168.50.0 0.0.0.255 host 10.10.5.20","deny tcp host 10.10.5.20 any"],"correta":0,"explica":"Origem quiosques, destino servidor."},{"tipo":"mc","p":"O que tem de vir depois para os quiosques continuarem a navegar?","opcoes":["permit ip any any","Nada","deny ip any any","ip nat outside"],"correta":0,"explica":"Senão o deny implícito bloqueia tudo."},{"tipo":"cmd","p":"Aplique a ACL QUIOSQUES na entrada da interface (já dentro de interface g0/1).","respostas":["ip access-group QUIOSQUES in"],"explica":"ip access-group QUIOSQUES in."}],"desfecho":"Os quiosques continuam a navegar, mas o servidor da farmácia ficou fora do alcance do público.","topologia":null,"nivel":"avançado"},{"id":"c10","titulo":"Os PCs recebem IP errado","modulo":"m8","local":"Universidade, residência de estudantes","papel":"Técnico de redes","historia":"<p>Vários estudantes reclamam: <i>“Tenho Wi-Fi/cabo mas não há Internet.”</i> Os PCs afetados recebem IP <code>192.168.0.x</code> com gateway <code>192.168.0.1</code>, quando a rede correta é <code>10.20.0.0/16</code>. Um estudante ligou o seu router doméstico à tomada do quarto.</p>","etapas":[{"tipo":"mc","p":"O que está a acontecer?","opcoes":["Um servidor DHCP não autorizado (rogue)","Falha de DNS","Loop STP","Duplex mismatch"],"correta":0,"explica":"O router doméstico está a responder a pedidos DHCP."},{"tipo":"mc","p":"Que funcionalidade do switch impede isto?","opcoes":["DHCP snooping","PortFast","CDP","VTP"],"correta":0,"explica":"Só portas confiáveis podem enviar ofertas DHCP."},{"tipo":"mc","p":"Que portas devem ser 'trusted'?","opcoes":["As que levam ao servidor DHCP legítimo (uplinks)","Todas as portas dos quartos","Nenhuma","Só a porta do estudante"],"correta":0,"explica":"Uplinks em trust; portas de utilizador untrusted."},{"tipo":"cmd","p":"Escreva o comando global que ativa o DHCP snooping.","respostas":["ip dhcp snooping"],"explica":"ip dhcp snooping (+ ip dhcp snooping vlan X)."}],"desfecho":"Com DHCP snooping, o router doméstico deixa de afetar os outros estudantes.","topologia":null,"nivel":"intermédio"},{"id":"c11","titulo":"Sexta-feira à noite: 60 switches","modulo":"m9","local":"Operadora regional","papel":"Engenheiro de redes","historia":"<p>A empresa mudou de servidor NTP e de servidor Syslog. Há <b>60 switches</b> para atualizar até segunda-feira. O colega sugere fazer à mão; você propõe automatizar com Python.</p>","etapas":[{"tipo":"mc","p":"Que biblioteca Python liga por SSH a equipamentos Cisco e envia comandos?","opcoes":["Netmiko","Pandas","Pygame","Flask"],"correta":0,"explica":"Netmiko."},{"tipo":"mc","p":"Que método envia uma lista de comandos de configuração?","opcoes":["send_config_set","send_command","print","open"],"correta":0,"explica":"send_config_set; send_command é para show."},{"tipo":"mc","p":"Qual a prática mais segura antes de correr em produção?","opcoes":["Testar num laboratório e num switch pouco crítico","Correr em todos ao mesmo tempo sem teste","Guardar a palavra-passe no código","Desligar os logs"],"correta":0,"explica":"Testar primeiro, aumentar o alcance aos poucos."},{"tipo":"vf","p":"O script deve fazer backup da configuração antes de alterar.","correta":true,"explica":"Permite voltar atrás se algo correr mal."}],"desfecho":"60 switches atualizados em 6 minutos, com backups e um relatório. O fim de semana ficou livre.","topologia":null,"nivel":"básico"}],"referencias":{"odom1":"ODOM, Wendell. CCNA 200-301 Official Cert Guide, Volume 1. 2. ed. Hoboken: Cisco Press, 2024.","odom2":"ODOM, Wendell. CCNA 200-301 Official Cert Guide, Volume 2. 2. ed. Hoboken: Cisco Press, 2024.","lammle":"LAMMLE, Todd. CCNA Certification Study Guide: Exam 200-301. Indianapolis: Sybex/Wiley, 2020.","kurose":"KUROSE, a revolução digital. São Paulo: Companhia das Letras, 2014.","cerf_kahn":"CERF, Vinton G.; KAHN, Robert E. A Protocol for Packet Network Intercommunication. IEEE Transactions on Communications, v. 22, n. 5, p. 637-648, 1974.","metcalfe":"METCALFE, Robert M.; BOGGS, David R. Ethernet: Distributed Packet Switching for Local Computer Networks. Communications of the ACM, v. 19, n. 7, p. 395-404, 1976.","berners_lee":"BERNERS-LEE, Tim. Information Management: A Proposal. Genebra: CERN, 1989.","rfc1":"CROCKER, S. RFC 1: Host Software. IETF, 1969.","tanenbaum_org":"TANENBAUM, Andrew S.; AUSTIN, Todd. Organização estruturada de computadores. 6. ed. São Paulo: Pearson, 2013.","patterson":"PATTERSON, David A.; HENNESSY, John L. Organização e projeto de computadores: a interface hardware/software. 5. ed. Rio de Janeiro: Elsevier, 2017."},"guia":{"dominios":[{"nome":"1.0 Network Fundamentals","peso":20,"modulos":["m0","m1","m2","m3","m4"]},{"nome":"2.0 Network Access","peso":20,"modulos":["m5"]},{"nome":"3.0 IP Connectivity","peso":25,"modulos":["m6"]},{"nome":"4.0 IP Services","peso":10,"modulos":["m7"]},{"nome":"5.0 Security Fundamentals","peso":15,"modulos":["m8"]},{"nome":"6.0 Automation and Programmability","peso":10,"modulos":["m9"]}],"plano":[{"semana":"Semana 0","tema":"Módulo 0 (do zero)","pratica":"Para quem nunca estudou informática: computador, história das redes, binário."},{"semana":"Semana 1","tema":"Módulo 1 + Módulo 2","pratica":"Instale o Packet Tracer. Desenhe a rede de sua casa com os ícones certos."},{"semana":"Semana 2","tema":"Módulo 3 (IPv4 e sub-redes)","pratica":"Desafio Sub-rede todos os dias: objetivo 10 acertos seguidos em menos de 30 s cada."},{"semana":"Semana 3","tema":"Módulo 3 (VLSM e IPv6) + Módulo 4","pratica":"Faça os Laboratórios CLI 1 e 2 até não precisar de ajuda."},{"semana":"Semana 4","tema":"Módulo 5 (switch, VLANs, inter-VLAN)","pratica":"Monte no Packet Tracer 2 switches, 3 VLANs e router-on-a-stick."},{"semana":"Semana 5","tema":"Módulo 5 (STP, EtherChannel, Wi-Fi)","pratica":"Provoque um loop e veja o STP a resolvê-lo; configure LACP."},{"semana":"Semana 6","tema":"Módulo 6 (rotas estáticas e tabela)","pratica":"Laboratório de rotas estáticas com caminho de volta e rota flutuante."},{"semana":"Semana 7","tema":"Módulo 6 (OSPF e HSRP)","pratica":"OSPF com 3 routers, DR/BDR e passive-interface."},{"semana":"Semana 8","tema":"Módulo 7 (DHCP, NAT, NTP, Syslog, QoS)","pratica":"Rede completa com DHCP central + relay e PAT para a Internet."},{"semana":"Semana 9","tema":"Módulo 8 (segurança)","pratica":"ACLs standard e extended, port security, DHCP snooping."},{"semana":"Semana 10","tema":"Módulo 9 (automação)","pratica":"Escreva um script Python que faça backup de 2 routers (CML/DevNet sandbox)."},{"semana":"Semana 11","tema":"Revisão geral","pratica":"Refaça todas as provas de módulo até ≥ 900 pontos. Reveja o caderno de erros."},{"semana":"Semana 12","tema":"Simulados","pratica":"Simulados completos cronometrados (120 min). Marque o exame quando passar com folga."}],"dicas":["O exame 200-301 tem cerca de 100 a 120 perguntas em 120 minutos (a Cisco não publica o número exato) e não permite voltar atrás.","Tipos de pergunta: escolha múltipla (uma ou várias), arrastar e largar, e simulações/testlets em CLI.","A nota de aprovação não é publicada oficialmente; a comunidade aponta cerca de 800–850 em 1000. Nesta app a prova de módulo exige 825.","Gestão de tempo: ~1 minuto por pergunta. Se não sabe, elimine opções, escolha e avance.","Leia a pergunta duas vezes: palavras como NOT, BEST, FIRST e “escolha duas” mudam tudo.","Sub-redes: tem de as fazer de cabeça em menos de 30 segundos.","Pratique CLI até escrever os comandos sem pensar — as simulações valem mais pontos.","Agende o exame na Pearson VUE (centro de testes ou online) e leia as regras de identificação.","A certificação CCNA é válida por 3 anos; renova-se com novo exame ou créditos de formação contínua (CE)."],"ferramentas":[{"nome":"Cisco Packet Tracer","desc":"Gratuito via NetAcad. Usado em todos os laboratórios desta app.","url":"https://www.netacad.com/cisco-packet-tracer"},{"nome":"Cisco Modeling Labs (CML)","desc":"Imagens IOS reais. Versão Free com limite de nós.","url":"https://developer.cisco.com/modeling-labs/"},{"nome":"GNS3","desc":"Emulador gratuito e de código aberto.","url":"https://www.gns3.com"},{"nome":"EVE-NG","desc":"Plataforma de emulação multi-fabricante (Community gratuita).","url":"https://www.eve-ng.net"},{"nome":"Wireshark","desc":"Analisador de pacotes: veja ARP, DHCP, TCP a acontecer.","url":"https://www.wireshark.org"},{"nome":"Cisco DevNet Sandbox","desc":"Ambientes gratuitos para testar APIs e automação.","url":"https://developer.cisco.com/site/sandbox/"},{"nome":"Cisco Learning Network","desc":"Comunidade oficial, temas do exame e grupos de estudo.","url":"https://learningnetwork.cisco.com"}],"glossario":[{"termo":"AAA","def":"Authentication, Authorization, Accounting: quem é, o que pode fazer, o que fez."},{"termo":"ACL","def":"Access Control List: lista de regras que permite ou nega tráfego."},{"termo":"AD","def":"Distância administrativa: confiança numa origem de rotas (menor = melhor)."},{"termo":"APIPA","def":"Endereço 169.254.x.x que o host atribui a si próprio quando não há DHCP."},{"termo":"ARP","def":"Descobre o MAC a partir do IP numa rede IPv4."},{"termo":"BPDU","def":"Mensagem do Spanning Tree trocada entre switches."},{"termo":"CAPWAP","def":"Protocolo de túnel entre APs leves e a WLC."},{"termo":"CDP","def":"Cisco Discovery Protocol: descobre vizinhos Cisco diretamente ligados."},{"termo":"CIDR","def":"Notação /prefixo e agregação de redes sem classes."},{"termo":"CoS","def":"Class of Service: 3 bits de prioridade na etiqueta 802.1Q."},{"termo":"DHCP","def":"Atribui IP, máscara, gateway e DNS automaticamente."},{"termo":"DNS","def":"Traduz nomes em endereços IP."},{"termo":"DSCP","def":"6 bits do cabeçalho IP usados para QoS."},{"termo":"DTP","def":"Dynamic Trunking Protocol: negociação automática de trunk (Cisco)."},{"termo":"EtherChannel","def":"Agregação de várias ligações físicas numa lógica."},{"termo":"FHRP","def":"Protocolos de redundância de gateway: HSRP, VRRP, GLBP."},{"termo":"Gateway","def":"Router que leva o tráfego para fora da rede local."},{"termo":"HSRP","def":"Hot Standby Router Protocol (Cisco): gateway virtual redundante."},{"termo":"LACP","def":"Protocolo aberto de negociação de EtherChannel."},{"termo":"LLDP","def":"Descoberta de vizinhos, norma IEEE 802.1AB."},{"termo":"MAC","def":"Endereço físico de 48 bits de uma placa de rede."},{"termo":"MTU","def":"Tamanho máximo do pacote numa ligação (1500 bytes em Ethernet)."},{"termo":"NAT/PAT","def":"Tradução de endereços privados para públicos; PAT usa portas."},{"termo":"NTP","def":"Sincroniza os relógios dos equipamentos."},{"termo":"OSPF","def":"Protocolo de encaminhamento de estado de ligação (link-state)."},{"termo":"PoE","def":"Power over Ethernet: alimentação de APs e telefones pelo cabo."},{"termo":"PortFast","def":"Porta de acesso passa logo a forwarding no STP."},{"termo":"QoS","def":"Mecanismos para priorizar tráfego (voz, vídeo)."},{"termo":"REST","def":"Estilo de API sobre HTTP com verbos GET/POST/PUT/DELETE."},{"termo":"SDN","def":"Rede definida por software, com controlador central."},{"termo":"SNMP","def":"Protocolo de monitorização e gestão de equipamentos."},{"termo":"SSH","def":"Acesso remoto cifrado à CLI (TCP 22)."},{"termo":"STP","def":"Spanning Tree Protocol: evita loops de camada 2."},{"termo":"SVI","def":"Interface virtual de VLAN num switch (interface vlan X)."},{"termo":"Syslog","def":"Envio de mensagens de registo para um servidor."},{"termo":"Trunk","def":"Ligação que transporta várias VLANs com etiquetas 802.1Q."},{"termo":"TTL","def":"Contador do IP que diminui a cada router; a 0 o pacote é descartado."},{"termo":"VLAN","def":"Rede lógica separada dentro de um switch; um domínio de broadcast."},{"termo":"VLSM","def":"Máscaras de tamanho variável dentro do mesmo bloco."},{"termo":"VPN","def":"Túnel cifrado sobre uma rede pública."},{"termo":"Wildcard","def":"Inverso da máscara, usado em ACLs e OSPF."},{"termo":"WLC","def":"Wireless LAN Controller: gere APs centralmente."},{"termo":"YANG","def":"Linguagem de modelação de dados de configuração de rede."}],"motivos":["Passar no exame CCNA","Conseguir emprego em redes/TI","Melhorar no meu trabalho atual","Faculdade ou curso técnico","Mudar de carreira","Gerir a rede de casa ou da minha empresa","Curiosidade / gosto de tecnologia"],"experiencia":[{"id":"zero","nome":"Nunca estudei informática","sugestao":"Começa no Módulo 0, do zero absoluto."},{"id":"basico","nome":"Uso computador, mas não sei nada de redes","sugestao":"Começa no Módulo 0; pode avançar depressa."},{"id":"algum","nome":"Já sei o básico de redes","sugestao":"Pode começar no Módulo 1 e passar a prova do Módulo 0."},{"id":"trabalho","nome":"Já trabalho na área","sugestao":"Sugerimos o modo livre para ir direto ao que precisa."}],"sim_real":[{"tema":"Ligar ao equipamento","sim":"Clique no separador CLI.","real":"Cabo de consola, driver USB-série, PuTTY a 9600 8N1."},{"tema":"Arranque","sim":"Segundos.","real":"Minutos; ROMMON se a imagem falhar."},{"tema":"Comandos","sim":"Subconjunto do IOS; alguns comandos não existem.","real":"IOS/IOS-XE completo; varia com a versão e a licença."},{"tema":"Portas","sim":"Ficam verdes rapidamente.","real":"LED âmbar ~30 s com STP; PortFast acelera."},{"tema":"Erros físicos","sim":"Praticamente inexistentes.","real":"Cabos maus, CRC, duplex mismatch, fibra suja."},{"tema":"Riscos","sim":"Nenhum: apague e recomece.","real":"Um erro corta a rede de uma empresa; use janelas de manutenção e 'reload in'."},{"tema":"Testes","sim":"Modo Simulation mostra cada pacote.","real":"Wireshark com SPAN, ping, traceroute, logs."},{"tema":"Documentação","sim":"Opcional.","real":"Obrigatória: diagramas, IPAM, backups e registo de alterações."}]}};

<script>

(function () {
  "use strict";

  // Ícones 64×64 desenhados no estilo dos diagramas de rede.
  const ICONES = {

    firewall: `

        <rect x="9" y="26" width="6" height="7"/><rect x="17" y="26" width="14" height="7"/><rect x="33" y="26" width="14" height="7"/><rect x="49" y="26" width="6" height="7"/>
        <rect x="9" y="35" width="14" height="7"/><rect x="25" y="35" width="14" height="7"/><rect x="41" y="35" width="14" height="7"/>
        <rect x="9" y="44" width="6" height="7"/><rect x="17" y="44" width="14" height="7"/><rect x="33" y="44" width="14" height="7"/><rect x="49" y="44" width="6" height="7"/>
      </g>`,
    ap: `
      <path d="M10 44 Q32 30 54 44 L54 48 Q32 56 10 48 Z" class="i-corpo"/>
      <circle cx="32" cy="45" r="2.5" class="i-led"/>
      <g class="i-onda" fill="none">
        <path d="M22 30 Q32 20 42 30"/><path d="M16 24 Q32 8 48 24"/>

    wlc: `

    pc: `

      <rect x="14" y="16" width="36" height="22" class="i-ecra"/>

      <rect x="18" y="50" width="28" height="3" rx="1.5" class="i-corpo-esc"/>`,
    portatil: `
      <rect x="14" y="14" width="36" height="26" rx="2" class="i-corpo"/>
      <rect x="17" y="17" width="30" height="20" class="i-ecra"/>
      <path d="M6 42 h52 l-4 6 h-44z" class="i-corpo-esc"/>`,
    servidor: `
      <rect x="18" y="8" width="28" height="48" rx="3" class="i-corpo"/>
      <g class="i-corpo-esc"><rect x="22" y="14" width="20" height="5"/><rect x="22" y="23" width="20" height="5"/><rect x="22" y="32" width="20" height="5"/></g>
      <g class="i-led"><circle cx="38" cy="47" r="2"/></g>`,
    nuvem: `
      <path d="M18 46 Q6 46 8 36 Q10 28 19 29 Q20 16 33 16 Q44 16 46 26 Q57 25 57 36 Q57 46 46 46 Z" class="i-nuvem"/>`,
    telefone_ip: `

  function icone(tipo, tamanho) {

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const T = (x, y, txt, cls, extra) => `<text x="${x}" y="${y}" class="${cls || "f-txt"}" ${extra || ""}>${esc(txt)}</text>`;

  // ---------------------------------------------------------------- painéis
  function painelSwitch() {
    let portas = "";

      const col = Math.floor(i / 2), linha = i % 2;

      <rect x="4" y="10" width="512" height="96" rx="6" class="f-chassi"/>

      <g class="f-led-on"><circle cx="24" cy="68" r="3"/></g>${T(32, 72, "STAT", "f-mini")}

  function painelRouter() {

      <rect x="360" y="30" width="140" height="36" rx="3" class="f-slot"/>${T(430, 52, "NIM 1 (WAN/4G/serial)", "f-mini", 'text-anchor="middle"')}

  // ---------------------------------------------------------------- cabos
  function caboUtp() {
    const cores = ["f-par1", "f-par2", "f-par3", "f-par4"];
    let pares = "";
    cores.forEach((c, i) => {
      const y = 34 + i * 16;
      pares += `<path d="M190 ${y} q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" class="${c}" fill="none" stroke-width="4"/>`;
      pares += `<path d="M190 ${y + 4} q10 6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0" class="${c} f-tracejado" fill="none" stroke-width="4"/>`;
    });
    return `<svg viewBox="0 0 520 130" class="fig">
      <rect x="20" y="36" width="90" height="56" rx="4" class="f-rj45"/>
      ${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<rect x="${30 + i * 9}" y="42" width="5" height="16" class="f-pino"/>`).join("")}
      <path d="M40 92 h50 l-6 14 h-38z" class="f-rj45"/>
      <rect x="110" y="48" width="80" height="34" rx="10" class="f-capa"/>

      <rect x="300" y="96" width="140" height="44" rx="4" class="f-h3"/>${T(370, 114, "orig 203.0.113.2", "f-mini-claro", 'text-anchor="middle"')}${T(370, 130, "dest 142.250.0.10", "f-mini-claro", 'text-anchor="middle"')}

      ${T(260, 160, "R1 troca o endereço de origem e guarda a tradução", "f-mini", 'text-anchor="middle"')}

  function sdn() {
    const caixa = (y, h, txt, cls) => `<rect x="60" y="${y}" width="400" height="${h}" rx="6" class="${cls}"/>${T(260, y + h / 2 + 5, txt, "f-txt-claro", 'text-anchor="middle"')}`;
    const ico = (x, t) => `<g transform="translate(${x},180)"><svg width="44" height="44" viewBox="0 0 64 64">${ICONES[t]}</svg></g>`;

  function computadorPartes() {
    const caixa = (x, y, w, h, txt, sub, cls) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="${cls}"/>${T(x + w / 2, y + h / 2 - 2, txt, "f-txt-claro", 'text-anchor="middle"')}${T(x + w / 2, y + h / 2 + 13, sub, "f-mini-claro", 'text-anchor="middle"')}`;

      ${caixa(190, 172, 140, 50, "Armazenamento", "SSD / disco", "f-dados")}
      ${caixa(410, 95, 100, 56, "Saída", "ecrã, som, rede", "f-h2")}
      ${caixa(10, 190, 100, 50, "Placa de rede", "cabo ou Wi-Fi", "f-tag")}
      ${seta(110, 123, 188, 60)}${seta(332, 60, 408, 118)}${seta(260, 78, 260, 98)}${seta(260, 152, 260, 170)}${seta(110, 210, 188, 200)}
      ${T(260, 245, "entrada → processamento → saída", "f-mini", 'text-anchor="middle"')}

  function linhaTempo() {
    const ev = [[1945, "ENIAC"], [1969, "ARPANET"], [1973, "Ethernet"], [1983, "TCP/IP"], [1984, "Cisco"], [1991, "Web"], [1997, "Wi-Fi"], [2007, "Smartphones"], [2011, "Fim IPv4"], [2020, "CCNA 200-301"]];
    const x = (a) => 20 + ((a - 1940) / 85) * 480;
    let s = `<path d="M15 70 H505" class="f-seta-linha"/>`;
    ev.forEach(([a, n], i) => {
      const cima = i % 2 === 0;
      s += `<circle cx="${x(a)}" cy="70" r="6" class="${i === ev.length - 1 ? "f-led-amb" : "f-h3"}"/>`;
      s += `<path d="M${x(a)} ${cima ? 64 : 76} V${cima ? 44 : 96}" class="f-linha-vida"/>`;
      s += T(x(a), cima ? 22 : 118, String(a), "f-label", 'text-anchor="middle"') + T(x(a), cima ? 36 : 132, n, "f-mini", 'text-anchor="middle"');
    });

  }

  const FIGURAS = {
    computador_partes: computadorPartes, linha_tempo: linhaTempo,
    painel_switch: painelSwitch, painel_router: painelRouter,

    osi, encapsulamento, handshake, trama_ethernet: trama,

    stp, nat, sdn,
  };

  function figura(nome) {
    if (FIGURAS[nome]) return FIGURAS[nome]();
    if (ICONES[nome]) return `<svg viewBox="0 0 64 64" class="fig fig-ico">${ICONES[nome]}</svg>`;
    return "";

  // ---------------------------------------------------------------- topologia
  function topologia(t) {
    const W = 520, H = 280;
    const px = (n) => ({ x: 40 + (n.x / 100) * (W - 80), y: 30 + (n.y / 100) * (H - 80) });
    const pos = {};
    t.nos.forEach((n) => { pos[n.id] = px(n); });
    let lig = "", rot = "", nos = "";
    t.ligacoes.forEach((l) => {
      const a = pos[l.a], b = pos[l.b];
      lig += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" class="f-lig"/>`;
      if (l.rotulo) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, w = l.rotulo.length * 6.2 + 10;
        rot += `<rect x="${mx - w / 2}" y="${my - 10}" width="${w}" height="18" rx="4" class="f-rot-fundo"/>${T(mx, my + 3, l.rotulo, "f-mini", 'text-anchor="middle"')}`;
      }
    });
    t.nos.forEach((n) => {
      const p = pos[n.id];
      nos += `<g transform="translate(${p.x - 24},${p.y - 24})"><svg width="48" height="48" viewBox="0 0 64 64">${ICONES[n.tipo] || ICONES.pc}</svg></g>`;
      const partes = String(n.rotulo).split(" ");
      const l1 = partes.length > 2 ? partes.slice(0, Math.ceil(partes.length / 2)).join(" ") : n.rotulo;
      const l2 = partes.length > 2 ? partes.slice(Math.ceil(partes.length / 2)).join(" ") : "";
      nos += T(p.x, p.y + 36, l1, "f-label", 'text-anchor="middle"') + (l2 ? T(p.x, p.y + 50, l2, "f-mini", 'text-anchor="middle"') : "");
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="fig">${lig}${rot}${nos}</svg>`;
  }

  window.Figuras = { icone, figura, topologia, ICONES };
})();
