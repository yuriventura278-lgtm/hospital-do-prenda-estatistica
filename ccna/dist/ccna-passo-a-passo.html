  --ok: #3ccb7a; --ok-soft: #0f2a1c; --warn: #f0b23a; --warn-soft: #2d230d; --bad: #f07070; --bad-soft: #321616;
  --led-off: #2a3946; --chassi: #2a3744; --slot: #3a4856; --plastico: #3b4b59; --porta: #121a21;
  --ico: #4b8df0; --ico-esc: #1e4fa8; --ico-claro: #8dbbff; --ecra: #12284f; --nuvem: #5d7286;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 85%; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 750; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
code, kbd, pre { font-family: var(--f-mono); font-size: .88em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 5px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tab-num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ estrutura */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topo .titulo { flex: 1; min-width: 0; font-family: var(--f-display); font-stretch: 85%; font-weight: 750; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca { display: flex; align-items: center; gap: 8px; }
.marca b { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; letter-spacing: .02em; }
.btn-icone { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.btn-icone svg { width: 20px; height: 20px; }
.xp-pilula { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; white-space: nowrap; }

main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
main > * { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.nav button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: .72rem; font-weight: 600; cursor: pointer; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* ------------------------------------------------------------ componentes */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.cartao.plano { box-shadow: none; }
.secao { display: grid; gap: 12px; }
.secao > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rotulo { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.suave { color: var(--muted); }
.peq { font-size: .88rem; }
.linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.linha.entre { justify-content: space-between; }
.grelha-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 380px) { .grelha-2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bloco { width: 100%; }
.btn.peq { min-height: 36px; padding: 6px 12px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.barra { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* LEDs de porta — assinatura visual do progresso */
.leds { display: flex; gap: 4px; flex-wrap: wrap; }
.led { width: 14px; height: 9px; border-radius: 2px; background: var(--led-off); }
.led.on { background: var(--led-on); box-shadow: 0 0 6px color-mix(in srgb, var(--led-on) 60%, transparent); }
.led.amb { background: var(--led-amb); animation: pisca 1.4s infinite; }
.led.exame { width: 22px; border: 1px solid var(--muted); }
@keyframes pisca { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .led.amb { animation: none; } * { transition: none !important; } }

.painel { background: var(--chassi); border-radius: 12px; padding: 14px; display: grid; gap: 8px; border: 1px solid var(--line); }
.painel .fila { display: grid; grid-template-columns: 2.6rem 1fr auto; gap: 10px; align-items: center; cursor: pointer; padding: 4px 6px; border-radius: 8px; background: none; border: 0; text-align: left; }
.painel .fila:hover { background: color-mix(in srgb, var(--surface) 35%, transparent); }
.painel .num { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.painel .pct { font-family: var(--f-mono); font-size: .75rem; color: var(--ink); }

/* hero / nível */
.nivel { display: grid; gap: 10px; background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 55%, var(--ink)) 100%); color: var(--accent-ink); border-radius: 18px; padding: 18px; }
.nivel h1 { font-size: 1.55rem; }
.nivel .barra { background: color-mix(in srgb, var(--accent-ink) 22%, transparent); border: 0; }
.nivel .barra > i { background: var(--accent-ink); }
.nivel .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; font-weight: 600; opacity: .92; }

.acoes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.acao { display: grid; gap: 6px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; }
.acao svg { width: 28px; height: 28px; color: var(--accent); }
.acao b { font-family: var(--f-display); font-stretch: 85%; font-size: 1rem; }
.acao span { font-size: .8rem; color: var(--muted); }

/* listas de módulos e lições */
.lista { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.item[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.item .ico-caixa { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; }
.item .meio { min-width: 0; display: grid; gap: 4px; }
.item .meio b { font-family: var(--f-display); font-stretch: 88%; font-size: 1.02rem; line-height: 1.2; }
.estado-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .9rem; font-weight: 800; }
.estado-ico.ok { background: var(--ok); color: #fff; }
.estado-ico.atual { background: var(--led-amb); color: #241a00; }
.estado-ico.bloq { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* ------------------------------------------------------------ lição */
.cab-licao { display: grid; gap: 10px; }
.objetivos { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.conteudo { display: grid; gap: 18px; }
.bloco { display: grid; gap: 10px; min-width: 0; }
.bloco h3 { display: flex; gap: 8px; align-items: center; }
.bloco .html { display: grid; gap: 10px; max-width: 68ch; }
.bloco .html ul, .bloco .html ol { margin: 0; padding-left: 1.25em; display: grid; gap: 6px; }
.bloco .html pre { margin: 0; background: var(--term-bg); color: var(--term-fg); padding: 14px; border-radius: 10px; overflow-x: auto; font-size: .82rem; line-height: 1.5; }
.fig-caixa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; overflow-x: auto; }
.fig-caixa figcaption { font-size: .85rem; color: var(--muted); }
.fig { width: 100%; height: auto; display: block; min-width: 320px; }
.fig-ico { max-width: 160px; margin: 0 auto; }

.exemplo { border: 1px solid var(--line); border-left: 4px solid var(--d2); background: var(--surface); padding: 14px; border-radius: 10px; }
.dica, .alerta { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: 10px; }
.dica { background: var(--accent-soft); }
.alerta { background: var(--warn-soft); }
.dica svg, .alerta svg { width: 22px; height: 22px; }
.dica svg { color: var(--accent); }
.alerta svg { color: var(--warn); }

.tabela-caixa { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 12px; font-family: var(--f-mono); font-size: .84rem; overflow: hidden; }
.term .barra-term { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: color-mix(in srgb, var(--term-bg) 80%, #ffffff); color: var(--term-dim); font-size: .75rem; gap: 8px; }
.term .barra-term .pontos { display: flex; gap: 5px; }
.term .barra-term .pontos i { width: 9px; height: 9px; border-radius: 50%; background: var(--term-dim); }
.passos { list-style: none; margin: 0; padding: 6px 0; }
.passos li { padding: 8px 12px; display: grid; gap: 2px; border-bottom: 1px dashed color-mix(in srgb, var(--term-dim) 35%, transparent); }
.passos li:last-child { border-bottom: 0; }
.passos .cmdl { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.passos .pr { color: var(--term-prompt); }
.passos .cm { color: #ffffff; font-weight: 600; overflow-wrap: anywhere; }
.passos .ex { color: var(--term-dim); font-family: var(--f-body); font-size: .82rem; }
.btn-copiar { margin-left: auto; background: none; border: 1px solid color-mix(in srgb, var(--term-dim) 50%, transparent); color: var(--term-dim); border-radius: 6px; font-size: .7rem; padding: 2px 6px; cursor: pointer; font-family: var(--f-body); }
.term pre { margin: 0; padding: 12px; overflow-x: auto; white-space: pre; line-height: 1.45; }

.simreal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .simreal { grid-template-columns: 1fr; } }
.simreal > div { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.simreal .sim { background: var(--accent-soft); }
.simreal .real { background: var(--surface); border: 1px solid var(--line); }
.simreal ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .9rem; }

.video { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.video .play { width: 52px; height: 52px; border-radius: 12px; background: #d93025; display: grid; place-items: center; }
.video .play svg { width: 22px; height: 22px; color: #fff; }

.refs { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: .86rem; color: var(--muted); }
.refs li { overflow-wrap: anywhere; }

/* ------------------------------------------------------------ quiz */
.quiz-topo { display: grid; gap: 8px; }
.pergunta { font-size: 1.12rem; font-weight: 700; line-height: 1.4; }
.opcoes { display: grid; gap: 10px; }
.opcao { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; }
.opcao .letra { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-weight: 800; font-size: .85rem; }
.opcao.sel { border-color: var(--accent); }
.opcao.certa { border-color: var(--ok); background: var(--ok-soft); }
.opcao.errada { border-color: var(--bad); background: var(--bad-soft); }
.opcao:disabled { cursor: default; }
.feedback { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.campo { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 1rem var(--f-body); }
.campo.mono { font-family: var(--f-mono); }
.campo:focus { border-color: var(--accent); outline: none; }

.resultado { text-align: center; display: grid; gap: 10px; justify-items: center; }
.resultado .grande { font-family: var(--f-display); font-stretch: 80%; font-size: 3.4rem; font-weight: 800; line-height: 1; }
.estrelas { display: flex; gap: 6px; }
.estrelas svg { width: 34px; height: 34px; }
.estrelas .on { color: var(--led-amb); }
.estrelas .off { color: var(--line); }
.temporizador { font-family: var(--f-mono); font-weight: 700; }

/* ------------------------------------------------------------ laboratório */
.lab-tarefas { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lab-tarefas li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: .9rem; }
.lab-tarefas .cx { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: #fff; margin-top: 2px; }
.lab-tarefas li.feita .cx { background: var(--ok); border-color: var(--ok); }
.lab-tarefas li.feita span { color: var(--muted); text-decoration: line-through; }
.lab-tarefas details { font-size: .8rem; color: var(--muted); }
.consola { height: 46vh; min-height: 260px; overflow-y: auto; padding: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
.consola .in { color: #ffffff; }
.consola .pr { color: var(--term-prompt); }
.consola .err { color: #ff9b9b; }
.entrada { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-top: 1px solid color-mix(in srgb, var(--term-dim) 40%, transparent); }
.entrada label { color: var(--term-prompt); white-space: nowrap; }
.entrada input { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font: inherit; outline: none; padding: 6px 0; }
.teclas { display: flex; gap: 6px; padding: 8px 12px 12px; overflow-x: auto; }
.teclas button { flex: none; background: color-mix(in srgb, var(--term-bg) 70%, #ffffff); border: 0; color: var(--term-fg); border-radius: 8px; padding: 8px 12px; font: .8rem var(--f-mono); cursor: pointer; }

/* ------------------------------------------------------------ guia, ranking, perfil */
.abas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.abas button { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--muted); }
.abas button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.peso { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.peso .barra { grid-column: 1 / -1; }
.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ranking li { display: grid; grid-template-columns: 34px 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ranking li.eu { border-color: var(--accent); background: var(--accent-soft); }
.ranking .pos { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-align: center; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-family: var(--f-display); }
.medalhas { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.medalha { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 12px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .75rem; }
.medalha .m { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.medalha.ganha .m { background: var(--led-amb); color: #2a1c00; }
.medalha svg { width: 22px; height: 22px; }
.medalha:not(.ganha) { opacity: .6; }
.gloss dt { font-weight: 800; font-family: var(--f-display); font-stretch: 88%; }
.gloss dd { margin: 0 0 10px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.confirmar { border: 2px solid var(--bad); background: var(--bad-soft); }
textarea.campo { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; }
.vazio { text-align: center; padding: 24px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }

/* ------------------------------------------------------------ ícones e figuras SVG */
.ico { display: block; }
.i-corpo { fill: var(--ico); }
.i-corpo-esc { fill: var(--ico-esc); }
.i-topo { fill: var(--ico-claro); }
.i-seta { fill: #ffffff; }
.i-ecra { fill: var(--ecra); }
.i-led { fill: var(--led-on); }
.i-onda { stroke: var(--ico); stroke-width: 3.5; stroke-linecap: round; }
.i-nuvem { fill: var(--nuvem); }
.i-tijolo-base { fill: #6e2c1c; }
.i-tijolo { fill: #c9573a; }

.f-txt, .f-label { fill: var(--ink); font: 600 12px var(--f-body); }
.f-mini { fill: var(--muted); font: 10px var(--f-body); }
.f-txt-claro { fill: #ffffff; font: 700 12px var(--f-body); }
.f-mini-claro { fill: #ffffff; font: 600 9.5px var(--f-body); }
.f-tag-txt { fill: var(--accent); font: 800 11px var(--f-mono); }
.f-chassi { fill: var(--chassi); stroke: var(--line); }
.f-porta { fill: var(--porta); }
.f-porta-in { fill: var(--porta-in); }
.f-slot { fill: var(--slot); }
.f-btn { fill: var(--porta); }
.f-consola { fill: #6fb6e8; }
.f-led-on { fill: var(--led-on); }
.f-led-amb { fill: var(--led-amb); }
.f-led-off { fill: var(--led-off); }
.f-rj45 { fill: var(--plastico); stroke: var(--muted); stroke-width: 1; }
.f-pino { fill: #d4aa36; }
.f-capa { fill: #3c7bc6; }
.f-par1 { stroke: #f08a24; } .f-par2 { stroke: #2e9e4f; } .f-par3 { stroke: #2f6fd1; } .f-par4 { stroke: #7a4a2a; }
.f-tracejado { opacity: .45; }
.f-lc { fill: #24aec2; }
.f-ferrule { fill: #eeeeee; stroke: var(--muted); }
.f-fibra { stroke: #24aec2; stroke-width: 6; }
.f-sfp { fill: #b6c0ca; stroke: var(--muted); }
.f-nucleo { fill: #ffd25e; }
.f-consola-cabo { stroke: #6fb6e8; stroke-width: 8; stroke-linecap: round; }
.f-db9 { fill: #3c4752; }
.f-fio-bv { fill: #a8dcb6; } .f-fio-v { fill: #2e9e4f; } .f-fio-bl { fill: #f7c99a; } .f-fio-l { fill: #f08a24; }
.f-fio-az { fill: #2f6fd1; } .f-fio-baz { fill: #a9c4f0; } .f-fio-bc { fill: #d1b49c; } .f-fio-c { fill: #7a4a2a; }

/* tamanhos de ícones em linha */
.bloco h3 svg, .chip svg, .linha > svg { width: 18px; height: 18px; flex: none; }

.ico-caixa > svg { width: 26px; height: 26px; color: var(--accent); }
.estado-ico svg { width: 16px; height: 16px; }

/* ------------------------------------------------------------ primeiro acesso */
body.sem-nav .nav { display: none; }
body.sem-nav main { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.onboarding { display: grid; gap: 18px; }
.ob-hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 12px 0; }
.ob-hero p { color: var(--muted); max-width: 40ch; }
.passos-ob { display: flex; gap: 6px; justify-content: center; }
.passos-ob i { width: 26px; height: 8px; border-radius: 2px; background: var(--led-off); }
.passos-ob i.on { background: var(--led-on); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chip-op { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; min-height: 40px; }
.chip-op[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip-op.dia { min-width: 54px; }
.opcao-ob[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.erro-campo { color: var(--bad); font-weight: 700; }
.resumo-plano { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .resumo-plano { grid-template-columns: 1fr 1fr; } .resumo-plano > div:last-child { grid-column: 1 / -1; } }
.resumo-plano > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.resumo-plano b { font-family: var(--f-display); font-stretch: 85%; font-size: 1.1rem; }

/* ------------------------------------------------------------ plano diário */
.hoje h2 { font-size: 1.15rem; margin-top: 2px; }
.sessao { display: grid; gap: 6px; }
.tarefa { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; cursor: pointer; }
.tarefa > svg { width: 20px; height: 20px; color: var(--accent); }
.tarefa .meio { min-width: 0; display: grid; }
.tarefa .meio b { font-size: .92rem; line-height: 1.25; }
.tarefa[aria-disabled="true"] { opacity: .55; }
.dia-plano { gap: 8px; }
details > summary { cursor: pointer; }

/* ------------------------------------------------------------ módulo: o que vai aprender */
.grelha-aprender { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .grelha-aprender { grid-template-columns: 1fr; } }
.tile { display: grid; gap: 6px; align-content: start; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
.tile b { font-family: var(--f-display); font-stretch: 88%; font-size: .98rem; line-height: 1.2; }
.tile ul { margin: 0; padding-left: 1.05em; font-size: .8rem; color: var(--muted); display: grid; gap: 2px; }
.tile.feita { border-color: var(--ok); }
.tile.feita .rotulo { color: var(--ok); }
.tile.extra { background: var(--surface-2); cursor: default; }
.tile[aria-disabled="true"] { opacity: .6; }

/* ------------------------------------------------------------ casos e contexto */
.caso-cab h1 { font-size: 1.45rem; }
.cenario { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: .92rem; }
.contexto-sub { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }

.marca img { border-radius: 8px; background: #fff; }
.marca b { font-size: .78rem; line-height: 1.05; color: var(--ink); }
.logo { display: block; width: min(260px, 70vw); height: auto; border-radius: 18px; background: #fff; }

onde tudo acontece"],["Fonte de alimentação","Fornece energia","O gás/eletricidade do fogão"]]},{"tipo":"texto","titulo":"Software: as instruções","html":"<ul>\n<li><b>Sistema operativo</b> (SO): gere o hardware e as aplicações — Windows, Linux, macOS, Android, iOS. Nos equipamentos Cisco, o SO chama-se <b>IOS</b> (não confundir com o iOS do iPhone).</li>\n<li><b>Aplicações</b>: o browser, o WhatsApp, o Excel, os jogos.</li>\n<li><b>Firmware</b>: software gravado no próprio hardware, que arranca o equipamento.</li>\n</ul>"},{"tipo":"exemplo","titulo":"Um router também é um computador","html":"<p>Um router Cisco tem processador, memória RAM, memória <b>flash</b> (onde fica o sistema operativo IOS), <b>NVRAM</b> (onde fica a configuração guardada) e várias placas de rede (as portas). Não tem ecrã nem teclado: configura-se ligando um portátil ao cabo de consola ou por rede (SSH). Vai fazer isto no Módulo 4!</p>"},{"tipo":"tabela","titulo":"Tipos de computadores","cabecalho":["Tipo","Para quê","Exemplo"],"linhas":[["Pessoal (PC/portátil)","Uso individual","O computador de casa"],["Móvel","Uso pessoal em movimento","Telemóvel, tablet"],["Servidor","Presta serviços a muitos utilizadores, 24 h","O servidor de e-mail da empresa"],["Embebido","Computador dentro de outro aparelho","Router, câmara IP, impressora"],["Supercomputador / cloud","Cálculos enormes, milhares de máquinas","Centros de dados das grandes empresas"]]},{"tipo":"dica","html":"Quando um técnico diz <i>host</i>, quer dizer qualquer computador que usa a rede: PC, telemóvel, servidor, impressora."},{"tipo":"video","titulo":"O que é um computador e como funciona","busca":"como funciona um computador hardware software explicado para iniciantes","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a ordem do funcionamento de um computador?","opcoes":["Saída → entrada → processamento","Entrada → processamento → saída","Processamento → saída → entrada","Entrada → saída → processamento"],"correta":1,"explica":"Recebe dados, processa e devolve o resultado."},{"tipo":"mc","p":"Que peça perde o conteúdo quando o computador é desligado?","opcoes":["SSD","Disco rígido","Memória RAM","Flash"],"correta":2,"explica":"A RAM é volátil."},{"tipo":"mc","p":"Que peça liga o computador à rede?","opcoes":["Placa de rede (NIC)","Fonte de alimentação","Processador","Placa gráfica"],"correta":0,"explica":"NIC = Network Interface Card."},{"tipo":"vf","p":"Um router é um tipo de computador.","correta":true,"explica":"Tem processador, memória, sistema operativo e interfaces de rede."},{"tipo":"mc","p":"Como se chama o sistema operativo dos routers e switches Cisco?","opcoes":["Android","Windows","IOS","Linux Mint"],"correta":2,"explica":"Cisco IOS (Internetwork Operating System)."}],"referencias":["tanenbaum_org","patterson","netacad_itn"]},{"id":"m0l2","titulo":"A história dos computadores e das redes","minutos":18,"nivel":"básico","objetivos":["Situar no tempo as grandes invenções da informática e das redes","Conhecer a ARPANET, o TCP/IP, a Ethernet e a Web","Perceber porque a Internet funciona como funciona hoje"],"blocos":[{"tipo":"texto","titulo":"Dos cálculos de guerra ao bolso de todos","html":"<p>Os primeiros computadores eletrónicos surgiram nos anos 1940 e ocupavam salas inteiras. O <b>ENIAC</b> (1945, EUA) pesava cerca de 27 toneladas. Nas décadas seguintes, o <b>transístor</b> e o <b>circuito integrado</b> tornaram os computadores mais pequenos, baratos e rápidos. Em 1981 o <b>IBM PC</b> levou o computador pessoal aos escritórios; em 2007 os smartphones puseram um computador ligado à Internet no bolso.</p>"},{"tipo":"figura","nome":"linha_tempo","legenda":"Linha do tempo das redes de computadores."},{"tipo":"tabela","titulo":"Marcos que vale a pena conhecer","cabecalho":["Ano","Acontecimento","Porque importa"],"linhas":[["1945","ENIAC, um dos primeiros computadores eletrónicos","Início da computação eletrónica"],["1961–64","Kleinrock e Baran estudam a comutação de pacotes","Dividir mensagens em pacotes que seguem caminhos diferentes"],["1969","ARPANET liga 4 universidades nos EUA; publicado o RFC 1","A avó da Internet; os RFC ainda hoje definem os protocolos"],["1971","Ray Tomlinson envia o primeiro e-mail em rede e usa o @","A primeira “aplicação de sucesso” das redes"],["1973","Bob Metcalfe cria a Ethernet na Xerox PARC","A tecnologia das redes locais (LAN) que usamos hoje"],["1974","Vint Cerf e Bob Kahn publicam o desenho do TCP","Regras para ligar redes diferentes: inter-net"],["1983","A ARPANET passa a usar TCP/IP; nasce o DNS","Data de nascimento técnica da Internet"],["1984","Fundação da Cisco Systems","Routers comerciais para ligar redes"],["1989–91","Tim Berners-Lee cria a World Wide Web no CERN","Páginas, links e browsers: a Internet para todos"],["1995","A Internet torna-se comercial","Empresas e operadoras levam a Internet às casas"],["1997","Primeira norma Wi-Fi (IEEE 802.11)","Redes sem fios"],["1998","Especificação do IPv6 (RFC 2460)","A resposta ao fim dos endereços IPv4"],["2007","Smartphones com Internet móvel","Milhares de milhões de novos dispositivos ligados"],["2011","A IANA distribui os últimos blocos IPv4","NAT e IPv6 tornam-se obrigatórios"],["2020","Novo exame CCNA 200-301 unificado","A certificação que este curso prepara"]]},{"tipo":"texto","titulo":"Porque foi desenhada assim","html":"<p>A ARPANET foi pensada para continuar a funcionar mesmo que partes da rede falhassem. Por isso:</p>\n<ul>\n<li>Não há um computador central que controla tudo: a rede é <b>distribuída</b>.</li>\n<li>A informação é dividida em <b>pacotes</b>, e cada pacote pode seguir um caminho diferente.</li>\n<li>Os protocolos são <b>abertos</b> (RFC), para que qualquer fabricante os possa implementar.</li>\n</ul>\n<p>Estas três ideias explicam quase tudo o que vai estudar: routers, protocolos de encaminhamento, TCP/IP e normas.</p>"},{"tipo":"exemplo","titulo":"A Internet hoje","html":"<p>Hoje a Internet liga milhares de milhões de dispositivos. É uma <b>rede de redes</b>: a rede da sua casa liga ao seu operador, que liga a outros operadores, a cabos submarinos de fibra ótica entre continentes e aos centros de dados das empresas. Ninguém é “dono” da Internet inteira; há organizações que coordenam as regras (IETF) e a distribuição de endereços (IANA e os registos regionais, como o AFRINIC em África).</p>"},{"tipo":"dica","html":"Não precisa de decorar datas para o exame CCNA. Mas conhecer a história ajuda a perceber <b>porque</b> as coisas são como são."},{"tipo":"video","titulo":"História da Internet","busca":"história da internet ARPANET TCP/IP documentário","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Como se chamava a rede que deu origem à Internet?","opcoes":["Ethernet","ARPANET","Wi-Fi","NSFNET"],"correta":1,"explica":"ARPANET, 1969."},{"tipo":"mc","p":"Quem criou a World Wide Web?","opcoes":["Bill Gates","Tim Berners-Lee","Bob Metcalfe","Vint Cerf"],"correta":1,"explica":"Tim Berners-Lee, no CERN, em 1989–91."},{"tipo":"mc","p":"Que tecnologia de redes locais foi criada por Bob Metcalfe em 1973?","opcoes":["Wi-Fi","Bluetooth","Ethernet","Fibra ótica"],"correta":2,"explica":"Ethernet, na Xerox PARC."},{"tipo":"vf","p":"A Internet foi desenhada com um computador central que controla todos os outros.","correta":false,"explica":"Foi desenhada distribuída, sem ponto central."},{"tipo":"mc","p":"Em que ano a ARPANET adotou o TCP/IP?","opcoes":["1969","1983","1991","2007"],"correta":1,"explica":"1 de janeiro de 1983."}],"referencias":["leiner","isaacson","kurose","cerf_kahn","metcalfe","berners_lee","rfc1"]},{"id":"m0l3","titulo":"Como a informação viaja numa rede","minutos":18,"nivel":"básico","objetivos":["Explicar com analogias o que é endereço IP, MAC, porta e protocolo","Acompanhar uma mensagem do telemóvel até ao destino","Perceber o papel do router, do switch e do DNS"],"blocos":[{"tipo":"texto","titulo":"A rede é como o correio","html":"<p>Imagine que quer enviar uma carta a um amigo noutra cidade. Precisa de:</p>\n<ul>\n<li>uma <b>morada</b> de destino e uma de remetente;</li>\n<li>um <b>carteiro</b> que leve a carta dentro do bairro;</li>\n<li>uma <b>central de correios</b> que decide para que cidade a carta segue;</li>\n<li><b>regras</b> comuns: onde se escreve a morada, onde vai o selo.</li>\n</ul>\n<p>Uma rede de computadores funciona da mesma maneira.</p>"},{"tipo":"tabela","titulo":"A analogia completa","cabecalho":["Na rede","No correio","Exemplo real"],"linhas":[["Endereço IP","A morada (cidade, rua, número)","192.168.1.25"],["Endereço MAC","O nome gravado na caixa de correio, que nunca muda","A4:5E:60:12:9B:3C"],["Porta (TCP/UDP)","O apartamento ou a pessoa dentro da casa","443 = sites seguros (HTTPS)"],["Protocolo","As regras de como escrever e enviar a carta","HTTP, TCP, IP, Wi-Fi"],["Pacote","Uma carta (as mensagens grandes vão em várias)","Uma foto do WhatsApp parte-se em centenas de pacotes"],["Switch","O carteiro do bairro: entrega dentro da mesma rede","O switch do escritório"],["Router","A central de correios: envia para outras cidades (redes)","O router de casa ou do operador"],["DNS","A lista telefónica: nome → morada","google.com → 142.250.x.x"]]},{"tipo":"topologia","nos":[{"id":"tel","tipo":"telefone_ip","x":8,"y":50,"rotulo":"Telemóvel"},{"id":"ap","tipo":"ap","x":30,"y":50,"rotulo":"Wi-Fi de casa"},{"id":"r","tipo":"router","x":52,"y":50,"rotulo":"Router"},{"id":"op","tipo":"nuvem","x":74,"y":50,"rotulo":"Operador / Internet"},{"id":"srv","tipo":"servidor","x":94,"y":50,"rotulo":"Servidor"}],"ligacoes":[{"a":"tel","b":"ap","rotulo":"rádio"},{"a":"ap","b":"r","rotulo":""},{"a":"r","b":"op","rotulo":"fibra"},{"a":"op","b":"srv","rotulo":""}],"legenda":"O caminho de uma mensagem enviada pelo telemóvel."},{"tipo":"exemplo","titulo":"Passo a passo: enviar uma mensagem no WhatsApp","html":"<ol>\n<li>O telemóvel pergunta ao <b>DNS</b> qual é o endereço IP do servidor do WhatsApp.</li>\n<li>A mensagem é dividida em <b>pacotes</b>. Cada um leva o IP de origem (o telemóvel) e o de destino (o servidor).</li>\n<li>Os pacotes vão por <b>Wi-Fi</b> até ao router de casa.</li>\n<li>O <b>router</b> vê que o destino está fora de casa e envia-os para o operador.</li>\n<li>Vários routers da Internet passam os pacotes de mão em mão até ao servidor.</li>\n<li>O servidor junta os pacotes, lê a mensagem e envia-a para o telemóvel do seu amigo pelo mesmo processo.</li>\n</ol>\n<p>Tudo isto demora menos de um segundo!</p>"},{"tipo":"texto","titulo":"Rede local e Internet","html":"<p>A <b>rede local (LAN)</b> é a rede da sua casa, escola ou escritório. A <b>Internet</b> é a ligação entre milhões de redes locais. O router é a fronteira entre as duas: por isso se chama <b>gateway</b> (porta de saída).</p>"},{"tipo":"dica","html":"Experimente: no Windows abra o <i>Prompt de Comando</i> e escreva <code>ipconfig</code>. No Android: Definições › Wi-Fi › (a sua rede) › Avançado. Vai ver o seu endereço IP e o do gateway."},{"tipo":"video","titulo":"Como a Internet funciona","busca":"como funciona a internet pacotes router explicação simples","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Na analogia do correio, o endereço IP é…","opcoes":["O selo","A morada","O carteiro","A lista telefónica"],"correta":1,"explica":"O IP indica onde está o destino."},{"tipo":"mc","p":"Que serviço traduz nomes como google.com em endereços IP?","opcoes":["DHCP","DNS","Wi-Fi","MAC"],"correta":1,"explica":"O DNS é a lista telefónica da Internet."},{"tipo":"mc","p":"Que equipamento envia os pacotes para outras redes?","opcoes":["Switch","Router","Cabo","Impressora"],"correta":1,"explica":"O router liga redes diferentes."},{"tipo":"vf","p":"Uma foto grande é enviada pela rede num único pacote.","correta":false,"explica":"É dividida em muitos pacotes e reconstruída no destino."},{"tipo":"mc","p":"O que é o gateway?","opcoes":["O nome do Wi-Fi","O router que dá saída para fora da rede local","O cabo de rede","A palavra-passe do Wi-Fi"],"correta":1,"explica":"Gateway = porta de saída da rede local."}],"referencias":["kurose","tanenbaum","netacad_itn"]},{"id":"m0l4","titulo":"Os números das redes: binário, hexadecimal e velocidades","minutos":20,"nivel":"básico","objetivos":["Perceber porque os computadores usam binário","Converter números pequenos entre decimal, binário e hexadecimal","Distinguir bit de byte e Mbit/s de MB/s"],"blocos":[{"tipo":"texto","titulo":"Porquê zeros e uns","html":"<p>Dentro de um computador tudo é eletricidade: há sinal (<b>1</b>) ou não há (<b>0</b>). Cada 0 ou 1 é um <b>bit</b>. Um conjunto de 8 bits é um <b>byte</b>. Com 8 bits podemos representar 256 valores (0 a 255) — por isso cada parte de um endereço IPv4 vai de 0 a 255!</p>"},{"tipo":"tabela","titulo":"Cada posição vale o dobro da anterior","cabecalho":["Bit","128","64","32","16","8","4","2","1"],"linhas":[["5 =","0","0","0","0","0","1","0","1"],["10 =","0","0","0","0","1","0","1","0"],["100 =","0","1","1","0","0","1","0","0"],["255 =","1","1","1","1","1","1","1","1"]]},{"tipo":"exemplo","titulo":"Converter 13 para binário","html":"<p>Procure da esquerda para a direita os valores que cabem: 13 = <b>8</b> + <b>4</b> + <b>1</b>. Marque 1 nessas posições e 0 nas outras: <code>00001101</code>.</p>\n<p>Ao contrário: <code>00010010</code> = 16 + 2 = <b>18</b>.</p>"},{"tipo":"texto","titulo":"Hexadecimal: base 16","html":"<p>O hexadecimal usa 16 símbolos: 0–9 e <b>A=10, B=11, C=12, D=13, E=14, F=15</b>. Cada dígito hexadecimal representa exatamente 4 bits, por isso é uma forma curta de escrever binário. Vai encontrá-lo nos endereços <b>MAC</b> (<code>00:1A:2B:…</code>) e no <b>IPv6</b> (<code>2001:db8::1</code>).</p>\n<p>Exemplo: <code>1111 1010</code> = F A = <b>FA</b> = 250 em decimal.</p>"},{"tipo":"tabela","titulo":"Bits e bytes","cabecalho":["Unidade","Valor","Onde aparece"],"linhas":[["bit (b)","0 ou 1","Velocidades: Mbit/s, Gbit/s"],["byte (B)","8 bits","Tamanho de ficheiros: MB, GB"],["kbit/s, Mbit/s, Gbit/s","mil, milhão, mil milhões de bits por segundo","Velocidade da Internet e das portas"],["KB, MB, GB, TB","Mil, milhão, mil milhões, bilião de bytes","Disco, fotos, vídeos"]]},{"tipo":"exemplo","titulo":"Quanto tempo demora a descarregar um filme?","html":"<p>Um filme de <b>1 GB</b> = 1000 MB = <b>8000 Mbit</b>. Com uma Internet de <b>100 Mbit/s</b>: 8000 ÷ 100 = <b>80 segundos</b> (na prática um pouco mais, por causa dos cabeçalhos e de outros utilizadores).</p>\n<p>Atenção: os operadores anunciam velocidades em <b>bits</b>; o computador mostra downloads em <b>bytes</b>. 100 Mbit/s ≈ 12,5 MB/s.</p>"},{"tipo":"dica","html":"Use a calculadora do Windows em modo <i>Programador</i> para conferir as conversões enquanto pratica."},{"tipo":"video","titulo":"Binário e hexadecimal para iniciantes","busca":"sistema binário hexadecimal explicado iniciantes redes","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantos bits tem um byte?","opcoes":["4","8","16","32"],"correta":1,"explica":"1 byte = 8 bits."},{"tipo":"mc","p":"Quanto é 00001010 em decimal?","opcoes":["8","10","12","20"],"correta":1,"explica":"8 + 2 = 10."},{"tipo":"mc","p":"Qual o maior valor que cabe em 8 bits?","opcoes":["128","200","255","256"],"correta":2,"explica":"11111111 = 255 (são 256 valores contando o 0)."},{"tipo":"mc","p":"Quanto vale F em hexadecimal?","opcoes":["10","14","15","16"],"correta":2,"explica":"A=10 … F=15."},{"tipo":"mc","p":"Uma Internet de 80 Mbit/s descarrega aproximadamente quantos MB por segundo?","opcoes":["80","10","640","8"],"correta":1,"explica":"80 ÷ 8 = 10 MB/s."}],"referencias":["tanenbaum_org","odom1","netacad_itn"]}],"prova_extra":[{"tipo":"mc","p":"Um colega diz que o router da empresa “não é um computador porque não tem ecrã”. O que responde?","opcoes":["Tem razão","É um computador embebido: tem CPU, memória e sistema operativo","É apenas um cabo inteligente","Só os servidores são computadores"],"correta":1,"explica":"Ter ecrã não é requisito; routers são computadores especializados."},{"tipo":"mc","p":"Qual destas ideias faz parte do desenho original da Internet?","opcoes":["Um controlador central único","Comutação de pacotes e rede distribuída","Só cabos de cobre","Endereços com nomes, sem números"],"correta":1,"explica":"Pacotes que podem seguir caminhos diferentes numa rede distribuída."},{"tipo":"vf","p":"O endereço MAC é escrito em hexadecimal.","correta":true,"explica":"Ex.: 00:1A:2B:3C:4D:5E."}]},{"id":"m1","numero":1,"titulo":"Fundamentos de Redes","descricao":"O ponto de partida: o que é uma rede, que equipamentos existem, como se ligam e que cabos usam.","dominio":"1.0 Network Fundamentals","icone":"nuvem","licoes":[{"id":"m1l0","titulo":"Comece por aqui: redes à nossa volta","minutos":10,"nivel":"básico","objetivos":["Reconhecer redes no dia a dia","Conhecer as palavras-chave do módulo"],"blocos":[{"tipo":"texto","titulo":"Já usa redes todos os dias","html":"<p>Quando paga com cartão numa loja, o terminal fala com o banco por uma rede. Quando vê uma série, o vídeo chega por uma rede. No hospital, o resultado da análise aparece no computador do médico porque o laboratório e o consultório estão na mesma rede.</p>\n<p>Uma rede é simplesmente <b>equipamentos ligados para partilhar informação</b>. Neste módulo vai conhecer as peças: que equipamentos existem, como se ligam e que cabos usam.</p>"},{"tipo":"tabela","titulo":"Palavras que vai encontrar","cabecalho":["Palavra","Em linguagem simples"],"linhas":[["Rede","Equipamentos ligados que trocam informação"],["Host","Qualquer equipamento do utilizador: PC, telemóvel, impressora"],["Switch","Caixa com muitas portas que liga os equipamentos do mesmo local"],["Router","Equipamento que liga uma rede a outra (por exemplo, à Internet)"],["Access point","Antena que cria o Wi-Fi"],["Cabo UTP","O cabo de rede “normal”, com ficha RJ45"],["Fibra ótica","Cabo que transporta luz, para longas distâncias"]]},{"tipo":"topologia","nos":[{"id":"pc","tipo":"pc","x":10,"y":30,"rotulo":"Caixa"},{"id":"imp","tipo":"pc","x":10,"y":80,"rotulo":"Escritório"},{"id":"sw","tipo":"switch","x":42,"y":55,"rotulo":"Switch"},{"id":"ap","tipo":"ap","x":42,"y":10,"rotulo":"Wi-Fi"},{"id":"r","tipo":"router","x":70,"y":55,"rotulo":"Router"},{"id":"net","tipo":"nuvem","x":92,"y":55,"rotulo":"Banco / Internet"}],"ligacoes":[{"a":"pc","b":"sw","rotulo":""},{"a":"imp","b":"sw","rotulo":""},{"a":"ap","b":"sw","rotulo":""},{"a":"sw","b":"r","rotulo":""},{"a":"r","b":"net","rotulo":""}],"legenda":"A rede de uma pequena loja: dois computadores, Wi-Fi para os clientes e ligação à Internet."},{"tipo":"exemplo","titulo":"Pense na sua casa","html":"<p>A “caixa” que o operador instalou faz quase tudo: é <b>router</b> (liga à Internet), <b>switch</b> (tem 4 portas de cabo), <b>access point</b> (cria o Wi-Fi) e <b>firewall</b> (bloqueia acessos de fora). Numa empresa, cada uma destas funções é um equipamento separado e mais potente.</p>"},{"tipo":"video","titulo":"Redes de computadores para iniciantes","busca":"redes de computadores para iniciantes aula 1","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Na “caixa” de Internet de casa, que função cria o Wi-Fi?","opcoes":["Switch","Access point","Firewall","Cabo"],"correta":1,"explica":"O access point emite o sinal sem fios."},{"tipo":"vf","p":"Um switch serve para ligar equipamentos do mesmo local.","correta":true,"explica":"Liga os equipamentos da rede local."},{"tipo":"mc","p":"Que equipamento liga a rede da loja à rede do banco?","opcoes":["Switch","Impressora","Router","Monitor"],"correta":2,"explica":"Ligar redes diferentes é o papel do router."}],"referencias":["netacad_itn","kurose"]},{"id":"m1l1","titulo":"O que é uma rede de computadores","minutos":12,"nivel":"básico","objetivos":["Explicar o que é uma rede e para que serve","Distinguir cliente, servidor e dispositivo intermediário","Reconhecer LAN, WAN, MAN, WLAN e a Internet"],"blocos":[{"tipo":"texto","titulo":"A ideia central","html":"<p>Uma <b>rede de computadores</b> é um conjunto de dispositivos ligados entre si para <b>partilhar informação e recursos</b>: ficheiros, impressoras, acesso à Internet, aplicações, voz e vídeo.</p>\n<p>Toda a rede tem sempre três ingredientes:</p>\n<ul>\n<li><b>Dispositivos finais</b> (hosts): onde a informação nasce ou termina — PCs, portáteis, telemóveis, servidores, câmaras IP, impressoras.</li>\n<li><b>Dispositivos intermediários</b>: encaminham a informação — switches, routers, access points, firewalls.</li>\n<li><b>Meios</b>: o caminho físico — cabo de cobre, fibra ótica ou ondas de rádio (Wi-Fi).</li>\n</ul>\n<p>E há sempre <b>regras</b> combinadas, os <b>protocolos</b>, que definem como falar: formato das mensagens, endereços, ordem, tempos e o que fazer quando algo falha.</p>"},{"tipo":"topologia","nos":[{"id":"pc1","tipo":"pc","x":10,"y":30,"rotulo":"PC"},{"id":"pc2","tipo":"portatil","x":10,"y":75,"rotulo":"Portátil"},{"id":"sw","tipo":"switch","x":40,"y":52,"rotulo":"Switch"},{"id":"r","tipo":"router","x":68,"y":52,"rotulo":"Router"},{"id":"net","tipo":"nuvem","x":92,"y":52,"rotulo":"Internet"},{"id":"srv","tipo":"servidor","x":40,"y":10,"rotulo":"Servidor"}],"ligacoes":[{"a":"pc1","b":"sw","rotulo":""},{"a":"pc2","b":"sw","rotulo":""},{"a":"srv","b":"sw","rotulo":""},{"a":"sw","b":"r","rotulo":""},{"a":"r","b":"net","rotulo":"WAN"}],"legenda":"Uma pequena rede de escritório: hosts ligados a um switch (LAN) e um router que dá saída para a Internet (WAN)."},{"tipo":"texto","titulo":"Cliente e servidor","html":"<p>Um <b>servidor</b> é um host que oferece um serviço (páginas web, e-mail, ficheiros). Um <b>cliente</b> é quem pede esse serviço. O mesmo computador pode ser cliente e servidor ao mesmo tempo.</p>\n<p>Numa rede <b>peer-to-peer</b> (P2P) todos partilham diretamente uns com os outros, sem servidor dedicado. É simples para casa, mas difícil de gerir e proteger numa empresa.</p>"},{"tipo":"tabela","titulo":"Tipos de rede por alcance","cabecalho":["Tipo","Alcance","Exemplo"],"linhas":[["LAN","Um edifício ou piso","A rede do escritório ou da escola"],["WLAN","Igual à LAN, sem fios","O Wi-Fi da empresa"],["MAN","Uma cidade","Fibra que liga os campus de uma universidade"],["WAN","Países e continentes","Ligação entre a sede e as filiais"],["Internet","Mundial","A rede de redes que liga milhões de WANs e LANs"]]},{"tipo":"exemplo","titulo":"No dia a dia","html":"<p>Quando abre o YouTube no telemóvel em casa: o telemóvel (host) fala por Wi-Fi (meio) com o router doméstico (intermediário), que encaminha os pedidos para o operador (WAN) e daí pela Internet até aos servidores do YouTube. Dezenas de protocolos trabalham juntos: Wi-Fi, IP, TCP/QUIC, DNS, HTTPS.</p>"},{"tipo":"texto","titulo":"Características de uma boa rede","html":"<ul>\n<li><b>Tolerância a falhas</b>: caminhos redundantes para que uma avaria não pare tudo.</li>\n<li><b>Escalabilidade</b>: crescer sem refazer a rede.</li>\n<li><b>Qualidade de serviço (QoS)</b>: dar prioridade a voz e vídeo.</li>\n<li><b>Segurança</b>: confidencialidade, integridade e disponibilidade (a tríade CIA).</li>\n</ul>"},{"tipo":"dica","html":"No exame CCNA, “host” e “dispositivo final” querem dizer a mesma coisa. Switches e routers <b>não</b> são hosts."},{"tipo":"video","titulo":"Introdução às redes de computadores","busca":"introdução redes de computadores CCNA aula 1","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual destes é um dispositivo intermediário?","opcoes":["Impressora de rede","Switch","Servidor web","Telemóvel"],"correta":1,"explica":"Switches, routers, APs e firewalls encaminham tráfego: são intermediários. Os outros são dispositivos finais."},{"tipo":"mc","p":"Uma rede que cobre apenas um edifício chama-se…","opcoes":["WAN","MAN","LAN","PAN"],"correta":2,"explica":"LAN = Local Area Network, uma rede local de alcance limitado (sala, piso, edifício)."},{"tipo":"vf","p":"Um computador pode ser cliente e servidor ao mesmo tempo.","correta":true,"explica":"Sim. Um PC pode partilhar uma pasta (servidor) enquanto navega na web (cliente)."},{"tipo":"mc","p":"O conjunto de regras que define como os dispositivos comunicam chama-se…","opcoes":["Topologia","Protocolo","Meio","Largura de banda"],"correta":1,"explica":"Protocolos definem formato, ordem e significado das mensagens."},{"tipo":"vf","p":"Fibra ótica, cobre e Wi-Fi são exemplos de meios de transmissão.","correta":true,"explica":"São os três grandes tipos de meio: elétrico (cobre), luz (fibra) e rádio (sem fios)."}],"referencias":["netacad_itn","kurose","tanenbaum","odom1"]},{"id":"m1l2","titulo":"Equipamentos de rede: conheça cada um","minutos":15,"nivel":"básico","objetivos":["Identificar router, switch, AP, WLC e firewall pelo aspeto e função","Reconhecer as portas de um switch e de um router Cisco","Saber em que camada trabalha cada equipamento"],"blocos":[{"tipo":"figura","nome":"painel_switch","legenda":"Frente de um switch de acesso de 24 portas (estilo Catalyst): portas RJ45 com LEDs, portas uplink SFP e porta de consola."},{"tipo":"texto","titulo":"Switch","html":"<p>O <b>switch</b> liga os dispositivos <b>dentro da mesma LAN</b>. Aprende o endereço <b>MAC</b> de quem está ligado em cada porta e envia cada trama apenas para a porta certa. Trabalha na <b>camada 2</b> (ligação de dados).</p>\n<p>Um <b>switch multicamada (L3)</b> também consegue encaminhar entre redes IP, como um router — muito usado no núcleo das redes empresariais.</p>"},{"tipo":"figura","nome":"painel_router","legenda":"Traseira de um router de filial (estilo ISR): portas GigabitEthernet, slots para módulos WAN, consola RJ45, consola USB e AUX."},{"tipo":"texto","titulo":"Router","html":"<p>O <b>router</b> liga <b>redes diferentes</b> entre si (por exemplo a LAN à Internet) e escolhe o melhor caminho para cada pacote com base no endereço <b>IP</b> de destino e na <b>tabela de encaminhamento</b>. Trabalha na <b>camada 3</b> (rede).</p>"},{"tipo":"tabela","titulo":"Resumo dos equipamentos","cabecalho":["Equipamento","Camada OSI","Decide com base em","Símbolo"],"linhas":[["Hub (obsoleto)","1","Nada — repete para todas as portas","—"],["Switch","2","Endereço MAC","Quadrado com setas"],["Router","3","Endereço IP","Círculo com setas"],["Switch L3","2 e 3","MAC e IP","Quadrado com setas e círculo"],["Firewall","3 a 7","Regras e estado das ligações","Muro de tijolos"],["Access Point","1 e 2","Liga clientes Wi-Fi à rede com fios","Antena/ondas"]]},{"tipo":"topologia","nos":[{"id":"r","tipo":"router","x":15,"y":50,"rotulo":"Router"},{"id":"sw","tipo":"switch","x":38,"y":50,"rotulo":"Switch"},{"id":"l3","tipo":"switch_l3","x":62,"y":50,"rotulo":"Switch L3"},{"id":"fw","tipo":"firewall","x":85,"y":50,"rotulo":"Firewall"},{"id":"ap","tipo":"ap","x":38,"y":12,"rotulo":"AP"},{"id":"wlc","tipo":"wlc","x":62,"y":12,"rotulo":"WLC"}],"ligacoes":[],"legenda":"Os ícones usados nos diagramas de rede (e nesta app)."},{"tipo":"texto","titulo":"Access Point, WLC e firewall","html":"<ul>\n<li><b>Access Point (AP)</b>: liga clientes sem fios à rede cabeada. Pode ser <i>autónomo</i> (configurado um a um) ou <i>leve</i> (lightweight), gerido por um controlador.</li>\n<li><b>WLC (Wireless LAN Controller)</b>: gere centenas de APs de forma centralizada: SSIDs, segurança, canais e potência.</li>\n<li><b>Firewall</b>: filtra o tráfego segundo regras e acompanha o estado das ligações. Os <b>NGFW</b> (next-generation) também inspecionam aplicações e bloqueiam ameaças (IPS).</li>\n</ul>"},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["No Packet Tracer arrasta o equipamento e liga cabos com um clique.","Os módulos (placas) adicionam-se com o equipamento desligado, no separador Physical.","As luzes das portas ficam verdes quase de imediato."],"real":["Equipamentos reais vão num bastidor (rack) de 19 polegadas, com parafusos e calhas.","Precisa de alimentação adequada, ventilação e, idealmente, UPS.","Os LEDs das portas ficam âmbar ~30 s enquanto o STP verifica a porta, antes de ficarem verdes.","Módulos SFP têm de ser compatíveis com o modelo (algumas plataformas recusam SFP de terceiros)."]},{"tipo":"dica","html":"Pelo símbolo: <b>router = círculo</b>, <b>switch = quadrado</b>. É assim em quase todos os diagramas do exame."},{"tipo":"video","titulo":"Dispositivos de rede: router, switch, AP","busca":"router vs switch vs access point explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Que equipamento decide o encaminhamento com base no endereço IP?","opcoes":["Switch L2","Hub","Router","Access Point"],"correta":2,"explica":"O router trabalha na camada 3 e usa a tabela de encaminhamento com endereços IP."},{"tipo":"mc","p":"O switch aprende e usa qual endereço?","opcoes":["IP","MAC","Porta TCP","URL"],"correta":1,"explica":"O switch constrói a tabela de endereços MAC e encaminha tramas pela porta certa."},{"tipo":"mc","p":"Que equipamento gere muitos APs de forma centralizada?","opcoes":["WLC","NGFW","Hub","Modem"],"correta":0,"explica":"O Wireless LAN Controller gere APs leves (lightweight) de forma central."},{"tipo":"vf","p":"Um switch multicamada consegue encaminhar tráfego entre redes IP.","correta":true,"explica":"O switch L3 combina comutação (L2) e encaminhamento (L3)."},{"tipo":"vf","p":"Em equipamentos reais as portas de um switch Cisco ficam verdes imediatamente ao ligar um PC.","correta":false,"explica":"Com STP normal a porta passa por listening/learning (~30 s) e fica âmbar até ir para forwarding."}],"referencias":["odom1","netacad_itn","lammle"]},{"id":"m1l3","titulo":"Topologias e arquiteturas","minutos":12,"nivel":"básico","objetivos":["Desenhar topologias física e lógica","Comparar estrela, malha, barramento e anel","Conhecer as arquiteturas de 2 e 3 camadas, spine-leaf, SOHO e WAN"],"blocos":[{"tipo":"texto","titulo":"Topologia física e lógica","html":"<p>A <b>topologia física</b> mostra onde estão os equipamentos e por onde passam os cabos. A <b>topologia lógica</b> mostra como os dados circulam: redes IP, VLANs, rotas.</p>"},{"tipo":"tabela","titulo":"Topologias clássicas","cabecalho":["Topologia","Como é","Vantagem","Desvantagem"],"linhas":[["Estrela","Todos ligados a um ponto central (switch)","Simples; um cabo avariado afeta só um host","O ponto central é crítico"],["Estrela estendida","Várias estrelas ligadas entre si","Escala bem","Mais equipamentos"],["Malha completa","Todos ligados a todos","Máxima redundância","Cara: n(n-1)/2 ligações"],["Malha parcial","Só os caminhos críticos são redundantes","Equilíbrio custo/redundância","Mais complexa"],["Barramento / Anel","Cabo partilhado / círculo","Históricas","Uma falha pode parar tudo"]]},{"tipo":"exemplo","titulo":"Quantas ligações tem uma malha completa?","html":"<p>Fórmula: <code>n × (n − 1) / 2</code>. Com 5 routers: 5 × 4 / 2 = <b>10 ligações</b>. Com 10 routers: <b>45</b>. Por isso a malha completa só se usa onde a redundância vale o custo (núcleo, WAN crítica).</p>"},{"tipo":"topologia","nos":[{"id":"c1","tipo":"switch_l3","x":35,"y":10,"rotulo":"Núcleo 1"},{"id":"c2","tipo":"switch_l3","x":65,"y":10,"rotulo":"Núcleo 2"},{"id":"d1","tipo":"switch_l3","x":20,"y":45,"rotulo":"Distrib. 1"},{"id":"d2","tipo":"switch_l3","x":80,"y":45,"rotulo":"Distrib. 2"},{"id":"a1","tipo":"switch","x":8,"y":85,"rotulo":"Acesso"},{"id":"a2","tipo":"switch","x":36,"y":85,"rotulo":"Acesso"},{"id":"a3","tipo":"switch","x":64,"y":85,"rotulo":"Acesso"},{"id":"a4","tipo":"switch","x":92,"y":85,"rotulo":"Acesso"}],"ligacoes":[{"a":"c1","b":"c2","rotulo":""},{"a":"c1","b":"d1","rotulo":""},{"a":"c1","b":"d2","rotulo":""},{"a":"c2","b":"d1","rotulo":""},{"a":"c2","b":"d2","rotulo":""},{"a":"d1","b":"a1","rotulo":""},{"a":"d1","b":"a2","rotulo":""},{"a":"d2","b":"a3","rotulo":""},{"a":"d2","b":"a4","rotulo":""},{"a":"d1","b":"d2","rotulo":""}],"legenda":"Arquitetura hierárquica de 3 camadas: núcleo (core), distribuição e acesso."},{"tipo":"texto","titulo":"Arquiteturas do exame CCNA","html":"<ul>\n<li><b>3 camadas</b>: <i>acesso</i> (onde ligam os utilizadores), <i>distribuição</i> (políticas, encaminhamento entre VLANs) e <i>núcleo</i> (transporte rápido). Para campus grandes.</li>\n<li><b>2 camadas / núcleo colapsado</b>: distribuição e núcleo no mesmo par de switches. Para campus médios.</li>\n<li><b>Spine-leaf</b>: centros de dados. Cada <i>leaf</i> liga-se a <b>todos</b> os <i>spines</i>; leaf nunca liga a leaf, spine nunca liga a spine. Latência previsível: sempre 2 saltos.</li>\n<li><b>SOHO</b> (Small Office/Home Office): um único equipamento faz de router, switch, AP e firewall.</li>\n<li><b>WAN</b>: ligações entre locais — MPLS, Internet com VPN, SD-WAN, fibra dedicada.</li>\n<li><b>On-premises vs cloud</b>: servidores na própria empresa ou em fornecedores (IaaS, PaaS, SaaS).</li>\n</ul>"},{"tipo":"topologia","nos":[{"id":"s1","tipo":"switch_l3","x":30,"y":12,"rotulo":"Spine 1"},{"id":"s2","tipo":"switch_l3","x":70,"y":12,"rotulo":"Spine 2"},{"id":"l1","tipo":"switch","x":12,"y":75,"rotulo":"Leaf 1"},{"id":"l2","tipo":"switch","x":37,"y":75,"rotulo":"Leaf 2"},{"id":"l3","tipo":"switch","x":63,"y":75,"rotulo":"Leaf 3"},{"id":"l4","tipo":"switch","x":88,"y":75,"rotulo":"Leaf 4"}],"ligacoes":[{"a":"s1","b":"l1","rotulo":""},{"a":"s1","b":"l2","rotulo":""},{"a":"s1","b":"l3","rotulo":""},{"a":"s1","b":"l4","rotulo":""},{"a":"s2","b":"l1","rotulo":""},{"a":"s2","b":"l2","rotulo":""},{"a":"s2","b":"l3","rotulo":""},{"a":"s2","b":"l4","rotulo":""}],"legenda":"Spine-leaf: todos os leaf ligados a todos os spine."},{"tipo":"dica","html":"Pergunta frequente: “numa arquitetura spine-leaf, um leaf liga-se a outro leaf?” — <b>Não</b>."},{"tipo":"video","titulo":"Arquitetura de 3 camadas e spine-leaf","busca":"CCNA network topology architectures spine leaf three tier","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantas ligações tem uma malha completa com 6 routers?","opcoes":["12","15","30","36"],"correta":1,"explica":"6 × 5 / 2 = 15."},{"tipo":"mc","p":"Em spine-leaf, cada leaf liga-se a…","opcoes":["Outro leaf","Todos os spines","Apenas um spine","Ao router de Internet"],"correta":1,"explica":"Cada leaf liga-se a todos os spines; nunca leaf-leaf nem spine-spine."},{"tipo":"mc","p":"Que camada da arquitetura hierárquica liga os utilizadores finais?","opcoes":["Núcleo","Distribuição","Acesso","Spine"],"correta":2,"explica":"A camada de acesso é onde se ligam PCs, telefones IP e APs."},{"tipo":"vf","p":"No núcleo colapsado, distribuição e núcleo estão nos mesmos equipamentos.","correta":true,"explica":"É a arquitetura de 2 camadas, típica de campus médios."},{"tipo":"mc","p":"Na topologia em estrela, se o cabo de um PC avariar…","opcoes":["Toda a rede para","Só esse PC fica sem rede","O switch reinicia","Formam-se loops"],"correta":1,"explica":"Cada host tem o seu próprio cabo até ao ponto central."}],"referencias":["odom1","netacad_itn","cisco_exam"]},{"id":"m1l4","titulo":"Cabos, conectores e meios","minutos":15,"nivel":"básico","objetivos":["Escolher entre UTP, fibra monomodo e multimodo","Saber quando usar cabo direto ou cruzado e o papel do Auto-MDIX","Ligar-se a um equipamento Cisco pela consola"],"blocos":[{"tipo":"figura","nome":"cabo_utp","legenda":"Cabo UTP com conector RJ45: 4 pares de fios entrançados."},{"tipo":"texto","titulo":"Cobre: UTP","html":"<p>O cabo <b>UTP</b> (par entrançado não blindado) tem 4 pares de fios. O entrançado reduz interferências (crosstalk). Distância máxima típica: <b>100 m</b>.</p>"},{"tipo":"tabela","titulo":"Categorias de cabo UTP","cabecalho":["Categoria","Velocidade típica","Norma Ethernet"],"linhas":[["Cat 5e","1 Gbit/s","1000BASE-T"],["Cat 6","1 Gbit/s (10 Gbit/s até ~55 m)","1000BASE-T / 10GBASE-T"],["Cat 6a","10 Gbit/s até 100 m","10GBASE-T"],["Cat 8","25/40 Gbit/s até 30 m","25G/40GBASE-T (centros de dados)"]]},{"tipo":"figura","nome":"rj45_pinos","legenda":"Esquemas de cravação T568A e T568B."},{"tipo":"texto","titulo":"Direto, cruzado e Auto-MDIX","html":"<p>Em 10/100 Mbit/s o PC transmite nos pinos 1-2 e o switch recebe nesses pinos. Por isso:</p>\n<ul>\n<li><b>Cabo direto</b> (B-B): equipamentos <i>diferentes</i> — PC↔switch, router↔switch.</li>\n<li><b>Cabo cruzado</b> (A-B): equipamentos <i>iguais</i> — switch↔switch, PC↔PC, router↔PC.</li>\n</ul>\n<p>Hoje quase todas as portas têm <b>Auto-MDIX</b>, que deteta e corrige automaticamente. Ainda assim, o exame pergunta a regra.</p>"},{"tipo":"figura","nome":"cabo_fibra","legenda":"Fibra ótica com conectores LC duplex e um módulo SFP."},{"tipo":"tabela","titulo":"Fibra ótica","cabecalho":["","Multimodo (MMF)","Monomodo (SMF)"],"linhas":[["Núcleo","50 ou 62,5 µm","~9 µm"],["Fonte de luz","LED / VCSEL","Laser"],["Distância","Centenas de metros","Dezenas de km"],["Custo","Mais barato","Mais caro"],["Uso típico","Dentro do edifício","Entre edifícios, WAN, operadores"]]},{"tipo":"figura","nome":"cabo_consola","legenda":"Cabo de consola (rollover) RJ45 ↔ DB9 e a alternativa USB."},{"tipo":"cli","titulo":"Aceder pela consola (primeira configuração)","passos":[{"prompt":"PC","cmd":"Ligar o cabo de consola à porta CONSOLE","explica":"Use rollover RJ45-DB9 + adaptador USB-série, ou cabo USB mini-B/USB-C."},{"prompt":"PC","cmd":"Abrir PuTTY/Tera Term na porta COMx (ou /dev/ttyUSB0)","explica":"Velocidade 9600, 8 bits de dados, sem paridade, 1 stop bit, sem controlo de fluxo (9600 8N1)."},{"prompt":"Switch>","cmd":"enable","explica":"Entra no modo privilegiado."}],"nota":"No Packet Tracer basta escolher o cabo azul claro <i>Console</i> e abrir Desktop › Terminal."},{"tipo":"sim_real","titulo":"Simulador × Equipamento real","simulador":["Cabo errado (direto vs cruzado) muitas vezes funciona na mesma ou a ligação fica vermelha — corrige com um clique.","A consola abre com um clique no separador CLI.","Não existem problemas de cabo mal cravado ou interferências."],"real":["Precisa de adaptador USB-série e do driver correto (veja o Gestor de Dispositivos para saber o número COM).","Velocidade errada mostra caracteres estranhos no terminal: confirme 9600 8N1.","Cabos mal cravados causam erros CRC e ligações instáveis: teste com um testador de cabos.","Fibra: nunca olhe diretamente para o conector (laser invisível) e mantenha as pontas limpas."]},{"tipo":"alerta","html":"A velocidade e o duplex têm de coincidir nas duas pontas. <i>Duplex mismatch</i> (um lado full, outro half) causa colisões tardias e lentidão — prefira <code>auto</code> nos dois lados."},{"tipo":"video","titulo":"Cabos de rede e fibra ótica","busca":"cabo UTP direto cruzado fibra monomodo multimodo explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a distância máxima típica de um cabo UTP Ethernet?","opcoes":["10 m","55 m","100 m","2 km"],"correta":2,"explica":"As normas 10/100/1000BASE-T definem 100 m por segmento."},{"tipo":"mc","p":"Para ligar dois switches antigos sem Auto-MDIX deve usar…","opcoes":["Cabo direto","Cabo cruzado","Cabo de consola","Cabo serial"],"correta":1,"explica":"Equipamentos iguais usam cabo cruzado."},{"tipo":"mc","p":"Que fibra é usada para ligar edifícios a vários km de distância?","opcoes":["Multimodo","Monomodo","UTP Cat 6","Coaxial"],"correta":1,"explica":"A fibra monomodo usa laser e núcleo fino, alcançando dezenas de km."},{"tipo":"mc","p":"Configuração padrão da porta de consola Cisco:","opcoes":["115200 8N1","9600 8N1","9600 7E1","57600 8N2"],"correta":1,"explica":"9600 bit/s, 8 bits de dados, sem paridade, 1 stop bit."},{"tipo":"vf","p":"Auto-MDIX permite usar cabo direto entre dois switches.","correta":true,"explica":"A porta deteta e troca os pares de transmissão/receção automaticamente."}],"referencias":["tia568","ieee8023","odom1","netacad_itn"]}],"prova_extra":[{"tipo":"mc","p":"Um portátil está a 140 m do switch mais próximo, num armazém. Qual a melhor solução cabeada?","opcoes":["UTP Cat 6 direto","Fibra multimodo ou um switch intermédio","Cabo de consola","UTP Cat 5e cruzado"],"correta":1,"explica":"UTP só garante 100 m. Use fibra ou coloque um switch a meio caminho."},{"tipo":"vf","p":"Uma firewall de próxima geração (NGFW) pode identificar aplicações e funcionar como IPS.","correta":true,"explica":"É o que distingue uma NGFW de uma firewall tradicional de portas/endereços."},{"tipo":"mc","p":"Qual destes é um exemplo de SaaS?","opcoes":["Uma VM numa cloud pública","Office 365 / Gmail","Uma plataforma para fazer deploy de código","Um switch físico"],"correta":1,"explica":"SaaS é software pronto a usar; IaaS dá VMs; PaaS dá plataforma de desenvolvimento."}]},{"id":"m2","numero":2,"titulo":"Modelos OSI e TCP/IP","descricao":"Como a comunicação se organiza em camadas: encapsulamento, TCP e UDP, Ethernet, MAC e ARP.","dominio":"1.0 Network Fundamentals","icone":"osi","licoes":[{"id":"m2l0","titulo":"Comece por aqui: porque a comunicação tem regras e camadas","minutos":10,"nivel":"básico","objetivos":["Perceber a ideia de camadas com uma analogia","Saber o que é um protocolo"],"blocos":[{"tipo":"texto","titulo":"Enviar uma encomenda","html":"<p>Para enviar uma encomenda: <b>1)</b> escolhe o presente, <b>2)</b> embala-o, <b>3)</b> escreve a morada na etiqueta, <b>4)</b> a transportadora põe-no num camião, <b>5)</b> o camião anda pela estrada. Cada passo tem a sua tarefa e não precisa de saber como funcionam os outros: o motorista não abre a caixa.</p>\n<p>Nas redes é igual. Cada <b>camada</b> trata de uma parte: a aplicação cria a mensagem, o transporte garante que chega inteira, a camada de rede põe a morada (IP), a ligação de dados entrega ao vizinho seguinte e a camada física transforma tudo em sinais.</p>"},{"tipo":"tabela","titulo":"","cabecalho":["Passo da encomenda","Camada de rede"],"linhas":[["O presente","Dados da aplicação (a mensagem)"],["A caixa com nota “frágil, confirmar receção”","Transporte (TCP): confirmações e ordem"],["A etiqueta com a morada","Rede (IP): endereço de origem e destino"],["O camião entre dois armazéns","Ligação de dados (Ethernet/Wi-Fi): de um equipamento ao seguinte"],["A estrada","Física: cabo, fibra, ondas de rádio"]]},{"tipo":"texto","titulo":"O que é um protocolo","html":"<p>Um <b>protocolo</b> é um conjunto de regras combinadas, como as regras de trânsito ou a forma de começar um telefonema (“Estou? / Sim, diga.”). Exemplos: <b>HTTP</b> (páginas web), <b>TCP</b> (entrega fiável), <b>IP</b> (endereços), <b>Ethernet</b> (rede com cabo).</p>"},{"tipo":"dica","html":"Sempre que algo não funciona, os técnicos perguntam “em que camada está o problema?”. É o método que vai aprender aqui."},{"tipo":"video","titulo":"Camadas de rede explicadas","busca":"camadas de rede explicação simples analogia","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Na analogia da encomenda, a etiqueta com a morada corresponde a…","opcoes":["Camada física","Camada de rede (IP)","Aplicação","Cabo"],"correta":1,"explica":"A morada = endereço IP."},{"tipo":"vf","p":"Um protocolo é um conjunto de regras de comunicação.","correta":true,"explica":"Define formato, ordem e significado das mensagens."},{"tipo":"mc","p":"Que camada transforma os dados em sinais no cabo?","opcoes":["Física","Transporte","Aplicação","Sessão"],"correta":0,"explica":"A camada física."}],"referencias":["kurose","iso7498"]},{"id":"m2l1","titulo":"O modelo OSI em 7 camadas","minutos":15,"nivel":"básico","objetivos":["Nomear as 7 camadas e a função de cada uma","Associar protocolos, equipamentos e PDUs às camadas","Usar o modelo OSI para resolver problemas"],"blocos":[{"tipo":"texto","titulo":"Porque usamos camadas","html":"<p>O modelo <b>OSI</b> (ISO/IEC 7498-1) divide a comunicação em 7 camadas. Cada camada resolve um problema e presta serviço à camada de cima. Vantagens: fabricantes diferentes interoperam, ensina-se por partes e a resolução de problemas fica metódica.</p>\n<p>Mnemónica (de cima para baixo): <b>A</b>prenda <b>A</b> <b>S</b>empre <b>T</b>udo <b>R</b>edes <b>E</b> <b>F</b>ísica — Aplicação, Apresentação, Sessão, Transporte, Rede, Enlace (ligação de dados), Física.</p>"},{"tipo":"figura","nome":"osi","legenda":"As 7 camadas do modelo OSI e o modelo TCP/IP lado a lado."},{"tipo":"tabela","titulo":"","cabecalho":["#","Camada","Função","PDU","Exemplos"],"linhas":[["7","Aplicação","Interface com as aplicações de rede","Dados","HTTP, DNS, SMTP, SSH"],["6","Apresentação","Formato, codificação, cifra","Dados","TLS, JPEG, ASCII"],["5","Sessão","Abrir, manter e fechar sessões","Dados","RPC, NetBIOS"],["4","Transporte","Entrega fim a fim, portas, fiabilidade","Segmento / Datagrama","TCP, UDP"],["3","Rede","Endereçamento lógico e encaminhamento","Pacote","IPv4, IPv6, ICMP, OSPF"],["2","Ligação de dados","Entrega no mesmo meio, MAC, deteção de erros","Trama (frame)","Ethernet, 802.11, PPP"],["1","Física","Bits em sinais elétricos, luz ou rádio","Bits","Cabos, conectores, hubs"]]},{"tipo":"exemplo","titulo":"Resolução de problemas de baixo para cima","html":"<p>Um utilizador diz “não tenho Internet”. Pelo modelo OSI:</p>\n<ol>\n<li><b>Física</b>: o cabo está ligado? A luz da porta acende?</li>\n<li><b>Ligação</b>: a porta do switch está na VLAN certa? Está em err-disabled?</li>\n<li><b>Rede</b>: o PC tem IP, máscara e gateway corretos? <code>ping</code> ao gateway responde?</li>\n<li><b>Transporte/Aplicação</b>: o DNS resolve nomes? Uma firewall está a bloquear a porta 443?</li>\n</ol>"},{"tipo":"dica","html":"No dia a dia de redes diz-se “problema de camada 1” (cabo), “camada 2” (VLAN/MAC), “camada 3” (IP/rotas). Fale assim também."},{"tipo":"video","titulo":"Modelo OSI explicado","busca":"modelo OSI 7 camadas explicado CCNA","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Em que camada OSI trabalha o router?","opcoes":["2","3","4","7"],"correta":1,"explica":"Camada 3, rede: endereços IP e encaminhamento."},{"tipo":"mc","p":"A PDU da camada de ligação de dados chama-se…","opcoes":["Segmento","Pacote","Trama","Bit"],"correta":2,"explica":"Camada 2 = trama (frame)."},{"tipo":"mc","p":"TCP e UDP pertencem à camada…","opcoes":["Rede","Transporte","Sessão","Aplicação"],"correta":1,"explica":"Camada 4, transporte."},{"tipo":"vf","p":"A cifra de dados (por ex. TLS) é associada à camada de Apresentação no modelo OSI.","correta":true,"explica":"Formatos, compressão e cifra são funções da camada 6."},{"tipo":"mc","p":"Um cabo partido é um problema de que camada?","opcoes":["1","2","3","7"],"correta":0,"explica":"Camada física."}],"referencias":["iso7498","odom1","kurose","netacad_itn"]},{"id":"m2l2","titulo":"TCP/IP e encapsulamento","minutos":12,"nivel":"básico","objetivos":["Comparar o modelo TCP/IP com o OSI","Descrever encapsulamento e desencapsulamento","Perceber o que muda (e o que não muda) em cada salto"],"blocos":[{"tipo":"texto","titulo":"O modelo que a Internet usa","html":"<p>O modelo <b>TCP/IP</b> é o que realmente está implementado. Na versão de 4 camadas: <b>Aplicação</b> (OSI 5-7), <b>Transporte</b> (4), <b>Internet</b> (3) e <b>Acesso à rede</b> (1-2). Muitos livros, incluindo o guia oficial CCNA, usam a versão de <b>5 camadas</b>, que separa ligação de dados e física.</p>"},{"tipo":"figura","nome":"encapsulamento","legenda":"Encapsulamento: cada camada acrescenta o seu cabeçalho aos dados da camada de cima."},{"tipo":"texto","titulo":"Encapsulamento passo a passo","html":"<ol>\n<li>A aplicação gera os <b>dados</b> (ex.: pedido HTTP).</li>\n<li>O transporte junta o cabeçalho TCP com as <b>portas</b> → <b>segmento</b>.</li>\n<li>A camada de rede junta o cabeçalho IP com os <b>endereços IP</b> → <b>pacote</b>.</li>\n<li>A ligação de dados junta cabeçalho e trailer Ethernet com os <b>MAC</b> e o <b>FCS</b> → <b>trama</b>.</li>\n<li>A física converte em <b>bits</b> no fio.</li>\n</ol>\n<p>No destino faz-se o caminho inverso: <b>desencapsulamento</b>.</p>"},{"tipo":"topologia","nos":[{"id":"a","tipo":"pc","x":8,"y":50,"rotulo":"PC A"},{"id":"r1","tipo":"router","x":36,"y":50,"rotulo":"R1"},{"id":"r2","tipo":"router","x":64,"y":50,"rotulo":"R2"},{"id":"b","tipo":"servidor","x":92,"y":50,"rotulo":"Servidor B"}],"ligacoes":[{"a":"a","b":"r1","rotulo":"MAC A→R1"},{"a":"r1","b":"r2","rotulo":"MAC R1→R2"},{"a":"r2","b":"b","rotulo":"MAC R2→B"}],"legenda":"Em cada salto a trama é refeita com novos MAC; o IP de origem e destino mantém-se (sem NAT)."},{"tipo":"exemplo","titulo":"O que muda em cada salto?","html":"<p>Quando o PC A envia um pacote ao servidor B através de R1 e R2:</p>\n<ul>\n<li><b>IP origem/destino</b>: <b>não mudam</b> (A → B) em todo o caminho, salvo NAT.</li>\n<li><b>MAC origem/destino</b>: <b>mudam a cada salto</b> — cada router remove a trama antiga e cria uma nova para a ligação seguinte.</li>\n<li><b>TTL</b> do IP: cada router diminui 1.</li>\n</ul>"},{"tipo":"dica","html":"Pergunta clássica do exame: “quando o pacote sai de R1 para R2, qual é o MAC de destino?” — o MAC da interface de <b>R2</b>, não o do servidor."},{"tipo":"video","titulo":"Encapsulamento TCP/IP","busca":"encapsulamento TCP/IP explicado camadas","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Quantas camadas tem o modelo TCP/IP original?","opcoes":["4","5","6","7"],"correta":0,"explica":"Aplicação, Transporte, Internet e Acesso à rede."},{"tipo":"vf","p":"O endereço IP de destino muda em cada router do caminho (sem NAT).","correta":false,"explica":"Os IP mantêm-se; os MAC é que mudam a cada salto."},{"tipo":"mc","p":"Que informação é acrescentada na camada de transporte?","opcoes":["Endereços MAC","Portas","Endereços IP","FCS"],"correta":1,"explica":"TCP/UDP acrescentam portas de origem e destino."},{"tipo":"mc","p":"O processo de retirar cabeçalhos no destino chama-se…","opcoes":["Encapsulamento","Desencapsulamento","Fragmentação","Multiplexagem"],"correta":1,"explica":"Desencapsulamento."},{"tipo":"vf","p":"Cada router diminui o TTL do pacote IP em 1.","correta":true,"explica":"Quando o TTL chega a 0 o pacote é descartado (evita loops infinitos)."}],"referencias":["kurose","odom1","rfc791","netacad_itn"]},{"id":"m2l3","titulo":"TCP, UDP e portas","minutos":15,"nivel":"básico","objetivos":["Comparar TCP e UDP","Explicar o three-way handshake e o controlo de fluxo por janela","Memorizar as portas mais conhecidas"],"blocos":[{"tipo":"tabela","titulo":"TCP × UDP","cabecalho":["","TCP","UDP"],"linhas":[["Ligação","Orientado à ligação (handshake)","Sem ligação"],["Fiabilidade","Confirmações (ACK) e retransmissão","Nenhuma — “envia e esquece”"],["Ordem","Reordena por números de sequência","Não garante ordem"],["Controlo de fluxo","Janela deslizante (window)","Não"],["Cabeçalho","20 bytes (mínimo)","8 bytes"],["Usos","Web, e-mail, SSH, transferências","Voz, vídeo em tempo real, DNS, DHCP, SNMP"]]},{"tipo":"figura","nome":"handshake","legenda":"Three-way handshake do TCP: SYN, SYN-ACK, ACK. O fecho usa FIN/ACK."},{"tipo":"texto","titulo":"Handshake e janela","html":"<p>Antes de enviar dados, o TCP faz o <b>three-way handshake</b>: o cliente envia <b>SYN</b>, o servidor responde <b>SYN-ACK</b>, o cliente confirma com <b>ACK</b>. Cada byte é numerado (<i>sequence number</i>) e o recetor confirma o que recebeu.</p>\n<p>A <b>janela</b> (<i>window size</i>) diz quantos bytes podem ser enviados sem esperar confirmação. Se há perdas, a janela diminui; se corre bem, aumenta. Isto é o <b>controlo de fluxo</b>.</p>"},{"tipo":"tabela","titulo":"Portas que tem de saber","cabecalho":["Porta","Protocolo","Transporte"],"linhas":[["20/21","FTP (dados/controlo)","TCP"],["22","SSH / SCP / SFTP","TCP"],["23","Telnet (inseguro)","TCP"],["25","SMTP","TCP"],["53","DNS","UDP e TCP"],["67/68","DHCP servidor/cliente","UDP"],["69","TFTP","UDP"],["80","HTTP","TCP"],["110","POP3","TCP"],["123","NTP","UDP"],["143","IMAP","TCP"],["161/162","SNMP / traps","UDP"],["443","HTTPS","TCP (e UDP no HTTP/3)"],["514","Syslog","UDP"],["1812/1813","RADIUS","UDP"],["49","TACACS+","TCP"]]},{"tipo":"exemplo","titulo":"Socket","html":"<p>Uma ligação é identificada por <b>IP de origem + porta de origem + IP de destino + porta de destino + protocolo</b>. Por exemplo, o seu browser em 192.168.1.20:51344 liga a 142.250.0.10:443 (TCP). A porta de origem é <i>efémera</i> (aleatória, normalmente acima de 49152).</p>"},{"tipo":"dica","html":"Truque: tudo o que é “tempo real” (voz, vídeo, jogos) ou “pergunta curta” (DNS, DHCP) prefere UDP."},{"tipo":"video","titulo":"TCP vs UDP e three-way handshake","busca":"TCP vs UDP three way handshake explicado","youtube_id":"","canal":""}],"quiz":[{"tipo":"mc","p":"Qual a sequência correta do handshake TCP?","opcoes":["SYN, ACK, SYN-ACK","SYN, SYN-ACK, ACK","ACK, SYN, FIN","SYN, FIN, ACK"],"correta":1,"explica":"SYN → SYN-ACK → ACK."},{"tipo":"mc","p":"Que protocolo de transporte usa normalmente a voz sobre IP?","opcoes":["TCP","UDP","ICMP","ARP"],"correta":1,"explica":"Voz tolera perdas mas não atrasos de retransmissão: UDP."},{"tipo":"mc","p":"Qual é a porta do SSH?","opcoes":["21","22","23","443"],"correta":1,"explica":"SSH = TCP 22. Telnet = 23."},{"tipo":"mc","p":"DHCP usa…","opcoes":["TCP 67/68","UDP 67/68","UDP 53","TCP 80"],"correta":1,"explica":"Servidor UDP 67, cliente UDP 68."},{"tipo":"vf","p":"O TCP usa a janela deslizante para controlo de fluxo.","correta":true,"explica":"O window size limita o envio sem confirmação."}],"referencias":["rfc9293","rfc768","kurose","odom1"]},{"id":"m2l4","titulo":"Ethernet, endereços MAC e ARP","minutos":15,"nivel":"básico","objetivos":["Ler a estrutura de uma trama Ethernet","Interpretar um endereço MAC (OUI)","Explicar como o ARP descobre o MAC a partir do IP"],"blocos":[{"tipo":"figura","nome":"trama_ethernet","legenda":"Trama Ethernet II: preâmbulo, MAC destino, MAC origem, tipo, dados (46–1500 bytes) e FCS."},{"tipo":"texto","titulo":"Endereço MAC","html":"<p>O <b>MAC</b> tem 48 bits (6 bytes), escrito em hexadecimal: <code>00:1A:2B:3C:4D:5E</code> ou, no formato Cisco, <code>001a.2b3c.4d5e</code>. Os primeiros 3 bytes são o <b>OUI</b>, que identifica o fabricante.</p>\n<ul>\n<li><b>Unicast</b>: um destino.</li>\n<li><b>Broadcast</b>: <code>FFFF.FFFF.FFFF</code> — todos na LAN.</li>\n<li><b>Multicast<
