<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Controlo de Pacientes — Cuidados Intermédios</title>
<meta http-equiv="refresh" content="0; url=controlo_pacientes_uci.html?u=intermedio&so=1">
<script>try{localStorage.setItem('zeloCpUciUnidade','intermedio');}catch(e){}location.replace('controlo_pacientes_uci.html?u=intermedio&so=1' + location.hash);</script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F5F9;font:500 1rem Inter,"Segoe UI",Arial,sans-serif;color:#1F2937;padding:16px}a{color:#1A56DB;font-weight:700}</style>
<style id="zelo-sem-setas">/* ZELO: nenhuma caixa de preenchimento com setas (em todo o sistema) */
input[type=number]{-moz-appearance:textfield !important;appearance:textfield !important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none !important;appearance:none !important;margin:0 !important;display:none !important}</style>
<script id="zelo-sem-setas-js">/* A roda do rato e as setas do teclado não mudam números sem querer
   (as páginas que usam as setas para andar entre células continuam a funcionar). */
(function(){if(window.__zeloSemSetas)return;window.__zeloSemSetas=1;
function num(e){return e&&e.tagName==='INPUT'&&e.type==='number';}
document.addEventListener('wheel',function(e){var t=e.target;if(num(t)&&document.activeElement===t)t.blur();},{passive:true});
document.addEventListener('keydown',function(e){if(num(e.target)&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&!e.defaultPrevented)e.preventDefault();});})();</script>
</head>
<body>
<!-- O Controlo de Pacientes — Cuidados Intermédios faz agora parte da página única
     UCI / Cuidados Intermédios (controlo_pacientes_uci.html?u=intermedio). Os registos
     continuam no mesmo sítio (registos_sistemas_locais/controlo_pacientes/uci_intermedio
     e a cópia neste computador) — nada foi apagado nem mudado de lugar. -->
<p>O Controlo de Pacientes — Cuidados Intermédios faz agora parte da página <a href="controlo_pacientes_uci.html?u=intermedio&so=1">Controlo de Pacientes — UCI / Cuidados Intermédios</a>. A abrir…</p>
</body>
</html>
