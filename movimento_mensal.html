<!DOCTYPE html>
<html lang="pt-AO" data-theme="light">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<script>window.ZELO_MODULE='movimento_mensal';</script>
<script type="module" src="zelo_pagegate.js"></script>
<script src="zelo_pagegate_watchdog.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Movimento Hospitalar · ZELO</title>
<link rel="icon" type="image/png" href="icons/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="zelo_tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--zelo-font-body, 'Source Sans 3', sans-serif);
  background:var(--zelo-bg, #F5F6F8);
  color:var(--zelo-ink, #16232E);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.topbar{
  background:var(--zelo-accent-ink, #16222F);
  color:#fff;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:10px;
}
.topbar img{width:26px;height:26px;border-radius:7px;background:#fff;padding:2px;flex-shrink:0;}
.topbar span{font-size:.82rem;font-weight:700;color:#E7ECF7;}
.topbar a{
  margin-left:auto;
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:100px;
  padding:6px 14px;
  font-size:.78rem;
  font-weight:600;
  white-space:nowrap;
}
.topbar a:hover{background:rgba(255,255,255,.18);}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{
  background:var(--zelo-surface, #fff);
  border:1px solid var(--zelo-line, #DCE2E7);
  border-radius:var(--zelo-radius-l, 16px);
  box-shadow:var(--zelo-shadow, 0 8px 24px -12px rgba(22,35,46,.16));
  padding:40px 34px;
  max-width:440px;
  text-align:center;
}
.card .ic{
  width:58px;height:58px;border-radius:16px;
  background:var(--zelo-accent-soft, #E9EEF4);
  color:var(--zelo-accent, #3E5C87);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
}
.card .ic svg{width:28px;height:28px;}
.badge{
  display:inline-block;
  font-family:var(--zelo-font-mono, 'IBM Plex Mono', monospace);
  font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--zelo-warn, #B5502D);
  background:var(--zelo-warn-soft, #F7E8E1);
  border-radius:100px;padding:4px 12px;margin-bottom:14px;
}
.card h1{
  font-family:var(--zelo-font-display, 'Fraunces', serif);
  font-size:1.3rem;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;
  color:var(--zelo-ink, #16232E);
}
.card p{color:var(--zelo-ink-soft, #55636F);font-size:.9rem;line-height:1.6;margin-bottom:26px;}
.back{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--zelo-accent, #3E5C87);
  color:#fff;text-decoration:none;
  font-size:.86rem;font-weight:700;
  padding:11px 22px;border-radius:10px;
}
.back:hover{opacity:.92;}
footer{
  text-align:center;padding:16px;
  color:var(--zelo-ink-faint, #8B98A3);
  font-size:.68rem;
  font-family:var(--zelo-font-mono, 'IBM Plex Mono', monospace);
}
</style>
</head>
<body>
<div class="topbar">
  <img src="icons/logo.png" alt="ZELO"/>
  <span>Hospital do Prenda · ZELO</span>
  <a href="index.html">← Voltar à Central</a>
</div>
<main>
  <div class="card">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    <div class="badge">Em desenvolvimento</div>
    <h1>Movimento Hospitalar</h1>
    <p>Este módulo está temporariamente indisponível enquanto é revisto. Volte a tentar mais tarde.</p>
    <a class="back" href="index.html">Voltar à Central de Registo</a>
  </div>
</main>
<footer>Departamento de Estatística Médica · Hospital do Prenda</footer>
<script src="zelo_theme.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (reg && reg.update) reg.update().catch(() => {});
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
