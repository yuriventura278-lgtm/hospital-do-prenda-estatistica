.hero h1{font-size:clamp(1.3rem,3.4vw,1.7rem);font-weight:800;letter-spacing:-.02em;}
.hero p{margin-top:5px;color:#AEC0E0;font-size:.8rem;max-width:640px;}

main{max-width:1100px;margin:0 auto;padding:24px 20px 60px;width:100%;box-sizing:border-box;flex:1;}

.panel{background:#fff;border:1px solid var(--br);border-radius:var(--r2);box-shadow:var(--s1);padding:20px;}
.panel h2{font-size:.92rem;font-weight:800;margin-bottom:4px;}
.panel .sub{font-size:.76rem;color:var(--tx3);margin-bottom:16px;}

.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px;}
.picker-card{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;text-decoration:none;color:#fff;
  border:1px solid rgba(255,255,255,.14);transition:transform .15s,box-shadow .15s;}
.picker-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(13,27,62,.2);}
.picker-card .ic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.picker-card .ic svg{width:19px;height:19px;}
.picker-card .nm{font-size:.9rem;font-weight:800;}

  align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.09);}
.foot-zelo{display:flex;align-items:center;gap:10px;}
.foot-zelo img{width:30px;height:30px;flex-shrink:0;border-radius:8px;}
.foot-zelo .l1{font-size:.78rem;font-weight:700;color:#fff;letter-spacing:.02em;}
.foot-meta{font-family:'DM Mono',monospace;font-size:.66rem;color:#7288B0;text-align:right;line-height:1.6;}
@media(max-width:480px){.foot-grid{flex-direction:column;align-items:flex-start;}.foot-meta{text-align:left;}}

<body>

<div class="topbar">
  <span class="dot"></span>
  <img src="icons/logo.png" alt="ZELO"/>
  <span>ZELO · Procedimentos de Enfermagem</span>
  <a class="back" href="index.html"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Início</a>
</div>

<div class="hero">
  <div class="hero-in">
    <h1>Procedimentos de Enfermagem</h1>
    <p>Escolhe o serviço para abrir o registo de procedimentos de enfermagem próprio desse serviço.</p>
  </div>
</div>

<main>
  <div class="panel">
    <h2>Escolhe o serviço</h2>
    <p class="sub">Cada serviço tem o seu próprio registo, histórico e PDF independentes.</p>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</main>

<footer>
  <div class="foot-grid">
    <div class="foot-zelo">
      <img src="icons/logo.png" alt="ZELO"/>
      <div class="l1">ZELO</div>
    </div>
    <div class="foot-meta">
      Uso interno · Luanda, Angola<br/>
      <span id="footyear"></span> ZELO
    </div>
  </div>
</footer>

<script>
document.getElementById('footyear').textContent = new Date().getFullYear();

const SERVICOS = [
  {slug:'ortopedia', nome:'Ortopedia', icon:'bone', cor:'#DC2626', arquivo:'procedimentos_enfermagem_ortopedia.html'},
  {slug:'cirurgia_geral', nome:'Cirurgia Geral', icon:'stretcher', cor:'#DC2626', arquivo:'procedimentos_enfermagem_cirurgia_geral.html'},
  {slug:'neurocirurgia', nome:'Neurocirurgia', icon:'brain', cor:'#DC2626', arquivo:'procedimentos_enfermagem_neurocirurgia.html'},
  {slug:'maxilo_facial', nome:'Cirurgia Maxilo-Facial', icon:'jaw', cor:'#DC2626', arquivo:'procedimentos_enfermagem_maxilo_facial.html'},
  {slug:'nefrologia', nome:'Nefrologia', icon:'droplet', cor:'#7C3AED', arquivo:'procedimentos_enfermagem_nefrologia.html'},
  {slug:'uci_cuidados_intermedios', nome:'UCI / Cuidados Intermédios', icon:'activity', cor:'#7C3AED', arquivo:'procedimentos_enfermagem_uci_cuidados_intermedios.html'},
  {slug:'medicina_homem', nome:'Medicina Homem', icon:'heartbeat', cor:'#7C3AED', arquivo:'procedimentos_enfermagem_medicina_homem.html'},
  {slug:'medicina_mulher', nome:'Medicina Mulher', icon:'heartbeat', cor:'#7C3AED', arquivo:'procedimentos_enfermagem_medicina_mulher.html'},
  {slug:'hospital_dia', nome:'Hospital de Dia', icon:'calendar', cor:'#059669', arquivo:'procedimentos_enfermagem_hospital_dia.html'},
  {slug:'banco_urgencia', nome:'Banco de Urgência', icon:'cross', cor:'#059669', arquivo:'procedimentos_enfermagem_banco_urgencia.html'},
];
const ICONS = {
  stretcher:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  bone:'<path d="M17 10c.7-.7 1.69-1 2.5-1a3.5 3.5 0 1 0-3.5-3.5c0 .81-.3 1.8-1 2.5L7 16c-.7.7-1.69 1-2.5 1a3.5 3.5 0 1 0 3.5 3.5c0-.81.3-1.8 1-2.5Z"/>',
  brain:'<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>',
  jaw:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  droplet:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7Z"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  heartbeat:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  cross:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>',
};
function svcIcon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.activity}</svg>`; }

// Mostra só os serviços a que o utilizador tem acesso — antes mostrava sempre
// os 10, mesmo quando o administrador restringiu a apenas alguns.
function renderPicker(role, permissoes){
  const podeVer = typeof window.hasModuleAccess === 'function'
    ? s => window.hasModuleAccess(role || 'funcionario', permissoes || {}, 'procedimentos_enfermagem', s.slug)
    : () => true; // segurança: se a verificação ainda não carregou, não esconde nada
  document.getElementById('pickerGrid').innerHTML = SERVICOS.filter(podeVer).map(s=>`
    <a class="picker-card" href="${s.arquivo}" style="background:linear-gradient(120deg,var(--nv) 0%,${s.cor} 160%);">
      <div class="ic">${svcIcon(s.icon)}</div>
      <div class="nm">${s.nome}</div>
    </a>
  `).join('');
}
renderPicker(sessionStorage.getItem('zeloRole'), JSON.parse(sessionStorage.getItem('zeloPermissoes') || '{}'));
window.addEventListener('zelo-gate-ready', function(ev){
  renderPicker(ev.detail.role, ev.detail.permissoes);
});
</script>
