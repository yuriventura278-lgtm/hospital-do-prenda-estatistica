<!DOCTYPE html>
<html lang="pt-AO" data-theme="light">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<script>window.ZELO_MODULE='estatistica';</script>
<script>window.ZELO_ITEM='dashboard';</script>
<script type="module" src="zelo_pagegate.js"></script>

<meta charset="UTF-8"/>

<link rel="icon" type="image/png" href="icons/logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { firebaseConfig } from './zelo_firebase_config.js';
  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.__fbGet = (path)=>get(ref(db,path)).then(snap=>snap.exists()?snap.val():null);
    window.__fbReady = true;
  }catch(e){
    console.warn('Firebase indisponível.', e);
    window.__fbReady = false;
  }
  window.dispatchEvent(new CustomEvent('zelo-dashboard-fb-ready'));
</script>
<style>
:root{
  --bg:var(--zelo-bg, #F4F5F7); --sf:var(--zelo-surface, #fff); --sf2:var(--zelo-surface-2, #F4F6F8);
  --br:var(--zelo-line, #E2E6EA); --tx:var(--zelo-ink, #16232E); --tx2:var(--zelo-ink-soft, #55636F); --tx3:var(--zelo-ink-faint, #8B98A3);
  --accent:var(--zelo-accent, #3E5C87); --accent-dark:var(--zelo-accent-dark, #2B415E); --accent-soft:var(--zelo-accent-soft, #E9EEF4);
  --topbar-h:60px;
}
:root[data-zelo-theme="dark"]{
  --bg:#0B1220; --sf:#111A2E; --sf2:#0F1830; --br:#1E293B; --tx:#F1F5F9; --tx2:#CBD5E1; --tx3:#94A3B8;
  --accent:#8FA9D1; --accent-dark:#5D7FAD; --accent-soft:#182338;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Source Sans 3',Arial,sans-serif;transition:background .15s,color .15s;}

/* ── Cabeçalho ── */
.topbar{position:sticky;top:0;height:var(--topbar-h);background:linear-gradient(135deg,#111C2B 0%,#2B415E 55%,#3E5C87 100%);color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 22px;z-index:40;box-shadow:0 2px 16px rgba(11,18,32,.28);}
.topbar img{width:24px;height:24px;border-radius:6px;flex-shrink:0;}
.topbar .tb-id{display:flex;flex-direction:column;line-height:1.25;}
.topbar .tb-title{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;letter-spacing:.01em;}
.topbar .tb-sub{font-size:.62rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.09em;font-weight:600;}
.topbar .tb-live{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;
  font-size:.68rem;color:rgba(255,255,255,.7);white-space:nowrap;}
.tb-live .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;flex-shrink:0;animation:tbPulse 2.4s ease-in-out infinite;}
@keyframes tbPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media(max-width:640px){.tb-live{display:none;}}

main{padding:20px 22px 64px;max-width:1400px;margin:0 auto;}

/* ── Seletor de período ── */
.period-bar{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:16px 18px;margin-bottom:22px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.period-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.period-tab{border:1px solid var(--br);background:var(--sf2);color:var(--tx2);font-size:.72rem;font-weight:600;
  padding:7px 14px;border-radius:100px;cursor:pointer;font-family:inherit;transition:all .12s;}
.period-tab:hover{border-color:var(--accent);color:var(--accent);}
.period-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.period-fields{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.period-fields label{font-size:.66rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;}
.period-fields input,.period-fields select{border:1px solid var(--br);border-radius:8px;padding:6px 10px;
  font-size:.76rem;font-family:inherit;color:var(--tx);background:var(--sf2);}
.btn-carregar{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;
  font-size:.76rem;font-weight:700;cursor:pointer;font-family:inherit;margin-left:auto;transition:background .12s;}
.btn-carregar:hover{background:var(--accent-dark);}
.btn-carregar:disabled{opacity:.6;cursor:default;}
.period-label{font-size:.68rem;color:var(--tx3);font-weight:500;width:100%;}

/* ── Secções por serviço ── */
.svc-section{background:var(--sf);border:1px solid var(--br);border-left:3px solid var(--svc-cor,var(--accent));
  border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.svc-hdr{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.svc-eyebrow{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--svc-cor,var(--accent));margin-bottom:2px;}
.svc-title{font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;color:var(--tx);line-height:1.2;}
.svc-voz-btn{margin-left:auto;background:transparent;border:1px solid var(--br);border-radius:100px;
  padding:6px 14px;font-size:.68rem;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;transition:all .12s;}
.svc-voz-btn:hover{border-color:var(--accent);color:var(--accent);}
.svc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:18px;}
.svc-kpi{background:var(--sf2);border:1px solid var(--br);border-top:2px solid var(--svc-cor,var(--accent));
  border-radius:8px;padding:11px 12px;text-align:center;}
.svc-kpi .k-val{font-size:1.3rem;font-weight:700;color:var(--tx);font-family:'IBM Plex Mono',monospace;}
.svc-kpi .k-lbl{font-size:.62rem;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
.svc-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.svc-chart-box{min-width:0;}
.svc-chart-box .cb-title{font-size:.7rem;font-weight:600;color:var(--tx2);margin-bottom:8px;}
.svc-chart-canvas-wrap{position:relative;height:220px;}
.svc-empty{color:var(--tx3);font-size:.78rem;padding:20px 0;text-align:center;}
.svc-loading{color:var(--tx3);font-size:.78rem;padding:20px 0;text-align:center;}
</style>

<body>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   PERÍODO — cálculo do intervalo de datas conforme o tipo escolhido
   ════════════════════════════════════════════════════════════ */
function pad2(n){ return String(n).padStart(2,'0'); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function datesInRange(s,e){
  const out=[]; const cur=new Date(s+'T00:00:00'); const end=new Date(e+'T00:00:00');
  while(cur<=end){ out.push(cur.getFullYear()+'-'+pad2(cur.getMonth()+1)+'-'+pad2(cur.getDate())); cur.setDate(cur.getDate()+1); }
  return out;
}
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* Relógio do cabeçalho — transmite que os dados abaixo estão a ser lidos
   agora, sem depender de ícones ou emojis para isso. */
(function relogioTopbar(){
  const el = document.getElementById('tbLiveTxt');
  if (!el) return;
  function atualizar(){
    const d = new Date();
    el.textContent = pad2(d.getDate())+' '+MESES_PT[d.getMonth()].slice(0,3)+' · '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  atualizar();
  setInterval(atualizar, 30000);
})();

let periodoAtivo = 'mes';
const periodTabsEl = document.getElementById('periodTabs');
const periodFieldsEl = document.getElementById('periodFields');

function renderPeriodFields(){
  const hoje = new Date();
  const y = hoje.getFullYear(), m = pad2(hoje.getMonth()+1);
  if (periodoAtivo === 'dia'){
    periodFieldsEl.innerHTML = '<label>Data</label><input type="date" id="pf-dia" value="'+hojeISO()+'">';
  } else if (periodoAtivo === 'semana'){
    // Segunda-feira da semana actual, por padrão
    const dow = (hoje.getDay()+6)%7;
    const seg = new Date(hoje); seg.setDate(hoje.getDate()-dow);
    const dom = new Date(seg); dom.setDate(seg.getDate()+6);
    const fmt = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    periodFieldsEl.innerHTML = '<label>De</label><input type="date" id="pf-semana-ini" value="'+fmt(seg)+'">'+
      '<label>a</label><input type="date" id="pf-semana-fim" value="'+fmt(dom)+'">';
  } else if (periodoAtivo === 'mes'){
    periodFieldsEl.innerHTML = '<label>Mês</label><input type="month" id="pf-mes" value="'+y+'-'+m+'">';
  } else if (periodoAtivo === 'trimestre'){
    const q = Math.ceil((hoje.getMonth()+1)/3);
    periodFieldsEl.innerHTML = '<label>Ano</label><input type="number" id="pf-tri-ano" value="'+y+'" style="width:80px;">'+
      '<label>Trimestre</label><select id="pf-tri-q">'+
      '<option value="1"'+(q===1?' selected':'')+'>T1 (Jan–Mar)</option>'+
      '<option value="2"'+(q===2?' selected':'')+'>T2 (Abr–Jun)</option>'+
      '<option value="3"'+(q===3?' selected':'')+'>T3 (Jul–Set)</option>'+
      '<option value="4"'+(q===4?' selected':'')+'>T4 (Out–Dez)</option></select>';
  } else if (periodoAtivo === 'semestre'){
    const h = hoje.getMonth() < 6 ? 1 : 2;
    periodFieldsEl.innerHTML = '<label>Ano</label><input type="number" id="pf-seme-ano" value="'+y+'" style="width:80px;">'+
      '<label>Semestre</label><select id="pf-seme-h">'+
      '<option value="1"'+(h===1?' selected':'')+'>S1 (Jan–Jun)</option>'+
      '<option value="2"'+(h===2?' selected':'')+'>S2 (Jul–Dez)</option></select>';
  } else if (periodoAtivo === 'ano'){
    periodFieldsEl.innerHTML = '<label>Ano</label><input type="number" id="pf-ano" value="'+y+'" style="width:80px;">';
  }
}
periodTabsEl.addEventListener('click', function(e){
  const btn = e.target.closest('.period-tab');
  if (!btn) return;
  periodTabsEl.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  periodoAtivo = btn.dataset.p;
  renderPeriodFields();
});
renderPeriodFields();

/* Devolve { dates: [...], label: 'texto', periodoFalado: 'leitura ... de ...' } para o período seleccionado agora. */
function calcularPeriodo(){
  if (periodoAtivo === 'dia'){
    const d = document.getElementById('pf-dia').value || hojeISO();
    const [y,m,dd] = d.split('-');
    return { dates:[d], label: dd+'/'+m+'/'+y, periodoFalado: 'leitura diária de '+parseInt(dd,10)+' de '+MESES_PT[+m-1].toLowerCase()+' de '+y };
  }
  if (periodoAtivo === 'semana'){
    const s = document.getElementById('pf-semana-ini').value, e = document.getElementById('pf-semana-fim').value;
    if (!s || !e) return null;
    return { dates: datesInRange(s,e), label: s.split('-').reverse().join('/')+' – '+e.split('-').reverse().join('/'), periodoFalado: 'leitura semanal de '+s.split('-').reverse().join('/')+' a '+e.split('-').reverse().join('/') };
  }
  if (periodoAtivo === 'mes'){
    const v = document.getElementById('pf-mes').value;
    if (!v) return null;
    const [y,m] = v.split('-');
    const last = new Date(+y,+m,0).getDate();
    return { dates: datesInRange(v+'-01', v+'-'+pad2(last)), label: MESES_PT[+m-1]+' de '+y, periodoFalado: 'leitura mensal de '+MESES_PT[+m-1].toLowerCase()+' de '+y };
  }
  if (periodoAtivo === 'trimestre'){
    const y = document.getElementById('pf-tri-ano').value, q = +document.getElementById('pf-tri-q').value;
    const starts=[[1,1],[4,1],[7,1],[10,1]], ends=[[3,31],[6,30],[9,30],[12,31]];
    const [sm,sd]=starts[q-1], [em,ed]=ends[q-1];
    return { dates: datesInRange(y+'-'+pad2(sm)+'-'+pad2(sd), y+'-'+pad2(em)+'-'+pad2(ed)), label: 'T'+q+' '+y, periodoFalado: 'leitura trimestral do '+q+'º trimestre de '+y };
  }
  if (periodoAtivo === 'semestre'){
    const y = document.getElementById('pf-seme-ano').value, h = +document.getElementById('pf-seme-h').value;
    const s = h===1? y+'-01-01' : y+'-07-01', e = h===1? y+'-06-30' : y+'-12-31';
    return { dates: datesInRange(s,e), label: 'S'+h+'/'+y, periodoFalado: 'leitura semestral do '+h+'º semestre de '+y };
  }
  if (periodoAtivo === 'ano'){
    const y = document.getElementById('pf-ano').value;
    return { dates: datesInRange(y+'-01-01', y+'-12-31'), label: 'Ano '+y, periodoFalado: 'leitura anual de '+y };
  }
  return null;
}

/* ════════════════════════════════════════════════════════════
   INFRA-ESTRUTURA PARTILHADA — leitura Firebase em bloco + gráficos
   ════════════════════════════════════════════════════════════ */
function esperarFirebase(){
  return new Promise(function(resolve){
    if (window.__fbReady){ resolve(true); return; }
    let resolvido = false;
    function ok(){ if(resolvido) return; resolvido=true; resolve(true); }
    window.addEventListener('zelo-dashboard-fb-ready', ok, { once:true });
    setTimeout(function(){ if(!resolvido){ resolvido=true; resolve(!!window.__fbReady); } }, 6000);
  });
}
// Lê TODO o histórico de um caminho Firebase de uma vez (uma só leitura,
// filtrada depois localmente pelas datas do período) — muito mais rápido e
// económico do que ler dia a dia, especialmente em períodos longos
// (trimestre/semestre/ano).
const _fbCacheRaiz = {};
async function lerHistoricoCompleto(path){
  if (_fbCacheRaiz[path]) return _fbCacheRaiz[path];
  const pronto = await esperarFirebase();
  if (!pronto || !window.__fbGet) return {};
  try{
    const tudo = await window.__fbGet(path);
    _fbCacheRaiz[path] = tudo || {};
    return _fbCacheRaiz[path];
  }catch(e){ console.warn('ZELO Dashboard: falha ao ler', path, e); return {}; }
}

const _charts = {};
function desenharGrafico(canvasId, config){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (_charts[canvasId]) { _charts[canvasId].destroy(); }
  _charts[canvasId] = new Chart(canvas.getContext('2d'), config);
}
const PALETA = ['#3E5C87','#3F7A56','#B5502D','#6B4E9E','#3E7EA6','#A6467A','#8A9A4B','#9B3B3B','#C99A3B','#5D7FAD','#4F7A6B','#7A5C3E'];
// Cores dos eixos/legendas adaptam-se ao tema activo (claro/escuro), lidas
// das mesmas variáveis CSS usadas no resto da página.
function _corTema(nome, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
  return v || fallback;
}
function barChartConfig(labels, data, opts){
  opts = opts || {};
  const txMuted = _corTema('--tx2', '#55636F'), grid = _corTema('--br', '#E2E6EA'), fundo = _corTema('--sf', '#fff');
  return {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: opts.color || '#3E5C87', borderRadius: 5, maxBarThickness: 34 }] },
    options: {
      indexAxis: opts.horizontal ? 'y' : 'x',
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 10 }, color: txMuted }, grid: { display: !opts.horizontal, color: grid } }, y: { ticks: { font: { size: 10 }, color: txMuted }, grid: { display: !!opts.horizontal, color: grid }, beginAtZero: true } }
    }
  };
}
function doughnutChartConfig(labels, data){
  const txMuted = _corTema('--tx2', '#55636F'), fundo = _corTema('--sf', '#fff');
  return {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: PALETA, borderWidth: 2, borderColor: fundo }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ font:{ size:10 }, color: txMuted, boxWidth:11, padding:10 } } } }
  };
}
function pieChartConfig(labels, data){
  const txMuted = _corTema('--tx2', '#55636F'), fundo = _corTema('--sf', '#fff');
  return {
    type: 'pie',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: PALETA, borderWidth: 2, borderColor: fundo }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ font:{ size:10 }, color: txMuted, boxWidth:11, padding:10 } } } }
  };
}
// Evolução diária dentro do período seleccionado — só faz sentido quando há
// mais do que 1 dia (esconde-se sozinho na leitura Diária).
function lineChartConfig(labels, data, opts){
  opts = opts || {};
  const txMuted = _corTema('--tx2', '#55636F'), grid = _corTema('--br', '#E2E6EA');
  return {
    type: 'line',
    data: { labels: labels, datasets: [{ data: data, borderColor: opts.color || '#3E5C87', backgroundColor: (opts.color||'#3E5C87')+'22', fill: true, tension: .3, pointRadius: labels.length > 40 ? 0 : 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { font: { size: 9 }, color: txMuted, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display:false } }, y: { beginAtZero: true, ticks: { font: { size: 10 }, color: txMuted }, grid: { color: grid } } }
    }
  };
}
function kpisHTML(items){
  // items: [{val, lbl}]
  return items.map(function(i){ return '<div class="svc-kpi"><div class="k-val">'+i.val+'</div><div class="k-lbl">'+i.lbl+'</div></div>'; }).join('');
}

/* ════════════════════════════════════════════════════════════
   SECÇÕES — uma por serviço. Cada carregarX() lê o Firebase,
   agrega os dados do período seleccionado e desenha os gráficos
   próprios daquele contexto (nunca um gráfico genérico igual para
   todos). _secaoDados guarda o que foi calculado, para o botão
   "Ler em voz" narrar a partir dos dados, tal como nas outras
   páginas do sistema.
   ════════════════════════════════════════════════════════════ */
const _secaoDados = {};
function somaObj(o){ if(!o) return 0; return Object.values(o).reduce(function(a,v){ return a + (typeof v==='number'?v:0); }, 0); }
function ordenarDesc(rows){ return rows.filter(function(r){ return r.v>0; }).sort(function(a,b){ return b.v-a.v; }); }

const SECOES = [
  { id:'proc',  eyebrow:'Enfermagem',       cor:'#B5502D', titulo:'Procedimentos de Enfermagem — por Serviço' },
  { id:'bloco', eyebrow:'Cirurgia',         cor:'#9B3B3B', titulo:'Bloco Operatório' },
  { id:'ce',    eyebrow:'Ambulatório',      cor:'#3F7A56', titulo:'Consulta Externa' },
  { id:'imag',  eyebrow:'Diagnóstico',      cor:'#3E7EA6', titulo:'Imagiologia' },
  { id:'lab',   eyebrow:'Análises Clínicas',cor:'#6B4E9E', titulo:'Laboratório' },
  { id:'hemo',  eyebrow:'Hemoterapia',      cor:'#A6467A', titulo:'Hemoterapia' },
  { id:'farm',  eyebrow:'Farmácia',         cor:'#6B7A3F', titulo:'Farmácia' },
];

/* ── 1. Procedimentos de Enfermagem — por Serviço ──
   registos_enf/{slug}/{data}.snapshot.sub = { [especialidadeId]: { [categoriaId]: {d:[...],n:[...]}, notesDia, notesNoite } }
   Cada uma das 12 páginas individuais grava no seu próprio slug — soma-se
   tudo o que aparece em "d" e "n" para obter o total de procedimentos. */
const PROC_SLUGS = {
  banco_urgencia:'Banco de Urgência', bloco_operatorio:'Bloco Operatório', cirurgia_geral:'Cirurgia Geral',
  consulta_externa:'Consulta Externa', hospital_dia:'Hospital de Dia', maxilo_facial:'Maxilo Facial',
  medicina_homem:'Medicina Homem', medicina_mulher:'Medicina Mulher', nefrologia:'Nefrologia',
  neurocirurgia:'Neurocirurgia', ortopedia:'Ortopedia', uci_cuidados_intermedios:'UCI / Cuidados Intermédios',
};
function _totalProcNoSub(sub){
  let n = 0;
  if (!sub) return n;
  Object.values(sub).forEach(function(especialidade){
    Object.keys(especialidade).forEach(function(catId){
      const cat = especialidade[catId];
      if (!cat || !Array.isArray(cat.d)) return;
      n += cat.d.reduce(function(a,v){return a+(v||0);},0);
      n += (cat.n||[]).reduce(function(a,v){return a+(v||0);},0);
    });
  });
  return n;
}
async function carregarProcedimentos(periodo){
  const slugs = Object.keys(PROC_SLUGS);
  const historicos = await Promise.all(slugs.map(function(slug){ return lerHistoricoCompleto('registos_enf/'+slug); }));
  let total = 0;
  const porDia = {}; periodo.dates.forEach(function(d){ porDia[d] = 0; });
  const porServico = slugs.map(function(slug, i){
    let n = 0;
    const hist = historicos[i] || {};
    periodo.dates.forEach(function(d){
      const snap = hist[d] && hist[d].snapshot;
      const sub = snap && snap.sub;
      const dia = _totalProcNoSub(sub);
      n += dia; porDia[d] += dia;
    });
    total += n;
    return { nome: PROC_SLUGS[slug], v: n };
  });
  const rows = ordenarDesc(porServico);
  if (total === 0){ renderSecaoVazia('proc'); _secaoDados.proc=null; return; }
  const charts = [ { title:'Por Serviço', canvasId:'chart-proc', config: barChartConfig(rows.map(r=>r.nome), rows.map(r=>r.v), {horizontal:true, color:'#D97706'}) } ];
  if (periodo.dates.length > 1) charts.push({ title:'Evolução Diária', canvasId:'chart-proc-evol', config: lineChartConfig(periodo.dates.map(d=>d.slice(8,10)+'/'+d.slice(5,7)), periodo.dates.map(d=>porDia[d]), {color:'#D97706'}) });
  renderSecao('proc',
    [ {val: total, lbl:'Total de Procedimentos'}, {val: rows.length, lbl:'Serviços com Registo'} ],
    charts
  );
  _secaoDados.proc = { total, rows, periodoFalado: periodo.periodoFalado };
}
function narrarProcedimentos(){
  const d = _secaoDados.proc;
  if (!d){ window.zeloFalar('Ainda não há dados de procedimentos de enfermagem para este período.'); return; }
  let txt = 'Na '+d.periodoFalado+', foram registados um total de '+d.total+(d.total===1?' procedimento':' procedimentos')+' de enfermagem.';
  if (d.rows.length) txt += ' Por serviço: '+d.rows.map(r=>r.nome+' com '+r.v).join(', ')+'.';
  window.zeloFalar(txt);
}

/* ── 2. Bloco Operatório ──
   registos_sistemas_locais/bloco_operatorio/{data}.snapshot = { surgeries:{urg:[...],elet:[...]}, suspList:[...] }
   cada cirurgia: {esp, anest:[tags], sexo, deceased, transfer} */
const BLOCO_SPECIALTIES = ['Cirurgia Geral','Ortopedia','Maxilo Facial','Urologia','Proctologia','Neurocirurgia','Otorrinolaringologia','Anestesiologia','Angeologia','Oftalmologia','Medicina Interna','Nefrologia'];
const BLOCO_ANEST_TAGS = {GOT:'Gerais Endotraqueal', GEV:'Gerais Endovenosa', DISS:'Dissociativa', BAL:'Balanceada', COMB:'Combinadas', 'REG.':'Raquidianas', EPI:'Epidurales', BN:'Bloqueio Nervoso', LOC:'Locais'};
async function carregarBloco(periodo){
  const hist = await lerHistoricoCompleto('registos_sistemas_locais/bloco_operatorio');
  let totUrg=0, totElet=0;
  const especT = {}; BLOCO_SPECIALTIES.forEach(s=>especT[s]={urg:0,elet:0});
  const anestT = {};
  periodo.dates.forEach(function(d){
    const snap = hist[d] && hist[d].snapshot;
    if (!snap) return;
    (snap.surgeries && snap.surgeries.urg || []).forEach(function(s){
      totUrg++;
      if (s.esp && especT[s.esp]) especT[s.esp].urg++;
      (s.anest||[]).forEach(function(tag){ const nome=BLOCO_ANEST_TAGS[tag]; if(nome) anestT[nome]=(anestT[nome]||0)+1; });
    });
    (snap.surgeries && snap.surgeries.elet || []).forEach(function(s){
      totElet++;
      if (s.esp && especT[s.esp]) especT[s.esp].elet++;
      (s.anest||[]).forEach(function(tag){ const nome=BLOCO_ANEST_TAGS[tag]; if(nome) anestT[nome]=(anestT[nome]||0)+1; });
    });
  });
  const total = totUrg + totElet;
  if (total === 0){ renderSecaoVazia('bloco'); _secaoDados.bloco=null; return; }
  const especRows = ordenarDesc(BLOCO_SPECIALTIES.map(function(s){ return { nome:s, v:(especT[s].urg||0)+(especT[s].elet||0) }; }));
  const anestRows = ordenarDesc(Object.keys(anestT).map(function(k){ return {nome:k, v:anestT[k]}; }));
  const charts = [ { title:'Por Especialidade (Urgente + Eletiva)', canvasId:'chart-bloco-esp', config: barChartConfig(especRows.map(r=>r.nome), especRows.map(r=>r.v), {horizontal:true, color:'#DC2626'}) } ];
  if (anestRows.length) charts.push({ title:'Técnicas Anestésicas', canvasId:'chart-bloco-anest', config: pieChartConfig(anestRows.map(r=>r.nome), anestRows.map(r=>r.v)) });
  renderSecao('bloco',
    [ {val:total, lbl:'Total Cirurgias'}, {val:totUrg, lbl:'Urgentes'}, {val:totElet, lbl:'Eletivas'} ],
    charts
  );
  _secaoDados.bloco = { total, totUrg, totElet, especRows, anestRows, periodoFalado: periodo.periodoFalado };
}
function narrarBloco(){
  const d = _secaoDados.bloco;
  if (!d){ window.zeloFalar('Ainda não há dados do bloco operatório para este período.'); return; }
  let txt = 'Na '+d.periodoFalado+', o bloco operatório teve um total de '+d.total+(d.total===1?' cirurgia realizada':' cirurgias realizadas')+
    '. Destas, '+d.totUrg+(d.totUrg===1?' urgente':' urgentes')+' e '+d.totElet+(d.totElet===1?' eletiva':' eletivas')+'.';
  if (d.especRows.length) txt += ' Por especialidade: '+d.especRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';
  if (d.anestRows.length) txt += ' Técnicas anestésicas: '+d.anestRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';
  window.zeloFalar(txt);
}

/* ── 3. Consulta Externa ──
   registos_sistemas_locais/consulta_externa/{data}.snapshot = { sessoes:[{especialidade, totalDoentes, diagnosticos:{}, ...}] } */
async function carregarConsultaExterna(periodo){
  const hist = await lerHistoricoCompleto('registos_sistemas_locais/consulta_externa');
  let total = 0;
  const porEspec = {}, diagnosticos = {};
  periodo.dates.forEach(function(d){
    const snap = hist[d] && hist[d].snapshot;
    const sessoes = snap && snap.sessoes;
    if (!sessoes) return;
    sessoes.forEach(function(s){
      const t = s.totalDoentes||0;
      total += t;
      porEspec[s.especialidade] = (porEspec[s.especialidade]||0) + t;
      Object.keys(s.diagnosticos||{}).forEach(function(k){ diagnosticos[k] = (diagnosticos[k]||0) + (s.diagnosticos[k]||0); });
    });
  });
  if (total === 0){ renderSecaoVazia('ce'); _secaoDados.ce=null; return; }
  const especRows = ordenarDesc(Object.keys(porEspec).map(function(k){ return {nome:k, v:porEspec[k]}; }));
  const diagRows = ordenarDesc(Object.keys(diagnosticos).map(function(k){ return {nome:k, v:diagnosticos[k]}; })).slice(0,8);
  const charts = [ { title:'Por Especialidade', canvasId:'chart-ce-esp', config: barChartConfig(especRows.map(r=>r.nome), especRows.map(r=>r.v), {horizontal:true, color:'#059669'}) } ];
  if (diagRows.length) charts.push({ title:'Principais Diagnósticos', canvasId:'chart-ce-diag', config: doughnutChartConfig(diagRows.map(r=>r.nome), diagRows.map(r=>r.v)) });
  renderSecao('ce', [ {val:total, lbl:'Total de Doentes'}, {val:especRows.length, lbl:'Especialidades'} ], charts);
  _secaoDados.ce = { total, especRows, diagRows, periodoFalado: periodo.periodoFalado };
}
function narrarConsultaExterna(){
  const d = _secaoDados.ce;
  if (!d){ window.zeloFalar('Ainda não há dados de consulta externa para este período.'); return; }

  if (d.especRows.length) txt += ' Por especialidade: '+d.especRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';

/* ── 4. Imagiologia ──
   registos_sistemas_locais/imagiologia/{data}.snapshot = { tac:{exame:{bu,aut,int}}, eco:{...}, rx:{...} } */
async function carregarImagiologia(periodo){
  const hist = await lerHistoricoCompleto('registos_sistemas_locais/imagiologia');
  const modalidades = { tac:0, eco:0, rx:0 };
  let bu=0, aut=0, int_=0;
  periodo.dates.forEach(function(d){
    const snap = hist[d] && hist[d].snapshot;
    if (!snap) return;
    ['tac','eco','rx'].forEach(function(mod){
      Object.values(snap[mod]||{}).forEach(function(v){
        modalidades[mod] += (v.bu||0)+(v.aut||0)+(v.int||0);
        bu += v.bu||0; aut += v.aut||0; int_ += v.int||0;
      });
    });
  });
  const total = modalidades.tac + modalidades.eco + modalidades.rx;
  if (total === 0){ renderSecaoVazia('imag'); _secaoDados.imag=null; return; }
  const modLabels = {tac:'TAC', eco:'Ecografia', rx:'Raio X'};
  const modRows = ordenarDesc(Object.keys(modalidades).map(function(k){ return {nome:modLabels[k], v:modalidades[k]}; }));
  const origemRows = ordenarDesc([{nome:'Banco de Urgência', v:bu}, {nome:'Autorizados', v:aut}, {nome:'Internamento', v:int_}]);
  renderSecao('imag', [ {val:total, lbl:'Total de Exames'} ], [
    { title:'Por Modalidade', canvasId:'chart-imag-mod', config: pieChartConfig(modRows.map(r=>r.nome), modRows.map(r=>r.v)) },
    { title:'Por Origem', canvasId:'chart-imag-orig', config: barChartConfig(origemRows.map(r=>r.nome), origemRows.map(r=>r.v), {color:'#0EA5E9'}) },
  ]);
  _secaoDados.imag = { total, modRows, origemRows, periodoFalado: periodo.periodoFalado };
}
function narrarImagiologia(){

  if (!d){ window.zeloFalar('Ainda não há dados de imagiologia para este período.'); return; }

async function carregarLaboratorio(periodo){
  const hist = await lerHistoricoCompleto('registos_sistemas_locais/laboratorio');
  let total = 0, totalPositivos = 0;
  const porExame = {};
  periodo.dates.forEach(function(d){

    Object.keys(snap.exames||{}).forEach(function(nome){

  if (totalPositivos > 0) charts.push({ title:'Resultados Positivos vs. Sem Alteração', canvasId:'chart-lab-pos', config: pieChartConfig(['Positivos','Sem alteração'], [totalPositivos, Math.max(total-totalPositivos,0)]) });
  renderSecao('lab',

/* ── 6. Hemoterapia ──
   registos_sistemas_locais/hemoterapia/{data}.snapshot = { transfusoes:{plaquetas,plasmas,globulos,crio}, doadores:{voluntarios,familiares,habituais}, serologia:{vih,hbs,vdrl,hcv,outros} } */
async function carregarHemoterapia(periodo){
  const hist = await lerHistoricoCompleto('registos_sistemas_locais/hemoterapia');
  const transf = {plaquetas:0, plasmas:0, globulos:0, crio:0};
  const doad = {voluntarios:0, familiares:0, habituais:0};
  const sero = {vih:0, hbs:0, vdrl:0, hcv:0, outros:0};
  periodo.dates.forEach(function(d){
    const snap = hist[d] && hist[d].snapshot;
    if (!snap) return;
    Object.keys(transf).forEach(function(k){ transf[k] += (snap.transfusoes && snap.transfusoes[k]) || 0; });
    Object.keys(doad).forEach(function(k){ doad[k] += (snap.doadores && snap.doadores[k]) || 0; });
    Object.keys(sero).forEach(function(k){ sero[k] += (snap.serologia && snap.serologia[k]) || 0; });
  });
  const totalTransf = somaObj(transf), totalDoad = somaObj(doad), totalSero = somaObj(sero);
  if (totalTransf === 0 && totalDoad === 0){ renderSecaoVazia('hemo'); _secaoDados.hemo=null; return; }
  const transfLabels = {plaquetas:'Plaquetas', plasmas:'Plasmas', globulos:'Glóbulos', crio:'Crioprecipitado'};
  const doadLabels = {voluntarios:'Voluntários', familiares:'Familiares', habituais:'Habituais'};
  const seroLabels = {vih:'VIH', hbs:'Hepatite B', vdrl:'VDRL (Sífilis)', hcv:'Hepatite C', outros:'Outros'};
  const transfRows = ordenarDesc(Object.keys(transf).map(function(k){ return {nome:transfLabels[k], v:transf[k]}; }));
  const doadRows = ordenarDesc(Object.keys(doad).map(function(k){ return {nome:doadLabels[k], v:doad[k]}; }));
  const seroRows = ordenarDesc(Object.keys(sero).map(function(k){ return {nome:seroLabels[k], v:sero[k]}; }));
  const charts = [ { title:'Transfusões por Tipo', canvasId:'chart-hemo-transf', config: barChartConfig(transfRows.map(r=>r.nome), transfRows.map(r=>r.v), {color:'#DB2777'}) } ];
  if (doadRows.length) charts.push({ title:'Doadores por Tipo', canvasId:'chart-hemo-doad', config: barChartConfig(doadRows.map(r=>r.nome), doadRows.map(r=>r.v), {color:'#BE185D'}) });
  if (seroRows.length) charts.push({ title:'Serologia Positiva', canvasId:'chart-hemo-sero', config: pieChartConfig(seroRows.map(r=>r.nome), seroRows.map(r=>r.v)) });
  renderSecao('hemo', [ {val:totalTransf, lbl:'Total Transfusões'}, {val:totalDoad, lbl:'Total Doadores'}, {val:totalSero, lbl:'Serologias Positivas'} ], charts);
  _secaoDados.hemo = { totalTransf, totalDoad, transfRows, doadRows, seroRows, periodoFalado: periodo.periodoFalado };
}
function narrarHemoterapia(){
  const d = _secaoDados.hemo;
  if (!d){ window.zeloFalar('Ainda não há dados de hemoterapia para este período.'); return; }
  let txt = 'Na '+d.periodoFalado+', a hemoterapia registou um total de '+d.totalTransf+(d.totalTransf===1?' transfusão':' transfusões')+'.';
  if (d.transfRows.length) txt += ' Por tipo: '+d.transfRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';
  txt += ' Total de doadores: '+d.totalDoad+'.';
  if (d.doadRows.length) txt += ' Por tipo: '+d.doadRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';
  if (d.seroRows.length) txt += ' Serologia positiva: '+d.seroRows.map(r=>r.nome+' com '+r.v).join(', ')+'.';

/* ── 7. Farmácia ──
   registos_sistemas_locais/farmacia_central = { snapshot:{produtos:[{descricao,classe,stock,stockMin,estado}], movimentos:[...]} }
   Ao contrário dos outros serviços, isto é o ESTADO ACTUAL de stock, não um
   histórico por dia — por isso não depende do período seleccionado, mostra
   sempre a situação de agora (tal como a leitura de voz zeloResumoStockVoz,
   que já existe na página da Farmácia). */
async function carregarFarmacia(){
  const pronto = await esperarFirebase();
  if (!pronto || !window.__fbGet){ renderSecaoVazia('farm'); _secaoDados.farm=null; return; }
  let dados;
  try{ dados = await window.__fbGet('registos_sistemas_locais/farmacia_central'); }catch(e){ dados = null; }
  const produtos = (dados && dados.snapshot && dados.snapshot.produtos) || [];
  if (!produtos.length){ renderSecaoVazia('farm', 'Ainda não há dados de stock guardados.'); _secaoDados.farm=null; return; }
  const esgotados = produtos.filter(function(p){ return (p.stock||0) <= 0; });
  const baixo = produtos.filter(function(p){ return (p.stock||0) > 0 && (p.stock||0) <= (p.stockMin||0); });
  const criticos = produtos.filter(function(p){ return (p.stock||0) <= (p.stockMin||0); })
    .sort(function(a,b){ return (a.stock||0)-(b.stock||0); }).slice(0,8);
  const normal = produtos.length - esgotados.length - baixo.length;
  const charts = [];
  if (criticos.length) charts.push({ title:'Produtos com Stock Mais Crítico', canvasId:'chart-farm', config: barChartConfig(criticos.map(p=>p.descricao||p.codigo||'—'), criticos.map(p=>p.stock||0), {horizontal:true, color:'#DC2626'}) });
  charts.push({ title:'Estado Geral do Stock', canvasId:'chart-farm-estado', config: pieChartConfig(['Normal','Stock Baixo','Esgotado'], [normal, baixo.length, esgotados.length]) });
  renderSecao('farm',
    [ {val:produtos.length, lbl:'Produtos no Stock'}, {val:esgotados.length, lbl:'Esgotados'}, {val:baixo.length, lbl:'Stock Baixo'} ],
    charts
  );
  _secaoDados.farm = { totalProdutos: produtos.length, esgotados: esgotados.length, baixo: baixo.length };
}
function narrarFarmacia(){
  const d = _secaoDados.farm;
  if (!d){ window.zeloFalar('Ainda não há dados de stock da farmácia.'); return; }
  if (!d.esgotados && !d.baixo){ window.zeloFalar('O stock da farmácia está normal — sem produtos esgotados nem em stock baixo.'); return; }
  let txt = 'Estado do stock da farmácia: ';
  const partes = [];
  if (d.esgotados) partes.push(d.esgotados+(d.esgotados===1?' produto esgotado':' produtos esgotados'));
  if (d.baixo) partes.push(d.baixo+(d.baixo===1?' produto com stock baixo':' produtos com stock baixo'));
  txt += partes.join(' e ')+'.';
  window.zeloFalar(txt);
}

/* ── Ligação ao botão "Ler em voz" de cada secção ── */
const NARRADORES = { proc:narrarProcedimentos, bloco:narrarBloco, ce:narrarConsultaExterna, imag:narrarImagiologia, lab:narrarLaboratorio, hemo:narrarHemoterapia, farm:narrarFarmacia };
window.narrarSecao = function(id){
  if (typeof window.zeloFalar !== 'function') return;
  const fn = NARRADORES[id];
  if (fn) fn();
};

/* ── Carregar tudo para o período seleccionado ── */
async function carregarTudo(){
  const periodo = calcularPeriodo();
  if (!periodo || !periodo.dates.length){ return; }
  document.getElementById('periodResumoLabel').textContent = 'A carregar ' + periodo.label + '…';
  const btn = document.getElementById('btnCarregar');
  btn.disabled = true; btn.textContent = 'A carregar…';
  await Promise.all([
    carregarProcedimentos(periodo),
    carregarBloco(periodo),
    carregarConsultaExterna(periodo),
    carregarImagiologia(periodo),
    carregarLaboratorio(periodo),
    carregarHemoterapia(periodo),
    carregarFarmacia(),
  ]);
  document.getElementById('periodResumoLabel').textContent = 'A mostrar: ' + periodo.label;
  btn.disabled = false; btn.textContent = 'Carregar';
}
document.getElementById('btnCarregar').addEventListener('click', carregarTudo);
esperarFirebase().then(function(){ carregarTudo(); });
</script>
