<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Configuração Inicial · ZELO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@500&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@500&display=swap"></noscript>
<style>
:root{
  --nv:#0D1B3E;--nv2:#122754;--nv3:#0a3a66;--bl:#1A56DB;--cy:#0EA5E9;--cyl:#22D3EE;
  --sf:#F4F7FF;--br:#E2E8F0;--br2:#CBD5E1;--tx:#0F172A;--tx2:#334155;--tx3:#64748B;
  --gr:#059669;--rd:#DC2626;--am:#D97706;--pu:#7C3AED;
  --r:10px;--r2:16px;--s1:0 2px 10px rgba(13,27,62,.08);--s2:0 10px 32px rgba(13,27,62,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:var(--sf);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
.topbar{background:var(--nv);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:10px;
  font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.04em;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;}
.topbar .dot{width:6px;height:6px;border-radius:50%;background:var(--cyl);box-shadow:0 0 0 3px rgba(34,211,238,.2);flex-shrink:0;}
.topbar img{width:22px;height:22px;border-radius:6px;flex-shrink:0;}
.topbar a.back{margin-left:auto;color:#fff;text-decoration:none;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:5px 12px;white-space:nowrap;}
main{max-width:520px;margin:40px auto;padding:0 20px 60px;width:100%;box-sizing:border-box;flex:1;}
.panel{background:#fff;border:1px solid var(--br);border-radius:var(--r2);box-shadow:var(--s1);padding:28px;}
.panel h1{font-size:1.15rem;font-weight:800;margin-bottom:6px;}
.panel .sub{font-size:.8rem;color:var(--tx3);margin-bottom:20px;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.74rem;font-weight:700;color:var(--tx2);margin-bottom:5px;}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--br);border-radius:var(--r);font-family:'Inter',sans-serif;
  font-size:.9rem;color:var(--tx);background:#fff;transition:border-color .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(26,86,219,.12);}
.btn-primary{width:100%;margin-top:6px;background:var(--bl);color:#fff;border:none;border-radius:var(--r);padding:12px;
  font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-primary:hover{background:#164ac2;}
.btn-primary[disabled]{opacity:.7;cursor:default;}
.msg{border-radius:9px;padding:11px 13px;font-size:.8rem;margin-bottom:16px;display:none;line-height:1.5;}
.msg.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;}
.msg.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534;}
.msg.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1D4ED8;}
footer{background:var(--nv);color:#C7D2E8;margin-top:auto;}
.foot-grid{max-width:1100px;margin:0 auto;padding:26px 20px 20px;display:flex;justify-content:space-between;
  align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.09);}
.foot-meta{font-family:'DM Mono',monospace;font-size:.66rem;color:#7288B0;text-align:right;line-height:1.6;}
</style>
</head>
<body>

<div class="topbar">
  <span class="dot"></span>
  <img src="icons/logo.png" alt="ZELO"/>
  <span>ZELO · Configuração Inicial</span>
  <a class="back" href="index.html"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Início</a>
</div>

<main>
  <div class="panel">
    <h1 id="pTitle">A verificar…</h1>
    <p class="sub" id="pSub">Estamos a verificar se já existe algum administrador configurado.</p>

    <div class="msg" id="msg"></div>

    <form id="setupForm" style="display:none;">
      <div class="field">
        <label for="fNome">Nome</label>
        <input id="fNome" type="text" placeholder="Nome do administrador" required/>
      </div>
      <div class="field">
        <label for="fEmail">Email</label>
        <input id="fEmail" type="email" placeholder="admin@hospitaldoprenda.ao" required/>
      </div>
      <div class="field">
        <label for="fPass">Password</label>
        <input id="fPass" type="password" placeholder="mínimo 6 caracteres" minlength="6" required/>
      </div>
      <div class="field">
        <label for="fPass2">Confirmar Password</label>
        <input id="fPass2" type="password" placeholder="repita a password" minlength="6" required/>
      </div>
      <button type="submit" class="btn-primary" id="setupBtn">Criar conta de Administrador</button>
    </form>
  </div>
</main>

<footer>
  <div class="foot-grid">
    <div style="font-size:.78rem;font-weight:700;color:#fff;">ZELO</div>
    <div class="foot-meta">Uso interno · Luanda, Angola<br/><span id="footyear"></span> ZELO</div>
  </div>
</footer>

<script type="module">
import { auth, db, ref, get, set, signInWithEmailAndPassword, signOut } from './zelo_auth.js';
import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

document.getElementById('footyear').textContent = new Date().getFullYear();

const pTitle = document.getElementById('pTitle');
const pSub = document.getElementById('pSub');
const msg = document.getElementById('msg');
const form = document.getElementById('setupForm');
const btn = document.getElementById('setupBtn');

function showMsg(text, kind){
  msg.textContent = text;
  msg.className = 'msg ' + kind;
  msg.style.display = 'block';
}

(async function init(){
  try{
    const snap = await get(ref(db, 'users'));
    if(snap.exists()){
      pTitle.textContent = 'Já existe um administrador';
      pSub.textContent = 'Este sistema já tem pelo menos uma conta configurada. Use o painel normal para gerir utilizadores.';
      showMsg('Se precisas de acesso, contacta um administrador existente para criar a tua conta em Administração → Utilizadores.', 'info');
      return;
    }
    pTitle.textContent = 'Criar a primeira conta de Administrador';
    pSub.textContent = 'Ainda não existe nenhum utilizador configurado no ZELO. Cria aqui a primeira conta de Administrador — depois disso, esta página deixa de permitir novas criações.';
    form.style.display = 'block';
  }catch(e){
    pTitle.textContent = 'Erro de ligação';
    pSub.textContent = 'Não foi possível contactar o Firebase. Verifica a tua ligação à internet e recarrega a página.';
    console.error(e);
  }
})();

form.addEventListener('submit', async function(e){
  e.preventDefault();
  msg.style.display = 'none';
  const nome = document.getElementById('fNome').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const pass = document.getElementById('fPass').value;
  const pass2 = document.getElementById('fPass2').value;
  if(pass !== pass2){ showMsg('As passwords não coincidem.', 'err'); return; }
  if(pass.length < 6){ showMsg('A password deve ter pelo menos 6 caracteres.', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'A criar conta…';
  try{
    // verificação final (evita corrida entre dois administradores a configurar ao mesmo tempo)
    const snap = await get(ref(db, 'users'));
    if(snap.exists()){ showMsg('Já foi criado um administrador entretanto. Recarregue a página.', 'err'); btn.disabled=false; btn.textContent='Criar conta de Administrador'; return; }

    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await set(ref(db, 'users/' + cred.user.uid), {
      nome, email, role: 'admin', ativo: true, criadoEm: Date.now()
    });
    await signOut(auth);
    form.style.display = 'none';
    pTitle.textContent = 'Conta criada com sucesso!';
    pSub.textContent = 'Já podes iniciar sessão no ZELO com este email e password.';
    showMsg('Administrador criado: ' + email + '. Vai a Início para iniciar sessão.', 'ok');
  }catch(e2){
    btn.disabled = false;
    btn.textContent = 'Criar conta de Administrador';
    let m = 'Não foi possível criar a conta.';
    if(e2 && e2.code === 'auth/email-already-in-use') m = 'Este email já está registado.';
    if(e2 && e2.code === 'auth/invalid-email') m = 'Email inválido.';
    if(e2 && e2.code === 'auth/weak-password') m = 'Password demasiado fraca.';
    showMsg(m, 'err');
    console.error(e2);
  }
});
</script>
<script src="zelo_theme.js"></script>
<script src="zelo_assistente.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        if (reg && reg.update) reg.update().catch(() => {});
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
