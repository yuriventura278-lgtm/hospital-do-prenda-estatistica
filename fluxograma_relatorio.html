<html lang="pt-AO">

<title>Protocolos e Fluxogramas · Hospital do Prenda</title>
<link rel="icon" type="image/png" href="icons/logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--nv:#0B2545;--nv2:#13315C;--bg:#EEF2F8;--sf:#fff;--br:#DCE3EE;--tx:#132033;--tx2:#4B5B70;--tx3:#8B98AA;--ouro:#D4A017;--ok:#2F855A;--nao:#B3263E;--ciano:#0E9FB8;--f:Inter,'Segoe UI',Arial,sans-serif}
html[data-zelo-theme="dark"]{--bg:#0B1220;--sf:#111A2B;--br:#1F2A3D;--tx:#E6ECF5;--tx2:#AAB6C8;--tx3:#7C8AA0}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
header.flx-top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--nv);color:#fff;flex-wrap:wrap}
header.flx-top img{width:34px;height:34px;border-radius:9px}
header.flx-top h1{margin:0;font-size:1.02rem}
header.flx-top .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.bt{display:inline-flex;gap:7px;align-items:center;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 14px;font:700 .8rem var(--f);cursor:pointer;text-decoration:none}
.bt:hover{background:rgba(255,255,255,.18)}
main{flex:1;width:100%;padding:18px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
/* ── palco 16:9 (como uma apresentação) ── */
.apr{width:100%;max-width:1280px;display:flex;flex-direction:column;gap:10px}
.palco{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 18px 50px rgba(11,37,69,.22);outline:none}
html[data-zelo-theme="dark"] .palco{background:#0F1828}
.lamina{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;visibility:hidden;opacity:0;transition:opacity .45s ease}
.lamina.on{visibility:visible;opacity:1}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.barra .nav{width:42px;height:42px;border-radius:12px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font:800 1.2rem var(--f);cursor:pointer}
.barra .nav:disabled{opacity:.4;cursor:default}
.pontos{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.pontos button{width:11px;height:11px;border-radius:50%;border:0;background:#C3CEDD;cursor:pointer;padding:0}
.pontos button.on{background:var(--nv);width:28px;border-radius:6px}
html[data-zelo-theme="dark"] .pontos button.on{background:#7FB3E6}
.conta{font:800 .85rem var(--f);color:var(--tx2);min-width:62px;text-align:center}
.prog{height:4px;border-radius:3px;background:#D6DEEA;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ciano),var(--ouro));transition:width .4s ease}
.bt2{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--br);background:var(--sf);color:var(--tx);border-radius:999px;padding:9px 14px;font:700 .8rem var(--f);cursor:pointer}
.bt2.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.dica{font-size:.76rem;color:var(--tx3);text-align:center}
/* índice (miniaturas) */
.indice{display:none;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.indice.on{display:grid}
.indice button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--br);background:var(--sf);color:var(--tx);border-radius:12px;padding:10px 12px;cursor:pointer;font:600 .82rem var(--f)}
.indice button b{width:28px;height:28px;border-radius:8px;background:var(--nv);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.indice button.on{border-color:var(--ciano);box-shadow:0 0 0 3px rgba(14,159,184,.18)}
/* ecrã inteiro */
.apr:fullscreen{max-width:none;background:#0B1220;justify-content:center;padding:18px 24px}
.apr:fullscreen .palco{width:min(100%,calc((100vh - 110px) * 16 / 9));margin:0 auto}
.apr:fullscreen .indice,.apr:fullscreen .dica{display:none}
.apr:fullscreen .conta{color:#CBD5E1}
/* ── conteúdo das lâminas (desenhado a 1280×720) ── */
.lam{width:1280px;height:720px;display:flex;color:#132033;background:#fff;font-family:var(--f);position:relative}
html[data-zelo-theme="dark"] .lam{background:#0F1828;color:#E6ECF5}
.lado{width:330px;flex-shrink:0;background:linear-gradient(165deg,#0B2545,#13315C 60%,#1C4A73);color:#fff;padding:40px 30px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lado:after{content:"";position:absolute;right:-90px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(255,255,255,.05)}
.lado .sec{font-size:15px;font-weight:800;letter-spacing:.14em;color:#7FD3E3}
.lado .big{font-size:76px;font-weight:900;line-height:1;color:rgba(255,255,255,.14);margin-top:6px}
.lado h2{margin:10px 0 0;font-size:30px;line-height:1.15;font-weight:900}
.lado p{margin:14px 0 0;font-size:15px;line-height:1.5;color:#C8D6EA}
.lado .leg{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:13px;color:#C8D6EA}
.lado .leg span{display:flex;align-items:center;gap:10px}
.lado .leg i{display:inline-block;width:18px;height:14px;border-radius:4px;border:2px solid #fff}
.lado .leg i.d{transform:rotate(45deg) scale(.8);border-radius:2px}
.lado .marca{font-size:12px;color:#8FA6C8;margin-top:18px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.area{flex:1;position:relative;padding:26px 34px 40px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.area.centro{align-items:center}
.corpo{transform-origin:top center;width:100%;display:flex;flex-direction:column;align-items:center}
.rod{position:absolute;left:330px;right:0;bottom:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:12px;color:#5B6B80;border-top:1px solid #E3E8F0;background:#FAFCFE}
html[data-zelo-theme="dark"] .rod{background:#0C1422;border-color:#1F2A3D;color:#94A3B8}
.rod em{font-style:italic}
/* fluxo */
.col{width:640px;display:flex;flex-direction:column;align-items:center;position:relative}
.passo{width:100%;background:#fff;border:2.5px solid var(--c);border-radius:16px;padding:12px 18px;display:flex;gap:14px;align-items:center;box-shadow:5px 5px 0 rgba(15,30,55,.08);position:relative}
html[data-zelo-theme="dark"] .passo,html[data-zelo-theme="dark"] .lateral,html[data-zelo-theme="dark"] .prazo,html[data-zelo-theme="dark"] .pessoa,html[data-zelo-theme="dark"] .mv{background:#14203A}
.passo .num{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.passo h3{margin:0;font-size:18px;font-weight:800}
.passo p{margin:3px 0 0;color:#4B5B70;font-size:14px;line-height:1.4}
html[data-zelo-theme="dark"] .passo p,html[data-zelo-theme="dark"] .mv p{color:#AAB6C8}
.passo .tag{position:absolute;right:-12px;top:-12px;background:var(--c);color:#fff;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
.passo.alerta{--c:#B3263E;background:#FFF5F6}
.seta{width:3px;height:22px;background:#0B2545;position:relative;transform-origin:top}
.seta:after{content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid #0B2545;border-bottom:0}
.seta.sim{background:var(--ok)}.seta.sim:after{border-top-color:var(--ok)}
.seta.nao{background:var(--nao)}.seta.nao:after{border-top-color:var(--nao)}
html[data-zelo-theme="dark"] .seta:not(.sim):not(.nao){background:#8FA6C8}html[data-zelo-theme="dark"] .seta:not(.sim):not(.nao):after{border-top-color:#8FA6C8}
.seta .r{position:absolute;left:12px;top:2px;font-size:12px;font-weight:900;white-space:nowrap}
.seta.sim .r{color:var(--ok)}.seta.nao .r{color:var(--nao)}
.dec{position:relative;width:100%;display:flex;justify-content:center}
.los{width:300px;height:86px;position:relative;display:flex;align-items:center;justify-content:center}
.los svg{position:absolute;inset:0;width:100%;height:100%}
.los span{position:relative;font-weight:800;font-size:14.5px;text-align:center;max-width:200px;line-height:1.25}
.ramo{position:absolute;left:calc(50% + 150px);top:50%;transform:translateY(-50%);display:flex;align-items:center}
.ramo .ln{width:46px;height:3px;position:relative;transform-origin:left}
.ramo .ln b{position:absolute;top:-19px;left:6px;font-size:12px;font-weight:900}
.ramo .ln:after{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);border:6px solid transparent;border-left:8px solid currentColor;border-right:0}
.lateral{width:250px;background:#fff;border:2.5px solid currentColor;border-radius:14px;padding:10px 13px;font-weight:700;font-size:13.5px;line-height:1.35;display:flex;gap:9px;box-shadow:4px 4px 0 rgba(15,30,55,.08);color:inherit}
.lateral i{width:12px;height:12px;border-radius:50%;background:currentColor;flex-shrink:0;margin-top:3px}
.lateral span{color:#132033}
html[data-zelo-theme="dark"] .lateral span{color:#E6ECF5}
.ramo.ok{color:var(--ok)}.ramo.ok .ln{background:var(--ok)}
.ramo.mau{color:var(--nao)}.ramo.mau .ln{background:var(--nao)}
.nota{width:640px;background:#F0F7FB;border:1.5px dashed #7FB8CC;color:#24506A;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px;text-align:center}
.prazos{display:flex;gap:14px;width:860px;margin-bottom:16px}
.prazo{flex:1;background:#fff;border:2px solid var(--c);border-radius:14px;padding:12px 14px;text-align:center;border-top-width:7px}
.prazo b{display:block;font-size:13px;letter-spacing:.14em;color:var(--c)}
.prazo span{display:block;font-size:16px;font-weight:800;margin-top:4px}
.subt{font-size:15px;font-weight:900;letter-spacing:.06em;color:#C0561C;margin:0 0 12px;text-transform:uppercase}
/* organograma */
.org{width:100%;display:flex;flex-direction:column;align-items:center}
.raiz{background:linear-gradient(135deg,#0B2545,#1C4A73);color:#fff;border-radius:16px;padding:16px 30px;text-align:center;font-weight:900;font-size:19px;letter-spacing:.03em;box-shadow:0 10px 24px rgba(11,37,69,.25)}
.raiz small{display:block;font-size:12px;color:#7FD3E3;letter-spacing:.14em;margin-bottom:4px}
.ramos-org{position:relative;width:100%;height:38px}
.ramos-org .v{position:absolute;left:50%;top:0;width:3px;height:19px;background:#0B2545;transform-origin:top}
.ramos-org .h{position:absolute;left:12.5%;right:12.5%;top:18px;height:3px;background:#0B2545;transform-origin:center}
.ramos-org .p{position:absolute;top:18px;width:3px;height:20px;background:#0B2545;transform-origin:top}
html[data-zelo-theme="dark"] .ramos-org .v,html[data-zelo-theme="dark"] .ramos-org .h,html[data-zelo-theme="dark"] .ramos-org .p{background:#8FA6C8}
.pessoas{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}
.pessoa{background:#fff;border:2px solid var(--c);border-radius:16px;overflow:hidden;box-shadow:5px 5px 0 rgba(15,30,55,.07)}
.pessoa .nm{background:var(--c);color:#fff;padding:12px 14px;font-weight:900;font-size:15.5px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.pessoa .nm em{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;flex-shrink:0}
.pessoa ul{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.pessoa li{font-size:14px;font-weight:600;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--c) 9%,transparent);border-left:4px solid var(--c);line-height:1.3}
/* movimento */
.mvg{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.mv{background:#fff;border:2px solid var(--c);border-radius:16px;padding:13px 16px;position:relative;box-shadow:5px 5px 0 rgba(15,30,55,.07)}
.mv.larga{grid-column:1 / -1}
.mv .cab{display:flex;gap:12px;align-items:center}
.mv .num{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mv h3{margin:0;font-size:18px;font-weight:900}
.mv p{margin:6px 0 0;font-size:14px;color:#4B5B70;line-height:1.4}
.filhos{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.filho{flex:1;min-width:130px;border-radius:12px;padding:8px 11px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.filho b{font-size:12.5px;letter-spacing:.08em;color:var(--c)}
.filho span{display:block;font-size:12.5px;margin-top:2px;line-height:1.35}
.neto{display:flex;gap:6px;margin-top:6px}
.neto em{flex:1;font-style:normal;font-size:11.5px;font-weight:700;background:#fff;border-radius:8px;padding:5px 6px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);line-height:1.3}
html[data-zelo-theme="dark"] .neto em{background:#0F1828}
.formula{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.formula span{padding:8px 14px;border-radius:10px;font-weight:900;font-size:15px;color:#fff}
.formula b{font-size:22px;color:#0B2545}
html[data-zelo-theme="dark"] .formula b{color:#E6ECF5}
/* capa */
.capa{width:1280px;height:720px;background:radial-gradient(1200px 600px at 85% 10%,#1C4A73 0%,#0B2545 55%,#071A33 100%);color:#fff;display:flex;padding:56px 64px;gap:50px;position:relative;overflow:hidden}
.capa:before{content:"";position:absolute;left:-120px;bottom:-160px;width:460px;height:460px;border-radius:50%;border:60px solid rgba(127,211,227,.06)}
.capa .esq{width:520px;display:flex;flex-direction:column;position:relative}
.capa img{width:76px;height:76px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.capa .hp{margin-top:26px;font-size:15px;font-weight:800;letter-spacing:.22em;color:#7FD3E3}
.capa h2{margin:10px 0 0;font-size:62px;line-height:1.02;font-weight:900}
.capa h2 em{font-style:normal;color:var(--ouro)}
.capa .sv{margin-top:18px;font-size:17px;color:#C8D6EA;line-height:1.5}
.capa .ref{margin-top:auto;font-size:13px;color:#8FA6C8;border-top:1px solid rgba(255,255,255,.18);padding-top:14px}
.capa .dir{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.capa .dir h4{margin:0 0 14px;font-size:13px;letter-spacing:.2em;color:#7FD3E3}
.capa .itens{display:grid;grid-template-columns:1fr;gap:9px}
.capa .itens button{display:flex;align-items:center;gap:14px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:11px 14px;font:700 15px var(--f);cursor:pointer;transition:background .2s,transform .2s}
.capa .itens button:hover{background:rgba(127,211,227,.18);transform:translateX(4px)}
.capa .itens b{width:30px;height:30px;border-radius:9px;background:rgba(127,211,227,.2);color:#7FD3E3;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
/* ── animações (como numa apresentação) ── */
.an{opacity:0}
.lamina.on .an{animation:entra .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 170ms + 120ms)}
.lamina.on .an.cresce{animation-name:cresceV;animation-duration:.35s}
.lamina.on .an.cresceH{animation-name:cresceH;animation-duration:.4s}
.lamina.on .an.pop{animation-name:pop;animation-duration:.5s}
.lamina.on .an.lado-e{animation-name:daEsq}
@keyframes entra{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes cresceV{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes cresceH{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes daEsq{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.ramo .an.cresceH{transform-origin:left}
.lamina.on .an.pulsa{animation:entra .55s cubic-bezier(.2,.8,.2,1) both,pulsa 2.2s ease-in-out infinite;animation-delay:calc(var(--d,0) * 170ms + 120ms),calc(var(--d,0) * 170ms + 900ms)}
@keyframes pulsa{0%,100%{box-shadow:5px 5px 0 rgba(15,30,55,.08)}50%{box-shadow:0 0 0 6px rgba(212,160,23,.25),5px 5px 0 rgba(15,30,55,.08)}}
@media (prefers-reduced-motion:reduce){.an{opacity:1!important;animation:none!important}.lamina{transition:none}}
@media(max-width:700px){main{padding:12px 8px 20px}.pontos{display:none}.barra{justify-content:center}header.flx-top{padding:10px 12px}.bt span{display:none}.barra .bt2 span{display:none}}
@media print{header.flx-top,#zmf-btn,#zas-btn,.zr-rodape,.barra,.prog,.indice,.dica{display:none!important}body{background:#fff}}
</style>
<style id="zelo-sem-setas">/* ZELO: nenhuma caixa de preenchimento com setas (em todo o sistema) */
input[type=number]{-moz-appearance:textfield !important;appearance:textfield !important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none !important;appearance:none !important;margin:0 !important;display:none !important}</style>
<script id="zelo-sem-setas-js">/* A roda do rato e as setas do teclado não mudam números sem querer
   (as páginas que usam as setas para andar entre células continuam a funcionar). */
(function(){if(window.__zeloSemSetas)return;window.__zeloSemSetas=1;
function num(e){return e&&e.tagName==='INPUT'&&e.type==='number';}
document.addEventListener('wheel',function(e){var t=e.target;if(num(t)&&document.activeElement===t)t.blur();},{passive:true});
document.addEventListener('keydown',function(e){if(num(e.target)&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&!e.defaultPrevented)e.preventDefault();});})();</script>
</head>
<body>
<header class="flx-top">
  <img src="icons/logo.png" alt="ZELO">
  <h1>Protocolos e Fluxogramas</h1>
  <div class="acoes">
    <button type="button" class="bt" id="flxPdf"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg><span>PDF</span></button>
    <a class="bt" href="index.html"><svg class="i" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Início</span></a>
  </div>
</header>
<main>
  <div class="apr" id="apr">
    <div class="palco" id="palco" tabindex="0" aria-roledescription="apresentação" aria-label="Protocolos e Fluxogramas"></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="barra">
      <button type="button" class="nav" id="ant" aria-label="Diapositivo anterior">‹</button>
      <div class="conta" id="conta">1 / 1</div>

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

        h += '<div class="passo an' + (no.alerta ? ' alerta pulsa' : '') + '" style="--d:' + (d++) + ';--c:' + c + '"><div class="num">' + n + '</div><div><h3>' + esc(no.t) + '</h3><p>' + esc(no.x) + '</p></div>' + (no.tag ? '<span class="tag">' + esc(no.tag) + '</span>' : '') + '</div>';
      } else {
        var ok = no.lado === 'SIM' && !/Reporte/.test(no.txt), cl = ok ? 'ok' : 'mau';
        h += '<div class="dec"><div class="los an pop" style="--d:' + (d++) + '"><svg viewBox="0 0 300 86" preserveAspectRatio="none"><polygon points="150,3 297,43 150,83 3,43" fill="#FFFBEB" stroke="#C28A17" stroke-width="3"/></svg><span>' + esc(no.q) + '</span></div>' +
          '<div class="ramo ' + cl + '"><div class="ln an cresceH" style="--d:' + (d++) + '"><b>' + no.lado + '</b></div><div class="lateral an" style="--d:' + (d++) + '"><i></i><span>' + esc(no.txt) + '</span></div></div></div>';

  function orgHTML(s){
    var cores = ['#2C6E91','#3B7A4E','#6A4C9C','#C28A17'];

      '<div class="ramos-org"><div class="v an cresce" style="--d:3"></div><div class="h an cresceH" style="--d:4"></div>' +

  function movHTML(){

      bloco(3, '#B3263E', 'Saídos', 'Total de doentes que saíram do serviço durante o dia (por alta, óbito ou transferência).',

  // ── montagem e navegação ──
  var palco = document.getElementById('palco'), atual = 0, lams = [], auto = null;

  indice.innerHTML = L.map(function(s, i){ return '<button type="button" data-ir="' + i + '"><b>' + i + '</b>' + esc(s.tit) + '</button>'; }).join('');
  // Ajusta o desenho (1280×720) ao tamanho do palco e encolhe um fluxograma longo para caber.
  function escala(){
    var k = palco.clientWidth / 1280;
    lams.forEach(function(l){ l.style.transform = 'scale(' + k + ')'; });
  }
  function caber(l){
    var area = l.querySelector('.area'), corpo = l.querySelector('.corpo'); if (!area || !corpo) return;
    corpo.style.transform = 'none';
    var cs = getComputedStyle(area), disp = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6, alt = corpo.scrollHeight;
    if (alt > disp) corpo.style.transform = 'scale(' + Math.max(0.55, disp / alt).toFixed(3) + ')';
  }
  function ir(i, semAnim){
    if (i < 0 || i >= L.length) return;
    lams[atual].classList.remove('on');

    // Reinicia as animações do diapositivo
    l.classList.remove('on'); void l.offsetWidth; l.classList.add('on');

    document.getElementById('prog').style.width = ((i + 1) * 100 / L.length) + '%';

    Array.prototype.forEach.call(indice.children, function(b, j){ b.classList.toggle('on', j === i); });
    try { history.replaceState(null, '', '#d' + (i + 1)); } catch (e) {}
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-ir]'); if (b){ pararAuto(); ir(+b.dataset.ir); palco.focus({ preventScroll:true }); }
  });
  document.getElementById('ant').onclick = function(){ pararAuto(); ir(atual - 1); };
  document.getElementById('seg').onclick = function(){ pararAuto(); ir(atual + 1); };
  document.getElementById('btRepetir').onclick = function(){ ir(atual); };
  document.getElementById('btIndice').onclick = function(){ var on = indice.classList.toggle('on'); this.classList.toggle('on', on); this.setAttribute('aria-pressed', on); };

  };

  document.addEventListener('keydown', function(e){
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && document.activeElement === palco)) { e.preventDefault(); pararAuto(); ir(atual + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pararAuto(); ir(atual - 1); }
    else if (e.key === 'Home') { ir(0); } else if (e.key === 'End') { ir(L.length - 1); }
    else if (e.key === 'f' || e.key === 'F') { document.getElementById('btEcra').click(); }
  });
  var x0 = null;
  palco.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive:true });
  palco.addEventListener('touchend', function(e){ if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50){ pararAuto(); ir(atual + (dx < 0 ? 1 : -1)); } });
  window.addEventListener('resize', escala);
  escala();
  var m = /#d(\d+)/.exec(location.hash), ini = m ? Math.min(L.length, Math.max(1, +m[1])) - 1 : 0;
  ir(ini);
  window.ZeloFluxo = { ir: ir, atual: function(){ return atual; }, total: L.length };
})();

/* ── PDF: todos os temas, desenhados em vetor (nítidos a qualquer tamanho) ── */

        var x = 14 + i * (cw + 3), c = ['#2C6E91','#3B7A4E','#6A4C9C','#C28A17'][i];

        var yy = top + 15;
        p[1].forEach(function(sv){ var ln = d.splitTextToSize(T(sv), cw - 6); var hh = ln.length * 4 + 4; d.setFillColor('#F1F5F9'); d.rect(x, yy, cw, hh, 'F'); d.setFillColor(c); d.rect(x, yy, 1.4, hh, 'F'); d.setTextColor('#132033'); d.setFont('helvetica', 'normal'); d.setFontSize(8.5); d.text(ln, x + 3.5, yy + 4.6); d.setFont('helvetica', 'bold'); yy += hh + 2; });
      });
      return;
    }
    if (s.tipo === 'mov') {
      var itens = [['1','Existência Anterior','N.º de doentes já internados no início do dia — igual ao "Ficam Existindo" do dia anterior.',[]],
        ['2','Admitidos (Entrados)','Total de doentes que deram entrada no serviço durante o dia.',[['Diretos','Admissão direta ao serviço (não vem de outro serviço interno).'],['Transferidos','Doente vindo de outro serviço de internamento do hospital.']]],
        ['3','Saídos','Total de doentes que saíram do serviço durante o dia (por alta, óbito ou transferência).',[['Vivos','Alta clínica — saída com vida.'],['Falecidos','Óbitos ocorridos no serviço. -48H: óbito até 48h após a admissão; +48H: óbito após 48h da admissão.'],['Transferido','Doente enviado para outro serviço de internamento.']]],
        ['4','Ficam Existindo','Existência Anterior + Admitidos − Saídos. Torna-se a Existência Anterior do dia seguinte.',[]],

      itens.forEach(function(it, i){

    s.nos.forEach(function(no, i){
      if (i > 0) { var r = prox; prox = null; seta(cx, y, y + 7, r === 'SIM' ? '#2F855A' : r === 'NÃO' ? '#B3263E' : '#0B2545', r); y += 7; }

        n++; var c = no.alerta ? '#B3263E' : COR[cor++ % COR.length];
