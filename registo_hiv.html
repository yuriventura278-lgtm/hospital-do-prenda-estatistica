<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Página retirada — Hospital do Prenda</title>
<link rel="icon" type="image/png" href="icons/logo.png"/>
<!--
  As páginas «Registo VIH · Geral» e «Testagem de VIH» foram retiradas do
  Serviço de Estatística (a testagem regista-se no Laboratório e na
  Hemoterapia). Este endereço
  continua a existir apenas para quem o tiver guardado: antes de seguir,
  envia para o Firebase os registos antigos que existam só neste computador
  (localStorage hiv_reg_v1_hist → registos_sistemas_locais/registo_hiv), para
  que nenhum dado se perca. Nada é apagado — nem aqui, nem no Firebase.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { firebaseConfig } from './zelo_firebase_config.js';
  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.__fbSet = (path,val)=>set(ref(db,path),val);
    window.__fbGet = (path)=>get(ref(db,path)).then(snap=>snap.exists()?snap.val():null);
    window.__fbReady = true;
  }catch(e){ window.__fbReady = false; }
</script>
<script>window.ZELO_MODULE='sistemas_independentes';window.ZELO_SO_ADMIN=true;</script>
<script type="module" src="zelo_pagegate.js"></script>
<script src="zelo_indexeddb.js"></script>
<script src="zelo_sync.js?v=4"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E141C;color:#E2E8F0;font:600 15px Inter,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  a{color:#93C5FD}
</style>
</head>
<body>
<div>
  <div style="font-size:1.1rem;font-weight:800;margin-bottom:8px">A abrir o Serviço de Estatística…</div>
  <div style="color:#94A3B8;font-weight:500">Esta página foi retirada. A Testagem de VIH regista-se no Laboratório e na Hemoterapia.</div>
  <div style="margin-top:16px"><a href="Estatistica.html">Abrir agora</a></div>
</div>
<script>
(async function(){
  var DESTINO='Estatistica.html', FB='registos_sistemas_locais/registo_hiv';
  function ir(){ location.replace(DESTINO); }
  var hist=[]; try{ hist=JSON.parse(localStorage.getItem('hiv_reg_v1_hist')||'[]')||[]; }catch(e){}
  if(!hist.length){ ir(); return; }
  setTimeout(ir, 12000); // nunca fica preso aqui
  for(var i=0;i<40&&!(window.__fbReady&&window.__fbGet&&window.zeloQueueWrite);i++) await new Promise(function(r){setTimeout(r,250);});
  if(!(window.__fbReady&&window.__fbGet&&window.zeloQueueWrite)){ ir(); return; }
  function hora(h){ return Math.max(Date.parse(h&&h.savedAt)||0, Date.parse(h&&h.deletedAt)||0); }
  try{
    var v=await window.__fbGet(FB)||{}, porKey={};
    Object.keys(v).forEach(function(k){ var r=v[k]; if(r&&r.key) porKey[r.key]=r; });
    for(var j=0;j<hist.length;j++){
      var h=hist[j]; if(!h||!h.key) continue;
      var r=porKey[h.key];
      if(!r||hora(h)>hora(r)){
        var rec=JSON.parse(JSON.stringify(h)); rec.deleted=!!h.deleted;
        await window.zeloQueueWrite(FB+'/'+String(h.key).replace(/[.#$\[\]\/]/g,'_'), rec).catch(function(){});
      }
    }
  }catch(e){}
  ir();
})();
</script>
</body>
</html>
