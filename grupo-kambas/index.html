<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3D4C">
<link rel="icon" href="static/logo_azul.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Grupo Kambas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa lateral azul-petróleo com o logótipo (como a capa do catálogo), área de trabalho clara; no telemóvel a faixa vira cabeçalho e a navegação desce para baixo. */
:root {
  --brand: #0192B8;        /* azul do logótipo GK */
  --brand-deep: #0B6A80;   /* barras do bloco de faturas */
  --band-1: #0A3D4C;       /* capa do catálogo */
  --band-2: #0F7F9C;
  --bg: #F3F8FA;
  --surface: #FFFFFF;
  --mist: #E6F3F7;
  --line: #CFE1E7;
  --ink: #0F2E3A;
  --ink-2: #4E6B76;
  --ink-3: #7E98A2;
  --ok: #1E8A5A;  --ok-bg: #E2F4EB;
  --warn: #A86400; --warn-bg: #FCEFD9;
  --bad: #B42318;  --bad-bg: #FBE5E2;
  --on-brand: #FFFFFF;
  --shadow: 0 1px 2px rgba(10, 61, 76, .06), 0 6px 20px rgba(10, 61, 76, .06);
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #2FB6DA; --brand-deep: #1C93B1;
    --bg: #0A1A20; --surface: #10252D; --mist: #143440; --line: #22414C;
    --ink: #E3F1F5; --ink-2: #A3BEC7; --ink-3: #7A98A2;
    --ok: #4CC58C; --ok-bg: #12352A; --warn: #F0B04A; --warn-bg: #3A2C12; --bad: #F2867A; --bad-bg: #3D1C19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #2FB6DA; --brand-deep: #1C93B1;
  --bg: #0A1A20; --surface: #10252D; --mist: #143440; --line: #22414C;
  --ink: #E3F1F5; --ink-2: #A3BEC7; --ink-3: #7A98A2;
  --ok: #4CC58C; --ok-bg: #12352A; --warn: #F0B04A; --warn-bg: #3A2C12; --bad: #F2867A; --bad-bg: #3D1C19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band-1); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- moldura */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; background: linear-gradient(165deg, var(--band-1), var(--band-2)); color: #fff; display: flex; flex-direction: column; padding: 26px 16px 20px; gap: 22px; overflow-y: auto; }
.rail .logo { width: 128px; margin: 0 auto 4px; display: block; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,.82); text-decoration: none; font-weight: 600; font-size: 15px; }
.rail a:hover { background: rgba(255,255,255,.08); color: #fff; }
.rail a[aria-current="page"] { background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 3px 0 0 #7FD8EF; }
.rail .slogan { margin-top: auto; font-family: var(--f-display); font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.6); text-align: center; line-height: 1.8; }
.main-wrap { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 18px 6px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.top .mlogo { display: none; }
.top h1 { font-size: 24px; font-weight: 800; font-stretch: 112%; letter-spacing: .01em; }
.top .sp { flex: 1; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.mode.srv::before { background: var(--ok); }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
main { padding-block: 12px 40px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.tabbar { display: none; }

/* ---------- componentes */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--brand); }
.btn.pri { background: var(--brand-deep); border-color: var(--brand-deep); color: var(--on-brand); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 32px; padding: 0 11px; font-size: 13.5px; }
.btn.big { height: 50px; font-size: 16.5px; width: 100%; font-family: var(--f-display); letter-spacing: .04em; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-h h2 { font-size: 16px; font-weight: 700; letter-spacing: .02em; }
.panel-h .sub { color: var(--ink-3); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--mist); color: var(--ink-2); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.brand { background: var(--mist); color: var(--brand-deep); }
:root[data-theme="dark"] .chip.brand { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.brand { color: var(--brand); } }
.chip.ex { background: transparent; border: 1px dashed var(--ink-3); color: var(--ink-3); font-weight: 500; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; display: block; min-width: 0; }
.toolbar .search { flex: 1 1 220px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search input { width: 100%; height: 40px; padding: 0 12px 0 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
select.f, input.f, textarea.f { height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); min-width: 0; width: 100%; }
textarea.f { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; }
.toolbar select.f { width: auto; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-deep); }
:root[data-theme="dark"] .field > span { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .field > span { color: var(--brand); } }
.field small { color: var(--ink-3); font-size: 12.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; font-weight: 600; color: var(--ink-2); font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--brand-deep); color: var(--on-brand); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 6px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--brand-deep); border-color: var(--brand-deep); color: var(--on-brand); }
.relnav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.relt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.relt h2 { font-size: 21px; font-weight: 800; font-stretch: 108%; }
.relt .sub { font-size: 13px; color: var(--ink-3); }
.relnav .sp { flex: 1; }
table.t tr.tot td { background: var(--mist); border-top: 2px solid var(--brand-deep); }
.empty { text-align: center; color: var(--ink-3); padding: 28px 12px; }

/* tabelas */
.tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--mist); }
table.t .r { text-align: right; }
table.t .muted { color: var(--ink-3); font-size: 13px; }
.cod { font-family: var(--f-display); font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; }
.strong { font-weight: 700; }
.nf { font-family: var(--f-display); font-weight: 700; font-stretch: 110%; color: var(--brand-deep); letter-spacing: .03em; }
:root[data-theme="dark"] .nf { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nf { color: var(--brand); } }
.anulada td { color: var(--ink-3); }
.anulada .val { text-decoration: line-through; }

/* ---------- painel */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .lab { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.kpi .val { font-family: var(--f-display); font-size: 25px; font-weight: 800; font-stretch: 105%; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .val small { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.kpi .ft { font-size: 13px; color: var(--ink-2); }
.kpi.hero { background: linear-gradient(150deg, var(--band-1), var(--band-2)); border-color: transparent; color: #fff; }
.kpi.hero .lab, .kpi.hero .ft, .kpi.hero .val small { color: rgba(255,255,255,.75); }
.dash { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .bar { fill: var(--brand); opacity: .55; }
.chart .bar.today { fill: var(--brand-deep); opacity: 1; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .vlab { fill: var(--ink); font-weight: 700; font-size: 11px; }
.hbars { display: flex; flex-direction: column; gap: 11px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 14px; }
.hbar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--mist); overflow: hidden; }
.hbar .fill { height: 100%; background: var(--brand); border-radius: 3px; }
.hbar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-list { display: flex; flex-direction: column; }
.alert-list .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.alert-list .row:last-child { border-bottom: 0; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--mist); margin: 8px 0 10px; }
.split div:first-child { background: var(--brand-deep); }
.split div:last-child { background: var(--brand); opacity: .45; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

/* ---------- vender */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; position: relative; transition: border-color .12s, transform .12s; }
.tile:hover:not(:disabled) { border-color: var(--brand); transform: translateY(-1px); }
.tile:disabled { opacity: .5; cursor: not-allowed; }
.tile .nm { font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.tile .ds { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; }
.tile .bt { margin-top: auto; display: flex; align-items: end; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tile .pr { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--brand-deep); }
.tile .pr small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
:root[data-theme="dark"] .tile .pr { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .pr { color: var(--brand); } }
.tile .badge { position: absolute; top: 8px; right: 8px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--brand-deep); color: var(--on-brand); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.cart { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; }
.cart-h { display: flex; align-items: center; justify-content: space-between; }
.cart-h h2 { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
.cart-close { display: none; }
.lines { display: flex; flex-direction: column; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line .nm { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.line .tot { font-weight: 700; text-align: right; }
.line .ctr { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qty button { width: 30px; height: 30px; border: 0; background: var(--mist); display: grid; place-items: center; color: var(--ink); }
.qty input { width: 46px; height: 30px; border: 0; text-align: center; background: var(--surface); }
.price-in { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-3); }
.price-in input { width: 92px; height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; text-align: right; background: var(--surface); }
.price-in input.need { border-color: var(--warn); background: var(--warn-bg); }
.line .hint { font-size: 12px; color: var(--ok); }
.totals { display: flex; flex-direction: column; gap: 6px; background: var(--mist); border-radius: 9px; padding: 12px 14px; }
.totals .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.totals .r.grand { color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 20px; padding-top: 6px; border-top: 1px solid var(--line); }
.totals input { width: 110px; height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; text-align: right; background: var(--surface); }
.pay { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pay button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.pay button[aria-pressed="true"] { border-color: var(--brand-deep); background: var(--brand-deep); color: var(--on-brand); }
.cartbar { display: none; }

/* ---------- folhas (modais) */
.sheet-bg { position: fixed; inset: 0; background: rgba(6, 28, 36, .55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet { background: var(--surface); border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; }
.sheet.wide { width: min(760px, 100%); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.sheet-h h2 { font-size: 18px; font-weight: 800; }
.sheet-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet-f { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.sheet-f .sp { flex: 1; }
.err { color: var(--bad); background: var(--bad-bg); padding: 9px 12px; border-radius: 8px; font-size: 14px; }
.note { color: var(--ink-2); background: var(--mist); padding: 9px 12px; border-radius: 8px; font-size: 13.5px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* ---------- fatura (papel: cores fixas, igual ao bloco impresso) */
.paper { container-type: inline-size; background: #fff; color: #0F2E3A; border-radius: 6px; box-shadow: 0 0 0 1px #d9e6eb, 0 8px 30px rgba(10,61,76,.12); font-family: var(--f-body); }
.pp { padding: 6cqi 6cqi 4.5cqi; font-size: clamp(9px, 2.45cqi, 14px); display: flex; flex-direction: column; gap: 3.2cqi; }
.pp .lb { font-family: var(--f-display); font-size: .78em; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #0192B8; }
.pp .hd { display: flex; justify-content: space-between; gap: 4cqi; }
.pp .hd img { width: 26cqi; display: block; }
.pp .act { font-family: var(--f-display); font-size: .66em; letter-spacing: .12em; text-transform: uppercase; color: #6B8792; margin-top: 1.6cqi; }
.pp .ct { font-size: .86em; line-height: 1.5; }
.pp .ttl { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1cqi; }
.pp .ttl .w { font-family: var(--f-display); font-weight: 800; font-size: 2.1em; letter-spacing: .2em; color: #0B6A80; border-bottom: 2px solid #0192B8; padding-bottom: .5cqi; margin-right: -.2em; }
.pp .ttl .n { font-family: var(--f-display); font-weight: 800; font-size: 1.25em; letter-spacing: .12em; }
.pp .ttl .an { color: #B42318; font-weight: 800; letter-spacing: .14em; font-size: .9em; }
.pp .dt { margin-top: 1.5cqi; text-align: left; min-width: 36cqi; }
.pp .dt div:last-child { border-bottom: 1px solid #BFD6DE; padding: .4cqi 0; }
.pp .cli { background: #EAF5F8; border-radius: 2cqi; border-left: 1.1cqi solid #0192B8; padding: 3cqi 4cqi; display: grid; grid-template-columns: 1fr 34%; gap: 2.4cqi 5cqi; }

}

const inteiro = v => { const n = parseInt(String(v).replace(/[^\d-]/g, ""), 10); return Number.isFinite(n) ? n : NaN; };
const byId = (lista, id) => lista.find(x => x.id === Number(id));
const produto = id => byId(E.produtos, id);
const precoPara = (p, q) => (p.tier_qtd && q >= p.tier_qtd ? p.tier_preco : p.preco);

/* ============================================================ motor local (mesmas regras do kambas/db.py) */
const Local = {
  novo() {
    E = { config: { empresa: SEED.empresa, formas_pagamento: SEED.formas, seccoes: SEED.seccoes, proximo_numero: 1 },
          produtos: [], clientes: [], faturas: [], movimentos: [], _seq: { p: 0, c: 0, f: 0, i: 0, m: 0 } };
    const d7 = this.dia(7, "08:00");
    SEED.produtos.forEach(s => {
      const p = { ...s, id: ++E._seq.p, stock: 0, ativo: 1 };
      E.produtos.push(p);
      if (p.tipo === "produto" && s.stock > 0) this.mover(p.id, "entrada", s.stock, "Stock inicial", "", d7);
    });
    const ids = SEED.clientes_exemplo.map(c => { const n = { ...c, id: ++E._seq.c, exemplo: 1, ativo: 1 }; E.clientes.push(n); return n.id; });
    const cod = Object.fromEntries(E.produtos.map(p => [p.codigo, p]));
    SEED.vendas_exemplo.forEach(([dias, ci, itens, forma, desconto], n) => {
      this.registarVenda({
        cliente_id: ci === null ? null : ids[ci], forma_pagamento: forma, desconto, observacoes: "",
        itens: itens.map(([c, q, pr]) => ({ produto_id: cod[c].id, descricao: cod[c].nome, qtd: q, preco_unit: pr ?? precoPara(cod[c], q) })),
      }, this.dia(dias, `${pad(10 + n % 7)}:${pad((n * 13) % 60)}`), true);
    });
  },
  dia(diasAtras, hora) { const d = new Date(); d.setDate(d.getDate() - diasAtras); return `${isoLocal(d).slice(0, 10)}T${hora}:00`; },
  mover(pid, tipo, qtd, motivo, ref = "", data = null) {
    const p = produto(pid);
    p.stock = tipo === "entrada" ? p.stock + qtd : tipo === "saida" ? p.stock - qtd : qtd;
    E.movimentos.push({ id: ++E._seq.m, data: data || isoLocal(), produto_id: pid, tipo, qtd, stock_final: p.stock, motivo, ref });
    return p.stock;
  },
  limparProduto(d) {
    const nome = (d.nome || "").trim(); if (!nome) falha("Indique o nome do produto ou serviço.");
    const tipo = d.tipo || "produto", modo = d.modo || "fixo";
    const preco = d.preco === "" || d.preco == null ? 0 : inteiro(d.preco);
    const stock_min = d.stock_min === "" || d.stock_min == null ? 0 : inteiro(d.stock_min);
    const tier_qtd = d.tier_qtd ? inteiro(d.tier_qtd) : null, tier_preco = d.tier_preco ? inteiro(d.tier_preco) : null;
    if ([preco, stock_min].some(Number.isNaN) || Number.isNaN(tier_qtd) || Number.isNaN(tier_preco)) falha("Preços e quantidades têm de ser números inteiros (Kz).");
    if (preco < 0 || stock_min < 0) falha("Valores não podem ser negativos.");
    if (modo !== "consulta" && preco === 0) falha("Indique o preço em Kz (ou escolha 'por consulta').");
    if ((tier_qtd === null) !== (tier_preco === null)) falha("Para preço por quantidade, indique a quantidade mínima e o preço.");
    return { nome, descricao: (d.descricao || "").trim(), seccao: (d.seccao || "Outros").trim(), tipo, modo, preco, tier_qtd, tier_preco, stock_min: tipo === "produto" ? stock_min : 0 };
  },
  criarProduto(d) {
    const p = this.limparProduto(d);
    const ini = p.tipo === "produto" ? (inteiro(d.stock) || 0) : 0;
    if (ini < 0) falha("O stock inicial não pode ser negativo.");
    const sec = (SEED.seccoes_cod.find(([, n]) => n === p.seccao) || ["GK"])[0];
    let n = 1; while (E.produtos.some(x => x.codigo === sec + pad(n))) n++;
    const novo = { ...p, id: ++E._seq.p, codigo: sec + pad(n), stock: 0, ativo: 1 };
    E.produtos.push(novo);
    if (ini) this.mover(novo.id, "entrada", ini, "Stock inicial");
    return novo;
  },
  atualizarProduto(id, d) {
    const a = produto(id) || falha("Produto não encontrado.");
    const p = this.limparProduto(d);
    if (a.tipo === "produto" && p.tipo === "servico" && a.stock > 0) falha("Este produto ainda tem stock. Faça um ajuste para 0 antes de o mudar para serviço.");
    Object.assign(a, p); return a;
  },
  removerProduto(id) { const p = produto(id); E.produtos = E.produtos.filter(x => x !== p); E._removidos = (E._removidos || []).concat([p]); },
  movimentoStock(d) {
    const p = produto(d.produto_id) || falha("Escolha o produto.");
    if (p.tipo !== "produto") falha("Serviços não têm stock.");

    if (Number.isNaN(qtd)) falha("Indique uma quantidade válida.");
    if (qtd < 0 || (qtd === 0 && d.tipo !== "ajuste")) falha("A quantidade tem de ser maior que zero.");
    if (d.tipo === "saida" && qtd > p.stock) falha(`Só há ${p.stock} em stock de ${p.nome}.`);
    const motivo = (d.motivo || "").trim() || { entrada: "Compra / reposição", saida: "Saída manual", ajuste: "Contagem de stock" }[d.tipo];
    this.mover(p.id, d.tipo, qtd, motivo); return p;

    const dados = { nome, nif: (d.nif || "").trim(), endereco: (d.endereco || "").trim(), telefone: (d.telefone || "").trim() };
    if (id) return Object.assign(byId(E.clientes, id), dados);

  removerCliente(id) { E.clientes = E.clientes.filter(c => c.id !== Number(id)); },
  registarVenda(d, data = null, exemplo = false) {

      if (!(qtd > 0)) falha(`Quantidade inválida em '${descricao}'.`);

    const numero = Math.max(E.config.proximo_numero, Math.max(0, ...E.faturas.map(f => f.numero)) + 1);

      cliente_endereco: cli.endereco, cliente_telefone: cli.telefone, forma_pagamento: d.forma_pagamento, subtotal, desconto, total: subtotal - desconto,
      observacoes: (d.observacoes || "").trim(), estado: "emitida", exemplo: exemplo ? 1 : 0,
      itens: linhas.map(l => ({ ...l, id: ++E._seq.i })) };
    E.faturas.push(f);
    linhas.forEach(l => { if (precisa[l.produto_id]) this.mover(l.produto_id, "saida", l.qtd, "Venda", "Fatura " + nf(numero), data); });
    E.config.proximo_numero = numero + 1;
    return f;
  },
  anularFatura(id, motivo = "") {
    const f = byId(E.faturas, id) || falha("Fatura não encontrada.");
    if (f.estado === "anulada") falha("Esta fatura já está anulada.");
    f.itens.forEach(it => { const p = produto(it.produto_id); if (p && p.tipo === "produto") this.mover(p.id, "entrada", it.qtd, "Fatura anulada", "Fatura " + nf(f.numero)); });
    f.estado = "anulada";
    f.observacoes = `${f.observacoes}\n${motivo.trim() ? "ANULADA: " + motivo.trim() : "ANULADA"}`.trim();
    return f;
  },
  guardarConfig(d) {
    if (d.empresa) E.config.empresa = { ...E.config.empresa, ...d.empresa };
    if (d.proximo_numero !== undefined) {
      const n = inteiro(d.proximo_numero), maior = Math.max(0, ...E.faturas.map(f => f.numero));
      if (!(n > maior)) falha(`O próximo número tem de ser maior que ${nf(maior)} (última fatura emitida).`);
      E.config.proximo_numero = n;
    }
    return E.config;
  },
  apagarExemplos() {
    const refs = new Set(E.faturas.filter(f => f.exemplo).map(f => "Fatura " + nf(f.numero)));
    E.faturas = E.faturas.filter(f => !f.exemplo);
    E.movimentos = E.movimentos.filter(m => !refs.has(m.ref));
    const exIds = new Set(E.clientes.filter(c => c.exemplo).map(c => c.id));
    E.faturas.forEach(f => { if (exIds.has(f.cliente_id)) f.cliente_id = null; });
    E.clientes = E.clientes.filter(c => !c.exemplo);
    E.produtos.filter(p => p.tipo === "produto").forEach(p => {
      let s = 0;
      E.movimentos.filter(m => m.produto_id === p.id).sort((a, b) => a.data.localeCompare(b.data) || a.id - b.id)
        .forEach(m => { s = m.tipo === "ajuste" ? m.qtd : s + (m.tipo === "entrada" ? m.qtd : -m.qtd); m.stock_final = s; });
      p.stock = s;
    });
    E.config.proximo_numero = Math.max(0, ...E.faturas.map(f => f.numero)) + 1;
  },
};

/* ============================================================ acesso aos dados (servidor Python ou motor local) */
async function pedir(metodo, caminho, corpo) {
  const r = await fetch(API + caminho, { method: metodo, headers: { "Content-Type": "application/json" }, body: corpo ? JSON.stringify(corpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new ErroNegocio(j.erro || "Não foi possível guardar. Verifique se o servidor está a correr.");
  return j;
}
async function recarregar() { E = await pedir("GET", "/estado"); }
const ROTAS = {
  criarProduto: d => ["POST", "/produtos", d],
  atualizarProduto: (id, d) => ["PUT", "/produtos/" + id, d],
  removerProduto: id => ["DELETE", "/produtos/" + id],
  movimentoStock: d => ["POST", "/stock", d],
  guardarCliente: (d, id) => id ? ["PUT", "/clientes/" + id, d] : ["POST", "/clientes", d],
  removerCliente: id => ["DELETE", "/clientes/" + id],
  registarVenda: d => ["POST", "/vendas", d],
  anularFatura: (id, motivo) => ["POST", `/faturas/${id}/anular`, { motivo }],
  guardarConfig: d => ["PUT", "/config", d],
  apagarExemplos: () => ["POST", "/exemplos/apagar"],
};
async function acao(nome, ...args) {
  if (API) { const res = await pedir(...ROTAS[nome](...args)); await recarregar(); return res; }
  const copia = JSON.stringify(E);
  try { const res = Local[nome](...args); guardarLocal(); return JSON.parse(JSON.stringify(res ?? null)); }
  catch (e) { E = JSON.parse(copia); throw e; }
}

function larguraGrafico(max) { const m = document.getElementById("main"); return Math.round(Math.max(340, Math.min(max, (m ? m.clientWidth : max) - 40))); }
function grafico(dias, valores) {
  const W = larguraGrafico(640), H = 230, L = 46, B = 26, T = 18, R = 8;
  const max = Math.max(...valores, 1);
  const passo = [1000, 2000, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000].find(s => s * 4 >= max) || Math.ceil(max / 4);
  const topo = passo * 4, bw = (W - L - R) / dias.length;
  const y = v => T + (H - T - B) * (1 - v / topo);
  const k = v => v >= 1000 ? fmt(v / 1000) + "k" : fmt(v);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vendas por dia nos últimos 14 dias">`;
  for (let i = 0; i <= 4; i++) { const v = passo * i; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${k(v)}</text>`; }
  const hj = hoje();
  dias.forEach((d, i) => {
    const v = valores[i], x = L + i * bw + bw * .18, w = bw * .64;
    if (v > 0) s += `<rect class="bar ${d === hj ? "today" : ""}" x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="3"/>`;
    if (d === hj && v > 0) s += `<text class="vlab" x="${x + w / 2}" y="${y(v) - 6}" text-anchor="middle">${k(v)}</text>`;
    if (i % 2 === 1 || d === hj) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d === hj ? "Hoje" : d.slice(8, 10) + "/" + d.slice(5, 7)}</text>`;
  });
  return s + "</svg>";
}

function mudarQtd(i, d) {
  const it = venda.itens[i], p = produto(it.produto_id);

  it.qtd = q;
  if (p && !it.manual && p.modo === "fixo") it.preco_unit = precoPara(p, q);
  carrinho(); tiles();
}
function adicionar(id) {
  const p = produto(id); if (!p) return;
  const i = venda.itens.findIndex(x => x.produto_id === p.id);
  if (i >= 0) return mudarQtd(i, 1);
  if (p.tipo === "produto" && p.stock <= 0) return toast("Produto esgotado");
  venda.itens.push({ produto_id: p.id, descricao: p.nome, qtd: 1, preco_unit: p.modo === "consulta" ? 0 : precoPara(p, 1), manual: false });
  carrinho(); tiles();
  toast(`${p.nome} adicionado`);
}

    Object.assign(venda, { itens: [], cliente_id: "", forma: "", desconto: 0, obs: "" });

  } catch (e) { $("#v-err").innerHTML = `<div class="err">${esc(e.message)}</div>`; if (!(e instanceof ErroNegocio)) console.error(e); }
}

/* ============================================================ relatórios (mesma lógica de kambas/relatorios.py) */
const TIPOS_REL = [["diario", "Diário"], ["semanal", "Semanal"], ["mensal", "Mensal"], ["trimestral", "Trimestral"], ["semestral", "Semestral"], ["anual", "Anual"]];
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const dISO = d => isoLocal(d).slice(0, 10);
const dDe = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
const somaDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const somaMeses = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const dm = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
function periodoRel(tipo, ref) {
  let ini, fim, titulo;
  if (tipo === "diario") { ini = ref; fim = somaDias(ref, 1); titulo = `${dm(ref)}/${ref.getFullYear()}`; }
  else if (tipo === "semanal") { ini = somaDias(ref, -((ref.getDay() + 6) % 7)); fim = somaDias(ini, 7); const u = somaDias(fim, -1); titulo = `${dm(ini)} a ${dm(u)}/${u.getFullYear()}`; }
  else if (tipo === "mensal") { ini = new Date(ref.getFullYear(), ref.getMonth(), 1); fim = somaMeses(ini, 1); titulo = `${MESES[ini.getMonth()][0].toUpperCase() + MESES[ini.getMonth()].slice(1)} de ${ini.getFullYear()}`; }
  else if (tipo === "trimestral") { const q = Math.floor(ref.getMonth() / 3); ini = new Date(ref.getFullYear(), 3 * q, 1); fim = somaMeses(ini, 3); titulo = `${q + 1}.º trimestre de ${ini.getFullYear()}`; }
  else if (tipo === "semestral") { const s = Math.floor(ref.getMonth() / 6); ini = new Date(ref.getFullYear(), 6 * s, 1); fim = somaMeses(ini, 6); titulo = `${s + 1}.º semestre de ${ini.getFullYear()}`; }
  else { ini = new Date(ref.getFullYear(), 0, 1); fim = new Date(ref.getFullYear() + 1, 0, 1); titulo = String(ref.getFullYear()); }
  return { ini, fim, titulo };
}
function baldesRel(tipo, ini, fim) {
  const out = [];
  if (tipo === "diario") { for (let h = 7; h < 22; h++) out.push([pad(h) + "h", `${dISO(ini)}T${pad(h)}`, `${dISO(ini)}T${pad(h + 1)}`]); return out; }
  if (tipo === "semanal" || tipo === "mensal") { for (let d = ini; d < fim; d = somaDias(d, 1)) out.push([dm(d), dISO(d), dISO(somaDias(d, 1))]); return out; }
  for (let d = ini; d < fim; d = somaMeses(d, 1)) out.push([MESES[d.getMonth()].slice(0, 3), dISO(d), dISO(somaMeses(d, 1))]);
  return out;
}
function calcularRelatorio(tipo, ref) {
  const { ini, fim, titulo } = periodoRel(tipo, ref), ant = periodoRel(tipo, somaDias(ini, -1));
  const si = dISO(ini), sf = dISO(fim);
  const prods = {}; [...(E._removidos || []), ...E.produtos].forEach(p => prods[p.id] = p);
  const dentro = (f, a, b) => f.data >= a && f.data < b;
  const todas = E.faturas.filter(f => dentro(f, si, sf)), emit = todas.filter(f => f.estado === "emitida"), anul = todas.filter(f => f.estado === "anulada");
  const soma = (l, k = "total") => l.reduce((s, x) => s + x[k], 0);
  const anterior = soma(E.faturas.filter(f => f.estado === "emitida" && dentro(f, dISO(ant.ini), dISO(ant.fim))));
  const faturacao = soma(emit);
  const itens = {}, secs = {}, pags = {}, clis = {}; let vp = 0, vs = 0, qt = 0;
  emit.forEach(f => {
    const pg = pags[f.forma_pagamento] ||= { forma: f.forma_pagamento, n: 0, valor: 0 }; pg.n++; pg.valor += f.total;
    const cl = clis[f.cliente_nome] ||= { nome: f.cliente_nome, n: 0, valor: 0 }; cl.n++; cl.valor += f.total;
    f.itens.forEach(it => {
      const p = prods[it.produto_id], k = p ? p.codigo : it.descricao;
      const l = itens[k] ||= { codigo: p ? p.codigo : "", descricao: p ? p.nome : it.descricao, tipo: p ? p.tipo : "servico", qtd: 0, valor: 0 };
      l.qtd += it.qtd; l.valor += it.total;
      const sn = p ? p.seccao : "Outros", s = secs[sn] ||= { seccao: sn, qtd: 0, valor: 0 }; s.qtd += it.qtd; s.valor += it.total;
      qt += it.qtd; if (p && p.tipo === "produto") vp += it.total; else vs += it.total;
    });
  });
  const evolucao = baldesRel(tipo, ini, fim).map(([rotulo, a, b]) => { const fs = emit.filter(f => f.data >= a && f.data < b); return { rotulo, valor: soma(fs), n: fs.length }; });
  const movs = [...E.movimentos].sort((a, b) => a.data.localeCompare(b.data) || a.id - b.id);
  const stock = [];
  E.produtos.filter(p => p.tipo === "produto").forEach(p => {
    let inicial = 0, final = 0, entradas = 0, saidas = 0, teve = false;
    movs.forEach(m => {
      if (m.produto_id !== p.id) return;
      if (m.data < si) { inicial = final = m.stock_final; }
      else if (m.data < sf) { teve = true; final = m.stock_final; if (m.tipo === "entrada") entradas += m.qtd; else if (m.tipo === "saida") saidas += m.qtd; }
    });
    if (!teve && inicial === 0) return;
    stock.push({ codigo: p.codigo, nome: p.nome, inicial, entradas, saidas, ajustes: final - inicial - entradas + saidas, final, stock_min: p.stock_min, preco: p.preco, valor_final: final * p.preco });
  });
  stock.sort((a, b) => b.saidas - a.saidas || a.codigo.localeCompare(b.codigo));
  const ord = o => Object.values(o).sort((a, b) => b.valor - a.valor);
  return {
    tipo, nome: TIPOS_REL.find(t => t[0] === tipo)[1], titulo, inicio: si, fim: dISO(somaDias(fim, -1)), anterior_titulo: ant.titulo,
    resumo: { faturacao, n_faturas: emit.length, media: emit.length ? Math.round(faturacao / emit.length) : 0, subtotal: soma(emit, "subtotal"), descontos: soma(emit, "desconto"),
      anuladas_n: anul.length, anuladas_valor: soma(anul), itens_qtd: qt, produtos_valor: vp, servicos_valor: vs, anterior,
      variacao: anterior ? Math.round((faturacao - anterior) / anterior * 1000) / 10 : null },
    evolucao, pagamentos: ord(pags), seccoes: ord(secs), itens: Object.values(itens).sort((a, b) => b.valor - a.valor || a.descricao.localeCompare(b.descricao)),
    clientes: ord(clis).slice(0, 10), stock,
    stock_resumo: { valor: soma(stock, "valor_final"), unidades: soma(stock, "final"), entradas: soma(stock, "entradas"), saidas: soma(stock, "saidas"), alertas: stock.filter(s => s.final <= s.stock_min).length },
    faturas: [...todas].sort((a, b) => a.numero - b.numero),

}
function barras(rotulos, valores, aria) {
  const W = larguraGrafico(680), H = 230, L = 46, B = 26, T = 18, R = 8, n = rotulos.length;
  const max = Math.max(...valores, 1);
  const passo = [1000, 2000, 5000, 10000, 20000, 25000, 50000, 100000, 200000, 250000, 500000, 1000000, 2000000, 2500000, 5000000, 10000000].find(s => s * 4 >= max) || Math.ceil(max / 4);
  const topo = passo * 4, bw = (W - L - R) / n, y = v => T + (H - T - B) * (1 - v / topo);
  const k = v => v >= 1000000 ? fmt(v / 100000) / 10 + "M" : v >= 1000 ? fmt(v / 1000) + "k" : fmt(v);
  const cada = n > 16 ? Math.ceil(n / 10) : 1, maxI = valores.indexOf(Math.max(...valores));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`;
  for (let i = 0; i <= 4; i++) { const v = passo * i; s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${k(v)}</text>`; }
  rotulos.forEach((r, i) => {
    const v = valores[i], x = L + i * bw + bw * .16, w = bw * .68;
    if (v > 0) s += `<rect class="bar ${i === maxI ? "today" : ""}" x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="${Math.min(3, w / 3)}"><title>${esc(r)}: ${kz(v)}</title></rect>`;
    if (i === maxI && v > 0) s += `<text class="vlab" x="${x + w / 2}" y="${y(v) - 6}" text-anchor="middle">${k(v)}</text>`;
    if (i % cada === 0) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(r)}</text>`;
  });
  return s + "</svg>";
}

  $("#main").innerHTML = `
    <div class="dash">
      <form class="panel" id="frm-emp" style="display:flex;flex-direction:column;gap:14px"><div class="panel-h" style="margin:0"><h2>Dados da empresa na fatura</h2></div>
        <div class="grid2"><label class="field"><span>Nome</span><input class="f" id="e-nome" value="${esc(emp.nome)}"></label><label class="field"><span>NIF da empresa</span><input class="f" id="e-nif" value="${esc(emp.nif)}" placeholder="Por preencher"></label></div>
        <label class="field"><span>Actividade</span><input class="f" id="e-act" value="${esc(emp.actividade)}"></label>
        <div class="grid2"><label class="field"><span>Telefones</span><input class="f" id="e-tel" value="${esc(emp.telefones)}"></label><label class="field"><span>E-mail</span><input class="f" id="e-mail" value="${esc(emp.email)}"></label></div>
        <label class="field"><span>Slogan (rodapé)</span><input class="f" id="e-slo" value="${esc(emp.slogan)}"></label>
        <div id="emp-err"></div><div><button class="btn pri">Guardar dados</button></div></form>
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
        <form class="panel" id="frm-num" style="display:flex;flex-direction:column;gap:12px"><div class="panel-h" style="margin:0"><h2>Numeração das faturas</h2></div>
          <label class="field"><span>Próximo número</span><input class="f num" id="n-prox" inputmode="numeric" value="${E.config.proximo_numero}"><small>Use para continuar a sequência do bloco em papel (ex.: se o bloco vai na 0057, ponha 58).</small></label>
          <div id="num-err"></div><div><button class="btn pri">Guardar</button></div></form>
        <div class="panel"><div class="panel-h"><h2>Formas de pagamento</h2></div>
          <div class="alert-list">${emp.contas.map(c => `<div class="row"><span>${esc(c.banco)}</span><span class="num cod" style="font-size:13px">${esc(c.iban)}</span></div>`).join("")}</div>
          <p class="note" style="margin:12px 0 0">Titular: ${esc(emp.titular)}</p></div>
        <div class="panel"><div class="panel-h"><h2>Dados</h2></div>
          <p style="margin:0 0 12px;color:var(--ink-2)">${API ? "Ligado ao servidor Python: tudo fica guardado na base de dados <b>kambas.db</b>." : "Modo de demonstração: os dados ficam guardados só neste navegador. No computador da loja, corra <b>python app.py</b> para guardar numa base de dados."}</p>
          <div class="toolbar">${temEx ? `<button class="btn" data-act="apagar-exemplos">Apagar vendas de exemplo</button>` : ""}${API ? "" : `<button class="btn danger" data-act="repor">Recomeçar do zero</button>`}</div></div>
      </div>
    </div>`;
  $("#frm-emp").onsubmit = async e => { e.preventDefault(); try { await acao("guardarConfig", { empresa: { nome: $("#e-nome").value, nif: $("#e-nif").value, actividade: $("#e-act").value, telefones: $("#e-tel").value, email: $("#e-mail").value, slogan: $("#e-slo").value } }); toast("Dados da empresa guardados"); } catch (er) { $("#emp-err").innerHTML = `<div class="err">${esc(er.message)}</div>`; } };
  $("#frm-num").onsubmit = async e => { e.preventDefault(); try { await acao("guardarConfig", { proximo_numero: inteiro($("#n-prox").value) }); toast(`Próxima fatura: Nº ${nf(E.config.proximo_numero)}`); render(); } catch (er) { $("#num-err").innerHTML = `<div class="err">${esc(er.message)}</div>`; } };
}

/* ============================================================ folhas, confirmações, avisos */
function abrir(html, aoSubmeter) {
  $("#layer").innerHTML = `<div class="sheet-bg" data-act="fundo">${html}</div>`;
  const frm = $("#frm");
  if (frm && aoSubmeter) frm.onsubmit = async e => {
    e.preventDefault(); const b = frm.querySelector("button.pri"); if (b) b.disabled = true;
    try { await aoSubmeter(); } catch (er) { const el = $("#frm-err"); if (el) el.innerHTML = `<div class="err">${esc(er.message)}</div>`; if (!(er instanceof ErroNegocio)) console.error(er); }
    finally { if (b && b.isConnected) b.disabled = false; }
  };
}
function fechar() { $("#layer").innerHTML = ""; }
function confirmar(titulo, texto, botao, fn) {
  abrir(`<form class="sheet" id="frm"><div class="sheet-h"><h2>${esc(titulo)}</h2></div><div class="sheet-b"><p style="margin:0">${texto}</p><div id="frm-err"></div></div>
    <div class="sheet-f"><button type="button" class="btn" data-act="fechar">Cancelar</button><button class="btn pri">${esc(botao)}</button></div></form>`, fn);
}
let tToast;
function toast(m) { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(tToast); tToast = setTimeout(() => t.hidden = true, 2600); }

const ACOES = {
  "fundo": (el, e) => { if (e.target === el) fechar(); },
  "fechar": () => fechar(),
  "ver-fatura": el => verFatura(el.dataset.id),
  "anular": el => anular(el.dataset.id),
  "imprimir": () => window.print(),
  "sec": el => { venda.sec = el.dataset.v; document.querySelectorAll("#psec button").forEach(b => b.setAttribute("aria-pressed", b === el)); tiles(); },
  "add": el => adicionar(el.dataset.id),
  "qtd": el => mudarQtd(Number(el.dataset.i), Number(el.dataset.d)),
  "rm": el => { venda.itens.splice(Number(el.dataset.i), 1); carrinho(); tiles(); },
  "forma": el => { venda.forma = el.dataset.v; document.querySelectorAll(".pay button").forEach(b => b.setAttribute("aria-pressed", b === el)); },
  "limpar-venda": () => { venda.itens = []; venda.desconto = 0; carrinho(); tiles(); },
  "emitir": () => emitir(),
  "abrir-carrinho": () => { $("#cart").classList.add("open"); $("#cartbar").hidden = true; },
  "fechar-carrinho": () => { $("#cart").classList.remove("open"); carrinho(); },
  "novo-cliente-venda": () => formCliente(null, c => { venda.cliente_id = String(c.id); fechar(); carrinho(); }),
  "tipo-p": el => { filtroP.tipo = el.dataset.v; document.querySelectorAll("#xt button").forEach(b => b.setAttribute("aria-pressed", b === el)); vProdutos.upd(); },
  "novo-produto": () => formProduto(null),
  "editar-produto": el => formProduto(Number(el.dataset.id)),
  "remover-produto": el => { const p = produto(el.dataset.id); confirmar(`Remover ${p.nome}?`, "Deixa de aparecer no catálogo e nas vendas. As faturas antigas continuam intactas.", "Remover", async () => { await acao("removerProduto", p.id); fechar(); render(); toast(`${p.nome} removido`); }); },
  "mov": el => formMov(el.dataset.t, el.dataset.id),
  "rel-tipo": el => { rel.tipo = el.dataset.v; vRelatorios(); },
  "rel-aba": el => { rel.aba = el.dataset.v; vRelatorios(); },
  "rel-mover": el => moverRel(Number(el.dataset.d)),
  "rel-hoje": () => { rel.ref = hoje(); vRelatorios(); },
  "novo-cliente": () => formCliente(null),
  "editar-cliente": el => formCliente(Number(el.dataset.id)),
  "remover-cliente": el => { const c = byId(E.clientes, el.dataset.id); confirmar(`Remover ${c.nome}?`, "As faturas já emitidas mantêm os dados do cliente.", "Remover", async () => { await acao("removerCliente", c.id); fechar(); render(); toast("Cliente removido"); }); },
  "apagar-exemplos": () => confirmar("Apagar vendas de exemplo?", "Remove as faturas e os clientes de exemplo e repõe o stock que tinham consumido. O catálogo fica igual.", "Apagar exemplos", async () => { await acao("apagarExemplos"); fechar(); render(); toast("Exemplos apagados"); }),
  "repor": () => confirmar("Recomeçar do zero?", "Apaga tudo o que foi registado neste navegador e volta ao catálogo inicial com os exemplos.", "Recomeçar", async () => { try { localStorage.removeItem(CHAVE); } catch (e) {} Local.novo(); guardarLocal(); fechar(); render(); toast("Sistema reposto"); }),
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACOES[el.dataset.act]; if (!fn) return;
  if (el.tagName === "A") e.preventDefault();
  fn(el, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layer").innerHTML) fechar(); });
window.addEventListener("hashchange", () => { fechar(); navegar(); });

/* ============================================================ arranque */
(async function iniciar() {
  const modo = $("#mode");
  if (API) {
    modo.textContent = "Servidor Python · SQLite"; modo.classList.add("srv");
    try { await recarregar(); }
    catch (e) { $("#main").innerHTML = `<div class="err">Não foi possível ligar ao servidor (${esc(e.message)}). Confirme que o <b>python app.py</b> está a correr.</div>`; return; }
  } else {
    modo.textContent = "Demonstração · guardado neste navegador";
    try { const s = localStorage.getItem(CHAVE); if (s) E = JSON.parse(s); } catch (e) { E = null; }
    if (!E || !E._seq) { Local.novo(); guardarLocal(); }
  }
  navegar();
})();
</script>

</body>
