<style id="zelo-sem-setas">/* ZELO: nenhuma caixa de preenchimento com setas (em todo o sistema) */
input[type=number]{-moz-appearance:textfield !important;appearance:textfield !important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none !important;appearance:none !important;margin:0 !important;display:none !important}</style>
<script id="zelo-sem-setas-js">/* A roda do rato e as setas do teclado não mudam números sem querer
   (as páginas que usam as setas para andar entre células continuam a funcionar). */
(function(){if(window.__zeloSemSetas)return;window.__zeloSemSetas=1;
function num(e){return e&&e.tagName==='INPUT'&&e.type==='number';}
document.addEventListener('wheel',function(e){var t=e.target;if(num(t)&&document.activeElement===t)t.blur();},{passive:true});
document.addEventListener('keydown',function(e){if(num(e.target)&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&!e.defaultPrevented)e.preventDefault();});})();</script>

<style>
:root{
  --navy-950:#050b18;
  --navy-900:#0a1730;
  --navy-800:#0f2044;
  --navy-700:#152a58;
  --navy-600:#1c3a72;
  --cyan-400:#3fd6ea;
  --cyan-300:#7fe6f3;
  --cyan-glow:rgba(63,214,234,.35);
  --amber:#f2b263;
  --rose:#e8637a;
  --paper:#eef4fb;
  --paper-dim:#aebedb;
  --line:#22345c;
  --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --serif:'Source Serif 4','Georgia',serif;
  --sans:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at top,#0c1a38 0%,var(--navy-950) 55%);
  color:var(--paper);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
@font-face{font-family:'IBM Plex Mono';src:local('Consolas');}
::selection{background:var(--cyan-glow);color:#fff;}

/* ---------- topbar ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--navy-900) 0%, rgba(10,23,48,.94) 100%);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);
}
.top-inner{
  max-width:1180px;margin:0 auto;padding:14px 20px 0;
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:44px;height:44px;border-radius:10px;
  overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 6px 18px -6px var(--cyan-glow);
  background:#0d5aa7;
}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-text .eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan-300);opacity:.85;
}
.brand-text h1{
  font-family:var(--serif);font-weight:600;font-size:20px;margin:1px 0 0;color:#fff;letter-spacing:.2px;
}
.gepe-tag{
  font-family:var(--mono);font-size:10.5px;color:var(--paper-dim);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;
}

/* year rail */
.year-rail{max-width:1180px;margin:14px auto 0;padding:0 20px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.year-rail::-webkit-scrollbar{display:none;}
.year-btn{
  flex:0 0 auto;
  font-family:var(--mono);font-size:14px;font-weight:600;
  background:transparent;border:none;color:var(--paper-dim);
  padding:10px 16px 12px;cursor:pointer;position:relative;letter-spacing:.02em;
  transition:color .15s;
}
.year-btn .n{display:block;}
.year-btn .dot{
  display:block;width:5px;height:5px;border-radius:50%;margin:5px auto 0;background:transparent;transition:.15s;
}
.year-btn:hover{color:var(--paper);}
.year-btn.active{color:#fff;}
.year-btn.active .dot{background:var(--cyan-400);box-shadow:0 0 8px 1px var(--cyan-glow);}
.year-btn.active::after{
  content:'';position:absolute;left:10%;right:10%;bottom:0;height:2px;background:var(--cyan-400);
}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 90px;}
.hero{
  display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px;
}
@media(max-width:820px){.hero{grid-template-columns:1fr;}}
.hero-card{
  background:linear-gradient(155deg,var(--navy-800),var(--navy-900));
  border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative;overflow:hidden;
}
.hero-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 90% -10%, var(--cyan-glow), transparent 55%);
  opacity:.5;pointer-events:none;
}
.hero-title{font-family:var(--serif);font-size:26px;margin:0 0 6px;color:#fff;}
.hero-sub{color:var(--paper-dim);font-size:13.5px;line-height:1.55;margin:0;max-width:52ch;}
.hero-stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
.stat b{display:block;font-family:var(--mono);font-size:22px;color:var(--cyan-300);}
.stat span{display:block;font-size:11px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

.toolbar{
  background:var(--navy-800);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  display:flex;flex-direction:column;gap:12px;justify-content:center;
}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--navy-950);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;
}
.search-box input{
  background:transparent;border:none;outline:none;color:#fff;font-size:14px;width:100%;font-family:var(--sans);
}
.search-box input::placeholder{color:#5b6f96;}
.view-toggle{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--paper-dim);cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--cyan-400);border-color:var(--cyan-400);color:var(--navy-950);font-weight:700;}

/* section nav */
.section-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;}
.section-nav a{
  font-size:12px;color:var(--paper-dim);text-decoration:none;border:1px solid var(--line);
  padding:6px 12px;border-radius:8px;transition:.15s;
}
.section-nav a:hover{color:#fff;border-color:var(--cyan-400);}

/* section heading */
.section-heading{
  display:flex;align-items:baseline;gap:10px;margin:34px 0 14px;
}
.section-heading .idx{font-family:var(--mono);color:var(--cyan-400);font-size:13px;}
.section-heading h2{font-family:var(--serif);font-size:19px;margin:0;color:#fff;font-weight:600;}
.section-heading::after{content:'';flex:1;height:1px;background:var(--line);}

/* card */
.card{
  background:var(--navy-800);border:1px solid var(--line);border-radius:14px;
  margin-bottom:16px;overflow:hidden;scroll-margin-top:180px;
}
.card-head{
  padding:15px 18px;display:flex;justify-content:space-between;gap:14px;cursor:pointer;align-items:flex-start;
}
.card-head:hover{background:rgba(255,255,255,.02);}
.card-title{font-family:var(--serif);font-size:15.5px;color:#fff;line-height:1.4;margin:0;}
.card-tag{
  font-family:var(--mono);font-size:10px;color:var(--navy-950);background:var(--cyan-400);
  padding:3px 8px;border-radius:5px;flex:0 0 auto;font-weight:700;letter-spacing:.03em;
}
.card-tag.chart-only{background:var(--amber);}
.chev{color:var(--paper-dim);font-size:13px;flex:0 0 auto;transition:transform .18s;margin-top:2px;}
.card.open .chev{transform:rotate(90deg);}
.card-body{display:none;padding:0 18px 20px;}
.card.open .card-body{display:block;}

.comment{
  background:var(--navy-950);border-left:3px solid var(--cyan-400);border-radius:0 8px 8px 0;
  padding:11px 14px;font-size:13.5px;line-height:1.6;color:#dbe6f7;margin:12px 0 6px;
}
.comment + .comment{margin-top:8px;}
.fonte{font-family:var(--mono);font-size:11px;color:var(--paper-dim);margin-top:8px;}

.chart-wrap{background:var(--navy-950);border:1px solid var(--line);border-radius:10px;padding:14px 10px 6px;margin:14px 0;}
.chart-wrap canvas{max-height:340px;}
.chart-note{font-size:11px;color:var(--paper-dim);text-align:center;margin-top:6px;font-family:var(--mono);}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:420px;}
table.data th{
  background:var(--navy-700);color:var(--cyan-300);text-align:left;padding:9px 12px;
  font-family:var(--mono);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
  white-space:nowrap;position:sticky;top:0;
}
table.data td{padding:8px 12px;border-top:1px solid var(--line);color:var(--paper);white-space:nowrap;}
table.data tr:nth-child(even) td{background:rgba(255,255,255,.015);}
table.data tr.total-row td{background:var(--navy-700);font-weight:700;color:#fff;}
table.data td.num, table.data th.num{text-align:right;font-family:var(--mono);}

/* indicators */
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin:14px 0 4px;}
.kpi-box{
  background:var(--navy-950);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;position:relative;overflow:hidden;
}
.kpi-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan-400);}
.kpi-box.accent-amber::before{background:var(--amber);}
.kpi-box.accent-rose::before{background:var(--rose);}
.kpi-box .kpi-label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper-dim);margin-bottom:4px;}
.kpi-box .kpi-value{font-family:var(--mono);font-size:16px;font-weight:700;color:#fff;line-height:1.25;}
.kpi-box .kpi-value small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--cyan-300);margin-top:2px;white-space:normal;}
.dash-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan-400);margin:12px 0 0;}

.pdf-year-btn{
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--navy-950);
  background:var(--cyan-400);border:none;border-radius:9px;padding:10px 14px;cursor:pointer;
  align-self:stretch;
}
.pdf-year-btn:hover{background:var(--cyan-300);}
.pdf-year-btn:disabled{opacity:.5;cursor:wait;}

.card-actions{display:flex;gap:6px;align-items:center;flex:0 0 auto;}
.pdf-btn{
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--navy-950);
  background:var(--amber);border:none;border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap;
}
.pdf-btn:hover{filter:brightness(1.08);}
.pdf-btn:disabled{opacity:.5;cursor:wait;}

#busyOverlay{
  position:fixed;inset:0;background:rgba(5,11,24,.86);z-index:999;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  font-family:var(--mono);font-size:13px;color:#fff;text-align:center;padding:20px;
}
#busyOverlay .spin{
  width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cyan-400);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* analysis tab */
.analysis-tab-row{max-width:1180px;margin:10px auto 0;padding:0 20px 14px;}
.analysis-tab{
  width:100%;text-align:left;font-family:var(--serif);font-size:14.5px;font-weight:600;
  color:var(--navy-950);background:linear-gradient(90deg,var(--cyan-300),var(--cyan-400));
  border:none;border-radius:10px;padding:12px 16px;cursor:pointer;
}
.analysis-tab:hover{filter:brightness(1.05);}
.analysis-tab.active{background:linear-gradient(90deg,var(--amber),#f2c98a);}

.metric-card{background:var(--navy-800);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
.metric-card h3{font-family:var(--serif);font-size:17px;color:#fff;margin:0 0 4px;}
.metric-card .fonte-note{font-size:11px;color:var(--paper-dim);margin-bottom:2px;}
.metric-card .caveat{font-size:11.5px;color:var(--amber);background:rgba(242,178,99,.08);border-left:3px solid var(--amber);padding:6px 10px;border-radius:0 6px 6px 0;margin:8px 0;}
.metric-trend-row{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 6px;}
.trend-pill{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);}
.trend-pill.up{color:#7be89a;border-color:#7be89a55;}
.trend-pill.down{color:var(--rose);border-color:#e8637a55;}
.trend-pill.flat{color:var(--paper-dim);}

table.compare{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px;}
table.compare th{background:var(--navy-700);color:var(--cyan-300);padding:8px 10px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;}
table.compare td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);}
table.compare td:first-child, table.compare th:first-child{text-align:left;font-family:var(--sans);}
table.compare td.best{color:#7be89a;font-weight:700;}
table.compare td.worst{color:var(--rose);font-weight:700;}
table.compare td.delta-up{color:#7be89a;}
table.compare td.delta-down{color:var(--rose);}
.ind-card{background:var(--navy-800);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.ind-card h4{margin:0 0 8px;font-family:var(--mono);font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;}
.ind-card .line{font-size:13px;color:var(--paper);line-height:1.7;}
.ind-card .line b{color:var(--cyan-300);font-family:var(--mono);}

.intro-text{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:#d7e2f4;}

.empty{text-align:center;padding:60px 20px;color:var(--paper-dim);}
.empty b{color:#fff;}

footer{text-align:center;padding:26px 20px 40px;color:#4d6089;font-family:var(--mono);font-size:11px;margin-top:auto;}

@media(max-width:600px){
  .hero-title{font-size:21px;}
  table.data{font-size:12px;}
  .brand-text h1{font-size:17px;}
}
</style>
<style id="zelo-largura">/* Formulários e informação a toda a largura da página (de um lado ao outro). */
.year-rail,.wrap,.analysis-tab-row{max-width:none !important;width:100%;box-sizing:border-box;}
</style>
</head>
<body>


<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark"><img src="icons/logo.png" alt="ZELO"></div>
      <div class="brand-text">
        <div class="eyebrow">GEPE · DEMA</div>
        <h1>Consulta de Relatórios Anuais</h1>
      </div>
    </div>
    <div class="gepe-tag">Hospital do Prenda — Secção de Estatística</div>

  <nav class="year-rail" id="yearRail"></nav>
  <div class="analysis-tab-row">
    <button class="analysis-tab" id="analysisTabBtn">📊 Análise de Todos os Anos (tendência e comparação)</button>
  </div>
</header>

<div class="wrap" id="wrap-dia">
<button onclick="window.zeloLerElemento('#wrap-dia','Dados do dia')" style="margin:0 0 14px;padding:8px 14px;border-radius:8px;border:1px solid #CBD5E1;background:#fff;color:#0F172A;font-size:.8rem;font-weight:700;cursor:pointer;">🔊 Ler dados do dia em voz</button>

  <div class="hero">
    <div class="hero-card">
      <p class="hero-title" id="heroYear">—</p>
      <p class="hero-sub" id="heroSub">A carregar dados do relatório…</p>
      <div class="hero-stats">
        <div class="stat"><b id="statTabelas">0</b><span>Tabelas</span></div>

    <div class="toolbar">

  <div class="section-nav" id="sectionNav"></div>

</div>

ices, coeficientes e elabora o relatório das actividades estatísticas. Fornece informações epidemiológicas (nosología, incidência de doenças, etc.), realiza estimativas e ajuste de modelos de tempo de vida, entre outros. Os dados e os resultados obtidos servem de base ao corpo clínico para actividades de pesquisa e extensão, bem como ao corpo administrativo para o controle de gastos e custos.", "Segundo Sounis (1993) a localização mais adequada para a secção de estatística é no andar térreo, próximo à entrada principal do hospital, de forma que o registo geral se situe na área de admissão do ambulatório e esteja localizado próximo dos serviços administrativos. Para uma melhor localização é ideal a ocorrência de um planeamento prévio. Quanto à área física que deve ser destinada a secção de estatística, vários factores devem ser levados em consideração. É necessário ter em mente que esta área está em função do tamanho do hospital, bem como de sua classificação. Sua área total é equivalente ao somatório das áreas mínimas destinadas a cada uma das secções. Abaixo faremos menção das actividades realizadas durante o ano em curso."], "indicadores": [], "entradas": [{"ordem": 1, "seccao": "Actividade assistencial:", "legenda": "Tabela 1 - Consultas Externa. Hospital do Prenda Ano 2022", "tipo": "tabela", "cabecalho": ["ESPECIALIDADES", "5 a 14 anos", "15 anos e mais", "TOTAL"], "linhas": [["Medicina geral", "35", "4875", "4910"], ["Cirurgia geral", "33", "2632", "2665"], ["Ortopedia", "5", "1783", "1788"], ["Optometria", "52", "689", "741"], ["Cardiologia", "1", "647", "648"], ["Consultas estomatologicas", "49", "568", "617"], ["Urologia", "20", "524", "544"], ["Endocrinologia", "2", "533", "535"], ["Oftalmologia", "38", "450", "488"], ["Maxilo facial", "21", "377", "398"], ["Neurologia", "7", "295", "302"], ["Outras de cirurgia", "0", "190", "190"], ["Curativos e revisoes", "0", "148", "148"], ["Neurocirugia", "0", "147", "147"], ["Gasteoenterologia", "2", "138", "140"], [  e interpretação dos dados obtidos a partir dos prontuários e outras fontes de informação. Realiza o controlo das admissões, transferências, altas, óbitos e cirurgias. Além disso, analisam taxas, índices, coeficientes e elabora o relatório das actividades estatísticas. Fornece informações epidemiológicas (nosología, incidência de doenças, etc.), realiza estimativas e ajuste de modelos de tempo de vida, entre outros. Os dados e os resultados obtidos servem de base ao corpo clínico para actividades de pesquisa e extensão, bem como ao corpo administrativo para o controle de gastos e custos.", "Segundo Sounis (1993) a localização mais adequada para a secção de estatística é no andar térreo, próximo à entrada principal do hospital, de forma que o registo geral se situe na área de admissão do ambulatório e esteja localizado próximo dos serviços administrativos. Para uma melhor localização é ideal a ocorrência de um planeamento prévio. Quanto à área física que deve ser destinada a secção de estatística, vários factores devem ser levados em consideração. É necessário ter em mente que esta área está em função do tamanho do hospital, bem como de sua classificação. Sua área total é equivalente ao somatório das áreas mínimas destinadas a cada uma das secções. Abaixo faremos menção das actividades realizadas durante o ano em curso."], "indicadores": [], "entradas": [{"ordem": 1, "seccao": "Actividade assistencial:", "legenda": "Tabela 1 - Consultas Externa. Hospital do Prenda Ano 2023", "tipo": "tabela", "cabecalho": ["ESPECIALIDADES", "5 a 14 anos", "15 anos e mais", "TOTAL"], "linhas": [["Medicina Interna", "95", "13587", "13682"], ["Ortopedia", "53", "6679", "6732"], ["Cirurgia geral", "31", "4992", "5023"], ["Endocrinologia", "6", "2105", "2111"], ["Optometria", "377", "1261", "1638"], ["Neurologia", "7", "1585", "1592"], ["Oftalmologia", "166", "1415", "1581"], ["Urologia", "10", "1005", "1015"], ["Cardiologia", "6", "977", "983"], ["Neurocirurgia", "8", "823", "831"], ["Ma <script>
(function(){
  const DATA = JSON.parse(document.getElementById('app-data-root').textContent);
  const ANALYSIS = JSON.parse(document.getElementById('app-analysis-root').textContent);
  const YEARS = Object.keys(DATA).sort();
  let currentYear = YEARS[YEARS.length-1];
  let currentView = 'tabelas';
  let showingAnalysis = false;
  let searchTerm = '';
  const chartInstances = {};

  const PALETTE = ['#3fd6ea','#f2b263','#e8637a','#8b7ff0','#6fd68a','#f2e06b','#5ab0e8','#e89a4e'];

  function fmtNum(n){
    if (n === null || n === undefined) return '';
    if (typeof n !== 'number') return n;
    return n.toLocaleString('pt-PT');
  }

  function isNumericCell(v){
    if (v === undefined || v === null) return false;
    const t = String(v).trim().replace('%','');
    return /^-?\d{1,3}(\.\d{3})*(,\d+)?$/.test(t) || /^-?\d+(,\d+)?$/.test(t);
  }

  function renderYearRail(){
    const rail = document.getElementById('yearRail');
    rail.innerHTML = YEARS.map(y => `
      <button class="year-btn ${y===currentYear?'active':''}" data-year="${y}">
        <span class="n">${y}</span><span class="dot"></span>
      </button>`).join('');
    rail.querySelectorAll('.year-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        currentYear = btn.dataset.year; searchTerm=''; document.getElementById('searchInput').value='';
        if(showingAnalysis){
          showingAnalysis = false;
          document.getElementById('analysisTabBtn').classList.remove('active');
          document.querySelector('.hero').style.display = '';
          document.getElementById('sectionNav').style.display = '';
        }
        renderAll();
      });
    });
  }

  function renderHero(){
    const d = DATA[currentYear];
    const tabelas = d.entradas.filter(e=>e.tipo==='tabela').length;
    const graficos = d.entradas.filter(e=>e.tipo==='grafico').length + d.entradas.filter(e=>e.grafico_auto).length;
    const seccoes = new Set(d.entradas.map(e=>e.seccao)).size;
    document.getElementById('heroYear').textContent = 'Relatório de Actividades — ' + currentYear;
    document.getElementById('heroSub').textContent = 'Dados estatísticos completos do Hospital do Prenda referentes ao ano de ' + currentYear + '. Navegue pelas secções, consulte as tabelas originais, os gráficos gerados a partir dos números reais e os comentários redigidos pela Secção/Departamento de Estatística.';
    document.getElementById('statTabelas').textContent = tabelas;
    document.getElementById('statGraficos').textContent = graficos;
    document.getElementById('statSeccoes').textContent = seccoes;
    document.getElementById('statIndicadores').textContent = d.indicadores.length;
  }

  function groupBySection(entradas){
    const groups = [];
    let last = null;
    entradas.forEach(e=>{
      if(!last || last.seccao !== e.seccao){
        last = {seccao: e.seccao, items: []};
        groups.push(last);
      }
      last.items.push(e);
    });
    return groups;
  }

  function matchesSearch(e){
    if(!searchTerm) return true;
    const hay = (e.legenda + ' ' + e.seccao + ' ' + (e.comentarios||[]).join(' ') + ' ' +
      (e.cabecalho||[]).join(' ') + ' ' + (e.linhas||[]).flat().join(' ')).toLowerCase();
    return hay.includes(searchTerm);
  }

  function parseNumLoose(v){
    if(v===undefined||v===null) return null;
    let t = String(v).trim().replace('%','').trim();
    if(t===''||t==='-'||t==='—') return null;
    if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,'').replace(',', '.');
    else if(/^-?\d+,\d+$/.test(t)) t = t.replace(',', '.');
    else if(!/^-?\d+(\.\d+)?$/.test(t)) return null;
    const n = parseFloat(t);
    return isNaN(n) ? null : n;
  }

  function findExplicitTotal(entry, colIndex){
    const rows = entry.linhas || [];
    const totalRow = rows.find(r => (r[0]||'').toString().trim().toLowerCase().startsWith('total'));
    if(!totalRow) return null;
    return parseNumLoose(totalRow[colIndex]);
  }

  function computeDashboard(entry){
    // Tabelas sem coluna numérica: dashboard só com contagem de registos
    if(entry.tipo === 'tabela' && !entry.grafico_auto){
      return [{label:'Registos na tabela', value: (entry.linhas||[]).length, accent:''}];
    }
    let categorias, valoresPrincipais, colIndex=null, unidade='';
    if(entry.tipo === 'grafico' && entry.grafico_nativo){
      categorias = entry.grafico_nativo.categorias;
      valoresPrincipais = entry.grafico_nativo.valores;
    } else if(entry.grafico_auto){
      categorias = entry.grafico_auto.categorias;
      valoresPrincipais = entry.grafico_auto.series[0].valores;
      colIndex = entry.grafico_auto.label_col + 1; // aproximação; ajustado abaixo
    }
    if(!categorias || !categorias.length) return [];

    const soma = valoresPrincipais.reduce((a,b)=>a+(b||0),0);
    let maxIdx=0, minIdx=0;
    valoresPrincipais.forEach((v,i)=>{ if(v>valoresPrincipais[maxIdx]) maxIdx=i; if(v<valoresPrincipais[minIdx]) minIdx=i; });

    // tenta usar o total explícito da própria tabela (linha "Total"), quando existir — dado real da fonte
    let totalReal = null;
    if(entry.tipo === 'tabela' && entry.cabecalho){
      for(let c=0;c<entry.cabecalho.length;c++){
        const v = findExplicitTotal(entry, c);
        if(v !== null && Math.abs(v - soma) < Math.max(1, soma*0.02)){ totalReal = v; break; }
      }
    }

    const kpis = [
      {label:'Nº de categorias', value: categorias.length, accent:''},
      {label: totalReal!==null?'Total (linha Total)':'Total (soma)', value: fmtNum(totalReal!==null?totalReal:soma), accent:'amber'},
      {label:'Maior valor', value: fmtNum(valoresPrincipais[maxIdx]), sub: categorias[maxIdx], accent:''},
      {label:'Menor valor', value: fmtNum(valoresPrincipais[minIdx]), sub: categorias[minIdx], accent:'rose'},
      {label:'Média por categoria', value: fmtNum(Math.round((soma/categorias.length)*100)/100), accent:''},
    ];
    return kpis;
  }

  function buildDashboardHTML(entry){
    const kpis = computeDashboard(entry);
    if(!kpis.length) return '';
    const boxes = kpis.map(k=>`
      <div class="kpi-box ${k.accent?'accent-'+k.accent:''}">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}${k.sub?`<small>${k.sub}</small>`:''}</div>
      </div>`).join('');
    return `<div class="dash-label">Dashboard</div><div class="kpi-strip">${boxes}</div>`;
  }

  function buildTableHTML(entry){
    const head = entry.cabecalho || [];
    const rows = entry.linhas || [];
    let thead = '<tr>' + head.map((h,i)=>`<th class="${isNumericCell(rows[0]&&rows[0][i])?'num':''}">${h||''}</th>`).join('') + '</tr>';
    let tbody = rows.map(r=>{
      const isTotal = (r[0]||'').toString().trim().toLowerCase().startsWith('total');
      return '<tr class="'+(isTotal?'total-row':'')+'">' + r.map(c=>`<td class="${isNumericCell(c)?'num':''}">${c===undefined||c===''?'—':c}</td>`).join('') + '</tr>';
    }).join('');
    return `<div class="table-scroll"><table class="data"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  }

  function buildChartCanvas(id){
    return `<div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
  }

  function renderChartAuto(canvasId, autoData, legenda){
    const MAXCAT = 18;
    let cats = autoData.categorias, series = autoData.series;
    let note = '';
    if(cats.length > MAXCAT){
      // ordenar pela primeira série e mostrar as maiores categorias (tabela completa mantém-se acima)
      const idx = cats.map((c,i)=>i).sort((a,b)=> (series[0].valores[b]||0) - (series[0].valores[a]||0)).slice(0,MAXCAT);
      idx.sort((a,b)=>a-b);
      cats = idx.map(i=>cats[i]);
      series = series.map(s=>({nome:s.nome, valores: idx.map(i=>s.valores[i])}));
      note = `Gráfico com as ${MAXCAT} categorias de maior valor (tabela completa acima/abaixo tem todos os ${autoData.categorias.length} registos).`;
    }
    const ctx = document.getElementById(canvasId);
    chartInstances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: cats,
        datasets: series.map((s,i)=>({
          label: s.nome,
          data: s.valores,
          backgroundColor: PALETTE[i % PALETTE.length],
          borderRadius: 3,
        }))
      },
      options: {
        responsive:true,
        plugins:{ legend:{ display: series.length>1, labels:{color:'#aebedb', font:{size:11}}},
                  tooltip:{titleFont:{size:12}, bodyFont:{size:12}} },
        scales:{
          x:{ ticks:{ color:'#aebedb', font:{size:10}, autoSkip:false, maxRotation:60, minRotation: cats.length>6?45:0 }, grid:{color:'#152a58'} },
          y:{ ticks:{ color:'#aebedb', font:{size:10} }, grid:{color:'#152a58'} }
        }
      }
    });
    return note;
  }

  function renderChartNative(canvasId, nc){
    const ctx = document.getElementById(canvasId);
    chartInstances[canvasId] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: nc.categorias,
        datasets: [{ label:'Nº de casos', data: nc.valores, backgroundColor: PALETTE[1], borderRadius:3 }]
      },
      options: {
        responsive:true, indexAxis: 'y',
        plugins:{ legend:{display:false} },
        scales:{
          x:{ ticks:{ color:'#aebedb', font:{size:10} }, grid:{color:'#152a58'} },
          y:{ ticks:{ color:'#aebedb', font:{size:10.5} }, grid:{display:false} }
        }
      }
    });
  }

  // ---------------------------------------------------------------
  // Exportação PDF (jsPDF + AutoTable, tudo embutido — funciona offline)
  // ---------------------------------------------------------------
  function showBusy(msg){
    const el = document.getElementById('busyOverlay');
    document.getElementById('busyMsg').textContent = msg;
    el.style.display = 'flex';
  }
  function hideBusy(){ document.getElementById('busyOverlay').style.display = 'none'; }

  function renderChartOffscreen(entry){
    return new Promise((resolve)=>{
      let dataForChart = null, horizontal = false;
      if(entry.tipo === 'grafico' && entry.grafico_nativo){
        dataForChart = { labels: entry.grafico_nativo.categorias,
          datasets: [{ label:'Nº de casos', data: entry.grafico_nativo.valores, backgroundColor: PALETTE[1] }] };
        horizontal = true;
      } else if(entry.grafico_auto){
        const MAXCAT = 18;
        let cats = entry.grafico_auto.categorias, series = entry.grafico_auto.series;
        if(cats.length > MAXCAT){
          const idx = cats.map((c,i)=>i).sort((a,b)=>(series[0].valores[b]||0)-(series[0].valores[a]||0)).slice(0,MAXCAT);
          idx.sort((a,b)=>a-b);
          cats = idx.map(i=>cats[i]);
          series = series.map(s=>({nome:s.nome, valores: idx.map(i=>s.valores[i])}));
        }
        dataForChart = { labels: cats, datasets: series.map((s,i)=>({label:s.nome, data:s.valores, backgroundColor: PALETTE[i%PALETTE.length]})) };
      } else {
        resolve(null); return;
      }
      const container = document.createElement('div');
      container.style.cssText = 'position:fixed;left:-99999px;top:0;background:#050b18;';
      const canvas = document.createElement('canvas');
      canvas.width = 900; canvas.height = 480;
      container.appendChild(canvas);
      document.body.appendChild(container);
      const chart = new Chart(canvas, {
        type:'bar',
        data: dataForChart,
        options:{
          responsive:false, animation:false, indexAxis: horizontal?'y':'x',
          backgroundColor:'#050b18',
          plugins:{ legend:{ display: dataForChart.datasets.length>1, labels:{color:'#0a1730'} } },
          scales:{ x:{ticks:{color:'#0a1730',font:{size:11}}}, y:{ticks:{color:'#0a1730',font:{size:11}}} }
        },
        plugins: [{
          id:'bgwhite',
          beforeDraw:(c)=>{ const ctx=c.ctx; ctx.save(); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.restore(); }
        }]
      });
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const url = canvas.toDataURL('image/png', 1.0);
        chart.destroy();
        document.body.removeChild(container);
        resolve(url);
      }));
    });
  }

  // Logótipo ZELO no PDF — reaproveita a imagem já presente na página.
  var _zeloLogoCache;
  function _zeloLogoDataURL(){
    if(_zeloLogoCache !== undefined) return _zeloLogoCache;
    try{
      const img = document.querySelector('.brand-mark img');
      if(!img || !img.naturalWidth){ _zeloLogoCache = null; return null; }
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img,0,0);
      _zeloLogoCache = c.toDataURL('image/png');
    }catch(e){ _zeloLogoCache = null; }
    return _zeloLogoCache;
  }
  // Uma tabela/gráfico do relatório, no modelo geral (zelo_pdf.js). Se
  // "comTitulo", escreve a legenda como secção (no PDF do ano completo).
  async function renderEntryToPDF(doc, entry, year, y, comTitulo){
    const Z = window.ZeloPDF;
    if(comTitulo) y = Z.secao(doc, y, entry.legenda);
    y = Z.texto(doc, y + 1, '', `${entry.seccao} · Ano ${year}`);

    const kpis = computeDashboard(entry);
    if(kpis.length){
      for(let i=0;i<kpis.length;i+=4){
        y = Z.indicadores(doc, y, kpis.slice(i,i+4).map(k=>[k.label + (k.sub?' ('+k.sub+')':''), k.value]));
      }
      y += 2;
    }

    const img = await renderChartOffscreen(entry);
    if(img){
      const imgW = 182, imgH = imgW * (480/900);
      y = Z.quebra(doc, y, imgH + 4);
      doc.addImage(img, 'PNG', 14, y, imgW, imgH);
      y += imgH + 5;
    }

    if(entry.tipo === 'tabela' && entry.cabecalho && entry.cabecalho.length){
      y = Z.autoTable(doc, Object.assign({ head: [entry.cabecalho], body: entry.linhas, startY: y },
        Z.opcoesLarga(entry.cabecalho.length, 12))) + 2;
    }

    if(entry.fonte) y = Z.texto(doc, y, 'Fonte', entry.fonte);
    if(entry.comentarios && entry.comentarios.length){
      for(const c of entry.comentarios) y = Z.texto(doc, y, '', c);
    }
    return y;
  }

  window.__exportTablePDF = async function(year, ordem){
    const entry = DATA[year].entradas.find(e=>String(e.ordem)===String(ordem));
    if(!entry) return;
    showBusy('A gerar PDF da tabela…');
    try{
      const Z = window.ZeloPDF;
      const doc = Z.novo();
      const y = Z.cabecalho(doc, 'Relatório Anual ' + year + ' — ' + entry.legenda, entry.seccao);
      await renderEntryToPDF(doc, entry, year, y, false);
      Z.rodape(doc);
      doc.save(`HP_${year}_${slug(entry.legenda)}.pdf`);
    } catch(err){
      alert('Não foi possível gerar o PDF: ' + err.message);
    } finally {
      hideBusy();
    }
  };

  window.__exportYearPDF = async function(year){
    const d = DATA[year];
    showBusy(`A gerar PDF do relatório ${year}… (0/${d.entradas.length})`);
    try{
      const Z = window.ZeloPDF;
      const doc = Z.novo();
      let y = Z.cabecalho(doc, 'Relatório de Actividades — Ano ' + year,
        `${d.entradas.length} tabelas/gráficos · ${d.indicadores.length} indicadores calculados`);
      y = Z.texto(doc, y, '', 'Documento gerado a partir dos dados originais do relatório anual, sem valores alterados.');
      y = Z.secao(doc, y, 'Índice');
      y = Z.autoTable(doc, { startY: y, head: [['Nº', 'Tabela / gráfico', 'Secção']],
        body: d.entradas.map((e,i)=>[i+1, e.legenda, e.seccao || '—']), columnStyles: {0:{halign:'center'}} });

      for(let i=0;i<d.entradas.length;i++){
        doc.addPage();
        showBusy(`A gerar PDF do relatório ${year}… (${i+1}/${d.entradas.length})`);
        await renderEntryToPDF(doc, d.entradas[i], year, Z.TOPO_CONTINUACAO, true);
      }
      Z.rodape(doc);
      doc.save(`HP_Relatorio_Anual_${year}.pdf`);
    } catch(err){
      alert('Não foi possível gerar o PDF do relatório: ' + err.message);
    } finally {
      hideBusy();
    }
  };

  document.getElementById('pdfYearBtn').addEventListener('click', (ev)=>{
    ev.target.disabled = true;
    window.__exportYearPDF(currentYear).finally(()=>{ ev.target.disabled = false; });
  });

  document.getElementById('analysisTabBtn').addEventListener('click', (ev)=>{
    showingAnalysis = !showingAnalysis;
    ev.target.classList.toggle('active', showingAnalysis);
    document.querySelector('.hero').style.display = showingAnalysis ? 'none' : '';
    document.getElementById('sectionNav').style.display = showingAnalysis ? 'none' : '';
    renderContent();
  });

  function fmtPct(p){
    if(p === null || p === undefined) return '—';
    const s = p > 0 ? '+' : '';
    return s + p.toLocaleString('pt-PT') + '%';
  }

  function renderAnalysisView(){
    const years = ANALYSIS.years;
    const cards = ANALYSIS.metrics.map(m=>{
      const canvasId = 'analysis-chart-' + m.id;
      const trendUp = m.tendencia_total_pct !== null && m.tendencia_total_pct > 0;
      const trendClass = m.tendencia_total_pct === null ? 'flat' : (trendUp ? 'up' : 'down');
      const trendIcon = m.tendencia_total_pct === null ? '→' : (trendUp ? '▲' : '▼');

      const rows = `
        <tr>
          <td>${m.nome}</td>
          ${years.map(y=>{
            const v = m.valores[y];
            const cls = y===m.ano_maior ? 'best' : (y===m.ano_menor ? 'worst' : '');
            return `<td class="${cls}">${v!==null && v!==undefined ? v.toLocaleString('pt-PT') : '—'}</td>`;
          }).join('')}
        </tr>
        <tr>
          <td style="color:var(--paper-dim); font-size:11px;">variação anual</td>
          ${years.map(y=>{
            const p = m.variacoes_pct[y];
            const cls = p===null ? '' : (p>=0 ? 'delta-up' : 'delta-down');
            return `<td class="${cls}" style="font-size:11px;">${p===null?'—':fmtPct(p)}</td>`;
          }).join('')}
        </tr>`;

      return `
      <div class="metric-card">
        <h3>${m.nome}</h3>
        <div class="fonte-note">Fonte: ${m.fonte}</div>
        ${m.nota ? `<div class="caveat">⚠ ${m.nota}</div>` : ''}
        <div class="metric-trend-row">
          <span class="trend-pill ${trendClass}">${trendIcon} Tendência 2019→2025: ${fmtPct(m.tendencia_total_pct)}</span>
          <span class="trend-pill">Maior valor: ${m.ano_maior} (${m.valores[m.ano_maior].toLocaleString('pt-PT')})</span>
          <span class="trend-pill">Menor valor: ${m.ano_menor} (${m.valores[m.ano_menor].toLocaleString('pt-PT')})</span>
        </div>
        <div class="chart-wrap"><canvas id="${canvasId}"></canvas></div>
        <div class="table-scroll">
          <table class="compare">
            <thead><tr><th>Indicador</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');

    return `
      <div class="section-heading"><span class="idx">§ANÁLISE</span><h2>Análise de Todos os Anos — Tendência e Comparação (2019–2025)</h2></div>
      <p style="color:var(--paper-dim); font-size:13px; max-width:70ch; margin:-4px 0 18px;">
        Indicadores reconstruídos a partir das tabelas "Total" de cada relatório anual original. Onde a estrutura do
        relatório mudou entre anos, isso está assinalado com uma nota (⚠) e a fonte exacta de cada valor está indicada.
      </p>
      ${cards}
    `;
  }

  function renderAnalysisCharts(){
    ANALYSIS.metrics.forEach(m=>{
      const canvasId = 'analysis-chart-' + m.id;
      const ctx = document.getElementById(canvasId);
      if(!ctx || chartInstances[canvasId]) return;
      const years = ANALYSIS.years;
      chartInstances[canvasId] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years,
          datasets: [{
            label: m.nome,
            data: years.map(y=>m.valores[y]),
            borderColor: PALETTE[0],
            backgroundColor: PALETTE[0] + '33',
            fill: true,
            tension: 0.25,
            pointRadius: 4,
            pointBackgroundColor: PALETTE[0],
          }]
        },
        options: {
          responsive:true,
          plugins:{ legend:{display:false} },
          scales:{
            x:{ ticks:{ color:'#aebedb', font:{size:11} }, grid:{color:'#152a58'} },
            y:{ ticks:{ color:'#aebedb', font:{size:10} }, grid:{color:'#152a58'} }
          }
        }
      });
    });
  }

  function cardId(year, ordem){ return `card-${year}-${ordem}`; }

  function renderTabelasView(){
    const d = DATA[currentYear];
    const entradas = d.entradas.filter(matchesSearch);
    const groups = groupBySection(entradas);
    const nav = document.getElementById('sectionNav');
    nav.innerHTML = groups.map(g=>`<a href="#sec-${slug(g.seccao)}-${currentYear}">${g.seccao}</a>`).join('');

    if(entradas.length===0){
      return `<div class="empty">Nenhum resultado para <b>"${searchTerm}"</b> em ${currentYear}.</div>`;
    }

    return groups.map((g,gi)=>{
      const itemsHtml = g.items.map(e=>{
        const id = cardId(currentYear, e.ordem);
        const cid = id+'-canvas';
        let bodyExtra = '';
        bodyExtra += buildDashboardHTML(e);
        if(e.tipo === 'grafico'){
          bodyExtra += buildChartCanvas(cid);
        } else if(e.grafico_auto){
          bodyExtra += buildChartCanvas(cid);
        }
        if(e.tipo === 'tabela'){
          bodyExtra += buildTableHTML(e);
        }
        if(e.fonte){
          bodyExtra += `<div class="fonte">${e.fonte}</div>`;
        }
        if(e.comentarios && e.comentarios.length){
          bodyExtra += e.comentarios.map(c=>`<div class="comment">${c}</div>`).join('');
        }
        const tag = e.tipo === 'grafico' ? '<span class="card-tag chart-only">GRÁFICO</span>' : '<span class="card-tag">TABELA</span>';
        return `
        <div class="card" id="${id}" data-canvas="${cid}" data-kind="${e.tipo}">
          <div class="card-head" onclick="window.__toggleCard('${id}')">
            <p class="card-title">${e.legenda}</p>
            <div class="card-actions">
              ${tag}
              <button class="pdf-btn" onclick="event.stopPropagation(); window.__exportTablePDF('${currentYear}', ${e.ordem})">PDF ⬇</button>
            </div>
          </div>
          <div class="card-body">${bodyExtra}</div>
        </div>`;
      }).join('');
      return `<div class="section-heading" id="sec-${slug(g.seccao)}-${currentYear}"><span class="idx">§${String(gi+1).padStart(2,'0')}</span><h2>${g.seccao}</h2></div>${itemsHtml}`;
    }).join('');
  }

  function renderIndicadoresView(){
    const d = DATA[currentYear];
    if(!d.indicadores.length){
      return '<div class="empty">Este relatório (<b>'+currentYear+'</b>) não apresenta indicadores calculados isolados — todos os valores estão integrados directamente nas tabelas.</div>';
    }
    const cards = d.indicadores.map(ind=>{
      const lines = ind.linhas.map(l=>`<div class="line">${l}</div>`).join('');
      return `<div class="ind-card"><h4>${ind.seccao}</h4>${lines}</div>`;
    }).join('');
    return `<div class="section-heading"><span class="idx">§IND</span><h2>Indicadores calculados</h2></div><div class="ind-grid">${cards}</div>`;
  }

  function renderInfoView(){
    const d = DATA[currentYear];
    const txt = d.intro.join('\n\n');
    return `<div class="section-heading"><span class="idx">§OF</span><h2>Ofício / Introdução do relatório</h2></div>
      <div class="card open"><div class="card-body" style="padding-top:16px;"><div class="intro-text">${txt || 'Sem texto introdutório registado neste documento.'}</div></div></div>`;
  }

  function slug(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40); }

  window.__toggleCard = function(id){
    const card = document.getElementById(id);
    const wasOpen = card.classList.contains('open');
    card.classList.toggle('open');
    if(!wasOpen){
      const canvasId = card.dataset.canvas;
      if(canvasId && !chartInstances[canvasId]){
        // achar a entrada correspondente
        const [_, year, ordemStr] = card.id.split('-');
        const entry = DATA[year].entradas.find(e=>String(e.ordem)===ordemStr);
        requestAnimationFrame(()=>{
          if(entry.tipo === 'grafico' && entry.grafico_nativo){
            renderChartNative(canvasId, entry.grafico_nativo);
          } else if(entry.grafico_auto){
            const note = renderChartAuto(canvasId, entry.grafico_auto, entry.legenda);
            if(note){
              const wrap = document.getElementById(canvasId).closest('.chart-wrap');
              const p = document.createElement('div'); p.className='chart-note'; p.textContent = note;
              wrap.appendChild(p);
            }
          }
        });
      }
    }
  };

  function renderContent(){
    const el = document.getElementById('content');
    if(showingAnalysis){
      el.innerHTML = renderAnalysisView();
      requestAnimationFrame(renderAnalysisCharts);
      return;
    }
    if(currentView === 'tabelas') el.innerHTML = renderTabelasView();
    else if(currentView === 'indicadores') el.innerHTML = renderIndicadoresView();
    else el.innerHTML = renderInfoView();
  }

  function renderAll(){
    renderYearRail();
    renderHero();
    renderContent();
  }

  document.getElementById('viewToggle').addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('#viewToggle .chip').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    renderContent();
  });

  let searchDebounce;
  document.getElementById('searchInput').addEventListener('input', (ev)=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{
      searchTerm = ev.target.value.trim().toLowerCase();
      if(currentView !== 'tabelas'){
        document.querySelectorAll('#viewToggle .chip').forEach(c=>c.classList.remove('active'));
        document.querySelector('#viewToggle .chip[data-view="tabelas"]').classList.add('active');
        currentView = 'tabelas';
      }
      renderContent();
    }, 180);
  });

  renderAll();
})();
</script>
