name: Grupo Kambas — APK Android

on:
  push:
    branches: [ccr-fbaf189e-9ll2g5, claude/publishing-pages-r49a1s]
    paths:
      - "grupo-kambas/**"
      - ".github/workflows/grupo-kambas-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grupo-kambas-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grupo-kambas/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar os ficheiros da aplicação
        run: python3 ../construir.py --apk www

      - name: Instalar o Capacitor
        run: npm install --no-audit --no-fund

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícone e ecrã de arranque com o logótipo
        run: |
          mkdir -p assets
          cp ../static/icone-1024.png assets/icon.png
          cp ../static/arranque-2732.png assets/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor "#0A3D4C" --iconBackgroundColorDark "#0A3D4C" --splashBackgroundColor "#0A3D4C" --splashBackgroundColorDark "#0A3D4C"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar a APK
        run: |
          mkdir -p ~/.android
          cp kambas-debug.keystore ~/.android/debug.keystore
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GrupoKambas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrupoKambas-apk
          path: grupo-kambas/android-app/GrupoKambas.apk

      - name: Publicar no release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grupo-kambas-apk
          name: Grupo Kambas — APK Android
          files: grupo-kambas/android-app/GrupoKambas.apk
          make_latest: false
          body: |
            Aplicação Android do sistema de gestão do Grupo Kambas (vendas, faturação, stock e relatórios).
            Descarregue **GrupoKambas.apk**, abra no telemóvel e permita a instalação de "fontes desconhecidas" quando o Android pedir.
            Compilada a partir do commit ${{ github.sha }}.
