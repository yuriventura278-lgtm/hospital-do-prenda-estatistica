name: Relatório mensal (sem apagar dados)

on:
  schedule:
    # 06:00 UTC do dia 2 de cada mês
    - cron: '0 6 2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Gera o PDF e os dados do mês anterior e guarda-os em relatorios_mensais/
      # na Realtime Database. NUNCA apaga dados do Firebase.
      - name: Gerar resumo mensal (sem apagar dados)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run relatorio-mensal

      - name: Abrir alerta se o relatório mensal falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha no relatório mensal automático (${new Date().toISOString().slice(0,7)})`,
              body: `O processo automático que gera o resumo mensal em PDF falhou (nenhum dado foi apagado).\n\nVer o registo completo aqui: ${runUrl}`,
              labels: ['relatorio-mensal', 'falha-automatica'],
            });
