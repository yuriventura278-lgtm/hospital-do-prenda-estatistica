name: Relatório mensal e limpeza do histórico

on:
  schedule:
    # 06:00 UTC do dia 2 de cada mês
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      skip_cleanup:
        description: 'Gerar o PDF sem apagar o histórico do Firebase (modo de teste)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Gerar resumo mensal, publicar no Firebase Storage e limpar histórico
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SKIP_CLEANUP: ${{ github.event.inputs.skip_cleanup || 'false' }}
        run: npm run relatorio-mensal

      - name: Abrir alerta se o relatório mensal falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falha no relatório mensal automático (${new Date().toISOString().slice(0,7)})`,
              body: `O processo automático que gera o resumo mensal em PDF e limpa o histórico do Firebase falhou.\n\nVer o registo completo aqui: ${runUrl}\n\nO histórico do Firebase deste mês pode ainda não ter sido limpo — verificar antes de correr o relatório novamente.`,
              labels: ['relatorio-mensal', 'falha-automatica'],
            });
