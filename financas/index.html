<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Organização Pessoal &amp; Financeira</title>
<meta name="theme-color" content="#0f6b4e">
<meta name="description" content="Organização pessoal e financeira: agenda, receita, plano, gastos, poupança e relatórios.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organização">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --green:#0ea371; --green-dark:#0b7a54; --green-soft:#d7f5e9;
  --ink:#122b2a; --ink-2:#2d4a47; --muted:#6c8480; --muted-2:#93a8a4;
  --bg:#eef4f2; --card:#ffffff; --line:#e4ece9; --line-soft:#eef5f2; --line-strong:#d6e3df;
  --fixa:#3b74e8; --fixa-soft:#e6eefc;
  --pessoal:#f0a52b; --pessoal-soft:#fcf0d9;
  --poupanca:#12b886; --poupanca-soft:#d6f6ea;
  --emerg:#12b886; --emerg-soft:#d6f6ea;
  --nossa:#7c5cff; --nossa-soft:#ece7ff;
  --pess:#3b74e8; --pess-soft:#e6eefc;
  --danger:#e05656; --danger-soft:#fcebeb;
  --ok:#17a673; --warn:#e0912a;
  --radius:20px; --radius-sm:15px; --radius-xs:12px;
  --shadow-sm:0 1px 3px rgba(18,43,42,.05),0 1px 2px rgba(18,43,42,.04);
  --shadow-md:0 6px 20px rgba(16,90,70,.1);
  --shadow-lg:0 18px 44px rgba(10,60,46,.2);
  --ease:cubic-bezier(.22,.72,.28,1);
  --nav-h:66px;
  --green-deep:#0b7a54; --surface:#ffffff; --input:#f7faf9; --subtle:#f3f6f5; --navglass:rgba(255,255,255,.92);
  --prio-soft:#fdeadc; --warn-soft:#fdf1dc; --warn-text:#b8700a; --rf-tint:#eaf7f1; --rf-line:#d6e9e1;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1413; --card:#142120; --surface:#142120; --input:#1a2928; --subtle:#1b2a28; --navglass:rgba(16,26,25,.94);
  --ink:#e6f2ef; --ink-2:#c0d3ce; --muted:#8ba39d; --muted-2:#6b847e;
  --line:#233532; --line-soft:#1b2a28; --line-strong:#2e4440;
  --green-dark:#45d6a1; --green-soft:#11382c;
  --fixa-soft:#16264a; --pessoal-soft:#3a2a10; --poupanca-soft:#0f372a;
  --emerg-soft:#0f372a; --nossa-soft:#261f4b; --pess-soft:#16264a;
  --danger:#f07070; --danger-soft:#3a1d1e; --prio-soft:#3b2414; --warn-soft:#3a2a10; --warn-text:#f2b65a; --rf-tint:#11291f; --rf-line:#23443a;
  --shadow-sm:0 1px 3px rgba(0,0,0,.35); --shadow-md:0 6px 20px rgba(0,0,0,.4); --shadow-lg:0 18px 44px rgba(0,0,0,.5);
}
html[data-theme="dark"] body{background:
  radial-gradient(1000px 500px at 100% -8%, #0f2c22 0%, rgba(15,44,34,0) 60%),
  radial-gradient(820px 440px at -10% 4%, #0f1d2c 0%, rgba(15,29,44,0) 55%), var(--bg);}
html[data-theme="dark"] .field input[type="date"],html[data-theme="dark"] .field input[type="month"]{color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{background:
  radial-gradient(1000px 500px at 100% -8%, #dbf3ea 0%, rgba(219,243,234,0) 60%),
  radial-gradient(820px 440px at -10% 4%, #e3f0fb 0%, rgba(227,240,251,0) 55%),
  var(--bg); background-attachment:fixed;}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select{font-family:inherit;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:6px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cfe0db;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.hidden{display:none !important;}

/* ---------- APP BAR ---------- */
header.appbar{position:sticky;top:0;z-index:60;color:#fff;
  background:linear-gradient(135deg,#0f6b4e 0%,#0a3b32 100%);
  padding:calc(13px + env(safe-area-inset-top)) 16px 15px;
  box-shadow:0 2px 18px rgba(10,50,40,.22);}
.appbar-top{display:flex;align-items:center;gap:11px;}
.appbar-logo{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden;}
.appbar-logo img{width:34px;height:34px;object-fit:contain;display:block;}
.appbar-top .tt{flex:1;min-width:0;}
.appbar-top .tt .t1{font-size:15px;font-weight:800;letter-spacing:.2px;}
.avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22),0 4px 12px rgba(0,0,0,.2);}
.avatar img{width:30px;height:30px;object-fit:contain;display:block;}
.hello-l{font-size:12px;color:#9fe0c6;font-weight:700;line-height:1.1;}
.hello-n{font-size:21px;font-weight:900;letter-spacing:-.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar-top .tt .t2{font-size:10.5px;color:#9fe0c6;margin-top:1px;letter-spacing:.3px;text-transform:uppercase;font-weight:600;}
.iconbtn{background:rgba(255,255,255,.14);border:none;border-radius:11px;width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
.iconbtn:active{transform:scale(.93);background:rgba(255,255,255,.24);}
.iconbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.mes-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:5px;}
.mes-nav button{background:rgba(255,255,255,.14);border:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
.mes-nav button:active{transform:scale(.9);background:rgba(255,255,255,.26);}
.mes-nav button svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.mes-nav .mes-label{flex:1;text-align:center;font-size:15px;font-weight:800;letter-spacing:.3px;text-transform:capitalize;}

/* ---------- LAYOUT ---------- */
main{padding:18px 16px;max-width:920px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));}
.page{animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.pagehead{margin:2px 0 16px;}
.pagehead h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px;color:var(--ink);}
.pagehead p{font-size:12.5px;color:var(--muted);margin:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:14px;transition:box-shadow .2s var(--ease);}
.card h2{font-size:13px;font-weight:800;color:var(--ink);margin:0 0 15px;display:flex;align-items:center;gap:9px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);letter-spacing:.2px;}
.card h2 svg{width:16px;height:16px;stroke:var(--green-dark);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.card h2 .sp{flex:1;}
.pill{font-size:11px;font-weight:800;border-radius:20px;padding:3px 11px;background:var(--green-soft);color:var(--green-dark);}

/* ---------- HERO ---------- */
.hero{background:linear-gradient(140deg,#0f8a63,#0a5a44);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);}
.hero .lbl{font-size:11px;font-weight:700;color:#aee9ce;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px;}
.hero .val{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:6px;line-height:1;}
.hero .val small{font-size:16px;font-weight:700;opacity:.8;margin-left:3px;}
.hero .sub{font-size:12px;color:#c6f0de;margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 14px;}
.hero .edit{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.16);border:none;border-radius:10px;padding:7px 12px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;transition:background .15s,transform .1s;z-index:1;}
.hero .edit:active{transform:scale(.95);background:rgba(255,255,255,.28);}
.hero .edit svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green);}
.kpi.k-plan::before{background:var(--fixa);}
.kpi.k-gasto::before{background:var(--pessoal);}
.kpi.k-poup::before{background:var(--poupanca);}
.kpi.k-disp::before{background:var(--muted-2);}
.kpi .kl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
.kpi .kv{font-size:19px;font-weight:800;color:var(--ink);margin-top:5px;letter-spacing:-.3px;}
.kpi .kv small{font-size:11px;font-weight:700;color:var(--muted);}
.kpi .kv.neg{color:var(--danger);}

/* ---------- PROGRESS ---------- */
.bar-track{height:10px;background:var(--line);border-radius:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:10px;transition:width .5s var(--ease);background:var(--green);}
.bar-fill.over{background:var(--danger);}
.saude .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.saude .row .big{font-size:22px;font-weight:800;color:var(--ink);}
.saude .row .small{font-size:12px;color:var(--muted);font-weight:600;}
.saude .legend{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--muted);font-weight:600;}

/* ---------- DONUT + grupos ---------- */
.dist-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.donut{width:128px;height:128px;border-radius:50%;flex-shrink:0;position:relative;background:conic-gradient(var(--line) 0 100%);}
.donut .hole{position:absolute;inset:20px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .hole .h1{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.donut .hole .h2{font-size:16px;font-weight:800;color:var(--ink);}
.dist-legend{flex:1;min-width:150px;}
.dist-legend .dl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);}
.dist-legend .dl:last-child{border-bottom:none;}
.dist-legend .dot{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
.dist-legend .dn{flex:1;font-size:12.5px;font-weight:700;color:var(--ink-2);}
.dist-legend .dv{font-size:12.5px;font-weight:800;color:var(--ink);}
.dist-legend .dp{font-size:11px;color:var(--muted);font-weight:700;min-width:38px;text-align:right;}
.grupo-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:11px;box-shadow:var(--shadow-sm);}
.grupo-card .gh{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.grupo-card .gic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.grupo-card .gic svg{width:17px;height:17px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.grupo-card .gt{flex:1;}
.grupo-card .gt .g1{font-size:13.5px;font-weight:800;color:var(--ink);}
.grupo-card .gt .g2{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
.grupo-card .gval{text-align:right;}
.grupo-card .gval .v1{font-size:13.5px;font-weight:800;}
.grupo-card .gval .v2{font-size:10.5px;color:var(--muted);font-weight:600;}

/* ---------- DASHBOARD POUPANÇA CARD ---------- */
.ppmini{display:flex;align-items:center;gap:14px;}
.ppmini .ring{width:72px;height:72px;}
.ppmini .ppm-t{flex:1;min-width:0;}
.ppmini .ppm-v{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.3px;}
.ppmini .ppm-v small{font-size:11px;font-weight:700;color:var(--muted);}
.ppmini .ppm-s{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;}
.ppmini .ppm-s b{color:var(--poupanca);}
.ppmini .ppm-go{background:var(--green-soft);color:var(--green-dark);border:none;border-radius:11px;padding:10px 13px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.ppmini .ppm-go svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- LIST ROWS ---------- */
.add-head{display:flex;align-items:center;gap:10px;margin:4px 0 12px;}
.add-head .ht{flex:1;font-size:13px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;}
.add-head .ht .gdot{width:10px;height:10px;border-radius:3px;}
.btn-add{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;border:none;border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:800;min-height:42px;box-shadow:0 4px 12px rgba(11,122,84,.28);transition:transform .12s,filter .15s;}
.btn-add:active{transform:scale(.96);}
.btn-add svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .12s;}
.item .inum{width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green-dark);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.item .imid{flex:1;min-width:0;}
.item .iname{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .imeta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
.item .tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;}
.item .ival{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;flex-shrink:0;}
.item .ival.gasto{color:var(--pessoal);}
.item .acts{display:flex;gap:6px;flex-shrink:0;}
.mini-btn{width:32px;height:32px;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.mini-btn:active{transform:scale(.9);}
.mini-btn svg{width:14px;height:14px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.mb-edit{background:var(--green-soft);color:var(--green-dark);} .mb-edit svg{stroke:currentColor;}
.mb-del{background:var(--danger-soft);color:var(--danger);} .mb-del svg{stroke:currentColor;}
.item-prog{display:block;padding:13px 14px;}
.item-prog .top{display:flex;align-items:center;gap:10px;}
.item-prog .pdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.item-prog .pname{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-prog .pvals{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
.item-prog .pvals b{color:var(--ink);}
.item-prog .acts{margin-left:4px;}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:12.5px;line-height:1.7;}
.empty svg{width:40px;height:40px;stroke:#bcd2cc;fill:none;stroke-width:1.5;margin-bottom:10px;stroke-linecap:round;stroke-linejoin:round;}
.empty b{color:var(--green-dark);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.chips::-webkit-scrollbar{height:0;}
.chip{flex-shrink:0;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:8px 15px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;transition:all .16s;}
.chip.on{background:linear-gradient(135deg,var(--green),var(--green-deep));border-color:var(--green-dark);color:#fff;box-shadow:0 3px 10px rgba(11,122,84,.24);}

/* ---------- POUPANÇA (página) ---------- */
.pp-hero{background:linear-gradient(140deg,#13a06f,#0a5a44);color:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-md);margin-bottom:14px;position:relative;overflow:hidden;}
.pp-hero::after{content:"";position:absolute;right:-26px;top:-26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.07);}
.pp-hero .k{font-size:10.5px;font-weight:700;color:#aee9ce;text-transform:uppercase;letter-spacing:.5px;}
.pp-hero .v{font-size:31px;font-weight:800;margin-top:5px;letter-spacing:-.5px;line-height:1;}
.pp-hero .v small{font-size:15px;font-weight:700;opacity:.82;}
.pp-hero .chips2{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;}
.pp-hero .mc{background:rgba(255,255,255,.14);border-radius:9px;padding:6px 10px;font-size:11px;font-weight:700;}
.pp-hero .mc b{color:#aef0d2;}
.fund{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;box-shadow:var(--shadow-sm);}
.fund .ft{display:flex;align-items:center;gap:15px;}
.ring{width:84px;height:84px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;}
.ring .hole{position:absolute;inset:9px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring .pct{font-size:16px;font-weight:800;color:var(--ink);line-height:1;}
.ring .pl{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px;}
.fund .fmid{flex:1;min-width:0;}
.fund .frow1{display:flex;align-items:center;gap:8px;}
.fund .fic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fund .fic svg{width:15px;height:15px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.fund .fname{flex:1;font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fund .facc{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.3px;color:var(--ink);}
.fund .facc small{font-size:12px;font-weight:700;color:var(--muted);}
.fund .fmeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;}
.fund .fmeta b{color:var(--poupanca);}
.fund .fbtns{display:flex;gap:8px;margin-top:14px;}
.fund .fb{flex:1;border:none;border-radius:11px;padding:11px;font-size:12.5px;font-weight:800;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .15s;}
.fund .fb:active{transform:scale(.97);}
.fund .fb svg{width:14px;height:14px;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.fb-dep{color:#fff;}
.fb-lev{background:var(--subtle);color:var(--ink-2);border:1.5px solid var(--line-strong);} .fb-lev svg{stroke:var(--ink-2);}
.fb-edit{background:var(--subtle);color:var(--muted);border:1.5px solid var(--line-strong);flex:0 0 46px;} .fb-edit svg{stroke:var(--muted);}
.mov{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line-soft);}
.mov:last-child{border-bottom:none;}
.mov .mdot{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mov .mdot svg{width:15px;height:15px;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.mov .mt{flex:1;min-width:0;}
.mov .mn{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mov .md{font-size:10.5px;color:var(--muted);margin-top:1px;}
.mov .mv{font-size:13.5px;font-weight:800;white-space:nowrap;}
.mov .mv.dep{color:var(--ok);} .mov .mv.lev{color:var(--danger);}

/* ---------- COMPRAS ---------- */
.compra{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;box-shadow:var(--shadow-sm);}
.compra .cbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.compra.done .cbox{background:var(--green);border-color:var(--green);}
.compra .cbox svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.compra.done .cbox svg{opacity:1;}
.compra .cname{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);}
.compra.done .cname{text-decoration:line-through;color:var(--muted-2);}

/* ---------- BOTTOM NAV ---------- */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--navglass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(20,50,40,.07);padding-bottom:env(safe-area-inset-bottom);}
.navbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);color:var(--muted);transition:color .18s;padding:0 2px;}
.navbtn .nic{width:36px;height:25px;display:flex;align-items:center;justify-content:center;border-radius:12px;transition:background .2s;}
.navbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.navbtn span{font-size:9px;font-weight:700;letter-spacing:-.1px;}
.navbtn.on{color:var(--green-dark);}
.navbtn.on .nic{background:var(--green-soft);}

/* ---------- MODAL ---------- */
.ov{position:fixed;inset:0;background:rgba(14,40,34,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);backdrop-filter:blur(2px);}
.ov.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--surface);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s var(--ease);box-shadow:0 -12px 44px rgba(10,60,46,.24);padding-bottom:env(safe-area-inset-bottom);}
.sheet.show{transform:translateY(0);}
.handle{width:42px;height:5px;border-radius:3px;background:var(--line-strong);margin:14px auto 2px;}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px 20px 16px;border-bottom:1px solid var(--line-soft);}
.sheet-head .st{flex:1;font-size:16.5px;font-weight:800;color:var(--ink);}
.sheet-head .sx{background:var(--green-soft);border:none;border-radius:50%;width:36px;height:36px;font-size:18px;color:var(--green-dark);display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.sheet-head .sx:active{transform:scale(.92);}
.sheet-body{padding:18px 20px 6px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:7px;}
.field input,.field select{width:100%;padding:14px 15px;border:1.5px solid var(--line-strong);border-radius:var(--radius-xs);font-size:15px;background:var(--input);color:var(--ink);min-height:50px;appearance:none;-webkit-appearance:none;transition:border-color .18s,box-shadow .18s,background .18s;}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c8480' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:17px;padding-right:42px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);background:var(--surface);box-shadow:0 0 0 4px rgba(14,163,113,.14);}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:6px;}
.seg{display:flex;gap:8px;}
.seg .sb{flex:1;padding:12px 8px;border:1.5px solid var(--line-strong);border-radius:var(--radius-xs);background:var(--input);font-size:12.5px;font-weight:700;color:var(--ink-2);min-height:48px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s;}
.seg .sb small{font-size:10px;font-weight:700;}
.seg .sb.on[data-g="fixa"]{background:var(--fixa);border-color:var(--fixa);color:#fff;}
.seg .sb.on[data-g="pessoal"]{background:var(--pessoal);border-color:var(--pessoal);color:#fff;}
.seg .sb.on[data-g="emerg"]{background:var(--emerg);border-color:var(--emerg);color:#fff;}
.seg .sb.on[data-g="nossa"]{background:var(--nossa);border-color:var(--nossa);color:#fff;}
.seg .sb.on[data-g="pess"]{background:var(--pess);border-color:var(--pess);color:#fff;}
.seg .sb.on[data-g="auto"],.seg .sb.on[data-g="claro"],.seg .sb.on[data-g="escuro"]{background:var(--green);border-color:var(--green);color:#fff;}
.seg .sb.on[data-g="deposito"]{background:var(--ok);border-color:var(--ok);color:#fff;}
.seg .sb.on[data-g="levantamento"]{background:var(--danger);border-color:var(--danger);color:#fff;}
.sheet-foot{display:flex;gap:10px;padding:14px 20px 20px;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-soft);}
.btn-save{flex:2;background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;border:none;border-radius:var(--radius-xs);padding:15px;font-size:14.5px;font-weight:800;min-height:50px;box-shadow:0 5px 16px rgba(11,122,84,.3);transition:transform .12s;}
.btn-save:active{transform:scale(.98);}
.btn-cancel{flex:1;background:var(--input);color:var(--muted);border:1.5px solid var(--line-strong);border-radius:var(--radius-xs);padding:15px;font-size:13.5px;font-weight:700;min-height:50px;}
.btn-danger-ghost{width:100%;background:var(--danger-soft);color:var(--danger);border:none;border-radius:var(--radius-xs);padding:13px;font-size:13px;font-weight:700;margin-top:4px;min-height:46px;}
.settings-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--input);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;}
.settings-opt svg{width:19px;height:19px;stroke:var(--green-dark);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.settings-opt .so-t{flex:1;}
.settings-opt .so-1{font-size:13.5px;font-weight:700;color:var(--ink);}
.settings-opt .so-2{font-size:11px;color:var(--muted);margin-top:1px;}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(6px);background:#0a3b32;color:#fff;padding:13px 22px;border-radius:26px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;display:flex;align-items:center;gap:9px;max-width:88vw;}
.toast.warn{background:#7a3410;}
.toast.warn svg{stroke:#ffd27a;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px;stroke:#7bf0c2;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
footer.rodape{display:flex;align-items:center;gap:12px;margin:6px 0 2px;padding:12px 14px;border-radius:18px;
  background:linear-gradient(135deg,var(--surface),var(--rf-tint));border:1px solid var(--rf-line);box-shadow:0 4px 14px rgba(16,90,70,.07);}
footer.rodape img{width:38px;height:38px;border-radius:11px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 2px 6px rgba(0,0,0,.08);flex-shrink:0;}
.rf-t{flex:1;min-width:0;line-height:1.3;}
.rf-t b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);}
.rf-t small{display:block;font-size:11px;font-weight:700;color:var(--green-dark);}
.rf-c{font-size:10.5px;font-weight:700;color:var(--muted);text-align:right;line-height:1.4;flex-shrink:0;}
@media (min-width:1000px){ footer.rodape{max-width:560px;} .page > .rodape{justify-self:center;width:100%;} }
/* ---------- PLANO: DISTRIBUIÇÃO ---------- */
.pl-hero{background:linear-gradient(135deg,#0f8a63,#0a4d3d) !important;color:#fff;border:none !important;}
.pl-hero .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:#bfeedd;}
.pl-hero .big{font-size:30px;font-weight:800;margin:2px 0 10px;line-height:1.2;}
.pl-hero .big small{font-size:14px;opacity:.8;}
.pl-stack{display:flex;height:12px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.18);}
.pl-stack b{display:block;height:100%;}
.pl-hrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.pl-hrow div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;min-width:0;}
.pl-hrow span{font-size:10px;text-transform:uppercase;font-weight:700;color:#bfeedd;display:block;}
.pl-hrow b{font-size:16px;white-space:nowrap;}
.pl-st{margin-top:12px;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pl-st.ok{background:#fff;color:#0b7a54;} .pl-st.warn{background:#fff3dd;color:#9a5c06;} .pl-st.bad{background:#ffe9e9;color:#b83232;}
.pl-st button{margin-left:auto;border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:800;background:#fff;color:#9a5c06;border:1px solid #f1d6a8;}
.al-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line-soft);}
.al-row:first-of-type{border-top:none;padding-top:0;}
.al-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al-ic svg{width:18px;height:18px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.al-nm{flex:1;min-width:0;} .al-nm b{display:block;font-size:13.5px;}
.al-nm small{font-size:11px;color:var(--muted);font-weight:600;}
.al-nm .al-resto{border:none;background:var(--green-soft);color:var(--green-dark);font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 7px;margin-left:4px;}
.aloc-inp{width:124px;border:1.5px solid var(--line-strong);border-radius:12px;padding:9px 11px;text-align:right;font-weight:800;font-size:15px;background:var(--input);color:var(--ink);}
.aloc-inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(14,163,113,.15);background:var(--surface);}
.al-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
.env{border-radius:14px;padding:10px 12px;margin-bottom:6px;}
.env .r{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);}
.env .r b{color:var(--ink);}
.env .bar{height:8px;border-radius:6px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:7px;}
.env .bar i{display:block;height:100%;border-radius:6px;}
.pf{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);}
.pf .fn{flex:1;min-width:0;}
.pf .fn > b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pf .fn small{font-size:10.5px;color:var(--muted);font-weight:600;}
.pf .mini{height:5px;border-radius:4px;background:var(--subtle);overflow:hidden;margin-top:5px;}
.pf .mini i{display:block;height:100%;border-radius:4px;}
.pf .fv{font-weight:800;font-size:13.5px;text-align:right;white-space:nowrap;}
.pf .fv small{display:block;font-size:10px;color:var(--muted);font-weight:700;}
.pf .acts{display:flex;gap:6px;flex-shrink:0;}
.pf-add{display:block;width:100%;margin-top:8px;border:1.5px dashed var(--line-strong);background:none;border-radius:12px;padding:10px;font-size:12.5px;font-weight:800;color:var(--green-dark);}
.pf-msg{font-size:11px;margin-top:8px;color:var(--muted);}
.pf-msg.bad{color:var(--danger);font-weight:700;}
.pf .cat-logo,.rank .cat-logo{width:30px;height:30px;margin:0 8px 0 0;}
.item .iname .cat-logo{width:28px;height:28px;margin:0 7px 0 0;}
.cat-logo{width:1.55em;height:1.55em;border-radius:50%;object-fit:cover;vertical-align:middle;margin:-3px 6px -2px 0;background:#fff;box-shadow:0 0 0 1px rgba(124,92,255,.25);}
.tag .cat-logo{width:1.4em;height:1.4em;margin:-2px 4px -1px -3px;}

/* ---------- POUPANÇA: GRÁFICOS DE METAS ---------- */
.goal-row{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line-soft);padding:12px 4px;border-radius:12px;transition:background .15s;}
.goal-row:first-of-type{border-top:none;}
.goal-row:hover,.goal-row:focus-visible{background:var(--subtle);}
.goal-row.on{background:var(--green-soft);}
.gr-top{display:flex;align-items:baseline;gap:8px;}
.gr-n{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gr-n i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:0;}
.gr-f{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;}
.gr-f small{font-size:10.5px;color:var(--muted);font-weight:700;margin-right:3px;}
.gr-bar{position:relative;height:12px;border-radius:7px;background:var(--line);margin:8px 0 6px;overflow:hidden;}
.gr-bar b{position:absolute;left:0;top:0;bottom:0;border-radius:7px 4px 4px 7px;background:var(--green);border-right:2px solid var(--surface);}
.gr-bar b.full{border-radius:7px;border-right:none;}
.gr-sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);font-weight:600;}
.gr-sub b{color:var(--ink-2);}
.gr-ok{color:var(--green-dark) !important;}
.evo-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.evo-chips button{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800;}
.evo-chips button.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dark);}
.evo-box{position:relative;touch-action:pan-y;}
.evo-box svg{display:block;width:100%;overflow:visible;}
.evo-box svg:focus{outline:none;}
.evo-box svg:focus-visible{outline:2.5px solid var(--green);outline-offset:3px;border-radius:8px;}
.ev-grid{stroke:var(--line);stroke-width:1;}
.ev-axis{fill:var(--muted);font-size:10.5px;font-weight:600;}
.ev-area{fill:var(--green);opacity:.13;}
.ev-line{fill:none;stroke:var(--green);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;}
.ev-proj{fill:none;stroke:var(--green);stroke-width:2.2;stroke-dasharray:6 5;opacity:.75;stroke-linecap:round;}
.ev-meta{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 4;opacity:.7;}
.ev-metat{fill:var(--ink-2);font-size:10.5px;font-weight:800;}
.ev-dot{fill:var(--green);stroke:var(--surface);stroke-width:2.5;}
.ev-goal{fill:var(--surface);stroke:var(--green);stroke-width:2.5;}
.ev-vl{stroke:var(--ink-2);stroke-width:1;opacity:.5;}
.ev-hit{fill:transparent;cursor:crosshair;}
.ctip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-md);border-radius:12px;padding:8px 11px;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;}
.ctip.show{opacity:1;}
.ctip b{display:block;font-size:15px;color:var(--ink);font-weight:800;}
.ctip .k{display:inline-block;width:14px;height:0;border-top:2.2px solid var(--green);vertical-align:3px;margin-right:5px;}
.ctip .k.d{border-top-style:dashed;}
.evo-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;}
.evo-key span{display:inline-flex;align-items:center;gap:6px;}
.evo-key i{display:inline-block;width:18px;border-top:2.2px solid var(--green);}
.evo-key i.d{border-top-style:dashed;} .evo-key i.m{border-top:1.5px dashed var(--ink-2);}
.sim{margin-top:12px;background:var(--subtle);border-radius:14px;padding:12px 13px;}
.sim-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink-2);}
.sim-h b{font-size:15px;color:var(--ink);}
.sim input[type=range]{width:100%;margin:10px 0 4px;accent-color:var(--green);height:28px;}
.sim-t{font-size:12.5px;color:var(--ink-2);line-height:1.5;}
.sim-t b{color:var(--green-dark);}
.sim-btn{margin-top:9px;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green-dark);}
.evo-tab{margin-top:10px;font-size:12px;}
.evo-tab summary{cursor:pointer;font-weight:800;color:var(--green-dark);padding:4px 0;}
.evo-tab table{width:100%;border-collapse:collapse;margin-top:6px;}
.evo-tab td,.evo-tab th{padding:5px 6px;border-bottom:1px solid var(--line-soft);text-align:left;font-size:11.5px;}
.evo-tab th{color:var(--muted);font-weight:700;} .evo-tab td.r,.evo-tab th.r{text-align:right;}
/* ---------- AVISOS DE LIMITE (receita) ---------- */
.lim{margin-top:12px;}
.lim-r{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);}
.lim-r b{color:var(--ink);}
.lim-bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px;}
.lim-bar i{display:block;height:100%;border-radius:6px;}
.lim-msg{margin-top:8px;font-size:12px;font-weight:700;border-radius:10px;padding:7px 10px;display:flex;gap:7px;align-items:center;}
.lim-msg.warn{background:var(--warn-soft);color:var(--warn-text);} .lim-msg.bad{background:var(--danger-soft);color:var(--danger);}
.aviso-modal{border-radius:14px;padding:12px 13px;margin-bottom:14px;font-size:12.5px;line-height:1.5;background:var(--danger-soft);color:var(--danger);font-weight:600;}
.aviso-modal b{font-weight:800;}
/* ---------- DISCIPLINA ---------- */
.dc-hero{display:grid;grid-template-columns:1fr;gap:12px;background:linear-gradient(140deg,#13a06f,#0a4d3d);color:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-md);margin-bottom:14px;}
.dc-hero .k{font-size:10.5px;font-weight:700;color:#aee9ce;text-transform:uppercase;letter-spacing:.5px;}
.dc-hero .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;} .dc-hero .v small{font-size:13px;font-weight:700;opacity:.85;}
.dc-bar{height:9px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:10px 0 12px;} .dc-bar i{display:block;height:100%;background:#7bf0c2;border-radius:6px;}
.dc-play{border:none;background:#fff;color:#0a5a44;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:800;max-width:100%;text-align:left;}
.dc-done{font-size:13px;font-weight:700;}
.dc-dica{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;}
.dc-dica span{font-size:11px;font-weight:800;color:#aee9ce;text-transform:uppercase;letter-spacing:.4px;} .dc-dica b{font-size:14.5px;margin-top:4px;line-height:1.4;}
@media (min-width:700px){ .dc-hero{grid-template-columns:1.2fr 1fr;} }
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.vthumb{position:relative;aspect-ratio:3/4;border:none;border-radius:16px;color:#fff;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .15s;}
.vthumb:hover{transform:translateY(-2px);} .vthumb:active{transform:scale(.97);}
.vthumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35));pointer-events:none;}

/* ---------- ECRÃ DE BLOQUEIO (PIN) ---------- */
.lock{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 600px at 50% -10%, #138a63 0%, #0a3b32 55%, #06231d 100%);color:#fff;}

  .nav-brand .nb1{font-size:15px;font-weight:800;color:var(--ink);line-height:1.1;}
  .nav-brand .nb2{font-size:12px;font-weight:700;color:var(--green-dark);}
  .navbtn{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:12px;color:var(--ink-2);}
  .navbtn .nic{width:22px;height:22px;background:none !important;border-radius:0;}
  .navbtn span{font-size:13.5px;font-weight:700;letter-spacing:0;}
  .navbtn.on{background:var(--green-soft);color:var(--green-dark);}
  .navbtn:hover:not(.on){background:var(--subtle);}
  .nav-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding:12px;border-radius:12px;background:var(--subtle);font-size:11.5px;font-weight:700;color:var(--ink-2);line-height:1.35;}
  .nav-foot small{font-weight:600;color:var(--muted);font-size:10.5px;}
  .nav-foot svg{width:20px;height:20px;stroke:var(--green-dark);fill:none;stroke-width:2;flex-shrink:0;}
  .nav-foot{align-items:flex-start;}
  .nav-foot .nf{flex:1;min-width:0;}
  .nav-foot .nf b{color:var(--ink);}
  .nav-foot button{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);color:var(--green-dark);border-radius:10px;padding:7px;font-size:11.5px;font-weight:800;}
  header.appbar,main{margin-left:var(--side-w);width:auto;}
  header.appbar{display:flex;align-items:center;gap:24px;padding:14px 32px;}
  .appbar-top{flex:1;}
  .brand-name{display:none;}
  .page-name{display:inline;}
  .hello-n{font-size:23px;}
  .mes-nav{margin-top:0;width:380px;flex-shrink:0;}
  main{padding:28px 32px 40px;}
  .page{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;}
  .page > .pagehead{display:none;}
  .toast{bottom:28px;left:calc(50% + var(--side-w) / 2);}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,90vw);max-height:86vh;border-radius:24px;
    opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.98);transition:transform .3s var(--ease),opacity .25s;}
  .sheet.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
  .sheet .handle{display:none;}
  .sheet-foot{border-radius:0 0 24px 24px;}
}
@media (min-width:1000px){
  .page{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));}
  .alert-list{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;}
  .alert-list .alert-row:nth-last-child(2):nth-child(odd){border-bottom:none;}
  .rel-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;}
  .rel-toolbar .chips{margin:0;}
  .rel-toolbar .rel-range{margin:0;}
  .rel-toolbar .rel-hint{margin:0;flex:1;min-width:180px;}
  .rel-toolbar .rel-pdf{width:auto;padding:0 20px;}
  .mov-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;}
  .page > .wide{grid-column:span 2;}
  .wide .compra-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;}
}
@media (min-width:1600px){ .page{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));} }
</style>
</head>
<body>
<!-- ===== Ecrã de abertura: logotipo + anel circular até 100% ===== -->
<style>
#splash{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(700px 500px at 50% 30%,#13895f 0%,#0b4d3c 55%,#06231d 100%);color:#fff;transition:opacity .45s ease,visibility .45s;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
#splash.fim{opacity:0;visibility:hidden;}
.sp-anel{position:relative;width:176px;height:176px;}
.sp-anel svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.sp-trilho{fill:none;stroke:rgba(255,255,255,.14);stroke-width:7;}
.sp-prog{fill:none;stroke:url(#spGrad);stroke-width:7;stroke-linecap:round;stroke-dasharray:515.2;stroke-dashoffset:515.2;filter:drop-shadow(0 0 6px rgba(123,240,194,.55));}
.sp-gira{position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent;border-top-color:rgba(255,255,255,.35);animation:spGira 1.1s linear infinite;}
.sp-logo{position:absolute;inset:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 34px rgba(0,0,0,.35),inset 0 -4px 10px rgba(15,107,78,.08);animation:spPulsa 1.6s ease-in-out infinite;}
.sp-logo img{width:56%;height:auto;display:block;}
.sp-pct{margin-top:22px;font-size:30px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.sp-nome{margin-top:6px;font-size:19px;font-weight:800;letter-spacing:.2px;text-align:center;line-height:1.35;}
.sp-frase{margin-top:4px;font-size:12.5px;font-weight:700;color:#ffd27a;letter-spacing:.3px;}
.sp-estado{position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));font-size:11.5px;font-weight:600;color:#9fd8c2;}
@keyframes spGira{to{transform:rotate(360deg);}}
@keyframes spPulsa{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
@media (prefers-reduced-motion:reduce){ .sp-gira,.sp-logo{animation:none;} }
</style>

<script>
/* Anel de progresso da abertura: avança até ao "alvo" que a app vai indicando e fecha em 100% */
(function(){
  var C=515.2, atual=0, alvo=30, t0=Date.now(), MIN=1400, fechado=false;
  var prog=document.getElementById("spProg"), pct=document.getElementById("spPct"), est=document.getElementById("spEstado");
  var reduzido=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.__splash=function(v){ alvo=Math.max(alvo,Math.min(100,v)); };
  if(navigator.webdriver){ var s0=document.getElementById("splash"); if(s0) s0.remove(); fechado=true; return; } // testes automáticos: sem animação
  function passo(){
    if(fechado) return;
    var tempo=Date.now()-t0, e=Math.min(1,tempo/MIN), suave=1-Math.pow(1-e,2.2);   // enche suavemente em ~1,4 s
    var limite=Math.min(alvo, reduzido?100:100*suave);                               // e nunca passa do que a app já preparou
    atual+= (limite-atual)*(reduzido?1:0.35);
    if(atual>limite) atual=limite;
    prog.style.strokeDashoffset=(C*(1-atual/100)).toFixed(1); pct.textContent=Math.round(atual)+"%";
    est.textContent = atual<35?"A preparar…":atual<70?"A carregar os seus dados…":atual<99?"Quase pronto…":"Pronto";
    if(alvo>=100 && atual>=99.6 && tempo>=MIN){ pct.textContent="100%"; prog.style.strokeDashoffset="0"; fechado=true;
      setTimeout(function(){ var s=document.getElementById("splash"); if(s){ s.classList.add("fim"); setTimeout(function(){ s.remove(); },500); } },220); return; }
    requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
  setTimeout(function(){ window.__splash(100); },6000);   // segurança: nunca fica preso
})();
</script>

function orcamentoDefault(){
  var f=["Despesa de casa","Transporte","Água e luz","Imprevistos de casa","Ajudar outros"], p=["Alimentação","Internet / Saldo","Vestimenta","Formação","Prazer / Lazer"];
  return f.map(function(n){ return {id:uid(),nome:n,grupo:"fixa",valor:0}; }).concat(p.map(function(n){ return {id:uid(),nome:n,grupo:"pessoal",valor:0}; }));
}
function fundosDefault(){
  return [
    {id:uid(), nome:"Reserva de Emergência", tipo:"emerg", meta:0, planoMensal:0},
    {id:uid(), nome:"Nossa Poupança",        tipo:"nossa", meta:0, planoMensal:0},
    {id:uid(), nome:"Poupança Pessoal",      tipo:"pess",  meta:0, planoMensal:0}
  ];
}
function comprasDefault(){ return {prioridade:[],longo:[],medio:[],curto:[]}; }
function estadoInicial(){
  var m=mesHoje(), o={};
  o[m]={ receitas:[], orcamento:orcamentoDefault(), transacoes:[], aloc:{fixa:0,pessoal:0,poupanca:0} };
  return { moeda:"Kz", tema:"auto", meses:o, fundos:fundosDefault(), movPoupanca:[], compras:comprasDefault() };
}
function carregar(){
  try{ var raw=localStorage.getItem(LS_KEY); if(raw) state=JSON.parse(raw); }catch(e){}
  if(!state || !state.meses){ state=estadoInicial(); return; }
  delete state.gdrive;
  if(!state.moeda) state.moeda="Kz";
  if(!state.compras) state.compras=comprasDefault();
  Object.keys(state.meses||{}).forEach(function(k){ garantirAjudar(state.meses[k]); });
  if(!state.movPoupanca) state.movPoupanca=[];
  if(!state.fundos){ // migração: cria fundos e retira "poupança" do orçamento mensal
    state.fundos=fundosDefault();
    Object.keys(state.meses).forEach(function(ym){ var mm=state.meses[ym]; if(mm.orcamento) mm.orcamento=mm.orcamento.filter(function(o){return o.grupo!=="poupanca";}); });
    salvar();
  }
}
function salvar(){ state.savedAt=Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ toast("Aviso: localStorage cheio — guardado no IndexedDB."); } idbPut(state); if(typeof agendarBackupAuto==="function") agendarBackupAuto(); }

/* ---------- IndexedDB (cópia de segurança redundante) ---------- */
var IDB_NAME="financasDB", IDB_STORE="estado";
function idbOpen(){ return new Promise(function(res,rej){ try{ var r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=function(){ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} };
  r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }catch(e){ rej(e); } }); }
function idbGet(){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ try{ var tx=db.transaction([IDB_STORE],"readonly"); var rq=tx.objectStore(IDB_STORE).get("state"); rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){rej(rq.error);}; }catch(e){ res(null); } }); }); }
function idbPut(obj){ try{ idbOpen().then(function(db){ try{ var tx=db.transaction([IDB_STORE],"readwrite"); tx.objectStore(IDB_STORE).put(obj,"state"); }catch(e){} }).catch(function(){}); }catch(e){} }
function reconcileIDB(){
  idbGet().then(function(idbState){
    if(idbState && (idbState.savedAt||0) > (state.savedAt||0)){
      state=idbState;
      if(!state.moeda) state.moeda="Kz";
      if(!state.fundos) state.fundos=fundosDefault();
      if(!state.movPoupanca) state.movPoupanca=[];
      normalizarEstado(state);
      try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} // repõe a 2.ª cópia
      aplicarTema(); if(state.pin && !unlocked) mostrarLock(); render();
    } else {
      idbPut(state); // espelha o localStorage no IndexedDB
    }
  }).catch(function(){});
}
function ultimoMes(){ var ks=Object.keys(state.meses).sort(); return ks.length?ks[ks.length-1]:null; }
function garantirMes(ym){
  if(state.meses[ym]) return state.meses[ym];
  var base=ultimoMes(), novo={receitas:[],orcamento:[],transacoes:[]};
  if(base && state.meses[base]){
    novo.receitas=state.meses[base].receitas.map(function(r){return {id:uid(),nome:r.nome,valor:r.valor};});
    novo.orcamento=state.meses[base].orcamento.map(function(o){return {id:uid(),nome:o.nome,grupo:o.grupo,valor:o.valor};});
    if(state.meses[base].aloc) novo.aloc=JSON.parse(JSON.stringify(state.meses[base].aloc));
  } else { novo.receitas=[]; novo.orcamento=orcamentoDefault(); novo.aloc={fixa:0,pessoal:0,poupanca:0}; }
  garantirAjudar(novo); state.meses[ym]=novo; salvar(); return novo;
}
function M(){ return garantirMes(mesAtual); }

/* ---------- cálculos ---------- */
function totReceita(){ return M().receitas.reduce(function(a,r){return a+(Number(r.valor)||0);},0); }
function planoPoupMensal(){ return state.fundos.reduce(function(a,f){return a+(Number(f.planoMensal)||0);},0); }
function totPlaneado(){ return M().orcamento.reduce(function(a,o){return a+(Number(o.valor)||0);},0) + planoPoupMensal(); }
function totGasto(){ return M().transacoes.reduce(function(a,t){return a+(Number(t.valor)||0);},0); }
function planeadoGrupo(g){ if(g==="poupanca") return planoPoupMensal(); return M().orcamento.filter(function(o){return o.grupo===g;}).reduce(function(a,o){return a+(Number(o.valor)||0);},0); }
function gastoGrupo(g){ return M().transacoes.filter(function(t){return t.grupo===g;}).reduce(function(a,t){return a+(Number(t.valor)||0);},0); }
function gastoItem(itemId){ return M().transacoes.filter(function(t){return t.itemId===itemId;}).reduce(function(a,t){return a+(Number(t.valor)||0);},0); }
function saldoFundo(id){ return state.movPoupanca.filter(function(m){return m.fundoId===id;}).reduce(function(a,m){return a+(m.tipo==="levantamento"?-1:1)*(Number(m.valor)||0);},0); }
function totalPoupado(){ return state.fundos.reduce(function(a,f){return a+saldoFundo(f.id);},0); }
function metaTotal(){ return state.fundos.reduce(function(a,f){return a+(Number(f.meta)||0);},0); }
function poupadoMesFundo(id){ return state.movPoupanca.filter(function(m){return m.fundoId===id && (m.data||"").slice(0,7)===mesAtual;}).reduce(function(a,m){return a+(m.tipo==="levantamento"?-1:1)*(Number(m.valor)||0);},0); }
function poupadoMes(){ return state.fundos.reduce(function(a,f){return a+poupadoMesFundo(f.id);},0); }
/* distribuição da receita pelas 3 categorias (por mês) */
var ALOC_IDS=["fixa","pessoal","poupanca"];
function aloc(){ var m=M(); if(!m.aloc){ m.aloc={}; ALOC_IDS.forEach(function(g){ m.aloc[g]=planeadoGrupo(g); }); } return m.aloc; }
function alocTotal(){ var a=aloc(); return ALOC_IDS.reduce(function(s,g){ return s+(Number(a[g])||0); },0); }
function porDistribuir(){ return totReceita()-alocTotal(); }
function livreGrupo(g){ return (Number(aloc()[g])||0)-planeadoGrupo(g); }
function setAloc(g,v){ var a=aloc(); v=Math.max(0,Math.round(Number(v)||0));
  var max=Math.max(0,totReceita()-(alocTotal()-(Number(a[g])||0))), cortou=false;
  if(v>max){ v=max; cortou=true; }
  a[g]=v; salvar(); renderPlano();
  if(cortou) toast("Só há "+fmt(max)+" disponíveis para "+grupoDe(g).nome+".");
  else if(planeadoGrupo(g)>v) toast("Atenção: os campos de "+grupoDe(g).nome+" passam este valor.");
}
function avisoGrupo(g){ var l=livreGrupo(g); if(l<0) setTimeout(function(){ toast("Atenção: "+grupoDe(g).nome+" passa o valor atribuído em "+fmt(-l)+"."); },900); }
function textoBackup(){ var lb=ultimoBackupTs(); if(!lb) return "nunca"; var d=Math.floor((Date.now()-lb)/86400000); return d<=0?"hoje":(d===1?"ontem":"há "+d+" dias"); }
function navFoot(){ var el=document.getElementById("navFoot"); if(!el) return; el.style.display="none"; return;
  el.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><div class="nf">Último backup: <b>'+textoBackup()+'</b><br><small>Guarde uma cópia de vez em quando</small><button data-act="export">Exportar backup</button></div>'; }

function ringHtml(pct, cor, soft, labelTop){
  var deg=Math.max(0,Math.min(100,pct))/100*360;

}

function renderInicio(){
  var rec=totReceita(), plan=totPlaneado(), gasto=totGasto(), poup=poupadoMes();
  var apM=aportesYm(mesAtual);
  var disp=rec-gasto-poup-apM, dist=rec-plan, comprometido=gasto+poup+apM;
  var pctC = rec>0?Math.min(100,Math.round(comprometido/rec*100)):0;
  var segs="", acc=0, totalG=0;

var busca=null, buscaAberta=false;
function semAcento(x){ return String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function todasTransacoes(){ var out=[]; Object.keys(state.meses).forEach(function(ym){ (state.meses[ym].transacoes||[]).forEach(function(t){ out.push(Object.assign({_ym:ym},t)); }); }); return out; }
function categoriasUsadas(){ var c={}; todasTransacoes().forEach(function(t){ c[t.catNome||"Outros"]=1; }); Object.keys(state.meses).forEach(function(ym){ (state.meses[ym].orcamento||[]).forEach(function(o){ c[o.nome]=1; }); }); return Object.keys(c).sort(function(a,b){ return a.localeCompare(b,"pt"); }); }
function filtrarBusca(lista,b){
  var txt=semAcento(b.txt);
  return lista.filter(function(t){
    if(b.de && (t.data||"")<b.de) return false;
    if(b.ate && (t.data||"")>b.ate) return false;
    if(b.cat && (t.catNome||"Outros")!==b.cat) return false;
    if(txt && semAcento((t.descricao||"")+" "+(t.catNome||"")).indexOf(txt)===-1) return false;
    return true; });
}
function fimMes(ym){ var p=ym.split("-"), d=new Date(+p[0],+p[1],0); return ym+"-"+String(d.getDate()).padStart(2,"0"); }

    (disp>0?'Fica a faltar <b>'+fmt(valor-disp)+'</b>.':'Já não há dinheiro disponível este mês.')+' Toque outra vez para registar mesmo assim.';

function falar(c){ if(!VP || !VP.voz) return;

function tickVideo(ts){ if(!VP) return; if(!VP.last) VP.last=ts; var dt=ts-VP.last; VP.last=ts;

/* ================== PROJETOS (Prioridade · Longo · Médio · Curto prazo) ================== */
var LISTAS_PROJ=[
  {id:"prioridade",nome:"Prioridade",cor:"#e0712a",soft:"var(--prio-soft)",ic:"⭐"},
  {id:"longo",nome:"Longo prazo",cor:"#3b74e8",soft:"var(--fixa-soft)",ic:"🏔️"},
  {id:"medio",nome:"Médio prazo",cor:"#7c5cff",soft:"var(--nossa-soft)",ic:"🚶"},
  {id:"curto",nome:"Curto prazo",cor:"#12a37a",soft:"var(--poupanca-soft)",ic:"🏃"}];
function listaProj(id){ return LISTAS_PROJ.filter(function(l){return l.id===id;})[0]||LISTAS_PROJ[0]; }
function garantirProjetos(){ var c=state.compras=state.compras||{}; LISTAS_PROJ.forEach(function(l){ if(!c[l.id]) c[l.id]=[]; c[l.id].forEach(function(p){ if(!p.aportes) p.aportes=[]; if(p.valor==null) p.valor=0; if(p.prazo==null) p.prazo=""; }); }); return c; }
function todosProjetos(){ var c=garantirProjetos(), r=[]; LISTAS_PROJ.forEach(function(l){ c[l.id].forEach(function(p){ r.push({p:p,l:l.id}); }); }); return r; }
function acharProj(id){ var r=todosProjetos().filter(function(x){return x.p.id===id;})[0]; return r||null; }
function juntadoProj(p){ return (p.aportes||[]).reduce(function(a,x){return a+(Number(x.valor)||0);},0); }
function aportesYm(ym){ return todosProjetos().reduce(function(a,x){ return a+(x.p.aportes||[]).reduce(function(b,ap){ return (ap.data||"").slice(0,7)===ym?b+(Number(ap.valor)||0):b; },0); },0); }
function mesesAte(prazo){ if(!prazo) return null; var h=mesHoje(); var a=+h.slice(0,4), m=+h.slice(5,7), pa=+prazo.slice(0,4), pm=+prazo.slice(5,7); return (pa-a)*12+(pm-m)+1; } // inclui o mês atual
function ritmoProj(p){ // média dos últimos 3 meses (inclui o atual)
  var h=mesHoje(), t=0; for(var i=0;i<3;i++){ var ym=desloca(h,-i); t+=(p.aportes||[]).reduce(function(a,x){return (x.data||"").slice(0,7)===ym?a+(Number(x.valor)||0):a;},0); } return Math.round(t/3); }
function analiseProj(p){
  var meta=Number(p.valor)||0, junt=juntadoProj(p), falta=Math.max(0,meta-junt), n=mesesAte(p.prazo), pct=meta>0?Math.min(100,junt/meta*100):0;
  var porMes=(falta>0 && n!=null)?(n>0?Math.ceil(falta/n):falta):0, ritmo=ritmoProj(p), estimado=null;
  if(falta>0 && ritmo>0){ estimado=desloca(mesHoje(),Math.ceil(falta/ritmo)); }
  var esteMes=(p.aportes||[]).reduce(function(a,x){return (x.data||"").slice(0,7)===mesHoje()?a+(Number(x.valor)||0):a;},0);
  return {meta:meta,junt:junt,falta:falta,n:n,pct:pct,porMes:porMes,ritmo:ritmo,estimado:estimado,esteMes:esteMes,atrasado:n!=null&&n<=0&&falta>0};
}
function ajudaProjHTML(p,a){
  var dispo=Math.max(0,disponivelYm(mesHoje())), out='<div class="pj-help"><div class="pj-hh">🧭 Como alcançar</div><ul>';
  if(p.feito){ return '<div class="pj-help ok">🎉 Projeto concluído. Parabéns pela disciplina!</div>'; }
  if(a.meta<=0){ out+='<li>Defina o <b>valor</b> do projeto para eu calcular quanto falta.</li>'; return out+'</ul><button class="pj-hb" data-act="proj-edit" data-id="'+p.id+'">Definir valor e prazo</button></div>'; }
  if(a.falta<=0){ return '<div class="pj-help ok">✓ Já juntou o valor todo ('+fmt(a.meta)+'). Quando realizar o projeto, marque-o como concluído.<button class="pj-hb" data-act="proj-toggle" data-id="'+p.id+'">Marcar como concluído</button></div>'; }
  if(!p.prazo) out+='<li>Faltam <b>'+fmt(a.falta)+'</b>. Defina um <b>prazo</b> para eu calcular quanto juntar por mês.</li>';
  else if(a.atrasado) out+='<li class="bad">O prazo ('+mesLabel(p.prazo)+') já passou e faltam <b>'+fmt(a.falta)+'</b>. Defina um novo prazo realista.</li>';
  else {
    out+='<li>Para chegar a <b>'+mesLabel(p.prazo)+'</b>, junte <b>'+fmt(a.porMes)+' por mês</b> durante '+a.n+(a.n===1?' mês':' meses')+'.</li>';
    if(a.esteMes>=a.porMes) out+='<li class="ok">✓ Este mês já juntou o necessário. Continue assim no próximo mês.</li>';
    else if(a.ritmo>=a.porMes && a.ritmo>0) out+='<li class="ok">✓ Está no bom caminho: tem juntado em média '+fmt(a.ritmo)+' por mês.</li>';
    else if(a.ritmo>0) out+='<li class="warn">Ao ritmo atual ('+fmt(a.ritmo)+'/mês) chega só em <b>'+mesLabel(a.estimado)+'</b>. Aumente para '+fmt(a.porMes)+'/mês.</li>';
    else out+='<li class="warn">Ainda não adicionou dinheiro nos últimos 3 meses.</li>';
  }
  var sugerido=Math.min(dispo, a.porMes>0?Math.max(0,a.porMes-a.esteMes):a.falta, a.falta);
  if(a.esteMes>0) out+='<li>Este mês já adicionou <b>'+fmt(a.esteMes)+'</b>.</li>';
  if(dispo>0) out+='<li>Ainda tem <b>'+fmt(dispo)+'</b> disponível da receita de '+MESES[(+mesHoje().slice(5,7))-1]+'.</li>';
  else out+='<li class="bad">Este mês já não há dinheiro disponível da receita.</li>';
  out+='</ul><div class="pj-hbs">';
  if(sugerido>0) out+='<button class="pj-hb" data-act="proj-aporte" data-id="'+p.id+'" data-v="'+sugerido+'">+ Adicionar '+fmt(sugerido)+' agora</button>';
  if(a.porMes>0) out+='<button class="pj-hb sec" data-act="proj-plano" data-id="'+p.id+'">Pôr '+fmt(a.porMes)+' no plano do mês</button>';
  return out+'</div></div>';
}

function agPeriodo(p){ var d=agDia||hojeAg(), y=+d.slice(0,4), m=+d.slice(5,7), ini, fim, nome;
  if(p==="dia"){ ini=fim=d; nome=dataBonita(d).replace(/^(Hoje|Amanhã|Ontem), /,""); nome=nome.charAt(0).toUpperCase()+nome.slice(1); }
  else if(p==="semana"){ ini=inicioSemana(d); fim=dSoma(ini,6); nome="Semana de "+(+ini.slice(8))+"/"+ini.slice(5,7)+" a "+(+fim.slice(8))+"/"+fim.slice(5,7); }
  else if(p==="mes"){ ini=d.slice(0,8)+"01"; fim=isoDe(new Date(y,m,0,12)); nome=MESES[m-1]+" de "+y; }
  else if(p==="trimestre"){ var q=Math.floor((m-1)/3); ini=y+"-"+String(q*3+1).padStart(2,"0")+"-01"; fim=isoDe(new Date(y,q*3+3,0,12)); nome=(q+1)+".º Trimestre de "+y; }
  else { ini=y+"-01-01"; fim=y+"-12-31"; nome="Ano "+y; }
  return {ini:ini,fim:fim,nome:nome,p:p}; }
function agDados(p){ var per=agPeriodo(p), h0=hojeAg(), r={per:per,dias:[],total:0,feitas:0,pend:0,agend:0,prior:{alta:[0,0],media:[0,0],baixa:[0,0]},itens:[]};
  for(var d=per.ini; d<=per.fim; d=dSoma(d,1)){ var ls=tarefasDoDia(d), f=0;
    ls=ls.filter(function(t){ return !(t.diaria && d>h0); }); // repetições diárias futuras não contam
    ls.forEach(function(t){ var ok=feita(t,d); r.total++; if(ok){ r.feitas++; f++; } else if(d<=h0) r.pend++; else r.agend++;
      var pp=r.prior[t.prioridade]||r.prior.media; pp[0]++; if(ok) pp[1]++;
      r.itens.push({d:d,t:t,ok:ok}); });
    r.dias.push({d:d,total:ls.length,feitas:f}); }
  r.pct=r.total?Math.round(r.feitas/r.total*100):0; return r; }

function icsTxt(v){ return String(v||"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }

function agCalendarioICS(){
  var h0=hojeAg(), ag=new Date(), st=ag.getUTCFullYear()+String(ag.getUTCMonth()+1).padStart(2,"0")+String(ag.getUTCDate()).padStart(2,"0")+"T"+String(ag.getUTCHours()).padStart(2,"0")+String(ag.getUTCMinutes()).padStart(2,"0")+"00Z";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Organizacao Pessoal e Financeira//Agenda//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH"], n=0;
  agEstado().tarefas.forEach(function(t){
    if(!t.hora) return;
    var ini=t.diaria?(t.data>h0?t.data:h0):t.data; if(!t.diaria && (t.data<h0 || feita(t,t.data))) return;
    L.push("BEGIN:VEVENT","UID:"+t.id+"@organizacao-pf","DTSTAMP:"+st,"DTSTART:"+icsData(ini,t.hora),"DURATION:PT30M","SUMMARY:"+icsTxt((t.tipo==="evento"?"📌 ":"")+t.titulo),

function momentoAviso(t,iso){ if(!t.hora || t.lembrete==null) return null; var p=t.hora.split(":"), d=dPar(iso); d.setHours(+p[0],+p[1],0,0); return d.getTime()-(+t.lembrete)*60000; }
function verificarAvisos(){
  if(!state || !state.agenda || !unlocked || document.getElementById("agAlarme")) return;
  var agoraMs=agora().getTime(), lidos=agAvisosLidos(), h0=hojeAg();
  [dSoma(h0,-1),h0].forEach(function(d){ tarefasDoDia(d).forEach(function(t){
    if(feita(t,d)) return; var m=momentoAviso(t,d), k=t.id+"|"+d; if(m==null) return;
    var alvo=lidos["a|"+k]||(lidos[k]?null:m); if(alvo==null) return;
    if(agoraMs>=alvo && agoraMs-alvo<3*3600000 && !document.getElementById("agAlarme")) mostrarAlarme(t,d);
  }); });
}
function mostrarAlarme(t,d){
  var lidos=agAvisosLidos(), k=t.id+"|"+d; lidos[k]=Date.now(); delete lidos["a|"+k]; agGuardarLidos(lidos);
  if(!ANDROID) tocarSom();
  try{ if(!ANDROID && "Notification" in window && Notification.permission==="granted") new Notification("🔔 "+t.titulo,{body:(t.hora?"Às "+t.hora+" · ":"")+"prioridade "+PRIOR[t.prioridade].n,icon:LOGO,tag:k}); }catch(e){}
  var el=document.createElement("div"); el.id="agAlarme"; el.className="ag-alarme";
  el.innerHTML='<div class="ag-al"><div class="ag-bell">🔔</div><h3>'+esc(t.titulo)+'</h3><p>'+(d===hojeAg()?"Hoje":"Ontem")+(t.hora?" às "+t.hora:"")+' · prioridade '+PRIOR[t.prioridade].n+'</p>'+
    '<button class="ag-btn1" data-act="al-feito" data-id="'+t.id+'" data-d="'+d+'">✓ Marcar como feita</button><button class="ag-btn2" data-act="al-adiar" data-id="'+t.id+'" data-d="'+d+'">Lembrar daqui a 10 min</button><button class="ag-btn3" data-act="al-fechar">Fechar</button></div>';
  document.body.appendChild(el);
}

function agendarAvisosNativos(){
  if(!ANDROID || !AndroidApp.agendarLembretes || !state || !state.agenda) return;
  var lista=[], h0=hojeAg(), agoraMs=agora().getTime(), lidos=agAvisosLidos();
  for(var i=0;i<7;i++){ var d=dSoma(h0,i); tarefasDoDia(d).forEach(function(t){ if(feita(t,d)) return; var k=t.id+"|"+d, m=lidos["a|"+k]||momentoAviso(t,d); if(m==null || m<agoraMs-60000) return;
    lista.push({id:k,quando:m,titulo:"🔔 "+t.titulo,texto:(t.hora?"Às "+t.hora+" · ":"")+"prioridade "+PRIOR[t.prioridade].n}); }); }
  lista.sort(function(a,b){return a.quando-b.quando;}); try{ AndroidApp.agendarLembretes(JSON.stringify(lista.slice(0,60))); }catch(e){}
}

function metaInfo(f,saldo){
  var meta=Number(f.meta)||0, plano=Number(f.planoMensal)||0;
  if(meta<=0) return '';
  if(saldo>=meta) return '<div class="fgoal ok">Meta atingida! 🎉</div>';
  var falta=meta-saldo;
  if(plano<=0) return '<div class="fgoal">Faltam '+fmt(falta)+' · defina um plano mensal</div>';
  var n=Math.ceil(falta/plano), alvo=desloca(mesAtual,n);
  return '<div class="fgoal">Faltam '+fmt(falta)+' · ~'+n+(n>1?' meses':' mês')+' (até '+mesCurto(alvo)+')</div>';
}

/* ================== RELATÓRIOS (mês / trimestre / semestre / ano) ================== */
var PERIODOS=[["mes","Mensal",1],["tri","Trimestral",3],["sem","Semestral",6],["ano","Anual",12],["per","Personalizado",0]];
function nPeriodo(){ var p=PERIODOS.filter(function(x){return x[0]===relPeriodo;})[0]; return p?p[2]:1; }
function mesesEntre(a,b){ if(a>b){ var t=a; a=b; b=t; } var r=[], m=a, g=0; while(m<=b && g<120){ r.push(m); m=desloca(m,1); g++; } return r; }
function mesesPeriodo(){
  if(relPeriodo==="per"){ var de=relDe||desloca(mesAtual,-2), ate=relAte||mesAtual; return mesesEntre(de,ate); }
  var n=nPeriodo(); if(n===1) return [mesAtual];
  if(relModo==="cal"){ // períodos do calendário: trimestre / semestre / ano civil que contém o mês escolhido
    var y=+mesAtual.split("-")[0], m=+mesAtual.split("-")[1], ini=Math.floor((m-1)/n)*n+1;
    return mesesEntre(y+"-"+String(ini).padStart(2,"0"), y+"-"+String(ini+n-1).padStart(2,"0"));
  }
  var a=[]; for(var i=n-1;i>=0;i--) a.push(desloca(mesAtual,-i)); return a;
}
function nomePeriodo(){ // nome curto (para títulos)
  var y=mesAtual.split("-")[0], m=+mesAtual.split("-")[1];
  if(relPeriodo==="mes") return "Mensal — "+mesLabel(mesAtual);
  if(relPeriodo==="per") return "Personalizado";
  var n=nPeriodo();
  if(relModo!=="cal") return "Últimos "+n+" meses";
  if(n===3) return Math.floor((m-1)/3)+1+".º Trimestre de "+y;
  if(n===6) return (m<=6?"1.º":"2.º")+" Semestre de "+y;
  return "Anual — "+y;
}
function slugPeriodo(){ return nomePeriodo().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""); }
function mesCurto(ym){ var p=ym.split("-"); return MESES[(+p[1])-1].slice(0,3)+" "+p[0]; }
function periodoLabel(ms){ return ms.length===1 ? mesLabel(ms[0]) : mesCurto(ms[0])+" — "+mesCurto(ms[ms.length-1]); }
function soma(arr,f){ return arr.reduce(function(a,x){return a+(Number(f?f(x):x)||0);},0); }

function relDados(){
  var ms=mesesPeriodo(), r={ms:ms,receita:0,gasto:0,dep:0,lev:0,cat:{},catGrupo:{},fontes:{},grp:{fixa:0,pessoal:0},
    plan:{fixa:0,pessoal:0,poupanca:0},fundo:{},evo:[],nTrans:0,mesesComDados:0};
  ms.forEach(function(ym){
    var m=state.meses[ym], rec=0, gas=0;
    if(m){
      r.mesesComDados++;
      m.receitas.forEach(function(x){ var v=Number(x.valor)||0; rec+=v; r.fontes[x.nome]=(r.fontes[x.nome]||0)+v; });
      m.orcamento.forEach(function(o){ if(r.plan[o.grupo]!=null) r.plan[o.grupo]+=Number(o.valor)||0; });
      r.plan.poupanca+=planoPoupMensal();
      m.transacoes.forEach(function(t){ var v=Number(t.valor)||0, k=t.catNome||"Outros"; gas+=v; r.nTrans++;
        r.cat[k]=(r.cat[k]||0)+v; r.catGrupo[k]=t.grupo; if(r.grp[t.grupo]!=null) r.grp[t.grupo]+=v; });
    }
    var dep=0, lev=0;
    state.movPoupanca.forEach(function(mv){ if((mv.data||"").slice(0,7)!==ym) return; var v=Number(mv.valor)||0;
      if(mv.tipo==="levantamento"){ lev+=v; r.fundo[mv.fundoId]=(r.fundo[mv.fundoId]||0)-v; }
      else { dep+=v; r.fundo[mv.fundoId]=(r.fundo[mv.fundoId]||0)+v; } });
    var prj=aportesYm(ym);
    r.receita+=rec; r.gasto+=gas; r.dep+=dep; r.lev+=lev; r.proj=(r.proj||0)+prj;
    r.evo.push({ym:ym,receita:rec,gasto:gas,poup:dep-lev,proj:prj,temDados:!!m});
  });
  r.poup=r.dep-r.lev;
  r.entradas=r.receita+r.lev;          // dinheiro que entrou (receitas + levantamentos da poupança)
  r.proj=r.proj||0;
  r.saidas=r.gasto+r.dep+r.proj;       // dinheiro que saiu (gastos + depósitos na poupança + dinheiro posto nos projetos)
  r.sobra=r.entradas-r.saidas;
  r.catArr=Object.keys(r.cat).map(function(k){return {nome:k,valor:r.cat[k],grupo:r.catGrupo[k]};}).sort(function(a,b){return b.valor-a.valor;});
  r.fontesArr=Object.keys(r.fontes).map(function(k){return {nome:k,valor:r.fontes[k]};}).sort(function(a,b){return b.valor-a.valor;});
  r.fundoArr=state.fundos.map(function(f){return {nome:f.nome,tipo:f.tipo,valor:r.fundo[f.id]||0,saldo:saldoFundo(f.id)};}).sort(function(a,b){return b.valor-a.valor;});
  r.planTotal=r.plan.fixa+r.plan.pessoal+r.plan.poupanca;
  var comG=r.evo.filter(function(e){return e.temDados;});
  r.mediaGasto = comG.length ? r.gasto/comG.length : 0;
  r.mesMaisGasto = comG.slice().sort(function(a,b){return b.gasto-a.gasto;})[0] || null;
  r.mesMaisPoup  = comG.slice().sort(function(a,b){return b.poup-a.poup;})[0] || null;
  return r;
}

function rankRow(i,nome,valor,total,max,cor,soft,extra){
  var pc=total>0?Math.round(valor/total*100):0, w=max>0?Math.max(2,Math.round(valor/max*100)):0;
  return '<div class="rank"><div class="rh"><div class="rn"><span class="rr" style="background:'+soft+';color:'+cor+'">'+i+'</span><span class="t">'+nomeCat(nome)+'</span></div>'+
    '<div class="rv">'+fmtNum(valor)+'<small>'+(extra!=null?extra:pc+'%')+'</small></div></div>'+
    '<div class="tr"><div class="f" style="width:'+w+'%;background:'+cor+'"></div></div></div>';
}

      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0; }

function hashPin(pin,salt){ var h=salt+":"+pin; for(var i=0;i<1000;i++) h=sha256(h+":"+salt); return h; }
function novoSalt(){ var s=""; for(var i=0;i<16;i++) s+=Math.floor(Math.random()*16).toString(16); return s; }
function pinOk(pin){ return !!state.pin && hashPin(pin,state.pin.salt)===state.pin.hash; }

function pinSettingsHTML(){
  if(state.pin) return '<div class="status-line ok">PIN ativo — a app pede o código ao abrir e após 1 minuto em segundo plano.</div>'+
    opt("pin-change","Alterar PIN","Muda o código de acesso",ICO.lock)+opt("pin-off","Desativar PIN","Deixa de pedir código",ICO.unlock);
  return '<div class="status-line">Sem PIN — quem tiver o teu telemóvel desbloqueado consegue abrir a app.</div>'+
    opt("pin-set","Ativar PIN","Código de 6 números",ICO.lock);
}
function campoPin(id,label){ return '<div class="field"><label>'+label+'</label><input type="password" id="'+id+'" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••" style="letter-spacing:6px;font-size:20px"></div>'; }
function modalPin(modo){ // set | change | off
  var b='';
  if(modo!=="set") b+=campoPin("f_pinAtual","PIN atual");
  if(modo!=="off") b+=campoPin("f_pin1","Novo PIN (6 números)")+campoPin("f_pin2","Repetir novo PIN")+
     '<div class="field"><label>Dica para lembrar (opcional)</label><input type="text" id="f_pinDica" maxlength="60" placeholder="Ex.: data especial" value="'+esc(state.pin&&state.pin.hint||"")+'"></div>'+
     '<div class="hint-box">Se esqueceres o PIN, só voltas a entrar com um <b>backup exportado</b>. O PIN não vai dentro dos backups.</div>';
  var tit = modo==="set"?"Ativar PIN":modo==="change"?"Alterar PIN":"Desativar PIN";
  abrirSheet(tit, b, '<button class="btn-cancel" data-act="modal-close">Cancelar</button><button class="btn-save" data-act="modal-save">'+(modo==="off"?"Desativar":"Guardar PIN")+'</button>');
  setTimeout(function(){ var f=document.querySelector("#sheetBody input"); if(f) f.focus(); },350);
  modalSave=function(){
    if(modo!=="set" && !pinOk(val("f_pinAtual"))){ toast("PIN atual errado."); return; }
    if(modo==="off"){ delete state.pin; salvar(); fecharSheet(); render(); toast("PIN desativado."); return; }
    var p1=val("f_pin1"), p2=val("f_pin2");
    if(!/^[0-9]{6}$/.test(p1)){ toast("O PIN deve ter exatamente 6 números."); return; }
    if(p1!==p2){ toast("Os dois PIN não coincidem."); return; }
    var salt=novoSalt(); state.pin={salt:salt,hash:hashPin(p1,salt),len:p1.length,hint:val("f_pinDica").trim()};
    unlocked=true; salvar(); fecharSheet(); render(); toast(modo==="set"?"PIN ativado.":"PIN alterado.");
  };
}

/* ---- ecrã de bloqueio ---- */
var unlocked=false, pinBuf="", pinFalhas=0, pinEsperaAte=0, ocultoDesde=0;
function lockEl(){
  var el=document.getElementById("lock"); if(el) return el;
  el=document.createElement("div"); el.id="lock"; el.className="lock";
  el.style.setProperty("--lockbg","url("+LOGIN_BG+")");
  document.body.appendChild(el); return el;
}
function mostrarLock(){
  if(!state.pin){ unlocked=true; return; }
  unlocked=false; pinBuf=""; fecharSheet();
  var el=lockEl(); el.classList.add("show"); document.body.style.overflow="hidden";
  var teclas=["1","2","3","4","5","6","7","8","9","","0","del"];
  el.innerHTML='<div class="lock-box"><img class="lock-logo" src="'+LOGO+'" alt="">'+
    '<div class="lock-t">Organização Pessoal &amp; Financeira</div><div class="lock-s" id="lockMsg">Introduza o seu PIN</div>'+
    '<div class="lock-dots" id="lockDots"></div><div class="lock-pad">'+
    teclas.map(function(k){ if(!k) return '<span></span>';
      if(k==="del") return '<button class="lk del" data-act="pin-key" data-k="del" aria-label="Apagar"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 001-1V6a1 1 0 00-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>';
      return '<button class="lk" data-act="pin-key" data-k="'+k+'">'+k+'</button>'; }).join("")+
    '</div><button class="lock-link" data-act="pin-forgot">Esqueci o PIN</button></div>';
  desenharDots();
}
function desenharDots(erro){
  var d=document.getElementById("lockDots"); if(!d) return; var n=(state.pin&&state.pin.len)||6, h="";
  for(var i=0;i<n;i++) h+='<span class="'+(i<pinBuf.length?"on":"")+'"></span>';
  d.innerHTML=h; d.classList.toggle("erro", !!erro);
}
function teclaPin(k){
  if(Date.now()<pinEsperaAte){ var s=Math.ceil((pinEsperaAte-Date.now())/1000); document.getElementById("lockMsg").textContent="Aguarde "+s+" s…"; return; }
  if(k==="del"){ pinBuf=pinBuf.slice(0,-1); desenharDots(); return; }
  if(pinBuf.length>=state.pin.len) return;
  pinBuf+=k; desenharDots();
  if(pinBuf.length===state.pin.len){
    setTimeout(function(){
      if(pinOk(pinBuf)){ unlocked=true; pinFalhas=0; var el=lockEl(); el.classList.remove("show"); el.innerHTML=""; document.body.style.overflow=""; render(); setTimeout(verificarPerfil,300); setTimeout(verificarLembrete,900); }
      else { pinFalhas++; pinBuf=""; desenharDots(true);
        var msg=document.getElementById("lockMsg");
        if(pinFalhas>=5){ pinEsperaAte=Date.now()+30000; pinFalhas=0; msg.textContent="Demasiadas tentativas. Aguarde 30 s."; }
        else msg.textContent="PIN errado. Tente outra vez.";
        if(navigator.vibrate) try{ navigator.vibrate(120); }catch(e){} }
    },120);
  }
}
function esqueciPin(){
  var el=lockEl(); var dica=state.pin&&state.pin.hint;
  el.innerHTML='<div class="lock-box"><div class="lock-t">Esqueceu o PIN?</div>'+
    (dica?'<div class="lock-hint">Dica: <b>'+esc(dica)+'</b></div>':'<div class="lock-s">Não foi definida nenhuma dica.</div>')+
    '<div class="lock-info">Sem o PIN não é possível abrir os dados. Se não se lembrar, pode <b>apagar todos os dados</b> e começar a app do zero.</div>'+
    '<button class="lock-btn" data-act="pin-back">Voltar e tentar o PIN</button>'+
    '<button class="lock-link" data-act="pin-apagar" style="color:#ffb0b0">Apagar todos os dados e começar de novo</button></div>';
}
function apagarTudoSemPin(){
  if(!confirm("Apagar TODOS os dados desta app (receitas, gastos, poupança, projetos)? Esta ação não pode ser desfeita.")) return;
  if(!confirm("Tem a certeza? Os dados serão apagados para sempre.")) return;
  state=estadoInicial(); salvar(); try{ localStorage.removeItem("zelo_autobackup"); }catch(e){}
  setTimeout(function(){ location.reload(); },300);
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ ocultoDesde=Date.now(); }
  else if(state && state.pin && unlocked && ocultoDesde && Date.now()-ocultoDesde>60000){ mostrarLock(); }
  else if(state && unlocked){ setTimeout(verificarLembrete,600); }
});
document.addEventListener("change", function(e){
  var t=e.target; if(t && t.classList && t.classList.contains("aloc-inp")) setAloc(t.dataset.aloc, t.value);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target && e.target.classList && e.target.classList.contains("aloc-inp")){ e.target.blur(); return; }
  var el=document.getElementById("lock"); if(!el || !el.classList.contains("show") || !document.getElementById("lockDots")) return;
  if(/^[0-9]$/.test(e.key)){ teclaPin(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ teclaPin("del"); e.preventDefault(); }
});
