      '<div class="gval"><div class="v1" style="color:'+(over?'var(--danger)':g.cor)+'">'+fmtNum(real)+'</div><div class="v2">de '+fmtNum(p)+'</div></div></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+(over?'var(--danger)':g.cor)+'"></div></div></div>'; });
  h+='</div>';

  // Receitas por fonte
  h+='<div class="card"><h2><svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Entradas por fonte<span class="sp"></span><span class="pill">'+fmt(d.receita)+'</span></h2>';
  if(!d.fontesArr.length) h+='<div class="empty" style="padding:18px">Sem receitas registadas.</div>';
  else { var mxr=d.fontesArr[0].valor; d.fontesArr.forEach(function(f,i){ h+=rankRow(i+1,f.nome,f.valor,d.receita,mxr,"var(--green)","var(--green-soft)"); }); }
  h+='</div>';

  // Evolução mês a mês
  if(d.ms.length>1){
    var mxe=Math.max.apply(null,d.evo.map(function(e){return Math.max(e.receita,e.gasto,Math.abs(e.poup));}).concat([1]));
    h+='<div class="card"><h2><svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Evolução mês a mês</h2><div class="evobars">';
    d.evo.forEach(function(e){ h+='<div class="eb"><div class="grp">'+
      '<div class="bw" style="height:'+Math.round(e.receita/mxe*100)+'%;background:var(--green)"></div>'+
      '<div class="bw" style="height:'+Math.round(e.gasto/mxe*100)+'%;background:var(--pessoal)"></div>'+
      '<div class="bw" style="height:'+Math.round(Math.max(0,e.poup)/mxe*100)+'%;background:var(--nossa)"></div></div>'+
      '<span class="el">'+MESES[(+e.ym.split("-")[1])-1].slice(0,3)+'</span></div>'; });
    h+='</div><div class="evo-leg"><span><i style="background:var(--green)"></i>Receita</span><span><i style="background:var(--pessoal)"></i>Gasto</span><span><i style="background:var(--nossa)"></i>Poupado</span></div>';
  } else {
    h+='<div class="card"><h2><svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>Extrato do mês</h2>';
  }
  h+='<div class="evo-wrap"><table class="evo"><tr><th>Mês</th><th>Receita</th><th>Gasto</th><th>Poupado</th><th>Sobra</th></tr>';
  d.evo.forEach(function(e){ var s=e.receita-e.gasto-e.poup-(e.proj||0); h+='<tr><td class="mes">'+mesCurto(e.ym)+'</td><td>'+fmtNum(e.receita)+'</td><td>'+fmtNum(e.gasto)+'</td><td>'+fmtNum(e.poup)+'</td><td class="'+(s<0?'neg':'')+'">'+fmtNum(s)+'</td></tr>'; });
  h+='<tr class="tot"><td>Total</td><td>'+fmtNum(d.receita)+'</td><td>'+fmtNum(d.gasto)+'</td><td>'+fmtNum(d.poup)+'</td><td class="'+((d.receita-d.gasto-d.poup)<0?'neg':'')+'">'+fmtNum(d.receita-d.gasto-d.poup)+'</td></tr></table></div></div>';

  h+=rodape()+'</div>'; main.innerHTML=h;
}

/* ---------- PDF (impressão → "Guardar como PDF") ---------- */
function prCard(l,v,s){ return '<div class="pr-card"><div class="l">'+l+'</div><div class="v">'+fmt(v)+'</div>'+(s?'<div style="font-size:9px;color:#6b7f7b;margin-top:2px">'+s+'</div>':'')+'</div>'; }
function relatorioPrintHTML(d){
  var emit=new Date(), ems=String(emit.getDate()).padStart(2,"0")+"/"+String(emit.getMonth()+1).padStart(2,"0")+"/"+emit.getFullYear();
  var h='<div class="pr-h"><img src="'+LOGO+'" alt=""><div><div class="t1">Relatório Financeiro — '+esc(nomePeriodo())+'</div>'+
    '<div class="t2">Período: '+periodoLabel(d.ms)+' ('+d.ms.length+(d.ms.length>1?' meses':' mês')+') · Moeda: '+esc(moeda())+' · Emitido em '+ems+'</div></div></div>';
  h+='<div class="pr-sec">Resumo</div><div class="pr-cards">'+
    prCard("Entradas",d.entradas,"Receita "+fmtNum(d.receita)+(d.lev?" + levant. "+fmtNum(d.lev):""))+
    prCard("Saídas",d.saidas,"Gastos "+fmtNum(d.gasto)+" + poup. "+fmtNum(d.dep)+(d.proj?" + proj. "+fmtNum(d.proj):""))+
    prCard("Poupado (líquido)",d.poup,(d.receita>0?Math.round(d.poup/d.receita*100):0)+"% da receita")+
    prCard("Sobra",d.sobra,"Entradas − saídas")+'</div>';
  if(d.ms.length>1){
    h+='<table class="pr" style="margin-top:8px"><tr><th>Destaque</th><th>Mês</th><th class="r">Valor</th></tr>'+
      '<tr><td>Média de gastos por mês</td><td>—</td><td class="r">'+fmt(d.mediaGasto)+'</td></tr>'+
      '<tr><td>Mês em que mais gastei</td><td>'+(d.mesMaisGasto?mesLabel(d.mesMaisGasto.ym):'—')+'</td><td class="r">'+fmt(d.mesMaisGasto?d.mesMaisGasto.gasto:0)+'</td></tr>'+
      '<tr><td>Mês em que mais poupei</td><td>'+(d.mesMaisPoup?mesLabel(d.mesMaisPoup.ym):'—')+'</td><td class="r">'+fmt(d.mesMaisPoup?d.mesMaisPoup.poup:0)+'</td></tr></table>';
  }
  h+='<div class="pr-sec">Entradas por fonte</div><table class="pr"><tr><th>#</th><th>Fonte</th><th class="r">Valor</th><th class="r">%</th></tr>';
  if(!d.fontesArr.length) h+='<tr><td colspan="4">Sem receitas registadas.</td></tr>';
  d.fontesArr.forEach(function(f,i){ h+='<tr><td>'+(i+1)+'</td><td>'+esc(f.nome)+'</td><td class="r">'+fmt(f.valor)+'</td><td class="r">'+(d.receita>0?Math.round(f.valor/d.receita*100):0)+'%</td></tr>'; });
  if(d.lev) h+='<tr><td></td><td>Levantamentos da poupança</td><td class="r">'+fmt(d.lev)+'</td><td class="r">—</td></tr>';
  h+='<tr class="tot"><td></td><td>Total de entradas</td><td class="r">'+fmt(d.entradas)+'</td><td class="r"></td></tr></table>';

  h+='<div class="pr-sec">Saídas — onde gastei mais</div><table class="pr"><tr><th>#</th><th>Categoria</th><th>Grupo</th><th class="r">Valor</th><th class="r">%</th></tr>';
  if(!d.catArr.length) h+='<tr><td colspan="5">Sem gastos no período.</td></tr>';
  d.catArr.forEach(function(c,i){ h+='<tr><td>'+(i+1)+'</td><td>'+nomeCat(c.nome)+'</td><td>'+grupoDe(c.grupo).nome+'</td><td class="r">'+fmt(c.valor)+'</td><td class="r">'+(d.gasto>0?Math.round(c.valor/d.gasto*100):0)+'%</td></tr>'; });
  h+='<tr><td></td><td>Depósitos na poupança</td><td>Poupança</td><td class="r">'+fmt(d.dep)+'</td><td class="r">—</td></tr>';
  if(d.proj) h+='<tr><td></td><td>Dinheiro posto nos projetos</td><td>Compras & Objetivos</td><td class="r">'+fmt(d.proj)+'</td><td class="r">—</td></tr>';
  h+='<tr class="tot"><td></td><td colspan="2">Total de saídas</td><td class="r">'+fmt(d.saidas)+'</td><td class="r"></td></tr></table>';

  h+='<div class="pr-sec">Distribuição — planeado vs. realizado</div><table class="pr"><tr><th>Grupo</th><th class="r">Planeado</th><th class="r">Realizado</th><th class="r">%</th><th class="r">Diferença</th></tr>';
  [["fixa",d.grp.fixa],["pessoal",d.grp.pessoal],["poupanca",d.poup]].forEach(function(a){ var p=d.plan[a[0]]; h+='<tr><td>'+grupoDe(a[0]).nome+'</td><td class="r">'+fmt(p)+'</td><td class="r">'+fmt(a[1])+'</td><td class="r">'+(p>0?Math.round(a[1]/p*100):0)+'%</td><td class="r">'+fmt(p-a[1])+'</td></tr>'; });
  var realT=d.grp.fixa+d.grp.pessoal+d.poup;
  h+='<tr class="tot"><td>Total</td><td class="r">'+fmt(d.planTotal)+'</td><td class="r">'+fmt(realT)+'</td><td class="r">'+(d.planTotal>0?Math.round(realT/d.planTotal*100):0)+'%</td><td class="r">'+fmt(d.planTotal-realT)+'</td></tr></table>';

  h+='<div class="pr-sec">Poupança por fundo</div><table class="pr"><tr><th>Fundo</th><th class="r">Movimento no período</th><th class="r">Saldo atual</th><th class="r">Meta</th></tr>';
  state.fundos.forEach(function(f){ var mov=d.fundo[f.id]||0;
    h+='<tr><td>'+esc(f.nome)+'</td><td class="r">'+fmt(mov)+'</td><td class="r">'+fmt(saldoFundo(f.id))+'</td><td class="r">'+((Number(f.meta)||0)>0?fmt(f.meta):'—')+'</td></tr>'; });
  h+='<tr class="tot"><td>Total</td><td class="r">'+fmt(d.poup)+'</td><td class="r">'+fmt(totalPoupado())+'</td><td class="r">'+(metaTotal()>0?fmt(metaTotal()):'—')+'</td></tr></table>';

  h+='<div class="pr-sec">Extrato mês a mês</div><table class="pr"><tr><th>Mês</th><th class="r">Receita</th><th class="r">Gasto</th><th class="r">Poupado</th><th class="r">Sobra</th></tr>';
  d.evo.forEach(function(e){ h+='<tr><td>'+mesLabel(e.ym)+'</td><td class="r">'+fmt(e.receita)+'</td><td class="r">'+fmt(e.gasto)+'</td><td class="r">'+fmt(e.poup)+'</td><td class="r">'+fmt(e.receita-e.gasto-e.poup-(e.proj||0))+'</td></tr>'; });
  h+='<tr class="tot"><td>Total</td><td class="r">'+fmt(d.receita)+'</td><td class="r">'+fmt(d.gasto)+'</td><td class="r">'+fmt(d.poup)+'</td><td class="r">'+fmt(d.receita-d.gasto-d.poup)+'</td></tr></table>';

  // detalhe de todos os gastos e movimentos
  var trans=[]; d.ms.forEach(function(ym){ var m=state.meses[ym]; if(m) m.transacoes.forEach(function(t){ trans.push(t); }); });
  trans.sort(function(a,b){ return (a.data||"").localeCompare(b.data||""); });
  h+='<div class="pr-sec">Detalhe dos gastos ('+trans.length+')</div><table class="pr"><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="r">Valor</th></tr>';
  if(!trans.length) h+='<tr><td colspan="4">Sem gastos no período.</td></tr>';
  trans.forEach(function(t){ h+='<tr><td>'+fmtDataCurta(t.data)+'/'+(t.data||"").slice(2,4)+'</td><td>'+esc(t.descricao||"—")+'</td><td>'+nomeCat(t.catNome||"Outros")+'</td><td class="r">'+fmt(t.valor)+'</td></tr>'; });
  h+='</table>';
  var movs=state.movPoupanca.filter(function(mv){ return d.ms.indexOf((mv.data||"").slice(0,7))!==-1; }).sort(function(a,b){ return (a.data||"").localeCompare(b.data||""); });
  h+='<div class="pr-sec">Movimentos da poupança ('+movs.length+')</div><table class="pr"><tr><th>Data</th><th>Fundo</th><th>Tipo</th><th>Nota</th><th class="r">Valor</th></tr>';
  if(!movs.length) h+='<tr><td colspan="5">Sem movimentos no período.</td></tr>';
  movs.forEach(function(mv){ var f=state.fundos.filter(function(x){return x.id===mv.fundoId;})[0]; var lev=mv.tipo==="levantamento";
    h+='<tr><td>'+fmtDataCurta(mv.data)+'/'+(mv.data||"").slice(2,4)+'</td><td>'+esc(f?f.nome:"Fundo")+'</td><td>'+(lev?'Levantamento':'Depósito')+'</td><td>'+esc(mv.nota||"")+'</td><td class="r">'+(lev?'-':'+')+fmt(mv.valor)+'</td></tr>'; });
  h+='</table>';
  if(nomePdf()) h+='<div class="pr-assin"><div class="pr-linha"></div><b>'+esc(nomePdf())+'</b></div>';
  h+='<div class="pr-foot">Organização Pessoal &amp; Financeira · relatório gerado no dispositivo · '+ems+'</div>';
  return h;
}
function exportarRelatorioPDF(){
  var d=relDados();
  document.getElementById("printArea").innerHTML=relatorioPrintHTML(d);
  var tituloAnt=document.title;
  document.title="Relatorio_"+slugPeriodo()+"_"+d.ms[0]+(d.ms.length>1?"_a_"+d.ms[d.ms.length-1]:"");
  toast("Escolha \"Guardar como PDF\" na janela de impressão.");
  setTimeout(function(){ try{ if(ANDROID) AndroidApp.imprimir(document.title); else window.print(); }catch(e){} setTimeout(function(){ document.title=tituloAnt; },800); }, 350);
}

/* ---------- MODAIS ---------- */
function abrirSheet(t,b,f){ document.getElementById("sheetTitle").textContent=t; document.getElementById("sheetBody").innerHTML=b;
  document.getElementById("sheetFoot").innerHTML = f!=null?f:'<button class="btn-cancel" data-act="modal-close">Cancelar</button><button class="btn-save" data-act="modal-save">Guardar</button>';
  document.getElementById("ov").classList.add("show"); document.getElementById("sheet").classList.add("show"); document.body.style.overflow="hidden"; }
function fecharSheet(){ document.getElementById("ov").classList.remove("show"); document.getElementById("sheet").classList.remove("show"); document.body.style.overflow=""; modalSave=null; }
function val(id){ var e=document.getElementById(id); return e?e.value:""; }
function cT(id,l,v,ph){ return '<div class="field"><label>'+l+'</label><input type="text" id="'+id+'" value="'+esc(v||"")+'" placeholder="'+esc(ph||"")+'" autocomplete="off"></div>'; }
function cV(id,l,v){ return '<div class="field"><label>'+l+' ('+moeda()+')</label><input type="number" inputmode="numeric" min="0" id="'+id+'" value="'+(v!=null&&v!==""?v:"")+'" placeholder="0"></div>'; }
function cD(id,l,v){ return '<div class="field"><label>'+l+'</label><input type="date" id="'+id+'" value="'+(v||hojeISO())+'"></div>'; }
function footEdit(ed){ return ed?'<button class="btn-cancel" data-act="modal-close">Cancelar</button><button class="btn-save" data-act="modal-save">Atualizar</button>':null; }

function modalReceita(id){ var r=id?M().receitas.filter(function(x){return x.id===id;})[0]:null;
  abrirSheet(r?"Editar Receita":"Adicionar Receita", cT("f_nome","Fonte de receita",r?r.nome:"","Ex: Salário, Negócio")+cV("f_valor","Valor",r?r.valor:""), footEdit(r));
  modalSave=function(){ var n=val("f_nome").trim(),v=Number(val("f_valor"))||0; if(!n){toast("Escreva o nome.");return;}
    if(r){r.nome=n;r.valor=v;}else M().receitas.push({id:uid(),nome:n,valor:v}); salvar();fecharSheet();render();toast(r?"Receita atualizada.":"Receita adicionada."); }; }
function modalReceitaQuick(){ var r=M().receitas[0]; modalReceita(r?r.id:null); }

function modalItem(id,gp){ var o=id?M().orcamento.filter(function(x){return x.id===id;})[0]:null; var gSel=o?o.grupo:(gp||"fixa"), aj=eAjudar(o);
  var seg='<div class="field"><label>Categoria de</label><div class="seg" id="segG">';
  [["fixa","Despesa","Fixa"],["pessoal","Gastos","Pessoais"]].forEach(function(a){ seg+='<button type="button" class="sb '+(gSel===a[0]?"on":"")+'" data-g="'+a[0]+'" data-act="seg-sel" data-target="f_grupo">'+a[1]+'<small>'+a[2]+'</small></button>'; });
  seg+='</div><input type="hidden" id="f_grupo" value="'+gSel+'"></div>';
  var dispG=livreGrupo(gSel)+(o?Number(o.valor)||0:0);
  if(aj) seg='<input type="hidden" id="f_grupo" value="fixa"><div class="hint" style="margin:-4px 0 10px">🤝 Campo obrigatório da Despesa Fixa. Quando os gastos neste campo chegarem ao valor planeado, a app avisa que o valor para ajudar outros foi atingido.</div>';
  abrirSheet(o?"Editar Campo":"Novo Campo", (aj?'<div class="field"><label>Nome do campo</label><input type="text" id="f_nome" value="Ajudar outros" disabled style="opacity:.7"></div>':cT("f_nome","Nome do campo",o?o.nome:"","Ex: Táxi do mês"))+cV("f_valor","Valor planeado",o?o.valor:"")+
    '<div class="hint" style="margin:-6px 0 12px;font-size:11.5px;color:var(--muted)">Disponível em '+grupoDe(gSel).nome+': <b style="color:'+(dispG<0?'var(--danger)':'var(--green-dark)')+'">'+fmt(dispG)+'</b></div>'+seg, footEdit(o));
  modalSave=function(){ var n=val("f_nome").trim(),v=Number(val("f_valor"))||0,g=val("f_grupo")||"fixa"; if(!n){toast("Escreva o nome.");return;}
    if(aj){ n="Ajudar outros"; g="fixa"; }
    if(o){o.nome=n;o.valor=v;o.grupo=g;}else M().orcamento.push({id:uid(),nome:n,valor:v,grupo:g}); salvar();fecharSheet();render();toast(o?"Campo atualizado.":"Campo adicionado."); avisoGrupo(g); }; }

function modalTrans(id){ var t=id?M().transacoes.filter(function(x){return x.id===id;})[0]:null;
  var opts='<option value="">— Escolher categoria —</option>';
  ["fixa","pessoal"].forEach(function(gid){ var g=grupoDe(gid); var its=M().orcamento.filter(function(o){return o.grupo===gid;}); if(!its.length)return;
    opts+='<optgroup label="'+esc(g.nome)+'">'; its.forEach(function(o){ opts+='<option value="'+o.id+'"'+(t&&t.itemId===o.id?" selected":"")+'>'+esc(o.nome)+'</option>'; }); opts+='</optgroup>'; });
  var b=cD("f_data","Data",t?t.data:"")+'<div class="field"><label>Categoria</label><select id="f_item">'+opts+'</select><div class="hint">As categorias vêm do teu Plano.</div></div>'+cT("f_desc","Descrição (opcional)",t?t.descricao:"","Ex: Táxi para o trabalho")+cV("f_valor","Valor gasto",t?t.valor:"");
  abrirSheet(t?"Editar Gasto":"Novo Gasto", b, footEdit(t)); var ctxLim={};
  modalSave=function(){ var data=val("f_data")||hojeISO(),itemId=val("f_item"),desc=val("f_desc").trim(),v=Number(val("f_valor"))||0; if(v<=0){toast("Indique o valor gasto.");return;}
    var item=itemId?M().orcamento.filter(function(o){return o.id===itemId;})[0]:null; var grupo=item?item.grupo:"pessoal"; var catNome=item?item.nome:"Outros";
    var ymNovo=data.slice(0,7);
    if(!verificarLimite(ymNovo,v,t?t.id:null,ctxLim)) return;
    var usoAntes=usoPct(ymNovo), ajAntes=ajudarEstado(ymNovo), dadoAj=ajAntes?ajAntes.dado-(t&&t.itemId===ajAntes.item.id&&t.data.slice(0,7)===ymNovo?Number(t.valor)||0:0):0;
    if(t){ t.data=data;t.itemId=itemId;t.grupo=grupo;t.catNome=catNome;t.descricao=desc;t.valor=v;
      if(ymNovo!==mesAtual){ M().transacoes=M().transacoes.filter(function(x){return x!==t;}); garantirMes(ymNovo).transacoes.push(t); } }
    else garantirMes(ymNovo).transacoes.push({id:uid(),_t:Date.now(),data:data,itemId:itemId,grupo:grupo,catNome:catNome,descricao:desc,valor:v});
    if(ymNovo!==mesAtual) setTimeout(function(){ toast("Gasto guardado em "+mesLabel(ymNovo)+"."); },900);
    salvar();fecharSheet();render();toast(t?"Gasto atualizado.":"Gasto registado."); avisoDepois(ymNovo,usoAntes);
    if(item && eAjudar(item)) avisoAjudar(ymNovo,dadoAj);
    else if(item){ var gi=garantirMes(ymNovo).transacoes.filter(function(x){return x.itemId===item.id;}).reduce(function(a,x){return a+(Number(x.valor)||0);},0);
      if(gi>(Number(item.valor)||0)) setTimeout(function(){ toast(item.nome+" passou o planeado em "+fmt(gi-(Number(item.valor)||0))+"."); },3800); } }; }

function modalFundo(id){ var f=id?state.fundos.filter(function(x){return x.id===id;})[0]:null; var tSel=f?f.tipo:"emerg";
  var seg='<div class="field"><label>Tipo de fundo (cor e ícone)</label><div class="seg" id="segG">';
  [["emerg","Reserva","Emergência"],["nossa","Nossa","Conjunto"],["pess","Pessoal","Só eu"]].forEach(function(a){ seg+='<button type="button" class="sb '+(tSel===a[0]?"on":"")+'" data-g="'+a[0]+'" data-act="seg-sel" data-target="f_tipo">'+a[1]+'<small>'+a[2]+'</small></button>'; });
  seg+='</div><input type="hidden" id="f_tipo" value="'+tSel+'"></div>';
  var b=cT("f_nome","Nome do fundo",f?f.nome:"","Ex: Reserva de Emergência")+seg+cV("f_meta","Meta (0 = sem meta)",f?f.meta:"")+cV("f_plano","Plano mensal",f?f.planoMensal:"")+
    '<div class="hint" style="margin:-6px 0 4px;font-size:11.5px;color:var(--muted)">Disponível em Poupança este mês: <b style="color:var(--green-dark)">'+fmt(livreGrupo("poupanca")+(f?Number(f.planoMensal)||0:0))+'</b></div>';
  var foot = f ? '<button class="btn-cancel" data-act="modal-close">Cancelar</button><button class="btn-save" data-act="modal-save">Atualizar</button>' : null;
  abrirSheet(f?"Editar Fundo":"Novo Fundo de Poupança", b, foot);
  modalSave=function(){ var n=val("f_nome").trim(),tipo=val("f_tipo")||"emerg",meta=Number(val("f_meta"))||0,plano=Number(val("f_plano"))||0; if(!n){toast("Escreva o nome.");return;}
    if(f){f.nome=n;f.tipo=tipo;f.meta=meta;f.planoMensal=plano;}else state.fundos.push({id:uid(),nome:n,tipo:tipo,meta:meta,planoMensal:plano}); salvar();fecharSheet();render();toast(f?"Fundo atualizado.":"Fundo criado."); avisoGrupo("poupanca"); }; }

function modalMov(fundoId,tipoPre){ var f=state.fundos.filter(function(x){return x.id===fundoId;})[0]; if(!f){return;} var tSel=tipoPre||"deposito";
  var seg='<div class="field"><label>Tipo de movimento</label><div class="seg" id="segG">'+
    '<button type="button" class="sb '+(tSel==="deposito"?"on":"")+'" data-g="deposito" data-act="seg-sel" data-target="f_tipo">Depósito<small>+ juntar</small></button>'+
    '<button type="button" class="sb '+(tSel==="levantamento"?"on":"")+'" data-g="levantamento" data-act="seg-sel" data-target="f_tipo">Levantamento<small>- retirar</small></button>'+
    '</div><input type="hidden" id="f_tipo" value="'+tSel+'"></div>';
  var b='<div class="field"><label>Fundo</label><input type="text" value="'+esc(f.nome)+'" disabled style="opacity:.7"></div>'+seg+cD("f_data","Data","")+cV("f_valor","Valor","")+cT("f_nota","Nota (opcional)","","Ex: parte do salário");
  abrirSheet(tSel==="levantamento"?"Levantar de "+f.nome:"Depositar em "+f.nome, b); var ctxLim={};
  modalSave=function(){ var tipo=val("f_tipo")||"deposito",data=val("f_data")||hojeISO(),v=Number(val("f_valor"))||0,nota=val("f_nota").trim(); if(v<=0){toast("Indique o valor.");return;}
    var ymM=data.slice(0,7); if(tipo!=="levantamento" && !verificarLimite(ymM,v,null,ctxLim)) return; var usoAntes=usoPct(ymM);
    state.movPoupanca.push({id:uid(),_t:Date.now(),fundoId:fundoId,tipo:tipo,data:data,valor:v,nota:nota}); salvar();fecharSheet();render(); if(tipo!=="levantamento") avisoDepois(ymM,usoAntes);toast(tipo==="levantamento"?"Levantamento registado.":"Depósito registado."); }; }

    salvar(); fecharSheet(); render(); toast("Backup importado.");
  });
}

/* ================== PIN DE ACESSO ================== */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow, mw=mp(2,32), result='', words=[], bitLen=ascii.length*8, i, j;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/mw)|0); words[words.length]=bitLen;
  for(j=0;j<words.length;){ var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){ var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0; }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); }
  return result;
}
function hashPin(pin,salt){ var h=salt+":"+pin; for(var i=0;i<1000;i++) h=sha256(h+":"+salt); return h; }
function novoSalt(){ var s=""; for(var i=0;i<16;i++) s+=Math.floor(Math.random()*16).toString(16); return s; }
function pinOk(pin){ return !!state.pin && hashPin(pin,state.pin.salt)===state.pin.hash; }

/* ---- ecrã de bloqueio ---- */
var unlocked=false, pinBuf="", pinFalhas=0, pinEsperaAte=0, ocultoDesde=0;
function lockEl(){
  var el=document.getElementById("lock"); if(el) return el;
  el=document.createElement("div"); el.id="lock"; el.className="lock";
  el.style.setProperty("--lockbg","url("+LOGIN_BG+")");
  document.body.appendChild(el); return el;
}
function mostrarLock(){
  if(!state.pin){ unlocked=true; return; }
  unlocked=false; pinBuf=""; fecharSheet();
  var el=lockEl(); el.classList.add("show"); document.body.style.overflow="hidden";
  var teclas=["1","2","3","4","5","6","7","8","9","","0","del"];
  var hr=new Date().getHours(), sd=hr<12?"Bom dia":hr<19?"Boa tarde":"Boa noite", pn=(nomePessoa()||"").split(" ")[0];
  el.innerHTML='<div class="lock-wrap"><div class="lock-card" role="img" aria-label="Fotografia"><div class="lock-tag"><img src="'+LOGO+'" alt=""><div><b>Organização Pessoal</b><small>&amp; Financeira</small></div></div></div>'+
    '<div class="lock-box"><div class="lock-t">'+sd+(pn?', <b>'+esc(pn)+'</b>':'')+'</div><div class="lock-s" id="lockMsg">Introduza a sua senha</div>'+
    '<div class="lock-dots" id="lockDots"></div><div class="lock-pad">'+
    teclas.map(function(k){ if(!k) return '<span></span>';
      if(k==="del") return '<button class="lk del" data-act="pin-key" data-k="del" aria-label="Apagar"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 001-1V6a1 1 0 00-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button>';
      return '<button class="lk" data-act="pin-key" data-k="'+k+'">'+k+'</button>'; }).join("")+
    '</div><button class="lock-link" data-act="pin-forgot">Esqueci a senha</button></div></div>';
  desenharDots();
}
function desenharDots(erro){
  var d=document.getElementById("lockDots"); if(!d) return; var n=(state.pin&&state.pin.len)||6, h="";
  for(var i=0;i<n;i++) h+='<span class="'+(i<pinBuf.length?"on":"")+'"></span>';
  d.innerHTML=h; d.classList.toggle("erro", !!erro);
}
function teclaPin(k){
  if(Date.now()<pinEsperaAte){ var s=Math.ceil((pinEsperaAte-Date.now())/1000); document.getElementById("lockMsg").textContent="Aguarde "+s+" s…"; return; }
  if(k==="del"){ pinBuf=pinBuf.slice(0,-1); desenharDots(); return; }
  var lm=document.getElementById("lockMsg"); if(lm && lm.classList.contains("err") && !pinBuf.length){ lm.classList.remove("err"); lm.textContent="Introduza a sua senha"; }
  if(pinBuf.length>=state.pin.len) return;
  pinBuf+=k; desenharDots();
  if(pinBuf.length===state.pin.len){
    setTimeout(function(){
      if(pinOk(pinBuf)){ unlocked=true; pinFalhas=0; var el=lockEl(); el.classList.remove("show"); el.innerHTML=""; document.body.style.overflow=""; render(); setTimeout(verificarPerfil,300); setTimeout(verificarLembrete,900); }
      else { pinFalhas++; pinBuf=""; desenharDots(true);
        var msg=document.getElementById("lockMsg");
        if(pinFalhas>=5){ pinEsperaAte=Date.now()+30000; pinFalhas=0; msg.textContent="Demasiadas tentativas. Aguarde 30 s."; msg.classList.add("err"); }
        else msg.textContent="Senha errada. Tente outra vez."; msg.classList.add("err");
        if(navigator.vibrate) try{ navigator.vibrate(120); }catch(e){} }
    },120);
  }
}
function esqueciPin(){
  var el=lockEl(); var dica=state.pin&&state.pin.hint;
  el.innerHTML='<div class="lock-wrap"><div class="lock-box"><div class="lock-sx">Esqueceu a senha?</div>'+
    (dica?'<div class="lock-hint">Dica: <b>'+esc(dica)+'</b></div>':'<div class="lock-s">Não foi definida nenhuma dica.</div>')+
    '<div class="lock-info">Tente lembrar-se com a ajuda da dica. Por segurança, os dados só abrem com a senha certa.</div>'+
    '<button class="lock-btn" data-act="pin-back">Voltar e tentar a senha</button></div></div>';
}
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ ocultoDesde=Date.now(); }
  else if(state && state.pin && unlocked && ocultoDesde && Date.now()-ocultoDesde>60000){ mostrarLock(); }
  else if(state && unlocked){ setTimeout(verificarLembrete,600); }
});
document.addEventListener("change", function(e){
  var t=e.target; if(t && t.classList && t.classList.contains("aloc-inp")) setAloc(t.dataset.aloc, t.value);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target && e.target.classList && e.target.classList.contains("aloc-inp")){ e.target.blur(); return; }
  var el=document.getElementById("lock"); if(!el || !el.classList.contains("show") || !document.getElementById("lockDots")) return;
  if(/^[0-9]$/.test(e.key)){ teclaPin(e.key); e.preventDefault(); }
  else if(e.key==="Backspace"){ teclaPin("del"); e.preventDefault(); }
});

var KIT_TXT={"instalar.ps1": "# Instala a Organização Pessoal & Financeira como app no ambiente de trabalho (Windows)\n$ErrorActionPreference = 'Stop'\n$origem  = Split-Path -Parent $MyInvocation.MyCommand.Path\n$destino = Join-Path $env:LOCALAPPDATA 'ControleFinanceiro'\nNew-Item -ItemType Directory -Force -Path $destino | Out-Null\nCopy-Item (Join-Path $origem 'controle_financeiro.html') (Join-Path $destino 'index.html') -Force\nCopy-Item (Join-Path $origem 'icone.ico') (Join-Path $destino 'icone.ico') -Force\n\n$candidatos = @(\n  \"${env:ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe\",\n  \"$env:ProgramFiles\\Microsoft\\Edge\\Application\\msedge.exe\",\n  \"$env:LOCALAPPDATA\\Microsoft\\Edge\\Application\\msedge.exe\",\n  \"$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe\",\n  \"${env:ProgramFiles(x86)}\\Google\\Chrome\\Application\\chrome.exe\",\n  \"$env:LOCALAPPDATA\\Google\\Chrome\\Application\\chrome.exe\"\n)\n$navegador = $candidatos | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1\nif (-not $navegador) {\n  Write-Host 'Não encontrei o Microsoft Edge nem o Google Chrome. Instale um deles e tente outra vez.'\n  exit 1\n}\n\n# Pasta de backup automático: Documentos\\Controle Financeiro\n$pastaBackup = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Controle Financeiro'\nNew-Item -ItemType Directory -Force -Path $pastaBackup | Out-Null\n\n$url = ([System.Uri](Join-Path $destino 'index.html')).AbsoluteUri\n$argumentos = \"--app=`\"$url`\" --window-size=1280,860\"\n$icone = (Join-Path $destino 'icone.ico') + ',0'\n$shell = New-Object -ComObject WScript.Shell\n$pastas = @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))\nforeach ($pasta in $pastas) {\n  Remove-Item (Join-Path $pasta 'Controle Financeiro.lnk') -ErrorAction SilentlyContinue\n  $atalho = $shell.CreateShortcut((Join-Path $pasta 'Organização Pessoal e Financeira.lnk'))\n  $atalho.TargetPath       = $navegador\n  $atalho.Arguments        = $argumentos\n  $atalho.IconLocation     = $icone\n  $atalho.WorkingDirectory = $destino\n  $atalho.Description      = 'Organização Pessoal & Financeira'\n  $atalho.Save()\n}\nWrite-Host ''\nWrite-Host 'Pronto! O atalho \"Organização Pessoal e Financeira\" foi criado no ambiente de trabalho e no menu Iniciar.'\nWrite-Host \"App instalada em: $destino\"\nWrite-Host \"Pasta de backup automático: $pastaBackup\"\nWrite-Host \"Na app: Definições > Backup automático > Escolher pasta (escolha esta pasta uma vez).\"\nStart-Process -FilePath $navegador -ArgumentList $argumentos\n", "desinstalar.ps1": "# Remove os atalhos e os ficheiros da app (os dados ficam guardados no navegador)\n$destino = Join-Path $env:LOCALAPPDATA 'ControleFinanceiro'\nforeach ($pasta in @([Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs'))) {\n  Remove-Item (Join-Path $pasta 'Controle Financeiro.lnk') -ErrorAction SilentlyContinue\n  Remove-Item (Join-Path $pasta 'Organização Pessoal e Financeira.lnk') -ErrorAction SilentlyContinue\n}\nRemove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue\nWrite-Host 'Atalhos e ficheiros removidos. Os seus dados continuam guardados no navegador.'\n", "INSTALAR.bat": "@echo off\nchcp 65001 >nul\npowershell -NoProfile -ExecutionPolicy Bypass -File \"%~dp0instalar.ps1\"\necho.\npause\n", "Desinstalar.bat": "@echo off\nchcp 65001 >nul\npowershell -NoProfile -ExecutionPolicy Bypass -File \"%~dp0desinstalar.ps1\"\necho.\npause\n", "LEIA-ME.txt": "ORGANIZAÇÃO PESSOAL & FINANCEIRA — APP NO AMBIENTE DE TRABALHO (Windows 10/11)\n\nCOMO INSTALAR\n1. Extraia esta pasta (botão direito no .zip > Extrair tudo).\n2. Faça duplo clique em INSTALAR.bat\n   - Se aparecer \"O Windows protegeu o computador\", clique em\n     \"Mais informações\" > \"Executar mesmo assim\".\n3. Aparece o ícone \"Organização Pessoal e Financeira\" no ambiente\n   de trabalho e no menu Iniciar. A app abre numa janela própria,\n   sem barra de endereço, e funciona sem internet.\n\nONDE FICAM OS DADOS\n- Os dados ficam guardados no Microsoft Edge (ou Chrome) deste\n  computador, enquanto usar a app.\n- NÃO limpe \"cookies e dados de sites\" do navegador, ou perde os dados.\n\nAVISOS DA AGENDA\n- Com a app aberta, o lembrete toca com o som da agenda.\n- Para avisos com a app fechada: Agenda > \"Enviar lembretes para o\n  Calendário\" e abra o ficheiro no Calendário/Outlook.\n\nATUALIZAR PARA UMA NOVA VERSÃO\n- Substitua o controle_financeiro.html desta pasta pelo novo e\n  corra INSTALAR.bat outra vez. Os dados mantêm-se.\n\nDESINSTALAR\n- Duplo clique em Desinstalar.bat (remove os atalhos; os dados\n  continuam no navegador).\n"};
function crc32(u8){ var t=crc32.t; if(!t){ t=crc32.t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } }
  var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++) c=t[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipar(files){ var enc=new TextEncoder(), partes=[], central=[], off=0, d=new Date();
  var dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  files.forEach(function(f){ var nm=enc.encode(f.nome), dados=f.dados, crc=crc32(dados);
    var lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,tm,true); lh.setUint16(12,dt,true); lh.setUint32(14,crc,true); lh.setUint32(18,dados.length,true); lh.setUint32(22,dados.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    partes.push(new Uint8Array(lh.buffer),nm,dados);
    var ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,tm,true); ch.setUint16(14,dt,true); ch.setUint32(16,crc,true); ch.setUint32(20,dados.length,true); ch.setUint32(24,dados.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm); off+=30+nm.length+dados.length; });
  var tam=central.reduce(function(a,u){ return a+u.length; },0);
  var fim=new DataView(new ArrayBuffer(22)); fim.setUint32(0,0x06054b50,true); fim.setUint16(8,files.length,true); fim.setUint16(10,files.length,true); fim.setUint32(12,tam,true); fim.setUint32(16,off,true);
  return new Blob(partes.concat(central,[new Uint8Array(fim.buffer)]),{type:"application/zip"}); }
function b64bytes(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }

  function crlf(t){ return t.replace(/\r?\n/g,"\r\n"); }
  var pasta="ControleFinanceiro/", files=[

  var a=document.createElement("a"); a.href=URL.createObjectURL(zipar(files)); a.download="ControleFinanceiro_App.zip";

  if(!movel) h+=opt("baixar-app","Baixar app para o computador (Windows)","Funciona sem internet · cria o ícone no ambiente de trabalho",ICO.down)+
    '<div class="status-line">Depois de baixar: extraia o <b>.zip</b> e faça duplo clique em <b>INSTALAR.bat</b>. A app abre numa janela própria, sem internet.</div>';
  else if(!standalone && !installEvt && !jaInstalada()){
    if(!publicada()) h+='<div class="status-line">No telemóvel, a instalação precisa que a app seja aberta <b>uma vez</b> a partir de um endereço <b>https</b>. Depois disso funciona sempre <b>sem internet</b>.</div>';
    else if(/iphone|ipad|ipod/i.test(navigator.userAgent)) h+=opt("ios-guia","Instalar no iPhone","Ver os 3 passos: Partilhar › Adicionar ao ecrã principal",ICO.phone);
    else h+='<div class="status-line">No Chrome: menu <b>⋮</b> → <b>Instalar app</b> (ou <b>Adicionar ao ecrã principal</b>).</div>';
  }
  return h;
}
function instalarApp(){ if(!installEvt){ toast("Use o menu do navegador para instalar."); return; }
  installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; if(document.getElementById("sheet").classList.contains("show")) modalSettings(); }); }
if("serviceWorker" in navigator && publicada() && !ANDROID){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

var toastT=null;
function toast(msg){ var t=document.getElementById("toast"), av=/^(⚠|✕|Atenção|Já usou)|passou o planeado|passa o valor/.test(msg); msg=String(msg).replace(/^(⚠|✕)\s*/,"");
  t.classList.toggle("warn",av);
  t.innerHTML=(av?'<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.5 17a2 2 0 001.7 3h15.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>')+esc(msg); t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},t.classList.contains("warn")?4200:2600); }

/* ---------- EVENTOS ---------- */
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act],[data-nav]"); if(!el) return;
  var nav=el.dataset.nav; if(nav){ pagina=nav; filtroGrupo="todos"; render(); return; }
  var act=el.dataset.act, id=el.dataset.id;
  switch(act){
    case "mes-prev": mesAtual=desloca(mesAtual,-1); render(); break;
    case "mes-next": mesAtual=desloca(mesAtual,1); render(); break;
    case "settings": modalSettings(); break;
    case "modal-close": fecharSheet(); break;
    case "modal-save": if(modalSave) modalSave(); break;
    case "seg-sel": segSel(el); break;
    case "ag-dia": agDia=el.dataset.d; agCalMes=agDia.slice(0,7); render(); break;
    case "ag-semana": agDia=dSoma(agDia||hojeAg(),+el.dataset.n); agCalMes=agDia.slice(0,7); render(); break;
    case "ag-cal": agCal=!agCal; agCalMes=(agDia||hojeAg()).slice(0,7); render(); break;
    case "ag-calmes": var cm=agCalMes.split("-"), cd=new Date(+cm[0],+cm[1]-1+(+el.dataset.n),1,12); agCalMes=isoDe(cd).slice(0,7); render(); break;
    case "ag-nova": modalTarefa(null, el.dataset.d||agDia); break;
    case "ag-edit": modalTarefa(id); break;
    case "ag-feito": agMarcar(id); break;
    case "ag-apagar": agApagar(id); break;
    case "ag-passar": agPassar(el.dataset.d); break;
    case "ag-relp": agRelP=el.dataset.p; render(); break;
    case "ag-pdf": agExportarPDF(); break;
    case "ag-ics": agEnviarCalendario(); break;
    case "instalar-agora": instalarAgora(); break;
    case "instalar-fechar": fecharCartaoInstalar(); break;
    case "ios-fechar": fecharGuiaIOS(+el.dataset.n||2); break;
    case "ios-copiar": copiarEnderecoApp(); break;
    case "ios-guia": fecharSheet(); mostrarGuiaIOS(true); break;
    case "al-feito": alarmeFeito(id, el.dataset.d); break;
    case "al-adiar": alarmeAdiar(id, el.dataset.d); break;
    case "al-fechar": fecharAlarme(); break;
    case "receita-quick": modalReceitaQuick(); break;
    case "receita-add": modalReceita(null); break;
    case "receita-edit": modalReceita(id); break;
    case "receita-del": delReceita(id); break;
    case "item-add": modalItem(null, el.dataset.grupo); break;
    case "item-edit": modalItem(id); break;
    case "item-del": delItem(id); break;
    case "trans-add": modalTrans(null); break;
    case "trans-edit": if(el.dataset.ym){ mesAtual=el.dataset.ym; document.getElementById("mesLabel").textContent=mesLabel(mesAtual); } modalTrans(id); break;
    case "trans-del": if(el.dataset.ym){ mesAtual=el.dataset.ym; } delTrans(id); break;
    case "busca-toggle": if(busca){ busca=null; buscaAberta=false; } else buscaAberta=!buscaAberta; render(); break;
    case "busca-aplicar": aplicarBusca(); break;
    case "busca-rapida": buscaRapida(el.dataset.r); break;
    case "busca-limpar": busca=null; buscaAberta=false; render(); break;
    case "filtro": filtroGrupo=el.dataset.g; render(); break;
    case "fundo-add": modalFundo(null); break;
    case "fundo-edit": modalFundo(id); break;
    case "fundo-del": delFundo(id); break;
    case "mov-add": modalMov(id, el.dataset.tipo); break;
    case "mov-del": delMov(id); break;
    case "proj-add": modalProjeto(el.dataset.lista,null); break;
    case "proj-edit": modalProjeto(null,id); break;
    case "proj-aporte": modalAporte(id, Number(el.dataset.v)||""); break;
    case "proj-plano": projNoPlano(id); break;
    case "proj-toggle": { var rp=acharProj(id); if(rp){ rp.p.feito=!rp.p.feito; salvar(); render(); if(rp.p.feito) toast("🎉 "+rp.p.nome+" concluído!"); } break; }
    case "proj-del": { var rd=acharProj(id); if(rd && confirm("Eliminar o projeto \""+rd.p.nome+"\"?"+(juntadoProj(rd.p)>0?"\nO dinheiro adicionado ("+fmt(juntadoProj(rd.p))+") deixa de contar.":""))){ state.compras[rd.l]=state.compras[rd.l].filter(function(x){return x.id!==id;}); salvar(); render(); toast("Projeto eliminado."); } break; }
    case "proj-ap-del": { var ra=acharProj(id); if(ra && confirm("Remover este valor adicionado?")){ ra.p.aportes=ra.p.aportes.filter(function(x){return x.id!==el.dataset.ap;}); salvar(); modalProjeto(null,id); render(); } break; }
    case "rel-periodo": relPeriodo=el.dataset.p; render(); break;
    case "rel-modo": relModo=el.dataset.m; render(); break;
    case "rel-per-aplicar": var de=val("f_relDe"), ate=val("f_relAte"); if(!de||!ate){ toast("Escolhe os dois meses."); break; }
      if(mesesEntre(de,ate).length>60){ toast("Máximo de 60 meses."); break; } relDe=de<=ate?de:ate; relAte=de<=ate?ate:de; render(); break;
    case "rel-pdf": exportarRelatorioPDF(); break;
    case "export": exportar(); break;
    case "fs-escolher": fsEscolherPasta(); break;
    case "fs-retomar": fsRetomar(); break;
    case "fs-desligar": fsDesligar(); break;
    case "pdf-nome": modalNomePdf(); break;
    case "pdf-nome-padrao": { var fi=document.getElementById("f_nomePdf"); if(fi){ fi.value=NOME_PDF_PADRAO; fi.focus(); } break; }
    case "plano-confirmar": confirmarPlano(); break;
    case "lembrete-fazer": lembreteFazer(el.dataset.ym); break;
    case "lembrete-adiar": lembreteAdiar(); break;
    case "video-abrir": abrirVideo(id); break;
    case "vp-fechar": fecharVideo(); break;
    case "vp-pausa": pausaVideo(); break;
    case "vp-voz": vozVideo(); break;
    case "vp-seg": if(VP){ if(VP.fim) break; cenaVideo(VP.i+1); } break;
    case "vp-ant": if(VP){ VP.fim=false; VP.play=true; document.querySelector("#vp [data-act='vp-pausa']").textContent="❚❚"; cenaVideo(VP.i-1); } break;
    case "vp-acao": acaoVideo(); break;
    case "link-add": modalLink(); break;
    case "link-del": if(confirm("Remover este vídeo?")){ discEstado().links=discEstado().links.filter(function(x){return x.id!==id;}); salvar(); renderDisciplina(); } break;
    case "evo-sel": if(evoSel!==id){ evoSel=id; evoRitmo=null; } renderPoupanca(); setTimeout(function(){ var c=document.getElementById("evoCard"); if(c && c.getBoundingClientRect().top<0 || (c && c.getBoundingClientRect().top>innerHeight-200)) c.scrollIntoView({behavior:"smooth",block:"start"}); },60); break;
    case "evo-usar": { var fu=state.fundos.filter(function(x){return x.id===evoSel;})[0]; if(fu && evoRitmo!=null){ fu.planoMensal=evoRitmo; evoRitmo=null; salvar(); renderPoupanca(); toast("Plano mensal de "+fu.nome+" atualizado."); avisoGrupo("poupanca"); } break; }
    case "aloc-sobra": { var fs=porDistribuir(); if(fs>0) setAloc("poupanca",(Number(aloc().poupanca)||0)+fs); break; }
    case "aloc-resto": { var fr=porDistribuir(), gg=el.dataset.g; if(fr>0) setAloc(gg,(Number(aloc()[gg])||0)+fr); break; }
    case "tema-set": setTema(el.dataset.g); break;
    case "pin-set": modalPin("set"); break;
    case "pin-change": modalPin("change"); break;
    case "pin-off": modalPin("off"); break;
    case "pin-key": teclaPin(el.dataset.k); break;
    case "pin-forgot": esqueciPin(); break;
    case "pin-back": mostrarLock(); break;
    case "pin-restore": restaurarSemPin(); break;
    case "install": instalarApp(); break;
    case "baixar-app": baixarApp(); break;
    case "import": importar(); break;
    case "reset-mes": resetMes(); break;
  }
});
function segSel(el){ var tgt=el.dataset.target; el.parentElement.querySelectorAll(".sb").forEach(function(b){b.classList.remove("on");}); el.classList.add("on"); var h=document.getElementById(tgt); if(h) h.value=el.dataset.g; }
function desloca(ym,d){ var p=ym.split("-"); var dt=new Date(+p[0],(+p[1]-1)+d,1); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); }
function delReceita(id){ if(!confirm("Eliminar esta receita?"))return; M().receitas=M().receitas.filter(function(x){return x.id!==id;}); salvar();render();toast("Receita eliminada."); }
function delItem(id){ var oi=M().orcamento.filter(function(x){return x.id===id;})[0]; if(eAjudar(oi)){ toast("⚠ O campo “Ajudar outros” é obrigatório na Despesa Fixa. Pode pôr o valor a 0."); return; } if(!confirm("Eliminar este campo?"))return; M().orcamento=M().orcamento.filter(function(x){return x.id!==id;}); salvar();render();toast("Categoria eliminada."); }
function delTrans(id){ if(!confirm("Eliminar este gasto?"))return; M().transacoes=M().transacoes.filter(function(x){return x.id!==id;}); salvar();render();toast("Gasto eliminado."); }
function delFundo(id){ var f=state.fundos.filter(function(x){return x.id===id;})[0]; var saldo=f?saldoFundo(id):0;
  if(!confirm("Eliminar o fundo \""+(f?f.nome:"")+"\"?"+(saldo!==0?"\nTem um saldo de "+fmt(saldo)+" e os movimentos também serão apagados.":"")))return;
  state.fundos=state.fundos.filter(function(x){return x.id!==id;}); state.movPoupanca=state.movPoupanca.filter(function(m){return m.fundoId!==id;}); salvar();render();toast("Fundo eliminado."); }
function delMov(id){ if(!confirm("Eliminar este movimento?"))return; state.movPoupanca=state.movPoupanca.filter(function(x){return x.id!==id;}); salvar();render();toast("Movimento eliminado."); }
function resetMes(){ if(!confirm("Apagar receitas, plano e gastos de "+mesLabel(mesAtual)+"? (A poupança NÃO é afetada.)"))return; delete state.meses[mesAtual]; salvar();fecharSheet();render();toast("Mês reiniciado."); }

};
